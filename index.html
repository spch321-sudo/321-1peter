虔敬和犯罪的人將有何地可站呢？」（4:18）"],["p","「僅僅」不是說得救靠運氣，救恩穩如磐石。"],["p","它說的是那條路不容易，要穿過火。"],["p","然後，火煉的這一段，收在一個動作上。"],["q","「所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主。」（4:19）"],["p","「交與」原文 παρατιθέσθωσαν，是把貴重的東西寄放在可靠的人手裡。"],["p","在火裡的人，最想知道兩件事。他有能力嗎？他靠得住嗎？"],["p","造化之主：造你的那一位知道怎樣保守你。"],["p","信實的：他不會在火最熱的時候鬆手。"],["p","交託之後呢？要一心為善。"],["p","交託不是躺平，是照樣上班、照樣照顧家人。"],["p","弟兄姊妹，我們回到開始的那個問題。"],["q","如果信主要付代價——升遷、婚事、家人的諒解——你還信嗎？"],["p","彼得沒有說代價不存在。火是真的熱。"],["p","可是他給了我們三樣東西。"],["p","一個想法，可以當兵器穿上：這條路，我的主先走過。"],["p","一群人，帶著五顏六色的恩賜：你不必一個人扛。"],["p","還有一位靈，安安靜靜地歇在被罵的人身上。"],["p","可是不要只佩服彼得。"],["p","他睡著過，他否認過，他在炭火旁邊哭過。"],["p","他寫得出這一章，只因為主沒有放棄他。"],["p","所以，請你看那位主。"],["p","第十九節那個「交與」的字，你在別處聽過。"],["q","各各他，下午三點。遍地都黑了。"],["p","主在十字架上，用最後一口氣說："],["q","「父啊！我將我的靈魂交在你手裡。」（路 23:46）"],["p","這使我們想起：彼得請我們做的，主自己先做了。受苦難之後，是榮耀。"],["p","所以，尾牙桌上的你，除夕夜手停在半空中的你："],["p","你可以哭。你也可以把自己交出去，交給一位信實的造化之主。"],["p","然後，明天早上，照樣去行善。"],["p","因為你不是一個怪人。你是一個身上歇著榮耀的人。"],["q","「因為神榮耀的靈常住在你們身上。」（4:14）"],["p","我們一起低頭禱告。"]]},"5":{"min":18,"blocks":[["h","《你們要將一切的憂慮卸給神，因為他顧念你們》"],["p","弟兄姊妹平安，今天我們一起讀彼得前書最後一章，第五章。"],["p","有一句話，我相信你一定聽過，也許你自己也說過。"],["q","「你又在憂慮了。不是叫你把憂慮卸給神嗎？」"],["p","這句話本身沒有錯。它就是今天這一章的章題。"],["p","可是它常常被說成另外一個意思，而且是用一種皺著眉頭的口氣。"],["p","聽的人耳朵裡收到的，其實是這一句：基督徒不可以憂慮。這是聽錯了。"],["p","我想請你看一個畫面。"],["q","半夜一點，一間小公寓，廚房的燈還亮著。"],["p","一位姊妹坐在餐桌旁。媽媽的檢查報告放在桌上，下個月的房租還沒有著落。"],["p","她睡不著，心跳得很快。她已經這樣好幾個禮拜了。"],["p","她拿起手機，在小組群組裡打了一行字：請為我禱告，我好焦慮。"],["p","過了一會兒，有人回了一句。"],["q","「姊妹，要把憂慮卸給神，不要再憂慮了。」"],["p","回的人是好意。可是那一夜，她心裡多了一樣東西。"],["p","本來她只有焦慮。現在她多了一層罪疚：我連憂慮都憂慮錯了。"],["p","弟兄姊妹，如果「卸給神」被講成了一條新的規矩，憂慮就變成了另一個罪。"],["p","焦慮的人背上，又多壓了一塊石頭。"],["p","可是彼得的意思，正好相反。"],["p","他不是說：你不可以有憂慮。他說：你有憂慮，所以要卸。"],["p","他也不是說：你卸得好，神才顧念你。他說：他顧念你，所以你可以卸。"],["q","不是「不准有」，是「有了，就交給他」。"],["p","這一章有三個詞：牧，卸，立。"],["p","全卷五篇，望、石、福、火，走到今天最後一個字：牧。"],["p","我們今天走三步：作群羊的榜樣，以謙卑束腰，在這恩上站立得住。"],["p","它前面是一群長老，後面是一隻獅子。我們從前面開始。"],["q","第一步：作群羊的榜樣。"],["p","第四章剛說完，審判要從神的家起首。火煉的試驗臨到了全家。"],["p","一家人在火裡的時候，彼得第一個叮嚀的，是家裡帶頭的人。"],["q","「我這作長老、作基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人」（5:1）"],["p","請你聽他怎麼稱呼自己。"],["p","第一章第一節，他說自己是使徒。到了這裡，他說：同作長老的。"],["p","原文 συμπρεσβύτερος，整本新約只有這一次。前面加了一個「同」字。"],["p","教會裡最有份量的勸勉，常常不是「我命令你」，是「我和你一樣」。"],["p","他又說，自己是作基督受苦的見證。"],["p","他確實看見了。客西馬尼園，大祭司的院子——他看見主被綁、被打、被定罪。"],["p","可是那一夜，他也是在炭火旁邊，三次說不認得主的那個人。"],["p","看見了基督受苦，自己卻逃開了。這樣的人，還能說「我是見證」嗎？"],["p","能。不是因為彼得後來變好了，是因為主沒有放棄他。"],["p","十字架改變了他對榮耀的定義。榮耀不是繞過受苦，是穿過受苦。"],["q","「務要牧養在你們中間神的群羊」（5:2）"],["p","請你想一個畫面。加利利海邊，清晨，又是一堆炭火。"],["p","復活的主三次問他：你愛我嗎？然後對他說——"],["q","「你牧養我的羊。」（約 21:16）"],["p","「牧養」，和這裡用的是同一個字。"],["p","再聽四個字：神的群羊。"],["p","羊是神的，不是長老的。牧者不是主人，是管家。"],["p","接下來，彼得寫了三組「不是……乃是」。"],["p","這是全本新約裡，對屬靈領袖最具體的一張檢核表。"],["q","「不是出於勉強，乃是出於甘心」（5:2）"],["p","第一組問動機。被逼著服事的人，很快就會把怨氣倒在羊身上。"],["q","「也不是因為貪財，乃是出於樂意」（5:2）"],["p","第二組問錢。牧者可以得供養，但不可以把羊當成收入的來源。"],["q","「也不是轄制所託付你們的，乃是作群羊的榜樣。」（5:3）"],["p","第三組問權。「轄制」，原文 κατακυριεύοντες，就是在別人頭上作主子。"],["p","主耶穌講外邦君王操權管束人，用的是同一個字。然後主說：在你們中間，不可這樣。"],["p","轄制在今天長甚麼樣子？"],["p","用神的名要求人無條件服從，不准提問，公開羞辱人。"],["p","遇到這樣的處境，你可以提問，可以求助，也可以離開。這不違背聖經。"],["p","那麼，乃是甚麼？乃是作榜樣。"],["p","「榜樣」，原文 τύποι，是印模壓出來的那個形狀。"],["p","長老只是第一批照著主的腳印描字的人。"],["q","「到了牧長顯現的時候，你們必得那永不衰殘的榮耀冠冕。」（5:4）"],["p","上一節才說不可轄制，這一節馬上告訴長老：你們頭上還有一位。"],["p","「牧長」，原文 ἀρχιποίμενος，新約只有這一次。牧人之上的那一位牧人。"],["q","牧者頭上，還有牧長。"],["p","對在小教會、在異鄉、在沒人看見的地方默默服事的人，這句話是安慰。"],["p","他說，肯定要從牧長手裡來。"],["p","講完長老，彼得轉過身來，對全教會說話。"],["q","第二步：以謙卑束腰。"],["q","「你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服」（5:5）"],["p","這一節最常被讀錯的地方，是只讀前半句。"],["p","前半句對年輕人說。可是下半句，對象換成了「你們眾人」。"],["p","包括剛剛被勸勉的長老。方向也從單向，變成了「彼此」。"],["q","謙卑是長幼雙方的圍裙，不是只綁在年輕人身上的繩子。"],["p","年輕人要尊重年長者走過的路。年長者也要繫上圍裙，聽年輕人的問題。"],["p","所以這一節，不可以拿來堵住年輕同工的嘴。"],["p","「束腰」這個字，原文 ἐγκομβώσασθε，整本新約也只有這一次。"],["p","意思是把一件衣服打個結，繫在身上。同一個字根，指奴僕做工時的圍裙。"],["p","彼得沒有說，你們要有謙卑的感覺。他說，把謙卑像工作服一樣穿上。"],["p","寫這個字的時候，彼得心裡會不會浮現一個畫面？"],["q","耶路撒冷，一間樓房，最後的晚餐。"],["q","「就離席站起來，脫了衣服，拿一條手巾束腰」（約 13:4）"],["p","主蹲下來，一個一個洗門徒的腳。輪到彼得，他把腳縮回去。"],["q","「你永不可洗我的腳！」（約 13:8）"],["p","那時候他以為，謙卑就是不讓主服事他。"],["p","後來他才明白，謙卑是先讓主洗，然後去洗別人。"],["p","如今這個人寫信，叫全教會繫上的，正是那一條圍裙。"],["p","焦點不在彼得學會了甚麼，在那位先束上手巾的主。"],["p","然後彼得引了一句舊約。"],["q","「因為神阻擋驕傲的人，賜恩給謙卑的人。」（5:5）"],["p","這句話出自箴言。和合本的箴言照希伯來文，字句不太一樣。這是兩個版本，不是彼得引錯。"],["p","新約裡引這一句的，只有兩處：這裡，和雅各書第四章。"],["p","雅各書講這句話的時候，前面有一句「但他賜更多的恩典」。他的重點是：恩典比驕傲大。"],["p","彼得用它做的是另一件事。他的重點是：既然如此，就把謙卑穿上。"],["p","可是第五節還沒講完。下一句是「所以」。"],["q","「所以，你們要自卑，服在神大能的手下，到了時候，他必叫你們升高。」（5:6）"],["p","自卑，不是自我貶低，也不是逢人就說自己不行。"],["p","自卑是一個位置：在神大能的手底下。"],["p","被那隻手放低的人，不是被丟下，是被握住。"],["p","再聽「到了時候」四個字。雅各書講升高，沒有這四個字。彼得加上了。"],["p","那麼，怎樣自卑？"],["p","請你聽一件中文聽不出來的事。"],["p","第六節和第七節，在原文是同一個句子。"],["p","第七節開頭的「卸給」，原文 ἐπιρίψαντες，不是另一個命令，是掛在第六節底下的分詞。"],["p","意思是：你們要自卑——怎樣自卑呢？就是把一切的憂慮卸給他。"],["q","自卑的方式，就是把憂慮卸給神。"],["p","這個字在新約只出現兩次。另一次，是門徒把自己的衣服搭在驢駒上。"],["q","「你們要將一切的憂慮卸給神，因為他顧念你們。」（5:7）"],["p","為甚麼卸下憂慮，叫作謙卑？"],["p","因為驕傲不只抓住權力，也抓住重擔。"],["p","一個甚麼都要自己扛、睡不著也不肯交出去的人，外面看起來很負責。"],["p","裡面卻常常藏著一句話：這件事，沒有我就不行。那是另一種想代替神。"],["p","所以謙卑有兩個動作。把圍裙繫上，去服事人。把重擔卸下，讓神作神。"],["p","現在，我們回到半夜一點那張餐桌。"],["p","請你聽清楚：卸給神，不是說你不可以憂慮。"],["p","彼得在第一章就承認，讀者在百般的試煉中暫時憂愁。他沒有責備他們。"],["p","憂慮不是罪。焦慮的人不是信心不夠的人，這種說法是錯的。"],["p","憂慮是要被拋給神的東西，不是要被藏起來的羞恥。"],["p","卸給神，也不排斥看醫生、吃藥、接受心理諮商。"],["p","神的顧念，常常就是經由醫生、輔導、和一個願意陪你坐到天亮的朋友，臨到你身上。"],["p","還有，憂慮可能要一次又一次地拋。今天拋上去了，明天早上又撿回來。"],["p","那不是失敗。那是學習。再拋一次就是了。"],["p","然後是這一章的轉折：因為他顧念你們。"],["p","「顧念」這個字，彼得聽過。在一個很可怕的晚上。"],["q","加利利海，夜裡，風浪打進船艙。主在船尾睡著了。"],["p","門徒把他叫醒，喊出了一句話。彼得當時就在那條船上。"],["q","「夫子！我們喪命，你不顧嗎？」（可 4:38）"],["p","「你不顧嗎」的「顧」，和這裡「顧念」，原文是同一個字，μέλει。"],["p","許多年後，彼得用同一個字，回答了那天船上的問題。"],["q","他顧念。"],["p","主沒有在那天的船上把他們丟掉，也不會在今天的病房、帳單和失眠裡把你丟掉。"],["p","讀到這裡，我們才能認出 321 常說的一句話：謙卑是復興的鑰匙。"],["p","是經文自己告訴我們，謙卑長甚麼樣子。"],["p","不是更用力地證明自己。是承認自己扛不動，把一切交給那位顧念你的神。"],["p","可是彼得很誠實。卸下憂慮之後，接著出場的，是一隻獅子。"],["q","第三步：在這恩上站立得住。"],["q","「務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。」（5:8）"],["p","「警醒」這兩個字，彼得寫起來一定很痛。"],["p","客西馬尼園那一夜，他睡著了三次。主對他說：你們不能同我警醒片時嗎？"],["p","那一夜他沒有警醒，接著就在院子裡跌倒。"],["p","他知道打瞌睡的代價。他也知道，主怎樣接住跌倒的人。"],["p","「仇敵」，原文是法庭上的原告。魔鬼是一個控告者。"],["p","他要吞吃的，不只是性命，更是受苦的人的信心。"],["p","所以獅子接在「卸給神」後面出場。不肯卸下重擔的人，最容易被壓垮，也最容易落單。"],["p","不過，請你也聽清楚：這一節不是叫我們凡事都看成魔鬼搞的。"],["p","我也不打算用魔鬼來嚇你。彼得寫這一節，不是要我們更怕，是要我們更清醒。"],["q","「你們要用堅固的信心抵擋他」（5:9）"],["p","請你留意這個次序。先以謙卑束腰，先卸下憂慮，然後才抵擋。"],["p","然後彼得加了一句安慰。"],["q","「因為知道你們在世上的眾弟兄也是經歷這樣的苦難。」（5:9）"],["p","受苦的時候，最可怕的一句謊言是：只有你這樣。"],["p","你不是一個人在抵擋。"],["p","我們散在各國的團契也是這樣。不同的時區，抵擋的是同一隻獅子。"],["p","全卷地勢最低的地方，就是這隻吼叫的獅子。"],["p","可是最高的地方，只隔兩節。"],["q","「那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀，等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們。」（5:10）"],["p","吼叫的聲音很大。可是最後一句話，不是獅子說的。"],["p","請你回想，這封信一路說了多少個「你們要」。"],["p","一封講了五章「你們要」的信，到了這裡，主詞換了。"],["q","不是「你們要」，是「他必要」。"],["p","原文前面還加了一個字：他自己。親自。"],["p","再聽「暫受苦難」。這個「暫」字，和第一章「暫時憂愁」，原文是同一個字。"],["p","彼得沒有說苦難很小。被誤會、被冤屈、病床邊的長夜，都是真的痛。"],["p","他說，苦難有盡頭，榮耀沒有盡頭。"],["p","永恆的觀點，不是把苦難變小，是把盼望變大。"],["p","然後是一串動詞，每一個都是一幅圖畫。"],["p","「成全」，原文 καταρτίσει，是加利利漁夫補網的字。雅各和約翰在船上補網，就是這個字。"],["p","破了洞的網，主不丟掉，他坐下來一針一針補好，讓它再下水。"],["p","「堅固」，原文 στηρίξει。這個字，彼得最熟悉。"],["q","最後的晚餐那一夜。主轉向彼得，叫了他兩次名字。"],["q","「西門！西門！撒但想要得著你們，好篩你們像篩麥子一樣」（路 22:31）"],["q","「但我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","「堅固你的弟兄」的「堅固」，就是這裡的同一個字。"],["p","弟兄姊妹，你手上這封信，就是那個回頭的人，在堅固弟兄。"],["p","可是請你看清楚，他沒有說「我來堅固你們」。他說：神必要親自堅固你們。"],["p","不是彼得變強了。是主那一夜為他祈求的話，成就了。"],["p","原文其實還有第四個動詞，θεμελιώσει，立根基。和合本照另一些抄本，只譯了三個。"],["p","寄居的人在地上沒有自己的地基。神親自給他們打根基。"],["q","「願權能歸給他，直到永永遠遠。阿們！」（5:11）"],["p","然後，他託西拉帶信，交代最後幾句。"],["q","「又證明這恩是神的真恩。你們務要在這恩上站立得住。」（5:12）"],["p","請你聽：在這恩上站立得住。"],["p","寄居的人，在地上沒有自己的地。可是他們有一個可以站的地方。恩典。"],["p","寫這句話的人，曾經在大祭司的院子裡，連一個使女的問話都站不住。"],["q","「女子，我不認得他。」（路 22:57）"],["p","不是因為他自己站穩了，是因為那恩托住了他。"],["q","「在巴比倫與你們同蒙揀選的教會問你們安。我兒子馬可也問你們安。」（5:13）"],["p","巴比倫，最可能是指羅馬，帝國的中心。"],["p","可是請你不要把它對號入座到今天任何一個國家、城市或宗派。這是解經，不是時事評論。"],["p","神國的領土，不必先有一塊地。它先是一群人。"],["p","再看馬可。那個曾經跟著保羅出去宣教、卻半途回家的年輕人。"],["p","如今他在彼得身邊，被稱為「我兒子」。"],["p","一個跌倒過的年長者，帶起一個半途離開過的年輕人。"],["p","焦點不在彼得多會帶人，在主沒有放棄他們兩個。"],["p","弟兄姊妹，我們回到那張餐桌。"],["q","半夜一點，廚房的燈還亮著。手機螢幕上，還是那一行字。"],["p","如果今天有人要回她一句話，我盼望不是「你不要再憂慮了」。"],["p","第一句，是他顧念你。"],["q","「你們要將一切的憂慮卸給神，因為他顧念你們。」（5:7）"],["p","你不必先不憂慮，才能來。你有憂慮，所以來。"],["p","第二句，是他成全你。"],["p","暫受苦難之後，他必要親自成全你，堅固你，賜力量給你。"],["p","破了的網，他親自補。動搖的人，他親自堅固。沒有地基的人，他親自打根基。"],["p","第三句，才輪到我們。"],["p","你們務要在這恩上站立得住。"],["p","請你留意這個次序。先是他顧念，再是他成全，最後才是我們站立。"],["p","站立是回應，不是條件。我們站在恩上，是因為恩先托住了我們。"],["p","弟兄姊妹，今天你不需要更佩服彼得。"],["p","他自己就是那個在船上喊「你不顧嗎」、在院子裡站不住、被主找回來的人。"],["p","你只需要更認識那一位。在炭火旁找回他的那一位，也是今天顧念你的那一位。"],["p","所以，把你手上那一包，交給他吧。"],["q","因為他顧念你。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——寄居的、分散的人是誰？今天的寄居者在哪裡？","r":"1:1--2；1:17；2:11--12；4:3--4；5:13","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一與雅各書立場一（林前 ISS00_1、雅 ISS00_1），本卷補述：寄居、分散與巴比倫；處境是日常的邊緣化，不是國家逼迫。彼得前書開頭稱收信人是分散各地的寄居者，信末的最後一個地名是巴比倫——全封信從頭到尾都在異鄉。若不在開卷講定這群人是誰、受的是甚麼苦，全卷的受苦會被講成殉道英雄的傳奇，或被講成與今天無關的古代史；坐在席上那位因為不拿香而被全家冷眼的弟兄，就找不到自己在這封信裡的位置。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一與雅各書立場一，不重寫：使徒的書信是寫給特定地區、特定處境的教會；讀信的人要先找出作者的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：寄居的人遇到甚麼？彼得從福音推出甚麼原則？今天這原則落在哪裡？</p><p>本卷要補的是兩個字。彼得寫信「給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）。「分散」（διασπορά）原本是猶太人散居外邦的專有名詞；「寄居的」（παρεπίδημος）是暫住的外地人。第二章他再說一次：「你們是客旅，是寄居的」（2:11）；第一章他把這個身分延伸到一生：「就當存敬畏的心度你們在世寄居的日子」（1:17）。</p><p>可是這群人多數不是猶太人。彼得提到他們「從前蒙昧無知的時候那放縱私慾的樣子」（1:14），提到「祖宗所傳流虛妄的行為」（1:18），又說「往日隨從外邦人的心意行邪淫、惡慾、醉酒、荒宴、群飲，並可惡拜偶像的事，時候已經夠了」（4:3）。他們信主以後沒有搬家，鄰舍卻「見你們不與他們同奔那放蕩無度的路，就以為怪，毀謗你們」（4:4）。<strong>經文問的是：「寄居」說的是地理、社會地位，還是信主以後的新身分？他們受的是甚麼苦？今天的寄居者在哪裡？</strong></p>"],["離散猶太信徒說（收信人是散居外邦的猶太基督徒）","","<p>許多早期與宗教改革時期的註釋家，照 1:1「分散」這個字的本義，認為收信人是散居小亞細亞的猶太信徒；雅各書也寫給「散住十二個支派之人」（雅 1:1），而且彼得自己在加拉太書被稱為向受割禮之人傳道的使徒。這派的優點是重視字詞的舊約背景：彼得前書通篇用以色列的稱號稱呼教會——揀選、寄居、祭司、聖潔的國度、屬神的子民。</p><p><strong>難處：</strong>信中對收信人過去的描寫，很難用在猶太人身上——猶太人不會被說成承接了「祖宗所傳流虛妄的行為」（1:18），也不會被說成從前隨從「可惡拜偶像的事」（4:3）。2:10 引何西阿書說「你們從前算不得子民，現在卻作了神的子民」，最自然的對象正是外邦人。彼得把以色列的稱號用在他們身上，正是要說：你們這些原本不是子民的，現在被接進了神的子民裡。</p>"],["社會身分說（寄居者原本就是社會上沒有公民權的外來人口）","","<p>部分近代學者主張「寄居的」與「客旅」是法律與社會上的字：收信人很多原本就是沒有公民權、在城鄉之間流動的外來人口、僱工與家僕；教會給這群「無家的人」一個家——所以信裡特別多「家」的意象：「被建造成為靈宮」（2:5），「審判要從神的家起首」（4:17），還有「你們要互相款待，不發怨言」（4:9）。這派的優點是把信讀得很具體：家規裡對家僕說話（2:18），卻沒有對主人說話，正合這種處境。</p><p><strong>難處：</strong>彼得說他們是在信主以後才被看成怪人的（4:4）——他們成為外人，是因為不再同流，不只是因為原本的戶籍。1:17 又把「寄居」放在「在世寄居的日子」這個一生的框架裡，用在每一位信徒身上，包括那些有家有業的人。社會身分說抓住了一部分會眾的真實處境，卻不足以解釋全卷為甚麼把「寄居」當成所有信徒的稱號。</p>"],["純屬靈比喻說（寄居只是說地上的生命是暫時的，天上才是家）","","<p>這是講台上最常見的讀法：寄居就是「這世界不是我的家」，信徒是天路客，眼光要定睛在「不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業」（1:4）。希伯來書也說列祖「承認自己在世上是客旅，是寄居的」（來 11:13），保羅說「我們卻是天上的國民」（腓 3:20）。這派的優點是抓住了全卷「能壞的與不能壞的」那條對照：暫時的與永遠的。</p><p><strong>難處：</strong>若只講屬靈比喻，「寄居」很容易變成逃離——不管這個世界，等著被接走。可是彼得前書是新約裡最落地的一卷之一：它講政府、職場、婚姻、鄰舍的毀謗，要信徒「在外邦人中，應當品行端正」（2:12）。只講天上的家，會讓人忘了彼得要他們怎樣在地上的家族、市場與街坊裡活著；寄居的痛，也會被一句「反正這裡不是你的家」輕輕帶過。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一、雅各書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：彼得前書寫給小亞細亞北部五個地區的信徒，多數是外邦人；他們信主以後沒有搬家，卻成了自己家鄉裡的外人。這封信的處境不是國家逼迫，是日常的邊緣化——被誤會、被嘲笑、在家裡被施壓、在職場被冤枉。</strong></p><p>本講義把三派的觀察收在一起：「寄居」首先是一個身分，是神揀選時給的——1:1 原文把「被揀選的」和「寄居者」放在一起，在地上是外人，在神那裡是選民；這個身分在社會上的樣子，就是 4:4 那種被當成怪人的處境；它的終點，是天上存留的基業。開頭稱收信人是「分散」的寄居者，最後一個地名是巴比倫：「在巴比倫與你們同蒙揀選的教會問你們安」（5:13）。但最後一句話是「願平安歸與你們凡在基督裡的人」（5:14）——<strong>寄居的人真正的地址，是在基督裡。</strong>巴比倫採羅馬的代稱，不對號入座到今天的任何國家、城市或宗派（見 ISS00_7）。</p><p><strong>寄居不是逃離世界，是在世界裡活出另一個國的樣子。</strong>這使我們想起耶利米叫被擄到巴比倫的人「為那城求平安」（耶 29:7）。今天的寄居者，是在不信的家族裡不拿香、在應酬文化裡不喝酒、在職場裡不做假帳，因此被看成怪人的華人信徒；也是國度321空中團契散在世界各國、在異鄉工作讀書的弟兄姊妹——我們在地上有住址，在天上有戶籍。</p>"],["【四】這件事該不該影響你的信心","","<p>收信人是猶太人還是外邦人、「寄居」是社會身分還是屬靈比喻，這些討論不該動搖你的信心；三派都同意，這封信是寫給一群因為信主而和周圍格格不入的人。</p><p>但有一件事該問自己：<strong>我是不是為了不被當成怪人，把那個身分藏起來了？</strong>彼得沒有叫寄居的人躲起來，也沒有叫他們和鄰舍對抗；他叫他們好好活著，叫毀謗他們的人「因看見你們的好行為，便在鑒察的日子歸榮耀給神」（2:12）。被當成外人的孤單是真的，但彼得先告訴他們的，是他們在神那裡是誰：「惟有你們是被揀選的族類，是有君尊的祭司」（2:9）。外人的身分是暫時的，選民的身分是永遠的。</p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一、雅各書立場一——原則照守、落點隨處境。彼得前書寫給小亞細亞北部五地、多數是外邦人的信徒；他們信主後沒有搬家，卻成了家鄉裡的外人，處境是日常的邊緣化，不是國家逼迫。寄居不是逃離世界，是在世界裡活出另一個國的樣子；寄居者真正的地址是「在基督裡」。","care":"席上會有在不信的家族裡唯一信主的人——清明、拜拜、長輩喪禮時被罵不孝；有在異鄉打工、讀書、嫁到外地的弟兄姊妹，在當地是外人，回到家鄉也成了外人；有因為不做假帳、不收回扣而丟了升遷或生意的人。牧者先承認那份孤單是真的（1:6「暫時憂愁」），再陪他想：怎樣在家族裡用孝心表達信仰（參與追思、照顧長輩、為家人禱告），怎樣讓小組成為寄居者的家（4:9 互相款待）。不要說「你家人是撒但的工具」「是你不夠圓融才被排擠」「乾脆跟他們斷絕來往」；也不要把寄居講成看不起家鄉與本地文化，更不要把巴比倫套在他所住的國家身上。"},{"id":"ISS00_2","t":"受苦——為義受苦、因行善受苦、為基督的名受苦，與因作惡受苦怎樣分辨？","r":"1:6--7；2:19--21；3:14--17；4:12--19；5:9--10","ch":[],"why":"二、彼得分辨四種苦；受苦是暫時的，受苦的人可以憂愁、可以求助；受苦不等於忍受侵害——本講義的全卷立場之二（本卷新立；與希伯來書立場四相接）。「受苦」（πάσχω）在彼得前書出現十二次，是新約各卷之冠；全卷的公式是「基督受苦難，後來得榮耀」（1:11）。正因為講得多，這卷書也最容易被誤用：被用來叫受害者忍耐，被用來安慰其實是自作自受的人，被用來要求痛苦的人立刻歡喜。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>彼得一再對受苦的人說話：「你們就是為義受苦，也是有福的」（3:14）——那我該主動去求苦難嗎？「有火煉的試驗臨到你們，不要以為奇怪」（4:12）——我現在的苦，是神在懲罰我嗎？「若為作基督徒受苦，卻不要羞恥」（4:16）——我的苦算不算「為基督」？「倒要歡喜；因為你們是與基督一同受苦」（4:13）——我痛得歡喜不起來，是我屬靈有問題嗎？</p><p>先讓經文自己說話。<strong>彼得分辨四種苦</strong>：①因犯罪受苦——「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（2:20）；「你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦」（4:15）——這不是彼得要安慰的苦；②因行善受苦——「但你們若因行善受苦，能忍耐，這在神看是可喜愛的」（2:20）；③為義受苦（3:14）；④為基督的名受苦——「你們若為基督的名受辱罵，便是有福的」（4:14）。後三種是彼得要安慰的苦。還有一種他沒有分類、卻真實存在的：「在百般的試煉中暫時憂愁」（1:6）——生病、失去、不公平，不一定是「為」甚麼，神卻在其中煉淨信心（1:7）。<strong>經文問的是：苦從哪裡來？哪一種苦有應許？受苦的人該怎樣面對神、面對自己的眼淚？</strong></p>"],["懲罰說（苦難多半是神對罪的管教）","","<p>認為人受苦，大多是神在處理他生命裡的罪；所以受苦的時候第一件事是省察、認罪。這派抓住的經文是真的：彼得確實說有一種苦是因犯罪而來的（2:20；4:15），4:17 也說「審判要從神的家起首」。它的優點是嚴肅看待罪，不讓人把一切苦都推給環境。</p><p><strong>難處：</strong>彼得特地把因犯罪的苦和因行善的苦分開，正是不讓人把兩者混為一談；全卷他要安慰的，絕大多數是無辜的苦——「就忍受冤屈的苦楚」（2:19）。主耶穌也拒絕把瞎眼的人歸因於罪：「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。把懲罰說當成普遍原則，會叫無辜受苦的人在苦上再加一層罪疚，也讓旁人有理由不去陪他。</p>"],["煉淨說（苦難是神煉淨信心的爐）","","<p>多數福音派讀者的主要讀法：苦難是煉金的爐，「叫你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴」（1:7）；4:12「火煉的試驗」也是同一個意象。這派的優點是讓受苦有方向：苦不是白受的，神在其中做工，而且爐火有時限——「暫時憂愁」（1:6），「暫受苦難」（5:10）。</p><p><strong>難處：</strong>煉淨說若變成一句現成的答案，就會變成冷的安慰——在病床邊、喪禮上、剛被背叛的人面前說「這是神要煉淨你」，可能是真的，卻是在錯的時間說對的話。它也容易讓人以為每一個苦都要找出「神要教我甚麼」，找不到就自責。彼得自己在說煉淨之前，先說的是「你們是大有喜樂；但如今，在百般的試煉中暫時憂愁」（1:6）——他先承認憂愁。</p>"],["參與說（受苦是與基督一同受苦）","","<p>認為信徒的受苦，是走在基督先走過的路上：「因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行」（2:21）；「你們是與基督一同受苦」（4:13）。保羅也說要「曉得和他一同受苦」（腓 3:10）。這派的優點是讓受苦的人不孤單：苦不是被神遺棄的記號，而是與主同路的記號，而且公式的下半句是「後來得榮耀」（1:11）。</p><p><strong>難處：</strong>參與說若講過頭，會把一切苦——包括因自己犯錯、因別人侵害而來的苦——都講成「與基督一同受苦」，於是受害者被鼓勵留在傷害裡，犯錯的人也不必悔改。彼得用的是「為基督的名」「為作基督徒」（4:14、16），範圍是清楚的；而且基督的受苦有一部分是我們不能參與的——「義的代替不義的」（3:18），那是他一個人替我們受的。</p>"],["成功神學與追求殉道（兩個相反的極端）","","<p>成功神學認為信心夠的人就不會受苦，受苦表示信心出了問題；追求殉道則走到另一端，把受苦當成屬靈等級的證明，甚至主動去找苦——早期教會就有一些信徒自己跑去向官府投案，求被處死。兩者都有一點點經文的影子：前者引用應許，後者引用「為義受苦，也是有福的」（3:14）。</p><p><strong>難處：</strong>成功神學與整卷彼得前書正面衝突——全卷的公式就是「預先證明基督受苦難，後來得榮耀」（1:11），當年彼得自己說「主啊，萬不可如此！這事必不臨到你身上」（太 16:22），正是這種神學；本講義不採用（回指希伯來書立場四）。追求殉道也不採用：彼得說「神的旨意若是叫你們因行善受苦，總強如因行惡受苦」（3:17）——受苦是神允許的，不是我們去製造的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：受苦的分辨是牧養的第一步。</strong>不對任何受苦的人預設「你一定做錯了甚麼」；也不把因自己犯錯受的苦，講成「為主受苦」——4:15 已經把這兩種苦分開了。煉淨說與參與說都是真的，但它們是給受苦的人的盼望，不是旁人拿來解釋別人的公式。</p><p><strong>受苦是暫時的</strong>：兩個「暫時」（1:6 的「暫時憂愁」與 5:10 的「暫受苦難」）把苦框住——永恆的觀點不是把苦難變小，是把盼望變大。<strong>受苦的人可以憂愁、可以哭、可以求助</strong>：1:6 的憂愁與 4:13 的歡喜同時成立，歡喜是一個方向，不是一張要戴上的面具；「不要以為奇怪」（4:12）不是說不痛，是說不意外。「你們要將一切的憂慮卸給神，因為他顧念你們」（5:7）承認人會憂慮；卸給神與看醫生、尋求心理諮商並行。憂鬱、焦慮與心理疾病不是信心不夠。</p><p><strong>受苦不等於忍受侵害</strong>：被暴力、虐待、性侵、欺壓的人，離開危險、尋求法律與專業協助，不違背「跟隨他的腳蹤行」（2:21）——主耶穌自己也曾躲避：「耶穌卻躲藏，從殿裡出去了」（約 8:59）；保羅也用羅馬公民權保護自己：「人是羅馬人，又沒有定罪，你們就鞭打他，有這個例嗎？」（徒 22:25）。2:24「因他受的鞭傷，你們便得了醫治」的上下文是罪——「使我們既然在罪上死，就得以在義上活」（2:24），不保證身體的醫治（疾病與醫治回指雅各書立場四）。321 的落點：得勝不是不受苦，是受苦的時候仍然跟著那串腳印走；而那串腳印的終點是榮耀（5:10）。</p>"],["【四】這件事該不該影響你的信心","","<p>苦難從哪裡來、神為甚麼允許，這些神學辯論不該動搖你的信心——兩千年來最愛主的人也沒有完全答完。彼得自己也沒有給受苦的人一套解釋，他給的是一個人：「那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主」（4:19）。</p><p>但有一件事該問：<strong>我在受苦的時候，是更靠近他，還是更遠離他？</strong>你不是一個人在受苦——「因為知道你們在世上的眾弟兄也是經歷這樣的苦難」（5:9）；你也不是一直會這樣苦下去——「等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們」（5:10）。一封講了五章「你們要」的信，最後一句是「他必要」。</p>"]],"con":[],"say":"本講義的全卷立場：彼得分辨四種苦——因犯罪受苦不是他要安慰的；因行善、為義、為基督的名受苦，還有百般的試煉，是他要安慰的。受苦是暫時的；受苦的人可以憂愁、可以求助，歡喜是方向不是面具；受苦不等於忍受侵害。","care":"牧養底線：不在喪禮、病床邊、剛離婚的人面前說「這是神要煉淨你」——那可能是真的，但先陪伴，再講道理，很多時候不必講。不把受害者的苦講成「為主受苦」來要求他忍耐，也不把加害者被追究責任的苦講成「為義受苦」。席上會有長期病痛的人、憂鬱症的人、在家裡或職場被欺壓的人，也有因自己犯錯正在承擔後果的人；不要說「你受苦一定有原因」「要喜樂，不要哭」「卸給神就不用看醫生」。憂鬱與焦慮若伴隨失眠、無望或自傷的念頭，會後單獨關心，協助就醫與專業協助。也要讓會眾因這一題更記念在世上受逼迫的眾弟兄（5:9），不只更會解釋自己的苦。"},{"id":"ISS00_3","t":"順服——政府、職場、婚姻：順服的理由是甚麼？界線在哪裡？","r":"2:13--3:7；5:5","ch":[],"why":"三、一切順服都是「為主的緣故」：理由是主，界線也是主；順服不等於同意、沉默或留在危險裡；講 3:1–6 必講 3:7——本講義的全卷立場之三（本卷新立）。2:13–3:7 是新約三段家規之一，也是全卷最需要牧養智慧的一段：它曾被用來為奴隸制辯護、被用來叫受暴的妻子回到家裡、被用來要求信徒對任何政權都閉口。會眾席上正有人在不公義的老闆底下、在不信又控制人的配偶身邊，這一題必須講清楚。","pos":[["【一】經文問的是甚麼","","<p>彼得的家規有四個與眾不同的地方：它從政府開始（2:13–17），不從家庭開始；它對家僕說話，卻沒有對主人說話；它對妻子說了六節，對丈夫只說一節（3:1–6↔3:7）；特別考慮到不信的上位者——「就是那乖僻的也要順服」（2:18），「若有不信從道理的丈夫」（3:1）。它特別寫給身處不信者權力之下的信徒，教他們怎樣生存與見證。</p><p>於是會眾會問：「你們為主的緣故，要順服人的一切制度」（2:13）——政府叫我做違背良心的事，怎麼辦？老闆霸凌、性騷擾、拖欠薪水，我也只能默默承受嗎？丈夫打我、控制我，也要順服嗎？「因她比你軟弱」（3:7）——女人比較軟弱嗎？<strong>經文問的是：順服的理由是甚麼？界線在哪裡？順服和同意、沉默、留在危險裡，是不是同一件事？</strong></p>"],["神設立的秩序說","","<p>認為順服是神為社會與家庭設立的永久秩序，上位者的權柄來自神——「在上有權柄的，人人當順服他」（羅 13:1）。傳統保守派與部分互補派這樣讀。這派的優點是嚴肅看待經文的命令，不把不舒服的經文一律推給「文化背景」，也提醒信徒秩序本身是神的恩典。</p><p><strong>難處：</strong>若把順服講成無條件的，就和彼得自己的話衝突——當公會禁止他傳道，他說「順從神，不順從人，是應當的」（徒 5:29）。2:13 的「為主的緣故」本身就設了界線；而且彼得在 2:19 明說乖僻主人加給家僕的是「冤屈」。把現存的一切權力結構都等同神的秩序，就會像過去有些教會那樣，用這段經文為奴隸制辯護。</p>"],["互補說","","<p>多數福音派互補派的讀法：男女在神面前同等尊嚴，同是「一同承受生命之恩的」（3:7），在婚姻裡角色不同；丈夫的帶領是捨己的服事，妻子的順服是自願的回應，不是被迫的服從。這派的優點是同時守住平等的尊嚴與經文的字句，也特別強調 3:7 對丈夫的要求一樣是命令。</p><p><strong>難處：</strong>互補說在實際的教會生活中，有時只留下「妻子要順服」，丟掉了「丈夫要敬重」；「角色不同」也可能被濫用成「丈夫說了算」。而且 3:1--2 的處境是不信的丈夫，套用到基督徒家庭時要分辨，小心不要把經文沒有說的事讀進去。</p>"],["平等說","","<p>福音派平等派的讀法：新約的方向是彼此順服——「就是你們眾人也都要以謙卑束腰，彼此順服」（5:5）；家規是在當時父權文化中的宣教智慧，不是永久的階級。保羅說「並不分猶太人、希臘人，自主的、為奴的，或男或女」（加 3:28），教會後來廢除奴隸制，正是順著福音的方向走；男女關係也應該照同一個方向。</p><p><strong>難處：</strong>彼得在 3:5–6 用了撒拉的例子，不只是講策略；平等說若處理得太快，容易把經文中難的部分一筆帶過。也有人擔心，若家規的每一條都可以用「文化」解釋，其他經文也會被同樣處理。平等說需要說清楚：哪些是經文的方向，哪些是當時的形式。</p>"],["宣教策略說與溫和的抵抗說","","<p>宣教策略說是許多註釋家（不論互補或平等）共同的觀察：順服的目的寫在經文裡——「因為神的旨意原是要你們行善，可以堵住那糊塗無知人的口」（2:15）；不信的丈夫「也可以因妻子的品行被感化過來」（3:1）。在異教社會中，不給福音添不必要的絆腳石。溫和的抵抗說（部分近代學者）則指出：妻子信了丈夫不信的主，在當時已經是不順從社會規範；「不因恐嚇而害怕」（3:6）——彼得在順服的外殼裡，保護了良心的自由。</p><p><strong>難處：</strong>宣教策略說若只剩策略，順服就成了手段，不再是「為主的緣故」；溫和的抵抗說則可能把彼得讀得太現代，好像他在暗中鼓勵反抗。兩者都需要回到 2:13 的那個理由——順服是因為主，不是因為它有用，也不是因為它可以拿來抵抗。</p>"],["對政府與奴隸制的幾種讀法","","<p>對政府，有三種讀法：順服說（羅 13:1–7，一般情況下守法、納稅、尊敬）；有限順服說——徒 5:29，以及但以理的三個朋友說的「即或不然」（但 3:18）；公民不服從——在極端不義時，以非暴力的方式拒絕不義的法律，並承擔後果。對奴隸制：新約沒有為奴隸制背書，保羅說「若能以自由，就求自由更好」（林前 7:21），提前 1:10 把搶人口的列為罪，福音的方向是解放。</p><p><strong>難處：</strong>順服說若不設界線，教會會變成任何政權的傳聲筒；公民不服從若沒有 3:15–17 的溫柔與敬畏，很容易變成以惡報惡。而且有人會問：既然奴隸制是錯的，彼得為甚麼還叫家僕順服？答案在 2:19–25——他沒有說這是對的，他說這是冤屈，基督也被這樣對待過，你們的靈魂有牧人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：一切順服都是「為主的緣故」——理由是主，界線也是主。順服是回到本位，不是放棄人格；順服不等於同意、不等於沉默、不等於留在危險裡。</strong>「你們雖是自由的，卻不可藉著自由遮蓋惡毒，總要作神的僕人」（2:16）——順服的人是自由人，不是任何人的財產、出氣筒或附屬品。</p><p><strong>人身安全優先</strong>：家暴、性侵、虐待兒童、嚴重的精神控制，先保護生命，依法求助、通報；教會要陪伴受害者，不是勸他回去——「不因恐嚇而害怕」（3:6）就是彼得的界線。<strong>職場</strong>：基督徒員工誠實、盡責、不以惡報惡；同時，使用勞動法、申訴管道、離職的自由，不違背 2:18；冤屈就是冤屈，教會不為違法的老闆找屬靈的理由（回指雅各書立場三）。<strong>婚姻</strong>：互補派與平等派都是弟兄姊妹，本講義不裁判；但兩派都必須同意：3:1–6 與 3:7 同樣是命令——「與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙」（3:7）；「軟弱的器皿」指的不是智力、靈性或價值。<strong>政府</strong>：尊敬在上掌權的、納稅、為他們禱告——「為君王和一切在位的，也該如此」（提前 2:2）；2:17 只「敬畏神」，對君王是「尊敬」；當兩者衝突，徒 5:29。講台不點名政黨與政治人物，不作政治動員，也不為任何政權背書。</p><p>321 的落點：驕傲是離開本位抓住權力；謙卑是放下權力回到本位。彼得前書的順服，是對在下的人說：你不必用惡來奪回權力，因為真正的王已經坐在寶座上——「耶穌已經進入天堂，在神的右邊」（3:22）；也是對在上的人說：你的權力只到「為主的緣故」為止，超過了，就是 5:3 說的轄制。但回到本位不是留在被傷害的位置上——人的本位是神的兒女。</p>"],["【四】這件事該不該影響你的信心","","<p>互補與平等之爭、政教關係的派別之爭，不該動搖你的信心；在這些事上持不同看法的，都是一同承受生命之恩的弟兄姊妹。</p><p>但有兩件事該問：<strong>我在別人之下的時候，是用惡回應，還是交託那按公義審判的？</strong>主耶穌「被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主」（2:23）——交託不是假裝沒事，也不排除求助，而是不讓報復成為我的主人。<strong>我在別人之上的時候——在家裡、在公司、在教會——是轄制，還是作榜樣？</strong>家規的最後一句，是對有權柄的人說的。</p>"]],"con":[],"say":"本講義的全卷立場：一切順服都是「為主的緣故」——理由是主，界線也是主；順服是回到本位，不是放棄人格，不等於同意、沉默或留在危險裡。講 3:1–6 必講 3:7，講 2:18 必講 2:19 的冤屈；人身安全優先，依法求助、通報。","care":"牧養底線：不在講台、小組、婚前輔導中用 3:1–6 叫受暴力的妻子回去「用品行感化他」，也不說「你要檢討自己哪裡沒有順服好」。涉及家暴、性侵、兒少保護的事件，教會同工先保護安全、依法通報，不在教會內私了；不要求受害者原諒或和好作為留在教會的條件（回指雅各書立場三）。席上會有被丈夫控制的姊妹、被欠薪的移工、被主管霸凌的年輕人，也會有在不同政治立場之間被撕裂的家庭；不要說「順服就對了」「申訴就是沒有見證」。也不用 3:3 規定女性衣著，不把 3:7「軟弱」講成女性比較不屬靈。"},{"id":"ISS00_4","t":"基督的得勝宣告：「在監獄裡的靈」是誰？死人還能聽福音嗎？洗禮能救人嗎？","r":"3:18--22；4:5--6","ch":[],"why":"四、3:19 主要讀法：復活的基督向墮落天使宣告得勝；4:6 福音曾傳給現在已死的人；不教死後第二次機會、不斷定亡者；救人的是復活的基督，洗禮是向神的回應——本講義的全卷立場之四（本卷新立）。3:18–22 是新約最難解的一段之一，連路德都說這是新約裡最難懂的經文；它又正好碰到會眾最痛的問題：沒信主就過世的家人在哪裡？沒有受洗能得救嗎？這一題必須講定，免得各章各說各話。","pos":[["【一】經文問的是甚麼","","<p>「他藉這靈曾去傳道給那些在監獄裡的靈聽，就是那從前在挪亞預備方舟、神容忍等待的時候，不信從的人」（3:19–20）。五個問題疊在一起：①「藉這靈」是指聖靈、指復活的狀態，還是只是「在那時」？②「去」是往下到陰間，還是往上升天？③「傳道」（ἐκήρυξεν）是傳福音，還是宣告得勝或審判？④「在監獄裡的靈」是死去的人，還是墮落的天使？⑤時間是基督受死與復活之間、復活升天時，還是挪亞的時代？</p><p>接著還有兩處：「就是死人也曾有福音傳給他們」（4:6）——人離世以後還能信主嗎？「這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們」（3:21）——洗禮能救人嗎？沒有受洗能得救嗎？先讓經文自己說：3:18–22 是一條得勝的路線——受死（3:18）、復活（3:18）、宣告（3:19）、洗禮（3:21）、升天坐在神右邊，「眾天使和有權柄的，並有能力的，都服從了他」（3:22）。<strong>經文問的是：基督向誰宣告了甚麼？這對受苦的人有甚麼意義？</strong></p>"],["藉挪亞傳道說","","<p>認為先存的基督在挪亞的時代，藉著聖靈、藉著挪亞，向當時的人傳悔改的道；那些人不信，現在「在監獄裡」。奧古斯丁與許多改革宗註釋採這個讀法。彼後 2:5 稱挪亞是「傳義道的」，1:11 也說「在他們心裡基督的靈」曾在先知裡說話，可見基督藉著舊約的人說話是彼得熟悉的想法。這個讀法保護的是：不教死後第二次機會。</p><p><strong>難處：</strong>上下文的次序是「按著靈性說，他復活了」（3:18）之後，才說「他藉這靈曾去傳道」（3:19），看起來是在復活之後的事；而且新約用「靈」（πνεύματα）單獨指人，幾乎都要加說明，在這裡卻沒有。把這一節讀成挪亞時代的事，3:19 就跟前後兩節的得勝路線接不起來。</p>"],["下到陰間傳福音說（本講義不採用的第二次機會說）","","<p>認為基督在死與復活之間下到陰間，向挪亞時代死去的人傳福音，給他們悔改的機會；部分早期教父（亞歷山大的革利免、俄利根）這樣讀，再配上 4:6「死人也曾有福音傳給他們」。這個讀法背後是一份很深的關懷：那些沒有機會聽福音就死去的人怎麼辦？它也呼應了「不願有一人沉淪，乃願人人都悔改」（彼後 3:9）的神的心腸。</p><p><strong>難處：</strong>經文沒有說他們悔改了，也沒有說他們得救了；「傳道」這個字本身可以是宣告，不一定是邀請。若讀成死後還有機會，就不是新約一貫的催促了——「現在正是拯救的日子」（林後 6:2）。而且這個讀法只提挪亞時代的人，若要推成普遍原則，更沒有根據。本講義不採用，也不教導死後第二次機會。</p>"],["下到陰間宣告得勝說","","<p>認為基督在死與復活之間「降在陰間」（使徒信經），不是去傳第二次的福音，而是向那裡的靈宣告他的得勝，有的傳統還加上帶出舊約的聖徒。天主教、東正教與路德宗的部分傳統這樣讀。這個讀法保護的是：基督的勝利是全面的，連死亡與陰間都在他的權下——這使我們想起主對彼得說的「陰間的權柄不能勝過他」（太 16:18）。</p><p><strong>難處：</strong>彼得在 3:18 說基督是「按著靈性」復活之後才去的，時間上不太像受死與復活之間；「去」（πορευθείς）在 3:22 又用了一次，是「進入天堂」——往上，不是往下。而且這個讀法容易讓人去描繪陰間的地圖，經文說得少的地方，我們不該說得多。</p>"],["向墮落天使宣告得勝說與綜合說","","<p>多數近代福音派註釋的讀法：「靈」在新約多指靈界的存在；「監獄」指被拘禁的墮落天使——這使我們想起彼後 2:4 說犯罪的天使被「交在黑暗坑中，等候審判」、猶 6 與創 6:1–4；猶太傳統把挪亞時代的悖逆和這些靈連在一起。基督復活升天的時候，向他們宣告他的得勝，3:22「都服從了他」就是這個宣告的結果。綜合說再加一句：3:19 是向邪靈宣告，4:6 則另指福音曾傳給現在已死的人。</p><p><strong>難處：</strong>這個讀法依賴猶太文獻（以諾書）的背景，一般會眾不熟悉，講台上要小心不要變成講神話；「傳道」解作「宣告」雖然可以，但字的常見用法是傳福音。它的長處在上下文：一條從十字架走到寶座的路線，監獄裡的靈聽見的，是勝利的宣告，不是第二次的邀請。</p>"],["4:6 的三種讀法與洗禮的四種理解","","<p>4:6「就是死人也曾有福音傳給他們，要叫他們的肉體按著人受審判，他們的靈性卻靠神活著」有三種讀法：①福音曾傳給現在已經死了的人——在他們還活著的時候（多數福音派；上文 4:4–5 正說到毀謗信徒的人「必在那將要審判活人死人的主面前交帳」）；②死後聽福音；③「死人」指屬靈上死的人（少數）。第二種的難處同上；第三種的難處是 4:5 的「死人」明明是肉身死了的人。</p><p>洗禮則有四種理解：聖禮說（洗禮是恩典的施行；天主教、東正教、路德宗）；記號與印記說（改革宗，恩約的記號，施行嬰兒洗）；信徒的見證說（浸信會與許多自由教會，信徒受浸是順服的見證）；以及重生在洗禮中說（部分復原運動〔基督教會／基督門徒會〕的傳統，認為受浸是罪得赦免、重生的時刻）。<strong>難處：</strong>聖禮說若講過頭，易被誤為儀式自動生效；記號與印記說明確否認水本身有功效，但印記的效力不易說清；見證說若講過頭，會把洗禮講成可有可無的儀式；重生在洗禮中說則難以解釋未受浸而得救的人（如路 23:43 的強盜），也容易把信心與受浸綁成條件。彼得自己說：「這洗禮本不在乎除掉肉體的污穢，只求在神面前有無虧的良心」（3:21）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:19 的主要讀法是復活升天的基督向墮落天使宣告得勝，並陳藉挪亞傳道說與下到陰間宣告得勝說，不嘲諷任何一種；4:6 採「福音曾傳給現在已死的人——在他們活著的時候」。</strong>理由是上下文：3:18–22 是一條從十字架到寶座的得勝路線。挪亞的日子是一個少數得救的例子——「藉著水得救的不多，只有八個人」（3:20）；收信的人也是少數，神的忍耐卻等了很久。</p><p><strong>不教導死後第二次機會；也不對任何亡者下斷語，特別是未信主的家人。</strong>經文並不說人死後還有機會，也不說某一個人一定在哪裡。我們不知道人在最後一刻與神之間發生了甚麼；我們知道神是公義的，也是滿有憐憫的（哀傷與亡者回指帖撒羅尼迦前書立場三）。</p><p><strong>洗禮：救人的是基督，不是水——「藉著耶穌基督復活也拯救你們」（3:21）；洗禮是人向神的回應與承諾（ἐπερώτημα）。但洗禮不是可有可無：主吩咐了，我們就順服——「奉父、子、聖靈的名給他們施洗」（太 28:19）。</strong>本講義不在嬰兒洗與信徒浸之間裁判；不說「沒受洗不能得救」——這使我們想起十字架上的強盜，主對他說「今日你要同我在樂園裡了」（路 23:43）；也不說受了洗就一定得救。321 的落點：無己戰勝撒但——戰勝撒但的不是我們的屬靈能力，是基督已經完成的得勝；我們的爭戰，是站在他的得勝裡（5:9；屬靈爭戰回指以弗所書立場四）。</p>"],["【四】這件事該不該影響你的信心","","<p>3:19 的五種讀法、4:6 的三種讀法、洗禮的方式，不該動搖你的信心——各宗派有不同的理解，都是弟兄。連彼得自己都把這一段寫得很簡短，我們不必比經文說得更多。</p><p>但有一件事該抓住：<strong>3:19 最重要的不是「誰在監獄裡」，是「誰是得勝者」</strong>——「眾天使和有權柄的，並有能力的，都服從了他」（3:22）。這是每一個在家裡、職場、社會裡受苦的人可以站的地方：那位「義的代替不義的，為要引我們到神面前」（3:18）的，已經坐在寶座上了。</p>"]],"con":[],"say":"本講義的全卷立場：3:19 主要讀法是復活升天的基督向墮落天使宣告得勝，並陳其他讀法；4:6 指福音曾傳給現在已死的人——在他們活著的時候。不教死後第二次機會，不斷定任何亡者的去處；救人的是復活的基督，不是水，洗禮是向神的回應，主吩咐了我們就順服。","care":"牧養底線：在喪禮與追思禮拜上，不要用 3:19、4:6 給未信的亡者「死後還有機會」的盼望，也不宣判他的去處；陪伴家屬，把亡者交在神手裡——神是公義的，也是滿有憐憫的。席上會有父母沒信主就過世、天天在心裡問「他在哪裡」的人，不要說「他已經沉淪了」，也不要為了安慰說出經文沒有說的話；陪他哀哭，帶他看見神的心腸（彼後 3:9），並把這份痛轉成為還活著的家人禱告。不用 3:21 讓未受洗的初信者懷疑自己的得救，也不讓已受洗卻沒有生命的人以為洗禮是保險；不描繪陰間的地圖——經文說得少的地方，我們也說得少。"},{"id":"ISS00_5","t":"長老、牧養與屬靈權柄——長老的權柄從哪裡來？甚麼樣的領導已經是「轄制」？","r":"5:1--5；4:8","ch":[],"why":"五、長老的三組「不是……乃是」；牧者頭上還有牧長；年幼與年長都要以謙卑束腰；4:8 的遮掩不是隱瞞——沿用希伯來書立場五（來 ISS00_5），本卷補新。寫這段話的人，曾經被主問了三次「你愛我嗎」，然後被託付「你牧養我的羊」；如今他把同一個託付交給各地的長老。5:5「年幼的，也要順服年長的」與 4:8「愛能遮掩許多的罪」，在華人教會常被用來壓下提問與掩蓋傷害，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>彼得這樣介紹自己：「我這作長老、作基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人」（5:1）。使徒稱自己是「同作長老的」，不是「在你們之上的」。接著是三組「不是……乃是」：「不是出於勉強，乃是出於甘心；也不是因為貪財，乃是出於樂意」（5:2）；「也不是轄制所託付你們的，乃是作群羊的榜樣」（5:3）。然後他提醒長老頭上還有一位：「到了牧長顯現的時候，你們必得那永不衰殘的榮耀冠冕」（5:4）。</p><p>下一節卻說：「你們年幼的，也要順服年長的」（5:5）；前一章又說：「最要緊的是彼此切實相愛，因為愛能遮掩許多的罪」（4:8）。<strong>經文問的是：長老的權柄從哪裡來、界線在哪裡？年輕人一定要閉口嗎？教會裡出了事，「遮掩」是甚麼意思？甚麼樣的領導已經變成「轄制」？</strong></p>"],["職分權柄說（長老的權柄來自職分，會眾當順服）","","<p>認為神在教會中設立職分，長老與牧者的權柄來自神的設立；會眾的責任是依從——「你們要依從那些引導你們的，且要順服；因他們為你們的靈魂時刻警醒，好像那將來交帳的人」（來 13:17）。這派的優點是保護教會的秩序，提醒信徒屬靈的群體需要有人負責，不能人人各行其是；5:5「年幼的，也要順服年長的」也確實是命令。</p><p><strong>難處：</strong>若只講職分的權柄，就會漏掉彼得這段話的重心——他用了整整兩節講長老「不是」甚麼，而且用了一個很重的字：「轄制」（κατακυριεύοντες，在頭上作主）。主耶穌說外邦人的君王這樣操權，「只是在你們中間，不可這樣」（太 20:26）。把職分講成絕對的權柄，正是把主禁止的事帶進了教會。</p>"],["反權柄說（一切屬靈權柄都可疑，信徒皆祭司）","","<p>受過教會傷害的人，或強調個人與神直接關係的人，常走到另一端：既然每一位信徒都是「有君尊的祭司」（2:9），就不需要長老與牧者；任何人說「我是你的屬靈遮蓋」都要提防。這派的優點是誠實面對屬靈虐待的真實，也守住了 2:9 的真理：每一個信徒都可以直接到神面前。</p><p><strong>難處：</strong>2:9 的祭司是「你們」——一個群體，不是一群各自獨立的個人；彼得在同一封信裡設立長老、吩咐牧養，也要「各人要照所得的恩賜彼此服事」（4:10）。因為有人轄制就廢掉牧養，並不能醫治傷害；被傷過的羊最需要的，是一位真正的牧人，而不是沒有牧人。</p>"],["僕人牧者說（權柄的形狀是榜樣）","","<p>認為長老的權柄是真實的，但它的形狀不是命令，是榜樣——「乃是作群羊的榜樣」（5:3）；「榜樣」（τύποι）是可以照著印出來的模子。主耶穌自己「拿一條手巾束腰」（約 13:4）洗門徒的腳，彼得在 5:5 說「都要以謙卑束腰」，用的正是把奴僕圍裙繫上的字。這派的優點是守住了權柄，也守住了權柄的方向：往下服事。</p><p><strong>難處：</strong>僕人領袖說若只是口號，會變成一種更難辨認的控制——嘴上說「我只是服事你們」，實際上不容許任何人提問。而且「榜樣」必須有人看得見，需要透明的財務、可被問責的決策、群體的監督；沒有這些，「僕人領袖」就只是好聽的名字。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用希伯來書立場五——順服是對為你靈魂警醒、將來要交帳之人的信任，不是絕對服從；不順服違背聖經、要求犯罪、控制人生、掩蓋虐待的命令。本卷補三段：</strong></p><p>①<strong>長老的三組「不是……乃是」</strong>：不是出於勉強，乃是出於甘心；不是因為貪財，乃是出於樂意；不是轄制，乃是作榜樣——這是全本新約對屬靈領袖最具體的一張檢核表。②<strong>長老也是被牧養的</strong>：彼得稱自己是「同作長老的」（5:1），稱基督是「牧長」（5:4）；牧者頭上還有一位牧長，牧者要向他交帳。那個在炭火旁三次不認主的人，被主重新接回來，聽見的是「你牧養我的羊」（約 21:16）——牧養的權柄是恩典給的，不是功勞換的。③<strong>5:5 前後兩句放在同一節</strong>：「你們年幼的，也要順服年長的」，接著是「就是你們眾人也都要以謙卑束腰，彼此順服」（5:5）——謙卑是長幼雙方的圍裙，不是只綁在年輕人身上的繩子。</p><p><strong>屬靈虐待的辨認</strong>：以神之名要求領袖說了算、不准提問、羞辱或公開指責、控制私人生活與財務、以「屬靈」為理由隔離人與家人朋友、把領袖的意見等同神的旨意——這些都不是牧養，是 5:3 的「轄制」。遇到這些，會友可以提問、可以求助、可以離開，不違背 5:5。<strong>4:8 的遮掩</strong>是不揭人的瘡疤、不一再翻出已悔改的過犯，不是隱瞞侵害、不讓受害者說話、不讓該負責的人負責。</p>"],["【四】這件事該不該影響你的信心","","<p>長老制、會眾制、主教制的教會體制之爭，不該動搖你的信心；彼得沒有在這封信裡規定體制，他規定的是心態。如果你曾經在教會被權柄傷過，那個傷害是真的，但傷你的是人錯用了權柄，不是那位牧長。</p><p>有一件事該問：<strong>我所跟隨的人，是把我帶到他自己面前，還是帶到牧長面前？</strong>而如果你是帶領人的：<strong>我是在作榜樣，還是在作主？</strong>彼得說羊群是「在你們中間神的群羊」（5:2），不是牧者的羊；主耶穌是「你們靈魂的牧人監督」（2:25），每一個牧者都要在他面前交帳。</p>"]],"con":[],"say":"本講義的全卷立場：沿用希伯來書立場五——順服是信任，不是絕對服從。本卷補三段：長老的三組「不是……乃是」（不是勉強、不是貪財、不是轄制，乃是甘心、樂意、作榜樣）；牧者頭上還有牧長；年幼與年長都要以謙卑束腰、彼此順服。4:8 的遮掩不是隱瞞侵害。","care":"牧養底線：不用 5:5 壓制年輕同工的提問與不同意見；華人教會的世代衝突，用 3:8「同心，彼此體恤」處理，不用「長幼有序」一句話結案。不用 4:8 掩蓋同工或領袖的侵害行為；遮掩是不揭人的瘡疤，不是不讓該負責的人負責。席上會有被前一間教會的領袖控制、羞辱、要求奉獻或切斷親友關係的人，也有正在疲憊中撐著的牧者與長老。對前者，不要說「你要順服屬靈遮蓋」「你離開就是背叛」，先讓他說，必要時協助他找可信任的屬靈長輩、專業與法律協助；對後者，提醒他頭上還有牧長，他不必一個人扛（5:7）。教會的財務與牧者的待遇要透明（5:2「也不是因為貪財」）。"},{"id":"ISS00_6","t":"作者是使徒彼得嗎？「託西拉」是甚麼意思？託名說怎樣看？","r":"1:1；5:1；5:12","ch":[],"why":"六、本講義採使徒彼得；西拉可能是信差，也可能經手執筆；託名說的三個理由與回應並陳。彼得前書是新約裡最有「人的溫度」的書信之一：寫信的人自稱是基督受苦的見證人，信末稱馬可是「我兒子」。近代學界有不少人主張這封信是後人託名之作，信徒在網路或讀書會上聽到，常會動搖。這一題要把理由與回應擺出來，也要把焦點放回彼得的主身上。","pos":[["【一】經文問的是甚麼","","<p>信的開頭說：「耶穌基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）；第五章作者稱自己「作基督受苦的見證」（5:1），信末說：「我略略地寫了這信，託我所看為忠心的兄弟西拉轉交你們」（5:12），又說「我兒子馬可也問你們安」（5:13）。</p><p>「託……西拉」原文是 Διὰ Σιλουανοῦ ἔγραψα，直譯是「藉著西拉，我寫了」——這個片語在當時的書信裡，可以指送信的人，也可以指執筆的人。<strong>經文問的是：寫信的人是不是使徒彼得？西拉在這封信裡做了甚麼？如果有學者說這是後人託名寫的，我該怎麼看？</strong></p>"],["使徒彼得說（歷代傳統）","","<p>歷代教會一致接受這是使徒彼得的信：彼後 3:1 說「我現在寫給你們的是第二封信」，坡旅甲、愛任紐都引用過它。信中的用字與彼得在使徒行傳裡的講道相近——他在哥尼流家說「我真看出神是不偏待人」（徒 10:34），信裡說「你們既稱那不偏待人、按各人行為審判人的主為父」（1:17）；他在公會前引詩篇說「他是你們匠人所棄的石頭，已成了房角的頭塊石頭」（徒 4:11），信裡也引同一節（2:7）。</p><p><strong>難處：</strong>這派要面對的是信中流暢的希臘文——公會的人看彼得與約翰，「又看出他們原是沒有學問的小民」（徒 4:13）。若堅持彼得一字一句親筆寫成，就要解釋一位加利利漁夫怎樣寫出新約中相當講究的希臘文；多數主張彼得是作者的人，因此也同時看重 5:12 的西拉。</p>"],["彼得與西拉說（彼得的思想，西拉的筆）","","<p>認為 5:12 的西拉不只是送信人，也經手執筆：西拉是耶路撒冷教會的領袖——「這兩個人在弟兄中是作首領的」（徒 15:22），是羅馬公民（徒 16:37 保羅說「我們是羅馬人」），曾與保羅同工，帖撒羅尼迦前書開頭就有他的名字：「保羅、西拉、提摩太寫信給帖撒羅尼迦」（帖前 1:1）。由他執筆，彼得口述或授意，是當時書信常見的做法。這派的優點是同時解釋了作者的身分與文筆。</p><p><strong>難處：</strong>「藉著某人寫」在當時的書信裡最常指送信的人；若西拉只是信差，這個解釋就少了根據。而且我們不知道一位執筆人在當時可以有多大的自由，所以這派只能說「可能」，不能說「一定」。本講義因此只說：西拉可能是信差，也可能經手執筆。</p>"],["託名說（後人借彼得之名寫成）","","<p>部分近代學者主張這是彼得死後，羅馬教會中的彼得門生借他的名寫成的，理由有三：①希臘文太好，加利利漁夫寫不出來；②書中的逼迫像主後九十年代多米田皇帝時期的全面逼迫；③書中很像保羅的神學。這派的優點是認真處理文字與歷史的證據，逼著讀者不能只說「傳統就是這樣」。</p><p><strong>難處：</strong>三個理由各有回應：①5:12 的西拉正好解釋了文筆；②書中的逼迫是地方性的——毀謗（2:12；4:4）、羞辱（4:14）、家庭壓力（3:1），不是國家性的處決，與主後六十年代初的處境相合；③新約作者共享同一個福音，彼得與保羅都引賽 28:16 與賽 8:14，那是早期教會共同的教導材料。更根本的難處是：一封一再勸人「嘴唇不說詭詐的話」（3:10）的信，開頭若是借名，早期教會不會這樣一致地接受它。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採歷代傳統——作者是使徒彼得；西拉可能是信差，也可能經手執筆；託名說的理由與回應並陳，不嘲諷持這個看法的學者。</strong>理由是：信的自稱（1:1；5:1）、早期教會一致的接受、與彼得在使徒行傳講道的相近用字，以及 5:12 對文筆問題的合理解釋。</p><p>這封信裡處處有彼得的指紋：「你們雖然沒有見過他，卻是愛他」（1:8）——寫這句話的人，是見過他的；「你回頭以後，要堅固你的弟兄」（路 22:32）——主當年對他說的「堅固」，正是 5:10 神「堅固你們」的同一個字。<strong>但講台只講一句：寫這封信的人，就是那個在炭火旁三次不認主，又在加利利海邊的炭火旁被主重新接回來的人。</strong>講他的一生很動人，每一處卻都要落在主身上——不是彼得變好了，是主沒有放棄他。</p>"],["【四】這件事該不該影響你的信心","","<p>作者是不是彼得，學術上的討論不該動搖你的信心——即使在託名說的學者當中，也都承認這封信是早期教會珍視、傳講使徒信仰的書信；它被收入正典，是因為眾教會在其中聽見了主的聲音。</p><p>但有一件事該問：<strong>我讀完這封信，是更佩服彼得，還是更愛彼得的主？</strong>彼得自己在信末說，他寫這信是要「又證明這恩是神的真恩。你們務要在這恩上站立得住」（5:12）。他要我們站立的，不是在他的名聲上，是在那恩上。</p>"]],"con":[],"say":"本講義的全卷立場：作者是使徒彼得（1:1；5:1）；5:12「託……西拉」，西拉可能是信差，也可能經手執筆；託名說的三個理由（文筆、逼迫、像保羅）與回應並陳。講台只講一句：寫信的人，就是那個在炭火旁跌倒、又被主重新接回來的人。","care":"席上會有在網路或讀書會上聽到「彼得前書是偽作」而動搖的年輕人，也有一聽到學者有爭論就不安的長輩。不要說「懷疑作者的都是不信派」，也不要把信心建立在證明作者身分上——讓他看見即使在最難的問題上，教會也是誠實地擺出理由。講彼得的跌倒與復原時，席上會有正在跌倒裡、覺得自己再也不配服事的人；不要把彼得講成「後來變強了」的勵志故事，要讓他聽見：是主轉過身來看彼得（路 22:61），是主先找他回來。"},{"id":"ISS00_7","t":"寫作年代與地點：「巴比倫」是羅馬嗎？","r":"5:13","ch":[],"why":"七、主後 62–64 年左右；巴比倫三讀（羅馬、美索不達米亞、埃及要塞），本講義採羅馬；不把巴比倫對號入座到今天的任何國家、城市或組織。「巴比倫」是華人教會末世講道最常被套用的詞，常被拿來指某個國家、某個宗派或某個城市；彼得前書 5:13 卻只是一句平常的問安。把它的意思講清楚，可以保護會眾不被末世恐慌與對號入座帶走，也讓他們看見巴比倫城裡也有教會。","pos":[["【一】經文問的是甚麼","","<p>信末說：「在巴比倫與你們同蒙揀選的教會問你們安。我兒子馬可也問你們安」（5:13）。主前 587 年以後，「巴比倫」在聖經裡就是被擄之地的代名詞——「我們曾在巴比倫的河邊坐下，一追想錫安就哭了」（詩 137:1）；到了啟示錄，它成了與神為敵的世界城市：「巴比倫大城傾倒了！」（啟 18:2）。</p><p>彼得寫信的時候，美索不達米亞那座古城已經衰落；埃及也有一個叫巴比倫的軍事要塞。信裡提到的處境是毀謗與羞辱，沒有提到大規模的處決；4:7 又說「萬物的結局近了」。<strong>經文問的是：彼得寫信的時候在哪裡？大約是甚麼時候？他為甚麼稱那座城為「巴比倫」？今天的我們可以把「巴比倫」套在哪個國家或組織身上嗎？</strong></p>"],["羅馬代稱說","","<p>多數學者的讀法：「巴比倫」是羅馬的代稱。早期教會的傳統一致認為彼得晚年在羅馬，並在那裡殉道；馬可也與羅馬有關（西 4:10；提後 4:11）；猶太文獻與啟示錄在主後一世紀已經用巴比倫稱呼羅馬。這個讀法也與全卷的主題相合：信從「分散」開始，到「巴比倫」結束——寫信的人自己也在被擄之地，和收信人一樣是寄居的。</p><p><strong>難處：</strong>啟示錄用巴比倫稱羅馬，可能比彼得前書晚；若彼得前書寫在主後六十年代初，這個代稱是否已經通行，學者有討論。也有人問：彼得若在羅馬，為甚麼不直接寫羅馬？常見的回答是：這是寄居者的語言，也可能出於謹慎；但這只能推論，經文沒有說明。</p>"],["美索不達米亞巴比倫說與埃及要塞說","","<p>美索不達米亞巴比倫說照字面讀：主後一世紀那一帶仍有大量猶太社群，彼得是向受割禮之人傳道的使徒，五旬節那天也有「住在美索不達米亞」的人（徒 2:9）。埃及要塞說則指出，今天開羅附近曾有一座名叫巴比倫的羅馬軍營，埃及教會的傳統也與馬可有關。兩派的優點是不需要假設代稱，直接照地名讀。</p><p><strong>難處：</strong>沒有任何早期文獻記載彼得到過美索不達米亞或埃及，而早期教會對彼得在羅馬的記憶卻相當一致；埃及的巴比倫只是一個要塞，用它來代表一間教會的所在地，可能性很低。加上馬可、西拉這兩位同工在新約其他地方都與羅馬或保羅的圈子有關，羅馬說的證據仍然最強。</p>"],["年代：早期說與晚期說","","<p>早期說認為這封信寫在主後 62–64 年左右，在羅馬大火（64 年）與尼祿逼迫全面爆發之前或剛開始時：信中的苦難是地方性的毀謗與排擠，2:13–17 對政府的態度仍然相當正面——「尊敬君王」（2:17）；而傳統上彼得在尼祿時期殉道。晚期說（多半與託名說連在一起）則把它放在主後 80–95 年，認為書中反映了較廣泛的逼迫。</p><p><strong>難處：</strong>早期說必須承認，信中沒有任何一個確定日期的事件，年代只能從處境推斷；晚期說則要解釋：若是寫在多米田時期，為甚麼信裡完全沒有皇帝崇拜的衝突，還勸信徒尊敬君王、說官府是「罰惡賞善」（2:14）的？兩者都有推論的成分，本講義採早期說，但不把年代講成定論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：寫作年代約在主後 62–64 年；「巴比倫」採羅馬的代稱，並陳美索不達米亞與埃及兩說。不把「巴比倫」對號入座到今天的任何國家、城市、宗派或組織。</strong></p><p>講台只講一句：<strong>彼得稱羅馬為「巴比倫」——世界最強大的城，在神的眼中是一個被擄之地；但在那裡，有一間「同蒙揀選的教會」。</strong>這封信的最後一個地名是巴比倫，最後一句話卻是「願平安歸與你們凡在基督裡的人」（5:14）。巴比倫城裡也有一座靈宮——神國的領土不必先有一塊地，它先是一群人。</p><p>「萬物的結局近了」（4:7）也不必讀成一個時間表；它是一個方向：所以要謹慎自守，警醒禱告，彼此切實相愛（主再來與「近了」回指帖撒羅尼迦前書立場二）。</p>"],["【四】這件事該不該影響你的信心","","<p>巴比倫是羅馬還是別處、這封信寫在哪一年，不該動搖你的信心；這些細節不改變信的內容，也不改變那位在巴比倫城裡建造教會的主。</p><p>但有一件事該問：<strong>我是在研究「誰是巴比倫」，還是在學習怎樣在巴比倫裡作寄居的人？</strong>彼得沒有叫羅馬城裡的信徒去揭發這座城，他叫他們在其中「品行端正」（2:12），彼此相愛、彼此款待、等候主。把巴比倫套在別人身上很容易；在自己所住的城裡活出「同蒙揀選」的樣子，才是這封信要的。</p>"]],"con":[],"say":"本講義的全卷立場：彼得前書約寫於主後 62–64 年；5:13 的「巴比倫」採羅馬的代稱，並陳美索不達米亞與埃及要塞兩說。不把巴比倫對號入座到今天的任何國家、城市、宗派或組織；巴比倫城裡也有一間同蒙揀選的教會。","care":"席上會有熱衷末世解經、把新聞與預言對號入座的人，也有被這類講法嚇得夜不能眠的人，還有正住在被別人稱為「巴比倫」的國家裡、為那城求平安的弟兄姊妹。不要說「你住的國家就是巴比倫」「某某宗派就是那大淫婦」；對熱衷的人，溫和地把他帶回經文本身的用法；對害怕的人，帶他讀 5:10 與 5:14——結局是神親自成全，不是恐慌。也不在講台上把巴比倫變成政治評論。"},{"id":"ISS00_8","t":"收信的教會：本都、加拉太、加帕多家、亞細亞、庇推尼在哪裡？","r":"1:1","ch":[],"why":"八、今天的土耳其北部；五個地區的次序可能就是信差的路線；收信人多數是外邦人。1:1 那串地名，多數讀者一眼帶過；但它告訴我們這封信是一封傳閱信，要走過一大片山地與海岸，收信的是許多分散在城鎮與鄉村的小家庭教會。認識這五個地方，會眾才讀得出彼得心裡那張地圖，也才明白為甚麼這封信特別適合今天散在各國的線上團契。","pos":[["【一】經文問的是甚麼","","<p>彼得寫信「給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）。這五個名字都在小亞細亞，也就是今天土耳其的北部與中部：本都在黑海南岸，加拉太與加帕多家在中部高原，亞細亞在西部愛琴海沿岸，庇推尼在西北，靠近今天的伊斯坦堡。其中幾個地名在五旬節出現過：「住在美索不達米亞、猶太、加帕多家、本都、亞細亞」（徒 2:9）的人，聽見彼得講道。</p><p>有趣的是，保羅曾經想去其中一處而沒有去成：「他們想要往庇推尼去，耶穌的靈卻不許」（徒 16:7）。<strong>經文問的是：這五個地方在哪裡？為甚麼照這個次序排？福音是怎樣傳到那裡的？收信的是些甚麼人？</strong></p>"],["信差路線說","","<p>部分學者注意到：本都與庇推尼在當時是同一個羅馬行省，彼得卻把它們分開，一個放在最前面、一個放在最後面。最合理的解釋是，這是送信人的路線——從黑海邊的本都上岸，往南進加拉太、加帕多家，向西到亞細亞，再往北到庇推尼，繞一圈回到出發點附近。這派的優點是讓地名活了起來：西拉帶著這封信，一城一城地讀給家庭教會聽，正是 5:12「轉交你們」的畫面。</p><p><strong>難處：</strong>這是一個很好的推論，卻沒有直接證據；我們不知道信差從哪裡上岸，也不知道這封信有沒有抄成好幾份同時送出。所以路線說只能說「可能」，不能講成確定的行程。</p>"],["行政名單說與民族地區說","","<p>行政名單說認為，彼得只是列出收信人所在的羅馬行省，次序不一定有特別的意義；當時的書信列地名，本來就不一定照路線。民族地區說則提出：這些名字可能指的是傳統的民族地區，不是羅馬行省的界線——例如「加拉太」可以指北部的加拉太人地區，也可以指包括南部城市的整個行省。兩派的優點是謹慎，不在地名上讀出太多東西。</p><p><strong>難處：</strong>行政名單說解釋不了為甚麼同一行省的本都與庇推尼要分開，一頭一尾；民族地區說則讓收信範圍變得更模糊。不過兩派與路線說都同意一件事：這是一大片土地，收信的教會很分散，彼此相隔很遠，正是 1:1「分散」這個字的實況。</p>"],["福音怎樣傳到那裡：五旬節播種說與保羅宣教說","","<p>五旬節播種說認為，五旬節在耶路撒冷聽見彼得講道的人中，有從加帕多家、本都、亞細亞來的（徒 2:9），他們回鄉以後把福音帶了回去——這或許也是彼得寫信給他們的理由之一。保羅宣教說則指出，亞細亞與南加拉太是保羅宣教的地區；但北部的本都、加帕多家與庇推尼，新約沒有保羅去過的記載，聖靈甚至「禁止他們在亞細亞講道」（徒 16:6），後來才開門。</p><p><strong>難處：</strong>兩說都只能解釋一部分地區；而且信中說他們多數是外邦人（1:14；1:18；4:3），不只是回鄉的猶太人。最誠實的說法是：彼得自己說的——「那靠著從天上差來的聖靈傳福音給你們的人」（1:12）。我們不知道那些傳福音的人是誰，神知道。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：這五個地方在今天的土耳其北部與中部；五個地區的次序可能就是信差的路線（並陳行政名單說）；收信人多數是外邦人，分散在許多城鎮與鄉村的小家庭教會裡。</strong></p><p>這封信是一封傳閱信：一份信，走過一大片土地，被讀給一間又一間散在各處的教會聽。這使我們想起國度321空中團契——弟兄姊妹散在台灣、馬來西亞、中國、新加坡、紐西蘭與各地，從不同的時區，同一個時間打開同一段經文。<strong>神國的教會從一開始就是「分散」的，但從來不是孤單的：「在巴比倫與你們同蒙揀選的教會問你們安」（5:13）——相隔千里的人，是同一批蒙揀選的人。</strong></p><p>還有一筆不要漏掉：保羅想去而沒有去成的庇推尼，福音後來還是到了，而且收到了彼得的信。神的門有時關、有時開，福音的腳步從來沒有停下。</p>"],["【四】這件事該不該影響你的信心","","<p>五個地區的次序、加拉太的範圍、福音是誰傳過去的，不該動搖你的信心；這些是讀信的地圖，不是信的內容。</p><p>但有一件事該問：<strong>我在我所在的地方，是不是也是一封被「轉交」出去的信？</strong>那些傳福音給本都、庇推尼的人，連名字都沒有留下，彼得只說他們是「靠著從天上差來的聖靈」（1:12）。神的國就是這樣擴展的：一封信，一個家，一個不留名的人，一段走了很遠的路。</p>"]],"con":[],"say":"本講義的全卷立場：本都、加拉太、加帕多家、亞細亞、庇推尼在今天的土耳其北部與中部；五個地區的次序可能就是信差的路線（並陳行政名單說）；收信人多數是外邦人，分散在許多家庭教會裡——分散，卻是同蒙揀選。","care":"席上與螢幕前會有散在各國、所在城市裡沒有幾個華人信徒的弟兄姊妹，覺得自己是孤島；也有覺得線上聚會「不算教會」而自卑的人。牧者要讓他們聽見：彼得前書本來就是寫給一群分散的人，一封信把他們連在一起。不要說「只有實體聚會才算真教會」，也不要把地理知識講成考試；鼓勵他們在自己所在的地方彼此相顧、互相款待（4:9），讓分散成為福音走得更遠的路。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:3--9；5:10--12","ch":[],"why":"九、派別之爭不該影響信心；但「我在受苦的時候，是更靠近他，還是更遠離他」該——在這恩上站立得住。彼得前書只有五章，卻碰到新約最難解的經文（3:19）、最敏感的家規（2:13–3:7）、最常被誤用的權柄經文（5:5）、還有作者、年代、巴比倫的種種討論。一位認真讀完議題頁的信徒，很可能會問：這麼多不確定，我還能確定甚麼？這一題要把全卷的爭議放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>彼得說，連眾先知也要「早已詳細地尋求考察」（1:10）他們所說的救恩，連「天使也願意詳細察看這些事」（1:12）；他也要信徒在有人問的時候，「就要常作準備，以溫柔、敬畏的心回答各人」（3:15）。後來他在第二封信裡還承認，保羅的信中「有些難明白的」（彼後 3:16）。</p><p>同時，彼得在信的開頭與結尾放了兩件不會改變的事：開頭是「藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望」（1:3），結尾是「又證明這恩是神的真恩。你們務要在這恩上站立得住」（5:12）。<strong>經文問的是：面對這卷書裡的種種爭議，一個信徒該怎樣自處？問問題是不是不信？有沒有甚麼是不會因爭議而動搖的？</strong></p>"],["爭議證明聖經不可靠","","<p>這是懷疑者常有的推論：連 3:19 都有五種讀法，作者是誰學者都在爭，順服到底是甚麼意思教會也說不一致——可見聖經不過是人的作品，不值得全然信靠。這派的優點是誠實，它不假裝問題不存在，也逼著教會不能只用「信就對了」回答。</p><p><strong>難處：</strong>這些爭議幾乎全部發生在「怎樣理解」的層次，不在「耶穌是誰、他作成了甚麼」的層次。主張 3:19 是指挪亞時代的人，和主張是指墮落天使的人，都同意「基督也曾一次為罪受苦，就是義的代替不義的」（3:18）；互補派與平等派都同意妻子是「與你一同承受生命之恩的」（3:7）。爭議多，表示這卷書被認真讀了兩千年，不表示它不可信。</p>"],["問問題就是不信（只要信，不要問）","","<p>這是教會裡常見的反應：這些爭議會絆倒人，最好不要在教會裡講，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心不是靠學問得來的——「那沒有看見就信的有福了」（約 20:29）；彼得也說「你們雖然沒有見過他，卻是愛他」（1:8）。</p><p><strong>難處：</strong>彼得要信徒「常作準備」回答人（3:15），庇哩亞人也被稱讚「天天考查聖經，要曉得這道是與不是」（徒 17:11）。不准問的信心最脆弱——一旦有一天在別處聽見這些問題，就會以為教會一直在隱瞞甚麼。而且把提問的人看成不屬靈，正是 5:3 那種轄制的開始。</p>"],["分層看待（根基與枝節）","","<p>主張要分清楚哪些是根基、哪些是枝節：在根基上站穩的人，可以帶著謙卑與好奇去面對枝節上的爭議。保羅說「信心軟弱的，你們要接納，但不要辯論所疑惑的事」（羅 14:1），又說「但要凡事察驗；善美的要持守」（帖前 5:21）。這派的優點是既不迴避問題，也不讓問題動搖根基。</p><p><strong>難處：</strong>甚麼是根基、甚麼是枝節，本身有時也有爭議；有些人會把自己宗派的立場都放進「根基」裡，有些人則把重要的事都推到「枝節」去。所以分層需要謙卑，也需要回到經文本身與歷代教會共同的信仰告白，不是由某一位講員說了算。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義都已經在 ISS00_1–8 交代：寄居的人（ISS00_1）、受苦（ISS00_2）、順服（ISS00_3）、監獄裡的靈與洗禮（ISS00_4）、長老與屬靈權柄（ISS00_5）、作者（ISS00_6）、年代與巴比倫（ISS00_7）、五個地區（ISS00_8）。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>神「藉耶穌基督從死裡復活，重生了我們」（1:3）；我們得贖「乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血」（1:19）；「他被掛在木頭上，親身擔當了我們的罪」（2:24）；他「義的代替不義的，為要引我們到神面前」（3:18）；如今「眾天使和有權柄的，並有能力的，都服從了他」（3:22）；而且「惟有主的道是永存的」（1:25）。</strong>這是彼得前書的根基，也是本講義全卷的根基。</p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該影響你的信心。問問題不是不信；在問題面前轉身離開，才是彼得擔心的。彼得自己也是一個問過很多問題、說過很多錯話的人——「主啊，萬不可如此！」（太 16:22）——主沒有因此放棄他。</p><p>但有一件事該影響你：<strong>我在受苦的時候，是更靠近他，還是更遠離他？</strong>這封信不是寫給一群把所有問題都答完的人，是寫給一群在百般試煉中暫時憂愁、卻仍然愛那位沒有見過之主的人。彼得最後沒有說「你們要把一切弄明白」，他說的是：「你們務要在這恩上站立得住」（5:12）——而那叫你站得住的，是「必要親自成全你們，堅固你們，賜力量給你們」（5:10）的那一位。</p>"]],"con":[],"say":"本講義的全卷立場：彼得前書的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。基督的復活重生了我們，他的寶血買贖了我們，他義的代替不義的，如今一切都服從了他；這些沒有一個爭議動搖過。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也有一聽到「學者有爭論」就不安的長輩，還有曾經在順服、權柄、洗禮或亡者的問題上被教會傷過，因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要用一堆答案堵住他，先陪他；對第二種人，指給他看 1:3 與 5:10；對第三種人，讓他知道傷他的是人錯用了經文，不是那位顧念他的主（5:7）。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"作者是使徒彼得嗎？「寄居的」是字面的外僑，還是屬靈的身分？","r":"1:1；2:11；5:1；5:12--13","ch":[1],"why":"這一卷的第一個字是「彼得」，第一個身分字是「寄居的」。學界有人主張這封信是後人託彼得之名寫的；也有人主張「寄居的」是社會上真正沒有公民權的外僑，不是一般的屬靈比喻。這兩件事決定我們怎樣聽這封信：是一位跌倒又被接回來的使徒在說話，還是一篇匿名的勸勉？收信人是一群社會邊緣人，還是每一個基督徒？","pos":[["【一】經文問的是甚麼","","<p>「耶穌基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）。作者自稱「使徒彼得」，5:1 又說自己是「作基督受苦的見證」的長老；收信人被稱為 παρεπιδήμοις（parepidēmois），暫住的外地人，2:11 又和 πάροικος 並列。問題有兩層：寫信的人是不是使徒彼得？「寄居」說的是法律與社會上的處境，還是在神面前的身分？</p>"],["託名說：後人託彼得之名寫成","","<p>一些學者認為這封信是彼得過世後，由他的門生或羅馬教會託名寫成。理由有三：希臘文相當流暢，不像加利利漁夫的手筆；信裡描寫的逼迫像是較晚的時代；用語與保羅書信很接近。</p><p><strong>難處：</strong>5:12 說「託……西拉」，執筆或送信的同工可以解釋文筆；信中的逼迫是日常的毀謗與邊緣化，不必是後期的國家逼迫；彼得與保羅同屬一個使徒圈子，用語相近並不奇怪。早期教會也一致承認這封信出自彼得。</p>"],["字面外僑說：收信人是社會上真正的外僑","","<p>有學者主張「寄居的」「客旅」是當時法律上的身分：沒有公民權、在城裡暫住或長住的外地人。這些人本來就在社會邊緣，信主後又多了一層被排擠，所以彼得說教會是他們的「家」。這一說讓我們看見收信人的真實處境，不把他們浪漫化。</p><p><strong>難處：</strong>1:17 說「在世寄居的日子」，1:18 說他們從「祖宗所傳流虛妄的行為」被贖出來，4:3--4 說鄰舍因他們不再同流而以為怪——這些描寫更像是信主以後才變成外人的人，不只是本來就沒有公民權的人。</p>"],["屬靈身分說：「寄居」是每一個基督徒在世上的身分","","<p>另一說認為，「寄居的」是一個屬靈的身分：基督徒的國籍在天上，在地上都是客旅，這使我們想起希伯來書講義第 11 章的「客旅」。這一說把彼得前書打開給每一個時代的信徒，不論他在社會上是甚麼地位。</p><p><strong>難處：</strong>若只講屬靈身分，容易把收信人真實的痛——被毀謗、被分家、在職場被冤枉——講成一個美麗的比喻，也容易推出「既然是寄居，就不必關心社會」的逃避。</p>"],["【三】本講義站在哪裡","","<p><strong>作者是使徒彼得（1:1；5:1），西拉可能是信差，也可能經手執筆；託名說的理由與回應並陳。</strong>「寄居的」兩面都要：收信人多數是外邦信徒，信主以後沒有搬家，卻成了家鄉裡的外人——這是真實的社會處境；而他們在神那裡的身分是「被揀選的」——這是屬靈的實際。處境是邊緣化，身分是被揀選。</p><p>彼得前書在這裡多出來的一筆是：寄居不是逃離世界，是在世界裡活出另一個國的樣子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論學者怎樣看作者與收信人，信中的福音沒有改變：神照自己的大憐憫，藉耶穌基督從死裡復活重生了我們。對你今天最重要的，是認出自己也是寄居的——在不信的家族裡、在應酬文化裡、在異鄉——而且你是被揀選的。</p><p>作者與西拉的全卷立場見 ISS00_6；寄居的處境與原則見 ISS00_1；五個地區見 ISS00_8；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：作者是使徒彼得，西拉可能是信差或經手執筆；「寄居的」既是真實的社會處境，也是在神面前被揀選的身分——寄居不是逃離世界，是在世界裡活出另一個國的樣子。本講義的全卷立場見 ISS00_6、ISS00_1、ISS00_8。","care":"會眾席上有人正在當真正的外僑：移工、留學生、新住民、在異國工作的弟兄姊妹；也有人在自己的家族裡活得像外人。不要把「寄居」講成一個輕鬆的比喻，好像大家都差不多；也不要讓在異鄉的人覺得自己的孤單只是屬靈功課。陪他們說出具體的難處，讓教會成為他們真的家；對被學術問題困擾的學生，陪他看見爭議不動搖福音的核心。"},{"id":"ISS01_2","t":"1:2「照父神的先見被揀選」——揀選是根據神預先知道誰會信，還是根據神預先愛了誰？","r":"1:2；1:20；弗 1:4--5","ch":[1],"why":"「先見」原文 πρόγνωσιν（prognōsin），可以讀成「預先知道」，也可以讀成「預先認定、預先愛」。這是教會歷史上爭論最久的題目之一，牽動預定與自由意志、揀選與傳福音。華人教會裡不同宗派的弟兄姊妹常在這一題上彼此論斷，甚至影響人敢不敢相信自己被神接納。","pos":[["【一】經文問的是甚麼","","<p>「就是照父神的先見被揀選，藉著聖靈得成聖潔，以致順服耶穌基督，又蒙他血所灑的人」（1:2）。彼得把三一神放在同一句裡：父的先見、聖靈的成聖、基督的血。問題是：「先見」是神看見了將來人會信，所以揀選他；還是神先定意愛他、認定他，所以揀選他？同一個字根 1:20 也用在基督身上：「基督在創世以前是預先被神知道的」（1:20）。</p>"],["預知說：神預先知道誰會信，就照此揀選","","<p>亞米念與衛斯理傳統讀「先見」為預先知道：神在永恆裡看見誰會回應福音，就照著這預知揀選他們。這一說看重人的回應是真實的、有責任的，也保護神的公義：神不是任意挑人，福音真心向每一個人發出。</p><p><strong>難處：</strong>1:20 同一個字用在基督身上，很難讀成「神預先看見基督會怎樣做」；在聖經裡，「知道」常有關係上的意思（例如摩 3:2「在地上萬族中，我只認識你們」）。若揀選只是神對人將來決定的確認，揀選這個字就幾乎沒有意思了。</p>"],["預愛說：神預先認定、愛了一群人，就揀選他們","","<p>改革宗傳統讀「先見」為關係上的預先認定：神在創世以前就定意愛他們，所以揀選他們；人的信心是這份揀選的結果，不是原因。這一說的長處是和 1:20 一致：基督是神「預先」定意要差來的；也和 1:3「照自己的大憐憫」的方向相合——根源在神。</p><p><strong>難處：</strong>這一說若講得太快，容易推出「那沒被揀選的人怎麼辦」「人的回應還有沒有意思」，甚至讓人不再熱心傳福音；也容易被用來猜測別人是不是在名單上。</p>"],["【三】本講義站在哪裡","","<p><strong>揀選與預定沿用以弗所書立場二，本章不另立說法：揀選的根源在神，不在人的功勞；福音真心向每一個人發出，人的回應是真實而有責任的；兩說並陳，講台不裁判。</strong></p><p>彼得前書在這裡多出來的一筆是：揀選是寫給寄居者的安慰——在地上你是外人，在神那裡你是被揀選的。而且揀選有方向：「藉著聖靈得成聖潔，以致順服耶穌基督」。揀選不是讓人坐下來的名單，是讓人起身跟隨的呼召。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你不安，反而該讓你站穩。兩說都同意：你得救的根源是神的恩典與憐憫，不是你的功勞；基督的血灑在你身上，聖靈在你裡面工作。</p><p>如果你曾經害怕「我是不是被揀選的」，請你看 1:2 的方向：被揀選的人「以致順服耶穌基督」。你今天想要跟隨他，這本身就是聖靈的工作。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：揀選的根源在神，福音真心向每一個人發出，預知與預愛兩說並陳、講台不裁判；揀選與預定沿用以弗所書立場二。彼得前書補一筆：揀選是給寄居者的身分與安慰，不是判斷別人的名單。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有人因為讀到預定論，整夜害怕自己「不在名單上」；也有人因為宗派背景不同，被說成「不懂恩典」或「不負責任」。不要在講台上把這一題變成宗派之爭，也不要說「某某人大概不是被揀選的」。陪害怕的人回到 1:3 的「大憐憫」；陪喜歡辯論的人看見，彼得寫這兩個字，是為了安慰在家鄉被排擠的人。"},{"id":"ISS01_3","t":"1:3「重生了我們」——重生在洗禮時發生？在決志時發生？是神單方面的作為嗎？","r":"1:3；1:23；3:21","ch":[1],"why":"「重生」ἀναγεννήσας（anagennēsas）全本新約只在彼得前書出現（1:3；1:23）。不同傳統對重生何時發生、怎樣發生看法不同：有人連到洗禮，有人連到決志禱告，有人強調那完全是神的作為。這一題影響弟兄姊妹怎樣看自己的得救確據，也影響教會怎樣看在基督徒家庭裡長大、說不出信主日期的人。","pos":[["【一】經文問的是甚麼","","<p>「他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望」（1:3）；「你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉著神活潑常存的道」（1:23）。1:3 的主詞是神，根源是他的憐憫，途徑是基督的復活；1:23 說工具是神的道。問題是：這重生在人的經歷裡，落在哪一個時刻？</p>"],["洗禮重生說：重生在洗禮中發生","","<p>天主教、東正教與信義宗等傳統認為，神藉著洗禮使人重生，並引 3:21「這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們」與多 3:5「重生的洗」。這一說看重聖禮是神真實施恩的管道，也保護了重生是「神所做的」，不是人做出來的。</p><p><strong>難處：</strong>3:21 緊接著說洗禮「不在乎除掉肉體的污穢，只求在神面前有無虧的良心」，而且救人的是「耶穌基督復活」；1:23 又說重生是藉著神的道。若把重生綁在水禮上，容易讓人以為受了洗就自動得救，不必再有信心與悔改。</p>"],["決志重生說：重生在人悔改相信、接受基督時發生","","<p>福音派與奮興運動傳統強調：人聽見福音，悔改相信、接受基督的那一刻，就重生了，並引約 1:12--13。這一說看重個人的回應，也推動了傳福音的熱心；1:23 說重生是藉著「所傳給你們的福音」，正好與此相合。</p><p><strong>難處：</strong>若把重生講成「做了決志禱告就完成」，容易變成另一種儀式；也會讓在基督徒家庭長大、慢慢信主、說不出確切日期的人懷疑自己。1:3 的主詞是神，不是人的決定。</p>"],["神單方面說：重生完全是神的作為，信心是重生的果子","","<p>改革宗傳統強調重生是神單方面的作為：神先賜新生命，人才能悔改相信。1:3「照自己的大憐憫……重生了我們」，主動的完全是神；一個人不能把自己生出來。這一說最貼近 1:3 的文法。</p><p><strong>難處：</strong>若講得只剩神單方面，容易讓人忽略 1:22--23 的上下文：「順從真理」與「所傳給你們的福音」，人的聽、信、順從在彼得筆下是真實的；也容易推出「反正是神的事，不必傳」的消極。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義照 1:3 與 1:23 的次序講：重生的主詞是神，根源是他的大憐憫，根據是基督的復活，工具是神的道；人在聽見福音時悔改相信，是對神這作為的回應。重生是神的工作，不是人的表現，也不是一個儀式的自動結果。</strong></p><p>洗禮與得救沿用全卷立場：救人的是復活的基督，不是水；洗禮是向神的回應，主吩咐了我們就順服；不說受洗就得救，也不說沒受洗就不能得救；不在嬰兒洗與信徒浸之間裁判。說不出信主日期的人，不必因此懷疑自己。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：重生是神的恩典，是藉著基督的復活，人不能自己把自己生出來；重生的人有活潑的盼望。</p><p>如果你說不出自己是哪一天信主的，請你看 1:23：你是從一顆不能壞的種子生出來的。種子甚麼時候落下，不一定看得見；看得見的是它長出來的生命——你愛那位沒有見過的主。洗禮的全卷立場見 ISS00_4；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：重生的主詞是神，根源是他的大憐憫，根據是基督的復活，工具是神的道；人的悔改相信是回應。救人的是復活的基督，不是水，洗禮是向神的回應。本講義的全卷立場見 ISS00_4、ISS00_9。","care":"會眾席上可能有在基督徒家庭長大、說不出信主日期而暗自不安的年輕人；也有受洗多年、生命卻還看不出改變而羞愧的人；還有來自不同洗禮傳統的弟兄姊妹。不要在講台上逼人「說出你重生的那一天」，也不要嘲笑任何一種洗禮傳統。陪不安的人看見神的憐憫，陪羞愧的人看見種子還在長。"},{"id":"ISS01_4","t":"1:5「因信蒙神能力保守」——一次得救，永遠得救嗎？","r":"1:4--5；1:9；約 10:28--29","ch":[1],"why":"1:4--5 說基業「存留在天上」，信徒「因信蒙神能力保守」。很多人讀到這裡，會問那個常讓教會分裂的問題：一個真正得救的人，會不會失去救恩？這一題一端連著得救的確據，一端連著聖潔的責任；講偏了，有人會因為一次跌倒而絕望，也有人會把恩典當成放縱的許可。","pos":[["【一】經文問的是甚麼","","<p>「可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。你們這因信蒙神能力保守的人，必能得著所預備、到末世要顯現的救恩」（1:4--5）。「保守」φρουρουμένους（phrouroumenous）是駐軍守城的字，現在式，一直在守。守城的力量是「神能力」，途徑是「因信」。問題是：這保守是無條件的確保，還是要人持續相信才有效？</p>"],["聖徒堅忍說：真正得救的人必被保守到底","","<p>改革宗傳統認為，神所重生的人，神必保守到底；真信徒可能跌倒，卻不會最終失落。1:5 守城的是神的能力，1:4 的基業「存留在天上」，約 10:28--29 說沒有人能從父手裡把他們奪去。這一說給人極大的確據。</p><p><strong>難處：</strong>若講成「一次決志，怎麼活都可以」，就違反了這一說本身的意思——真信徒會堅忍；而一個人若長期離開主，這一說只能說「他也許本來就沒有真信」，這對身邊的家人是很難的話。</p>"],["可能失落說：人可能離棄信仰，以致失去救恩","","<p>衛斯理與亞米念傳統認為，神的保守是真實的，但「因信」是條件；人若持續、刻意地離棄信仰，就可能失去救恩，並引希伯來書的警告段與「忍耐到底的必然得救」。這一說認真看待警告，也提醒人不可輕看恩典。</p><p><strong>難處：</strong>1:5 的重點在神的能力，不在人的力氣；若把救恩講成隨時可能掉的東西，容易讓敏感的人活在不安裡，每次跌倒就懷疑自己是不是已經失落了。</p>"],["【三】本講義站在哪裡","","<p><strong>兩說並陳，講台不裁判；本講義照 1:5 的語氣講：這一節是安慰，不是考卷。守城的是神的能力，人回應的是信；信心本身也是在神的保守裡被保守的。</strong></p><p>彼得前書在這裡多出來的一筆是：這句話是寫給快撐不住的寄居者的。他們最怕的不是苦，是「我撐不住怎麼辦」；彼得的回答是：你不是自己扛著城牆的人，你是被駐軍守住的城。對警告段的讀法，參希伯來書講義的全卷立場。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕，該讓你安心，也讓你認真。兩說都同意：真實的信心會持續；神的能力是保守的根據；恩典不是放縱的許可。</p><p>如果你剛跌倒，正在怕自己已經完了，請你知道：一個還在怕失去主的人，正是一個還在向著主的人。回到他面前來。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：一次得救、永遠得救的各家讀法並陳，講台不裁判；1:5 是安慰不是考卷——守城的是神的能力，人回應的是信，恩典不是放縱的許可。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有剛跌倒、正在懷疑自己是不是失去救恩的人；也有家人離開教會多年、日夜擔心的父母。不要對這樣的人說「他本來就沒有得救」或「他已經失落了」，也不要用這一題嚇唬人。陪跌倒的人回到神面前；陪擔心的父母一起為孩子禱告，告訴他們：守城的是神，不是我們。"},{"id":"ISS01_5","t":"1:6「暫時憂愁」——基督徒可以憂愁嗎？憂鬱症是不是信心不夠？","r":"1:6--8；4:12--13；5:7","ch":[1],"why":"1:6 在同一句裡放進「大有喜樂」與「暫時憂愁」。華人教會裡，憂愁、焦慮、憂鬱常被看成屬靈軟弱的記號，很多人因此不敢求助、不敢就醫、在聚會裡強顏歡笑。這一題直接關係到會眾席上正在痛苦中的人，是本卷紅線六（受苦）在第一章的落點。","pos":[["【一】經文問的是甚麼","","<p>「因此，你們是大有喜樂；但如今，在百般的試煉中暫時憂愁」（1:6）。「憂愁」λυπηθέντες（lupēthentes）是真的痛，同一個字在約 21:17 用在彼得身上：主第三次問他，彼得就憂愁。「暫時」ὀλίγον（oligon）與 5:10「暫受苦難」首尾呼應。問題是：喜樂與憂愁可以同時存在嗎？一個基督徒長期憂鬱、焦慮，是屬靈出了問題，還是需要醫治的病？</p>"],["喜樂優先說：憂愁要盡快被喜樂勝過","","<p>有些教導強調「要靠主常常喜樂」（腓 4:4），認為基督徒的見證在於喜樂，長期的憂愁、憂鬱多半出於屬靈上的問題，需要更多禱告、讀經、認罪，必要時趕鬼。這一說的出發點是好的：它看重喜樂是聖靈的果子，也盼望人不要被憂愁吞沒。</p><p><strong>難處：</strong>1:6 本身就說「暫時憂愁」，沒有責備；主耶穌在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38）。把憂鬱一律屬靈化，會讓人停藥、不敢就醫，在教會裡戴上面具，甚至把病人的痛苦加上罪咎。</p>"],["並存說：喜樂與憂愁同時存在，喜樂是方向","","<p>另一說照 1:6--8 的文法讀：喜樂與憂愁不是先後替換，是同時並存；喜樂的根據是復活的盼望與存在天上的基業，憂愁的來源是百般的試煉。憂鬱症是身心的疾病，可以、也應該接受醫療與心理諮商，這和信靠神並行不悖。</p><p><strong>難處：</strong>這一說若講得不完整，可能讓人以為「憂愁也沒關係」就停在那裡，看不見彼得要人「專心盼望」（1:13）的方向；也需要分辨：有些憂愁確實與罪、與破碎的關係有關，需要悔改與和好。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在並存說：1:6 的憂愁是被允許的；「倒要歡喜」（4:13）是一個方向，不是一張面具；「卸給神」（5:7）不等於「不准有憂慮」——卸給神與看醫生、心理諮商並行。憂鬱與焦慮不等於信心軟弱。</strong></p><p>彼得前書在這裡多出來的一筆是「暫時」：苦難有開始，也有結束；永恆的觀點不是把苦難變小，是把盼望變大。受苦的四種分辨與受苦不等於忍受侵害，沿用全卷立場。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你可以一邊流淚，一邊相信；一邊吃藥，一邊禱告。彼得寫給受苦的人的第一句話是讚美，第二句就承認他們在憂愁——他沒有要他們先把眼淚擦乾，才配得那活潑的盼望。</p><p>如果你正在憂鬱、焦慮之中，請你繼續就醫，並讓一兩位信得過的弟兄姊妹知道。受苦的全卷立場見 ISS00_2；疾病與醫治回指雅各書立場四；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:6 的憂愁是被允許的，喜樂是方向不是面具；憂鬱與焦慮是需要照顧的身心狀況，不等於信心軟弱，卸給神與就醫、心理諮商並行。本講義的全卷立場見 ISS00_2。","care":"會眾席上一定有人正在憂鬱、焦慮、失眠、吃藥，也有人的家人曾因憂鬱症而輕生。不要說「你就是禱告不夠」「多讀經就好了」，不要叫人停藥，也不要在講台上用「憂愁的人沒有見證」這類話。陪他說出來，陪他繼續就醫；若有自傷的念頭，立即協助他聯絡專業與危機求助資源，並且不要讓他一個人。"},{"id":"ISS01_6","t":"1:10--12 舊約先知知道他們在講耶穌嗎？「基督的靈」在先知裡面？","r":"1:10--12；路 24:25--27；彼後 1:21","ch":[1],"why":"1:11 說先知心裡有「基督的靈」，預先證明基督受苦難、後來得榮耀。這引出兩個問題：先知自己知道多少？「基督的靈」是不是表示基督在舊約時代就已經存在、在說話？這一題關係到我們怎樣讀舊約：是每一節都在講耶穌，還是只有新約作者指明的地方？也牽動基督的先存。","pos":[["【一】經文問的是甚麼","","<p>「論到這救恩，那預先說你們要得恩典的眾先知早已詳細地尋求考察，就是考察在他們心裡基督的靈，預先證明基督受苦難，後來得榮耀，是指著甚麼時候，並怎樣的時候」（1:10--11）。先知考察的是「甚麼時候，並怎樣的時候」，1:12 又說「他們得了啟示，知道他們所傳講的一切事，不是為自己，乃是為你們」。問題是：先知知道內容到甚麼程度？「基督的靈」是誰？</p>"],["清楚知道說：先知清楚知道自己在講耶穌","","<p>有些讀法認為，先知受聖靈感動，清楚知道自己預言的是將來那一位彌賽亞的受苦與榮耀，只是不知道時間；「基督的靈」就是先存的基督藉著聖靈在先知裡說話。這一說高舉舊約的基督中心，也與路 24:27 主「從摩西和眾先知起」講解自己的事相合。</p><p><strong>難處：</strong>1:10--11 說先知「尋求考察」，表示他們並不完全明白；若說每一位先知都清楚知道每一個細節，就難以解釋為甚麼連門徒在復活以前都不明白主受苦的事。</p>"],["部分知道說：先知知道方向，不知道全貌","","<p>另一說認為，先知知道神要藉一位受膏者帶來救恩，也知道受苦與榮耀，但不知道是誰、何時、怎樣成就；他們說的話有比他們自己所明白更深的意思，要等到基督來了才完全顯明。「基督的靈」可以讀成「指向基督的靈」或「屬基督的靈」，就是聖靈。</p><p><strong>難處：</strong>這一說若講得太遠，可能削弱「基督的靈」在先知裡作證的分量，也可能讓人把舊約讀成只是模糊的猜測，忽略它本身的清楚與權威。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義照 1:10--12 本身講：先知確實預先證明了基督受苦難、後來得榮耀，卻不知道時候與全貌，所以要尋求考察；在他們心裡作證的是聖靈，彼得稱祂為「基督的靈」——這使我們想起基督的先存（約 1:1；8:58）。</strong></p><p>怎樣讀舊約，照本卷的規則：新約作者自己作的連結可以講滿；新約沒有作的，只說「這使我們想起」，不講成定論。彼得前書多出來的一筆是：先知在服事後人，你手裡的福音，是先知等不到、天使也願意詳細察看的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而該堅固你的信心。各說都同意：同一位靈在先知裡作證，在五旬節從天上差來，現在藉傳福音的人把這些事報給你；舊約與新約說的是同一位基督，同一條「受苦難，後來得榮耀」的路。</p><p>你讀舊約時不必在每一節硬找耶穌，也不必把舊約當成和你無關的古書。求那在先知裡說話的靈，向你開啟。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：先知預先證明了基督受苦難、後來得榮耀，卻不知道時候與全貌；在他們心裡作證的是聖靈，彼得稱祂為基督的靈。新約作者作的連結講滿，沒作的只說「這使我們想起」。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有剛開始讀舊約、讀不懂又不敢問的人，也有被「舊約處處是耶穌」的過度寓意解經弄糊塗的人。不要嘲笑讀不懂的人，也不要在講台上炫耀自己找到多少預表。陪初讀的人從新約明確引用的經文開始讀；陪喜歡寓意的人學會分辨「經文說的」和「這使我們想起的」。"},{"id":"ISS01_7","t":"1:15--16「你們要聖潔」——聖潔是一套規矩，還是像神的樣子？","r":"1:14--16；利 11:44--45；利 19:2","ch":[1],"why":"「你們要聖潔，因為我是聖潔的」（1:16）是本章的核心真理。華人教會對聖潔的理解差異很大：有人把它等同於一張生活規條（衣著、娛樂、飲食），有人把它講成一種內在的感覺，有人把它講成已經完成的地位。講偏了，會養出論斷人的律法主義，或養出不必改變的廉價恩典。","pos":[["【一】經文問的是甚麼","","<p>「那召你們的既是聖潔，你們在一切所行的事上也要聖潔。因為經上記著說：『你們要聖潔，因為我是聖潔的。』」（1:15--16）彼得引的是利未記，那裡的上下文是飲食條例（利 11:44--45）與愛鄰舍的條例（利 19:2）。他寫給的是不守摩西飲食條例的外邦信徒。問題是：聖潔的內容是甚麼？標準是一套規條，還是神自己？</p>"],["分別規條說：聖潔就是遵守一套分別的生活規矩","","<p>聖潔運動與一些保守傳統強調，聖潔要具體表現在生活規條上：不沾菸酒、不進某些娛樂場所、衣著端莊、主日不做買賣。這一說的長處是認真：聖潔不只是心裡的感覺，要落在「一切所行的事上」；它也保護了人不輕易被世界同化。</p><p><strong>難處：</strong>彼得引利未記，卻沒有叫外邦信徒守利未記的飲食條例；他給的理由不是規條，是「因為我是聖潔的」。規條式的聖潔容易變成比較與論斷，也容易讓人以為守完規條就聖潔了，心卻沒有改變。</p>"],["地位說：信徒在基督裡已經聖潔","","<p>另一說強調 1:2「藉著聖靈得成聖潔」：信徒一信主就被分別為聖，在神面前已經是聖潔的；1:15--16 是叫人活出已經有的身分。這一說給人很大的確據，也把聖潔的根基放在神的作為上。</p><p><strong>難處：</strong>若只講地位，容易把 1:15 的命令「你們……也要聖潔」講成可有可無；1:17 緊接著說神「按各人行為審判人」，彼得顯然期待生活真實地改變。</p>"],["像神說：聖潔是在一切所行的事上像那召我們的","","<p>還有一說把重點放在 1:15 的「既是……也要」：聖潔的標準是神自己，聖潔的內容是品格與關係，而且落在「一切所行的事上」——飲食、言語、生意、家庭。這一說能解釋為甚麼彼得引利未記卻不要求外邦人守飲食條例：分別從餐桌擴大到整個人生。</p><p><strong>難處：</strong>「像神」若沒有具體內容，容易變得模糊，人人都可以說自己在像神；所以彼得在全卷用一個又一個具體處境（家僕、夫妻、鄰舍、長老）來填滿它。</p>"],["【三】本講義站在哪裡","","<p><strong>聖潔沿用帖撒羅尼迦前書立場四，本章不另立說法：聖潔是神的旨意，是聖靈的工作，也是人在生活裡真實的分別。</strong></p><p>彼得前書在這裡只多出一筆：「像那召你們的」——聖潔不是一張規矩清單，是像那位召我們的神；在 1:2 已經被分別出來，在 1:15 被呼召活出來，而標準是神自己，不是教會的清單。聖潔的人不是遠離人的人，所以 1:22 緊接著講彼此切實相愛。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你灰心。各說都同意：聖潔的根源是神，聖潔的力量是聖靈，聖潔的方向是在生活裡真實地改變。</p><p>如果你曾經被一張清單壓得喘不過氣，或曾經用清單論斷過別人，請你回到 1:15 的那個人：召你的那一位。聖潔是天天跟他在一起，慢慢像他。聖潔的全卷追蹤回指帖撒羅尼迦前書立場四；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：聖潔沿用帖撒羅尼迦前書立場四；彼得前書只多一筆——聖潔不是一張規矩清單，是在一切所行的事上像那召我們的神。本講義的全卷立場見 ISS00_9，聖潔回指帖撒羅尼迦前書立場四。","care":"會眾席上可能有從嚴格規條的教會出來、對「聖潔」兩個字有創傷的人；也有覺得自己永遠不夠乾淨、不敢來到神面前的人；還有把清單當成驕傲本錢的人。不要用衣著、娛樂、飲食來量誰比較屬靈，也不要把聖潔講成可有可無。陪受傷的人重新認識那位聖潔又慈愛的神；陪驕傲的人看見，聖潔的人會更謙卑、更愛人。"},{"id":"ISS01_8","t":"1:18「祖宗所傳流虛妄的行為」——華人的祭祖、傳統與孝道怎麼辦？","r":"1:18；林前 10:19--21；出 20:12","ch":[1],"why":"對華人信徒來說，1:18 是本章最敏感的一節。信主以後，清明、中元、年節、喪禮，家族的祭祀常成為最大的衝突；不拿香被說不孝，參加又怕違背信仰。教會裡有人主張完全不參與，有人主張可以變通。這一題關係到信徒在家族裡的見證，也關係到父母未信、已經過世的弟兄姊妹心裡最深的痛。","pos":[["【一】經文問的是甚麼","","<p>「知道你們得贖，脫去你們祖宗所傳流虛妄的行為，不是憑著能壞的金銀等物，乃是憑著基督的寶血」（1:18--19）。「祖宗所傳流的」πατροπαραδότου（patroparadotou）指從父親一代代傳下來的生活方式；「虛妄的」是空虛、沒有結果的。收信人多數是外邦信徒，那套傳統包括拜偶像。問題是：今天華人家族的祭祖，哪些屬於「虛妄的行為」，哪些屬於該守的孝道？</p>"],["完全分別說：祭祀相關的一切都不參與","","<p>有些教會主張，凡與祭祖相關的都不參與：不拿香、不跪拜、不吃祭物、不燒紙錢，有些甚至不參加傳統喪禮的任何儀式，並引林前 10:20「外邦人所獻的祭是祭鬼，不是祭神」。這一說的長處是清楚，保護新信徒不在模糊中妥協。</p><p><strong>難處：</strong>若連到場、陪伴、鞠躬致意都一律拒絕，容易讓家人只看見一個「離開家」的人；也會讓信徒把信仰講成對抗，失去 3:1、2:12 所說「好行為」的見證。</p>"],["文化轉化說：不拜，但用別的方式盡孝與追思","","<p>另一說主張分辨：拿香、跪拜、燒紙錢、向亡者祈求，涉及敬拜，不參與；但出席喪禮、陪伴家人、鞠躬致意、獻花、辦追思禮拜、整理墓地、在家族聚會中負責更多實際的事，都是孝道的表現，應該積極參與。這一說貼近 1:18 被贖出來的是「虛妄的行為」，不是對父母的愛。</p><p><strong>難處：</strong>界線不容易劃：鞠躬算不算拜？到場算不算參與？不同地區、不同家族的儀式意義也不一樣；需要每一位信徒照良心、在牧者陪伴下分辨，不容易有一條人人適用的規則。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在文化轉化說：拜與不拜要分開，孝與不孝也要分開。拿香、跪拜、向亡者祈求不參與；孝順、陪伴、追思、盡責要做得比以前更多。被贖出來的是那套虛空的活法，不是對父母的愛（出 20:12）。</strong></p><p>彼得前書在這裡多出來的一筆是：彼得不是在羞辱收信人的祖先，他自己也是從祖宗的傳統裡被主叫出來的。本講義不羞辱長輩、不叫人不孝，也不斷定任何已過世長輩的去處；哀傷與亡者的牧養，回指帖撒羅尼迦前書立場三。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你在信主與孝順之間二選一。基督的寶血買贖你，不是為了把你從家裡拿走，是為了讓你在家裡活出另一個樣子。</p><p>如果你的父母還沒有信主，請你今天就用一個具體的行動愛他們；如果他們已經過世，請你把他們交在那位公義又滿有憐憫的神手裡。寄居者的處境與原則見 ISS00_1；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：拜與不拜分開，孝與不孝分開——不拿香、不跪拜、不向亡者祈求，孝順與追思要做得更多；不羞辱長輩，不斷定亡者去處，哀傷與亡者回指帖撒羅尼迦前書立場三。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有正在面對清明、中元、家族喪禮壓力的新信徒；有被長輩罵不孝、在家裡被孤立的人；也有父母未信主就過世、一想到這一節就心痛的人。不要在講台上嘲笑民間信仰，不要說長輩「拜的都是鬼」來羞辱人，更不要論斷過世的親人。事先陪新信徒想好怎樣不拜也盡孝；陪喪親的人哀傷，把亡者交託給神。"},{"id":"ISS01_9","t":"1:20「創世以前是預先被神知道的」——十字架是神的 A 計畫還是 B 計畫？","r":"1:19--20；弗 1:4；啟 13:8","ch":[1],"why":"1:20 說基督「在創世以前是預先被神知道的」。很多人會問：如果十字架在創世以前就定了，那麼人犯罪是不是也在神的計畫裡？神是不是罪的作者？反過來，如果十字架只是神對人犯罪的補救，神是不是被人的選擇逼著改變計畫？這一題牽動人怎樣看神的主權、良善與自己的價值。","pos":[["【一】經文問的是甚麼","","<p>「乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血。基督在創世以前是預先被神知道的，卻在這末世才為你們顯現」（1:19--20）。「預先被神知道」與 1:2「先見」同一個字根；「創世以前」與「末世」對照：永恆的心意落在歷史的一刻。問題是：十字架是神永恆的心意，還是神看見人犯罪之後的應變？</p>"],["補救說：十字架是神對人犯罪的回應","","<p>有些講法把十字架說成神的「補救方案」：神原本的計畫是人在伊甸園裡順服，人犯了罪，神才差基督來救。這一說的長處是清楚地保護了神不是罪的作者，人犯罪是人自己的責任，也強調神對人的回應是真實的。</p><p><strong>難處：</strong>1:20 明說基督「在創世以前」就預先被神知道，弗 1:4 也說神「從創立世界以前」在基督裡揀選了我們；若十字架只是應變，神就像一位被人逼著改計畫的神，這與彼得要給寄居者的安慰正好相反。</p>"],["永恆心意說：十字架是創世以前就定的心意","","<p>另一說照 1:20 讀：神在創世以前就定意差基督作贖罪的羔羊；十字架不是 B 計畫，是神永恆的心意，在「末世」顯現出來。這一說高舉神的主權與智慧，也和徒 2:23「他既按著神的定旨先見被交與人」相合。</p><p><strong>難處：</strong>這一說要小心回答「那麼罪是神安排的嗎」：聖經同時說神「不能被惡試探，他也不試探人」（雅 1:13），又說釘死主的人要負責任（徒 2:23）。若講得太快，容易讓人以為人不必為自己的罪負責，或把神講成罪的作者。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義照 1:20 講：十字架不是 B 計畫，是神在創世以前就定意的愛；同時，神不是罪的作者，人要為自己的罪負責。這兩件事聖經都說，本講義兩件都講，不用哲學把其中一件消掉。</strong></p><p>彼得前書在這裡多出來的一筆是「為你們」：永恆的計畫落在歷史裡，歷史的某一刻落在寄居者身上。他們的處境看起來很偶然，救他們的那件事一點也不偶然。揀選與預定的細節回指以弗所書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你困惑，該讓你安心。各家都同意：基督的死不是意外，神的愛在創世以前就已經定意；人的罪是真實的，基督的血更是真實的。</p><p>如果你曾經覺得自己的人生是一連串的錯誤與補救，請你看 1:20：你被救，不是神手忙腳亂想出來的，是他在世界還沒有開始以前就定意要付的價錢。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：十字架不是 B 計畫，是神在創世以前就定意的愛；神不是罪的作者，人要為自己的罪負責，這兩件事都講。揀選與預定回指以弗所書立場二。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有經歷重大失敗、覺得自己「是神計畫裡的錯誤」的人；也有因為家人受苦而質問「這也是神安排的嗎」的人。不要用「一切都是神的旨意」草草回答受苦的人，也不要在講台上把神講成冷冰冰的設計者。陪受苦的人哀哭，陪他看見那位在創世以前就定意為他流血的羔羊。"},{"id":"ISS02_1","t":"2:2「靈奶」——初信的人與成熟的人吃的不一樣嗎？","r":"2:1--3；林前 3:1--2；來 5:12--14","ch":[2],"why":"新約有三處用「奶」作比喻：保羅說「我是用奶餵你們，沒有用飯餵你們」（林前 3:2），希伯來書責備人「成了那必須吃奶、不能吃乾糧的人」（來 5:12），彼得卻命令所有信徒「要愛慕那純淨的靈奶」（2:2）。華人教會常把「奶」與「乾糧」分成初信班與進深班，也常有人被說「還在喝奶」。這一題關係到我們怎樣看自己的屬靈胃口，也關係到教會怎樣設計造就的路。","pos":[["【一】經文問的是甚麼","","<p>「就要愛慕那純淨的靈奶，像才生的嬰孩愛慕奶一樣，叫你們因此漸長，以致得救」（2:2）。問題是：彼得的「奶」是給初信者的淺顯真理，還是每一個信徒一生都要喝的道？λογικὸν（logikon）與 λόγος（logos）同字根，前文 1:23--25 剛講完「神活潑常存的道」；ἄδολον（adolon）是「不摻假的」。這奶是甚麼、給誰喝，決定了這一節是對初信者說的，還是對整個教會說的。</p>"],["階段說：奶是初級的，乾糧是成熟的","","<p>有些解經家把三處經文放在一起讀：奶代表福音的基本道理，乾糧代表較深的教導；初信的人先喝奶，長大以後要能吃乾糧，否則就是停滯不前。這一說的長處是重視成長，也提醒教會不能讓信徒一輩子只聽入門的信息，正如「惟獨長大成人的才能吃乾糧」（來 5:14）。</p><p><strong>難處：</strong>彼得的用法和保羅、希伯來書不一樣。他沒有責備讀者還在喝奶，反而命令他們「要愛慕」奶；而且他的讀者並不全是初信的人。把三處的「奶」當成同一個意思，會把彼得的邀請讀成責備。</p>"],["全程說：奶是神的道本身，每一個信徒一生都需要","","<p>另一些解經家注意到彼得的比喻重點不在「淺」，而在「餓」：嬰孩愛慕奶，是本能的、天天的、不可少的。λογικὸν（logikon）讀作「屬道的」，奶就是神的道本身；不論信主多久，在道面前都是才生的嬰孩。這一說貼近上下文（1:23--25 的道、2:3 嘗過主恩），也解釋了為甚麼彼得對整封信的讀者都這樣說。</p><p><strong>難處：</strong>這一說若講得太快，容易抹掉新約別處確實存在的成熟與不成熟的分別；彼得自己也說「叫你們因此漸長」——奶是要叫人長大的，不是叫人一直停在原地。</p>"],["洗禮教導說：奶指受洗後的初步教導","","<p>也有學者認為彼得前書帶著洗禮講章的色彩，「才生的嬰孩」指剛受洗的人，「奶」指教會給新受洗者的基本教導，早期教會在洗禮後確實有給新信徒奶與蜜的習慣。這一說提醒我們：初信的人需要有人細心餵養，不能丟給他們自己摸索。</p><p><strong>難處：</strong>這一說倚賴對全卷文體的重建，而「洗禮講章」的假設在學界並沒有共識；經文本身沒有提到洗禮的儀式，它的焦點是「嘗過主恩的滋味」的經驗，不是某一個階段的課程。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採全程說為主：彼得的「靈奶」是屬道的、不摻假的奶，是每一個重生的人一生都要愛慕的；它和林前 3:2、來 5:12 用奶比喻淺，是兩種不同的用法。</strong>同時承認成長是真實的：奶的目的是「叫你們因此漸長」。</p><p>所以本講義不用 2:2 羞辱任何人「還在喝奶」，也不把它講成只屬於初信班的經文。教會可以有深淺不同的課程，但每一堂課的目的都一樣：叫人更愛慕神的道，而不是更佩服自己懂得多。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神的道是信徒的食物，人需要在道中長大，長大的目標是「以致得救」那一天的完全。爭的只是比喻用在哪一個階段。</p><p>對你今天最重要的，不是判斷自己在喝奶還是吃乾糧，而是問自己：我還餓嗎？彼得的答案很溫柔：「你們若嘗過主恩的滋味，就必如此」（2:3）。胃口沒了，先回想第一次嘗到恩典的那一天。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:2 的靈奶是屬道的、不摻假的奶，是每一個重生的人一生都要愛慕的，不是只給初信者的淺東西；它和林前 3:2、來 5:12 是兩種不同的比喻用法，成長是真的，但不用奶來羞辱人。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有信主多年卻很久讀不下聖經的人，他最怕聽見的就是「你怎麼還在喝奶」；也可能有剛信主、覺得自己甚麼都不懂的人。不要用奶與乾糧把會眾分等級。陪胃口不好的人從一段短短的經文重新開始，問他「你嘗到甚麼」，不要先問他「你讀了多少」。"},{"id":"ISS02_2","t":"2:5、9「聖潔的祭司」「君尊的祭司」——信徒皆祭司，那還需要牧師嗎？","r":"2:5；2:9；弗 4:11--12；彼前 5:1--4","ch":[2],"why":"2:5 與 2:9 是宗教改革「信徒皆祭司」最重要的經文之一。有人據此說教會不需要按立的牧者，人人都可以講道、施洗、主持聖餐；也有人反過來，把牧師當成一般信徒與神之間的中間人。這一題直接牽動教會怎樣看待牧者、怎樣看待每一個會友的事奉，也牽動在線上團契裡，誰可以帶領、誰可以牧養。","pos":[["【一】經文問的是甚麼","","<p>「被建造成為靈宮，作聖潔的祭司」（2:5）；「是有君尊的祭司」（2:9）。兩處的「祭司」原文 ἱεράτευμα（hierateuma）都是集合名詞：一個祭司團，不是一個一個獨立的祭司。問題是：既然每一個信徒都是祭司，教會裡還有沒有一種特別被設立、負責牧養與教導的職分？同一封信在 5:1--4 對長老說「務要牧養在你們中間神的群羊」（5:2），這兩件事怎樣並存？</p>"],["聖職祭司說：按立的神職人員有特別的祭司職分","","<p>天主教與東正教傳統承認全體信徒有「普通的祭司職」，但認為另有按立的聖職祭司，在聖事中代表基督，主持聖餐，與一般信徒的祭司職有本質上的不同。這一說看重教會的秩序與傳承，也提醒我們聖禮不是隨便的事。</p><p><strong>難處：</strong>新約從來沒有用 ἱερεύς（hiereus）稱呼教會裡的任何一種職分；彼得用祭司的語言描寫的是整個教會，而把他自己稱為「同作長老的」（5:1）。把祭司職分保留給少數人，容易讓一般信徒以為自己不能直接來到神面前。</p>"],["改教說：人人都是祭司，牧者是被設立來裝備祭司的","","<p>路德與多數更正教傳統認為：每一個信徒都可以藉著基督直接來到神面前，也都有把人帶到神面前的責任；但為了秩序與教導，神在教會裡設立牧者、長老，「為要成全聖徒，各盡其職」（弗 4:12）。牧者不是比較高等的祭司，是裝備祭司的人。這一說同時保住每一個人的事奉與教會的牧養。</p><p><strong>難處：</strong>這一說在實際上常常名實不符：口裡說人人都是祭司，聚會裡卻只有台上的人在事奉，台下的人只是觀眾；也有教會把牧者講成不可質疑的權威，這已經不是改教傳統的本意。</p>"],["無聖職說：不需要按立的牧者，一切由弟兄共同承擔","","<p>部分弟兄會與家庭教會傳統主張，既然人人都是祭司，就不應有受薪或按立的牧師；講道、擘餅、牧養由弟兄們按恩賜輪流承擔。這一說非常認真地看待 2:5、2:9，也實際培養出許多會講道、會牧養的平信徒。</p><p><strong>難處：</strong>同一封信明明有長老的職分（5:1--4），保羅與巴拿巴也「在各教會中選立了長老」（徒 14:23）；沒有明確牧養責任的群體，看似人人平等，實際上常常由最強勢的人主導，反而更難問責。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採改教說：信徒皆祭司不是不要牧師，是每一個信徒都是把人帶到神面前的人；牧者與長老是被設立來牧養與裝備這群祭司的，不是站在神與信徒之間的中間人。</strong></p><p>本講義也不在各宗派的聖職制度之間裁判。至於長老的權柄從哪裡來、怎樣的領導已經是轄制，第 5 章與全卷立場有完整的處理：不是轄制，乃是作群羊的榜樣（5:3）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：每一個信徒都藉著耶穌基督來到神面前，「藉著耶穌基督奉獻神所悅納的靈祭」（2:5）；教會需要秩序，也需要每一個人的事奉。爭的是職分的性質與名稱。</p><p>對你今天最重要的，不是你所屬的教會用甚麼頭銜，而是你自己有沒有在作祭司：為一個人禱告，帶一個人來到主面前。長老與屬靈權柄的全卷立場見 ISS00_5；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：信徒皆祭司不是不要牧師，是每一個信徒都是把人帶到神面前的人；牧者與長老被設立來牧養、裝備這群祭司，不是站在神與人之間的中間人，也不轄制群羊。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有被屬靈權柄傷害過、從此不信任任何牧者的人，也可能有覺得自己不夠格、只敢坐著聽的人，還有正在服事、常常被批評的牧者自己。不要用這一題貶低牧者，也不要用它抬高牧者。陪受過傷的人慢慢分辨甚麼是健康的牧養；陪不敢事奉的人從為一個人禱告開始；也為牧者禱告。"},{"id":"ISS02_3","t":"2:8「他們這樣絆跌也是預定的」——神預定人不信嗎？","r":"2:7--8；賽 8:14；羅 9:33","ch":[2],"why":"這是全卷讀起來最硬的一句話。和合本正文作「他們這樣絆跌也是預定的」，註腳作「他們絆跌都因不順從道理」。有人讀成神造了一些人專門去不信；有人因此擔心自己或家人是不是被預定絆跌；也有人用它解釋為甚麼傳福音沒有果效。這一題不只是神學辯論，它直接碰到為家人禱告多年的人心裡最深的害怕。","pos":[["【一】經文問的是甚麼","","<p>「他們既不順從，就在道理上絆跌；他們這樣絆跌也是預定的」（2:8）。原文 εἰς ὃ καὶ ἐτέθησαν（eis ho kai etethēsan），「他們也是被放在這事上的」。問題有兩層：第一，「預定」的對象是甚麼——是他們的不信，還是不信之後的絆跌？第二，ἀπειθοῦντες（apeithountes）「不順從」是主動分詞，責任在誰？這一節和 2:6 神「安放」房角石是同一個動詞。</p>"],["預定不信說：神預定某些人不信","","<p>部分改革宗傳統（尤其墮落前預定論）把這一節讀成雙重預定的證據：神不只揀選一些人得救，也預定另一些人絆跌、不信。他們會引羅 9 章窯匠與泥的比喻，強調神的主權不受人的決定限制，也提醒人得救全是恩典。</p><p><strong>難處：</strong>彼得在同一句話裡先說「他們既不順從」，把原因放在人的不順從上；而且整段的重點是安慰被毀謗的信徒，不是解釋誰會被定罪。把一個上下文是安慰的經文，讀成一套關於別人命運的系統，說得比經文多。</p>"],["預定結果說：神定下的是「不順從的人必絆跌」","","<p>許多解經家認為 εἰς ὃ（eis ho）「這」最自然的先行詞是整個「絆跌」：神定下了一個屬靈的定律——拒絕這塊石頭的人，必在這塊石頭上絆倒。人的不信是人的責任，絆跌是神所定的後果。這一說同時保住神的主權（石頭是神安放的，結果是神定的）與人的責任（不順從是他們自己的）。</p><p><strong>難處：</strong>這一說需要把「預定」和「不順從」稍微分開讀；有人認為這樣讀把原文較硬的語氣軟化了，而且它仍沒有回答「為甚麼有人順從、有人不順從」這個更深的問題。</p>"],["註腳讀法：重點在「因不順從」","","<p>cu89t 註腳作「他們絆跌都因不順從道理」，把 τῷ λόγῳ（tō logō）接到後面的「不順從」，整句的重心放在絆跌的原因：不順從神的道。照這個讀法，經文主要是在說明人為甚麼絆跌，而不是說明神怎樣預定。這一讀法提醒我們，和合本的譯者自己也看見了兩種可能。</p><p><strong>難處：</strong>註腳處理的是 τῷ λόγῳ（tō logō）接哪一個字，並沒有讓 ἐτέθησαν（etethēsan）這個動詞消失；「被放」「被安排」這個字仍然在那裡，還是要回答它被安排的是甚麼。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採預定結果說：神定下的是「不順從的人必絆跌」這個結果，不是叫我們去猜誰被預定不信；註腳的讀法也指向同一個方向——絆跌的原因是不順從。</strong></p><p>揀選與預定的大題，本講義沿用以弗所書立場二，不在本章另立說法。彼得前書在這裡只多一筆：同一塊石頭，對信的人是根基，對不信的人是絆腳石；石頭沒有變，變的是人怎樣對待它。那個曾被主說「你是絆我腳的」（太 16:23）的彼得，後來成了引人來到房角石面前的人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：基督是神所揀選、所寶貴的房角石；信靠他的人必不至於羞愧；人的不信要自己負責；得救全是恩典。爭的是神的主權與人的責任怎樣並存。</p><p>如果你正在為不信的家人禱告，請你不要從這一節推出他「可能被預定了」。我們不知道誰會回頭，我們只知道主說過：「到我這裡來的，我總不丟棄他」（約 6:37）。門還開著，石頭還在那裡。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:8 神定下的是「不順從的人必絆跌」這個結果，不是叫我們去猜誰被預定不信；人的不順從是人的責任，門至今為每一個人開著。揀選與預定的大題回指以弗所書立場二；本講義的全卷立場見 ISS00_9。","care":"會眾席上最容易被這一題刺傷的，是為不信的配偶、父母、兒女禱告了很多年的人；他聽見「預定絆跌」，會以為自己的禱告白費了。不要在講台上或小組裡用這一節評論任何一位具體的人，更不要說「他大概是被預定的」。陪他繼續禱告，陪他用品行和愛等候；也陪那些擔心「我是不是被預定不信」的人看見：會擔心這件事的人，正是還想來到主面前的人。"},{"id":"ISS02_4","t":"2:9--10 把以色列的稱號用在教會——教會取代以色列了嗎？","r":"2:9--10；出 19:5--6；何 2:23；羅 11:1--2","ch":[2],"why":"「被揀選的族類」「有君尊的祭司」「聖潔的國度」「屬神的子民」，四個名字全是舊約給以色列的，彼得把它們給了一群多數是外邦人的信徒。教會歷史上，這幾節常被拿來支持「教會取代以色列」，並進一步推出「猶太人已被神丟棄」的結論，這種推論曾經成為歧視甚至迫害猶太人的藉口。這一題不只是末世論的分歧，更關係到我們怎樣說話才不傷害一個民族。","pos":[["【一】經文問的是甚麼","","<p>「惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民」（2:9）；「你們從前算不得子民，現在卻作了神的子民」（2:10）。這些字句來自出 19:5--6、賽 43:20--21 與何西阿書。問題是：彼得把這些名字用在教會身上，是說教會「取代」了以色列，還是說外邦人被「加入」了神的子民，還是說這是同一位神的計畫在不同階段的展開？</p>"],["取代論：教會取代了以色列成為神的子民","","<p>這一說認為以色列因為拒絕彌賽亞，失去了作神子民的特殊地位；舊約給以色列的應許，如今由教會承受。支持者會引 2:9--10、加 6:16 與太 21:43，強調在基督裡只有一個神的子民。這一說在教會歷史上相當普遍。</p><p><strong>難處：</strong>它很難解釋保羅在羅 11 章的話：「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1），以及「神的恩賜和選召是沒有後悔的」（羅 11:29）。而且這一說在歷史上常被推成反猶的結論，這是它最沉重的難處。</p>"],["時代論：以色列與教會是兩個不同的子民","","<p>這一說認為神對以色列與對教會各有不同的計畫：教會是在以色列暫時被擱置的時期中被建立的，舊約給以色列民族與土地的應許，將來仍要在以色列身上字面地應驗。彼得用以色列的稱號，只是類比，不是轉移。這一說非常重視神對以色列的信實。</p><p><strong>難處：</strong>彼得說的不是「你們像以色列」，而是「你們是」；而且他說「從前算不得子民，現在卻作了神的子民」，很難只當作類比。把兩個子民分得太開，也容易把末世時間表帶進一段原本在講身分與使命的經文。</p>"],["延續（擴大）論：外邦人被接進同一個神的子民","","<p>這一說認為神只有一個子民，從亞伯拉罕開始，在彌賽亞裡擴大；外邦人像野橄欖枝被接在原來的樹上（羅 11:17），而不是另栽一棵樹。以色列的名字給了外邦信徒，不是因為以色列被丟棄，是因為神的憐憫越過了邊界；神對以色列民族的心意仍然存在。</p><p><strong>難處：</strong>這一說在「以色列將來的角色」上，各家仍有不同的看法，未必能給出一個完整的答案；也有人覺得它在神學上不如前兩說清楚，需要在羅 11 章的奧祕面前保持謙卑。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義對教會與以色列的關係並陳各說，不在講台上定案；但明確不採取代論常被推出的反猶結論：神沒有丟棄以色列，猶太人不是被咒詛的民族。</strong></p><p>彼得自己是猶太人，他在 2:9--10 要說的重點不在誰被取代，而在神的憐憫擴大了：從前沒有名分的外邦人，現在被神起了新名字。這四個名字也不是勳章，是任務——「要叫你們宣揚那召你們出黑暗入奇妙光明者的美德」（2:9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神是信實的，他對亞伯拉罕的應許沒有落空；外邦人得救全是憐憫；耶穌是猶太人，也是萬民的救主。爭的是以色列在神將來計畫中的位置。</p><p>對你今天最重要的，是 2:10 那句話：「從前未曾蒙憐恤，現在卻蒙了憐恤」（2:10）。一個知道自己是蒙憐恤的人，不會用神的憐憫去看輕任何一個民族。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：教會與以色列的關係，取代論、時代論、延續論並陳，講台不定案；但本講義不採取代論的反猶推論——神沒有棄絕他的百姓，2:9--10 的重點是神的憐憫擴大到外邦人身上。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有猶太背景的慕道朋友，也可能有對以色列、對末世非常熱心的長輩，還有對國際局勢有強烈看法的人。不要在講台上把這一題和任何國際衝突、政治立場掛鉤，也不要嘲笑任何一種末世觀。陪熱心的人回到經文的重點：憐憫；陪困惑的人看見：神的信實，正是我們自己得救的保證。"},{"id":"ISS02_5","t":"2:11「你們是客旅，是寄居的」——基督徒可以愛自己的國家、參與社會嗎？","r":"2:11--12；耶 29:7；腓 3:20","ch":[2],"why":"彼得說信徒是「客旅」、是「寄居的」，保羅說「我們卻是天上的國民」（腓 3:20）。有人因此認為基督徒不該熱衷地上的事，愛國、投入公共事務都是屬世的；也有人認為正因為是天上的國民，才更該在地上作光作鹽。國度321空中團契的弟兄姊妹散在不同國家，有人是移民、有人是移工、有人在本地生根，這一題每個人都會碰到。","pos":[["【一】經文問的是甚麼","","<p>「親愛的弟兄啊，你們是客旅，是寄居的」（2:11）；「你們在外邦人中，應當品行端正」（2:12）。πάροικος（paroikos）是有居留、沒有公民權的人。問題是：「寄居」是叫人和社會保持距離，還是叫人在社會裡用另一種方式活？彼得的讀者沒有搬家，他接著講的是怎樣在城裡、在制度裡、在家裡生活（2:13--3:7）。</p>"],["分離說：寄居的人不必投入地上的事","","<p>部分敬虔傳統與重洗派傳統強調教會是「另一個國度的群體」，不應被國家、政治與社會潮流同化；信徒的首要責任是活出教會的樣子，而不是改變社會。這一說對抗了把信仰和國族綁在一起的危險，也提醒我們心裡的王座只有一位。</p><p><strong>難處：</strong>彼得沒有叫讀者退出城市，他叫他們「在外邦人中」品行端正，好到別人看得見（2:12）；若把寄居講成冷漠，很容易對鄰舍的苦難、城市的公義視而不見。</p>"],["轉化說：基督徒要積極參與、轉化社會","","<p>另一些傳統（例如改革宗的文化使命觀）認為基督是萬有的主，信徒應當在教育、政治、商業、藝術各領域裡活出神的心意，讓社會更接近神的公義與美善。他們常引先知耶利米的話：「我所使你們被擄到的那城，你們要為那城求平安，為那城禱告耶和華」（耶 29:7）。</p><p><strong>難處：</strong>轉化的熱情若不小心，容易變成把某一個國家、政黨或政治議程當成神國的代言人；彼得前書的讀者是社會的邊緣人，他沒有給他們掌權的藍圖，只給他們行善的生活。</p>"],["寄居見證說：在地上好好住，但身分屬天","","<p>這一說介於兩者之間：信徒可以愛自己的家鄉、盡公民的本分、參與社會的善事，像寄居的人在一座城裡好好住；但他的忠誠排序很清楚，「敬畏神，尊敬君王」（2:17），沒有任何國家可以佔據他心裡只屬於神的位置。參與社會的目的，是讓人「在鑒察的日子歸榮耀給神」（2:12）。</p><p><strong>難處：</strong>這一說的界線要在每一個具體處境裡分辨，沒有一條公式；甚麼時候是愛家鄉、甚麼時候已經是把國家當偶像，需要群體一起禱告和分辨。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採寄居見證說：寄居不是逃離世界，是在世界裡活出另一個國的樣子；基督徒可以愛自己的家鄉、盡公民的本分、參與社會的善事，但心裡的王座只有一位。</strong></p><p>本講義的講台不作政治動員，不點名任何政黨或政治人物；也提醒：「寄居」是信徒的身分，不是用來對新移民、移工說「你們本來就只是客人」的話。在神面前，每一個信徒都是客旅，也都是屬神的子民。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：信徒真正的戶籍在天上；在地上要行善、要被人看見好行為；沒有任何國家能取代神。爭的是參與的方式與程度。</p><p>你可以愛你的家鄉，也可以為你所住的城市禱告。只是每一次愛它的時候，記得 2:11 的提醒：你是親愛的，你是客旅。書信的處境與原則見全卷立場 ISS00_1；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：寄居不是逃離世界，是在世界裡活出另一個國的樣子；基督徒可以愛家鄉、盡公民本分、參與社會的善事，但敬畏只屬於神，講台不作政治動員。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有離鄉多年、在異地覺得自己哪裡都不屬於的移民與移工，也可能有對國家前途非常焦慮、或非常熱心的人。不要用「寄居」叫人冷漠，也不要用愛國的標準衡量誰比較屬靈。陪覺得無家的人看見他在神面前有名字；陪焦慮的人把城市的平安帶到禱告裡；陪熱心的人記得心裡的王座只有一位。"},{"id":"ISS02_6","t":"2:13--17「順服人的一切制度」——政府叫我做違背良心的事怎麼辦？","r":"2:13--17；徒 5:29；羅 13:1--7","ch":[2],"why":"彼得寫「要順服人的一切制度」時，在羅馬作皇帝的可能是尼祿；同一個彼得也曾在公會面前說「順從神，不順從人，是應當的」（徒 5:29）。今天的信徒生活在各種不同的制度下：有的政府保障信仰自由，有的限制聚會、限制傳福音，有的要求公民參與違背良心的事。這一題關係到信徒每天的選擇，也很容易在教會裡變成政治立場的對立。","pos":[["【一】經文問的是甚麼","","<p>「你們為主的緣故，要順服人的一切制度」（2:13）。順服的理由寫在經文裡：「為主的緣故」；政府的目的也寫在經文裡：「罰惡賞善」（2:14）；態度的次序寫在 2:17：「敬畏神，尊敬君王」（2:17）。問題是：當人的制度要求信徒做神禁止的事，或禁止神吩咐的事，「為主的緣故」是叫人繼續順服，還是成了順服的界線？</p>"],["絕對順服說：除非被迫否認信仰，否則一律順服","","<p>這一說強調羅 13:1「在上有權柄的，人人當順服他」與 2:13 的「一切」，認為信徒的本分是守法、納稅、為在位者禱告，政府的對錯交給神審判；只有在被直接要求否認基督時，才可以不順從。這一說重視秩序，也避免教會被捲入權力鬥爭。</p><p><strong>難處：</strong>「為主的緣故」本身就是界線；若政府要求的是欺壓鄰舍、作假見證或傷害無辜，絕對順服很容易變成沉默的同謀。教會歷史上，也有信徒因為這種讀法而對嚴重的不公義保持沉默。</p>"],["良心不服從說：溫柔地拒絕，並承擔後果","","<p>這一說以徒 5:29 為範本：使徒們沒有暴動，也沒有停止傳福音；他們拒絕命令，挨了打，仍然歡喜地離開。信徒在平常的日子尊重法律、尊敬在位的人；但當命令違背神的話，他以溫柔與敬畏拒絕，並承擔後果，不以惡報惡。這一說與 2:15「行善堵口」、2:23「交託那按公義審判人的主」最一致。</p><p><strong>難處：</strong>甚麼是「違背良心」，需要分辨：有些是明確的（否認基督、傷害無辜），有些是灰色的；也有人擔心這一說太被動，面對系統性的不公義時，信徒是否只能承擔後果，不能做更多。</p>"],["正當抵抗說：在極端情況下可以合法地抵抗","","<p>部分改教傳統（例如加爾文派的「下級官員」理論）認為，當掌權者嚴重違背神設立政府的目的（罰惡賞善），其他合法的權柄可以起來約束他；二十世紀也有信徒在極權政權下選擇抵抗，例如朋霍費爾。這一說嚴肅看待 2:14 政府存在的目的。</p><p><strong>難處：</strong>彼得前書本身沒有給讀者任何抵抗的指示，他的讀者是沒有權力的寄居者；這一說若被輕易使用，很容易讓個人的政治立場披上屬靈的外衣，也與 2:23 不以惡報惡的榜樣產生張力。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採良心不服從說：順服的理由是主，界線也是主。平常的日子，信徒守法、納稅、尊敬在位的人、為他們禱告；當人的命令要人否認主、或要人作惡，彼得自己的話是答案——「順從神，不順從人，是應當的」（徒 5:29），而且是溫柔地拒絕、承擔後果。</strong></p><p>本講義的講台不點名任何政黨、政治人物或政策，不作政治動員，不為任何政權背書，也不叫會眾仇視任何政權；只講 2:17 的次序：只有神得到「敬畏」，君王得到的是「尊敬」，和眾人一樣。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神是至高的主，政府是人設立的制度，信徒要尊敬人、敬畏神；在一般的事上守法；在被要求否認基督時不可順從。爭的是灰色地帶的分辨與抵抗的方式。</p><p>不論你生活在哪一種制度下，彼得給的姿態都一樣：好好作公民，心裡的王座只有一位。順服的全卷立場見 ISS00_3；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：順服的理由是主，界線也是主；平常守法、尊敬在位的人，當人的命令要人否認主或作惡，照徒 5:29 溫柔地拒絕、承擔後果。講台不點名政黨或政治人物、不作政治動員。本講義的全卷立場見 ISS00_3。","care":"國度321空中團契的弟兄姊妹散在不同國家、不同制度下，有的可以自由聚會，有的要小心翼翼；有人對政府很信任，有人受過傷。不要用自己所在國家的處境去論斷別處的弟兄姊妹怎樣選擇，也不要在群組裡轉傳政治動員的訊息。陪在壓力下的人一起禱告、一起分辨；陪立場不同的人記得：「親愛教中的弟兄」（2:17）排在政治立場前面。"},{"id":"ISS02_7","t":"2:18「就是那乖僻的也要順服」——新約為奴隸制背書嗎？職場霸凌、欠薪怎麼辦？","r":"2:18--20；林前 7:21；門 1:16；提前 1:10","ch":[2],"why":"十九世紀美國南方的牧師曾用這類經文為奴隸制辯護；今天也仍有人用 2:18 對被霸凌、被欠薪、被性騷擾的員工說「這是你的十字架」。另一方面，也有人因為這幾節經文，覺得聖經在道德上落後，因此對信仰產生懷疑。這一題同時保護兩種人：在職場受欺壓的人，與因為經文而對神失去信任的人。","pos":[["【一】經文問的是甚麼","","<p>「你們作僕人的，凡事要存敬畏的心順服主人；不但順服那善良溫和的，就是那乖僻的也要順服」（2:18）。Οἱ οἰκέται（Hoi oiketai）是家中的僕人，當時在法律上是奴隸，沒有離職的自由。2:19 接著說「忍受冤屈的苦楚」，「冤屈」原文 ἀδίκως（adikōs），「不公義地」。問題是：彼得是在肯定這個制度，還是在對沒有選擇的人說話？這些話又怎樣落在今天有法律、有申訴、有離職自由的人身上？</p>"],["制度肯定說：新約接受奴隸制為社會秩序的一部分","","<p>歷史上有人主張：新約多處吩咐僕人順服主人，卻沒有明文廢除奴隸制，可見神容許這個制度存在；信徒的責任是在制度中做好本分，不是改變制度。這一說曾在十八、十九世紀被用來反對廢奴運動。</p><p><strong>難處：</strong>這一說忽略了新約清楚的方向：「若能以自由，就求自由更好」（林前 7:21）；保羅請腓利門收回阿尼西母，「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）；搶人口被列在罪的清單裡（提前 1:10）。而且彼得自己把主人的對待定性為「不公義」。這一說在今天已被絕大多數基督徒拒絕。</p>"],["處境牧養說：彼得對沒有選擇的人說話，不是為制度背書","","<p>多數解經家認為：彼得是對當時無法改變處境的家僕說話，教他們在不能改變的處境裡怎樣活，而不是說這個處境是對的。值得注意的是，他直接對家僕說話，把他們當成能作道德選擇的人，這在當時的家規裡很少見；他給他們的不是一套忍耐的技巧，而是一位也被冤枉過的基督（2:21--24）。</p><p><strong>難處：</strong>這一說解釋了彼得為甚麼這樣說，卻還需要回答今天的人怎樣應用：處境不同的時候，原則怎樣落地？若只停在「當時沒有選擇」，有人會把它變成「所以這段跟我無關」。</p>"],["福音種子說：福音的原則最終瓦解了奴隸制","","<p>這一說認為新約沒有發動社會革命，卻埋下了瓦解奴隸制的種子：在基督裡「並不分猶太人、希臘人，自主的、為奴的，或男或女」（加 3:28）；主人和奴僕同有一位在天上的主（弗 6:9）；每一個人都是按神的形像造的。後來的廢奴運動中，有許多信徒正是從這些原則出發。</p><p><strong>難處：</strong>種子長成大樹花了將近十八個世紀，期間許多信徒並沒有活出這個原則；這一說誠實地承認教會的失敗，也提醒我們今天仍可能對眼前的不公義視而不見。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境牧養說，並肯定福音種子說的方向：新約沒有為奴隸制背書；2:19 的「冤屈」就是不公義，彼得沒有說乖僻的主人是對的。今天有法律、勞動申訴、離職自由的人，使用它們不違背 2:18。</strong></p><p>教會絕不為霸凌、欠薪、性騷擾或任何剝削找屬靈的理由；今天的雇傭是雙方自由訂立的契約，不可以原封不動套用家僕的處境。2:18 留給今天的原則是：為主的緣故誠實做事，在冤屈裡不以惡報惡，把審判交給神——這與尋求公義的管道並不衝突。職場與欺壓的處理，回指雅各書立場三。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑神的公義，反而該讓你看見神站在誰那一邊。彼得對社會最底層的人說：神看見你的冤屈，稱它為恩典（2:20）；基督也為你們受過苦，他背上也有鞭傷（2:24）。各說都同意：人的尊嚴來自神，欺壓是罪。</p><p>如果你正在職場受欺壓，你可以為主的緣故好好做事，也可以把事實記下來、尋求幫助。這兩件事可以同時做。順服的全卷立場見 ISS00_3；受苦的分辨見 ISS00_2。</p>"]],"con":[],"say":"本講義的立場：新約沒有為奴隸制背書；2:19 的冤屈就是不公義，教會絕不為霸凌、欠薪、性騷擾找屬靈理由；今天有法律、申訴、離職自由的人，使用它們不違背 2:18。本講義的全卷立場見 ISS00_3、ISS00_2；職場欺壓回指雅各書立場三。","care":"會眾席上可能正坐著一位被主管霸凌、被拖欠薪水、被騷擾卻不敢說的人，也可能有在異地工作、證件被雇主扣住的移工或家庭幫傭。不要對他說「這是你的十字架」「要用愛感化老闆」，更不要暗示他是因為自己不好才被欺負。陪他把事實記下來，陪他找勞工單位、法律協助或可信任的專業人士；必要時，教會要實際地站在他身邊。也記得會眾席上有作老闆、作主管的人：2:18 對他們同樣是提醒——「乖僻」不是可以被容忍的領導風格。"},{"id":"ISS02_8","t":"2:21「跟隨他的腳蹤行」——學耶穌受苦，是要人自找苦吃嗎？","r":"2:21--23；4:15--16；太 26:52","ch":[2],"why":"2:21 是全本新約最具體的「榜樣」經文：字帖與腳印。教會歷史上，有人因此主動尋求殉道、苦待己身，認為越苦越像基督；今天也有人用這一節勸受欺壓的人「學耶穌，忍下去」。另一方面，也有人把這一節講得太輕，好像跟隨只是一種好的態度。這一題關係到受苦的人怎樣被牧養，也關係到 321「耶穌是我的榜樣」怎樣被正確地講。","pos":[["【一】經文問的是甚麼","","<p>「你們蒙召原是為此；因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行」（2:21）。ὑπογραμμὸν（hypogrammon）是孩子描的字帖，ἴχνεσιν（ichnesin）是腳印。字帖上寫的是 2:22--23：沒有詭詐、被罵不還口、受害不威嚇、交託。問題是：我們要效法的是「受苦」本身，還是在不公義的受苦裡回應的方式？基督的受苦有沒有我們不能效法的部分？</p>"],["效法受苦說：越像基督受苦，越接近基督","","<p>早期教會有些殉道者把為主受死看為最高的效法，安提阿的伊格那丟在赴死途中寫信，請羅馬的信徒不要營救他；中世紀也有苦修傳統以禁食、鞭笞己身來效法基督的苦難。這一說認真看待「蒙召原是為此」，也提醒我們跟隨基督是有代價的。</p><p><strong>難處：</strong>彼得說的受苦是「因行善受苦」（2:20），是被別人加上的冤屈，不是自己去尋找的痛苦；4:15 他也說不可因作惡受苦。把受苦本身當成目標，容易讓人自己製造苦難，或讓受苦的人以為苦越多越屬靈，這與彼得的牧養方向相反。</p>"],["回應方式說：效法的是在冤屈中的回應","","<p>多數解經家認為：2:21 的榜樣具體寫在 2:22--23——不犯罪、口裡沒有詭詐、不還口、不威嚇、交託公義的審判者。我們效法的不是去受苦，而是當不公義的苦臨到時，怎樣不以惡報惡。主在客西馬尼園對彼得說「收刀入鞘吧」（太 26:52），這是同一張字帖。</p><p><strong>難處：</strong>這一說若講得太快，容易被誤解為「受欺壓時只要態度好就好」，忽略了受苦的人也可以離開危險、尋求保護；也可能把跟隨基督縮小成一套情緒管理，失去「蒙召原是為此」的分量。</p>"],["救主先於榜樣說：我們效法的那一位，先是替我們擔當罪的那一位","","<p>這一說強調 2:21 的 ὑπὲρ ὑμῶν（hyper hymōn）「為你們」與 2:24 的「親身擔當了我們的罪」：基督的受苦有一部分是獨一的、替代的，我們不能也不必效法——我們不能為別人的罪受苦。我們能跟隨，是因為他先擔當了我們；榜樣建立在救恩上，不是倒過來。</p><p><strong>難處：</strong>這一說若只強調救主而淡化榜樣，容易讓跟隨變得可有可無；彼得明明說「給你們留下榜樣」，字帖是要描的，腳印是要踩的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義綜合後兩說：基督先是救主，然後是榜樣；我們效法的不是去受苦，是在不公義的受苦臨到時，不以惡報惡、不威嚇、把審判交給神。跟隨他的腳蹤，不是叫人自找苦吃，也不是叫人留在危險裡。</strong></p><p>本講義分辨四種苦：因犯罪受苦，不是彼得要安慰的；因行善受苦、為義受苦、為基督的名受苦，還有百般的試煉，是他要安慰的。受苦的人可以憂愁、可以求助；離開危險、尋求法律保護，與跟隨那串腳印並不衝突。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：基督為我們受了苦；跟隨他是有代價的；神看見因行善受的苦。爭的是效法的範圍與方式。</p><p>如果你正在受苦，請你先聽 2:24，再聽 2:21：那位要你跟著走的，先背了你的重擔。他沒有要你證明自己能吃多少苦，他要你知道你不是一個人走。受苦的全卷立場見 ISS00_2；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：基督先是救主，然後是榜樣；跟隨他的腳蹤，是在冤屈中不以惡報惡、把審判交給神，不是叫人自找苦吃，也不是叫人留在危險裡。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有正在受欺壓、被人用「學耶穌忍耐」勸留在危險裡的人，也可能有覺得自己苦得不夠、不夠屬靈而苦待自己的人。不要把受苦講成屬靈等級，也不要對受苦的人說「你受苦是因為你有罪」。陪他說出自己的痛，允許他憂愁；必要時陪他求助、離開危險；然後一起看那串腳印：前面那一位，背上也有傷。"},{"id":"ISS02_9","t":"2:24「因他受的鞭傷，你們便得了醫治」——是身體的醫治，還是罪的醫治？","r":"2:24--25；賽 53:4--6；太 8:16--17","ch":[2],"why":"2:24 是華人教會醫病禱告最常引用的經文之一，有人在病床邊宣告「因他受的鞭傷，你已經得了醫治」，並教導醫治已經包含在贖罪裡，只要有信心就必痊癒。另一方面，長期病痛、禱告多年沒有好轉的弟兄姊妹，常常因此懷疑自己的信心有問題。這一題直接碰到病床邊最脆弱的人。","pos":[["【一】經文問的是甚麼","","<p>「他被掛在木頭上，親身擔當了我們的罪，使我們既然在罪上死，就得以在義上活。因他受的鞭傷，你們便得了醫治」（2:24）。μώλωπι（mōlōpi）是鞭打留下的腫痕，引自賽 53:5。問題是：這裡的「醫治」是指身體的疾病，還是指罪的醫治？或者兩者都在其中？醫治是現在就保證的，還是要等到將來完全？</p>"],["贖罪包含醫治說：身體醫治是贖罪的一部分","","<p>部分靈恩與全備福音傳統認為，基督在十字架上不只擔當罪，也擔當疾病；馬太說主醫治病人，「這是要應驗先知以賽亞的話，說：他代替我們的軟弱，擔當我們的疾病」（太 8:17）。所以信徒可以憑信心領受身體的醫治。這一說喚醒了許多教會為病人禱告的信心，也見證過神的醫治。</p><p><strong>難處：</strong>彼得在 2:24 的上下文是罪：「使我們既然在罪上死，就得以在義上活」；而若醫治已經在贖罪中保證，就很難解釋為甚麼保羅留下特羅非摩病著（提後 4:20），也很容易推出「沒好是因為信心不足」的錯誤結論。</p>"],["罪的醫治說：2:24 的醫治是屬靈的","","<p>多數解經家認為，2:24 的上下文從頭到尾都在講罪：擔當罪、在罪上死、在義上活、迷路的羊歸回牧人（2:25）。彼得對家僕說話，他們的鞭痕不一定會消失，但他們的罪被赦免、羞恥被醫治、靈魂有了牧人。以賽亞書 53 章本身也是以罪與過犯為中心。</p><p><strong>難處：</strong>這一說若講得太絕對，容易把聖經裡的醫治全部「屬靈化」，好像神不關心身體；太 8:17 確實把同一章用在身體的疾病上，福音書裡耶穌也醫治了許多人的身體。</p>"],["已然未然說：醫治已經開始，完全在將來","","<p>這一說認為基督的救贖最終要醫治整個人，包括身體：復活的時候，身體要完全得贖（羅 8:23）。現在，神有時在今生醫治身體，作為將來的預嘗；但完全的醫治要等到主再來。2:24 的重點在罪的醫治，而罪的醫治是全人醫治的根基。</p><p><strong>難處：</strong>這一說需要在「現在」與「將來」之間保持張力，沒有一條公式告訴我們神在甚麼時候醫治誰；對正在病床邊的人來說，「將來」有時聽起來太遠。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採罪的醫治說，並肯定已然未然說的盼望：2:24 的醫治上下文是罪——「在罪上死，就得以在義上活」；這一節不保證身體一定痊癒，也絕不可以說沒有得醫治的人是信心不夠。</strong></p><p>神當然可以醫治身體，生病的人該求醫，也可以求神醫治，兩者並行。疾病與醫治的完整處理，本講義回指雅各書立場四。彼得前書在這裡只多一筆：受冤屈、受鞭打的人最深的傷，是羞恥與罪；那一位背上有同樣的痕，醫治了它。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：基督親身擔當了我們的罪；神是醫治的神；最終我們要得著復活的身體。爭的是 2:24 這一節的焦點與醫治的時間。</p><p>如果你長期病痛、禱告多年沒有好轉，請你聽清楚：你沒有被神遺忘，也不是信得不夠。你已經得了最深的醫治——罪不再定你的命運；而那一位牧人，正在看顧你的靈魂（2:25）。受苦的全卷立場見 ISS00_2；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:24 的醫治上下文是罪——在罪上死、在義上活；這一節不是身體痊癒的保證，沒有痊癒的人也不是因為信心不夠；神可以醫治身體，求醫與禱告並行。疾病與醫治回指雅各書立場四；本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有長期病痛的人、照顧重病家人的人，也可能有曾經在醫病聚會裡被責備「信得不夠」而受傷的人。不要在病床邊宣告保證，也不要勸人停藥或放棄治療。陪病人禱告，也陪他看醫生；允許他問「為甚麼」；讓他知道，不論身體怎樣，他在主裡已經被接納、被看顧。"},{"id":"ISS03_1","t":"3:1--6「作妻子的要順服自己的丈夫」——順服是甚麼意思？受暴力的妻子怎麼辦？","r":"3:1--6；2:13；3:7","ch":[3],"why":"3:1--6 是全卷最常被誤用的一段經文：它曾被拿來勸受暴力的妻子回家「用品行感化他」，也曾被拿來證明丈夫可以說了算。會眾席上正有活在打罵、威脅、經濟與精神控制裡的姊妹，也有用這段經文要求妻子沉默的丈夫。這一題不只是解經題，是保護人的題目，必須講清楚順服的理由與界線。","pos":[["【一】經文問的是甚麼","","<p>3:1 以「同樣」開頭，接回 2:13 的總綱：「你們為主的緣故，要順服人的一切制度」（2:13）。彼得對妻子說了六節，對丈夫說了一節（3:7），而且他寫給的是一位「不信從道理的丈夫」的妻子——在當時，妻子要拜丈夫的神，這位妻子卻在最要緊的事上沒有跟丈夫走，彼得也沒有叫她回頭。經文問的是：這裡的「順服」是甚麼？它有沒有界線？當丈夫用暴力、恐嚇、控制對待妻子時，這段經文還要她留下嗎？</p>"],["秩序說：順服是神設立的家庭秩序，妻子當順服丈夫的帶領","","<p>傳統保守派與部分互補派認為，3:1、3:5 的 ὑποτασσόμεναι（hypotassomenai）指妻子在婚姻中自願順從丈夫的帶領，這是神設立的秩序，不只是一世紀的文化。這一說的長處是嚴肅看待經文的命令，不把不舒服的經文一律推給文化背景。</p><p><strong>難處：</strong>若把順服講成無條件的，就和彼得自己的話衝突——同一段的界線是「為主的緣故」（2:13），3:6 又說「不因恐嚇而害怕」；彼得自己在公會面前說「順從神，不順從人，是應當的」（徒 5:29）。無條件的順服，正是過去有些教會叫受暴的妻子回家的根源。</p>"],["宣教處境說：順服是在不信者權下的見證策略，不是永久的階級","","<p>不少註釋家（互補與平等兩派都有）指出，這段家規處理的是「不信的上位者」：順服的目的寫在經文裡——不信的丈夫「也可以因妻子的品行被感化過來」（3:1）。在異教社會裡，彼得要信徒不給福音添不必要的絆腳石；平等派更進一步認為，新約的方向是「以謙卑束腰，彼此順服」（5:5），家規是當時文化裡的宣教智慧。</p><p><strong>難處：</strong>若只剩策略，順服就成了手段，不再是「為主的緣故」；而且彼得在 3:5--6 舉了古時聖潔婦人和撒拉的例子，不只是在講策略，這一說若處理得太快，容易把經文難的部分一筆帶過。</p>"],["界線說：順服在「為主的緣故」之內，恐嚇與暴力在界線之外","","<p>許多牧養取向的解經者注意到，3:6 用撒拉的女兒來定義姊妹的兩個記號：「你們若行善，不因恐嚇而害怕，便是撒拉的女兒了」（3:6）。πτόησιν（ptoēsin）新約只此一次，是叫人心驚膽跳的威脅。被恐嚇出來的服從，不是 3:1 的順服；順服是回到本位，不是放棄人格，更不是留在危險裡。這一說也強調講 3:1--6 必講 3:7。</p><p><strong>難處：</strong>界線說若講過頭，可能讓人把一切不愉快都稱為「恐嚇」，把順服整個取消；它需要和前兩說一起，承認經文確實對妻子有一個真實的呼召，同時清楚指出那個呼召的邊在哪裡。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：一切順服都是「為主的緣故」——理由是主，界線也是主；順服不等於同意、不等於沉默、不等於留在危險裡。</strong>「不因恐嚇而害怕」（3:6）就是彼得自己畫下的界線。人身安全受到威脅時——肢體暴力、性暴力、威脅生命、嚴重的精神與經濟控制——先保護自己和孩子的生命，向可信任的人、教會、社工、警方求助，依法申請保護令；這樣做不違背 3:1--6。</p><p>講 3:1--6 必講 3:7：丈夫要按情理同住、要敬重她，她是「與你一同承受生命之恩的」（3:7）。互補派與平等派都是弟兄姊妹，本講義不在其間裁判；兩派都必須同意上面這些界線。全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>家規的不同讀法不該動搖你的信心；在這些事上看法不同的，都是一同承受生命之恩的弟兄姊妹。但如果你正活在暴力或恐嚇裡，請你聽清楚：神沒有要你留在危險裡，這段經文也沒有。你去求助，不是不屬靈，不是沒有見證；那正是「不因恐嚇而害怕」。</p><p>對每一個在婚姻裡的人，這一題最後要問的是：我在家裡，是用愛與敬重對待對方，還是用權力與懼怕？主耶穌「被罵不還口；受害不說威嚇的話」（2:23）——威嚇從來不是屬他的人該用的工具。</p>"]],"con":[],"say":"本講義的立場：順服是「為主的緣故」，理由是主，界線也是主；順服不等於同意、沉默或留在危險裡。「不因恐嚇而害怕」（3:6）是彼得自己的界線；人身安全受威脅時，先保護生命、依法求助、通報；講 3:1--6 必講 3:7。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有一位正被丈夫打罵、威脅、控制錢財與行蹤的姊妹，她最怕聽到有人說「你要順服，回去感化他」，那不是這段經文的意思。牧者與同工要做的第一件事是保護安全：相信她說的話，評估她和孩子的危險，陪她聯絡家暴保護專線、社工或警方，依法申請保護令；涉及兒少與性暴力的事件依法通報，不在教會內私了，不安排「雙方坐下來談」。不要求她原諒或和好，也不把原諒、和好當作她留在教會、得到幫助的條件；不要說「你檢討一下自己哪裡沒有順服好」「為了孩子忍一忍」「離開就是沒有見證」。對施暴的一方，教會要讓他負責、接受專業處遇，而不是只勸雙方禱告。"},{"id":"ISS03_2","t":"3:1「若有不信從道理的丈夫」——信主的妻子與未信主的丈夫；可以為信仰離婚嗎？","r":"3:1--2；林前 7:12--16","ch":[3],"why":"華人教會裡，配偶未信主的弟兄姊妹非常多，尤其是姊妹。她們在家裡被要求拜拜、被嘲笑、被限制去聚會，有人問：信仰差這麼大，我是不是該離開？也有人被教會暗示「不要再跟他耗了」，或反過來被說「你的丈夫不信是你的責任」。這一題關係到一個家能不能撐下去，也關係到人怎樣看待自己的婚姻誓約。","pos":[["【一】經文問的是甚麼","","<p>3:1 說：「若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來」（3:1）。彼得預設這位妻子仍在婚姻裡，他給她的方法是「不用言語」，叫丈夫「看見你們有貞潔的品行和敬畏的心」（3:2）。但彼得前書沒有直接處理離婚；問題是：信仰的差異本身，是不是離婚的理由？如果不信的一方要離開，或婚姻裡有暴力，又怎麼辦？這需要和保羅在林前 7 章對「與不信者的婚姻」的教導一起讀。</p>"],["持守說：信仰差異不是離婚的理由，信的一方要留在婚姻裡","","<p>多數福音派根據林前 7:12--14 與彼前 3:1--2 認為，信仰差異本身不是離婚的理由：「妻子有不信的丈夫，丈夫也情願和她同住，她就不要離棄丈夫」（林前 7:13）。信的一方留在婚姻裡，本身就是見證，保羅還說不信的丈夫「因著妻子成了聖潔」（林前 7:14）。</p><p><strong>難處：</strong>這一說若只講「不可離」，常被用來把人困在危險的婚姻裡；它也容易讓教會忽略「丈夫也情願和她同住」這個條件——如果不信的一方用暴力、逼迫或離家來拒絕這段婚姻，情況就不一樣了。</p>"],["被離棄說：不信的一方若要離去，信的一方不必拘束","","<p>根據林前 7:15「倘若那不信的人要離去，就由他離去吧！無論是弟兄，是姊妹，遇著這樣的事都不必拘束」（林前 7:15），許多教會傳統認為：信的一方不主動離婚，但若不信的一方堅持離去，信的一方可以接受，不必為了挽回而違背良心。部分學者與教會更認為，長期的暴力與遺棄，實際上就是不信的一方「離去」了這段婚姻的盟約。</p><p><strong>難處：</strong>「離去」的範圍要怎麼界定，各教會看法不一；若解得太寬，任何不愉快都可以說成「被離棄」；若解得太窄，又會叫受暴的人覺得自己沒有出路。離婚後能否再婚，也是另一個需要個別牧養的議題。</p>"],["分居保護說：人身安全受威脅時，分居與保護不等於主動離婚","","<p>不少牧養與輔導取向的教會強調一個在前兩說之間常被忽略的區分：為了安全而分開居住、申請保護令，和為了信仰差異主動離婚，是兩件不同的事。保羅說「若是離開了，不可再嫁，或是仍同丈夫和好」（林前 7:11），可見聖經本身承認有「離開」而尚未離婚的狀態；先保護生命，再慢慢面對婚姻的去留。</p><p><strong>難處：</strong>分居可能拖得很長，當事人處在不上不下的處境，需要教會長期陪伴；而且法律、子女監護、經濟依賴等現實問題，不是一節經文能回答的，需要專業協助。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：信仰的差異本身不是離婚的理由；信主的一方不主動離棄願意同住的配偶，在家裡用品行作見證——這正是 3:1--2 的呼召。</strong>但經文說的是「也可以」被感化，不是保證；配偶信不信主，不是信的一方的成績單。</p><p>若不信的一方堅持離去，信的一方「不必拘束」（林前 7:15）；若婚姻裡有暴力、恐嚇或嚴重的控制，先保護生命、依法求助，為安全而分開不違背 3:1--6。是否離婚、能否再婚，需要牧者與專業人員個別陪伴，講台不替任何一個家庭作決定。婚姻與順服的全卷立場見 ISS00_3；與不信者的婚姻詳見哥林多前書講義第 7 章。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家在「被離棄」的範圍上看法不同，但都同意：神看重婚姻的盟約，也看重每一個人的安全與良心。如果你正在一段配偶不信主的婚姻裡，你不是二等的基督徒，你的家也不是被神放棄的家。</p><p>彼得給你的不是一套說服丈夫的話術，是一個盼望：「心裡隱藏的人」在神面前是極寶貴的。你在家裡每一天的持守，神都看見；他會不會信，交給神，你只管行善，不因恐嚇而害怕。</p>"]],"con":[],"say":"本講義的立場：信仰差異本身不是離婚的理由，信主的一方不主動離棄願意同住的配偶，用品行作見證；不信的一方堅持離去，信的一方不必拘束；有暴力時先保護生命、依法求助。本講義的全卷立場見 ISS00_3。","care":"會眾席上有很多在不信家庭裡持守多年的弟兄姊妹，他們最怕聽到兩種話：一種是「你丈夫不信，是你見證不夠好」，另一種是「早就該離開他了」。不要用任何一種話替他們作決定。陪他們禱告，讓教會成為他們的家，也讓教會的弟兄姊妹成為那位未信配偶願意認識的朋友。若婚姻裡有暴力或控制，先保護安全、陪他求助與通報，不要求以原諒或和好作為幫助他的條件；已經離婚的弟兄姊妹，也不要在講台上被當成反面教材。"},{"id":"ISS03_3","t":"3:3--4「不要以外面的辮頭髮，戴金飾，穿美衣為妝飾」——基督徒女性不可以打扮嗎？","r":"3:3--4；提前 2:9--10","ch":[3],"why":"不少華人教會曾經（有的至今）規定姊妹不可化妝、不可戴首飾、不可燙髮，也有姊妹因為穿著被長輩當眾指正。另一方面，今天的消費文化讓外表成了身分的標記，信徒也被捲進比較與焦慮。這一題要分清楚經文禁止的是甚麼、看重的是甚麼，免得把女性的屬靈程度交給衣櫃來決定。","pos":[["【一】經文問的是甚麼","","<p>彼得說：「你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾，只要以裡面存著長久溫柔、安靜的心為妝飾；這在神面前是極寶貴的」（3:3--4）。「妝飾」原文 κόσμος（kosmos），是整理、裝扮；「長久」就是 ἀφθάρτῳ（aphthartō），不能朽壞的。第三樣「穿美衣」原文只是「穿上衣裳」。問題是：這是一條禁止打扮的規條，還是一種「不是這個，乃是那個」的對比修辭？</p>"],["字面禁令說：基督徒女性不應編髮、戴金飾、追求華麗衣著","","<p>部分聖潔運動傳統與一些保守教會，照字面讀 3:3 與提前 2:9，認為姊妹不應燙髮、化妝、戴首飾；早期教父如特土良也寫過反對女性裝飾的文章。這一說的長處是認真對待經文對外表的警告，也抵擋了把錢和心思花在外表上的虛浮。</p><p><strong>難處：</strong>若是禁令，連「穿上衣裳」都要禁止，這顯然不是彼得的意思；這一說也常常只拿來管女性，卻不管男性的名錶與名車，最後變成用衣著論斷人的屬靈程度。</p>"],["節制說：不禁止打扮，但反對奢華、炫耀與誘惑","","<p>許多註釋家認為，彼得與保羅反對的是當時富裕婦女的奢華裝扮——精緻的編髮夾著金飾、昂貴的衣料，那是炫富與身分的展示。保羅說「以正派衣裳為妝飾，不以編髮、黃金、珍珠，和貴價的衣裳為妝飾」（提前 2:9）。所以重點是節制、端莊、不炫耀，不是全面禁止。</p><p><strong>難處：</strong>「奢華」與「端莊」的標準因文化、時代、經濟而不同，若教會自己定出一條線，又會回到規條；而且這一說仍把焦點放在外面，容易忽略彼得真正要說的是裡面。</p>"],["對比修辭說：「不是……乃是……」說的是重心，不是禁止","","<p>另一些學者指出，「不要以……為妝飾，只要以……為妝飾」是聖經常見的相對對比，就像「不要為那必壞的食物勞力，要為那存到永生的食物勞力」（約 6:27）並不是禁止人工作吃飯。彼得要說的是：你的價值、你的美、你的身分不從外面來，從「心裡隱藏的人」來。</p><p><strong>難處：</strong>這一說若講得太輕，可能讓人以為外表怎麼樣都無所謂，忽略了經文對虛浮與炫耀的真實提醒；對比修辭也仍然帶著一個方向——把心思從外面挪到裡面。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:3--4 的對比是外面與裡面，不是禁止外面；本講義不規定任何人的衣著打扮，也不以衣著判斷一個人的屬靈程度。</strong>彼得真正看重的，是在神面前極寶貴的「長久溫柔、安靜的心」——溫柔不是軟弱，是有力量卻不拿來壓人；安靜不是不准說話，是心裡不慌。</p><p>經文也真實地提醒：不要把身分建立在外表上，不要炫耀，不要被比較綁住；這一點對男性同樣適用。讀這段經文的處境與原則，全卷立場見 ISS00_1；女性與順服的界線見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你可以打扮，也可以不打扮；那都不是你在神面前被接納的理由。神看人的方式從來就和人不同：「人是看外貌；耶和華是看內心」（撒上 16:7）。</p><p>這一題真正要問的是：你最花心思經營的，是哪一個「我」？是鏡子裡的那一個，還是神面前那個「心裡隱藏的人」？外面的妝會卸，裡面的妝是不能壞的。</p>"]],"con":[],"say":"本講義的立場：3:3--4 的對比是外面與裡面，不是禁止外面；不規定衣著，不以打扮論斷屬靈，看重的是在神面前極寶貴的溫柔安靜的心，這提醒男女都適用。本講義的全卷立場見 ISS00_1、ISS00_3。","care":"會眾席上可能有一位曾因為化妝、穿著被長輩當眾指正、從此不敢再進教會的姊妹；也可能有一位對自己的外表極度焦慮、甚至有飲食困擾的年輕人。不要在講台上拿某一位的穿著當例子，也不要用「這樣穿不像基督徒」評論任何人。陪受過傷的姊妹看見：神看她，從來不是從衣服開始；陪為外表焦慮的人看見：心裡隱藏的那個人，在神面前是極寶貴的，必要時也鼓勵他尋求專業協助。"},{"id":"ISS03_4","t":"3:6「撒拉聽從亞伯拉罕，稱他為主」——彼得為甚麼舉這個例子？","r":"3:5--6；創 18:12；創 21:12","ch":[3],"why":"讀過創世記的人都知道，撒拉不是一個凡事都聽話的妻子：她叫亞伯拉罕娶夏甲，又要他把夏甲趕走，而亞伯拉罕兩次為了自保，讓她陷入別人的後宮。彼得為甚麼偏偏舉撒拉作順服的例子？這一題影響我們怎樣讀 3:6，也影響撒拉的例子會不會被拿來要求妻子無條件聽從。","pos":[["【一】經文問的是甚麼","","<p>彼得說：「就如撒拉聽從亞伯拉罕，稱他為主。你們若行善，不因恐嚇而害怕，便是撒拉的女兒了」（3:6）。撒拉稱亞伯拉罕為「主」，舊約只有一次：「撒拉心裡暗笑，說：我既已衰敗，我主也老邁，豈能有這喜事呢」（創 18:12）。那是她在帳棚裡心裡自言自語時說的。問題是：彼得引這個例子，是要妻子學她的稱呼與聽從，還是另有重點？「撒拉的女兒」又是用甚麼來認的？</p>"],["順服典範說：撒拉連心裡都稱丈夫為主，是敬重的典範","","<p>不少傳統解經者認為，撒拉在心裡、在沒有人聽見的地方仍稱亞伯拉罕為「主」，顯出她對丈夫的尊重不是做給人看的；猶太傳統也常把撒拉當作賢妻的典範。彼得正是要姊妹學這份內外一致的敬重，與 3:4「心裡隱藏的人」相呼應。</p><p><strong>難處：</strong>創世記裡的撒拉並不總是聽從，神甚至對亞伯拉罕說「凡撒拉對你說的話，你都該聽從」（創 21:12）；亞伯拉罕兩次讓撒拉陷入危險（創 12、20 章），若把撒拉的「聽從」講成無條件的典範，等於把那兩次的危險也當成榜樣。</p>"],["盼望說：彼得看重的是撒拉「仰賴神」，不是她的稱呼","","<p>另一些學者注意 3:5 的描寫：古時的聖潔婦人是「仰賴神」的人，原文 αἱ ἐλπίζουσαι εἰς θεὸν（hai elpizousai eis theon），直譯是「把盼望放在神身上的」。撒拉是在一個不可能的處境裡——年老、不能生育——被神的應許扶持的女人；彼得挑她，是因為收信的姊妹也在一個看不見出路的家裡，需要把盼望放在神身上，而不是放在丈夫會不會改變上。</p><p><strong>難處：</strong>這一說說明了 3:5，卻沒有完全處理 3:6 明說的「聽從亞伯拉罕，稱他為主」；若只談盼望，容易把經文裡關於妻子對丈夫的呼召一筆帶過。</p>"],["界線說：「撒拉的女兒」是用行善與不怕恐嚇來認的","","<p>還有解經者把重點放在 3:6 的下半句：「你們若行善，不因恐嚇而害怕」。彼得給「撒拉的女兒」下的定義不是「稱丈夫為主」，而是兩個動作：行善、不怕任何恐嚇（πτόησιν，ptoēsin）。在一個不信的丈夫可能用威脅逼妻子放棄信仰的家裡，這句話等於說：你可以敬重他，但不必被他嚇倒；你的信仰屬於神。</p><p><strong>難處：</strong>這一說很有牧養力量，但要小心不要把彼得讀得太現代，好像他在鼓勵反抗；彼得同時要妻子順服、敬重，界線說必須和經文的正面呼召一起講。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：彼得舉撒拉，看重的是一位「仰賴神」、在不可能裡盼望神的女人；而「撒拉的女兒」是用「行善，不因恐嚇而害怕」來認的。</strong>撒拉的「聽從」是一種敬重，不是無條件的服從——創世記自己也記載神叫亞伯拉罕聽撒拉的話。彼得並沒有為亞伯拉罕把她置於危險的那兩次背書。</p><p>所以講台上可以用撒拉講敬重與盼望，不可以用撒拉要求妻子稱丈夫為主、凡事聽從、或留在危險裡。順服的理由與界線，全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。撒拉不完美，亞伯拉罕也不完美；聖經把他們的軟弱照實寫下來，正好說明神揀選人、成就應許，不是因為人夠好，是因為神信實。彼得把一位曾經暗笑的女人放進新約，稱她的女兒是「行善、不因恐嚇而害怕」的人。</p><p>你若也在一個看不見出路的家裡，撒拉的故事給你的不是一條聽話的規矩，是一個盼望：那位叫老年的撒拉生子的神，也看見你。</p>"]],"con":[],"say":"本講義的立場：彼得舉撒拉，看重的是她仰賴神；「撒拉的女兒」是用「行善，不因恐嚇而害怕」來認的。撒拉的例子講敬重與盼望，不講無條件的服從，更不叫人留在危險裡。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有姊妹曾被人拿撒拉來要求「你也要稱他為主、凡事聽他的」，甚至在受欺壓時被說「撒拉都忍了」。不要這樣用撒拉；也不要為了替女性說話而嘲笑撒拉或亞伯拉罕。陪那些在家裡被壓得喘不過氣的姊妹看見：彼得要她們不因恐嚇而害怕。若她正受到暴力或威脅，先保護安全、陪她求助與通報，不以原諒或和好作為幫助她的條件。"},{"id":"ISS03_5","t":"3:7「她比你軟弱」——女人比男人軟弱嗎？夫妻關係為甚麼影響禱告？","r":"3:7","ch":[3],"why":"「軟弱的器皿」這幾個字，在教會裡常被拿來說女人比較情緒化、比較不理性、比較不適合帶領，也讓不少姊妹讀到這一節就心裡受傷。另一方面，3:7 是全段家規裡唯一對丈夫說的話，卻常被一句帶過。這一題要把這一節還原：它是在提升妻子的地位，還是貶低她？為甚麼丈夫怎樣待妻子，會影響他的禱告？","pos":[["【一】經文問的是甚麼","","<p>彼得說：「你們作丈夫的也要按情理和妻子同住；因她比你軟弱，與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙」（3:7）。cu89t 註腳說「按情理」原文是知識（γνῶσιν，gnōsin），「比你軟弱」原文作「是軟弱的器皿」（ἀσθενεστέρῳ σκεύει，asthenesterō skeuei）——比較級，「較軟弱的器皿」。問題有兩個：「較軟弱」指的是甚麼？「禱告沒有阻礙」（ἐγκόπτεσθαι，enkoptesthai）又是誰的禱告、為甚麼會被擋住？</p>"],["體力與社會地位說：較軟弱指體力與當時的法律、經濟處境","","<p>多數近代註釋家認為，「較軟弱」指的是體力，以及一世紀妻子在法律、經濟、社會上的弱勢——她們在體力、法律地位、經濟與社會上普遍居於弱勢，最容易被傷害。彼得要握有權力的丈夫不利用這個落差，反而「把尊榮分給她」（ἀπονέμοντες τιμήν，aponemontes timēn）。比較級也暗示丈夫同樣是器皿，男女都是瓦器（林後 4:7）。</p><p><strong>難處：</strong>這一說把重點放在處境上，有人會問：今天許多妻子在經濟與法律上不再弱勢，這一節還適用嗎？它需要指出：原則是「強的一方要保護、敬重較易受傷的一方」，處境改變，原則不變。</p>"],["本性說：女性在情感或本性上較為脆弱，需要丈夫保護","","<p>一些傳統的讀法認為，「較軟弱」也包括情感、心理甚至判斷力上的脆弱，所以丈夫要保護、帶領妻子。這一說的出發點常是要丈夫多體貼、多承擔，本意不壞，在許多文化裡也很普遍。</p><p><strong>難處：</strong>經文沒有說女性在智力、情感或靈性上較差；同一節立刻說她是「與你一同承受生命之恩的」，在神面前與丈夫同承一份恩典。把軟弱擴大成本性上的次等，會被用來排除女性的聲音，正與這一節「敬重她」的方向相反。</p>"],["珍貴器皿說：較軟弱是較易碎，所以更要珍惜","","<p>也有解經者用器皿的比喻說：較軟弱的器皿像細瓷，不是價值較低，而是更需要小心對待；越珍貴的器皿越要輕拿輕放。這個讀法和「所以要敬重她」接得很順，也常在婚禮講章裡被使用。</p><p><strong>難處：</strong>這是一個講道時的聯想，不是經文本身的論證；用得不好，會把妻子講成需要被擺在架子上的裝飾品，而不是一同承受生命之恩、有自己良心與聲音的人——3:1 的妻子正是在信仰上作了獨立決定的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「較軟弱的器皿」指的是當時妻子在體力與社會處境上的弱勢，不是女性在價值、智力或靈性上較低；同一節說她是「與你一同承受生命之恩的」。</strong>彼得對握有權力的丈夫說：你要認識她（按情理），要把尊榮分給她。</p><p>「禱告沒有阻礙」：ἐγκόπτω（enkoptō）是在路上挖溝擋路。多數解經者認為主要指丈夫自己的禱告，也包括夫妻一同的禱告——神把丈夫怎樣對待妻子，和他怎樣來到神面前綁在一起。這不是說禱告不蒙應允的人一定是夫妻不和。全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p
