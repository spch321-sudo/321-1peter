p":"<p>「這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們；這洗禮本不在乎除掉肉體的污穢，只求在神面前有無虧的良心。」（3:21）挪亞一家藉著水得救，水把舊世界淹沒，也把方舟托起來。彼得說，洗禮是這件事的對應：受洗的人經過水，從舊的生命出來，歸入新的。這使我們想起保羅說「我們藉著洗禮歸入死，和他一同埋葬」（羅 6:4）。</p><p>這一節要講得很準。<strong>救人的是耶穌基督的復活，不是水。</strong>彼得自己說，洗禮「不在乎除掉肉體的污穢」，水洗不掉罪。所以本講義不說「受洗就得救」，好像儀式本身能自動生效；也不說「沒有受洗不能得救」，這使我們想起十字架上的強盜，主對他說「今日你要同我在樂園裡了」（路 23:43）。但洗禮也不是可有可無：它是信的人向神的回應與承諾，是主所吩咐的，我們就順服。不同宗派對嬰兒洗與信徒浸有不同的理解，本講義不在其間裁判，詳見全卷立場四。</p><p>「只求在神面前有無虧的良心」：洗禮是一個人在神面前的回答。在第一世紀的小亞細亞，受洗是公開的分界線，從那天起，家人與鄰舍都知道你換了一位主。對寄居者來說，洗禮不是一張保險單，而是一個立約的時刻：從此，我的良心向著神。</p><p>「耶穌已經進入天堂，在神的右邊；眾天使和有權柄的，並有能力的，都服從了他。」（3:22）本章從「順服」開始，也以「服從」結束。妻子、丈夫、家僕、眾人，都被呼召為主的緣故回到本位；最後一節說，宇宙裡一切的權勢都已經在他腳下。<strong>寄居的人能不以惡報惡、不因恐嚇而害怕，是因為真正的王已經坐在寶座上。</strong>321 說無己戰勝撒但：得勝的不是我們的屬靈能力，是基督已經完成的得勝；我們的爭戰，是站在他的得勝裡。</p>"}],"4":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Χριστοῦ οὖν παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ παθὼν σαρκὶ πέπαυται ἁμαρτίας</p><p lang=\"grc\">εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.</p>","lit":"<p>所以，基督既在肉身受了苦，你們也要用同一個心思把自己武裝起來，因為那在肉身受過苦的，已經止住了罪，</p><p>以致不再照著人的情慾，而是照著神的旨意，度那在肉身中餘下的時間。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Χριστοῦ οὖν παθόντος σαρκὶ</td><td>Christou oun pathontos sarki</td><td>所以，基督既在肉身受了苦</td><td>獨立屬格分詞；οὖν 接回 3:18</td></tr><tr><td>τὴν αὐτὴν ἔννοιαν</td><td>tēn autēn ennoian</td><td>同一個心思</td><td>ἔννοια：想法、意念；新約另一次在來 4:12</td></tr><tr><td>ὁπλίσασθε</td><td>hoplisasthe</td><td>你們要把自己武裝起來</td><td>不定過去式中間語態命令；新約僅此一次</td></tr><tr><td>ὁ παθὼν σαρκὶ</td><td>ho pathōn sarki</td><td>那在肉身受過苦的</td><td>指信徒或指基督，讀法並陳</td></tr><tr><td>πέπαυται ἁμαρτίας</td><td>pepautai hamartias</td><td>已經止住了罪</td><td>完成式：停了，至今停著</td></tr><tr><td>μηκέτι ἀνθρώπων ἐπιθυμίαις</td><td>mēketi anthrōpōn epithymiais</td><td>不再照人的情慾</td><td>與下句成對照</td></tr><tr><td>ἀλλὰ θελήματι θεοῦ</td><td>alla thelēmati theou</td><td>而是照神的旨意</td><td>兩個與格：誰是生活的準則</td></tr><tr><td>τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον</td><td>ton epiloipon en sarki biōsai chronon</td><td>度在肉身中餘下的時間</td><td>ἐπίλοιπον 新約僅此一次</td></tr></table>","gram":"<p><strong>4:1 用 οὖν（oun） 接回 3:18。</strong>3:18 說 Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ἔπαθεν（Christos hapax peri hamartiōn epathen），第 4 章開頭把它收成一個獨立屬格分詞片語：Χριστοῦ οὖν παθόντος σαρκὶ（Christou oun pathontos sarki）。這不是新話題，是 3:18--22 那條得勝路線的結論：他受了苦，也已經得勝；所以你們……。σαρκὶ（sarki） 是範圍的與格，「在肉身的範圍裡」，與 3:18 θανατωθεὶς μὲν σαρκὶ（thanatōtheis men sarki） 同一個字。</p><p>主要動詞 ὁπλίσασθε（hoplisasthe） 是不定過去式中間語態命令，「把自己武裝起來」。ὁπλίζω（hoplizō） 新約只此一次，字根是 ὅπλα（hopla），兵器。要披掛上身的不是盔甲，是 τὴν αὐτὴν ἔννοιαν（tēn autēn ennoian），「同一個心思」。ἔννοια（ennoia） 是想法、意念；和合本譯「心志」，原文更接近「想法」：基督怎樣看受苦，你們也這樣看。</p><blockquote><p>ὅτι ὁ παθὼν σαρκὶ πέπαυται ἁμαρτίας（hoti ho pathōn sarki pepautai hamartias） 是本章第一個難句，讀法有三：①指信徒：願意為主在肉身受苦的人，已經表明他與罪的關係斷了，罪不再是他生活的主人；②指基督：ὁ παθὼν（ho pathōn） 就是上半句那位受苦的基督，他受苦，就與罪的事了結了（3:18「一次為罪」）；③指一般原則：受過苦的人學會不再被罪支配。πέπαυται（pepautai） 是完成式，「已經停止，至今停著」。本講義取①，並以②為根據：信徒能與罪斷絕，是因為基督先為罪受了苦。三種讀法都沒有說受苦本身有洗淨的能力。</p></blockquote><p>4:2 的 εἰς τὸ（eis to） 加不定詞 βιῶσαι（biōsai） 說出目的：μηκέτι ἀνθρώπων ἐπιθυμίαις（mēketi anthrōpōn epithymiais） 對 ἀλλὰ θελήματι θεοῦ（alla thelēmati theou），兩個與格，一個說人的情慾，一個說神的旨意。τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον（ton epiloipon en sarki biōsai chronon）：剩下的日子是有限的，也是可以重新分配的。</p>","exp":"<p>「基督既在肉身受苦，你們也當將這樣的心志作為兵器」（4:1）。彼得剛講完基督受死、復活、升天、一切都服從了他（3:18--22），第 4 章第一句就把那條路交到讀者手裡：他走過的，你們也要帶著同樣的想法去走。這是全卷公式「基督受苦難，後來得榮耀」（1:11）第一次被說成讀者的裝備。</p><p>「兵器」是很重的比喻。寄居的人每天在打一場看不見的仗：家族的壓力、同事的訕笑、自己裡面的舊習慣。彼得沒有發給他們新的武器，他給的是一個想法：受苦不是失敗的記號，是跟隨的記號。一個人若以為信主就該一路順利，第一次被排擠就會被擊倒；一個人若早已把「基督在肉身受苦」放在心裡，被排擠的時候就知道：這條路，我的主先走過。</p><p>「在肉身受過苦的，就已經與罪斷絕了」（4:1）要小心讀。本講義採的讀法是：一個願意為主受苦的人，已經表明罪不再是他的主人；而這一切的根據，是基督「一次為罪受苦」（3:18）。<strong>彼得不是說受苦能讓人變好。</strong>受苦本身沒有洗淨的能力，苦難也可能使人苦毒、使人遠離神；使人與罪斷絕的，是那位受苦的基督，和一個決定跟著他走的心。這也劃了一條牧養的界線：不要對受苦的人說，神是用這苦來對付你的罪，那不是這節經文的意思。</p><p>4:2 說出這個想法的果子：「從今以後就可以不從人的情慾，只從神的旨意在世度餘下的光陰」（4:2）。「餘下的光陰」是一個很誠實的詞。過去的已經過去了，下一節還要說「時候已經夠了」（4:3）；剩下的，不管是四十年還是四年，都可以重新交出去。對一個中年才信主、常常懊悔前半生的人，這節經文不是責備，是邀請：前面那一段不能重來，後面這一段可以照神的旨意過。321 說耶穌是我的榜樣：效法他，不只是學他的溫柔，也是學他看受苦的眼光。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος τὸ βούλημα τῶν ἐθνῶν κατειργάσθαι πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.</p><p lang=\"grc\">ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·</p>","lit":"<p>因為過去的時間已經足夠了，去完成外邦人所願意的事，行在放蕩、情慾、醉酒、狂歡、群飲和不合法的拜偶像之中。</p><p>在這事上，他們因你們不與他們一同奔入那同樣放蕩的洪流，就覺得奇怪，毀謗你們；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος</td><td>arketos gar ho parelēlythōs chronos</td><td>因為過去的時間已經夠了</td><td>ἀρκετὸς：太 6:34 一天的難處一天當就夠了</td></tr><tr><td>τὸ βούλημα τῶν ἐθνῶν</td><td>to boulēma tōn ethnōn</td><td>外邦人所願意的</td><td>收信人原是外邦人</td></tr><tr><td>οἰνοφλυγίαις κώμοις πότοις</td><td>oinophlygiais kōmois potois</td><td>醉酒、狂歡、群飲</td><td>三個與酒有關的字</td></tr><tr><td>ἀθεμίτοις εἰδωλολατρίαις</td><td>athemitois eidōlolatriais</td><td>不合法的拜偶像</td><td>清單的最後一項，份量最重</td></tr><tr><td>ξενίζονται</td><td>xenizontai</td><td>他們覺得奇怪</td><td>4:12 同一個動詞</td></tr><tr><td>τῆς ἀσωτίας ἀνάχυσιν</td><td>tēs asōtias anachysin</td><td>放蕩的洪流</td><td>ἀνάχυσιν 新約僅此一次</td></tr><tr><td>βλασφημοῦντες</td><td>blasphēmountes</td><td>毀謗</td><td>分詞直接接上：覺得怪，就開口罵</td></tr></table>","gram":"<p><strong>4:3 的 γὰρ（gar） 解釋為甚麼「餘下的光陰」要換一個主人：過去已經夠了。</strong>ἀρκετὸς（arketos） 是「足夠」，帶一點反諷：那樣的日子，你們過得夠多了。ὁ παρεληλυθὼς χρόνος（ho parelēlythōs chronos） 是完成式分詞，已經過去、已經關上的那一段時間。τὸ βούλημα τῶν ἐθνῶν（to boulēma tōn ethnōn） 透露讀者的出身：他們從前照「外邦人」的心意生活，這是收信人多數是外邦信徒的線索之一（1:14、18）。</p><p>六個名詞都是複數與格，前五個像清單一路排下來：ἀσελγείαις（aselgeiais） 放蕩、ἐπιθυμίαις（epithymiais） 情慾、οἰνοφλυγίαις（oinophlygiais） 醉酒、κώμοις（kōmois） 狂歡、πότοις（potois） 群飲；最後一個加上 καὶ（kai） 與形容詞，份量最重：ἀθεμίτοις εἰδωλολατρίαις（athemitois eidōlolatriais），「不合法的拜偶像」。複數表示一再發生的場合。這幾個字合起來，是第一世紀同業公會與節慶的宴席：先在神廟獻祭，再一起吃喝。</p><blockquote><p>4:4 的 ἐν ᾧ（en hō） 是「在這件事上」。ξενίζονται（xenizontai） 是現在式，「他們感到陌生、覺得奇怪」，同一個動詞在 4:12 回來：μὴ ξενίζεσθε（mē xenizesthe）。συντρεχόντων（syntrechontōn） 是「一起跑」，ἀνάχυσιν（anachysin） 是水漫出來的洪流，新約只此一次。句末的 βλασφημοῦντες（blasphēmountes） 是分詞，沒有連接詞，直接接上：覺得怪，就開口罵。</p></blockquote>","exp":"<p>「因為往日隨從外邦人的心意行邪淫、惡慾、醉酒、荒宴、群飲，並可惡拜偶像的事，時候已經夠了。」（4:3）彼得列出的不是抽象的罪名，是收信人熟悉的一張桌子。在小亞細亞的城市裡，一個工匠要做生意，就得參加同業公會；公會的聚餐從向守護神獻祭開始，接著是酒與狂歡。不去，就是不合群；去了，就得向偶像低頭。</p><p>「他們在這些事上，見你們不與他們同奔那放蕩無度的路，就以為怪，毀謗你們。」（4:4）注意彼得沒有說他們被抓、被打，他說的是「以為怪」。這正是寄居的人最日常的苦：沒有人逼迫你，只是大家覺得你怪。年節回家不拿香，長輩臉色一沉；應酬不喝酒，客戶說你不給面子；公司要做假帳你不肯簽，同事說你假清高。本章在全卷地勢圖上的低谷就在這裡：不是刀劍，是眼光。</p><p>這段經文也要小心用。彼得說的是拜偶像的宴席與醉酒狂歡，不是在論斷喝一杯酒的弟兄，也不是叫人羞辱未信的家人。<strong>拒絕偶像不等於拒絕家人</strong>：一個不拿香的兒子，可以是最早到、最晚走、把長輩照顧得最好的那一個。至於喝酒、應酬、祭祖的分寸，是議題頁的題目。經文在這裡只要我們看見一件事：被當成怪人，本來就是寄居者的身分之一，不是你哪裡做錯了。</p>"},{"a":5,"z":6,"star":3,"grk":"<p lang=\"grc\">οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ἔχοντι κρῖναι ζῶντας καὶ νεκρούς·</p><p lang=\"grc\">εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.</p>","lit":"<p>他們要向那位已經預備好要審判活人和死人的交帳。</p><p>因為為此，福音也曾傳給死人，好叫他們在肉身上按著人被審判，在靈裡卻按著神活著。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἳ ἀποδώσουσιν λόγον</td><td>hoi apodōsousin logon</td><td>他們要交帳</td><td>未來式；毀謗的人也要交帳</td></tr><tr><td>τῷ ἑτοίμως ἔχοντι</td><td>tō hetoimōs echonti</td><td>那已經預備好的</td><td>審判者已經就緒</td></tr><tr><td>κρῖναι ζῶντας καὶ νεκρούς</td><td>krinai zōntas kai nekrous</td><td>審判活人和死人</td><td>彼得在哥尼流家也這樣說（徒 10:42）</td></tr><tr><td>εἰς τοῦτο γὰρ</td><td>eis touto gar</td><td>因為為此</td><td>指回 4:5 的審判</td></tr><tr><td>καὶ νεκροῖς εὐηγγελίσθη</td><td>kai nekrois euēngelisthē</td><td>福音也曾傳給死人</td><td>不定過去式：過去的事</td></tr><tr><td>κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ</td><td>krithōsi men kata anthrōpous sarki</td><td>在肉身上按著人被審判</td><td>μὲν：在人看來</td></tr><tr><td>ζῶσι δὲ κατὰ θεὸν πνεύματι</td><td>zōsi de kata theon pneumati</td><td>在靈裡卻按著神活著</td><td>δὲ：在神面前</td></tr></table>","gram":"<p><strong>4:5 的 οἳ（hoi） 指回 4:4 毀謗的人。</strong>οἳ ἀποδώσουσιν λόγον（hoi apodōsousin logon），「他們要交帳」，是會計的用語，帳目要一筆一筆交出來。對象是 τῷ ἑτοίμως ἔχοντι κρῖναι ζῶντας καὶ νεκρούς（tō hetoimōs echonti krinai zōntas kai nekrous），「那已經預備好要審判活人死人的」；ἑτοίμως（hetoimōs） 是「隨時、已經就緒」，審判不是遙遠的事。「審判活人、死人」是早期教會的信仰用語，彼得在哥尼流家就說耶穌是「上帝所立定的，要作審判活人、死人的主」（徒 10:42）。</p><blockquote><p><strong>4:6 是本章第二個難句，本講義並陳三種讀法：</strong>①福音曾傳給現在已死的人——在他們活著的時候。εὐηγγελίσθη（euēngelisthē） 是不定過去式，指過去的事；νεκροῖς（nekrois） 是讀信時「已經死了」的人，他們生前聽過、信了福音，後來死了。在人看來，他們和別人一樣死了（κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ（krithōsi men kata anthrōpous sarki）），在神面前他們卻活著（ζῶσι δὲ κατὰ θεὸν πνεύματι（zōsi de kata theon pneumati））。②死後聽福音：把 4:6 與 3:19 連起來，說基督在死與復活之間向亡者傳福音，給他們第二次機會（本講義不採）。③屬靈上的死人：「死人」指在罪中死了的人，這使我們想起弗 2:1。</p><p>本講義採①，理由有三：上一節的 νεκρούς（nekrous） 是肉身的死人，4:6 的 νεκροῖς（nekrois） 緊接著，不宜忽然換成比喻；3:19 用的是 ἐκήρυξεν（ekēryxen）「宣告」，對象是「靈」，4:6 用的是 εὐηγγελίσθη（euēngelisthē）「傳福音」，對象是「死人」，兩處的字和對象都不同；新約別處也一致說「死後且有審判」（來 9:27）。所以本講義<strong>不教死後第二次機會</strong>，也不據此斷定任何亡者的去處。κριθῶσι（krithōsi） 與 ζῶσι（zōsi） 在 SBLGNT 緊跟異文標記之後，沒有 Strong 編號，字形本身完好。</p></blockquote>","exp":"<p>「他們必在那將要審判活人死人的主面前交帳。」（4:5）毀謗你們的人，自己也要交帳。彼得沒有叫讀者反擊，也沒有叫他們急著證明自己；他把帳交給那位審判者。這和他描寫耶穌的那一句同一個方向：「只將自己交託那按公義審判人的主」（2:23）。被誤會的人最想做的事，是把每一筆帳當場算清；彼得說，帳有人在算，而且他已經預備好了。</p><p>「為此，就是死人也曾有福音傳給他們，要叫他們的肉體按著人受審判，他們的靈性卻靠神活著。」（4:6）讀者心裡可能有一個問題：我們中間已經有人死了。他們信了主，被鄰舍嘲笑，最後也和不信的人一樣進了墳墓；那信有甚麼用？彼得的回答是：福音傳給他們，正是為了這個。在人眼中，他們的結局和別人沒有兩樣，肉身照樣死了；在神面前，他們活著。這使我們想起保羅對失去親人的信徒說，不要「像那些沒有指望的人一樣」（帖前 4:13）。</p><p>這一節常被用來回答另一個問題：我那位沒有信主就過世的父親，死後還有沒有機會？這是很真實、很痛的問題，但 4:6 不是為回答它而寫的。本講義不用這節經文給第二次機會的盼望，也不用任何一節經文宣判亡者的去處。我們不知道一個人在最後一刻與神之間發生了甚麼；我們知道神是公義的，也是滿有憐憫的。在追思禮拜上，我們陪伴家屬，把亡者交在神手裡；這是帖撒羅尼迦前書立場三立下的牧養底線，本卷沿用（ISS00_4）。</p><p>對活著的人，這一節的落點很直接：福音是傳給活人聽的，「現在正是拯救的日子」（林後 6:2）。今天還能聽、還能信、還能把福音帶回家，本身就是恩典。</p>"},{"a":7,"z":7,"star":1,"grk":"<p lang=\"grc\">Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε εἰς προσευχάς·</p>","lit":"<p>而萬物的終結已經近了。所以你們要頭腦清醒，並且要警醒，以致能禱告。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πάντων δὲ τὸ τέλος</td><td>Pantōn de to telos</td><td>而萬物的終結</td><td>Πάντων 放句首加重</td></tr><tr><td>ἤγγικεν</td><td>ēngiken</td><td>已經近了</td><td>完成式；雅 5:8 同一個字形</td></tr><tr><td>σωφρονήσατε οὖν</td><td>sōphronēsate oun</td><td>所以要頭腦清醒</td><td>心思健全、不被沖昏</td></tr><tr><td>νήψατε εἰς προσευχάς</td><td>nēpsate eis proseuchas</td><td>要警醒以致能禱告</td><td>εἰς 表目的；5:8 再說一次</td></tr></table>","gram":"<p><strong>4:7 是第二大段的開頭，δὲ（de） 轉入新的段落，Πάντων（Pantōn） 放在句首加重。</strong>τὸ τέλος（to telos） 是終點、目標；ἤγγικεν（ēngiken） 是完成式，「已經走近，現在就在附近」。雅各書用同一個字形說 ἡ παρουσία τοῦ κυρίου ἤγγικεν（雅 5:8），耶穌開始傳道也說神的國「近了」（可 1:15）。這個「近」說的是神的時間表已經進入最後一段，不是給人算日子的倒數計時器。</p><p>οὖν（oun） 帶出兩個不定過去式命令：σωφρονήσατε（sōphronēsate） 是「頭腦清楚、心思健全」；νήψατε（nēpsate） 是「清醒、不醉」，全卷三次（1:13 νήφοντες（nēphontes）；4:7；5:8）。兩個命令共用一個目標 εἰς προσευχάς（eis proseuchas）：清醒，是為了能禱告。末日的意識在彼得筆下不是叫人亢奮，是叫人冷靜。</p>","exp":"<p>〔背景〕太 26:40--41（馬太講義第 26 章）</p><p>「萬物的結局近了。所以，你們要謹慎自守，警醒禱告。」（4:7）兩千年過去了，還算近嗎？新約作者都這樣說（雅 5:8；腓 4:5），意思不是「很快就到某一天」，而是從基督復活以後，歷史已經進入最後一章；這一章有多長，只有神知道（彼後 3:8）。所以這一節不能用來算日子，也不要把今天的戰爭、疫情、新聞對號入座成時間表。本講義的立場見帖撒羅尼迦前書立場二。</p><p>彼得從「近了」推出來的，不是囤糧、不是辭職，是兩個很安靜的命令：頭腦清楚，警醒禱告。這兩個字從彼得口中說出來特別有份量。客西馬尼園裡，主對他說：「你們不能同我警醒片時嗎？」（太 26:40）又說：「總要警醒禱告，免得入了迷惑。」（太 26:41）那一夜彼得睡著了，幾個小時後就三次不認主。多年以後，他把同一個命令寫給寄居的人。不是彼得變得比較會警醒，是那位曾經叫醒他的主沒有放棄他，又把他帶回來，讓他把這個功課傳下去。</p>"},{"a":8,"z":9,"star":3,"grk":"<p lang=\"grc\">πρὸ πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν·</p><p lang=\"grc\">φιλόξενοι εἰς ἀλλήλους ἄνευ γογγυσμοῦ</p>","lit":"<p>在一切之先，彼此持守那切實的愛，因為愛遮蓋眾多的罪；</p><p>彼此款待客旅，沒有怨言；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πρὸ πάντων</td><td>pro pantōn</td><td>在一切之先</td><td>和合本：最要緊的</td></tr><tr><td>τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ</td><td>tēn eis heautous agapēn ektenē</td><td>彼此之間那拉緊的愛</td><td>1:22 ἐκτενῶς 同字根</td></tr><tr><td>ἔχοντες</td><td>echontes</td><td>持守著</td><td>分詞帶命令語氣</td></tr><tr><td>ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν</td><td>agapē kalyptei plēthos hamartiōn</td><td>愛遮蓋許多的罪</td><td>箴 10:12；雅 5:20</td></tr><tr><td>φιλόξενοι εἰς ἀλλήλους</td><td>philoxenoi eis allēlous</td><td>彼此愛客旅</td><td>沒有動詞</td></tr><tr><td>ἄνευ γογγυσμοῦ</td><td>aneu gongysmou</td><td>沒有嘀咕</td><td>γογγυσμοῦ：低聲的抱怨</td></tr></table>","gram":"<p><strong>πρὸ πάντων（pro pantōn） 回應 4:7 的 Πάντων（Pantōn）：萬物的結局近了，在萬事之先要做的是愛。</strong>4:8 的主要形式是分詞 ἔχοντες（echontes），在這一串命令中帶命令的語氣。τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ（tēn eis heautous agapēn ektenē）：ἐκτενῆ（ektenē） 有「拉緊、伸長」的意思，1:22 用副詞 ἐκτενῶς（ektenōs） 說「從心裡彼此切實相愛」（1:22）；這種愛像繃緊的弓弦，不是鬆垮的客氣。</p><blockquote><p>ὅτι ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν（hoti agapē kalyptei plēthos hamartiōn） 出自箴 10:12。和合本箴言作「愛能遮掩一切過錯」（箴 10:12），彼得前書作「愛能遮掩許多的罪」（4:8）：這是兩個版本的字句，一個說「一切過錯」，一個說「許多的罪」，方向相同。彼得的字句比較接近希伯來文，七十士譯本的箴 10:12 字句很不一樣。雅各書結尾也用了同一個片語 καλύψει πλῆθος ἁμαρτιῶν（雅 5:20），在那裡是把迷路的人領回來。καλύπτει（kalyptei） 是現在式：愛不斷地在遮蓋。</p></blockquote><p>4:9 沒有動詞：φιλόξενοι εἰς ἀλλήλους ἄνευ γογγυσμοῦ（philoxenoi eis allēlous aneu gongysmou）。φιλόξενοι（philoxenoi） 是「愛陌生人的」，與 4:4、4:12 的 ξενίζονται（xenizontai）、ξενίζεσθε（xenizesthe） 同字根——世界覺得你們陌生，你們卻要接待陌生人。γογγυσμοῦ（gongysmou） 是低聲嘀咕的抱怨，在 SBLGNT 緊跟異文標記之後，沒有 Strong 編號；這使我們想起徒 6:1 分配飯食時的「怨言」。</p>","exp":"<p>〔雅〕雅 5:20--20</p><p>「最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。」（4:8）結局近了，彼得說的第一件事不是傳福音策略，也不是末世圖表，是彼此相愛。一個被外面的人以為怪的小群體，最容易從裡面裂開：被逼得緊的人會互相指責，會把外面受的氣帶回教會。所以彼得說：愛要拉緊。</p><p>「愛能遮掩許多的罪」是甚麼意思？在一個天天見面、互相虧欠的群體裡，愛不揭人的瘡疤，不把弟兄早已認過、改過的過犯一再翻出來，不把一次的失敗變成一輩子的標籤。箴言說「恨能挑啟爭端」（箴 10:12），恨把舊帳一頁一頁翻開；愛把它蓋上，讓人可以重新開始。雅各書用同一個片語講另一面：把迷路的人領回來，就「遮蓋許多的罪」（雅 5:20）。遮蓋不是假裝沒看見，是在神面前處理過了，就不再拿出來打人。</p><p><strong>遮掩不是隱瞞侵害。</strong>這一節不能用來掩蓋性侵、家暴、虐待兒童、挪用奉獻或屬靈的欺壓；不能用「愛能遮掩」叫受害者閉嘴，也不能讓該負責的人逃避責任。保護受害者、通報、依法處理，本身就是愛：愛受害的人，也愛那個需要真正悔改的人。耶穌教導的次序是先去「指出他的錯來」（太 18:15）；愛遮掩的是已經面對了的罪，不是還在傷人的罪。本講義的全卷立場見 ISS00_5。</p><p>「你們要互相款待，不發怨言。」（4:9）寄居的人在外面無處可去，弟兄姊妹的家就是落腳的地方。第一世紀的旅店名聲不好，巡迴的傳道人、被趕出家門的信徒，都要靠信徒的家。彼得加上「不發怨言」，因為他知道款待是累的：多煮一鍋飯、多洗一堆碗、客人住得比預期久。愛不是只在心情好的時候才做。今天的款待也可以是線上團契裡，為一位剛到異鄉的弟兄接一通電話，或為一個深夜撐不住的姊妹留著線。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·</p><p lang=\"grc\">εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.</p>","lit":"<p>各人照著所領受的恩賜，把它用來彼此服事，如同神多樣恩典的好管家；</p><p>若有人說話，要像說神的話語；若有人服事，要像出於神所供應的力量；好叫神在一切事上藉著耶穌基督得榮耀，榮耀和權能都屬於他，直到世世代代。阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἕκαστος καθὼς ἔλαβεν χάρισμα</td><td>hekastos kathōs elaben charisma</td><td>各人照所領受的恩賜</td><td>每一個人都有；都是領受的</td></tr><tr><td>εἰς ἑαυτοὺς αὐτὸ διακονοῦντες</td><td>eis heautous auto diakonountes</td><td>用它彼此服事</td><td>恩賜的方向是向著彼此</td></tr><tr><td>ὡς καλοὶ οἰκονόμοι</td><td>hōs kaloi oikonomoi</td><td>如同好管家</td><td>東西不是自己的</td></tr><tr><td>ποικίλης χάριτος θεοῦ</td><td>poikilēs charitos theou</td><td>神多色的恩典</td><td>與 1:6 ποικίλοις 同字</td></tr><tr><td>ὡς λόγια θεοῦ</td><td>hōs logia theou</td><td>如同神的話語</td><td>說話的恩賜</td></tr><tr><td>ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός</td><td>ex ischyos hēs chorēgei ho theos</td><td>出於神所供應的力量</td><td>服事的恩賜；χορηγέω 慷慨供應</td></tr><tr><td>ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς</td><td>hina en pasin doxazētai ho theos</td><td>好叫神在凡事上得榮耀</td><td>全段的目的</td></tr></table>","gram":"<p><strong>4:10 的主詞是 ἕκαστος（hekastos），「每一個人」。</strong>καθὼς ἔλαβεν χάρισμα（kathōs elaben charisma）：ἔλαβεν（elaben） 是不定過去式「領受了」，恩賜不是自己長出來的，是收到的禮物；χάρισμα（charisma） 與後面的 χάριτος（charitos） 同字根，恩賜是恩典落在一個人身上的樣子。εἰς ἑαυτοὺς αὐτὸ διακονοῦντες（eis heautous auto diakonountes）：αὐτὸ（auto） 指那恩賜，方向是「向著彼此」，用來服事，不是用來展示。</p><p>ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ（hōs kaloi oikonomoi poikilēs charitos theou）：οἰκονόμοι（oikonomoi） 是替主人管理家業的家僕，路 12:42 那「忠心有見識的管家」是同一個字。最值得注意的是 ποικίλης（poikilēs），「多色的、各式各樣的」。這個字在全卷只出現兩次：1:6 ἐν ποικίλοις πειρασμοῖς（en poikilois peirasmois）「百般的試煉」，這裡 ποικίλης χάριτος（poikilēs charitos）「百般的恩賜」。<strong>試煉有多少種顏色，恩典就有多少種顏色。</strong></p><blockquote><p>4:11 把恩賜分成兩大類，用兩個平行的 εἴ τις（ei tis） 句子：εἴ τις λαλεῖ（ei tis lalei） 之後是 ὡς λόγια θεοῦ（hōs logia theou），說話的；εἴ τις διακονεῖ（ei tis diakonei） 之後是 ὡς ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός（hōs ex ischyos hēs chorēgei ho theos），服事的。兩句都省略了動詞，和合本補出「講」與「服事」，「服事人」的「人」字與「原來」二字是小字補充。λόγια（logia） 是神的話語、神諭（羅 3:2；徒 7:38）。χορηγεῖ（chorēgei） 原指承擔合唱團一切開銷的贊助人，後來泛指慷慨地供應。目的子句 ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ（hina en pasin doxazētai ho theos dia Iēsou Christou） 之後接 ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος（hō estin hē doxa kai to kratos）：ᾧ（hō） 可以指神，也可以指最近的耶穌基督，兩讀皆通。</p></blockquote>","exp":"<p>「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。」（4:10）彼得說「各人」，沒有一個例外。一個被社會邊緣化的小群體，很容易覺得自己沒有用：沒錢、沒地位、沒有講台。彼得說，你手裡有東西，而且是神放的。</p><p>「管家」兩個字改變了恩賜的意義。管家管的不是自己的東西，他要向主人交帳；保羅說「所求於管家的，是要他有忠心」（林前 4:2）。所以恩賜不是用來比較的，也不是用來建立個人名聲的；有講台恩賜的人，不比有款待恩賜的人高一等。它們都是同一位主人託付的產業，用途也一樣：彼此服事。</p><p>「百般」是本段的亮點。彼得在 1:6 用同一個字說「在百般的試煉中暫時憂愁」（1:6），在這裡說百般的恩賜。原文的意思是「多色的」。讀者經歷的試煉是五顏六色的：被家人排擠、被同事嘲笑、生病、失業；神的恩典也是五顏六色的，而且常常透過弟兄姊妹手裡的恩賜送過來：一個會煮飯的、一個會聽人說話的、一個會修電腦的、一個會讀經解經的。<strong>神回應百般試煉的方式，常常是一群帶著百般恩賜的人。</strong></p><p>4:11 把恩賜分成兩大類：說話的、服事的。說話的人要「按著神的聖言講」（4:11），講的是神的話，不是自己的意見；這是 321 說聖經是我的準則。服事的人要「按著神所賜的力量服事」（4:11），不是靠自己硬撐，所以不必在服事中耗盡、變得苦毒。兩者都指向同一個目的：「叫神在凡事上因耶穌基督得榮耀」（4:11）。這就是 321 讓耶穌得榮耀的本文：恩賜用得好不好，標準不是人有沒有稱讚我，是神有沒有因耶穌基督得榮耀。一個屬神的體系能日常運作，靠的不是幾個明星，是每一個人把手裡那一份交出來。</p>"},{"a":12,"z":13,"star":3,"grk":"<p lang=\"grc\">Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,</p><p lang=\"grc\">ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.</p>","lit":"<p>親愛的，不要因你們中間那為試驗你們而發生的火煉覺得奇怪，好像有陌生的事臨到你們，</p><p>倒要照著你們有分於基督苦難的程度歡喜，好叫你們在他榮耀顯現的時候，也可以歡喜、極其快樂。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητοί</td><td>Agapētoi</td><td>親愛的</td><td>2:11 也以此開段</td></tr><tr><td>μὴ ξενίζεσθε</td><td>mē xenizesthe</td><td>不要覺得奇怪</td><td>4:4 同一個動詞</td></tr><tr><td>τῇ ἐν ὑμῖν πυρώσει</td><td>tē en hymin pyrōsei</td><td>你們中間的火煉</td><td>煉金的爐火</td></tr><tr><td>πρὸς πειρασμὸν</td><td>pros peirasmon</td><td>為要試驗</td><td>火有目的</td></tr><tr><td>ὡς ξένου ὑμῖν συμβαίνοντος</td><td>hōs xenou hymin symbainontos</td><td>好像陌生的事臨到你們</td><td>ξένου 同字根；和合本放在括號裡</td></tr><tr><td>καθὸ κοινωνεῖτε</td><td>katho koinōneite</td><td>照著你們有分</td><td>κοινωνέω：同夥、有份</td></tr><tr><td>τοῖς τοῦ Χριστοῦ παθήμασιν</td><td>tois tou Christou pathēmasin</td><td>基督的苦難</td><td>1:11 τὰ εἰς Χριστὸν παθήματα</td></tr><tr><td>χαίρετε</td><td>chairete</td><td>要歡喜</td><td>現在式命令：一個方向</td></tr><tr><td>χαρῆτε ἀγαλλιώμενοι</td><td>charēte agalliōmenoi</td><td>歡喜、極其快樂</td><td>將來的終點；呼應 1:6</td></tr></table>","gram":"<p><strong>4:12 用 Ἀγαπητοί（Agapētoi） 開始第三大段，2:11 也是這樣開始。</strong>μὴ ξενίζεσθε（mē xenizesthe） 是現在式禁止命令，可以讀成「不要一直覺得奇怪」。這個動詞剛在 4:4 用過：外邦人 ξενίζονται（xenizontai），覺得你們奇怪；現在彼得說，你們也不要覺得火奇怪。句末 ὡς ξένου ὑμῖν συμβαίνοντος（hōs xenou hymin symbainontos） 再用一次同字根的 ξένου（xenou），和合本把它放在括號裡：「似乎是遭遇非常的事」（4:12）。</p><p>τῇ ἐν ὑμῖν πυρώσει（tē en hymin pyrōsei）：πυρώσει（pyrōsei） 是「燃燒、煉爐」，新約另外只出現在啟 18:9、18。1:7 說信心比「被火試驗仍然能壞的金子」（1:7）更寶貴，那裡的火是比喻；到了這裡，火真的臨到了。πρὸς πειρασμὸν ὑμῖν γινομένῃ（pros peirasmon hymin ginomenē） 說出火的目的：「為了試驗你們而發生的」。煉爐的火是為了煉淨，不是為了毀滅。</p><blockquote><p>4:13 的 ἀλλὰ（alla） 轉向反面：不要覺得奇怪，「倒要」歡喜。καθὸ（katho） 是「按著……的程度」：κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν（koinōneite tois tou Christou pathēmasin），你們有分於基督的苦難有多少，就有多少歡喜的理由。κοινωνεῖτε（koinōneite） 與 κοινωνία（koinōnia） 同字根，是同夥、有份。兩個「歡喜」一前一後：χαίρετε（chairete） 是現在式命令；χαρῆτε ἀγαλλιώμενοι（charēte agalliōmenoi） 是將來的歡喜再加上「極其快樂」，ἀγαλλιώμενοι（agalliōmenoi） 呼應 1:6 的 ἀγαλλιᾶσθε（agalliasthe）。現在的歡喜是方向，將來的歡喜是終點。</p></blockquote>","exp":"<p>〔背景〕徒 5:41--41（使徒行傳講義第 5 章）</p><p>「親愛的弟兄啊，有火煉的試驗臨到你們，不要以為奇怪」（4:12）。這是本章的題目句，也是全卷第四篇「火」的名字。注意彼得說的是「不要以為奇怪」，<strong>不是說不痛，是說不意外。</strong>火是真的熱，煉爐是真的燙；彼得沒有叫人假裝不痛。他要拿走的是另一種痛：為甚麼會這樣？神是不是忘了我？我是不是走錯了路？那種以為受苦是意外、是被遺棄的驚慌。</p><p>「倒要歡喜；因為你們是與基督一同受苦」（4:13）。這是全卷公式「基督受苦難，後來得榮耀」（1:11）變成讀者自己的一刻。受苦不再只是基督的事，也是他們有份的事；而公式既有下半句，他們也有份於那榮耀：「使你們在他榮耀顯現的時候，也可以歡喜快樂」（4:13）。本系列使徒行傳講義第 5 章講過，使徒受了鞭打之後「心裡歡喜，因被算是配為這名受辱」（徒 5:41）；寫這封信的彼得，就是那天走出公會的人之一。這也使我們想起保羅說「曉得和他一同受苦」（腓 3:10）。</p><p>這一節一定要和 1:6 一起讀。同一個彼得說「在百般的試煉中暫時憂愁」（1:6），憂愁是被允許的。<strong>「倒要歡喜」是一個方向，不是一張面具。</strong>受苦的人可以哭，可以向神訴苦，可以去看醫生、找輔導；歡喜不是叫人把眼淚藏起來，是在眼淚中知道自己在誰的手裡、往哪裡去。教會最不該做的，是對一個在火裡的人說「你要喜樂啊」，好像他的眼淚是屬靈的失敗。先陪他坐在火邊，再一起抬頭看那將要顯現的榮耀。</p>"},{"a":14,"z":14,"star":2,"grk":"<p lang=\"grc\">εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφʼ ὑμᾶς ἀναπαύεται</p>","lit":"<p>你們若在基督的名裡被辱罵，是有福的，因為那榮耀的、也就是神的靈，安歇在你們身上。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰ ὀνειδίζεσθε</td><td>ei oneidizesthe</td><td>你們若被辱罵</td><td>直說語氣：正在發生</td></tr><tr><td>ἐν ὀνόματι Χριστοῦ</td><td>en onomati Christou</td><td>因基督的名</td><td>4:16 再說「這名」</td></tr><tr><td>μακάριοι</td><td>makarioi</td><td>有福的</td><td>3:14 也是 μακάριοι</td></tr><tr><td>τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα</td><td>to tēs doxēs kai to tou theou pneuma</td><td>榮耀的、也就是神的靈</td><td>兩個冠詞共用一個 πνεῦμα</td></tr><tr><td>ἐφʼ ὑμᾶς ἀναπαύεται</td><td>eph' hymas anapauetai</td><td>歇息在你們身上</td><td>ἀναπαύω：安歇</td></tr></table>","gram":"<p><strong>4:14 是條件句，但 εἰ（ei） 加直說語氣 ὀνειδίζεσθε（oneidizesthe），說的是正在發生的事，不是假設。</strong>ὀνειδίζεσθε（oneidizesthe） 是「被辱罵、被數落」，與 4:4 βλασφημοῦντες（blasphēmountes） 同一類的苦：言語的苦。ἐν ὀνόματι Χριστοῦ（en onomati Christou） 是「因基督的名」；μακάριοι（makarioi） 沒有動詞，像登山寶訓一樣直接宣告。3:14 已經說過一次 μακάριοι（makarioi），那裡是為義，這裡是為基督的名。</p><p>ὅτι（hoti） 子句的結構很特別：τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα（to tēs doxēs kai to tou theou pneuma），兩個中性冠詞共用一個 πνεῦμα（pneuma），「那榮耀的（靈），也就是神的靈」。ἀναπαύεται（anapauetai） 是「歇息、安歇」，耶穌說「我就使你們得安息」（太 11:28）用的是同一個動詞；這也使我們想起「耶和華的靈必住在他身上」（賽 11:2）。</p><blockquote><p><strong>經文鑑別：</strong>RP（拜占庭多數抄本）在句末多一句 κατὰ μὲν αὐτοὺς βλασφημεῖται κατὰ δὲ ὑμᾶς δοξάζεται（kata men autous blasphēmeitai kata de hymas doxazetai），「在他們那方面，他被褻瀆；在你們這方面，他得了榮耀」；SBLGNT 與 NA28 等批判本都沒有。和合本跟批判本，沒有譯這一句。本講義的判斷：這句在早期抄本的證據較弱，多半是後來為說明而加上的；它的意思與 4:16 一致，不改變本節的教導。原文欄照 SBLGNT，講台照和合本。</p></blockquote>","exp":"<p>「你們若為基督的名受辱罵，便是有福的；因為神榮耀的靈常住在你們身上。」（4:14）本章在全卷地勢圖上的高峰就在這裡，而它正好緊貼著辱罵。4:4 是低谷：鄰舍以為怪、毀謗你們；十節之後，同樣是被罵的人，彼得說他們身上歇著榮耀的靈。外面看見的是羞辱，神看見的是榮耀停在那裡。</p><p>這使我們想起主在山上說的話：「人若因我辱罵你們，逼迫你們，捏造各樣壞話毀謗你們，你們就有福了！」（太 5:11）那天彼得坐在山上聽；多年以後，他把這句話寫給被罵的寄居者。</p><p>「常住」原文是「歇息」。這個字帶著安靜：聖靈不是在受辱的人身上掀起一陣亢奮，而是安安靜靜地停在那裡。一個在公司被當眾奚落的弟兄、一個在家族聚會上被長輩數落信洋教的姊妹，回到房間裡可能只覺得累、覺得委屈；彼得說，就在那時，榮耀的靈歇在你身上。你不必感覺得到，他也在；你被罵的那一刻，正是他停留的地方。這是 321 說聖靈是我的引導：他不只帶路，也在路上最難的那一段陪著。</p><p>要留意條件是「為基督的名」。下一節馬上分辨：不是所有的罵都是為主受的。</p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·</p><p lang=\"grc\">εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ὀνόματι τούτῳ.</p>","lit":"<p>因為你們中間不可有人作為殺人的、或偷竊的、或作惡的、或作為管別人事的而受苦；</p><p>但若作為基督徒，就不要羞恥，倒要在這名裡榮耀神。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ γάρ τις ὑμῶν πασχέτω</td><td>mē gar tis hymōn paschetō</td><td>你們中間不可有人受苦</td><td>第三人稱現在命令</td></tr><tr><td>φονεὺς ἢ κλέπτης ἢ κακοποιὸς</td><td>phoneus ē kleptēs ē kakopoios</td><td>殺人的、偷竊的、作惡的</td><td>法庭上的罪名</td></tr><tr><td>ἢ ὡς ἀλλοτριεπίσκοπος</td><td>ē hōs allotriepiskopos</td><td>或作為管別人事的</td><td>新約僅此一次；再加一個 ὡς</td></tr><tr><td>εἰ δὲ ὡς Χριστιανός</td><td>ei de hōs Christianos</td><td>但若作為基督徒</td><td>新約只三次</td></tr><tr><td>μὴ αἰσχυνέσθω</td><td>mē aischynesthō</td><td>就不要羞恥</td><td>第三人稱命令</td></tr><tr><td>δοξαζέτω δὲ τὸν θεὸν</td><td>doxazetō de ton theon</td><td>倒要榮耀神</td><td>羞恥換成榮耀</td></tr><tr><td>ἐν τῷ ὀνόματι τούτῳ</td><td>en tō onomati toutō</td><td>在這名裡</td><td>NA28 RP 作 ἐν τῷ μέρει τούτῳ</td></tr></table>","gram":"<p><strong>4:15 用 γάρ（gar） 補一個重要的限制：μὴ γάρ τις ὑμῶν πασχέτω（mē gar tis hymōn paschetō）。</strong>πασχέτω（paschetō） 是第三人稱現在命令，「不可有人作為……受苦」。前三個名詞是法庭上的罪名：φονεὺς（phoneus） 殺人的、κλέπτης（kleptēs） 偷竊的、κακοποιὸς（kakopoios） 作惡的；κακοποιὸς（kakopoios） 正是 2:12 外邦人毀謗信徒的罪名 ὡς κακοποιῶν（hōs kakopoiōn），彼得要他們別讓毀謗成真。第四個字前面再加一次 ὡς（hōs），獨立出來：ἀλλοτριεπίσκοπος（allotriepiskopos）。這個字新約只此一次，在現存的希臘文獻裡也是首見，由 ἀλλότριος（allotrios）「別人的」加上 ἐπίσκοπος（episkopos）「監督」組成；在 SBLGNT 它緊跟異文標記之後，沒有 Strong 編號。</p><p>同一個字根在本卷還出現兩次：2:25 基督是靈魂的 ἐπίσκοπον（episkopon），和合本譯「監督」；5:2 長老要 ἐπισκοποῦντες（episkopountes），和合本譯「照管」。<strong>一種監督是照顧，一種監督是插手。</strong></p><blockquote><p>4:16 的 Χριστιανός（Christianos） 新約只出現三次：徒 11:26 門徒在安提阿被稱為 Χριστιανούς（Christianous）；徒 26:28 亞基帕王說 Χριστιανὸν ποιῆσαι（Christianon poiēsai）；以及這裡。三次都帶著外人的口吻，原本是別人貼在信徒身上的標籤。<strong>經文鑑別：</strong>句末 SBLGNT（與 WH、Treg、NA27）作 ἐν τῷ ὀνόματι τούτῳ（en tō onomati toutō），「在這名裡」，和合本「因這名」照此；NA28 與 RP 作 ἐν τῷ μέρει τούτῳ（en tō merei toutō），「在這件事上、在這方面」。兩種讀法都有可靠的抄本支持。本講義的判斷：講台照和合本「這名」，因為它與 4:14 的「基督的名」和 Χριστιανός（Christianos） 這個名字前後相扣；而「在這事上」的意思並不衝突：在作基督徒受苦這件事上，歸榮耀給神。</p></blockquote>","exp":"<p>〔背景〕可 14:72--72</p><p>「你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦。」（4:15）彼得在高峰之後立刻踩煞車：不是每一種苦都是為主受的。因為犯罪被追究、因為自己的過失丟了工作、因為說話傷人而被疏遠，那不是彼得在這裡要安慰的苦（2:20 已經說過）。本講義分辨四種苦：因犯罪受苦；因行善受苦（3:17）；為義受苦（3:14）；為基督的名受苦（4:14、16）；另外還有不一定「為」甚麼、卻真實存在的百般試煉（1:6）。分辨不是為了審問受苦的人，是為了不把責任和冤屈混在一起：不要對每一個受苦的人預設他一定做錯了甚麼，也不要把自己犯錯的後果包裝成為主受苦。本講義的全卷立場見 ISS00_2。</p><p>清單最後一項很意外：「好管閒事」。殺人、偷竊之後，彼得放了一個管別人家務事的人。寄居的人很容易犯這個錯：熱心過頭，去糾正鄰居的家務、去干涉不信的同事怎樣過日子，結果被厭惡，還以為自己在為主受苦。關心是照顧，插手是越界；前者像牧人，後者像不請自來的監工。</p><p>「若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給神。」（4:16）「基督徒」原本是外人稱呼信徒的名字，常帶著取笑。彼得說：別人拿來笑你的名字，你可以拿來榮耀神。寫這句話的人最知道羞恥是甚麼滋味。那一夜在大祭司的院子裡，他發咒起誓說不認得那人；然後雞叫了，「彼得想起耶穌對他所說的話」（可 14:72），就哭了。如今他對寄居的人說：不要羞恥。不是彼得變勇敢了，是那位被他否認的主，沒有否認他。</p>"},{"a":17,"z":18,"star":2,"grk":"<p lang=\"grc\">ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφʼ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;</p><p lang=\"grc\">καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;</p>","lit":"<p>因為是審判從神的家開始的時候了；若先從我們開始，那些不順從神福音的人，結局會怎樣呢？</p><p>並且若義人僅僅得救，不虔敬的人和罪人將在哪裡顯出來呢？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα</td><td>ho kairos tou arxasthai to krima</td><td>審判開始的時候</td><td>沒有動詞；καιρὸς 是定好的時刻</td></tr><tr><td>ἀπὸ τοῦ οἴκου τοῦ θεοῦ</td><td>apo tou oikou tou theou</td><td>從神的家</td><td>2:5 οἶκος πνευματικὸς</td></tr><tr><td>εἰ δὲ πρῶτον ἀφʼ ἡμῶν</td><td>ei de prōton aph' hēmōn</td><td>若先從我們</td><td>彼得把自己算進去</td></tr><tr><td>τί τὸ τέλος</td><td>ti to telos</td><td>結局會怎樣</td><td>4:7 τὸ τέλος 同字</td></tr><tr><td>τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ</td><td>tōn apeithountōn tō tou theou euangeliō</td><td>不順從神福音的人</td><td>順從與不順從的追蹤</td></tr><tr><td>ὁ δίκαιος μόλις σῴζεται</td><td>ho dikaios molis sōzetai</td><td>義人僅僅得救</td><td>箴 11:31 七十士譯本</td></tr><tr><td>ποῦ φανεῖται</td><td>pou phaneitai</td><td>將在哪裡顯出來</td><td>修辭問句</td></tr></table>","gram":"<p><strong>4:17 用 ὅτι（hoti） 解釋為甚麼受苦的人要歸榮耀給神：審判的時候到了。</strong>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα（ho kairos tou arxasthai to krima） 沒有動詞，「（是）審判開始的時刻」。起點是 ἀπὸ τοῦ οἴκου τοῦ θεοῦ（apo tou oikou tou theou）：「神的家」接回 2:5 的 οἶκος πνευματικὸς（oikos pneumatikos），「靈宮」，信徒自己就是那座殿。這使我們想起瑪 3:1--3：主「必忽然進入他的殿」，又說「他必坐下如煉淨銀子的」（瑪 3:3）；也使我們想起結 9:6 審判「從聖所起」。彼得沒有明引，我們只說這使我們想起。</p><p>εἰ δὲ πρῶτον ἀφʼ ἡμῶν（ei de prōton aph' hēmōn） 改用「我們」，彼得把自己放進被煉的人當中。τί τὸ τέλος（ti to telos） 與 4:7 的 τὸ τέλος（to telos） 同一個字：萬物的結局近了，那不順從福音的人的結局又如何？τῶν ἀπειθούντων（tōn apeithountōn） 是全卷順從與不順從追蹤的一站（2:8；3:1、20）。</p><blockquote><p>4:18 引箴 11:31，字句與七十士譯本幾乎相同：εἰ ὁ δίκαιος μόλις σῴζεται（ei ho dikaios molis sōzetai） 與 ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται（ho asebēs kai hamartōlos pou phaneitai）。和合本箴言照希伯來文作「義人在世尚且受報，何況惡人和罪人呢」（箴 11:31）。這是兩個版本：希伯來文說義人在世上也要受管教，七十士譯本說義人「僅僅」得救。μόλις（molis） 的意思是艱難地、好不容易，徒 14:18 和合本譯作「僅僅地」（又見徒 27:7）；它不是勉強及格，而是說穿過火的路並不輕鬆。彼得引的是讀者手上的希臘文聖經；兩個版本的方向一致：神的管教從自己的家開始。</p></blockquote>","exp":"<p>「因為時候到了，審判要從神的家起首。若是先從我們起首，那不信從神福音的人將有何等的結局呢？」（4:17）這是一句很嚴肅的話，卻是說給受苦的人聽的安慰。讀者正在經歷的火，不是神忘了他們，是神先從自己的家動工。煉金的人把金子放進爐裡，不是因為恨金子，是因為它值得煉。審判在這裡是潔淨，不是毀滅。</p><p>這節經文也要小心用。它說的是神透過苦難煉淨他的子民，不是讓我們把某一間教會的醜聞、某一位牧者的跌倒，拿來宣布「這是神的審判」。教會出了問題，要面對、要處理、要讓該負責的人負責；但把具體的事件對號入座成神的判決，不是我們的位置。彼得說「從我們起首」，他把自己算進去：審判先是自省，不是指著別人。</p><p>「若是義人僅僅得救，那不虔敬和犯罪的人將有何地可站呢？」（4:18）「僅僅」不是說得救靠運氣，也不是說義人的救恩不穩。救恩的根據是基督「義的代替不義的」（3:18），穩如磐石；「僅僅」說的是那條路的艱難：要穿過火，要被誤會，要在餘下的光陰裡一步一步跟著走。如果連蒙恩的人都要這樣被煉，拒絕恩典的人又能站在哪裡？彼得沒有寫出答案，把問題留給讀者：不是叫人恐懼，是叫人珍惜那救他的恩典，也為還沒有信的人迫切。</p>"},{"a":19,"z":19,"star":1,"grk":"<p lang=\"grc\">ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς αὐτῶν ἐν ἀγαθοποιΐᾳ.</p>","lit":"<p>所以那些照著神旨意受苦的人，也要在行善之中，把他們的魂交託給那信實的創造者。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὥστε καὶ</td><td>hōste kai</td><td>所以也</td><td>全段的結論</td></tr><tr><td>οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ θεοῦ</td><td>hoi paschontes kata to thelēma tou theou</td><td>照神旨意受苦的人</td><td>3:17 εἰ θέλοι τὸ θέλημα τοῦ θεοῦ</td></tr><tr><td>πιστῷ κτίστῃ</td><td>pistō ktistē</td><td>信實的創造者</td><td>κτίστῃ 新約僅此一次</td></tr><tr><td>παρατιθέσθωσαν τὰς ψυχὰς αὐτῶν</td><td>paratithesthōsan tas psychas autōn</td><td>要把他們的魂交託</td><td>路 23:46 παρατίθεμαι 同一個動詞</td></tr><tr><td>ἐν ἀγαθοποιΐᾳ</td><td>en agathopoiia</td><td>在行善之中</td><td>新約僅此一次</td></tr></table>","gram":"<p><strong>ὥστε（hōste） 把 4:12--18 收成一個結論。</strong>οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ θεοῦ（hoi paschontes kata to thelēma tou theou） 呼應 3:17 的 εἰ θέλοι τὸ θέλημα τοῦ θεοῦ（ei theloi to thelēma tou theou）：受苦不是人去找來的，是在神旨意的範圍內被允許的。主要動詞 παρατιθέσθωσαν（paratithesthōsan） 是第三人稱現在命令、中間語態，「把（自己的東西）存放在別人手裡」，像把貴重的物品寄存給可靠的人。主耶穌在十字架上最後一句話用的是同一個動詞：Πάτερ εἰς χεῖράς σου παρατίθεμαι τὸ πνεῦμά μου（路 23:46）。</p><p>交託的對象是 πιστῷ κτίστῃ（pistō ktistē），「信實的創造者」；κτίστῃ（ktistē） 新約只此一次，彼得在全卷最需要安慰的地方，稱神為造物主。ἐν ἀγαθοποιΐᾳ（en agathopoiia） 也是新約只此一次，收結全卷「行善」的追蹤（2:15、20；3:6、17）：交託不是停下來，是一邊交託，一邊繼續行善。</p>","exp":"<p>「所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主。」（4:19）火煉的一段，最後落在一個動作：交託。原文是把貴重的東西寄放在可靠的人手裡。這使我們想起主在十字架上的最後一句話：「父啊！我將我的靈魂交在你手裡。」（路 23:46）彼得在 2:23 說主「只將自己交託那按公義審判人的主」（2:23），在這裡請讀者跟著同一串腳印：他怎樣交託，你們也怎樣交託。這是 321 說的無己：不是放棄自己，是把自己放在比自己更可靠的手裡。</p><p>交託的對象是「信實的造化之主」。在火裡的人最需要知道兩件事：他有能力嗎？他靠得住嗎？「造化之主」回答第一個，造你的那一位知道怎樣保守你；「信實的」回答第二個，他不會在火最熱的時候鬆手。</p><p>交託之後呢？「要一心為善」。交託不是躺平，也不是用來壓下憂愁的口號；受苦的人照樣可以哭、可以求助，同時一邊交託，一邊繼續做對的事：照樣上班、照樣照顧家人、照樣在被誤會的地方行善。全卷「行善」的路線在這裡走到終點：答案不是等苦過去再說，是在苦中照樣行善。</p>"}],"5":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Πρεσβυτέρους οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,</p>","lit":"<p>所以在你們中間的長老，我勸，我這同作長老的，又是基督諸受苦的見證人，也是那將要被顯現之榮耀的有分者：</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πρεσβυτέρους οὖν ἐν ὑμῖν παρακαλῶ</td><td>Presbyterous oun en hymin parakalō</td><td>所以在你們中間的長老，我勸</td><td>οὖν 接回 4:17「審判要從神的家起首」</td></tr><tr><td>ὁ συμπρεσβύτερος</td><td>ho sympresbyteros</td><td>同作長老的</td><td>新約只此一次：使徒把自己放進長老團隊</td></tr><tr><td>μάρτυς τῶν τοῦ Χριστοῦ παθημάτων</td><td>martys tōn tou Christou pathēmatōn</td><td>基督諸受苦的見證人</td><td>親眼看見，也開口作證</td></tr><tr><td>τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός</td><td>tēs mellousēs apokalyptesthai doxēs koinōnos</td><td>將要顯現之榮耀的有分者</td><td>1:11 的公式：受苦在前，榮耀在後</td></tr></table>","gram":"<p><strong>5:1 的 οὖν（oun） 不是換話題，是接著第 4 章往下推。</strong>4:17 說「時候到了，審判要從神的家起首」（4:17），火煉的試驗臨到全家，彼得第一個要叮嚀的，就是家裡帶頭的人。受苦的教會最需要的不是更多規條，是好牧人。Πρεσβυτέρους（Presbyterous） 放在全句最前面，受詞先出場：這一段是對長老說的。</p><p>彼得給自己三個稱呼，由兩個冠詞串起來。第一個 ὁ（ho） 管兩個名詞：ὁ συμπρεσβύτερος（ho sympresbyteros） 和 μάρτυς τῶν τοῦ Χριστοῦ παθημάτων（martys tōn tou Christou pathēmatōn）；第二個 ὁ（ho） 引出 τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός（tēs mellousēs apokalyptesthai doxēs koinōnos）。συμπρεσβύτερος（sympresbyteros） 在新約只出現這一次，是把 σύν（syn）「同」加在「長老」前面。1:1 他自稱「使徒」，這裡卻站到長老中間，用同儕的口氣說話。</p><blockquote><p>παθημάτων（pathēmatōn） 與 δόξης（doxēs） 在同一節對排，正是 1:11「預先證明基督受苦難，後來得榮耀」（1:11）的公式。4:13 公式變成了讀者的；到 5:1，寫信的人也把自己放進去：他見證了受苦，也要有分於榮耀。μάρτυς（martys） 兼有「目擊者」與「作證的人」兩層意思，這使我們想起徒 1:22 選立使徒的條件，是要「與我們同作耶穌復活的見證」（徒 1:22）。</p></blockquote>","exp":"<p>〔背景〕徒 3:15--15（使徒行傳講義第 3 章）</p><p>「我這作長老、作基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人」（5:1）。彼得有足夠的資格從上面說話，他卻選了一個站在旁邊的位置。教會裡最有份量的勸勉，常常不是「我命令你」，是「我和你一樣」。本講義不在這裡展開彼得的職分之爭（議題頁另論），只看他自己怎麼稱呼自己：同作長老的。</p><p>「作基督受苦的見證」這幾個字，由彼得寫出來特別重。他確實看見了：客西馬尼園、大祭司的院子、被釘的十字架。可是那一夜他也是在炭火旁三次說「我不認得他」的人。他看見了基督受苦，自己卻逃開了。這樣的人還能說「我是見證人」嗎？能，因為主沒有放棄他。五旬節之後，他站在聖殿裡說「我們都是為這事作見證」（徒 3:15）。見證的資格不是從來沒有跌倒，是被那受苦的主找回來。</p><p>「同享後來所要顯現之榮耀」把全卷的公式放進他自己的生命。當年聽見主說要受苦，他拉著主勸「萬不可如此」（太 16:22）；如今他把受苦與榮耀並排寫在自己的名字旁邊。這不是彼得變好了，是十字架改變了他對榮耀的定義：榮耀不是繞過受苦，是穿過受苦。</p><p>這也是 235 的「5」：團隊。長老不是一個人扛起一間教會，是一群同作長老的人一起被牧長帶領。一個散在各國的線上團契尤其需要這種同工的眼光：帶小組的、管影音的、半夜接代禱電話的，都是彼此的同伴，不是彼此的上司。</p>"},{"a":2,"z":3,"star":3,"grk":"<p lang=\"grc\">ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως κατὰ θεόν, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,</p><p lang=\"grc\">μηδʼ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·</p>","lit":"<p>你們要牧養在你們中間神的群羊，監督著，不是被強迫地，乃是甘心地，照著神；也不是貪圖可恥之利地，乃是熱切地；</p><p>也不是如同在那些分得之產業上作主的，乃是成為群羊的榜樣；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ποιμάνατε</td><td>poimanate</td><td>你們要牧養</td><td>不定過去式命令；約 21:16 同一個動詞</td></tr><tr><td>ποίμνιον τοῦ θεοῦ</td><td>poimnion tou theou</td><td>神的群羊</td><td>羊屬於神，不屬於長老</td></tr><tr><td>ἐπισκοποῦντες</td><td>episkopountes</td><td>監督著</td><td>WH 無；和合本「照管」</td></tr><tr><td>κατὰ θεόν</td><td>kata theon</td><td>照著神</td><td>WH、RP 無；和合本小字補「旨意」</td></tr><tr><td>μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως</td><td>mē anankastōs alla hekousiōs</td><td>不是被強迫，乃是甘心</td><td>第一組：動機</td></tr><tr><td>μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως</td><td>mēde aischrokerdōs alla prothymōs</td><td>不是貪可恥的利，乃是熱切</td><td>第二組：錢</td></tr><tr><td>μηδʼ ὡς κατακυριεύοντες τῶν κλήρων</td><td>mēd' hōs katakyrieuontes tōn klērōn</td><td>不是在分給的產業上作主</td><td>第三組：權；可 10:42 同一個字</td></tr><tr><td>ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου</td><td>alla typoi ginomenoi tou poimniou</td><td>乃是成為群羊的榜樣</td><td>τύπος 是印模壓出來的形狀</td></tr></table>","gram":"<p><strong>ποιμάνατε（poimanate） 是不定過去式命令語氣，整段的主要動詞只有這一個。</strong>其餘全是附屬：一個分詞 ἐπισκοποῦντες（episkopountes），三組副詞或分詞的「不是……乃是」。受詞 τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ（to en hymin poimnion tou theou） 的屬格很要緊：羊是「神的」，長老只是被託付看顧。約 21:16 復活的主對彼得說 Ποίμαινε（Poimaine），同一個動詞 ποιμαίνω（poimainō）；被託付的人，現在把託付傳下去。</p><blockquote><p><strong>經文鑑別：</strong>SBLGNT、NA28 有 ἐπισκοποῦντες（episkopountes），WH 依西乃抄本與梵蒂岡抄本刪去；κατὰ θεόν（kata theon） 則 SBLGNT、NA28 有，WH 與 RP 都沒有。和合本「按著神旨意照管他們」兩者都譯了，「旨意」是小字補充。本講義的判斷：照 SBLGNT。即使刪去 ἐπισκοποῦντες（episkopountes），牧養本身就包含看顧，2:25 已經把「牧人」與「監督」並列；κατὰ θεόν（kata theon） 補上一把尺：牧養的標準是神，不是長老的喜好。兩種讀法都不改變這段的意思，講台照和合本。</p></blockquote><p>三組對照一組比一組長。前兩組是副詞：μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως（mē anankastōs alla hekousiōs）、μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως（mēde aischrokerdōs alla prothymōs）。第三組換成分詞加名詞：μηδʼ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου（mēd' hōs katakyrieuontes tōn klērōn alla typoi ginomenoi tou poimniou）。κατακυριεύοντες（katakyrieuontes） 是 κατά（kata）「向下」加「作主」，在別人頭上作主子；可 10:42 主說外邦君王 κατακυριεύουσιν（katakyrieuousin），同一個字。τῶν κλήρων（tōn klērōn） 原是抽籤分得的產業，指各長老分到要看顧的人。τύποι（typoi） 是印模壓出來的形狀，長老要成為一個可以被照著描的樣子。</p>","exp":"<p>〔背景〕約 21:15--17（約翰福音講義第 21 章）</p><p>「務要牧養在你們中間神的群羊」（5:2）。寫這句話的人，曾經在加利利海邊的炭火旁，被主問了三次「你愛我嗎」，然後聽見「你牧養我的羊」（約 21:16）。主沒有先要他交一份悔過書，只給了他一群羊。如今他把同樣的託付交給各地的長老。羊是神的，這一句話就劃清了界線：牧者不是主人，是管家。</p><p>接著是三組「不是……乃是」，這是全本新約對屬靈領袖最具體的一張檢核表。<strong>第一組問動機：</strong>不是出於勉強，乃是出於甘心。被逼著服事的人，很快會把怨氣倒在羊身上。<strong>第二組問錢：</strong>不是因為貪財，乃是出於樂意。牧者可以得供養，但不可以把羊當成收入的來源；教會的財務與牧者的待遇要透明，這是保護羊，也是保護牧者。<strong>第三組問權：</strong>不是轄制，乃是作榜樣。主說外邦人「有大臣操權管束他們」（可 10:42），又說「只是在你們中間，不可這樣」（太 20:26）。</p><p>「轄制」在今天長甚麼樣子？以神的名要求絕對的服從、不准提問、公開羞辱、控制會友的私人生活與財務、以「屬靈」為理由把人和家人朋友隔開、把領袖的意見等同神的旨意，這些都不是牧養，是 5:3 說的轄制。遇到這樣的處境，會友可以提問、可以求助、可以離開，這不違背 5:5。本講義的全卷立場見 ISS00_5。</p><p>「乃是作群羊的榜樣」（5:3）。牧者最大的權柄不是頭銜，是生命被人看見之後，人願意跟著走。這也接回全卷的樞紐：基督「給你們留下榜樣」（2:21）。長老的榜樣不是自己發明的，是照著那串腳印描出來的。所以 321 說「耶穌是我的榜樣」，長老是第一批照著描的人；而一個抓住權力不放的人，正是離開了本位。</p>"},{"a":4,"z":4,"star":1,"grk":"<p lang=\"grc\">καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.</p>","lit":"<p>並且當牧長被顯現的時候，你們將要領受那不凋謝的榮耀的冠冕。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>φανερωθέντος τοῦ ἀρχιποίμενος</td><td>phanerōthentos tou archipoimenos</td><td>當牧長被顯現的時候</td><td>獨立屬格；1:20 同一個分詞</td></tr><tr><td>ἀρχιποίμενος</td><td>archipoimenos</td><td>牧長</td><td>新約只此一次：牧人之首</td></tr><tr><td>κομιεῖσθε</td><td>komieisthe</td><td>你們將要領受</td><td>未來式關身：把應得的帶回去</td></tr><tr><td>τὸν ἀμαράντινον τῆς δόξης στέφανον</td><td>ton amarantinon tēs doxēs stephanon</td><td>不凋謝的榮耀冠冕</td><td>1:4 ἀμάραντον「不能衰殘」同字根</td></tr></table>","gram":"<p>φανερωθέντος τοῦ ἀρχιποίμενος（phanerōthentos tou archipoimenos） 是獨立屬格，不定過去式被動分詞，「當牧長被顯明的時候」。1:20 說基督「在這末世才為你們顯現」（1:20），用的是同一個分詞；第一次顯現是為了贖我們，再一次顯現是來收他的羊。ἀρχιποίμενος（archipoimenos） 是新約唯一一次，前綴的意思是「為首的」，牧人之上的那一位牧人。</p><p>κομιεῖσθε（komieisthe） 是未來式關身語態，常用在領回應得之物，1:9 已說他們「得著你們信心的果效」（1:9）用同一個動詞。τὸν ἀμαράντινον τῆς δόξης στέφανον（ton amarantinon tēs doxēs stephanon）：στέφανον（stephanon） 是比賽得勝者頭上的花環，不是王冠；ἀμαράντινον（amarantinon） 也是新約唯一一次，字面是「用不凋花編成的」，與 1:4 的 ἀμάραντον（amaranton）「不能衰殘」同字根。全卷的對照在這裡收尾：地上的花冠幾天就枯了，牧長給的冠冕永不衰殘。</p>","exp":"<p>「到了牧長顯現的時候，你們必得那永不衰殘的榮耀冠冕。」（5:4）上一節才說不可轄制，這一節馬上告訴長老：你們頭上還有一位。牧者是被牧養的人，長老要向牧長交帳。2:25 說讀者「如今卻歸到你們靈魂的牧人監督了」（2:25），真正的牧人只有一位，其他的都是助手。這使我們想起主自己說「我是好牧人；好牧人為羊捨命」（約 10:11），也使我們想起希伯來書講義第 13 章的「群羊的大牧人」。</p><p>這一節也回答了 5:2 的「不是因為貪財」。長老的報酬是有的，只是不在今天發放。許多牧者在小教會、在異鄉、在沒有人看見的地方服事多年，掌聲不多，薪水微薄。彼得沒有說「你們不需要被肯定」，他說肯定要從牧長手裡來，而且那頂冠冕不會像奧運的橄欖枝一樣枯萎。</p><p>這頂冠冕不是給最有名的長老，是給忠心的長老。牧長顯現的那一天，他看的不是會眾人數，是羊有沒有被好好餵養。這叫服事的人在今天就可以放下比較，回到本分。</p>"},{"a":5,"z":5,"star":3,"grk":"<p lang=\"grc\">ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.</p>","lit":"<p>同樣，年輕的人們，你們要順服年長的。而你們眾人要彼此把謙卑繫上如同圍裙，因為「神與驕傲的人列陣對抗，卻把恩典賜給謙卑的人」。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁμοίως</td><td>homoiōs</td><td>同樣</td><td>3:1、3:7 也用它開頭</td></tr><tr><td>ὑποτάγητε πρεσβυτέροις</td><td>hypotagēte presbyterois</td><td>要順服年長的</td><td>πρεσβυτέροις 可指年長者或長老</td></tr><tr><td>πάντες δὲ ἀλλήλοις</td><td>pantes de allēlois</td><td>而你們眾人彼此</td><td>δέ 一轉：從年輕人轉到所有人</td></tr><tr><td>τὴν ταπεινοφροσύνην ἐγκομβώσασθε</td><td>tēn tapeinophrosynēn enkombōsasthe</td><td>把謙卑繫上</td><td>新約只此一次：奴僕做工的圍裙</td></tr><tr><td>Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται</td><td>Ho theos hyperēphanois antitassetai</td><td>神與驕傲的人列陣對抗</td><td>箴 3:34 七十士譯本；雅 4:6 引同一句</td></tr><tr><td>ταπεινοῖς δὲ δίδωσιν χάριν</td><td>tapeinois de didōsin charin</td><td>卻把恩典賜給謙卑的人</td><td>與 ταπεινοφροσύνην 同字根</td></tr></table>","gram":"<p><strong>5:5 有兩個命令，對象不同。</strong>先是 ὁμοίως（homoiōs）, νεώτεροι（neōteroi）, ὑποτάγητε πρεσβυτέροις（hypotagēte presbyterois）：年輕的人要順服年長的。πρεσβυτέροις（presbyterois） 與 5:1 的「長老」是同一個字，在這裡可以指年長的人，也可以指教會的長老，兩讀都有學者主張；本講義兩者都留著，因為第一世紀的長老多半也是年長的人。接著 δέ（de） 一轉：πάντες δὲ ἀλλήλοις（pantes de allēlois），「而你們眾人彼此」。命令從一群人擴大到所有人，方向從單向變成雙向。</p><p>ἐγκομβώσασθε（enkombōsasthe） 是不定過去式關身命令，字典形 ἐγκομβόομαι（enkomboomai），新約只出現這一次。字根是「結、扣」，指把一件衣服打結繫在身上；同字根的名詞是奴僕做工時圍在外面的圍裙。彼得沒有說「要有謙卑的感覺」，他說要把謙卑像一件工作服一樣穿上：別人看得見，而且是為了做事。</p><blockquote><p><strong>舊約引文：</strong>ὅτι（hoti） 引出箴 3:34。彼得照的是七十士譯本，雅 4:6 引的也是同一句，兩處字句完全相同（都以 Ὁ θεὸς（Ho theos） 開頭，七十士譯本作「主」）。和合本箴言照希伯來文，作「他譏誚那好譏誚的人，賜恩給謙卑的人」（箴 3:34），彼得前書則作「神阻擋驕傲的人，賜恩給謙卑的人」（5:5），這是兩個版本，不是彼得引錯。ἀντιτάσσεται（antitassetai） 是軍事用語，「擺開陣勢對抗」：驕傲不只是性格缺點，是把神變成對手。後半句 ταπεινοῖς（tapeinois） 與前面的 ταπεινοφροσύνην（tapeinophrosynēn） 同字根，彼得用引文把命令釘牢。</p></blockquote>","exp":"<p>〔背景〕約 13:4--8；約 21:18--18（約翰福音講義第 13、21 章）</p><p>〔雅〕雅 4:6--6</p><p>「你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服」（5:5）。這一節最常被讀錯的地方，是只讀前半句。前半句對年輕人說，後半句對所有人說，包括剛被勸勉的長老。<strong>謙卑是長幼雙方的圍裙，不是只綁在年輕人身上的繩子。</strong>年輕人尊重年長者的經驗，年長者也要繫上圍裙，聽年輕人的問題。所以這一節不可用來壓制年輕同工的提問與不同意見；華人教會的世代張力，要用「同心，彼此體恤」（3:8）去處理，不是用一句「長幼有序」結案。</p><p>「以謙卑束腰」的圖畫，彼得一定忘不了。最後的晚餐，主「拿一條手巾束腰」（約 13:4），蹲下來洗門徒的腳。輪到彼得，他說「你永不可洗我的腳！」（約 13:8）那時他以為謙卑是不讓主服事他；後來他才明白，謙卑是先讓主洗，再去洗別人。復活的主也曾對他說「你年少的時候，自己束上帶子，隨意往來」（約 21:18），自己決定往哪裡去。如今這個人寫信叫全教會束上的，是一條奴僕的圍裙。焦點不在彼得學會了甚麼，在那位先束上手巾的主。</p><p>彼得為甚麼引箴 3:34？雅各書也引了同一句，但兩位使徒用它做的事不同。雅各書的重點是前一句「但他賜更多的恩典」（雅 4:6）：恩典比驕傲大，所以要歸回。彼得前書的重點是「穿上」：既然神與驕傲的人擺陣對抗，就把謙卑繫在身上。驕傲不只是看不起人，更嚴重的是讓神站到你的對面。</p><p>這一節還沒講完，下一句是「所以」。5:5 的圍裙與 5:6--7 的卸下要放在一起讀，謙卑的全貌要到那裡才看得清楚。</p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,</p><p lang=\"grc\">πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπʼ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.</p>","lit":"<p>所以你們要被降卑在神那有力的手底下，好叫他在合適的時候把你們升高，</p><p>把你們一切的憂慮拋到他身上，因為他把你們放在心上。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ταπεινώθητε οὖν</td><td>Tapeinōthēte oun</td><td>所以你們要被降卑</td><td>不定過去式被動命令</td></tr><tr><td>ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ</td><td>hypo tēn krataian cheira tou theou</td><td>在神有力的手底下</td><td>出埃及的語言</td></tr><tr><td>ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ</td><td>hina hymas hypsōsē en kairō</td><td>好叫他到了時候升高你們</td><td>雅 4:10 沒有「到了時候」</td></tr><tr><td>πᾶσαν τὴν μέριμναν ὑμῶν</td><td>pasan tēn merimnan hymōn</td><td>你們一切的憂慮</td><td>單數：所有憂慮捆成一包</td></tr><tr><td>ἐπιρίψαντες</td><td>epiripsantes</td><td>拋上去</td><td>分詞，不是另一個命令；新約只兩次</td></tr><tr><td>ὅτι αὐτῷ μέλει περὶ ὑμῶν</td><td>hoti autō melei peri hymōn</td><td>因為他把你們放在心上</td><td>可 4:38「你不顧嗎」同一個字</td></tr></table>","gram":"<p><strong>5:6--7 在原文是同一個句子。</strong>主要動詞只有 Ταπεινώθητε（Tapeinōthēte），不定過去式被動命令，「你們要被降卑」，也就是讓自己被放低。5:7 開頭的 ἐπιρίψαντες（epiripsantes） 是不定過去式分詞，不是第二個命令。和合本把它譯成「你們要將……卸給神」，讀起來像另起一句；原文卻是把分詞掛在 5:6 的命令底下，說明怎樣被降卑：<strong>自卑的方式，就是把憂慮卸給他。</strong></p><p>οὖν（oun） 接回 5:5 的引文：既然神賜恩給謙卑的人，所以要自卑。ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ（hypo tēn krataian cheira tou theou） 是出埃及的語言，這使我們想起申 26:8「他就用大能的手和伸出來的膀臂」（申 26:8）領百姓出埃及；那隻手會管教，也會拯救。ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ（hina hymas hypsōsē en kairō） 與雅 4:10 幾乎相同，彼得多了 ἐν καιρῷ（en kairō），「到了時候」：升高的時間表在神手裡。</p><blockquote><p>ἐπιρίψαντες（epiripsantes） 是未標號字，新約只出現兩次，另一次在路 19:35 門徒把衣服搭在驢駒上：把東西拋到另一個身上。πᾶσαν τὴν μέριμναν ὑμῶν（pasan tēn merimnan hymōn） 用單數，一切的憂慮捆成一包，一次拋上去。ὅτι αὐτῷ μέλει περὶ ὑμῶν（hoti autō melei peri hymōn） 是無人稱句，字面「關於你們，對他是要緊的」。μέλει（melei） 在可 4:38 出現在門徒的質問裡：「夫子！我們喪命，你不顧嗎？」（可 4:38）同一個字。</p></blockquote>","exp":"<p>〔雅〕雅 4:10--10</p><p>「所以，你們要自卑，服在神大能的手下，到了時候，他必叫你們升高。」（5:6）自卑不是自我貶低，也不是逢人就說自己不行；它是一個位置：在神的手底下。那隻手曾用十災與紅海把百姓帶出埃及，也會在今天的苦難裡管教、保護、托住。被那隻手壓低的人，不是被丟下，是被握住。「到了時候」承認了一件真實的事：升高常常不是馬上。</p><p>原文接著說：方法就是「你們要將一切的憂慮卸給神，因為他顧念你們」（5:7）。這是 5:5 的另一半。<strong>驕傲不只抓住權力，也抓住重擔。</strong>一個甚麼都要自己扛、睡不著也不肯交出去的人，表面上是負責，裡面卻是另一種想代替神：好像這件事沒有我就不行。謙卑是把圍裙繫上，去服事人；也是把重擔卸下，讓神作神。這使我們想起詩 55:22「你要把你的重擔卸給耶和華」（詩 55:22）。</p><p>「卸給神」不是「不可以憂慮」。彼得在 1:6 承認讀者「在百般的試煉中暫時憂愁」（1:6），沒有責備他們。憂慮不是罪，焦慮的人也不是信心不夠的人；憂慮是要被拋給神的東西，不是要被藏起來的羞恥。卸給神也不排斥看醫生、接受心理諮商：神的顧念常常就經由這些幫助臨到。憂慮可能要一次又一次地拋，這不是失敗，是學習。</p><p>「因為他顧念你們」是全章的轉折。多年前在加利利海的風浪裡，門徒叫醒主說「夫子！我們喪命，你不顧嗎？」（可 4:38）彼得當時就在船上。如今他用同一個字回答那個問題：他顧念。主沒有在那天的船上把他們丟掉，也不會在今天的苦難裡把你丟掉。321 說謙卑是復興的鑰匙，在這裡我們認出它的樣子：不是更用力地證明自己，是承認自己扛不動，把一切交給那位顧念你的神。</p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν τινα καταπιεῖν</p><p lang=\"grc\">ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.</p>","lit":"<p>你們要清醒，要警醒。你們的對頭魔鬼，如同吼叫的獅子，走來走去，尋找某個人去吞下。</p><p>你們要抵擋他，在信心上堅固，知道同樣的苦難正在你們在世上的弟兄團體身上完成。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>νήψατε, γρηγορήσατε</td><td>nēpsate, grēgorēsate</td><td>要清醒，要警醒</td><td>兩個不定過去式命令，沒有連接詞</td></tr><tr><td>ὁ ἀντίδικος ὑμῶν διάβολος</td><td>ho antidikos hymōn diabolos</td><td>你們的對頭魔鬼</td><td>ἀντίδικος 法庭上的原告</td></tr><tr><td>ὡς λέων ὠρυόμενος</td><td>hōs leōn ōryomenos</td><td>如同吼叫的獅子</td><td>ὡς：比喻，不是真的獅子</td></tr><tr><td>ζητῶν τινα καταπιεῖν</td><td>zētōn tina katapiein</td><td>尋找某人去吞下</td><td>τινα 有異文</td></tr><tr><td>ᾧ ἀντίστητε</td><td>hō antistēte</td><td>你們要抵擋他</td><td>雅 4:7 同一個命令</td></tr><tr><td>στερεοὶ τῇ πίστει</td><td>stereoi tē pistei</td><td>在信心上堅固</td><td>硬實、站得穩</td></tr><tr><td>τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι</td><td>tē en tō kosmō hymōn adelphotēti</td><td>你們在世上的弟兄團體</td><td>2:17「親愛教中的弟兄」同一個字</td></tr></table>","gram":"<p>νήψατε（nēpsate） 與 γρηγορήσατε（grēgorēsate） 是兩個不定過去式命令，中間沒有連接詞，像短促的口令。「謹守」在本卷第三次出現（1:13；4:7），是頭腦清醒、不被灌醉；「警醒」是不打瞌睡。</p><p>ὁ ἀντίδικος ὑμῶν διάβολος（ho antidikos hymōn diabolos）：ἀντίδικος（antidikos） 本是法庭上的對造、原告，διάβολος（diabolos） 是毀謗者，兩個字都帶著控告的味道。這使我們想起啟 12:10 說他「晝夜控告我們弟兄」（啟 12:10）。ὡς λέων ὠρυόμενος（hōs leōn ōryomenos） 是比喻；這使我們想起詩 22:13「好像抓撕吼叫的獅子」（詩 22:13）。περιπατεῖ（peripatei） 是現在式，他一直在走動。</p><blockquote><p><strong>經文鑑別：</strong>ζητῶν τινα καταπιεῖν（zētōn tina katapiein） 的 τινα（tina），SBLGNT 作不定代名詞「某個人」；RP 作疑問代名詞 τίνα（tina），「要吞吃誰」；WH 與 Tregelles 沒有這個字，讀作「尋找要吞吃」。和合本「尋找可吞吃的人」照前兩者。三種讀法意思相近，本講義照 SBLGNT。καταπιεῖν（katapiein） 是「整口吞下」，未標號字。</p></blockquote><p>5:9 以關係代名詞 ᾧ（hō） 開頭，ᾧ ἀντίστητε（hō antistēte） 與雅 4:7 是同一個命令。στερεοὶ τῇ πίστει（stereoi tē pistei）：站得穩的不是人的力氣，是信心。εἰδότες（eidotes） 帶出理由：同樣的苦難 ἐπιτελεῖσθαι（epiteleisthai），現在式被動，「正在被完成」，落在 τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι（tē en tō kosmō hymōn adelphotēti） 身上。ἀδελφότητι（adelphotēti） 在新約只在本卷出現，2:17 一次，這裡一次：全世界的弟兄是一個家。</p>","exp":"<p>〔背景〕太 26:40--41（馬太講義第 26 章）</p><p>「務要謹守，警醒。」（5:8）寫這兩個字的人，曾經在客西馬尼園三次睡著。主對他說「你們不能同我警醒片時嗎？」（太 26:40）又說「總要警醒禱告，免得入了迷惑」（太 26:41）。那一夜他沒有警醒，接著就在院子裡跌倒。他知道打瞌睡的代價，也知道主怎樣接住跌倒的人。</p><p>獅子在這裡是全卷地勢的最低點。第一世紀的讀者對這個比喻不陌生，鬥獸場與逼迫的傳聞都在耳邊。但我們不必把今天的新聞一條一條對號入座。彼得的重點是：魔鬼是控告者，他要吞吃的不只是性命，更是受苦的人的信心，叫人在苦難裡懷疑神、離開群羊。所以他接在「卸給神」後面出場：不肯卸下重擔的人，最容易被壓垮，也最容易被吞吃。</p><p>這一節不是叫人凡事都看成魔鬼搞的，也不是用魔鬼嚇唬人。生病要看醫生，衝突要好好溝通，罪要自己承認，不可甚麼都推給仇敵。屬靈爭戰的全貌，本講義沿用以弗所書立場四。彼得給的方法也很樸素：「你們要用堅固的信心抵擋他」（5:9）。次序很重要：先以謙卑束腰（5:5），先卸下憂慮（5:7），然後抵擋。雅各書也是這個次序：「你們要順服神。務要抵擋魔鬼」（雅 4:7）。</p><p>最後一句是安慰：「因為知道你們在世上的眾弟兄也是經歷這樣的苦難」（5:9）。受苦最可怕的謊言是「只有你這樣」。你不是一個人在抵擋。今天在世界各地仍有因信受逼迫、被關、失去工作的弟兄姊妹，記念他們、為他們禱告，是同一個家的人彼此相顧；散在各國的團契也是這樣，在不同時區的人，抵擋的是同一隻獅子。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν Χριστῷ ὀλίγον παθόντας αὐτὸς καταρτίσει στηρίξει, σθενώσει, θεμελιώσει</p><p lang=\"grc\">αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων · ἀμήν.</p>","lit":"<p>而那一切恩典的神，就是在基督裡呼召你們進入他永遠榮耀的那一位，在你們受苦一點點之後，他自己要修補、要堅固、要使有力、要立根基。</p><p>權能歸給他，直到眾世代的世代。阿們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ δὲ θεὸς πάσης χάριτος</td><td>ho de theos pasēs charitos</td><td>而那一切恩典的神</td><td>δέ 一轉：獅子之後是神</td></tr><tr><td>ὀλίγον παθόντας</td><td>oligon pathontas</td><td>受苦一點點之後</td><td>與 1:6 的 ὀλίγον 首尾呼應</td></tr><tr><td>αὐτὸς καταρτίσει</td><td>autos katartisei</td><td>他自己要修補</td><td>可 1:19 補網的字</td></tr><tr><td>στηρίξει</td><td>stērixei</td><td>要堅固</td><td>路 22:32 στήρισον 同一個字</td></tr><tr><td>σθενώσει</td><td>sthenōsei</td><td>要使有力</td><td>新約只此一次</td></tr><tr><td>θεμελιώσει</td><td>themeliōsei</td><td>要立根基</td><td>WH、Treg 無；和合本只譯三個動詞</td></tr><tr><td>αὐτῷ τὸ κράτος</td><td>autō to kratos</td><td>權能歸給他</td><td>沒有動詞的頌讚</td></tr></table>","gram":"<p><strong>5:10 用 δέ（de） 把獅子和神放在對面。</strong>主詞很長：ὁ δὲ θεὸς πάσης χάριτος（ho de theos pasēs charitos）, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν Χριστῷ（ho kalesas hymas eis tēn aiōnion autou doxan en Christō）。接著是 ὀλίγον παθόντας（oligon pathontas），「受苦一點點之後」，ὀλίγον（oligon） 與 1:6 的「暫時」是同一個字：全卷頭尾兩個 ὀλίγον（oligon） 把苦難框住。αἰώνιον（aiōnion） 對 ὀλίγον（oligon）：受苦是一點點，榮耀是永遠。</p><p>然後才是主要動詞，四個未來直說語氣，沒有連接詞一字排開，前面加上強調的 αὐτὸς（autos），「他自己」。不是祈願，是應許。καταρτίσει（katartisei） 是 καταρτίζω（katartizō），可 1:19 雅各和約翰在船上 καταρτίζοντας（katartizontas），就是補網；στηρίξει（stērixei） 是 στηρίζω（stērizō），路 22:32 主對彼得說 στήρισον（stērison），「要堅固你的弟兄」；σθενώσει（sthenōsei） 新約只此一次；θεμελιώσει（themeliōsei） 是 θεμελιόω（themelioō），立下根基，太 7:25 房子不倒，因為 τεθεμελίωτο（tethemeliōto）。</p><blockquote><p><strong>經文鑑別：</strong>第四個動詞 θεμελιώσει（themeliōsei），SBLGNT、NA28、RP 都有；WH 與 Tregelles 沒有，和合本「成全你們，堅固你們，賜力量給你們」只譯三個動詞，照的是後者。本講義的判斷：照 SBLGNT，四個動詞都講。它沒有改變這一節的意思，卻多了一幅圖畫：寄居的人在地上沒有地基，神親自給他們打根基。講台引和合本時，可以說明原文還有「立根基」一詞。5:11 αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων（autō to kratos eis tous aiōnas tōn aiōnōn） 沒有動詞，4:11 的頌讚也有「權能」，這裡只留下權能：剛說完吼叫的獅子，彼得宣告權能屬於誰。</p></blockquote>","exp":"<p>〔背景〕路 22:31--32（路加講義第 22 章）</p><p>「那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀，等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們。」（5:10）全卷地勢最低的地方是 5:8 的獅子，最高的地方就在兩節之後。吼叫的聲音很大，但最後一句話不是獅子說的。</p><p>一封講了五章「你們要」的信，最後一句是「他必要」。前面的命令都是真實的：要聖潔、要順服、要謹守、要牧養、要束腰、要抵擋。但彼得知道，寄居的人做不完這些，所以最後的主詞換成了 αὐτὸς（autos），神自己。反敗為勝不是人咬牙撐出來的，是神親自做成的；這就是得勝者的根據。</p><p>四個動詞各有一幅圖。<strong>成全</strong>是補網：破了洞的人不是被丟掉，是被一針一針補好再下水。<strong>堅固</strong>這個字，彼得最熟悉：主在被賣的那夜對他說「西門！西門！撒但想要得著你們，好篩你們像篩麥子一樣」（路 22:31），又說「你回頭以後，要堅固你的弟兄」（路 22:32）。這封信就是那個回頭的人在堅固弟兄，而他用的正是主當年的字。不是彼得變強了，是主為他祈求的話成就了。<strong>賜力量</strong>給軟弱的人加力；<strong>立根基</strong>給沒有地的人一塊磐石，主說那房子「總不倒塌，因為根基立在磐石上」（太 7:25）。</p><p>「暫受苦難」要和 1:6「暫時憂愁」一起讀。彼得沒有說苦難很小，被誤會、被冤屈、被逼迫都是真的痛；他說苦難有盡頭，榮耀沒有盡頭。永恆的觀點不是把苦難變小，是把盼望變大。所以頌讚緊接而來：「願權能歸給他，直到永永遠遠。阿們！」（5:11）</p>"},{"a":12,"z":12,"star":1,"grk":"<p lang=\"grc\">Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, διʼ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν στῆτε</p>","lit":"<p>藉著西拉——在我看來是忠心的弟兄——我簡短地寫給你們，勸勉並且證明：這就是神真實的恩典；你們要站在其中。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διὰ Σιλουανοῦ</td><td>Dia Silouanou</td><td>藉著西拉</td><td>送信人或執筆人，兩讀並陳</td></tr><tr><td>ὡς λογίζομαι</td><td>hōs logizomai</td><td>照我看來</td><td>修飾「忠心的」：彼得的評價</td></tr><tr><td>διʼ ὀλίγων ἔγραψα</td><td>di' oligōn egrapsa</td><td>我簡短地寫了</td><td>ὀλίγων 與 5:10 ὀλίγον 同字</td></tr><tr><td>ἐπιμαρτυρῶν</td><td>epimartyrōn</td><td>又加上證明</td><td>新約只此一次</td></tr><tr><td>ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ</td><td>tautēn einai alēthē charin tou theou</td><td>這就是神真實的恩典</td><td>ταύτην 指全信所講的恩</td></tr><tr><td>εἰς ἣν στῆτε</td><td>eis hēn stēte</td><td>你們要站在其中</td><td>不定過去式命令</td></tr></table>","gram":"<p>Διὰ Σιλουανοῦ（Dia Silouanou） 的 διά（dia） 加屬格，可以指送信的人，也可以指替人執筆、整理文字的人。新約書信兩種用法都有，學者至今兩讀並陳，本講義不定案。Σιλουανοῦ（Silouanou） 這個名字，就是使徒行傳裡的西拉，拉丁化的全名。ὡς λογίζομαι（hōs logizomai） 修飾「忠心的弟兄」：「照我看來」，是彼得對同工的親口評價。</p><p>διʼ ὀλίγων ἔγραψα（di' oligōn egrapsa）：「我寫得很少」，ὀλίγων（oligōn） 與 5:10 的 ὀλίγον（oligon） 同一個字根，受苦是一點點，信也只寫了一點點。兩個現在式分詞 παρακαλῶν καὶ ἐπιμαρτυρῶν（parakalōn kai epimartyrōn） 是全信的目的總結：勸勉，並且證明。ταύτην（tautēn） 指他整封信講的那恩，包括在苦難裡的恩。最後是 εἰς ἣν στῆτε（eis hēn stēte），不定過去式命令；有抄本作直說語氣「你們所站的」，和合本照命令語氣「務要站立得住」，本講義同。</p>","exp":"<p>〔背景〕徒 15:22--22；徒 15:40--40（使徒行傳講義第 15 章）</p><p>「我略略地寫了這信，託我所看為忠心的兄弟西拉轉交你們」（5:12）。西拉是耶路撒冷大會差派出去的人，後來陪保羅走第二次宣教旅程，在腓立比和保羅一同受刑、下監；他也是羅馬公民，保羅說「我們是羅馬人」（徒 16:37）。他是送信的，還是協助執筆的，議題頁另論，本講義的全卷立場見 ISS00_6。值得注意的是：一個曾與保羅同工的人，此刻在彼得身邊。使徒之間沒有陣營，只有同一位主。</p><p>「勸勉你們，又證明這恩是神的真恩。你們務要在這恩上站立得住。」（5:12）寄居的人在地上沒有自己的地，卻有一個可以站的地方：恩典。寫這句話的人，曾經在大祭司的院子裡，連一個使女的問話都站不住，說「女子，我不認得他」（路 22:57）。如今他叫散在五個地區的信徒站住，不是因為他自己站穩了，是因為那恩托住了他。</p><p>本章的次序不可顛倒：先是「他顧念你們」（5:7），再是「必要親自成全你們」（5:10），最後才是「你們務要在這恩上站立得住」（5:12）。站立是回應，不是條件；我們站在恩上，是因為恩先托住了我們。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.</p><p lang=\"grc\">ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν Χριστῷ</p>","lit":"<p>那在巴比倫、與你們一同被揀選的（教會）問候你們，我的兒子馬可也問候你們。</p><p>你們要用愛的親吻彼此問候。平安給你們眾人，就是那些在基督裡的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ ἐν Βαβυλῶνι συνεκλεκτὴ</td><td>hē en Babylōni syneklektē</td><td>那在巴比倫一同被揀選的</td><td>陰性：和合本補「教會」</td></tr><tr><td>Βαβυλῶνι</td><td>Babylōni</td><td>巴比倫</td><td>三讀；本講義採羅馬</td></tr><tr><td>Μᾶρκος ὁ υἱός μου</td><td>Markos ho huios mou</td><td>我的兒子馬可</td><td>屬靈的父子</td></tr><tr><td>ἐν φιλήματι ἀγάπης</td><td>en philēmati agapēs</td><td>用愛的親吻</td><td>保羅書信作「聖潔的」</td></tr><tr><td>εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν Χριστῷ</td><td>eirēnē hymin pasin tois en Christō</td><td>平安給你們凡在基督裡的</td><td>全信最後一詞</td></tr></table>","gram":"<p>ἡ ἐν Βαβυλῶνι συνεκλεκτὴ（hē en Babylōni syneklektē） 是陰性形容詞當名詞用，字面「那在巴比倫的、一同被揀選的（她）」。最自然的理解是「教會」（希臘文是陰性名詞），和合本補上「教會」二字。συνεκλεκτὴ（syneklektē） 新約只此一次，接回 1:1 的「被揀選」：全信從被揀選的寄居者開始，以一同被揀選的教會收尾。</p><blockquote><p><strong>巴比倫的三種讀法：</strong>一、羅馬：早期教會的傳統，啟 17--18 也用巴比倫稱呼那座大城，「大巴比倫，作世上的淫婦和一切可憎之物的母」（啟 17:5）；二、美索不達米亞的巴比倫，當時已是小城；三、埃及尼羅河邊一座名叫巴比倫的軍事要塞。本講義採羅馬：它與彼得晚年在羅馬的傳統相合，也符合全卷「寄居」的用語，帝國的首都正是流亡之地的名字。</p></blockquote><p>Μᾶρκος ὁ υἱός μου（Markos ho huios mou） 不是血緣，是屬靈的父子；保羅也這樣稱呼提摩太。5:14 ἐν φιλήματι ἀγάπης（en philēmati agapēs），保羅書信作「聖潔的親嘴」，彼得作「愛的」，與 1:22、4:8 的「切實相愛」相接。最後一詞 εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν Χριστῷ（eirēnē hymin pasin tois en Christō）：τοῖς ἐν Χριστῷ（tois en Christō） 是全信最後的稱呼，3:16 與 5:10 都有「在基督裡」。</p>","exp":"<p>〔背景〕徒 12:12--12；徒 15:38--38（使徒行傳講義第 12、15 章）</p><p>「在巴比倫與你們同蒙揀選的教會問你們安。」（5:13）巴比倫是被擄的記憶，是離鄉背井的地方。彼得從帝國的中心寫信給散在各省的寄居者：我們也在異鄉。但巴比倫城裡有一群「同蒙揀選」的人。神國的領土不必先有一塊地，它先是一群人。本講義採「羅馬」的讀法，但不把巴比倫對號入座到今天任何一個國家、城市或宗派；這是解經，不是時事評論。</p><p>「我兒子馬可也問你們安。」（5:13）馬可的母親家，正是彼得被天使救出監牢後去敲門的地方，「在那裡有好些人聚集禱告」（徒 12:12）。後來這個年輕人跟著保羅與巴拿巴出去宣教，卻半途回家，以致保羅「就以為不可帶他去」（徒 15:38）。這個曾經離開的人，如今在彼得身邊，被稱為「兒子」；保羅晚年也說「要把馬可帶來，因為他在傳道的事上於我有益處」（提後 4:11）。</p><p>這是 235 的「3」：屬靈的父母兒女。一個跌倒過的年長者，帶起一個半途離開過的年輕人。焦點不在彼得多會帶人，在主沒有放棄他們兩個。被主找回來的人，最懂得怎樣去找回別人；920 的託付就這樣一代傳一代。</p><p>「你們要用愛心彼此親嘴問安。願平安歸與你們凡在基督裡的人！」（5:14）親嘴問安是當時家人之間的問候，寄居的人在家鄉被當成外人，在教會裡卻是家人。全信最後的地址是「在基督裡」：住在本都還是巴比倫，都不是寄居者真正的地址。他們真正的地址是在基督裡，那裡有平安。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《叫我們有活潑的盼望》"],["p","弟兄姊妹平安，今天我們開始讀一卷新的書信，彼得前書，第一章。"],["p","請你和我一起，到一個海邊去。"],["q","加利利海，清晨。天剛剛亮，湖面上還有霧。"],["p","有一條船，打了一整夜的魚，甚麼也沒有打著。"],["p","岸上站著一個人，叫他們把網撒在船的右邊。網拉不上來，魚太多了。"],["p","船上有一個人聽見「是主」，就束上外衣，跳進海裡，往岸邊游。"],["p","他就是彼得。"],["p","他上了岸，全身濕透，海水從衣角一直往下滴。"],["p","然後，他看見了一樣東西。"],["q","「他們上了岸，就看見那裡有炭火，上面有魚，又有餅。」（約 21:9）"],["p","請你留意，那堆火不是門徒生的。他們還在海上的時候，火已經在那裡了。"],["p","有一位，比他們早起，先在岸邊蹲下來，把炭點著，把魚放上去。"],["p","「炭火」這個字，原文 ἀνθρακιά，整本新約只出現兩次。"],["p","另一次，是在幾個禮拜以前，大祭司的院子裡。"],["q","「彼得也同他們站著烤火。」（約 18:18）"],["p","就在那一堆炭火旁邊，有人問他：你不也是他的門徒嗎？"],["p","他說：我不是。一次，兩次，三次。"],["p","所以，當彼得濕著身子走到這堆炭火前面，那個味道，他認得。"],["p","炭火的味道，是他一生最羞恥的那個晚上的味道。"],["p","可是這一次，炭火旁邊站的不是差役，是主。"],["q","「你們來吃早飯。」（約 21:12）"],["q","「耶穌就來拿餅和魚給他們。」（約 21:13）"],["p","沒有先算帳，沒有先訓話。先是一頓熱的早飯，從那雙有釘痕的手遞過來。"],["p","弟兄姊妹，三十多年以後，這個人提筆寫信。"],["p","他寫的第一個大主題，就是今天的章題：活潑的盼望。"],["p","對彼得來說，活潑的盼望不是一個概念。"],["q","是那天早上的一頓早飯。"],["p","可是我要先說清楚：今天我們不是來佩服彼得的。"],["p","不是彼得變好了。是主沒有放棄他。"],["p","這一章，彼得要我們看的，也不是他自己，是那位在岸邊生火的主。"],["p","我們先看他寫信給誰。"],["q","「耶穌基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）"],["p","這五個地方，在今天土耳其的北部。收信的人多半是外邦人。"],["p","他們信主以後，沒有搬家。可是在自己的家鄉，卻變成了外人。"],["p","不再跟著拜，不再跟著喝，不再跟著放縱。鄰舍覺得奇怪，家裡有壓力，工作上被冷眼。"],["p","「寄居的」，原文的意思是暫住的外地人。住在這裡，卻不屬於這裡。"],["p","今天坐在這裡的你，也許在家族的祭祀裡不拿香，在應酬桌上不舉杯。"],["p","彼得寫給他們的第一個字，不是「可憐的人」。是「被揀選的」。"],["p","在地上，你是外人。在神那裡，你是被揀選的。"],["p","這一章有三個詞：望，聖，血。我們今天走三步：活潑的盼望，你們要聖潔，不能壞的種子。"],["q","第一步：活潑的盼望。"],["p","彼得問安完了，第一句話是讚美。"],["q","「願頌讚歸與我們主耶穌基督的父神！他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望」（1:3）"],["p","原文從第三節一路寫到第九節，才放下句號。七節經文，是一口氣說完的一句話。"],["p","請你看這句話的主詞。是誰重生了我們？是神。照甚麼？照他的大憐憫。"],["p","彼得最知道這件事。如果是照表現，那天早上他不會有早飯吃。"],["p","「重生」這個字，整本新約只在彼得前書出現，這一章用了兩次。"],["p","意思是：重新被生出來。一個人不能自己把自己生出來。生命，是被給的。"],["p","再看「活潑的盼望」。「活潑」，原文 ζῶσαν，就是「活的」。"],["p","盼望也會死嗎？會。"],["p","彼得的盼望，死過一次。在耶穌被釘十字架的那個禮拜五，死了。"],["p","他曾經盼望耶穌作王，盼望自己坐在旁邊。那個盼望，在各各他山上斷氣了。"],["p","所以他回去打魚。回到認識主以前的那條船上。"],["p","盼望怎麼活回來的？彼得說得很清楚：藉耶穌基督從死裡復活。"],["q","活的盼望，是從一個空墳墓開始的。"],["p","主復活的那個早上，天使還特別交代婦女們一句話。"],["q","「你們可以去告訴他的門徒和彼得」（可 16:7）"],["p","和彼得。天使特別點名，那個三次不認主的人。"],["p","主還沒有在海邊見他，就先把他的名字放進復活的消息裡了。"],["q","「可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。」（1:4）"],["p","這三個詞，原文都用同一個字頭開始，念起來像押韻一樣。"],["p","不能朽壞：不會爛。不能玷污：不會髒。不能衰殘：不會謝。"],["p","寄居的人在地上沒有基業。有的被家族除名，有的失去了生意。"],["p","彼得說：你的基業不在這裡。它存在天上，有人替你保管著。"],["p","下一節更好。不只基業被存著，你這個人也被守著。"],["q","「你們這因信蒙神能力保守的人」（1:5）"],["p","「保守」，原文 φρουρουμένους，是軍隊的字。一座城被駐軍日夜看守。"],["p","基業在天上被存著，你在地上被守著。兩頭，都在神手裡。"],["p","然後，彼得說了一句很誠實的話。"],["q","「因此，你們是大有喜樂；但如今，在百般的試煉中暫時憂愁」（1:6）"],["p","請你聽清楚，彼得沒有說：基督徒不會憂愁。"],["p","他在同一句話裡，放進「大有喜樂」，也放進「憂愁」。兩個都是真的。"],["p","「憂愁」這個字，原文是真的被痛擊中過，不是表面的不開心。"],["p","這個字，約翰福音第二十一章用在彼得身上。主第三次問他「你愛我嗎」，彼得就憂愁。"],["p","主沒有責備他的憂愁。主繼續把羊交給他。"],["q","憂愁是被允許的。"],["p","所以，如果你今天正在流淚，你不必在教會裡戴上一張笑臉。"],["p","失業、喪親、病痛、在家裡被誤會，這些都會痛。"],["p","憂鬱和焦慮，也不是信心不夠的證據。你可以看醫生，可以找心理諮商，也可以在小組裡說出來。"],["p","這些和信靠神並不衝突。"],["p","彼得也沒有說，你憂愁是因為你犯了罪。這裡說的是百般的試煉，不是懲罰。"],["q","喜樂是一個方向，不是一張面具。"],["p","請你再聽兩個字：暫時。"],["p","這封信的最後一章，彼得又用了同一個字：暫受苦難之後，神必要親自成全你們。"],["p","兩個「暫時」，一頭一尾，把苦難框住了。苦難有開始，也有結束。"],["p","永恆的眼光，不是把苦難變小。是把盼望變大。"],["p","「百般的」，原文是多種顏色的。第四章彼得用同一個字說：百般恩賜。"],["p","試煉有多少種顏色，恩典就有多少種顏色。"],["q","「叫你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴」（1:7）"],["p","金子終究會壞，人還是願意把它放進火裡煉。"],["p","這把火，是煉金的爐，不是審判的火。"],["p","我要說清楚：這不是叫你去找苦吃。是叫已經在火裡的人知道，火不會白燒。"],["p","接著，是這一章最溫柔的一節。"],["q","「你們雖然沒有見過他，卻是愛他」（1:8）"],["p","請你想一想，寫這句話的人，是見過他的。"],["p","他看過主的臉，聽過主的聲音，也吃過主遞來的魚。"],["p","現在他寫信給一群從來沒有見過主的人，說：你們卻是愛他。"],["p","這使我們想起，那天早飯以後，主問彼得的那個問題：你愛我嗎？"],["p","主問的不是你做了多少，是你愛不愛他。"],["q","「那沒有看見就信的有福了。」（約 20:29）"],["p","你今天也沒有見過他。可是你在這裡，因為你愛他。"],["p","彼得說，這樣的人，有說不出來、滿有榮光的大喜樂。"],["p","說不出來，不是因為空洞，是因為太滿。"],["p","講到這裡，彼得把我們的眼光拉到很遠很遠的過去。"],["p","他說，古時候的先知，早就在尋求、考察這救恩了。"],["p","在他們心裡的基督的靈，"],["q","「預先證明基督受苦難，後來得榮耀」（1:11）"],["p","這一句，是整封信的公式。受苦難，後來得榮耀。"],["p","弟兄姊妹，你知道嗎？當年耶穌第一次說他要受苦，彼得拉著他說："],["q","「主啊，萬不可如此！這事必不臨到你身上。」（太 16:22）"],["p","當年說「萬不可如此」的人，現在把「受苦難」寫在整封信的最前面。"],["p","是誰改變了他的眼光？是那位真的受了苦、又真的復活的主。"],["p","彼得還說，連天使也願意詳細察看這些事。"],["p","「詳細察看」這個字，就是約翰福音裡，門徒到空墳墓「低頭往裡看」的那個字。"],["p","天使也彎下腰來看。看甚麼？看神怎樣救一群寄居的人。"],["p","盼望講完了，彼得說：所以。"],["q","第二步：你們要聖潔。"],["q","「所以要約束你們的心，謹慎自守，專心盼望耶穌基督顯現的時候所帶來給你們的恩。」（1:13）"],["p","「約束你們的心」，和合本有一個小註腳：原文是束上你們心中的腰。"],["p","古人穿長袍。要跑、要做工，就得把衣襬撩起來，塞進腰帶裡，不然會絆倒。"],["p","這使我們想起逾越節的晚上，以色列人腰間束帶，準備出埃及。"],["p","也讓我們想起加利利海那天早上，彼得束上外衣，跳進海裡，往主那裡去。"],["p","束腰，是準備好動身。往哪裡去？往那位要顯現的主那裡去。"],["p","接著彼得說：不要效法從前放縱私慾的樣子。"],["p","「效法」這個字，是被套進一個模子裡。"],["p","從前的模子，是蒙昧無知的時候，大家都怎麼活，我就怎麼活。"],["q","「那召你們的既是聖潔，你們在一切所行的事上也要聖潔。」（1:15）"],["q","「你們要聖潔，因為我是聖潔的。」（1:16）"],["p","這一句，是利未記裡神一再對以色列人說的話。"],["p","聖潔是甚麼？很多人一聽到聖潔，就想到一張清單：不可以這個，不可以那個。"],["p","可是彼得給的理由不是一張清單，是一個人。"],["p","因為召你們的是聖潔的。聖潔，就是像那召我們的那一位。"],["p","一個孩子像他的父親，不是因為背熟了家規，是因為天天跟父親住在一起。"],["p","在一切所行的事上。不是只在禮拜天，也在你的辦公室，你的廚房，你的手機裡。"],["p","然後彼得說了一句很重的話。"],["q","「就當存敬畏的心度你們在世寄居的日子」（1:17）"],["p","寄居的人會怕。怕鄰舍的眼光，怕老闆，怕家族的壓力。"],["p","彼得說：你們要怕對的那一位。"],["p","他說，這位審判人的是不偏待人的。"],["p","這使我們想起，彼得在哥尼流家裡也說過同一句話：神是不偏待人的。"],["p","可是敬畏的理由，不是威脅。彼得接下來說的，是一個價錢。"],["q","「知道你們得贖，脫去你們祖宗所傳流虛妄的行為，不是憑著能壞的金銀等物，乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血。」（1:18--19）"],["p","「得贖」，是買回一個奴隸的字。那個時代，贖價是銀子。"],["p","彼得說，買你回來的，不是銀子，是血。不是能壞的，是寶貴的。"],["q","一個人知道自己有多貴，就不必用別人的眼光來給自己定價。"],["p","這裡有一句，華人讀起來特別敏感：祖宗所傳流虛妄的行為。"],["p","我要很小心地說。彼得不是在羞辱收信人的父母，也不是叫我們看不起長輩。"],["p","他自己也是從祖宗的傳統裡，被主叫出來的。"],["p","請你把兩件事分開。拜與不拜，是一件事。孝與不孝，是另一件事。"],["p","被贖出來的，是那套虛空的活法，不是對父母的愛。"],["p","一個不拿香的信徒，可以是家族裡最常回家、最肯照顧長輩的那一個。"],["p","讓家人從你身上看見的，不是一個離開家的人，是一個更愛家的人。"],["p","再看那羔羊。無瑕疵、無玷污。"],["p","這使我們想起逾越節的羊羔，也使我們想起施洗約翰在約旦河邊指著耶穌說的那句話。"],["q","「看哪，神的羔羊，除去世人罪孽的！」（約 1:29）"],["p","彼得的兄弟安得烈，就是聽見這句話，跟了耶穌，又把彼得領到主面前。"],["p","彼得認識耶穌，是從「羔羊」這兩個字開始的。"],["q","「基督在創世以前是預先被神知道的，卻在這末世才為你們顯現。」（1:20）"],["p","十字架不是神的補救辦法，不是計畫出錯以後的備案。"],["p","在創世以前，神就已經定意要用這個價錢，買你回來。"],["p","所以彼得說，叫你們的信心和盼望都在於神。不在於你自己。"],["p","被這麼貴的價錢買回來的人，要怎麼彼此對待？"],["q","第三步：不能壞的種子。"],["q","「你們既因順從真理，潔淨了自己的心，以致愛弟兄沒有虛假，就當從心裡彼此切實相愛。」（1:22）"],["p","彼得從聖潔，直接講到相愛，中間沒有轉彎。"],["p","聖潔的人，不是遠離人的人。是能夠不戴面具去愛人的人。"],["p","「沒有虛假」，原文是沒有面具。舞台上的演員戴的那種面具。"],["p","「切實」，是把手臂伸到最遠。不是愛到順手的地方就停。"],["p","寄居的人，很多已經失去了原來的家人。教會就成了他們的新家。"],["p","可是新家也會有摩擦。有人說話不中聽，有人做事不周到。"],["p","彼得說，要伸到最遠去愛。"],["p","為甚麼能這樣愛？因為你們是同一顆種子生的。"],["q","「你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉著神活潑常存的道。」（1:23）"],["p","第三節的「重生」又出現了。那裡說藉著復活，這裡說藉著神的道。"],["p","同一個父親，同一顆種子，生出來的就是一家人。"],["p","你在線上看見的那個名字，在另一個國家、另一個時區的那位弟兄姊妹，是你的家人。"],["p","然後彼得引了以賽亞的話。"],["p","凡有血氣的，盡都如草；他的美榮，都像草上的花。"],["q","「草必枯乾，花必凋謝；惟有主的道是永存的。」（1:24--25）"],["p","「美榮」這個詞，原文就是「榮耀」。人的榮耀，像草上的花。"],["p","家族的名聲，職場的頭銜，地上的金銀。開得很漂亮，可是會謝。"],["p","神的道不會。"],["p","第一章一開始，基業不能朽壞。到這裡，種子也不能壞，道也永存。"],["p","能壞的與不能壞的。寄居的人，是被不能壞的東西抓住的人。"],["p","彼得最後加了一句：所傳給你們的福音，就是這道。"],["p","以賽亞說的那永存的道，就是你們聽見的福音。就是那位死了又復活的主。"],["p","所以讀經，不是在讀一本舊書。是讓那顆不能壞的種子，在你裡面繼續長。"],["p","弟兄姊妹，我們回到加利利海邊。"],["q","炭火還在燒。魚烤好了，餅也熱著。"],["p","一個濕著身子的人坐在火邊。他沒有說話，因為他不知道該說甚麼。"],["p","主也沒有先問他：你為甚麼不認我？"],["p","主先讓他吃飽。"],["p","然後才問他：你愛我嗎？三次。正好跟他不認主的次數一樣。"],["p","主不是在算舊帳。主是在三次不認的地方，一次一次，把他重新接回來。"],["p","主在被賣的那一夜就說過："],["q","「你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","三十多年以後，那個回了頭的人，寫了這封信，去堅固一群散在五個地區的弟兄姊妹。"],["p","所以這一章，不是一個好人寫的勵志文章。"],["p","是一個被救的人，指著救他的那一位說：你們看他。"],["p","看他照自己的大憐憫，重生了我們。"],["p","看他用自己的寶血，把我們從虛空的活法裡買回來。"],["p","看他用不能壞的道，把散在各地的我們，生成一家人。"],["p","也許今天，你也是濕著身子來的。"],["p","你也許曾經在某一堆火旁邊，說過「我不是」。在辦公室，在家族聚會，在你自己心裡。"],["p","也許你正在百般的試煉中，暫時憂愁。"],["p","請你知道，岸邊的火，主已經生好了。在你還在海上的時候，他就先到了。"],["p","活潑的盼望，不是你要自己生出來的。是他遞給你的。"],["q","「你們來吃早飯。」（約 21:12）"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《你們來到主面前，也就像活石》"],["p","弟兄姊妹平安，今天我們一起讀彼得前書第二章。"],["p","這一章的中間，有兩個希臘字放在一起。"],["p","一個字是石頭，一個字是活的。"],["q","活石。"],["p","請你想一想，這兩個字放在一起，其實是不通的。"],["p","石頭是世界上最不活的東西。它不呼吸，不長大，不會痛。"],["p","可是彼得說，有一塊石頭是活的。"],["p","它為甚麼是活的？因為它死過，又活過來了。"],["q","「藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望」（1:3）"],["p","那塊石頭，就是從空墳墓裡走出來的那一位。"],["p","然後彼得又說了一句更不通的話：你們也是活石。"],["p","一塊會呼吸的石頭，已經很奇怪了。"],["p","一整座用會呼吸的石頭蓋起來的殿，那是甚麼？"],["q","一座用活人蓋的殿。"],["p","彼得說：不，你是一塊石頭，正在被砌進一座殿裡。"],["p","你那顆曾經很硬的心，現在是活的。"],["p","這一章有三個詞：石，客，蹤。"],["p","我們走三步：活石與靈宮，為主的緣故，跟隨他的腳蹤。"],["q","第一步：活石與靈宮。"],["p","彼得不是一開口就講石頭。他先講奶。"],["q","「就要愛慕那純淨的靈奶，像才生的嬰孩愛慕奶一樣」（2:2）"],["p","「純淨」這個字，原文的意思是沒有摻假的。"],["p","脫下摻假的心，喝不摻假的道。"],["p","嘗過主恩的人，彼得就順著「主」這個字往下走。"],["p","你嘗過的那一位主，是甚麼樣的一位？"],["q","「主乃活石，固然是被人所棄的，卻是被神所揀選、所寶貴的。」（2:4）"],["p","先不要急著跳到「揀選」，也不要急著跳到「寶貴」。"],["p","請先讓這塊石頭，在「被人所棄」那裡站一下。"],["q","工地上，正午。石匠拿起一塊石料，敲一敲，搖搖頭，丟到一邊。"],["p","「所棄」這個字，就是驗過以後判定不合格。"],["p","宗教領袖棄絕了他；巡撫查不出他有罪，卻仍把他交了出去。"],["p","這是本章最低的地方。被棄。"],["p","他們信主之後，沒有搬家。可是在家鄉，他們變成了外人。"],["p","鄰舍驗過他們，家族也驗過他們：你不拿香，你不是我們的人。"],["p","弟兄姊妹，你也被人敲過、搖過頭、丟到一邊過嗎？"],["p","可是神的判決，和人的判決不一樣。"],["p","人說不合格的那一塊，神說：揀選的，寶貴的。"],["p","神揀選的，偏偏是那塊被丟掉的石頭。"],["p","還有一件事，你不能不注意。寫這封信的人，名字就叫石頭。"],["q","「你要稱為磯法。」（約 1:42）"],["p","磯法就是石頭。後來主又對他說：我要把我的教會建造在這磐石上。"],["p","如果世上有一個人有資格說「我是那塊石頭」，就是彼得。"],["p","可是他寫到石頭的時候，一個字都沒有提自己。"],["q","彼得沒有說「我是磐石」。他說「主乃活石」。"],["p","不論太 16:18 的磐石各家怎樣解，彼得寫到石頭時，指向的是主：主一直是那塊活石，而且沒有放棄他。"],["q","「你們來到主面前，也就像活石，被建造成為靈宮，作聖潔的祭司」（2:5）"],["p","「來到」原文是現在式。不是來一次就完了，是一直來。"],["p","然後請你聽那個動詞：被建造。"],["p","是被動的。石頭不會自己砌牆。"],["p","弟兄姊妹，這給每一個覺得自己沒有用的人一個安慰。"],["p","你不必想辦法把自己砌進牆裡。你只要不斷地來到他面前。"],["p","砌的那一雙手，是神的手。"],["p","而且彼得把兩個畫面疊在一起：你們是殿，你們也是殿裡的祭司。"],["p","彼得告訴他們：你們不需要去殿裡。你們就是殿。"],["q","「看哪，我把所揀選、所寶貴的房角石安放在錫安；信靠他的人必不至於羞愧。」（2:6）"],["p","這是以賽亞書的話。如果你回去翻以賽亞書，會看到那裡說「必不著急」。"],["p","彼得照的是希臘文的舊約，所以說「必不至於羞愧」。"],["p","兩個版本，放在一起讀，剛好說盡了一件事。"],["p","信靠他的人，不必慌，也不會丟臉。"],["q","「又說：作了絆腳的石頭，跌人的磐石。」（2:8）"],["p","同一塊石頭，有人砌在上面，有人絆在上面。"],["p","「跌人的」這個字，主耶穌曾經用在彼得自己身上。"],["q","「撒但，退我後邊去吧！你是絆我腳的」（太 16:23）"],["p","絆過主的人，現在說：不要在主身上絆倒。"],["p","這一節後半說，他們這樣絆跌也是預定的。"],["p","本講義讀成：神定下的，是「不順從的人必絆跌」這個結果。"],["p","講台上我們只說一句：門沒有關。石頭還在那裡，你可以來。"],["q","「惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民」（2:9）"],["p","請你聽那個「惟有」。鏡頭從絆倒的人，轉回到你們身上。"],["p","族類，祭司，國度，子民。"],["p","這四個名字，本來都是給以色列的。"],["p","出埃及記講義第十九章講過，西乃山下，十誡還沒頒布，神先告訴他們是誰。"],["q","「你們要歸我作祭司的國度，為聖潔的國民。」（出 19:6）"],["p","身分在律法之前。"],["p","彼得多出來的一筆是：這些名字，現在給了一群拜過偶像的外邦人。"],["p","他們在地上沒有戶籍。在神面前，有四個名字。"],["p","這四個名字不是勳章，是任務。"],["q","「要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。」（2:9）"],["p","有君尊的祭司，就是把人帶到神面前的人。"],["p","信徒皆祭司，不是不要牧師。是每一個信徒都有這份工作。"],["p","從前，現在。被棄的石頭，和被丟過的人，現在在同一座殿裡。"],["p","弟兄姊妹，我們讀到這裡，才可以說一件國度321空中團契常說的事。"],["p","我們說要建立屬神的體系。"],["p","可是讀完這幾節，你會發現，屬神的體系不是先有一棟建築。"],["p","是先有一塊被人丟掉、被神高舉的石頭。"],["p","然後是一群來到他面前的人，被神一塊一塊砌上去。"],["q","神國的領土不必先有一塊地。它先是一群人。"],["p","可是一座用活人蓋的殿，還要每天走出門，去上班，去買菜，去面對鄰舍。"],["p","一個在神面前有四個名字的人，在地上要怎樣活？"],["p","彼得接下來，換了一個稱呼。"],["q","第二步：為主的緣故。"],["q","「親愛的弟兄啊，你們是客旅，是寄居的。」（2:11）"],["p","「寄居的」這個字，指的是有居留，沒有公民權的人。"],["p","你在這裡有住所，有工作，可是沒有戶籍。"],["p","可是寄居不是逃走。寄居的人，是要在那裡好好住的。"],["q","「你們在外邦人中，應當品行端正，叫那些毀謗你們是作惡的，因看見你們的好行為，便在鑒察的日子歸榮耀給神。」（2:12）"],["p","他們被說成是作惡的。因為不拜偶像，被說是不敬神。"],["p","彼得沒有叫他們去辯，也沒有叫他們躲起來。"],["p","他叫他們把日子過好，好到別人看得見。"],["p","「鑒察」，和合本的小字說，也可以譯作「眷顧」。"],["p","也許有一天，那個今天說你壞話的人，會被神眷顧。"],["q","「你們為主的緣故，要順服人的一切制度」（2:13）"],["p","請你想一想，彼得寫這句話的時候，在羅馬作皇帝的是誰。"],["p","彼得不是不知道權力會作惡。他被希律關過，被公會打過。"],["p","他仍然寫下這句話。可是請你聽那四個字：為主的緣故。"],["q","順服的理由是主。順服的界線，也是主。"],["p","同一個彼得，曾經站在公會面前，說過另一句話。"],["q","「順從神，不順從人，是應當的。」（徒 5:29）"],["p","這兩句話不打架。"],["p","平常的日子，信徒納稅，守法，尊重在位的人。"],["p","當人的命令要他否認主，他溫柔地拒絕，也承擔後果。"],["p","順服不等於同意，也不等於沉默。"],["p","還有一個小字。「制度」前面那個形容詞，是「人的」。"],["p","這些制度是人設立的。它們該被尊重，可是它們不是神。"],["q","「因為神的旨意原是要你們行善，可以堵住那糊塗無知人的口。」（2:15）"],["p","「堵住」這個字，是給牛戴上口套。"],["p","用甚麼堵？不是用辯論，不是用聲量，是用行善。"],["p","自由人，同時是神的僕人。"],["p","正因為我們是神的僕人，所以沒有一個人間的主人，可以擁有我們的全部。"],["q","「務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王。」（2:17）"],["p","請你慢慢聽這四個命令。"],["p","眾人，要尊敬。弟兄，要親愛。神，要敬畏。君王，要尊敬。"],["p","你有沒有聽出來？君王和眾人，用的是同一個字。"],["p","只有神，得到「敬畏」。"],["q","敬畏只有一位。對君王，是尊敬。"],["p","我們散在好幾個國家，在不同的制度底下生活。"],["p","這一章給每一個人同一個姿態：好好作公民，可是心裡的王座只有一位。"],["p","可是講到這裡，彼得的聲音忽然壓低了。"],["p","他轉過頭，對聚會裡站在最後面的那一群人說話。"],["q","第三步：跟隨他的腳蹤。"],["q","「你們作僕人的，凡事要存敬畏的心順服主人；不但順服那善良溫和的，就是那乖僻的也要順服。」（2:18）"],["p","這是全章最容易被人拿去誤用的一段。所以我們先說清楚，它沒有說甚麼。"],["p","第一，新約沒有為奴隸制背書。"],["p","保羅說，若能以自由，就求自由更好。"],["p","福音的方向是解放。彼得是對當時沒有選擇的人說話。"],["p","教他們在不能改變的處境裡怎樣活，不是說那個處境是對的。"],["q","「倘若人為叫良心對得住神，就忍受冤屈的苦楚，這是可喜愛的。」（2:19）"],["p","第二件事：冤屈就是冤屈。"],["p","「冤屈」這個字，原文是「不公義地」。"],["p","彼得沒有說那個乖僻的主人是對的。他把這件事定了性：這是不公義。"],["p","所以弟兄姊妹，今天被霸凌、被欠薪、被騷擾的人，遇到的就是不公義。"],["p","教會絕不可以替一個違法的老闆，找一個屬靈的理由。"],["p","而且今天的人，多半有當時家僕沒有的東西。"],["p","有法律，有勞動申訴，有離職的自由。"],["q","使用它們，不違背這一節。"],["p","第三件事：彼得分辨了兩種苦。"],["q","「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（2:20）"],["p","因為自己做錯事受的苦，不是彼得要安慰的苦。"],["p","可是也請你聽清楚：這不是說每一個受苦的人都做錯了甚麼。"],["p","把受冤屈的人先當成犯錯的人，是對他再冤屈一次。"],["p","那麼「可喜愛的」是甚麼意思？原文就是「恩典」。"],["p","不是說受苦本身討神喜悅。是說一個人在冤屈裡，仍然不以惡報惡，"],["p","這件事在神那裡被看見，被記念。"],["p","被冤枉的人最痛的，常常是沒有人看見。"],["p","彼得說：神看見了。他把它叫作恩典。"],["p","然後，就來到全卷的樞紐。"],["q","「你們蒙召原是為此；因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行。」（2:21）"],["p","請你聽那個「也」。受苦，從家僕身上，轉到了基督身上。"],["p","彼得對受冤屈的人，沒有給一套忍耐的技巧。他指向一個人。"],["p","「榜樣」這個字，整本新約只出現這一次。"],["q","一間小學教室。老師在紙上寫好一個字，孩子把薄紙蓋上去，一筆一筆地描。"],["p","這就是那個字：字帖。"],["p","然後彼得換了第二個畫面：腳蹤，就是腳印。"],["q","雪地裡，前面的人踩出一個一個坑。後面的人，把腳放進那些坑裡。"],["p","字帖要一筆一筆描。腳印要一步一步踩。"],["p","這張字帖上寫著甚麼？"],["q","「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（2:23）"],["p","三個動作：不還口，不威嚇，交託。"],["p","每一次被罵，每一次受苦，每一次都交託。"],["p","可是不還口，不是不說真話。"],["p","主在大祭司面前被打的時候，對打他的人說過一句話。"],["q","「我若說的不是，你可以指證那不是；我若說的是，你為甚麼打我呢？」（約 18:23）"],["p","他指出了不公義。可是他沒有以惡報惡。"],["p","交託，也不是假裝沒事。交託，是把判決交給一位公義的審判者。"],["p","弟兄姊妹，你知道寫這幾句話的人，曾經是甚麼樣子嗎？"],["q","「西門‧彼得帶著一把刀，就拔出來，將大祭司的僕人砍了一刀」（約 18:10）"],["p","他砍的，正是一個僕人。"],["p","那一夜，他還遠遠地跟著。遠到聽不見，遠到可以否認。"],["p","多年以後，同一個人寫信給一群僕人，說：要緊緊跟著他的腳印。"],["p","不是彼得自己學會了。"],["p","是在加利利的海邊，那一位又對他說了一次："],["q","「你跟從我吧！」（約 21:19）"],["p","所以，跟隨他的腳蹤，不是叫人去找苦吃。"],["p","也不是叫人留在危險裡。腳印的方向，是不以惡報惡，把審判交給神。"],["p","這和離開危險、尋求法律保護，一點都不衝突。"],["p","可是弟兄姊妹，如果這篇講道停在這裡，那就太重了。"],["p","一張字帖擺在面前，可是我的手在發抖，我描不出來。"],["p","一串腳印在前面，可是我的腿受了傷，我走不動。"],["p","所以彼得下一節，馬上說了另一件事。"],["q","「他被掛在木頭上，親身擔當了我們的罪，使我們既然在罪上死，就得以在義上活。」（2:24）"],["p","上一節說他是榜樣。這一節說他是救主。"],["q","我們效法的那一位，先是替我們擔當罪的那一位。"],["p","如果只有榜樣，沒有救主，基督教就只是一套做不到的道德。"],["p","因為他先擔當了，我們才有跟上去的起點。"],["p","然後是這一節最後一句。"],["q","「因他受的鞭傷，你們便得了醫治。」（2:24）"],["p","「鞭傷」這個字，新約也只出現這一次。"],["p","它是鞭子打過以後，皮膚上腫起來的那一道痕。"],["p","請你記得，彼得這時候是在對家僕說話。"],["p","那是他們最熟悉的傷，也是最羞恥的傷。"],["p","彼得對他們說：基督身上，也有這樣的傷。"],["p","而且那一道傷，是為你們受的。"],["q","受冤屈的人覺得沒有人懂。那位審判全地的主懂，因為他背上有同樣的痕跡。"],["p","這裡說的醫治，上下文很清楚：在罪上死，在義上活。"],["p","這一節不是保證身體一定痊癒，也不是說沒得醫治的人信得不夠。"],["p","神當然可以醫治身體。生病的人該求醫，也可以求神。"],["p","可是這一節要我們抓住更深的醫治："],["p","罪不再定我們的命運，羞恥也不再是我們最後的名字。"],["q","「你們從前好像迷路的羊，如今卻歸到你們靈魂的牧人監督了。」（2:25）"],["p","「歸到」這個字，原文是轉回來。"],["p","主被賣的那一夜以前，曾經對彼得說過同一個字。"],["q","「你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","回過頭的人，現在對一群迷路的羊說：你們也轉回來了。"],["p","回到一位牧人身邊。他會看顧你的靈魂。"],["p","石頭，寄居，腳蹤。這一章最後落在一個很簡單的地方。"],["q","被棄的那一位，沒有棄絕我們。"],["p","他被丟到一邊，好叫被丟到一邊的人，有地方被砌進去。"],["p","他背上有傷，好叫背上有傷的人，有一張可以描的字帖。"],["p","讀完這一章，請你不要更佩服彼得。"],["p","請你更愛那一位，沒有放棄彼得、也沒有放棄你的主耶穌。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件：每天早上，來到他面前。不是來一次，是一直來。"],["p","讀一段經文，像嬰孩愛慕奶那樣。讓那雙手，把你砌進去。"],["p","第二件：如果這個禮拜，你在家裡或在公司被冤枉了，"],["p","先不要還口，也先不要吞下去。把那件事寫下來，帶到主面前，交託給他。"],["p","如果那是不公義的事，你可以說出來，可以申訴，可以找人幫忙。"],["p","然後抬頭看一看前面。那裡有一串腳印，是一位背上有傷的人留下的。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《不以惡報惡，以辱罵還辱罵，倒要祝福》"],["p","弟兄姊妹平安，今天我們一起讀彼得前書第三章。"],["q","晚上十一點。你剛把孩子哄睡，坐在沙發上。"],["p","手機亮了一下。是公司的工作群組。"],["p","群組裡有三十幾個人。你的主管，在裡面點了你的名。"],["q","「這種報告也交得出來？我看你是根本沒把公司放在心上。」"],["p","三十幾個人都看見了。有人已讀，沒有人說話。"],["p","可是你知道，那份報告的數字，是主管自己上禮拜叫你改的。"],["p","你的臉一下子熱起來。心跳得很快。"],["p","你開始打字。打了很久。"],["p","你把每一個日期、每一封郵件都列出來。最後一句，你寫得特別漂亮。"],["p","那一句，足夠讓他在三十幾個人面前，下不了台。"],["q","你的手指，停在送出鍵上。"],["p","我猜，你想的不是經文。你想的是：憑甚麼又是我吞下去？"],["q","「不以惡報惡，以辱罵還辱罵，倒要祝福」（3:9）"],["p","因為彼得說的，不是「吞下去」。他說的是第三條路。"],["p","這一章有三個詞：妝，福，勝。"],["p","我們走三步：裡面的妝飾，倒要祝福，引我們到神面前。"],["p","這個福，是祝福的福。是一個動作，是你要做的事。"],["q","第一步：裡面的妝飾。"],["q","「你們為主的緣故，要順服人的一切制度」（2:13）"],["p","「為主的緣故」，是理由，也是界線。"],["q","「你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來」（3:1）"],["p","請你看這一節：妻子信了主，丈夫沒有信。"],["p","在第一世紀，妻子拜甚麼神，是跟著丈夫的。這是當時的家規。"],["p","節慶到了，她不再上香。家裡拜拜，她站在旁邊。"],["p","彼得有沒有叫她回頭？沒有。他承認她的良心是她自己的。"],["p","今天在不信的家族裡，年節不拿香的姊妹，你聽得懂這一節。"],["p","彼得給她的方法是：不用言語。"],["p","「感化過來」，原文 κερδηθήσονται，是生意場上的字，意思是被贏得、被賺回來。"],["p","丈夫不是被說贏的，是被看見的。"],["q","「這正是因看見你們有貞潔的品行和敬畏的心。」（3:2）"],["p","經文說的是「也可以」。不是保證每一個不信的丈夫都會信。"],["p","接著，彼得講到打扮。"],["q","「你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾，只要以裡面存著長久溫柔、安靜的心為妝飾；這在神面前是極寶貴的。」（3:3–4）"],["p","常有人問：姊妹可不可以化妝？可不可以戴耳環？"],["p","請你聽第三樣：穿美衣。原文只是「穿上衣裳」。"],["p","如果這是一條禁令，那麼連衣服都不能穿了。"],["p","對比是外面與裡面，不是禁止外面。"],["p","「長久」，原文 ἀφθάρτῳ，就是不能朽壞的。"],["p","可是心裡隱藏的那個人，在神面前是極寶貴的。那一樣，沒有人拿得走。"],["p","溫柔不是軟弱，是有力量卻不拿來壓人。安靜是心裡不慌，不是不准說話。"],["p","沒有人看見的姊妹，請你聽這四個字：在神面前。他看見。"],["p","然後，彼得舉了一個人。"],["q","「就如撒拉聽從亞伯拉罕，稱他為主。你們若行善，不因恐嚇而害怕，便是撒拉的女兒了。」（3:6）"],["p","撒拉稱亞伯拉罕為主，舊約裡只有一次："],["q","「撒拉心裡暗笑，說：『我既已衰敗，我主也老邁，豈能有這喜事呢？』」（創 18:12）"],["p","她是在帳棚裡，心裡自言自語時說的。"],["p","彼得挑的不是卑躬屈膝，是一個在不可能裡還盼望神的女人。"],["q","不因恐嚇而害怕。"],["p","「恐嚇」，原文 πτόησιν，是叫人心驚膽跳的那種威脅。"],["p","撒拉的女兒，是用兩件事認的：行善，不因恐嚇而害怕。"],["p","所以被恐嚇出來的服從，不是第一節說的順服。"],["p","如果有一位姊妹，在家裡活在打罵、威脅、控制裡，這段經文絕不是叫她留下，忍著用品行去感化他。"],["p","人身安全受到威脅的時候，先保護自己和孩子的生命。"],["p","向可信任的人求助，向教會、社工、警方求助，依法申請保護。"],["p","這樣做不違背三章一到六節。這正是第六節：不因恐嚇而害怕。"],["p","教會也不可以拿這一段，勸一個受暴力的人回到危險裡。那是誤用。"],["p","接著第七節，彼得轉過頭來，對丈夫說話。"],["q","「你們作丈夫的也要按情理和妻子同住；因她比你軟弱，與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙。」（3:7）"],["p","請你聽「也要」。原文是「同樣」，跟對妻子說的是同一個字。"],["p","當時丈夫握有幾乎一切權力。彼得卻同樣給他一道命令。丈夫不是家規的例外。"],["p","講三章一到六節，而不講第七節，就把這段家規講成了單行道。"],["p","第一個命令：按情理同住。「情理」原文是知識。"],["p","弟兄，你不能只知道妻子應該怎樣。你要認識她。"],["p","她怕甚麼，累在哪裡，受了甚麼委屈。"],["p","第二個命令：敬重她。理由有兩個，彼得並排寫出來。"],["p","一個是「她比你軟弱」。原文是較軟弱的器皿。"],["p","請你聽「較」這個字。丈夫也是器皿，男人女人都是瓦器。"],["p","這不是貶低女人的價值、智力或靈性。當時的妻子在體力、法律、經濟上都處弱勢，最容易被傷害。"],["p","強的一方要做的，不是利用這個落差，是把尊榮分給她。"],["p","另一個理由在同一節：她是與你一同承受生命之恩的。"],["p","在神面前，她與你同承一份恩典，同一個永生。"],["q","便叫你們的禱告沒有阻礙。"],["p","「阻礙」，原文 ἐγκόπτεσθαι，是在路上挖一條溝，把人擋住。"],["p","神把你怎樣對待妻子，和你怎樣來到他面前，綁在一起。"],["p","一個在教會裡很屬靈、回到家卻冷淡粗暴的人，他的禱告路上，有一道溝。"],["p","這段家規有不同的讀法，議題頁有交代，講台上不裁判。"],["p","可是不論哪一種讀法，都繞不過第七節。"],["p","被冤枉，不只發生在家裡。也發生在群組裡，在辦公室，在飯桌上。"],["q","第二步：倒要祝福。"],["q","「總而言之，你們都要同心，彼此體恤，相愛如弟兄，存慈憐謙卑的心。」（3:8）"],["p","五個詞，像一隻手的五根手指。中間那一根，是相愛如弟兄。"],["p","我們這個散在各國的團契，就要作彼此體恤的地方。"],["q","「不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。」（3:9）"],["p","被罵的時候，人通常只看見兩條路。"],["p","第一條，罵回去。就是送出鍵上那一段長訊息。"],["p","第二條，吞下去。關掉手機，一個人氣到天亮。"],["p","彼得指出第三條路。「倒要」，原文 τοὐναντίον，意思是正好相反。"],["q","不是不回應。是換一個方向完全相反的回應。"],["q","客西馬尼園，深夜。火把，刀，棍。"],["q","「將大祭司的僕人砍了一刀，削掉他的右耳」（約 18:10）"],["p","那一夜，彼得的手，沒有停在送出鍵上。他直接砍下去了。"],["p","主對他說了甚麼？"],["q","「收刀入鞘吧」（約 18:11）"],["p","三十年後，這個拔過刀的人寫信說：不要以惡報惡，倒要祝福。"],["p","不是彼得修養變好了，是主沒有放棄他。主帶他走過十字架和空墳墓，讓他看見另一種回應。"],["q","「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（2:23）"],["p","上一章說，你們蒙召是要跟隨他的腳蹤。這一章，同一個字：蒙召是要祝福。"],["p","原來祝福人，就是跟著那串腳印走。"],["p","可是我知道，有人心裡會問：那不就是縱容惡人嗎？"],["p","祝福不是縱容。不以惡報惡，不等於不追究責任。"],["p","報復，是我自己把審判的權柄搶回來。"],["p","申訴、求助、報警，是把事情交給神所設立的秩序。這兩件事不一樣。"],["p","被羞辱的人，也可以第二天把日期和郵件整理好，依程序申訴。"],["p","一位受家暴的姊妹，可以不咒詛對方，同時離開危險，尋求保護。"],["q","祝福拒絕的是仇恨，不是公義。"],["p","那麼祝福是甚麼？最少是這一件事：在神面前，我不求他滅亡。我求神改變他。"],["p","再聽第九節最後一句：好叫你們承受福氣。"],["p","別人可以搶走你的名聲，搶不走你祝福人的自由。"],["p","彼得接著引了詩篇第三十四篇。大衛寫這篇詩的時候，正在逃命。"],["q","「人若愛生命，願享美福，須要禁止舌頭不出惡言，嘴唇不說詭詐的話」（3:10）"],["p","第一件事，是舌頭。被罵的時候，最先想反擊的，就是舌頭。今天，還有手指。"],["q","「也要離惡行善，尋求和睦，一心追趕。」（3:11）"],["p","世界在逼迫你，你在追趕和睦。和睦常常跑在前面，要人去追。"],["q","「主的眼看顧義人；主的耳聽他們的祈禱。惟有行惡的人，主向他們變臉。」（3:12）"],["p","被冤枉的人，最怕的是沒有人看見。詩篇說：主看見。主聽見。"],["p","審判不在我手裡。所以我的手，可以空出來祝福。"],["q","「你們若是熱心行善，有誰害你們呢？你們就是為義受苦，也是有福的。」（3:13–14）"],["p","彼得不是說，行善的人就不會受苦。他是說，就算受苦，也沒有人能奪去你的福。"],["p","他安慰的是為義受苦的人，不是作惡受苦的。他也沒有叫人去找苦。"],["p","一個因為拒絕做假帳被調職的人，他的苦有一個名字：為義。"],["p","他可以傷心，可以向人訴說，可以尋求幫助。有福，不是要他假裝不痛。"],["q","「不要怕人的威嚇，也不要驚慌」（3:14）"],["p","這是本章的低谷。寄居的人心裡最真實的光景，就是怕。"],["p","怕被親族排擠，怕丟掉工作，怕明天一進辦公室，所有人都看著你。"],["p","彼得沒有罵他們怕。他給了他們一個王座。"],["q","「只要心裡尊主基督為聖。」（3:15）"],["p","以賽亞說，要尊萬軍之耶和華為聖。彼得只換了一個名字：主基督。"],["p","人心裡有一個位置。坐在那裡的，就是我們最怕失去、最想討好的那一位。"],["p","如果坐在那裡的是主管的臉色，他一句話就能讓你整夜睡不著。"],["p","懼怕不是靠意志壓下去的。是被一個更大的敬畏取代的。"],["q","心裡的王座只有一個。他坐穩了，別人的威嚇就坐不上去。"],["p","然後彼得說：有人問你們心中盼望的緣由，就要常作準備。"],["p","寫這句話的人，也有一個晚上，被人問過。"],["q","大祭司的院子，深夜。一堆炭火。"],["q","「你素來也是同拿撒勒人耶穌一夥的。」（可 14:67）"],["q","「我不知道，也不明白你說的是甚麼。」（可 14:68）"],["p","那一夜，他沒有準備好。"],["p","後來，復活的主在海邊，在另一堆炭火旁邊，把他重新找回來。"],["p","這位曾經答不出來的人，現在叫我們常作準備。不是他變得能言善辯，是主沒有放棄他。"],["p","請你留意，人家問的是甚麼。不是你的教義，是你心中的盼望。"],["p","你不必贏辯論。只要把盼望的來源說出來：一位從死裡復活的主。"],["p","以溫柔、敬畏的心：溫柔對人，敬畏對神。把人駁倒卻讓他更遠離基督，不是這一節。"],["q","「存著無虧的良心」（3:16）"],["p","名聲，可以被人拿走。無虧的良心，只有你自己丟得掉。"],["p","那段長訊息若送出去，也許你贏了一個晚上。可是你的良心，要陪你很多年。"],["p","然後彼得用一個「因」字，把我們帶到這一章的山頂。"],["q","第三步：引我們到神面前。"],["q","「因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。按著肉體說，他被治死；按著靈性說，他復活了。」（3:18）"],["p","彼得把受苦的人帶到十字架前面，說了四個字：基督也曾。"],["p","你在群組裡被冤枉的那條路，他先走過。"],["p","我們是為義受苦。他是為罪受苦。"],["p","我們受苦，救不了任何人。他受苦，是義的代替不義的。"],["q","我們效法的那一位，先是替我們擔當罪的那一位。"],["p","「一次」，原文 ἅπαξ，就是一次永遠。不必再補，也不能再加。"],["p","所以為義受苦的人，不是在替自己贖罪。我們是在跟隨一位已經贖完罪的主。"],["p","他受苦的目的寫得很清楚：為要引我們到神面前。"],["p","他不只把我們從罪裡拉出來，他把我們帶進去，帶到神面前。"],["p","被誤會、被羞辱的人，常覺得自己被推到了邊緣。"],["p","這一節說：基督的受苦，把你帶到了中心。"],["p","寄居的人在地上沒有位置。在神面前，有。"],["q","「預先證明基督受苦難，後來得榮耀」（1:11）"],["p","當年說「主啊，萬不可如此」的彼得，只要榮耀，不要十字架。"],["p","現在他把被治死和復活放在同一句裡。十字架之後，有空墳墓。"],["q","「他藉這靈曾去傳道給那些在監獄裡的靈聽」（3:19）"],["p","監獄裡的靈是誰？各家讀法不同，講義裡都陳列了。"],["p","可是講台上，我們只抓住一件事：重點是他得勝了。"],["p","這一節不是教人死後還有第二次機會。也不是要我們斷定任何一位已經過世的親人去了哪裡。"],["p","我們知道神是公義的，也是滿有憐憫的。我們把所愛的人，交在他手裡。"],["p","彼得接著提到挪亞。神容忍等待，最後得救的只有八個人。"],["p","收信的教會也是少數。少數不等於失敗。"],["q","「這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們；這洗禮本不在乎除掉肉體的污穢，只求在神面前有無虧的良心。」（3:21）"],["p","救人的是復活的基督，不是水。彼得自己說，洗禮不在乎除掉肉體的污穢。"],["p","所以我們不說，受洗就自動得救。也不說，沒有受洗就不能得救。"],["p","十字架上那一位強盜，沒有機會受洗，主對他說："],["q","「今日你要同我在樂園裡了。」（路 23:43）"],["p","可是洗禮也不是可有可無。它是信的人在神面前的回答，是主吩咐的，我們就順服。"],["q","「耶穌已經進入天堂，在神的右邊；眾天使和有權柄的，並有能力的，都服從了他。」（3:22）"],["p","這一章從「順服」開始：妻子順服，眾人為主的緣故順服。"],["p","到了最後一節，換成了另一個畫面：天使和一切的權勢，都已經服從了他。"],["q","寄居的人能不以惡報惡，是因為真正的王，已經坐在寶座上。"],["p","你不必在群組裡為自己爭回寶座。寶座上，已經有人了。"],["p","弟兄姊妹，我們回到那個晚上十一點。"],["q","沙發上，一支手機。手指，還停在送出鍵上。"],["p","我不會叫你假裝沒事。你被冤枉了，那就是冤枉。你可以難過。"],["p","第二天，你也可以照程序，把事情說清楚。那不是報復。"],["p","可是今天晚上，請你先做一件事。"],["p","長按那段訊息。不是按送出，是按刪除。"],["p","在送出任何一句話以前，先讓那一位，把你帶到神面前。"],["p","因為他就是為這個受苦的。義的代替不義的，為要引我們到神面前。"],["p","到了神面前，你會發現，那位主管的名字，你可以說出來了。"],["p","不是咒詛的時候說。是禱告的時候說。"],["p","主啊，他今天傷了我。我把他交給你，你是按公義審判人的。"],["p","求你看顧我，也求你改變他。"],["p","這就是祝福。這就是第三條路。"],["p","弟兄姊妹，你不必佩服那個拔過刀、後來寫出這封信的彼得。"],["p","請你看見那一位被罵不還口、受了苦、復活、坐在神右邊的主。"],["p","他沒有放棄拔刀的彼得。他也不會放棄今天手指停在送出鍵上的你。"],["q","「不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。」（3:9）"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《有火煉的試驗臨到你們，不要以為奇怪》"],["p","弟兄姊妹平安，今天我們一起讀彼得前書第四章。"],["p","我想問你一個問題。請你不要急著回答。"],["q","如果信主要付代價——升遷、婚事、家人的諒解——你還信嗎？"],["p","這個問題，不是在主日早上被問的。"],["p","它是在星期三晚上，在公司的尾牙桌上被問的。"],["p","主管舉起酒杯，全桌的人都看著你。"],["p","它是在除夕夜，在老家的神明桌前被問的。"],["p","長輩把香遞過來，你的手停在半空中。"],["p","它也可能是在一通電話裡被問的。女朋友的媽媽說：信洋教的，我們家不嫁。"],["p","收到這封信的人，每天都在回答這個問題。"],["q","本都、庇推尼，黑海南岸的城市。傍晚，同業公會的宴席開始了。"],["p","一個織布的工匠站在門口。他以前每個月都來。"],["p","今天他沒有進去。他信了耶穌。"],["p","第二天，市場上的人開始說他的閒話。他的訂單少了一半。"],["p","沒有人抓他，沒有人打他。大家只是覺得他怪。"],["q","「他們在這些事上，見你們不與他們同奔那放蕩無度的路，就以為怪，毀謗你們。」（4:4）"],["p","請你記住「以為怪」這三個字。這一章後面，它還會回來。"],["p","這一章有三個詞：兵，管，火。"],["p","我們走三步：心志作為兵器，百般恩賜的好管家，不要以為奇怪。"],["q","第一步：心志作為兵器。"],["q","「基督既在肉身受苦，你們也當將這樣的心志作為兵器」（4:1）"],["p","這一句的開頭，原文有一個「所以」。"],["p","所以，他走過的這條路，你們也要帶著同樣的想法去走。"],["p","「作為兵器」，原文 ὁπλίσασθε。整本新約只用這一次。"],["p","奇怪的是，彼得要你披上的不是盔甲，是一個想法。"],["p","「心志」原文 ἔννοιαν，就是心思、想法。"],["p","基督怎樣看受苦，你也這樣看。"],["p","因為以為信主就該一路順利的人，第一次被排擠就倒了。"],["p","可是一個早就把「基督在肉身受苦」放在心裡的人，被排擠的時候會說："],["q","這條路，我的主先走過。"],["p","同一件事，一個人倒下，一個人站住。差別在心裡先穿上了甚麼。"],["p","下半句要小心讀。"],["q","「因為在肉身受過苦的，就已經與罪斷絕了。」（4:1）"],["p","願意為主受苦的人，表明罪不再是他的主人；根據是基督先為罪受了苦。"],["p","請你聽清楚：彼得不是說受苦能讓人變好。"],["p","受苦本身沒有洗淨的能力。苦難也可能使人苦毒，使人離開神。"],["p","所以千萬不要對一個躺在病床上的人說：神是用這個病，來對付你的罪。"],["p","那不是這節經文的意思。使人與罪斷絕的，是那位受苦的基督。"],["q","「從今以後就可以不從人的情慾，只從神的旨意在世度餘下的光陰。」（4:2）"],["p","「餘下的光陰」，這是一個很誠實的詞。"],["p","有人五十歲才信主，常常懊悔前半生浪費了。"],["p","彼得沒有責備你。他說：前面那一段不能重來，後面這一段，可以重新交出去。"],["q","「因為往日隨從外邦人的心意行邪淫、惡慾、醉酒、荒宴、群飲，並可惡拜偶像的事，時候已經夠了。」（4:3）"],["p","這不是一張抽象的罪名清單，是那個工匠熟悉的一張桌子。"],["p","先獻祭，再喝酒，再狂歡。清單最後一項份量最重：可惡拜偶像的事。"],["p","可是這段經文，我們要小心用。"],["p","彼得說的是拜偶像的宴席與醉酒狂歡，不是叫你論斷那位會喝一杯的弟兄。"],["p","他也不是叫你羞辱還沒有信主的爸爸媽媽。"],["q","拒絕偶像，不等於拒絕家人。"],["p","不拿香的兒子，可以是除夕夜最早到、最晚走、碗洗得最多的那一個。"],["p","被當成怪人，本來就是寄居者的身分。"],["p","不是你哪裡做錯了。"],["p","那麼毀謗你的人呢？彼得沒有叫你反擊。"],["q","「他們必在那將要審判活人死人的主面前交帳。」（4:5）"],["p","被誤會的人最想做的事，是把每一筆帳當場算清楚。"],["p","彼得說：帳有人在算。而且那位審判者，已經預備好了。"],["q","「為此，就是死人也曾有福音傳給他們」（4:6）"],["p","這一節很難，我在講台上只說一句。"],["p","本講義採的讀法是：福音曾經傳給這些現在已經死了的人，在他們活著的時候。"],["p","這一節不教死後還有機會；我們也不用任何經文，斷定哪一位過世的人在哪裡。"],["p","我知道，有些弟兄姊妹心裡壓著一個名字，一位沒有信主就走了的家人。"],["p","我們不知道他最後一刻與神之間發生了甚麼。我們知道神是公義的，也滿有憐憫。"],["p","對還活著的人，這一節很直接：福音是傳給活人聽的。今天還能聽，就是恩典。"],["p","好，兵器穿上了。可是一個人穿得再好，也打不了一個人的仗。"],["p","那個不進宴席的工匠，第二天晚上要去哪裡吃飯？"],["p","彼得接下來，就把眼光從一個人，轉到一群人。"],["q","第二步：百般恩賜的好管家。"],["q","「萬物的結局近了。所以，你們要謹慎自守，警醒禱告。」（4:7）"],["p","有人會問：兩千年了，還算近嗎？"],["p","「近了」的意思，不是倒數計時。從基督復活以後，歷史已經進入最後一章。"],["p","所以不要算日子，也不要把今天的戰爭、疫情、新聞拿來對號入座。"],["p","請你看彼得從「近了」推出甚麼。不是囤糧，不是辭職。"],["p","是兩個很安靜的命令：頭腦清醒，警醒禱告。"],["p","而且「警醒禱告」這四個字，從彼得口中說出來，特別重。"],["q","客西馬尼園，半夜。主在不遠處禱告，汗如血點。"],["p","彼得睡著了。主回來，叫醒他。"],["q","「你們不能同我警醒片時嗎？」（太 26:40）"],["p","那一夜，彼得沒有醒過來。幾個小時以後，他三次不認主。"],["p","多年以後，他把同一個命令寫給寄居的人。"],["p","不是彼得變得比較會警醒了。是那位叫醒他的主，沒有放棄他。"],["p","結局近了，彼得說的第一件事是甚麼？"],["q","「最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。」（4:8）"],["p","「最要緊的」，原文是「在一切之先」。"],["p","「切實」原文 ἐκτενῆ，是拉緊的弓弦，不是鬆垮的客氣。"],["p","被外面以為怪的小群體，最容易從裡面裂開。"],["p","那「愛能遮掩許多的罪」是甚麼意思？"],["p","在一個天天見面、彼此虧欠的群體裡，愛不揭人的瘡疤。"],["p","弟兄早已認過、改過的事，愛不一再翻出來。"],["p","愛不把一次的跌倒，變成一輩子的標籤。"],["p","可是我一定要說清楚另一面。"],["q","遮掩，不是隱瞞侵害。"],["p","這一節不能用來掩蓋性侵、家暴、傷害孩子，或挪用奉獻。"],["p","不能用「愛能遮掩」叫受害的人閉嘴，也不能讓該負責的人逃開責任。"],["p","保護受害者、通報、依法處理，本身就是愛。"],["p","愛遮掩的，是已經面對了的罪，不是還在傷人的罪。"],["q","「你們要互相款待，不發怨言。」（4:9）"],["p","「款待」原文 φιλόξενοι，意思是愛陌生人。"],["p","請你聽，這個字和第四節「以為怪」是同一個字根。"],["p","世界覺得你們陌生。你們卻要打開門，接待陌生的人。"],["p","「不發怨言」，因為款待是累的：多煮一鍋飯，多洗一堆碗。"],["p","在線上相聚的團契，款待也許是為剛到異鄉的弟兄接一通電話。"],["q","「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。」（4:10）"],["p","「各人」，沒有一個例外。"],["p","被邊緣化的人很容易覺得自己沒有用。"],["p","彼得說：你手裡有東西，而且是神放的。"],["p","管家管的不是自己的東西。會講道的，不比會煮飯的高一等。"],["p","這一節有一個字，我想請你停下來聽。"],["p","「百般」，原文 ποικίλης，意思是多種顏色的。"],["p","這個字在彼得前書只出現兩次。另一次在第一章。"],["q","「在百般的試煉中暫時憂愁」（1:6）"],["p","百般的試煉。百般的恩賜。同一個字。"],["q","試煉有多少種顏色，恩賜就有多少種顏色。"],["p","你的試煉是失業的灰，她的是異鄉的深藍。"],["p","神怎樣回應五顏六色的試煉？"],["p","是差來一群帶著五顏六色恩賜的人。"],["p","會煮飯的，會聽人說話的，會開車載你去醫院的。"],["p","你手上那份不起眼的恩賜，可能正是別人試煉的那種顏色。"],["q","「若有講道的，要按著神的聖言講；若有服事人的，要按著神所賜的力量服事」（4:11）"],["p","講道的人，講的是神的話，不是自己的意見。這是聖經是我的準則。"],["p","服事的人，靠的是神所賜的力量，不是靠自己硬撐。"],["p","「賜」原文 χορηγεῖ，是合唱團的贊助人，一切開銷他包了。"],["p","兩種恩賜，指向同一個目的。"],["q","「叫神在凡事上因耶穌基督得榮耀。」（4:11）"],["p","恩賜用得好不好，標準不是人有沒有稱讚我。"],["p","是神有沒有因耶穌基督得榮耀。"],["p","彼得寫到這裡，寫了一聲阿們。好像這封信可以結束了。"],["p","可是他又提起筆來。因為火還在燒。"],["q","第三步：不要以為奇怪。"],["q","「親愛的弟兄啊，有火煉的試驗臨到你們，不要以為奇怪（似乎是遭遇非常的事）」（4:12）"],["p","記得我請你記住的那三個字嗎？以為怪。"],["p","第四節，外面的人 ξενίζονται，覺得你們奇怪。"],["p","第十二節，彼得說 μὴ ξενίζεσθε，同一個字：你們也不要覺得火奇怪。"],["q","他們覺得你奇怪。你不要覺得火奇怪。"],["p","「火煉」原文 πυρώσει，是煉金的爐火。"],["p","請你聽清楚，彼得說的是不要以為奇怪。他不是說不痛。"],["q","火是真的熱。只是它不是意外。"],["p","他要拿走的是另一種痛。"],["p","半夜醒來的那種痛：神是不是忘了我？"],["p","原文說，這火是為要試驗你們而來。火有目的。"],["p","煉金的人把金子放進爐裡，不是因為恨金子，是因為它值得煉。"],["q","「倒要歡喜；因為你們是與基督一同受苦，使你們在他榮耀顯現的時候，也可以歡喜快樂。」（4:13）"],["p","全卷有一條線：基督受苦難，後來得榮耀。"],["p","到這一節，這條線變成了我們的。"],["p","「一同受苦」原文 κοινωνεῖτε，就是有份，和「團契」同一個字根。"],["p","你在火裡，不是一個人在火裡。你是和他一同在裡面。"],["p","寫這句話的彼得，親身經歷過。"],["q","耶路撒冷，公會門口。幾個使徒剛被鞭打，背上還在流血。"],["q","「他們離開公會，心裡歡喜，因被算是配為這名受辱。」（徒 5:41）"],["p","那天走出公會的人當中，就有彼得。"],["p","可是「倒要歡喜」常常被用錯。"],["p","同一個彼得在第一章說過暫時憂愁。憂愁是被允許的。"],["q","「倒要歡喜」是一個方向，不是一張面具。"],["p","受苦的人可以哭。可以向神訴苦，可以去看醫生，可以找輔導。"],["p","歡喜不是把眼淚藏起來，是在眼淚裡仍知道自己在誰手裡。"],["p","教會最不該做的，是對火裡的人說：你要喜樂啊。"],["p","先陪他坐在火邊，再一起抬頭看那將要顯現的榮耀。"],["p","然後，就是這一章最高的一句。"],["q","「你們若為基督的名受辱罵，便是有福的；因為神榮耀的靈常住在你們身上。」（4:14）"],["p","第四節是低谷：被以為怪，被毀謗。十節之後，同樣被罵的人身上，歇著榮耀的靈。"],["p","外面看見的是羞辱。神看見的，是榮耀停在那裡。"],["p","「常住」，原文 ἀναπαύεται，意思是歇息、安歇。"],["p","聖靈不是掀起一陣激動，是安安靜靜地停在那裡。"],["q","一個姊妹，除夕夜。被長輩當著全家數落「信洋教，連祖宗都不要」。"],["p","她回到房間，關上門。沒有覺得屬靈，只覺得累，覺得委屈。"],["p","彼得說：就在那個時候，榮耀的靈歇在你身上。"],["p","你不必感覺得到，他也在。你被罵的那一刻，正是他停留的地方。"],["p","聖靈是我的引導。他不只帶路，也在最難的那一段陪你坐下。"],["p","可是彼得馬上踩了煞車。"],["q","「你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦。」（4:15）"],["p","不是所有的苦，都是為主受的。"],["p","因犯罪被追究、因自己過失丟了工作，不是彼得要安慰的苦。"],["p","苦有四種：因作惡，因行善，為義，為基督的名。還有百般的試煉。"],["p","分辨不是審問受苦的人，不要預設他一定做錯了甚麼。"],["p","也不要把自己犯錯的後果，包裝成為主受苦。"],["p","清單的最後一項，很意外：好管閒事。"],["p","原文 ἀλλοτριεπίσκοπος，監督別人的事，現存希臘文獻首見。"],["p","主是靈魂的「監督」，長老要「照管」，同一個字根。"],["q","一種監督是照顧。一種監督是插手。"],["p","熱心過頭去管同事怎樣過日子，被人厭惡，不是為主受苦。"],["q","「若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給神。」（4:16）"],["p","「基督徒」新約只出現三次，原本是外人取笑的標籤。"],["p","彼得說：別人拿來笑你的名字，你可以拿來榮耀神。"],["p","寫這句話的人，最知道羞恥是甚麼滋味。"],["q","大祭司的院子，天快亮了。炭火旁邊，一個使女盯著彼得看。"],["p","他發咒起誓，說不認得那個人。然後，雞叫了。"],["p","如今，這個人對寄居的人說：不要羞恥。"],["p","不是彼得變勇敢了。是那位被他否認的主，沒有否認他。"],["q","「因為時候到了，審判要從神的家起首。」（4:17）"],["p","這句話很嚴肅，卻是說給受苦的人聽的安慰。"],["p","你正在經歷的火，不是神忘了你。是神先從自己的家動工。"],["p","可是請注意，彼得說「從我們起首」。他把自己算在裡面。"],["p","所以不要拿某間教會的醜聞、某位牧者的跌倒，去宣布這是神的審判。"],["p","出了問題要面對、要處理，但對號入座不是我們的位置。"],["q","「若是義人僅僅得救，那不
