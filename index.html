>不該。各家在「較軟弱」的細節上看法不同，但沒有一個正統的讀法說女性在神面前次一等；這一節恰恰是新約裡少數直接說妻子與丈夫「一同承受」永生之恩的經文。</p><p>這一題該問的是作丈夫的人：我認識我的妻子嗎？她怕甚麼、累在哪裡？我在教會很屬靈，回到家卻冷淡粗暴嗎？如果是，你的禱告路上有一道溝；填平它的方法，不是多禱告，是回家敬重她。</p>"]],"con":[],"say":"本講義的立場：「較軟弱的器皿」指當時妻子在體力與社會處境上的弱勢，不貶低女性的價值、智力或靈性；她是「一同承受生命之恩的」。不敬重妻子的丈夫，禱告路上有阻礙。本講義的全卷立場見 ISS00_3。","care":"會眾席上會有被這節經文傷過的姊妹——她曾被說「你們女人就是比較軟弱，不要想太多」，也會有正在婚姻裡被冷淡、被貶低的妻子。不要在講台上拿女性的「軟弱」開玩笑，也不要把這一節講成女性不能參與決定的理由。也不要對禱告不蒙應允的人說「一定是你們夫妻有問題」，讓單身、喪偶或婚姻破碎的人多一層羞愧。這一節主要是對丈夫說的：牧者要陪丈夫們檢討，而不是讓妻子們再受一次傷。"},{"id":"ISS03_6","t":"3:9「倒要祝福」——被欺負還要祝福，是不是縱容惡人？","r":"3:8--12；羅 12:17--19","ch":[3],"why":"「不以惡報惡，以辱罵還辱罵，倒要祝福」是本章的章題，也是最難做到的一句。被霸凌的員工、被欺負的孩子、被家暴的妻子聽到這一節，常會問：那我是不是不能申訴、不能報警、只能吞下去？這一題若講不清楚，祝福就會變成加害者的保護傘；講清楚了，它會是受害者最大的自由。","pos":[["【一】經文問的是甚麼","","<p>彼得說：「不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣」（3:9）。「倒要」原文 τοὐναντίον（tounantion），正好相反。接著他引詩 34 篇：「也要離惡行善，尋求和睦，一心追趕」（3:11）。問題是：「不以惡報惡」包括不追究責任嗎？祝福和公義、申訴、法律程序能不能並存？個人的不報復，和社會的審判秩序是甚麼關係？</p>"],["完全不抵抗說：不以暴力或報復回應","","<p>部分重洗派與和平教會的傳統，配合太 5:39「不要與惡人作對」，認為基督徒被惡待時應完全不抵抗，不訴諸法律、不以任何方式反擊，以十字架的方式見證神的國。這一說的長處是極其認真地對待主的命令，歷史上也確實有人用這樣的見證感動了逼迫者。今天這些傳統（如門諾會）同樣主張保護受害者、依法通報；它反對的是以暴力與報復回應。</p><p><strong>難處：</strong>這一說若套用在家暴、性侵、兒少受虐上，會讓最弱小的人留在危險裡；而且新約裡耶穌被打時問「你為甚麼打我呢」（約 18:23），保羅也曾援引羅馬公民權（徒 16:37；22:25），可見不報復不等於不說話。</p>"],["祝福與公義並行說：個人不報復，同時使用神設立的秩序","","<p>多數福音派的讀法：3:9 禁止的是報復——我自己把審判的權柄搶回來；它不禁止求助、申訴、報警。保羅在同一個脈絡說：「不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19），接著就說掌權者是「伸冤的，刑罰那作惡的」（羅 13:4）。把事情交給法律與正當程序，正是不自己伸冤的方式。</p><p><strong>難處：</strong>這一說在實際操作上需要分辨動機：申訴的人是在追求公義，還是在包裝報復？它也需要提醒：使用法律之後，心裡仍要拒絕仇恨，否則外面合法，裡面還是以惡報惡。</p>"],["處境說：彼得是對無權無勢的少數說話，重點在不被仇恨轄制","","<p>一些學者強調處境：收信的寄居者沒有政治與法律上的力量，被毀謗時能做的不多；彼得要他們不要被仇恨吞噬，因為「主的眼看顧義人；主的耳聽他們的祈禱」（3:12），審判在神手裡。今天的信徒若有法律與申訴的管道，使用它們不違背這一節。</p><p><strong>難處：</strong>處境說若講過頭，可能把 3:9 說成只是弱者不得已的策略，失去「為此蒙召」的呼召性質；祝福不只是沒辦法時的忍耐，是信徒在任何處境中的身分。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：祝福拒絕的是仇恨與報復，不是公義。</strong>不以惡報惡，是不把審判的權柄搶回自己手裡；申訴、求助、報警、依法追究，是把事情交給神所設立的秩序，兩者不衝突。被羞辱的員工可以依程序申訴，受家暴的妻子可以離開危險、申請保護，同時在神面前不咒詛對方。</p><p>祝福最少是這一件事：在神面前，我不求他滅亡，我求神改變他。受苦的分辨見全卷立場 ISS00_2，順服與求助的界線見 ISS00_3；舌頭的節制回指雅各書立場五。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家在「不抵抗」的範圍上看法不同，但都同意：主耶穌「被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主」（2:23）。交託不是假裝沒事，也不排除求助，是不讓報復成為我的主人。</p><p>你若被冤枉了，那就是冤枉；你可以難過，也可以說出來。可是請你記得：別人可以搶走你的名聲，搶不走你祝福人的自由——「好叫你們承受福氣」。</p>"]],"con":[],"say":"本講義的立場：祝福拒絕的是仇恨與報復，不是公義；不以惡報惡，不等於不申訴、不求助、不報警。把事情交給神所設立的秩序，不是自己伸冤。本講義的全卷立場見 ISS00_2、ISS00_3。","care":"會眾席上會有被霸凌的員工、被欺負的學生、被家暴的妻子；他們最怕聽到「你要祝福他，就不要再提了」。不要用這一節叫受害者沉默，也不要要求受害者先原諒、先和好，才肯幫助他。遇到家暴、性侵、兒少受虐，先保護安全、陪他依法求助與通報，不在教會內私了。同時也溫柔地陪他面對心裡的仇恨：祝福是一段路，不是一個當下就要交出來的成績；他可以慢慢走，教會陪他走。"},{"id":"ISS03_7","t":"3:15「常作準備……回答」——基督徒要會辯論嗎？","r":"3:15--16","ch":[3],"why":"3:15 是護教學最常引用的經文，「回答」原文 ἀπολογίαν 正是英文 apologetics 的字源。有些信徒因此覺得自己口才不好、讀書不多，就不配傳福音；也有人把這一節當成辯論的號角，在網路上、在家族聚會上和人吵到面紅耳赤。這一題要問：彼得要我們準備的到底是甚麼？","pos":[["【一】經文問的是甚麼","","<p>彼得說：「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人」（3:15）。ἀπολογίαν（apologian）原是法庭上的答辯，也可以是日常被人質問時的說明；問的人要的是「盼望的緣由」（λόγον，logon），不是教義大綱。接著 3:16 說「存著無虧的良心」。問題是：這是要每個信徒都會講理、會辯論嗎？還是另有重點？</p>"],["理性護教說：基督徒應當預備好理性的論證","","<p>古典與證據派護教學認為，3:15 呼召每個信徒都預備好為信仰說出合理的理由——神的存在、復活的證據、聖經的可靠。這一說的長處是抵擋「信仰不需要理由」的反智傾向，也讓在大學、職場被質問的年輕人有所預備；保羅在雅典也曾天天在市上與人辯論（徒 17:17）。</p><p><strong>難處：</strong>若把回答等同於論證，不擅長講理的信徒會覺得自己沒資格作見證；而且贏了辯論不等於贏得人——把人駁倒卻讓他更遠離基督，不是這一節的目的。</p>"],["生命見證說：重點是盼望與生命，不是論證","","<p>另一些解經者強調，人家問的是「心中盼望的緣由」——一個人為甚麼在被毀謗、受苦的時候還有盼望。這個問題的前提是對方先看見了你的盼望；所以回答的核心是見證：一位從死裡復活的主（1:3）。這和 3:1 的「不用言語」呼應：先有生命，才有人問。</p><p><strong>難處：</strong>這一說若只講生命、不講內容，可能淪為「信就對了」，辜負那些真心發問、需要理由的人；彼得用的是「緣由」（λόγον），顯然期待信徒說得出來。</p>"],["態度優先說：「溫柔、敬畏」與「無虧的良心」才是重點","","<p>還有一種讀法把重點放在回答的方式：「以溫柔、敬畏的心」（在 SBLGNT 屬 3:16 句首，和合本移入 3:15），以及「存著無虧的良心」（3:16）。溫柔對人，敬畏對神；回答的人自己的生活要經得起檢查，好叫誣賴的人「自覺羞愧」。內容再對，態度傲慢，也不是彼得要的回答。</p><p><strong>難處：</strong>態度說提醒得很好，卻可能讓人以為只要態度好、內容可以不準備；「常作準備」仍然是一個真實的功課，需要讀經、思想、練習。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:15 要每個信徒「常作準備」，說得出自己心中盼望的緣由——核心是一位從死裡復活的主；態度是溫柔、敬畏，生活是無虧的良心。</strong>基督徒不必人人都是辯論家，但每個人都可以預備好用幾句話說出：以前的我、基督為我做了甚麼、我現在的盼望。有負擔、有恩賜的人，也應當在理性的護教上下功夫，服事真心發問的人。</p><p>寫這句話的彼得，曾在使女面前答不出來（可 14:68）；主沒有放棄他。讀書信的處境與原則，全卷立場見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你說不贏一個人，不代表你的信仰站不住；信仰的根基不在你的口才，在那位復活的主。有些問題你今天答不出來，可以老實說「我不知道，我回去查一查，也問問我的牧者」——那也是溫柔與誠實。</p><p>真正該問的是：我的生活裡，有沒有讓人想問「你為甚麼還有盼望」的地方？如果有，你已經在回答的路上了。</p>"]],"con":[],"say":"本講義的立場：3:15 要每個信徒預備好說出心中盼望的緣由，核心是復活的主，態度是溫柔、敬畏，生活是無虧的良心；不必人人是辯論家，也不可以說信仰不需要理由。本講義的全卷立場見 ISS00_1。","care":"會眾席上有覺得自己「不會講」而不敢開口的長輩，也有在網路上跟人吵架吵到傷了家人的年輕人，還有被親人用尖銳問題問倒、從此自覺信心軟弱的學生。不要羞辱答不出來的人，也不要鼓勵用辯論去贏家人。陪不敢開口的人寫下三句話的見證；陪愛辯論的人學習溫柔與敬畏；陪被問倒的人一起找答案，讓他知道疑問可以帶到教會來。"},{"id":"ISS03_8","t":"3:19--20「傳道給那些在監獄裡的靈聽」——耶穌死後下到陰間嗎？","r":"3:18--20；4:6","ch":[3],"why":"這是新約最難解的經文之一，連路德都說讀不懂。它又牽動會眾最痛的問題：沒有信主就過世的父母，會不會在陰間還有聽福音的機會？使徒信經「降在陰間」這一句又是甚麼意思？這一題若不講清楚，有人會被假的盼望安慰，有人會被沒有根據的判決擊倒。","pos":[["【一】經文問的是甚麼","","<p>「他藉這靈曾去傳道給那些在監獄裡的靈聽，就是那從前在挪亞預備方舟、神容忍等待的時候，不信從的人」（3:19--20）。五個問題疊在一起：「藉這靈」（ἐν ᾧ，en hō）指甚麼？「去」（πορευθεὶς，poreutheis）是往下還是往上？「傳道」（ἐκήρυξεν，ekēryxen）是傳福音還是宣告？「監獄裡的靈」是死去的人還是墮落的天使？時間是挪亞的日子、受死與復活之間，還是復活升天時？</p>"],["藉挪亞傳道說：先存的基督藉挪亞向當時的人傳道","","<p>奧古斯丁與許多改革宗註釋認為，基督在挪亞的時代藉著聖靈、藉著「傳義道的挪亞」（彼後 2:5）向當時的人傳悔改的道，那些人不信，現在在監獄裡。1:11 說先知心裡有「基督的靈」，可見這是彼得熟悉的想法。它保護的是：不教死後另有悔改的機會。</p><p><strong>難處：</strong>3:18 先說「按著靈性說，他復活了」，3:19 才說「他藉這靈曾去」，次序看起來是復活之後；新約單獨用「靈」指死去的人很少見。這個讀法讓 3:19 跟前後的得勝路線接不起來。</p>"],["下到陰間說：基督在死與復活之間下到陰間（傳福音或宣告得勝）","","<p>這一說有兩種。一種是部分早期教父的讀法：基督下到陰間，向挪亞時代死去的人傳福音，給他們悔改的機會——本講義不採用，經文沒有說他們悔改了，聖經一貫說「現在正是拯救的日子」（林後 6:2），不教死後另有機會。另一種是天主教、東正教與路德宗部分傳統：基督「降在陰間」（使徒信經），不是去傳第二次的福音，是宣告他的得勝。</p><p><strong>難處：</strong>「去」在 3:22 又出現一次，是「進入天堂」——往上，不是往下；而且下到陰間的讀法容易讓人去描繪陰間的地圖，說得比經文多。</p>"],["向墮落天使宣告說：復活升天的基督向被拘禁的邪靈宣告得勝","","<p>多數近代福音派註釋的讀法：「靈」在新約多指靈界的存在；「監獄」使我們想起犯罪的天使被「交在黑暗坑中，等候審判」（彼後 2:4），也使我們想起猶 6 與創 6:1--4。πορευθεὶς 在 3:19 與 3:22 是同一個分詞，同一趟路：復活、宣告、升天，結果是「眾天使和有權柄的，並有能力的，都服從了他」（3:22）。綜合說再加一句：4:6 另指福音曾傳給現在已死的人。</p><p><strong>難處：</strong>這一說依賴猶太文獻（如以諾書）的背景，會眾不熟悉，講台上要小心不要變成講神話；ἐκήρυξεν 解作「宣告」可以，但這個字最常見的用法是傳福音。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的主要讀法：復活升天的基督向墮落天使宣告得勝；並陳其他讀法，不嘲諷任何一種。</strong>4:6 採「福音曾傳給現在已死的人——在他們活著的時候」。本講義不教死後第二次機會，也不斷定任何亡者的去處，特別是沒有信主就過世的家人；我們知道神是公義的，也是滿有憐憫的，我們把所愛的人交在他手裡。經文沒有給我們一張陰間的地圖，我們就不畫。使徒信經「降在陰間」各傳統理解不同，本講義不裁判。</p><p>本講義的全卷立場見 ISS00_4；哀傷與亡者回指帖撒羅尼迦前書立場三。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。五種讀法的弟兄姊妹都同意：基督受死、復活、升天，坐在神的右邊，一切都服從了他。連彼得自己都只寫了兩節，我們不必比經文說得更多。</p><p>3:19 最重要的不是「誰在監獄裡」，是「誰是得勝者」。對一個在家裡、職場、社會裡受苦的人，這就夠了：那位「義的代替不義的，為要引我們到神面前」（3:18）的，已經得勝，已經坐在寶座上。</p>"]],"con":[],"say":"本講義的立場：3:19 主要讀法是復活升天的基督向墮落天使宣告得勝，並陳其他讀法；不教死後第二次機會，不斷定任何亡者的去處，不描繪陰間地圖。本講義的全卷立場見 ISS00_4。","care":"會眾席上會有父母、配偶、孩子沒有信主就過世的人，天天在心裡問「他在哪裡」。不要為了安慰他，說出經文沒有說的「他在陰間還能聽福音」；也不要宣判「他已經沉淪了」。在喪禮與追思禮拜上，陪家屬哀哭，把亡者交在公義又滿有憐憫的神手裡，並把這份痛轉成為還活著的家人禱告。不要在這一題上用恐懼催逼人決志；也不要讓好奇心把講台變成陰間導覽。"},{"id":"ISS03_9","t":"3:21「這水所表明的洗禮，現在……也拯救你們」——洗禮能救人嗎？","r":"3:20--21；羅 6:3--4","ch":[3],"why":"3:21 是新約少數直接說「洗禮……拯救你們」的經文。有的傳統由此強調洗禮是恩典的施行，有的傳統擔心這樣講會讓人以為水能救人；會眾裡則有未受洗就過世的家人、遲遲不敢受洗的慕道友、小時候受洗如今冷淡的人。這一題要講得準：救人的是誰？洗禮在救恩裡是甚麼位置？","pos":[["【一】經文問的是甚麼","","<p>彼得說：「這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們；這洗禮本不在乎除掉肉體的污穢，只求在神面前有無虧的良心」（3:21）。「這洗禮」是和合本的小字補充；ἀντίτυπον（antitypon）是「對應的印記」，挪亞的水與洗禮是彼得自己作的連結。ἐπερώτημα（eperōtēma）新約只此一次，可解作向神的「求問」或「回應、承諾」。問題是：洗禮本身有拯救的功效嗎？沒有受洗的人能得救嗎？</p>"],["聖禮說：洗禮是神施行恩典的管道","","<p>天主教、東正教與路德宗認為，洗禮是神施行重生恩典的聖禮，3:21 的「拯救你們」、徒 2:38「奉耶穌基督的名受洗，叫你們的罪得赦」都說明洗禮不只是象徵。這一說的長處是嚴肅看待洗禮，不把它當作可有可無的儀式；它也強調恩典是神主動賜下的，不是人做出來的。</p><p><strong>難處：</strong>若講過頭，會讓人以為水本身有功效、受洗就自動得救；而彼得緊接著說洗禮「本不在乎除掉肉體的污穢」，救人的動力是「耶穌基督復活」。</p>"],["記號與印記說：洗禮是恩約的記號與印記","","<p>改革宗與長老會傳統認為，洗禮是恩約的記號與印記，像舊約的割禮，指向基督的救恩，並施行於信徒和他們的兒女（嬰兒洗）。3:21 的「對應」正好說明洗禮是一個指向實體的記號；保羅說「我們藉著洗禮歸入死，和他一同埋葬」（羅 6:4）。</p><p><strong>難處：</strong>記號與印記的關係不容易說清楚：若印記太強，接近聖禮說的難處；若太弱，又回到只是象徵。嬰兒洗的根據也是各宗派長期討論的議題。</p>"],["信徒見證說：洗禮是信徒向神的回應與公開見證","","<p>浸信會與許多自由教會認為，洗禮是已經信主的人順服主命令、公開見證信仰的行動；3:21 的 ἐπερώτημα 正是「向神的回應」——受洗的人在神面前回答「我信」。救人的是基督，洗禮是得救之人的順服。</p><p><strong>難處：</strong>若講過頭，會把洗禮講成可有可無，好像受不受洗都無所謂；而主明明吩咐「奉父、子、聖靈的名給他們施洗」（太 28:19），新約的信徒信了就受洗，沒有拖延。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：救人的是復活的基督，不是水——「藉著耶穌基督復活也拯救你們」（3:21）；洗禮是人向神的回應與承諾（ἐπερώτημα）。</strong>本講義不說「受洗就得救」，好像儀式自動生效；也不說「沒受洗不能得救」——這使我們想起十字架上的強盜，主對他說「今日你要同我在樂園裡了」（路 23:43）。</p><p>但洗禮不是可有可無：主吩咐了，我們就順服；不輕看洗禮，也不嘲諷任何宗派的洗禮觀，不在嬰兒洗與信徒浸之間裁判。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各宗派對洗禮的方式與意義有不同理解，都是在基督裡的弟兄姊妹；大家都同意：救恩的根基是基督的死與復活，「你們得救是本乎恩，也因著信」（弗 2:8）。</p><p>如果你已經信主卻還沒有受洗，請不要因為害怕而拖延，也不要因為還沒受洗而懷疑自己的得救；如果你很早就受了洗，卻覺得自己離主很遠，洗禮不是一張保險單，是一個立約的時刻——今天就可以回到那個承諾裡。</p>"]],"con":[],"say":"本講義的立場：救人的是復活的基督，不是水；洗禮是人向神的回應與承諾，主吩咐了我們就順服。不說受洗就自動得救，也不說沒受洗不能得救，不在嬰兒洗與信徒浸之間裁判。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有家人信了主卻來不及受洗就過世的人，正在心裡害怕他是不是沒有得救；也有因為家人反對、遲遲不能受洗的慕道友，還有小時候受洗、如今冷淡卻以為自己有保險的人。不要用 3:21 讓第一種人絕望，不要用它給第二種人壓力，也不要讓第三種人安心於一個儀式。陪每一個人把眼光放回那位復活的基督；對來自不同宗派背景的弟兄姊妹，尊重他們的洗禮，不嘲諷、不要求重洗作為參與的條件。"},{"id":"ISS04_1","t":"4:1「在肉身受過苦的，就已經與罪斷絕了」——受苦能讓人不犯罪嗎？","r":"4:1--2；3:18；羅 6:7","ch":[4],"why":"4:1 下半句是全卷最難的句子之一。字面讀起來像是說：只要受過苦，人就不再犯罪了。這一句常被拿來對病人、失業的人、受傷的人說「神用苦難煉淨你」，甚至反推「你還在受苦，表示罪還沒斷」。這一題關係到我們怎樣看自己和別人的苦，也關係到成聖到底靠甚麼。","pos":[["【一】經文問的是甚麼","","<p>原文 ὁ παθὼν σαρκὶ πέπαυται ἁμαρτίας，「那在肉身受過苦的，已經止住了罪」，動詞是完成式：停了，至今停著。問題有兩層：第一，「那受過苦的」是誰——是信徒，還是基督？第二，「與罪斷絕」是甚麼意思——是不再犯罪、罪的權勢被打斷，還是在罪的事上已經選了邊？4:1 用「所以」接回 3:18「基督也曾一次為罪受苦」，讀法要從那裡開始。</p>"],["信徒說：願意為主受苦的人，已經在罪的事上選了邊","","<p>這一說認為「受過苦的」指信徒：一個願意因為跟隨基督而在肉身受苦的人，等於公開宣告罪不再是他的主人。4:2 緊接「不從人的情慾，只從神的旨意」，4:3--4 描寫他們不再同奔放蕩的路而被毀謗——受苦正是因為與罪決裂。這讀法貼近上下文，也最能落在生活裡。</p><p><strong>難處：</strong>完成式「已經止住」說得很強，而經驗告訴我們，受過苦的信徒仍會犯罪；若讀成「受了苦就不犯罪」，就和經驗與 1:14--16 的勸勉衝突。這一說必須說清楚：止住的是罪的主權，不是每一次的失敗。</p>"],["基督說：受苦的是基督，他的受苦了結了罪的問題","","<p>這一說認為「受過苦的」指基督自己：他在肉身受苦，就一次了結了罪（3:18），從此與罪再無關係；我們要披上的，就是這個「他已經了結了罪」的想法。這讀法與 3:18 的「一次」緊扣，也把成聖的根基放在基督的工作上，不放在我們的忍耐上。</p><p><strong>難處：</strong>說無罪的基督「止住了罪」，用詞有點彆扭；而且 4:1 上半句是「基督……你們也當」，下半句的「那受過苦的」看起來是在說明「你們」為甚麼要這樣想，指信徒比較順。</p>"],["受苦淨化說：苦難本身會煉淨人，使人不再犯罪","","<p>這一說在民間與部分講台上很常見：苦難像藥，吃夠了，罪就被逼出來了；所以生病、失業、被傷害，都是神在洗淨你。它抓住了一個真實的經驗：有些人在苦難裡確實回轉、變得柔軟。</p><p><strong>難處：</strong>經文沒有這樣說。苦難本身沒有洗淨的能力，它也可能使人苦毒、離開神；洗淨我們的是「基督的寶血」（1:19）。這一說還會反推出「你還在受苦，就是罪還沒斷」，把受苦的人推上審判台，正是本講義紅線六要擋住的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採信徒說，並以基督說為根基：願意為主受苦的人，表明罪不再是他的主人；根據是基督先在肉身為罪受了苦。本講義不採受苦淨化說——不說受苦能讓人變好，更不說「你受苦是因為你還有罪」。</strong></p><p>彼得要信徒披上的是一個「想法」（ἔννοιαν），不是一份苦難的配額：基督怎樣看受苦，我們也這樣看。使人與罪斷絕的，從頭到尾是那位先受苦的基督；受苦的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：基督已經為罪受了苦，信徒要跟著他的腳蹤，不再照人的情慾過餘下的光陰。爭的只是 4:1 下半句的主詞與語氣。</p><p>如果你正在苦難裡，請不要用這一節翻找自己的罪；你的苦不是一張帳單。你可以做的，是把那個想法穿上：這條路，我的主先走過，而且他已經得勝。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：願意為主受苦的人，表明罪不再是他的主人，根據是基督先為罪受了苦；本講義不說受苦能讓人變好，也不說受苦的人是罪沒有斷。本講義的全卷立場見 ISS00_2。","care":"會眾席上會有正在化療的、剛失業的、長期照顧病人的人，他們最怕聽到「神用這個來對付你」。不要用 4:1 替任何人的病或苦找罪因；陪他時，先承認苦是真的，再一起看那位先受苦的基督。也要留意曾經被教會說過「你是因為有罪才生病」的人，他們需要的是道歉與重新被接納。"},{"id":"ISS04_2","t":"4:3「醉酒、荒宴、群飲……拜偶像」——基督徒可以喝酒、應酬、拿香嗎？","r":"4:3--4；弗 5:18；林前 10:20；羅 14:21","ch":[4],"why":"4:3 的清單幾乎就是華人信徒的日常考題：公司尾牙要不要乾杯、客戶應酬要不要去、除夕夜要不要拿香。有的教會一律禁酒，有的教會覺得喝酒是自由；有的家庭因為一支香鬧到斷絕往來。這一題直接決定一個寄居者在家裡和職場怎樣站，也最容易讓信徒彼此論斷、讓家人覺得被拒絕。","pos":[["【一】經文問的是甚麼","","<p>4:3 列了六樣：邪淫、惡慾、醉酒、荒宴、群飲，最後是「可惡拜偶像的事」。這不是抽象的罪名表，而是一世紀同業公會宴席的流程：先向守護神獻祭，再喝酒，再狂歡。彼得說的是信徒「往日」的生活，而 4:4 說他們不再同奔那股洪流，就被毀謗。問題是：今天的哪些場合等於那張桌子？喝酒本身、應酬本身、拿香本身，各落在哪裡？</p>"],["禁酒與不應酬說：為了見證與保護，一律不碰","","<p>華人教會長久的傳統是基督徒不喝酒、不參加有酒的應酬。理由有三：聖經說「不要醉酒，酒能使人放蕩」（弗 5:18）；許多家庭被酒害過；在華人社會，不喝酒本身就是一個清楚的見證。這一說也保護了剛信主、曾經酗酒的人。</p><p><strong>難處：</strong>聖經禁止的是醉酒，不是一切的酒；迦拿婚宴上主變水為酒（約 2:1--11），保羅也勸提摩太稍微用點酒（提前 5:23）。把規矩當成福音，容易讓人以為不喝酒就屬靈，也容易論斷別地方、別傳統的弟兄姊妹。</p>"],["節制自由說：喝酒是良心自由，醉酒與偶像才是界線","","<p>這一說認為 4:3 的重點是「醉酒、群飲」與「拜偶像」，不是一杯酒；基督徒可以在節制中喝，可以出席應酬，但不醉、不同奔放蕩，也不參與祭拜。根據是「或吃或喝，無論做甚麼，都要為榮耀神而行」（林前 10:31）。</p><p><strong>難處：</strong>自由要受愛的約束：「無論是吃肉是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好」（羅 14:21）。在應酬文化裡，「一杯就好」常常是洪流的入口；這一說若不講節制與愛，很容易變成跟著跑的藉口。</p>"],["拿香的兩種做法：一律不拿香，或拿香只是禮儀","","<p>關於祭祖拿香，一種看法認為拿香只是華人表達孝敬的禮儀，不等於拜偶像，信徒可以照做以免傷害家人。另一種看法認為拿香是向亡者與神明獻祭的行為，正是 4:3「可惡拜偶像的事」的今日樣子，因為「外邦人所獻的祭是祭鬼，不是祭神」（林前 10:20）。</p><p><strong>難處：</strong>前一種把敬拜的動作看得太輕，忽略了獻祭的意義；後一種若只會說「不」，不會用別的方式表達孝敬，就讓家人覺得信主等於不要祖宗、不要家。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的看法：醉酒、放蕩與拜偶像，經文清楚說不可；喝不喝一杯酒、去不去一場應酬，是在愛中節制的良心自由，彼此不論斷；拿香涉及向亡者與神明獻祭，本講義建議不拿香，但要用敬重的方式（鞠躬、獻花、追思、照顧長輩）表達孝敬。</strong></p><p>拒絕偶像，不等於拒絕家人。彼得在本章同時說「不同奔」與「互相款待」：不跟著洪流跑，卻不離開人群。處境與原則的全卷立場見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：醉酒是罪，拜偶像是罪，論斷弟兄也是罪；爭的是界線畫在哪裡。</p><p>如果你是家裡唯一信主的人，你的信心不是看你拒絕得有多硬，而是看你在不拿香的那一天，是不是最早到、最晚走、最用心照顧長輩的那一個。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：醉酒、放蕩與拜偶像不可；一杯酒、一場應酬是在愛中節制的自由，彼此不論斷；建議不拿香，但用敬重的方式孝敬長輩——拒絕偶像，不拒絕家人。本講義的全卷立場見 ISS00_1。","care":"會眾席上有因為不拿香被家族冷落的人，也有在酗酒家庭長大、一聞到酒味就發抖的人，還有每週都得陪客戶應酬、心裡很掙扎的業務員。不要在講台上嘲笑拿香的家人，也不要用禁酒論斷別的弟兄；陪掙扎的人一起想出一句溫和的話、一個替代的孝敬方式，並記得為他未信主的家人禱告，而不是叫他跟家人劃清界線。"},{"id":"ISS04_3","t":"4:6「就是死人也曾有福音傳給他們」——人死後還能聽福音嗎？","r":"4:5--6；3:19；來 9:27","ch":[4],"why":"4:6 是新約裡最常被用來談「死後得救」的經文之一，又緊接在 3:19「傳道給那些在監獄裡的靈聽」之後，兩節常被連讀。在喪禮和追思禮拜上，失去未信主家人的人最想聽到的就是這一節。這一題牽動福音的迫切性，也牽動一個哀傷的家庭怎樣被安慰，必須小心處理。","pos":[["【一】經文問的是甚麼","","<p>原文 εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη，「為此，福音也曾傳給死人」，動詞是不定過去式被動。問題是：這些「死人」是甚麼時候聽到福音的——在他們活著的時候，還是死了以後？還有，「死人」是指肉身已死的人，還是屬靈上死的人？4:5 剛說主要「審判活人死人」，4:6 的「死人」應與它同一個意思。</p>"],["生前聽福音說：福音曾傳給現在已死的人——在他們活著的時候","","<p>這一說認為，4:6 的「死人」是寫信時已經過世的信徒：他們活著的時候聽了福音、信了主，後來死了。外人看他們「肉體按著人受審判」——一樣會死，甚至被當成信了也沒用；但「他們的靈性卻靠神活著」。這讀法與 4:5「審判活人死人」緊扣，也安慰那些看見弟兄姊妹過世而動搖的寄居者。</p><p><strong>難處：</strong>經文沒有明寫「在他們活著的時候」，這是從上下文補出來的；而且 3:19 剛講過基督向監獄裡的靈傳道，讀者自然會把兩節連起來，這一說必須解釋兩處為何不同。</p>"],["死後聽福音說（本講義不採）：人死後仍可聽見並回應福音","","<p>這一說把 4:6 和 3:19 連讀，認為基督在死與復活之間到陰間向死人傳了福音，或認為神在人死後仍給人回應福音的時刻。它吸引人，因為回應了一個很深的痛：沒聽過福音就死去的人怎麼辦？</p><p><strong>難處：</strong>聖經別處沒有支持這個教導，反而說「人人都有一死，死後且有審判」（來 9:27）；3:19 用的動詞是「宣告」，對象是「靈」，不是「死人」，兩節未必在說同一件事。這一說還會削弱今天回應福音的迫切，本講義不採。</p>"],["屬靈死人說：「死人」指靈性上死了的人","","<p>這一說認為 4:6 的「死人」是比喻，指在罪中屬靈上死了的人（弗 2:1 的說法）；福音傳給他們，叫他們活過來。這讀法神學上沒有問題，也很適合佈道。</p><p><strong>難處：</strong>4:5 的「活人死人」明明是肉身的死活，4:6 用「為此」緊接，同一個字在兩節之內換成比喻，很不自然；這一說比較像是把別處的真理讀進這一節。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採生前聽福音說：福音曾傳給現在已死的人——在他們活著的時候。本講義不教死後第二次機會，也不斷定任何亡者的去處，尤其是未信主就過世的家人。</strong></p><p>3:19 的五種讀法與本講義的主要讀法，見第 3 章議題與 ISS00_4。神是公義的，也是滿有憐憫的；我們不知道一個人最後一刻與神之間發生了甚麼（回指帖撒羅尼迦前書立場三）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神要審判活人死人；福音是神叫人活過來的話；凡在基督裡的人，就算肉身死了，靈性仍靠神活著。</p><p>對還活著的人，這一節很直接：福音是傳給活人聽的，今天還能聽，就是恩典。對失去家人的人，我們不給經文沒有給的應許，也不替神宣判；我們陪你哀哭，並把那個名字交給那位公義又憐憫的神。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:6 指福音曾傳給現在已死的人——在他們活著的時候；本講義不教死後第二次機會，也不斷定任何亡者的去處。本講義的全卷立場見 ISS00_4。","care":"會眾席上一定有人心裡壓著一個名字：沒有信主就走了的爸爸、媽媽、孩子。他聽這一題時不是在研究神學，是在問「我還能不能再見到他」。不要在喪禮上給經文沒有給的應許，也不要說「他已經沉淪了」這種宣判的話；先陪他哭，承認我們不知道全部，再一起把這個人交給公義又憐憫的神。之後幾個月，要持續探訪，不要只在喪禮那一天出現。"},{"id":"ISS04_4","t":"4:7「萬物的結局近了」——兩千年了，還算「近」嗎？","r":"4:7；雅 5:8；彼後 3:8--9","ch":[4],"why":"彼得在主後六十年代說「萬物的結局近了」，兩千年過去了，主還沒有再來。慕道友會問：使徒是不是說錯了？教會裡也常有人拿新聞、戰爭、疫情來算日子，轉傳末日影片，讓人焦慮。這一題關係到聖經的可信，也關係到信徒每天是被恐慌推著走，還是被盼望拉著走。","pos":[["【一】經文問的是甚麼","","<p>原文 Πάντων δὲ τὸ τέλος ἤγγικεν，動詞是完成式「已經近了，而且一直近著」。τέλος 是結局，也是目標。問題是：「近」是時間表上的倒數，還是時代的性質？更要緊的是，彼得從「近了」推出甚麼？他推出的是「謹慎自守，警醒禱告」（4:7），接著是相愛、款待、服事——不是算日子。</p>"],["時代性質說：基督復活以後，歷史已經進入最後一章","","<p>這一說認為，新約說「近了」，是說基督的死、復活與聖靈降臨已經把歷史帶進「末世」；希伯來書說神「就在這末世藉著他兒子曉諭我們」（來 1:2），約翰也說「如今是末時了」（約壹 2:18）。從那一天起，結局隨時都在門口；近，是時代的性質，不是倒數的秒數。</p><p><strong>難處：</strong>如果「近」只是時代性質，讀者可能會覺得它不再迫切，把「近了」讀成「反正還早」；這一說必須同時保住「隨時」的警醒。</p>"],["迫近說：主隨時可能再來，每一代都要預備好","","<p>這一說強調「近」是真實的時間上的近：主可能在任何一天再來，所以每一代信徒都要活在預備好的狀態裡。雅各也說「主來的日子近了」（雅 5:8），這是整個初代教會的共同呼吸。</p><p><strong>難處：</strong>這一說若推得太過，很容易變成算日子、把時事對號入座；歷史上多次預言某年主再來，落空後讓許多人跌倒，也讓外人嘲笑教會。</p>"],["使徒誤判說：初代教會以為主很快就來，結果錯了","","<p>部分學者認為，彼得和初代教會真的以為主會在他們有生之年回來，「近了」是一個沒有應驗的期待，後來的書信才慢慢調整。這一說誠實面對了兩千年的距離。</p><p><strong>難處：</strong>新約自己已經回應了這個問題：主不是耽延，「乃是寬容你們，不願有一人沉淪，乃願人人都悔改」（彼後 3:9）；耶穌也說日子時辰「沒有人知道」。說使徒「錯了」，是把一個關於盼望的宣告讀成一張時間表。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採時代性質說，並保住迫近說的警醒：基督復活以後，歷史已經進入最後一章，主隨時可能再來；所以不算日子，不把今天的戰爭、疫情、新聞對號入座。</strong></p><p>彼得自己示範了怎樣讀「近了」：不是囤糧、不是辭職，是頭腦清醒、警醒禱告、彼此切實相愛。主再來與「近了」的全卷立場，回指帖撒羅尼迦前書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：主必再來，結局在神手裡，信徒要警醒；爭的是「近」字的時間意涵。</p><p>兩千年的等待，不是神忘了，是神還在等人回頭。你今天能做的，不是猜那一天，是讓那一天無論甚麼時候來，都看見你正在愛人、正在禱告。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：基督復活以後歷史已進入最後一章，主隨時可能再來；不算日子、不把時事對號入座，「近了」叫人謹慎自守、警醒禱告、彼此相愛。主再來的立場回指帖撒羅尼迦前書立場二；本講義的全卷立場見 ISS00_9。","care":"會眾席上有被末日影片嚇到睡不著的長輩、有焦慮症的年輕人，也有被「主快來了」講到不敢規劃未來、不敢結婚生子的人。不要用末日製造恐慌，也不要嘲笑認真等候的人；陪焦慮的人回到 4:7 後面那幾個動詞——禱告、相愛、款待，必要時鼓勵他尋求醫療與心理協助。也要提醒：照常工作、讀書、成家，正是等候主的方式。"},{"id":"ISS04_5","t":"4:8「愛能遮掩許多的罪」——教會遇到侵害事件，要遮掩嗎？","r":"4:8；箴 10:12；雅 5:20；太 18:15--17","ch":[4],"why":"4:8 是全章最溫柔的一句，也是最常被濫用的一句。教會裡發生性侵、家暴、傷害孩子、挪用奉獻時，常有人說「愛能遮掩許多的罪」，要受害者安靜、私下了結，以免「羞辱主名」。這一題直接關係到受害者能不能被保護、教會是不是一個安全的地方，是本卷紅線七的核心。","pos":[["【一】經文問的是甚麼","","<p>原文 ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν，「愛遮蓋許多的罪」，引自箴 10:12。和合本箴言作「愛能遮掩一切過錯」（箴 10:12），彼得前書作「許多的罪」——這是兩個版本，彼得的字句接近七十士譯本一系的讀法。前後文是一群天天見面、彼此虧欠的寄居者：結局近了，在一切之先要彼此切實相愛。問題是：「遮掩」是甚麼意思？遮的是誰的罪、向誰遮、遮到甚麼程度？</p>"],["私下處理說：為了教會的名聲與當事人的悔改，事情不外傳","","<p>這一說認為，教會內的過犯應當照太 18:15 先「指出他的錯來」，私下處理，不張揚；既然愛能遮掩，就不要讓外人知道、不要報警、不要讓主的名受羞辱。不少教會出於好意這樣做，想保護當事人和教會。</p><p><strong>難處：</strong>太 18:15 處理的是弟兄之間的得罪，不是權力不對等的侵害；性侵、家暴、傷害孩子同時是罪行，受害者與加害者不在同一個位置上。私下處理常常讓加害者繼續傷人，讓受害者被二次傷害；真正羞辱主名的，是掩蓋，不是揭露。</p>"],["全部公開說：一切罪都要攤在陽光下","","<p>另一個極端是，為了避免掩蓋，凡是教會裡發生的過犯都要公開，甚至在群組、網路上指名道姓。這一說的動機是正直，也回應了許多教會曾經隱瞞的歷史。</p><p><strong>難處：</strong>這樣做會忽略受害者的隱私與意願，也把已經認罪、悔改、處理完畢的私人過犯一再翻出來，正好違反 4:8 真正要說的事——愛不揭人的瘡疤。公開也需要程序，不是每一件事都要由群眾審判。</p>"],["區分說：遮掩已悔改的過犯，揭露正在傷人的侵害","","<p>這一說把兩種情況分開：在日常彼此虧欠的群體裡，愛不一再翻舊帳，不把一次跌倒變成一輩子的標籤，這是 4:8 與雅 5:20「叫一個罪人從迷路上轉回……並且遮蓋許多的罪」的意思；但侵害、罪行與濫權，必須保護受害者、通報、依法處理，讓該負責的人負責。</p><p><strong>難處：</strong>實際上兩者的界線有時不容易判斷，需要教會事先有清楚的程序與外部專業協助，不能只靠當下幾位同工的感覺。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採區分說：4:8 的遮掩是不揭人的瘡疤、不一再翻出已悔改的過犯，不是隱瞞侵害、不讓受害者說話、不讓該負責的人負責。</strong></p><p>遇到侵害，保護受害者、通報、依法處理本身就是愛；愛「不喜歡不義，只喜歡真理」（林前 13:6）。長老、牧養與屬靈權柄的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你對神的信心，卻應該改變我們怎樣做教會。各家都同意：愛不翻舊帳，罪必須被面對。</p><p>如果你曾經在教會裡受過傷害，又被要求「用愛遮掩」，請你知道：那不是 4:8 的意思，也不是神的心意。神站在受欺壓的人那一邊，他的家應當是最安全的地方。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:8 的遮掩是不揭已悔改的瘡疤，不是隱瞞侵害；保護受害者、通報、依法處理本身就是愛。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能就坐著一位受害者，他可能從來沒有說出口，也可能說過卻被叫要「饒恕、遮掩」。不要說「你要用愛遮掩」「這樣會羞辱主名」這種話；先相信他、保護他、陪他找專業協助，依法通報，不要讓他和加害者單獨面對面「和好」。也要為教會建立清楚的保護與通報程序，在事情發生之前就預備好。"},{"id":"ISS04_6","t":"4:10--11「各人要照所得的恩賜彼此服事」——我有甚麼恩賜？","r":"4:9--11；羅 12:6--8；林前 12:4--11","ch":[4],"why":"許多弟兄姊妹做過恩賜測驗，卻還是不知道自己能做甚麼；也有人覺得自己「沒有恩賜」，只能坐在台下。教會裡又常為說方言、預言等恩賜是否延續到今天爭論。4:10 說「各人」都領受了恩賜，這一題關係到每一個人在神家裡有沒有位置，也關係到恩賜是拿來服事還是拿來比較。","pos":[["【一】經文問的是甚麼","","<p>4:10 說 ἕκαστος καθὼς ἔλαβεν χάρισμα，「各人要照所得的恩賜」：每一個人都領受了，而且是「領受」的，不是自己有的。4:11 把恩賜分成兩大類——說話的、服事的；目的只有一個：叫神在凡事上因耶穌基督得榮耀。問題是：我怎樣知道自己有甚麼恩賜？恩賜是一張固定的清單，還是在服事中被看見？超自然的恩賜和天生的才能有甚麼關係？</p>"],["清單辨識說：照新約的恩賜清單，找出自己屬於哪一項","","<p>這一說把羅 12、林前 12、弗 4 和本章的恩賜整理成清單，透過問卷、測驗與輔導，幫助人找出自己的恩賜，再安排到合適的服事。它的好處是具體，讓「我不知道我能做甚麼」的人有一個起點。</p><p><strong>難處：</strong>新約各處的清單都不一樣，沒有一張是完整的；本章只分兩大類，重點不在分類。測驗也容易變成自我認識的工具，結果人更關心「我是哪一型」，而不是「誰需要我服事」。</p>"],["服事中發現說：先動手服事，由群體看見與確認","","<p>這一說認為，恩賜不是先找到才用，而是在「彼此服事」中被發現：你去款待、去探訪、去教孩子，群體會看見神在你身上給了甚麼，並且確認它。4:10 的動詞「服事」和「管家」，本來就是在做的時候才看得出來。</p><p><strong>難處：</strong>如果教會只是缺人就派人，不看人的負擔與限制，有人會被放在不合適的位置上累垮，還以為是自己沒有恩賜；這一說需要牧養者細心的觀察與調整。</p>"],["延續與停止之爭：說方言、預言等恩賜今天還有嗎？","","<p>延續論認為，林前 12--14 的各樣恩賜，包括說方言、預言、醫病，今天仍然賜給教會；停止論認為，這一類記號性的恩賜在使徒時代、新約完成之後就停止了。兩方都在歷史上有敬虔的傳統。</p><p><strong>難處：</strong>延續論若缺少分辨，容易出現誇大與操控；停止論若推得太過，容易對聖靈今天的工作失去期待。兩方的爭論常常讓人忘了 4:10 的重點：恩賜是用來服事人的，不是用來分派系的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的看法：4:10 的重點不是先辨識清楚，而是先承認——每一個人都是管家，手上都有神放的東西；恩賜在彼此服事中被發現，由群體確認，清單與測驗可以當起點。延續與停止之爭本講義不定案，見哥林多前書講義第 12--14 章。</strong></p><p>講道的不比煮飯的高一等；4:11 給說話的人的是約束，給服事的人的是供應。長老與屬靈權柄的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：恩賜是神白白給的，目的是彼此服事、叫神得榮耀；爭的是辨識的方法與某些恩賜的延續。</p><p>如果你覺得自己甚麼都不會，請你從身邊一個具體的人開始：一頓飯、一通電話、一次接送。「所求於管家的，是要他有忠心」（林前 4:2），不是要他很耀眼。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：各人都是神百般恩賜的好管家；恩賜在彼此服事中被發現、由群體確認，目的是叫神因耶穌基督得榮耀；延續與停止之爭不定案。本講義的全卷立場見 ISS00_5、ISS00_9。","care":"會眾席上有覺得自己「沒有恩賜」的長輩、身障者、剛信主的人，也有服事多年卻從來沒被感謝的幕後同工。不要只在講台上表揚看得見的恩賜，也不要用「你沒有某種恩賜就是不夠屬靈」去比較人；陪覺得自己沒用的人找到一件小事開始，並公開感謝那些在廚房、停車場、育嬰室服事的人。"},{"id":"ISS04_7","t":"4:12--13「火煉的試驗……倒要歡喜」——受苦的人一定要表現喜樂嗎？","r":"4:12--14；1:6；羅 12:15","ch":[4],"why":"「倒要歡喜」常被用成一種壓力：生病要笑、喪親不能哭、被裁員要說「感謝主」，否則就是不屬靈。許多受苦的人因此把眼淚藏起來，甚至以為自己的憂鬱是罪。這一題關係到教會能不能成為受苦者可以哭的地方，也是本卷紅線六的核心。","pos":[["【一】經文問的是甚麼","","<p>4:13 說 καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε，「照著你們有分於基督的苦難，就歡喜吧」；接著說「使你們在他榮耀顯現的時候，也可以歡喜快樂」。現在的歡喜，連著將來的歡喜快樂。同一位彼得在 1:6 說「在百般的試煉中暫時憂愁」。問題是：「倒要歡喜」和「暫時憂愁」怎樣並存？歡喜是感覺、是表情，還是別的？</p>"],["喜樂見證說：在苦難中顯出喜樂，是最有力的見證","","<p>這一說強調，使徒被鞭打以後「心裡歡喜，因被算是配為這名受辱」（徒 5:41），信徒在苦難中的喜樂，讓外人看見信仰的真實。許多宣教士與殉道者的見證，也確實帶著令人驚訝的喜樂。</p><p><strong>難處：</strong>這一說若變成要求，就成了表演：受苦的人不能哭，只能笑給別人看；說「你一直難過就是信心不夠」，不是本講義的立場，也違反了 1:6 與整本聖經的哀歌傳統。</p>"],["哀歌說：憂愁、哭泣與訴苦，本身就是信心的語言","","<p>這一說指出，詩篇有大量的哀歌，例如「耶和華啊，你忘記我要到幾時呢？」（詩 13:1）；耶穌在拉撒路墳前也哭了；保羅說「與喜樂的人要同樂；與哀哭的人要同哭」（羅 12:15）。向神訴苦，正是信靠神的表現。</p><p><strong>難處：</strong>如果只停在哀哭，就可能錯過 4:13 要人抬頭看見的盼望；彼得用的是現在式命令「歡喜吧」，不是只說將來。</p>"],["方向說：歡喜是一個方向，在眼淚裡仍朝向基督","","<p>這一說認為，4:13 的歡喜根據不在處境，而在「與基督一同受苦」與「他榮耀顯現」；它不否定眼淚，而是在眼淚裡仍知道自己在誰手裡。所以人可以同時憂愁又歡喜（林後 6:10 的說法），可以哭著禱告、看醫生、找輔導，同時心是朝著主的。</p><p><strong>難處：</strong>「方向」比較難衡量，有人會藉此把一切情緒都合理化，不再尋求神的安慰；這一說需要群體的陪伴，不是一個人自己判斷。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採方向說：「倒要歡喜」是一個方向，不是一張面具。受苦的人可以憂愁、可以哭、可以訴苦，也可以看醫生、做心理諮商；歡喜不是把眼淚藏起來，是在眼淚裡仍朝向那位與我們一同受苦的基督。</strong></p><p>本講義不說憂鬱或焦慮是信心不足的證據。受苦的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：基督與受苦的人同在，將來的榮耀必定顯現；爭的是「歡喜」要怎樣在今天的苦裡活出來。</p><p>如果你今天笑不出來，請你知道：神沒有要你演給誰看。你可以帶著眼淚來，榮耀的靈仍然歇在你身上（4:14）。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：「倒要歡喜」是一個方向，不是一張面具；受苦的人可以憂愁、可以哭、可以求助，歡喜是在眼淚裡仍朝向基督。本講義的全卷立場見 ISS00_2。","care":"會眾席上有正在憂鬱、焦慮的人，有剛失去孩子的父母，有長期病痛的弟兄姊妹；他們最怕聽到「你要喜樂啊」。不要催人笑，不要把情緒困擾說成屬靈問題；先陪他坐著、同哭，再在合適的時候一起看那將要顯現的榮耀。需要時，溫柔地鼓勵他就醫、接受心理諮商，並讓他知道這不是信心的失敗。"},{"id":"ISS04_8","t":"4:15「好管閒事」——關心與插手的分別在哪裡？","r":"4:15--16；2:25；5:2；帖後 3:11","ch":[4],"why":"彼得把「好管閒事」和殺人、偷竊、作惡放在同一張清單裡，讀者常常嚇一跳。教會裡的「關心」有時變成打探、轉傳、干涉別人的家務事；反過來，也有人用「不要管閒事」為不伸手、不出聲找理由，連看見家暴、霸凌也不管。這一題關係到群體怎樣彼此照顧，又不越界。","pos":[["【一】經文問的是甚麼","","<p>原文 ἀλλοτριεπίσκοπος，由「別人的」和「監督」組成，現存希臘文獻首見，意思不完全確定。它和 2:25「靈魂的牧人監督」、5:2「照管」同一個字根：一種監督是被託付的照顧，一種是越界的插手。問題是：彼得說的究竟是哪一種行為？為甚麼它會讓信徒「受苦」？</p>"],["好管閒事說：越界干涉別人的事","","<p>和合本與多數譯本採這個意思：插手不屬於自己的事，對別人的生活指指點點。保羅也說有人「反倒專管閒事」（帖後 3:11）。熱心過頭的信徒去管同事、鄰居怎樣過日子，招來厭惡，這不是為主受苦，是自己惹來的。</p><p><strong>難處：</strong>若只是「好管閒事」，放在殺人、偷竊旁邊似乎太輕，看起來不像會惹上官司的罪；而且這個讀法容易被濫用，叫人對真實的不公義也袖手旁觀。</p>"],["侵佔說：挪用、侵吞託管給他的別人財物","","<p>部分學者根據字根，認為這個字指「監管別人財物的人」越權挪用，也就是侵佔、盜用託管財物；這樣它和前面的「偷竊、作惡」性質接近，同樣是會被法律追究的行為。</p><p><strong>難處：</strong>這個字在現存文獻首見，沒有足夠的用例證明它專指財務上的侵佔；彼得用 ὡς（如同）把它和前三項分開，似乎刻意標出它是另一類。</p>"],["煽動說：干涉社會秩序、挑動是非的人","","<p>還有一種看法認為，它指熱心過頭、干涉別人家庭與社會秩序的人，例如勸人背棄家族、挑動奴僕反抗主人，讓信徒在外人眼中成了破壞社會的人。這樣的「受苦」不是因為基督的名，而是因為越界的熱心。</p><p><strong>難處：</strong>這讀法需要假設一個經文沒有明說的歷史處境；而且用得不好，也可能讓人把一切對不公義的出聲都當成「煽動」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採和合本的「好管閒事」，理解為越界去監督別人的事；同一個字根提醒我們，照顧與插手只差在有沒有越界。</strong></p><p>可以用三個問題分辨：我有沒有被託付？我是為他的好，還是為我的好奇或控制？我有沒有尊重他的界線與意願？有人正在受傷害、伸手求助時，出聲與協助從來不是管閒事。四種苦的分辨，全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：因自己的過錯或越界而受苦，不是為基督的名受苦；為作基督徒受苦，不要羞恥（4:16）。爭的是這個罕見字的確切範圍。</p><p>對你今天的生活，這一題是一面鏡子：你最近的「關心」，有沒有哪一次其實是插手？你最近的「不管」，有沒有哪一次其實是逃避？爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：「好管閒事」是越界去監督別人的事，照顧與插手只差在有沒有越界；因越界受苦不是為主受苦，但為受傷害的人出聲從來不是管閒事。本講義的全卷立場見 ISS00_2。","care":"會眾席上有被教會「關心」到不敢再來的人——私事在禱告會上被說出來、家務事被長輩指點；也有正在受家暴或霸凌、卻被人說「這是人家的家務事」而沒有人伸手的人。不要在禱告事項裡轉述別人的隱私，也不要用「不要管閒事」推開求助的人；陪他時先問「你希望我怎樣幫你」。"},{"id":"ISS04_9","t":"4:17「審判要從神的家起首」——教會的醜聞是神的審判嗎？","r":"4:17--19；箴 11:31；結 9:6","ch":[4],"why":"每當某間教會爆出醜聞、某位牧者跌倒，就有人引 4:17 說「這是神的審判開始了」，甚至帶著幸災樂禍的口氣。也有人反過來，覺得自己的苦難就是神在審判自己。這一題關係到我們怎樣面對教會的失敗，也關係到受苦的人會不會把火當成神的怒氣。","pos":[["【一】經文問的是甚麼","","<p>原文 ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ，「時候到了，審判要從神的家起首」。上下文是 4:12 的「火煉的試驗」：信徒正在受的苦。4:18 引箴 11:31 的七十士譯本「義人僅僅得救」，和合本箴言作「義人在世尚且受報」（箴 11:31）——兩個版本，都在說義人也要經過火。問題是：這「審判」是甚麼？是懲罰，還是潔淨？</p>"],["潔淨說：神家的審判是煉淨，不是毀滅","","<p>這一說認為，4:17 的審判就是 4:12 的火煉：神先在自己的家裡動工，像煉金的人煉金子，目的是潔淨。這使我們想起以西結書裡審判「從聖所起」（結 9:6），神的家先被察看。對受苦的信徒，這是安慰：你的苦不是被神遺棄，是被神看重。</p><p><strong>難處：</strong>「審判」一字很重，只講「潔淨」可能把它講輕了；4:17 下半句也提到不信從福音的人「將有何等的結局」，審判確實有分辨與定罪的一面。</p>"],["末世審判開始說：末後的審判已經從教會開始","","<p>這一說把 4:17 和 4:7「萬物的結局近了」連起來：末世的審判已經開始，第一站是神的家；信徒現在的受苦，是末世審判的前奏，將來要臨到全世界。這讀法保住了審判的嚴肅。</p><p><strong>難處：</strong>若推得太過，受苦的信徒可能以為自己正在被定罪，與 4:13--14「有福」「榮耀的靈常住」的安慰衝突；彼得說的是同一場火，對信徒是煉，不是滅。</p>"],["事件對號說：某一件教會醜聞就是神的審判","","<p>這一說把具體的事件——某間教會的醜聞、某位牧者的跌倒、某一次分裂——直接指認為 4:17 的應驗。它的動機有時是想催促教會悔改，面對真實的罪。</p><p><strong>難處：</strong>彼得說「先從我們起首」，他把自己算在裡面，這是自省的話，不是給別人的判決書。把事件對號入座，會讓人站在審判官的位置上，忽略受害者需要的是保護與處理，不是一句神學評論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採潔淨說，並保住審判的嚴肅：4:17 是對受苦者的安慰，也是對神家的自省——神先從自己的家動工。本講義不把具體的教會醜聞對號入座成「神的審判」。</strong></p><p>醜聞要面對、要處理、要保護受害者、要讓該負責的人負責；但宣判是神的位置。受苦的全卷立場見 ISS00_2；長老與屬靈權柄的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神是公義的，他的家要先被潔淨；那照神旨意受苦的人，可以把靈魂交給信實的造化之主（4:19）。</p><p>如果你因為教會的醜聞而灰心，請你知道：人會跌倒，神的家卻是他自己在修理。如果你以為自己的苦是神的怒氣，請你再讀 4:14：神榮耀的靈常住在你身上。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:17 的審判是神先潔淨自己的家，是對受苦者的安慰與對教會的自省；不把具體的醜聞對號入座成「神的審判」。本講義的全卷立場見 ISS00_2、ISS00_5。","care":"會眾席上可能有在醜聞中受傷的人——受害者、受牽連的家屬、被背叛的會友，也有因此離開教會的人。不要在講台上評論別的教會的醜聞，更不要幸災樂禍；先問受傷的人需要甚麼保護與陪伴，也讓自己的教會先自省。對以為自己正在被神懲罰的受苦者，要溫柔地帶他回到 4:13--14 的安慰。"},{"id":"ISS05_1","t":"5:1「與我同作長老的人」——彼得是第一任教宗嗎？","r":"5:1；太 16:18--19；約 21:15--17","ch":[5],"why":"天主教會以彼得為第一任羅馬主教，教宗是彼得的繼承人；更正教多半認為彼得是眾使徒的代表，卻沒有傳下一個職位。華人信徒常在家族、同學或婚姻裡遇到天主教的親友，這一題常被問到，也常變成爭吵。5:1 彼得自己怎樣稱呼自己，是這一題最好的入口。","pos":[["【一】經文問的是甚麼","","<p>彼得在信首稱自己是「耶穌基督的使徒彼得」（1:1），到了信末卻說：「我這作長老、作基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人」（5:1）。「同作長老的」原文 συμπρεσβύτερος（sympresbyteros），新約只此一次。問題是：這位主說「我要把我的教會建造在這磐石上」（太 16:18）的彼得，在教會裡是甚麼位置？他有沒有一個可以傳下去的職位？他自己在 5:1 怎樣看待自己的權柄？</p>"],["首席繼承說：彼得是第一任教宗，職位由羅馬主教承接","","<p>天主教的傳統讀法：主對彼得說「你是彼得，我要把我的教會建造在這磐石上」（太 16:18），又把天國的鑰匙交給他；復活的主三次託付他「你餵養我的小羊」（約 21:15）；使徒行傳前半彼得總是第一個發言。早期教會也一致記得彼得晚年在羅馬，5:13 的「巴比倫」多半就是羅馬。這一說看重教會的合一與歷史的延續，也提醒我們彼得在使徒中確實居首。</p><p><strong>難處：</strong>新約沒有一處說彼得的角色要由某一城的主教繼承；彼得自己在 5:1 不說「在你們之上的」，說「同作長老的」；保羅也曾在安提阿「當面抵擋他」（加 2:11）；耶路撒冷大會最後作結論的是雅各（徒 15:13--21）。「教宗」作為普世教會最高職位的制度，是之後幾百年逐步形成的。</p>"],["使徒代表說：彼得居首，但他的角色不能繼承","","<p>多數更正教的讀法：太 16:18 的「磐石」可能是彼得本人，也可能是他認信的「你是基督，是永生神的兒子」（太 16:16）；即使指彼得本人，也是指他作為第一批見證人、教會根基的角色——「被建造在使徒和先知的根基上」（弗 2:20），根基只立一次，不會一代一代重立。這一說守住了基督是教會唯一的頭，也和彼得在 5:1 的自稱相合。</p><p><strong>難處：</strong>若為了反對教宗制，就把彼得在福音書與使徒行傳裡明顯的首席地位講淡，也不公平；而且更正教內部也常有另一種「小教宗」——把某位牧者、某個屬靈領袖的話當成不可問的。反對一個制度，不等於自己沒有同樣的問題。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：彼得在使徒中居首，主確實託付他牧養；但他在 5:1 把自己放在長老的團隊裡，把基督稱為「牧長」（5:4）。本講義不採教宗繼承的讀法，也不在講台上嘲笑或攻擊天主教的弟兄姊妹。</strong></p><p>對本章最重要的，是彼得自己的姿態：使徒稱自己「同作長老的」——235 的 5，團隊。牧者頭上還有牧長；任何人的權柄都是被託付的，不是自己擁有的。這一點對教宗、對牧師、對小組長都一樣（長老與屬靈權柄的全卷立場見 ISS00_5）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。天主教與更正教在這一題上爭論了五百年，兩邊都承認耶穌基督是教會的頭，都承認彼得是主所揀選、所挽回、所託付的使徒。</p><p>對你今天更要緊的，是彼得那個「同」字：在神的家裡，最有份量的勸勉常常不是「我在你之上」，是「我和你一樣」。如果你家裡有天主教的親人，與其爭誰是第一任教宗，不如一起讀 5:1--4，看見那位牧長。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：彼得在使徒中居首，但他在 5:1 自稱「同作長老的」，把基督稱為牧長；本講義不採教宗繼承的讀法，也不攻擊天主教的弟兄姊妹。本講義的全卷立場見 ISS00_5、ISS00_9。","care":"會眾席上可能有從天主教背景信主的人，有與天主教配偶或家人同住的人，也有因信仰不同而在家族裡被誤會的人。不要在講台上嘲笑教宗或天主教的敬虔，也不要讓這一題變成家庭爭吵的彈藥。陪他們看見兩邊共同承認的主，鼓勵他們在家裡先活出 5:5 的謙卑，再用尊重與愛去談信仰。"},{"id":"ISS05_2","t":"5:2--3「也不是轄制所託付你們的」——屬靈虐待長甚麼樣子？","r":"5:2--3；太 20:25--26；約 10:11","ch":[5],"why":"「屬靈虐待」是近年教會不能再迴避的議題：有人被領袖用神的名控制婚姻、工作、金錢與人際，被公開羞辱，被禁止提問，離開時還被說成背叛。5:3 是全本新約對屬靈領袖最具體的一張檢核表，卻也常被只讀成「長老很辛苦，你們要體諒」。這一題要幫助會眾辨認，也幫助領袖自省。","pos":[["【一】經文問的是甚麼","","<p>彼得給長老三組「不是……乃是」：「不是出於勉強，乃是出於甘心；也不是因為貪財，乃是出於樂意」（5:2）；「也不是轄制所託付你們的，乃是作群羊的榜樣」（5:3）。「轄制」原文 κατακυριεύοντες（katakyrieuontes），字面是「在頭上作主」；主耶穌說外邦人的君王操權管束人，「只是在你們中間，不可這樣」（太 20:26）。問題是：甚麼樣的領導已經跨過界線，從牧養變成轄制？誰來判斷？被轄制的人可以怎麼做？</p>"],["秩序優先說：屬靈虐待是少數，不要因噎廢食","","<p>這一說擔心「屬靈虐待」這個詞被濫用：任何一次被糾正、被拒絕、被要求負責，都可能被說成虐待，教會就失去了勸戒與紀律。它引來 13:17「你們要依從那些引導你們的，且要順服」，提醒會眾領袖也是人、也會疲憊，需要被體諒。這一說看見了真實的危險：沒有秩序的教會，同樣會傷害人。</p><p><strong>難處：</strong>若只講秩序，5:3 就被削掉了；彼得用整整兩節講長老「不是」甚麼，正是因為權柄最容易被濫用。而且受害的人常常是最不敢開口的人；把「不要因噎廢食」放在前面，會讓真正被轄制的人更不敢說。</p>"],["受害者優先說：先相信受傷的人，再談秩序","","<p>這一說認為，權力不對等的地方，受傷的人說出來已經付了很大的代價；教會應該先相信、先保護、先調查，而不是先維護領袖的名聲。它也提出具體的辨認記號：以神之名要求無條件服從、不准提問、公開羞辱、控制私人生活與財務、隔離人與家人朋友、把領袖的意見等同神的旨意。這一說最貼近 5:3「在頭上作主」的字義。</p><p><strong>難處：</strong>若把一切衝突都快速貼上「虐待」的標籤，也可能冤枉了盡忠的牧者，讓真正的辨認失去份量；所以需要清楚的程序、獨立的調查與第三方的參與，而不是只靠情緒或網路輿論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：5:3 的「轄制」是真實會發生的罪，不是少數人的想像；辨認它是牧養的一部分。</strong>上面列出的六個記號，任何一個長期出現，都已經不是牧養。遇到這樣的處境，會友可以提問、可以求助、可以離開，不違背 5:5；若涉及暴力、性侵或金錢的不法，要依法求助與通報。</p><p>同時，處理要有程序：讓受傷的人被聽見、被保護，讓被指控的人有說明的機會，由獨立而可信任的人參與。牧者頭上還有牧長（5:4），他們要交帳；長老與屬靈權柄的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你曾經被屬靈權柄傷過，那傷害是真的，而且傷你的是人錯用了權柄，不是那位牧長。他說「我是好牧人；好牧人為羊捨命」（約 10:11）——真正的牧人是為羊捨命，不是叫羊為他捨命。</p><p>你不必因為一位牧者的轄制就離開神；你也不必為了留在神的家，就留在一個轄制你的地方。如果你是帶領人，可以問自己：我是在作榜樣，還是在作主？</p>"]],"con":[],"say":"本講義的立場：5:3 的「轄制」是真實會發生的罪；以神之名要求無條件服從、不准提問、羞辱、控制、隔離、把領袖的話等同神的話，都不是牧養。會友可以提問、求助、離開。本講義的全卷立場見 ISS00_5。","care":"會眾席上一定有被前一間教會的領袖控制、羞辱、要求奉獻或切斷親友關係的人，也可能有正在被誤會、心裡疲憊的牧者。不要說「你要順服屬靈遮蓋」「你離開就是背叛」「這是你自己太敏感」；先讓受傷的人把故事說完，必要時協助他找可信任的屬靈長輩、專業輔導與法律協助。對牧者，提醒他頭上還有牧長，他不必用控制來證明自己。"},{"id":"ISS05_3","t":"5:2「也不是因為貪財」——牧者可以領薪嗎？教會的財務要怎樣透明？","r":"5:2；林前 9:14；林後 8:20--21","ch":[5],"why":"華人教會在錢的事上常有兩個極端：一邊認為牧者應該清貧，談待遇就是貪財；另一邊則有領袖把奉獻當成私人財產，財務從不公開。5:2「也不是因為貪財，乃是出於樂意」兩邊都碰到。這一題關係到牧者的生計、會眾的信任，也關係到教會在社會上的見證。","pos":[["【一】經文問的是甚麼","","<p>「也不是因為貪財，乃是出於樂意」（5:2）。「貪財」原文 αἰσχροκερδῶς（aischrokerdōs），字面是「為了可恥的利益」。彼得禁止的是甚麼？是牧者領取供養本身，還是以利益為服事的動機？教會應該怎樣安排，才能讓牧者得著合理的供養，又讓貪財沒有藏身之處？</p>"],["清貧說：牧者不該在乎待遇，談錢就是貪財","","<p>這一說看重服事的純粹：牧者是為主作工，不是為薪水；許多前輩在極困難的環境中服事，靠信心生活，成了美好的見證。它也擔心教會變成職業場所，牧者變成雇員。5:2 的「不是因為貪財」在這一說裡，就是要牧者不談待遇、不計報酬。</p><p><strong>難處：</strong>新約明說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14），也說「那善於管理教會的長老，當以為配受加倍的敬奉」（提前 5:17）。叫牧者清貧，常常讓牧者家庭長期承受壓力，也逼得牧者私下兼差或接受不透明的「愛心」，反而讓錢的事更不清楚。</p>"],["制度透明說：合理供養，加上公開的財務","","<p>這一說認為，5:2 處理的是動機，教會要處理的是制度：牧者有合理、公開的待遇，不必靠私下的饋贈；奉獻有清楚的帳目、多人經手、定期向會眾報告。保羅處理捐款時說「我們留心行光明的事，不但在主面前，就在人面前也是這樣」（林後 8:21）。這一說保護牧者，也保護會眾。</p><p><strong>難處：</strong>制度再好，也管不住人心；透明也可能變成會眾逐筆檢查、對牧者生活指指點點，讓牧者像被監視的雇員。透明的目的是信任，不是控制，這需要彼此的善意。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：5:2 禁止的是貪財的動機，不是供養；教會當合理供養牧者，也當讓財務清楚透明。</strong>具體的底線：牧者的待遇由同工團隊公開決定；奉獻多人經手、帳目定期向會眾報告；牧者不以屬靈理由要求個人奉獻，不把「為主擺上」當成拒絕說明的理由。</p><p>5:4 也在這裡：長老的報酬有一部分不在今天發放，牧長要親手給那永不衰殘的冠冕。這讓牧者不必用錢證明價值，也讓會眾不必用錢衡量牧者（長老與屬靈權柄的全卷立場見 ISS00_5）。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你曾經看見教會在錢的事上出問題，那讓人失望是真的；但那不是福音的錯，是人違背了 5:2。如果你是牧者家庭，在經濟壓力中服事，請你知道合理的供養不是不屬靈。</p><p>可以問的是：我的教會，錢的事是在光中，還是在暗中？我自己對錢的態度，是出於樂意，還是另有所圖？</p>"]],"con":[],"say":"本講義的立場：5:2 禁止的是貪財的動機，不是供養；教會當合理供養牧者，財務多人經手、定期公開，不以屬靈理由拒絕說明。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有在經濟壓力中服事的牧者與師母，也可能有因為前一間教會的財務醜聞而不再奉獻的人。不要在講台上說「牧師談錢就是不屬靈」，也不要用「奉獻越多越蒙福」要求人。對受過傷的人，承認他的失望，陪他看見一間財務透明的教會是可能的；對牧者家庭，具體關心他們的需要。"},{"id":"ISS05_4","t":"5:5「年幼的，也要順服年長的」——年輕人不可以提出不同意見嗎？","r":"5:5；提前 4:12；3:8","ch":[5],"why":"華人教會的世代張力很真實：年長的同工覺得年輕人不尊重經驗，年輕的同工覺得自己一開口就被說「不順服」。5:5 前半句最常被拿來結案，下半句卻常被漏掉。這一題影響年輕人留不留在教會，也影響年長者能不能被提醒。","pos":[["【一】經文問的是甚麼","","<p>「你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服」（5:5）。「年長的」原文 πρεσβυτέροις（presbyterois），和 5:1 的「長老」是同一個字，可以指年長的人，也可以指教會的長老。問題是：這一節是不是要年輕人在任何事上都不表達意見？「順服」和「提問」能不能並存？下半句的「眾人……彼此」改變了甚麼？</p>"],["長幼有序說：年輕人要先學習尊重，少說話","","<p>這一說看重 5:5 前半句的命令，也看重經驗與傳承：年長者走過的路是寶貴的，年輕人常常看得不夠全面；教會的秩序需要年輕人先學會聆聽、學會在合適的時間與方式說話。這一說也很貼近華人文化對長輩的尊重。</p><p><strong>難處：</strong>它常常只讀前半句；下半句的對象是「你們眾人」，方向是「彼此」，包括剛被勸勉的長老。若把「長幼有序」講成不准提問，就把一句雙向的命令講成單向的，也讓年長者失去被提醒的機會。保羅對年輕的提摩太說「不可叫人小看你年輕」（提前 4:12）——年輕不等於沒有發言權。</p>"],["平等對話說：在基督裡沒有長幼之分，人人都可以說","","<p>這一說強調 5:5 下半句的「彼此順服」，以及 2:9 每一位信徒都是祭司：年輕人與年長者在神面前同樣尊貴，教會的決策應該開放討論、尊重每一個聲音。這一說保護了年輕人，也讓教會更能面對新的世代。</p><p><strong>難處：</strong>若推得太過，就削掉了 5:5 前半句真實的命令：年輕人確實被要求尊重年長者；平等對話若沒有謙卑，也會變成另一種驕傲——年輕人看不起年長者的經驗，把自己的意見當成唯一的進步。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：5:5 前後兩句要一起讀——年輕人要尊重年長者，年長者也要以謙卑束腰；謙卑是長幼雙方的圍裙，不是只綁在年輕人身上的繩子。這一節不可用來壓制年輕人的提問與不同意見。</strong></p><p>具體的作法：年輕人可以提問、可以提出不同意見，方式帶著尊重；年長者要留出時間聽，說明理由，而不是只說「照做就是」。世代的張力用「同心，彼此體恤」（3:8）去處理，不用一句「長幼有序」結案（長老與屬靈權柄的全卷立場見 ISS00_5；順服的界線見 ISS00_3）。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你是年輕人，曾經因為提問被說成「不順服」，請你知道那不是 5:5 的全貌；你的問題在神面前不是悖逆。也請你繫上圍裙：帶著尊重說話，願意聽年長者的故事。</p><p>如果你是年長者，這一節也是寫給你的：「就是你們眾人也都要以謙卑束腰」（5:5）。你能不能說出最近一次，你從一位年輕人身上學到了甚麼？</p>"]],"con":[],"say":"本講義的立場：5:5 前後兩句一起讀——年輕人尊重年長者，年長者也以謙卑束腰，彼此順服；這一節不用來壓制提問與不同意見。本講義的全卷立場見 ISS00_5、ISS00_3。","care":"會眾席上可能有因為提問被冷處理、甚至被拿下服事的年輕同工，也可能有覺得被年輕人看不起、心裡受傷的長輩。不要在講台上用這一節點名任何一方，也不要說「年輕人就是驕傲」或「老一輩就是保守」。陪年輕人學習怎樣帶著尊重說話，陪長輩學習怎樣聽；必要時安排一次兩代同工一起吃飯、一起禱告的時間。"},{"id":"ISS05_5","t":"5:7「將一切的憂慮卸給神」——基督徒還需要看心理諮商嗎？焦慮是不是罪？","r":"5:6--7；1:6；腓 4:6","ch":[5],"why":"「你要把憂慮卸給神」是華人教會最常對焦慮的人說的一句話，卻常被說成「你不應該焦慮」。有人因此不敢承認自己憂鬱、不敢就醫，或在服藥後覺得自己屬靈失敗。這一題關係到受苦的人能不能得到幫助，也關係到教會是不是一個可以說真話的地方。","pos":[["【一】經文問的是甚麼","","<p>「所以，你們要自卑，服在神大能的手下，到了時候，他必叫你們升高。你們要將一切的憂慮卸給神，因為他顧念你們。」（5:6--7）原文 5:6--7 是同一個句子，「卸給」ἐπιρίψαντες（epiripsantes）是分詞，說明怎樣自卑。問題是：「卸給神」是一個禁令（不准再憂慮），還是一個邀請（有了就交給他）？卸給神與看醫生、吃藥、心理諮商有沒有衝突？</p>"],["屬靈處理說：憂慮是信心的問題，要用禱告與信心解決","","<p>這一說引腓 4:6「應當一無掛慮」與太 6:34「所以，不要為明天憂慮」，認為信徒的焦慮多半出於不信，最根本的醫治是悔改、禱告、讀經，把心思意念交給神。這一說看見了一件真實的事：許多憂慮確實與我們想掌控一切有關，5:6--7 也確實把卸下和謙卑連在一起。</p><p><strong>難處：</strong>它把所有的焦慮都講成同一種，忽略了身體、腦部、創傷與環境的因素；也忽略了彼得自己在 1:6 承認讀者「暫時憂愁」，沒有責備他們。把焦慮講成信心問題，會叫已經很痛的人再多背一層罪疚，甚至延誤治療。</p>"],["整全照顧說：卸給神與就醫、諮商並行","","<p>這一說認為，人是神所造的整個人，身體、情緒、心思與靈性彼此相連；焦慮與憂鬱有時需要禱告與群體的陪伴，有時也需要醫生、藥物與專業輔導。保羅勸提摩太「再不要照常喝水，可以稍微用點酒」（提前 5:23），聖經並不排斥身體的照顧。神的顧念，常常就經由醫生、輔導與一位願意陪伴的朋友臨到。</p><p><strong>難處：</strong>若講得太快，也可能把 5:7 的屬靈深度削平，好像信仰只是心理健康的一種輔助；而心理諮商也有不同的世界觀，需要分辨。整全照顧不是用專業取代交託，而是兩者並行。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「卸給神」不是「不可以憂慮」；彼得是說你有憂慮，所以要卸，不是說你不准有。焦慮的人不是罪人，憂鬱與焦慮也不等於信心不夠。卸給神與看醫生、吃藥、心理諮商並行。</strong></p><p>5:6--7 照出的是另一件事：驕傲也會抓住重擔——甚麼都要自己扛、不肯求助，是另一種想代替神。所以承認自己需要幫助、預約醫生、告訴小組，本身就可以是卸給神的一部分。受苦的全卷立場見 ISS00_2；疾病與醫治回指雅各書立場四。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你正在服藥、正在看輔導，請你知道：那不是你屬靈失敗的證據。主耶穌在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38），神的兒子也憂傷過。</p><p>憂慮可能要一次又一次地拋，今天拋上去，明天又撿回來；那不是失敗，是學習。你可以問的是：我是把憂慮藏起來，還是把它帶到那位顧念我的神面前，也讓神所差來的人幫助我？</p>"]],"con":[],"say":"本講義的立場：「卸給神」不是禁令，是邀請——有憂慮，所以交給他；焦慮的人不是罪人，憂鬱與焦慮不等於信心不夠，卸給神與就醫、心理諮商並行。本講義的全卷立場見 ISS00_2。","care":"會眾席上一定有正在焦慮、憂鬱、失眠的人，有正在服藥卻不敢讓教會知道的人，也有家人有精神疾病、自己精疲力盡的照顧者。不要說「你就是信心不夠」「禱告就好，不要吃藥」「卸給神就不會焦慮了」。先聽，再陪；若有失眠、無望或自傷的念頭，會後單獨關心，協助他就醫與尋求專業協助，並讓小組有人固定陪伴。"},{"id":"ISS05_6","t":"5:8「魔鬼，如同吼叫的獅子」——凡事都是魔鬼搞的嗎？基督徒會被鬼附嗎？","r":"5:8--9；雅 4:7；弗 4:27","ch":[5],"why":"華人教會對屬靈爭戰的看法差異很大：有人凡事歸給魔鬼——生病、吵架、塞車都是攻擊；有人幾乎不提魔鬼，好像牠不存在。也常有人問：基督徒會不會被鬼附？這一題影響人怎樣面對自己的責任，也影響受苦的人會不會被嚇到。","pos":[["【一】經文問的是甚麼","","<p>「務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。你們要用堅固的信心抵擋他」（5:8--9）。「仇敵」原文 ἀντίδικος（antidikos）是法庭上的原告。問題是：彼得要人怎樣看待魔鬼？是把一切難處都看成牠的攻擊，還是在承認牠真實的同時，把焦點放在謹守、警醒與信心上？信徒是否可能被魔鬼「吞吃」或附身？</p>"],["全面爭戰說：魔鬼在一切事上作工，要不斷趕逐、宣告","","<p>這一說認真看待屬靈世界：魔鬼真實存在，四處尋找人；許多疾病、家庭衝突、成癮背後可能有屬靈的權勢，信徒要警醒、禱告、奉主名抵擋。有些傳統也認為信徒可能在某些範圍被鬼「壓制」或「轄制」，需要釋放的服事。這一說提醒教會不要把屬靈世界講成神話。</p><p><strong>難處：</strong>凡事都歸給魔鬼，人就不必省察自己的罪與選擇，也可能延誤就醫；把憂鬱、精神疾病講成鬼附，對受苦的人是很重的傷害。彼得在 5:8 之前先講的是謙卑與卸下，之後是神的成全，他並沒有教一套趕鬼的方法。</p>"],["淡化說：魔鬼只是惡的象徵，不必多談","","<p>另一說受現代世界觀影響，認為魔鬼是聖經作者描述惡勢力的象徵語言；講台不必多談，專心講倫理、關係與社會關懷。這一說避免了迷信與恐嚇，也提醒人為自己的行為負責。</p><p><strong>難處：</strong>彼得用了一個很具體的字：仇敵、原告、吼叫的獅子；主耶穌也真實地面對過試探者。把魔鬼講成象徵，就削掉了 5:8 的警告，也讓人在真實的屬靈試探中不知道要警醒。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：魔鬼是真實的仇敵，但不是凡事都是魔鬼搞的；彼得寫獅子，是要人清醒，不是要人害怕。</strong>次序很重要：先以謙卑束腰、先把憂慮卸給神，然後才「用堅固的信心抵擋他」（5:9）；兩節之後是「必要親自成全你們」（5:10）。基督已經得勝，一切都服從了他（3:22）。</p><p>信徒是否可能被鬼附，各傳統說法不一；本講義不在講台上定案，只確認一件事：屬基督的人是神的產業，「也不可給魔鬼留地步」（弗 4:27）。精神疾病、憂鬱與焦慮要就醫，不可直接歸為鬼附。屬靈爭戰回指以弗所書立場四。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你更害怕。吼叫的聲音很大，但最後一句話不是獅子說的。「務要抵擋魔鬼，魔鬼就必離開你們逃跑了」（雅 4:7）——信徒不是在等著被吞吃，而是在神大能的手下站穩。</p><p>你可以問的是：我是把責任都推給魔鬼，還是在警醒中也省察自己？我是更怕那隻獅子，還是更認識那位成全我的神？</p>"]],"con":[],"say":"本講義的立場：魔鬼是真實的仇敵，但不是凡事都是魔鬼搞的；彼得寫獅子是要人清醒，不是要人害怕，次序是先謙卑、先卸下，再抵擋，然後是神親自成全。精神疾病不可直接歸為鬼附。屬靈爭戰回指以弗所書立場四。","care":"會眾席上可能有曾被說成「被鬼附」的憂鬱症患者，有害怕屬靈攻擊、夜裡睡不著的人，也有家人有精神疾病的照顧者。不要用魔鬼嚇人，也不要隨意替人「診斷」屬靈原因。對害怕的人，帶他讀 5:10；對有精神疾病的人與家屬，協助就醫，並讓群體陪伴，不要讓他們因為這一題被孤立。"},{"id":"ISS05_7","t":"5:9「在世上的眾弟兄也是經歷這樣的苦難」——我們怎樣記念受逼迫的教會？","r":"5:9--10；來 13:3；林前 12:26","ch":[5],"why":"今天世界上仍有許多信徒因信仰被監禁、失業、被家族驅逐；同時，在自由社會的信徒卻常常覺得那很遠。也有人把自己被同事嘲笑、被家人反對，說成和受監禁的人一樣的逼迫。5:9 把一個地方的苦難放進「在世上的眾弟兄」裡，這一題要問：我們怎樣記念，又怎樣不誇大、不比較？","pos":[["【一】經文問的是甚麼","","<p>「你們要用堅固的信心抵擋他，因為知道你們在世上的眾弟兄也是經歷這樣的苦難。」（5:9）「眾弟兄」原文 ἀδελφότητι（adelphotēti），是一個集體名詞：弟兄的團體。接著是「等你們暫受苦難之後，必要親自成全你們」（5:10）。問題是：彼得提起眾弟兄的苦難，是要做甚麼？是安慰、是比較，還是呼召？今天的教會怎樣活出這一節？</p>"],["行動倡議說：記念就是發聲、捐助與倡議","","<p>這一說認為，記念受逼迫的教會不能只停在禱告：要了解實況、捐助家屬、支持法律援助、在合適的管道為信仰自由發聲。「你們要記念被捆綁的人，好像與他們同受捆綁」（來 13:3）——好像自己也在那裡。這一說讓記念有手有腳。</p><p><strong>難處：</strong>若不謹慎，倡議可能變成講台上的政治動員，或把複雜的處境簡化成「好人與壞人」；公開發聲有時也可能讓當地的弟兄姊妹更危險。記念需要智慧，也需要聽當地信徒自己怎麼說。</p>"],["屬靈團契說：記念主要是禱告與彼此的認同","","<p>這一說強調 5:9 的重點在「知道」：知道自己不是一個人，知道全世界的教會是一個身體——「若一個肢體受苦，所有的肢體就一同受苦」（林前 12:26）。記念的核心是禱告、代求，以及在自己的處境裡同樣忠心。這一說保護了記念不被政治化，也讓每一間小教會都能參與。</p><p><strong>難處：</strong>若只停在禱告，記念可能變得抽象，一年提一次就忘了；也可能讓自由社會的信徒不必付任何代價，就覺得自己已經盡了責任。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：5:9 提起眾弟兄，首先是安慰——你不是一個人在受苦；其次是呼召——我們也要記念別人的苦。記念要有禱告，也可以有具體的行動；但不在講台上作政治動員，不點名政黨或政治人物，並以當地信徒的安全為先。</strong></p><p>同時，不用別人更大的苦去堵住身邊人的眼淚；被同事嘲笑、被家人反對的苦也是真的，雖然不必說成和受監禁一樣。受苦的全卷立場見 ISS00_2；寄居的處境見 ISS00_1。國度321空中團契散在各國，正是 5:9 的一個縮影：不同的時區，同一位成全的神。</p>"],["【四】這件事該不該影響你的信心","","<p>知道別人在受苦，不是叫你覺得自己的苦不算數，而是叫你知道：這條路有很多人一起走，而且路的盡頭是「親自成全」（5:10）。</p><p>你可以問的是：這一週，我能為哪一間教會、哪一位在困難中的弟兄姊妹，說出名字禱告？我能不能在自己的處境裡，也站得穩一點？</p>"]],"con":[],"say":"本講義的立場：5:9 提起眾弟兄，是安慰也是呼召——你不是一個人在受苦，我們也要記念別人的苦；記念有禱告也有行動，但不作政治動員，以當地信徒的安全為先，也不拿別人的苦比較。本講義的全卷立場見 ISS00_2、ISS00_1。","care":"會眾席上可能有來自受限制地區、家人仍在那裡的弟兄姊妹，他們聽到相關的話題會擔心家人的安全；也可能有在家族裡因信仰被排擠、覺得自己的苦不被承認的人。不要在講台上公開可能危及當地信徒的細節，也不要說「你這點苦算甚麼」。對前者，私下關心、一起禱告；對後者，承認他的苦，也帶他看見眾弟兄與他同行。"},{"id":"ISS05_8","t":"5:12「託……西拉」——西拉是代筆人嗎？","r":"5:12；徒 15:22；帖前 1:1","ch":[5],"why":"彼得前書的希臘文相當精煉，有學者因此懷疑一位加利利漁夫能否寫出這樣的文字，進而主張託名說；也有人用 5:12「託西拉」解釋：西拉協助執筆。這一題牽動全卷作者的問題，也牽動我們怎樣看待聖經的成書——神是否透過同工的手寫下他的話。","pos":[["【一】經文問的是甚麼","","<p>「我略略地寫了這信，託我所看為忠心的兄弟西拉轉交你們」（5:12）。原文 Διὰ Σιλουανοῦ（Dia Silouanou），διά 加屬格，可以指送信的人，也可以指替人執筆、整理文字的人。西拉就是使徒行傳裡被耶路撒冷大會差派的人（徒 15:22），後來與保羅同工，也是羅馬公民。問題是：西拉在這封信裡的角色是甚麼？這會不會影響「彼得說」的可信度？</p>"],["送信人說：西拉負責把信帶到五個地區","","<p>這一說指出，新約和其他古代書信中，「藉著某人寫」常常是指送信的人；伊格那丟的書信就有這樣的用法。五個地區路途遙遠，需要一位可信任、又能解說信件內容的人親自送達；西拉曾經為耶路撒冷大會送信到安提阿（徒 15:22--23），正是有經驗的送信人。和合本「轉交你們」也照這個讀法。</p><p><strong>難處：</strong>送信人說沒有解釋這封信精煉的希臘文從哪裡來；而且 διά 在某些例子裡確實指協助寫作的人，送信人說不能排除西拉也參與了文字。</p>"],["代筆人說：西拉協助彼得把信寫成","","<p>這一說認為，古代書信常由秘書（書記）協助，作者口述或提供內容，秘書整理成文；保羅的書信也有代筆人（羅 16:22）。西拉通曉希臘文、熟悉保羅的用語，若由他協助，就可以解釋這封信的文字風格，以及與保羅書信相近的地方。內容仍是彼得的，文字有同工的手。</p><p><strong>難處：</strong>經文沒有明說西拉代筆；也有人指出，一位多年在各地傳道的使徒，未必寫不出好的希臘文。代筆人說若講過頭，可能讓人以為這封信是西拉的作品，削弱了彼得作為見證人的份量。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是使徒彼得；「託西拉」送信人與執筆人兩讀並陳，不定案。無論哪一讀，信的內容都是彼得的見證，本講義照樣寫「彼得說」。</strong>託名說與作者問題的全卷立場見 ISS00_6。</p><p>本章值得注意的是另一件事：一位曾經與保羅同工的人，此刻在彼得身邊；彼得稱他「我所看為忠心的兄弟」。使徒之間沒有陣營，只有同一位主——這也是 5:5「彼此順服」在同工之間的樣子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。神的話透過人的手寫成，從來不只一位人參與：先知有書記，保羅有代筆人，路加查考了許多見證。神使用同工的手，不減少他話語的權威。</p><p>你可以問的是：我是不是也願意作一位「忠心的兄弟」，替別人把好消息送到遠方，而不在意自己的名字有沒有被寫在最前面？爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：作者是使徒彼得；5:12「託西拉」送信人與執筆人兩讀並陳，不定案，無論哪一讀都不影響「彼得說」。本講義的全卷立場見 ISS00_6、ISS00_9。","care":"會眾席上可能有讀過神學院、被作者問題困擾的學生，也可能有覺得「學者質疑聖經」就很害怕的長輩。不要在講台上把學術討論講成對信仰的攻擊，也不要嘲笑提問的人。陪學生看見這些問題有忠實的答案，陪長輩看見神使用同工的手，不減少他話語的權威。"},{"id":"ISS05_9","t":"5:13「巴比倫」——指羅馬嗎？今天的巴比倫在哪裡？","r":"5:13--14；啟 18:2；耶 29:7","ch":[5],"why":"「巴比倫」是華人教會末世講道最常被套用的詞，常被拿來指某個國家、某個宗派、某個城市，甚至某個政黨。5:13 卻只是一句平常的問安，而且說巴比倫城裡有一間「同蒙揀選的教會」。這一題要保護會眾不被對號入座帶走，也幫助住在「巴比倫」裡的信徒知道怎樣生活。","pos":[["【一】經文問的是甚麼","","<p>「在巴比倫與你們同蒙揀選的教會問你們安。我兒子馬可也問你們安。」（5:13）「同蒙揀選的」原文 συνεκλεκτὴ（syneklektē），新約只此一次，接回 1:1 的「被揀選」。問題是：彼得寫的「巴比倫」是哪裡？為甚麼這樣稱呼？今天我們可以把巴比倫套在哪一個國家或組織身上嗎？住在「巴比倫」的信徒應該怎樣生活？</p>"],["代稱說：巴比倫是羅馬，今天泛指與神為敵的世界體系","","<p>多數學者認為巴比倫是羅馬的代稱：早期教會一致記得彼得晚年在羅馬，啟示錄也用巴比倫稱那座大城——「巴比倫大城傾倒了！」（啟 18:2）。延伸到今天，有人認為巴比倫象徵一切與神為敵、以權力與財富為神的世界體系，存在於每一個社會裡。這一說讓 5:13 與全卷「寄居」的主題相合：帝國的首都，正是流亡之地的名字。</p><p><strong>難處：</strong>彼得寫信時這個代稱是否已通行，學者有討論；而「今天的巴比倫」若從「世界體系」再往前一步，就很容易變成指名某一個國家或宗派——那已經超出經文。</p>"],["對號入座說：巴比倫就是今天某個特定的國家或宗派","","<p>另一種在華人教會流傳很廣的講法，把巴比倫（特別是啟示錄的大巴比倫）直接對應到今天的某個國家、某個城市、某個宗派或組織，並用新聞事件印證。這一說的優點是讓人覺得預言很近、很真實，也提醒信徒不要愛世界。</p><p><strong>難處：</strong>每一代都有人這樣對號入座，指的對象一換再換，每一次都落空；它讓住在那些地方的弟兄姊妹被看成敵人，也讓講台變成政治評論。而 5:13 本身，正說明巴比倫城裡有一間蒙揀選的教會——神在那裡有他的子民。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：5:13 的巴比倫採羅馬的代稱，並陳美索不達米亞與埃及要塞兩說；不把巴比倫對號入座到今天的任何國家、城市、宗派或組織，也不在講台上作政治評論或點名政黨。</strong>全卷立場見 ISS00_7。</p><p>本章多出來的一筆是：巴比倫城裡也有教會。被擄的百姓曾被吩咐「我所使你們被擄到的那城，你們要為那城求平安」（耶 29:7）；彼得叫信徒在其中品行端正、彼此相愛、在恩上站立得住（5:12）。神國的領土不必先有一塊地，它先是一群人；全信最後一句是「願平安歸與你們凡在基督裡的人」（5:14）——寄居的人真正的地址是「在基督裡」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。巴比倫是哪裡，不改變信的內容，也不改變那位在巴比倫城裡建造教會的主。</p><p>你可以問的是：我是在研究「誰是巴比倫」，還是在學習怎樣在自己所住的城裡，作一個寄居、蒙揀選、為那城求平安的人？把巴比倫套在別人身上很容易；在自己的城裡站在恩上，才是這封信要的。</p>"]],"con":[],"say":"本講義的立場：5:13 的巴比倫採羅馬的代稱，並陳另兩說；不對號入座到今天的任何國家、城市、宗派或組織，也不作政治評論；巴比倫城裡也有同蒙揀選的教會。本講義的全卷立場見 ISS00_7。","care":"會眾席上可能有熱衷末世解經、把新聞與預言對號入座的人，有被這類講法嚇得睡不著的人，也有正住在被別人稱為「巴比倫」的國家裡、天天為那城求平安的弟兄姊妹。不要說「你住的地方就是巴比倫」；對熱衷的人，溫和地把他帶回經文本身；對害怕的人，帶他讀 5:10 與 5:14——結局是神親自成全，不是恐慌。"}],"terrain":{"points":[[0.6,90,3,"藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望","top"],[0.72,34,6,"在百般的試煉中暫時憂愁","bot"],[1.24,88,19,"乃是憑著基督的寶血",null],[1.64,26,4,"固然是被人所棄的","bot"],[1.84,94,9,"惟有你們是被揀選的族類，是有君尊的祭司","top"],[2.44,86,24,"因他受的鞭傷，你們便得了醫治",null],[3.114,28,14,"不要怕人的威嚇，也不要驚慌","bot"],[3.295,96,18,"義的代替不義的，為要引我們到神面前","top"],[3.684,18,4,"見你們不與他們同奔那放蕩無度的路，就以為怪，毀謗你們","bot"],[4.105,30,12,"有火煉的試驗臨到你們",null],[4.211,90,14,"因為神榮耀的靈常住在你們身上","top"],[4.964,84,7,"因為他顧念你們",null],[5.036,8,8,"你們的仇敵魔鬼，如同吼叫的獅子","bot"],[5.179,98,10,"必要親自成全你們，堅固你們，賜力量給你們","top"]]},"tracks":[{"gk":"πάσχω／πάθημα ↔ δόξα","tr":"paschō / pathēma ↔ doxa","gl":"受苦、苦難 ↔ 榮耀、歸榮耀","code":"G3958","root":"πάσχω——受苦、遭受（全本新約 42 次，彼得前書佔 12 次）；πάθημα——苦難；δόξα——榮耀；δοξάζω——歸榮耀。全卷的公式在 1:11：「基督受苦難，後來得榮耀」——兩個字並列，而且有次序。約翰福音已立 δόξα；本卷追的是這一對字的次序","ins":"這一對字是彼得前書的公式。第一站，榮耀先給了我們被試驗的信心：「可以在耶穌基督顯現的時候得著稱讚、榮耀、尊貴」（1:7）。1:11 公式第一次出現，而且有次序：「預先證明基督受苦難，後來得榮耀」——當年說「萬不可如此」的彼得，現在把這句話放在全卷最前面。1:24 是第一個翻轉：人的「榮耀」會枯萎，「他的美榮都像草上的花」。受苦先落在寄居的人身上，落在家僕身上：「但你們若因行善受苦，能忍耐」（2:20）；下一節同一個字轉到基督身上：「因基督也為你們受過苦」（2:21）——全卷的樞紐。3:14「你們就是為義受苦，也是有福的」；3:18 說他的受苦只有「一次」，是唯一的，我們的受苦是跟隨的。4:1 受苦變成一種心志、一件兵器。4:13 是頂點，公式變成我們的：「你們是與基督一同受苦」；4:14 是第三個翻轉，榮耀不只在將來，受辱罵的此刻，「神榮耀的靈常住在你們身上」。4:16 受苦與榮耀落在同一節：「若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給神」。5:1 彼得把自己放進公式裡；5:4 牧長要給「永不衰殘的榮耀冠冕」。最後一站把公式說完：「得享他永遠的榮耀，等你們暫受苦難之後」（5:10）——受苦是一點點，榮耀是永遠。失敗與受苦不是終點，是那條路的前半段。","stops":[["1:7","可以在耶穌基督顯現的時候得著稱讚、榮耀、尊貴",""],["1:11","預先證明基督受苦難，後來得榮耀","top"],["1:24","他的美榮都像草上的花","bot"],["2:20","但你們若因行善受苦，能忍耐",""],["2:21","因基督也為你們受過苦","top"],["3:14","你們就是為義受苦，也是有福的",""],["3:18","因基督也曾一次為罪受苦",""],["4:1","基督既在肉身受苦，你們也當將這樣的心志作為兵器",""],["4:13","你們是與基督一同受苦","top"],["4:14","因為神榮耀的靈常住在你們身上",""],["4:16","若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給神",""],["5:1","作基督受苦的見證、同享後來所要顯現之榮耀的",""],["5:4","你們必得那永不衰殘的榮耀冠冕",""],["5:10","得享他永遠的榮耀，等你們暫受苦難之後","top"]]},{"gk":"ὑπακοή／ὑποτάσσω ↔ ἀπειθέω","tr":"hypakoē / hypotassō ↔ apeitheō","gl":"順服、順命、順從、聽從、服從 ↔ 不順從、不信從","code":"G5293","root":"ὑπακοή——聽從（ὑπό「在下」＋ἀκούω「聽」：在下面聽）；ὑποτάσσω——排在下面、順服；ἀπειθέω——不被說服、不順從。彼得前書的順服從基督開始，到「彼此」結束","ins":"全卷第一個「順服」的對象是基督，而且是揀選的目的：「以致順服耶穌基督」（1:2）。順服是一個家族特徵：「你們既作順命的兒女」（1:14）；順服的對象是真理：「你們既因順從真理，潔淨了自己的心」（1:22）。2:8 反面第一次出現：「他們既不順從，就在道理上絆跌」。2:13 是第一個翻轉，順服從對神轉到對人的制度，理由卻仍是主：「你們為主的緣故，要順服人的一切制度」。然後是家僕（2:18）、妻子（3:1、5）——3:1 同一節裡兩個字並列：順服的妻子，不信從的丈夫；她在最重要的事上，信了丈夫不信的主。3:6 撒拉「聽從」亞伯拉罕，下半節卻說「不因恐嚇而害怕」。3:20 挪亞的日子「不信從的人」。3:22 是頂點：這個字最後一次換了主詞——「眾天使和有權柄的，並有能力的，都服從了他」；真正的王已經坐在寶座上，所以我們能夠不用惡來奪回權力。4:17 再提「不信從神福音的人」。終點在 5:5：「彼此順服」——順服最後變成雙向的。順服不是被壓在下面，是自己選擇回到本位；回到本位，不是留在被傷害的位置上。","stops":[["1:2","以致順服耶穌基督","top"],["1:14","你們既作順命的兒女",""],["1:22","你們既因順從真理，潔淨了自己的心",""],["2:8","他們既不順從，就在道理上絆跌","bot"],["2:13","你們為主的緣故，要順服人的一切制度",""],["2:18","凡事要存敬畏的心順服主人",""],["3:1","你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫",""],["3:5","順服自己的丈夫",""],["3:6","就如撒拉聽從亞伯拉罕",""],["3:20","不信從的人","bot"],["3:22","眾天使和有權柄的，並有能力的，都服從了他","top"],["4:17","那不信從神福音的人將有何等的結局呢",""],["5:5","你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服","top"]]},{"gk":"ἀγαθοποιέω／ἀγαθός ↔ κακοποιός／κακός","tr":"agathopoieō / agathos ↔ kakopoios / kakos","gl":"行善、為善、好 ↔ 作惡、惡","code":"G0015","root":"ἀγαθοποιέω——行善（新約九次，彼得前書佔四次）；ἀγαθοποιΐα——為善（新約只此一次，4:19）；ἀγαθός、καλός——好的；κακοποιός——作惡的；κακός——惡。行善從一個回答，變成一個代價，最後變成一種交託","ins":"第一站，寄居的人被稱為「作惡的」，回應是「好行為」：「因看見你們的好行為」（2:12）。制度的本分是賞善罰惡：「或是君王所派罰惡賞善的臣宰」（2:14）；行善是一個回答：「因為神的旨意原是要你們行善」（2:15），可以堵住糊塗人的口。2:20 是第一個翻轉：行善不一定得賞，有時得到的是苦——「但你們若因行善受苦，能忍耐，這在神看是可喜愛的」。3:6 敬畏神的妻子「若行善，不因恐嚇而害怕」。3:9 是全章的總綱：「不以惡報惡」——惡不可以換惡。3:11 引詩篇：「也要離惡行善」；3:13「你們若是熱心行善，有誰害你們呢」；3:16 存無虧的良心，「在基督裡有好品行」。3:17 是第二個翻轉，同一個「神的旨意」，在 2:15 叫你行善堵住人的口，在這裡叫你因行善受苦：「總強如因行惡受苦」。4:15 是分辨：受苦本身不是美德，「你們中間卻不可有人因為殺人、偷竊、作惡」而受苦。終點在 4:19：「那照神旨意受苦的人要一心為善」，把自己交給信實的造化之主——受苦的時候不停止行善，就是把結局交給神。","stops":[["2:12","因看見你們的好行為",""],["2:14","或是君王所派罰惡賞善的臣宰",""],["2:15","因為神的旨意原是要你們行善",""],["2:20","但你們若因行善受苦，能忍耐，這在神看是可喜愛的","top"],["3:6","你們若行善，不因恐嚇而害怕",""],["3:9","不以惡報惡","top"],["3:11","也要離惡行善",""],["3:13","你們若是熱心行善，有誰害你們呢",""],["3:16","在基督裡有好品行",""],["3:17","神的旨意若是叫你們因行善受苦，總強如因行惡受苦",""],["4:15","你們中間卻不可有人因為殺人、偷竊、作惡","bot"],["4:19","那照神旨意受苦的人要一心為善","top"]]},{"gk":"ἐκλεκτός ＋ καλέω","tr":"eklektos + kaleō","gl":"揀選、同蒙揀選、召","code":"G1588","root":"ἐκλεκτός——被揀選的（ἐκ「出來」＋λέγω「挑」：被挑出來的）；συνεκλεκτός——同蒙揀選的（新約只此一次，5:13）；καλέω——呼叫、召。揀選是一個身分，呼召是一個方向","ins":"全卷第一個身分字就在 1:1：原文是「被揀選的寄居者」——在地上是外人，在神那裡是選民。1:15 是呼召：「那召你們的既是聖潔」，召你們像他。2:4 是第一個翻轉，「揀選」第一次用在基督身上：「固然是被人所棄的，卻是被神所揀選、所寶貴的」；2:6 以賽亞書的房角石也是「所揀選、所寶貴的」。2:9 兩個字在同一節：被揀選，是為了宣揚那召你的——「惟有你們是被揀選的族類……要叫你們宣揚那召你們出黑暗入奇妙光明者的美德」。然後是兩個意想不到的呼召：2:21「你們蒙召原是為此」——為了受苦；3:9「因你們是為此蒙召，好叫你們承受福氣」——為了祝福那些辱罵你的人。5:10 是頂點，呼召有一個終點：「那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀」。最後一站在問安裡：「在巴比倫與你們同蒙揀選的教會問你們安」（5:13）——揀選不是一個人的事，巴比倫的教會和本都的教會是同一批被揀選的人。屬神的體系，每一塊石頭都是被揀選的，也都是「同蒙」揀選的。","stops":[["1:1","寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的",""],["1:15","那召你們的既是聖潔",""],["2:4","卻是被神所揀選、所寶貴的","top"],["2:6","我把所揀選、所寶貴的房角石安放在錫安",""],["2:9","惟有你們是被揀選的族類……要叫你們宣揚那召你們出黑暗入奇妙光明者的美德","top"],["2:21","你們蒙召原是為此",""],["3:9","因你們是為此蒙召，好叫你們承受福氣",""],["5:10","那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀","top"],["5:13","在巴比倫與你們同蒙揀選的教會問你們安",""]]},{"gk":"φόβος／φοβέομαι ＋ τιμάω／τιμή","tr":"phobos / phobeomai + timaō / timē","gl":"敬畏、懼怕 ＋ 尊敬、敬重","code":"G5401","root":"φόβος——敬畏、懼怕；φοβέομαι——怕、敬畏；τιμάω——尊敬（給人應得的分量）；τιμή——尊貴、敬重。2:17 一節之內把兩個字分開：對神是「敬畏」，對君王與眾人是「尊敬」","ins":"全卷第一個「怕」是對神的：「就當存敬畏的心度你們在世寄居的日子」（1:17）——寄居的人要怕對的那一位。2:17 一節之內分出兩種態度：「務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王」——只敬畏神，對君王是尊敬；四個命令，「敬畏」只給神。2:18 家僕「存敬畏的心」，3:2 妻子「敬畏的心」，都是向著神的。3:6 是第一個翻轉：敬畏神的人，「不因恐嚇而害怕」。3:7 輪到丈夫：「所以要敬重她」——尊敬不是只往上給，也往身邊給。3:14 一句兩次「怕」：「不要怕人的威嚇，也不要驚慌」。3:15 是第二個翻轉：不怕人的人，回答人的時候反而有「敬畏」——「以溫柔、敬畏的心回答各人」，因為他心裡有一位更大的。敬畏神的人才能不怕人；不怕人的人，才能溫柔地回答人。焦點在耶穌，不在別人、不在環境：怕對了一位，就不必怕其他的。","stops":[["1:17","就當存敬畏的心度你們在世寄居的日子","top"],["2:17","務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王","top"],["2:18","凡事要存敬畏的心順服主人",""],["3:2","這正是因看見你們有貞潔的品行和敬畏的心",""],["3:6","你們若行善，不因恐嚇而害怕",""],["3:7","所以要敬重她",""],["3:14","不要怕人的威嚇，也不要驚慌","bot"],["3:15","以溫柔、敬畏的心回答各人","top"]]}],"lesson":{"1":{"no":1,"vol":"《321彼得前書講義》第一課·彼得前書第一章","title":"叫我們有活潑的盼望——重生、束腰、寶血","chars":4885,"min":60,"deep":8,"dchars":1794,"tchars":1346,"blocks":[["h","一、一張清明節的全家福"],["p","弟兄姊妹平安。有一張照片，在林家的家族群組裡傳了好幾天。清明節，山上，祖墳前，二十幾個人排成三排。前排正中間坐著八十六歲的阿公，兩旁是叔伯和嬸嬸，每一個人手裡都拿著三炷香，煙往同一個方向飄。只有最後一排、最右邊，站著一個年輕的女孩子，手裡拿的不是香，是一束白色的菊花。她叫婉婷，是家族裡唯一信主的人。"],["p","照片底下，一位堂叔留了一句話：婉婷這張要是拿香就完美了，後面跟了三個笑臉。另一位親戚接著說：信了洋教，祖宗都不要了。沒有人替她說話。那天晚上，她把手機蓋在床頭，躺了很久。她問自己一句話：我這樣，到底在盼望甚麼？"],["p","「盼望」這兩個字，我們每天都在用。盼望明天不要下雨，盼望檢查報告沒事。仔細聽，我們嘴裡的盼望，多半其實是「但願」：一件還沒發生、也不一定會發生的事，我們把心掛上去，然後等。這樣的盼望有一個特點：它會死。雨還是下了，報告出來是紅字，盼望就斷了氣。"],["p","彼得前書第一章講的，是另一種盼望。照書信三問，先問第一問：收信的人遇到甚麼？他們和婉婷很像。多數是外邦人，信主以後沒有搬家，還住在原來的村子、原來的街上，卻成了家鄉裡的外人：不再跟著拜，不再跟著喝，鄰舍覺得奇怪，家裡有壓力。彼得寫給這樣一群人，第一句話不是「你們要忍耐」，是讚美神，說神「叫我們有活潑的盼望」。這一課走三步：重生、束腰、寶血。"],["d",["我是家族裡唯一信主的人，清明節到底還要不要跟著上山？","要去，而且可以比以前更用心。1:18 被贖出來的是「虛妄的行為」，不是對父母和家族的愛；拜與不拜是一件事，孝與不孝是另一件事。實際上可以這樣預備。第一，出發前先私下跟父母說明：我會去，會幫忙，只是不拿香。第二，到了山上，第一個動手：提水、拔草、刷墓碑、扶長輩上下樓梯，大家拿香時，你在旁邊安靜為這一家人禱告。第三，鞠躬致意、獻花這一類界線，各地各家儀式的意思不一樣，請事先和牧者談，照良心分辨，不必和別人比。第四，回來以後在小組裡說一說，讓弟兄姊妹為你禱告。"]],["h","二、被揀選的寄居者，被守住的城"],["p","先看信封上寫給誰：「耶穌基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）。這五個地方在今天土耳其的北部。「寄居的」原文是暫住的外地人：住在這裡，卻不屬於這裡。可是彼得在這個字前面，先放了另一個字：ἐκλεκτοῖς，被揀選的。在家族的照片上，你也許站在最邊上；在神那裡，你是被揀選的。揀選怎樣解釋，議題頁並陳；這裡只看彼得拿它來做甚麼：給被排在邊上的人一個身分，不是給人一份名單。"],["p","問安完了，彼得第一句就是讚美：「願頌讚歸與我們主耶穌基督的父神！他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望」（1:3）。原文從第三節一路寫到第九節才下句號，是一口氣說完的一句話。請看這句話的主詞：是神。根源是甚麼？他的大憐憫。管道是甚麼？耶穌基督從死裡復活。寫這句話的人最知道這件事。他三次不認主，主復活的那個早上，天使特別交代婦女：「你們可以去告訴他的門徒和彼得」（可 16:7）。不是彼得變好了，是主沒有放棄他；所以他說「重生了我們」，「我們」裡面有他自己。"],["p","接著兩節，是兩個「守」。「可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。」（1:4）三個詞原文同一個字頭：不會爛，不會髒，不會謝。彼得說，你的基業存在天上，一直有人替你保管。然後是「你們這因信蒙神能力保守的人」（1:5）。「保守」原文 φρουρουμένους，是駐軍日夜看守一座城。基業在天上被存著，你在地上被守著。信心不是城牆，是讓駐軍進城的那扇門；守城的，是神的能力。"],["d",["「照父神的先見被揀選」，我怎麼知道自己是不是被揀選的人？","先看彼得寫這句話的目的。他不是在發一份名單讓人猜誰在上面，是寫給一群在家鄉被排擠的人，告訴他們：在地上你是外人，在神那裡你是被揀選的。揀選的根源是預先知道，還是預先愛，教會歷史上有不同的讀法，本講義兩說並陳，揀選與預定回指以弗所書立場二。可是兩說都同意：你得救的根源是神的恩典，不是你的功勞。再看 1:2 揀選的方向：「藉著聖靈得成聖潔，以致順服耶穌基督」。你今天想跟隨他、想更像他，這本身就是聖靈在你裡面工作的記號。也請不要拿這兩個字去判斷別人，說誰大概不在名單上。"]],["h","三、原文亮光：重生、活的、多色的"],["p","第一章的盼望有三個原文字撐著。拆開來，每一個都能在三十秒之內落到婉婷那張照片上。"],["p","第一個原文字：ἀναγεννήσας，「重生了」。前面一個「再」，後面一個「生」。這個字在全本新約只出現在彼得前書，一次在 1:3，一次在 1:23。一個人不能自己把自己生出來，生命是被給的。所以重生不是換一套習俗、加入一個團體，是被生進一個新的家。這也改變婉婷怎樣看自己：她不是一個離開家的人，她是一個被生進另一個家、又被差回原來那個家的人。"],["p","第二個原文字：ζῶσαν，「活潑的」，就是「活著的」，是現在分詞，這盼望有心跳。「但願」的盼望掛在會壞的事上，事一壞，盼望就死；活的盼望掛在一個活人身上，這一位已經從死裡復活，不會再死，所以掛在他身上的盼望也不會再死。彼得自己的盼望死過一次。當年耶穌說要受苦，他拉著主說：「主啊，萬不可如此！這事必不臨到你身上。」（太 16:22）他要的是一位不必受苦的主，那個盼望在十字架下斷了氣。現在，同一個人在第十一節寫：先知心裡基督的靈「預先證明基督受苦難，後來得榮耀」（1:11）。這是全卷的公式。活的盼望不是沒有苦的盼望，是穿過苦以後還活著的盼望。"],["p","第三個原文字：ποικίλοις，「百般的」。「因此，你們是大有喜樂；但如今，在百般的試煉中暫時憂愁」（1:6）。這個字的意思是「多種顏色的」。到第四章，彼得用同一個字說：「作神百般恩賜的好管家」（4:10）。試煉有多少種顏色，恩典就有多少種顏色。婉婷的試煉是群組裡的一句話；你的也許是一張診斷書、一封解僱信。"],["p","請聽清楚這一節的分寸。「憂愁」原文是真的被痛擊中過，不是表面的不開心。約翰福音第二十一章，主第三次問彼得「你愛我嗎」，彼得就憂愁，用的是同一個字；主沒有責備他的憂愁，主繼續把羊交給他。所以憂愁是被允許的。彼得在同一句裡放進「大有喜樂」，也放進「憂愁」，兩個都是真的。喜樂是一個方向，不是一張面具。再看「暫時」這兩個字。信的最後一章，彼得又用了同一個字：「等你們暫受苦難之後，必要親自成全你們」（5:10）。兩個「暫時」一頭一尾，把苦難框住了。永恆的眼光不是把苦難變小，是把盼望變大。1:7 說信心被火試驗，比金子更寶貴；這不是叫人去找苦，是叫已經在火裡的人知道，火不會白燒。"],["p","然後是這一章最溫柔的一句：「你們雖然沒有見過他，卻是愛他」（1:8）。寫這句話的人是見過他的；他寫給一群從來沒有見過主的人，說：你們卻是愛他。"],["d",["我說不出自己是哪一天重生的，是不是代表我其實還沒有重生？","不是。1:3 重生的主詞是神，根源是他的大憐憫，根據是基督的復活；1:23 說工具是神活潑常存的道。重生是神的工作，不是一個要你拿出日期來證明的考題。在基督徒家庭長大、慢慢信主的人，常常說不出確切的那一天，就像一顆種子甚麼時候落進土裡，不一定看得見；看得見的是它長出來的生命。所以可以問自己：我是不是愛那一位我沒有見過的主？這是種子已經發芽的樣子。重生與洗禮的關係，各傳統說法不同，議題頁並陳，洗禮的全卷立場見 ISS00_4；救人的是復活的基督，不是一個儀式的自動結果，也不是你記得的日期。"]],["d",["我正在吃抗憂鬱的藥，常常高興不起來，這是不是表示我不夠信靠神？","不是。彼得在 1:6 同一句裡寫「大有喜樂」，也寫「暫時憂愁」，他沒有責備憂愁的人；主耶穌在客西馬尼也說「我心裡甚是憂傷，幾乎要死」（太 26:38）。憂鬱和焦慮是需要照顧的身心狀況，不等於信心軟弱；看醫生、按時吃藥、找心理諮商，和禱告、讀經並行，都是在接受神的照顧。1:8 的喜樂是「因信他」而有的，是一個方向，不是一種要你每天量給別人看的情緒。實際上，請不要自己停藥，讓一兩位信得過的弟兄姊妹知道你的狀況；每天可以只讀 1:6 一節，對主說「今天我很難，可是我還是向著你」。若有傷害自己的念頭，請立刻告訴身邊的人並聯絡專業與危機求助資源，不要一個人扛。"]],["h","四、束上腰：被寶血買回來的人"],["p","盼望講完，彼得說：「所以要約束你們的心，謹慎自守，專心盼望耶穌基督顯現的時候所帶來給你們的恩。」（1:13）「約束你們的心」，和合本的小註腳說：原文是束上你們心中的腰。原文 ἀναζωσάμενοι，是把垂到腳邊的長袍撩起來塞進腰帶，準備跑路或做工；這個動詞新約只用這一次。束的不是身體，是心思。這一節原文只有一個主要動詞 ἐλπίσατε，「你們要盼望」，是命令。彼得給寄居者的第一道命令，不是「要忍耐」，是「要盼望」：盼望不是等它自己湧上來的心情，是一個可以選擇的方向。"],["p","束好腰往哪裡跑？彼得說：「那召你們的既是聖潔，你們在一切所行的事上也要聖潔。」（1:15）又引利未記：「你們要聖潔，因為我是聖潔的。」（1:16）很多人一聽到聖潔，就想到一張清單。可是彼得給的理由不是清單，是一個人：召你們的是聖潔的。前一節說「不要效法」，原文是被套進一個模子；從前大家怎麼活，我就怎麼活。聖潔就是不再被套回那個模子，開始像那召我們的。對婉婷來說，聖潔不是在山上和叔伯辯論，是在公司報帳不灌水，被嘲笑時不回嘴。"],["p","接著彼得說：「就當存敬畏的心度你們在世寄居的日子」（1:17）。寄居的人會怕，怕家族的眼光、老闆的臉色、群組裡的評語；彼得說，要怕對的那一位。理由不是威脅，是一個價錢：「知道你們得贖，脫去你們祖宗所傳流虛妄的行為，不是憑著能壞的金銀等物，乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血。」（1:18--19）「得贖」是買回一個奴隸的字，那個時代贖價是銀子。彼得說，買你回來的不是銀子，是血。照片底下那一句話，想替婉婷定一個價錢；可是她的價錢早就定了，而且是用血付的。"],["p","這裡有一句，華人讀起來特別敏感：祖宗所傳流虛妄的行為。我要很小心地說。彼得不是在羞辱收信人的父母，他自己也是從祖宗的傳統裡被主叫出來的；他說的是那套活法虛空，不是那些人沒有價值。請把兩件事分開：拜與不拜，是一件事；孝與不孝，是另一件事。被贖出來的，是那套虛空的活法，不是對父母的愛。一個不拿香的信徒，可以是家族裡最常回家、最肯照顧長輩的那一個。"],["p","最後一段，彼得從聖潔直接講到相愛：「就當從心裡彼此切實相愛」（1:22）。「沒有虛假」原文是沒有面具，「切實」是把手臂伸到最遠。為甚麼能這樣愛？「你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉著神活潑常存的道。」（1:23）同一顆種子生出來的，就是一家人。然後彼得引以賽亞：「草必枯乾，花必凋謝；惟有主的道是永存的。」（1:24--25）照片會褪色，名聲和頭銜都像草上的花；所傳給我們的福音不會。"],["d",["「你們要聖潔」，是不是就是不看電影、不喝酒、不去某些地方的一張清單？","彼得引的是利未記，那裡的上下文有飲食條例；可是他寫給外邦信徒，卻沒有叫他們守那些飲食條例。他給的理由不是規條，是一個人：「那召你們的既是聖潔」（1:15）。聖潔的標準是神自己，範圍是「一切所行的事」，比一張清單大得多：報帳、說話、上網、對待父母、對待下屬，都在裡面。清單會讓人以為守完就聖潔了，也讓人拿它量別人。實際上，可以每天晚上問一個問題：今天在哪一件事上，我被套回了「大家都這樣」的模子？明天在那一件事上，那召我的會怎麼做？聖潔的全卷追蹤回指帖撒羅尼迦前書立場四。"]],["d",["「祖宗所傳流虛妄的行為」，是不是說我的父母和祖先一輩子都白活了？","不是。「虛妄的」說的是那套活法空虛、沒有結果，不是那些人沒有價值。彼得自己也是從祖宗的傳統裡被主叫出來的，他寫這句話，是要收信人知道自己被一個很貴的價錢買了回來，不是要他們回家看不起父母。父母為家庭的辛勞與愛都是真實的，十誡也說要孝敬父母。如果你的父母已經過世，而且沒有信主，請不要讓任何人替他們下判決；把他們交在那位公義又滿有憐憫的神手裡，哀傷與亡者的牧養回指帖撒羅尼迦前書立場三。如果他們還在，請今天就用一個具體的行動愛他們：一通電話、一頓飯、陪他們看一次醫生。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 1:6 對正在憂愁的人說：真正有喜樂的基督徒不會憂愁，你要趕快笑出來。彼得在同一句裡放進喜樂和憂愁，兩個都是真的。憂鬱和焦慮不等於信心軟弱，看醫生、吃藥、找心理諮商，和信靠神並不衝突。"],["p","第二個偏差，是把 1:7 的火講得浪漫：苦難是禮物，越苦越屬靈，甚至暗示人去找苦；或反過來，把百般的試煉一律講成懲罰，說你受苦就是你做錯了。彼得是對已經在火裡的人說話，不是叫人去點火；把所有的苦都歸罪，是在傷口上再加一刀。"],["p","第三個偏差，是拿 1:18 羞辱長輩：你爸媽一輩子拜的都是假的，活得毫無意義；甚至在講台上斷定已經過世的長輩去了哪裡。這會深深刺傷父母還沒信主就過世的弟兄姊妹；人的去處在公義又滿有憐憫的神手裡，不在我們口中。"],["p","第四個偏差，是反過來把「分別為聖」講成對抗：在祭祀的場合搶香、拒絕出席喪禮、和長輩翻臉、斷絕往來。被贖出來的是虛空的活法，不是對父母的愛；家人若只看見一個離開家的人，就看不見一個更愛家的人。"],["p","第五個偏差，是把 1:15 的聖潔講成一張清單，用衣著、娛樂、飲食量誰比較屬靈；或者再反過來，說現在是恩典時代，怎麼活都不要緊。彼得的標準是那召我們的神，範圍是「一切所行的事」；聖潔是天天跟他在一起，慢慢像他。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：清明、年節、喪禮，不拿香，還能不能做一個孝順的孩子？可以，而且要做得更多。拿香、跪拜、向亡者祈求不參與，可是可以第一個到、最後一個走，掃墓、拔草、扶長輩上山，獻花，辦一場追思。事前先跟父母好好說，不要讓他們在親戚面前才第一次知道；平常日子更常回家，陪他們看醫生。界線怎樣劃，請在牧者陪伴下照良心分辨。"],["p","第二個問題：我們的文化習慣報喜不報憂，到了教會也常只會說「感謝主，一切都好」。在家裡憂愁要藏，在教會憂愁好像更要藏，好像說出來就是見證不好。1:6 對這樣的人說：你可以一邊流淚，一邊相信；一邊吃藥，一邊禱告。彼得沒有要收信人先把眼淚擦乾，才配得那活潑的盼望。小組要成為一個可以說「我這一陣子很難」的地方。"],["d",["長輩當面說「信耶穌就是不要祖宗」，我當下可以怎麼回答？","當下最重要的不是辯贏，是讓長輩感覺到你沒有離開他。可以先承認他的擔心：「阿公，你是怕我以後不回來、不管這個家，對不對？」然後用一兩句話說清楚：「我信耶穌以後，不拿香，可是祖先的恩情我記得，你和阿嬤我更要照顧。」說完就做一件具體的事，例如倒茶、扶他起身。不要在眾人面前爭論誰的信仰對，也不要說長輩拜的都是假的。這句話不是一次說服的，是一年一年回家說出來的。真正的回答，是三年後長輩自己說：這個孩子信了耶穌以後，比較常回來。"]],["h","七、活出321——那一位活著，所以盼望也活著"],["p","這一章照出的有己，是一個要自己守住自己的人：把盼望掛在抓得住的東西上，也讓別人的眼光替自己定價。可是守城的是神的能力，付價的是基督的寶血。"],["p","耶穌是我的榜樣：「基督受苦難，後來得榮耀」這條路，他自己先走。他在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38），神的兒子也憂愁，所以 1:6 的憂愁不必藏起來；他也是無瑕疵的羔羊，卻和稅吏、罪人同桌，聖潔得可以靠近任何人。"],["p","聖經是我的準則：「惟有主的道是永存的」，家族的評語、群組裡的笑臉都會過去。這一週替自己定價的，是 1:18--19，不是照片底下的那一句話。"],["p","聖靈是我的引導：1:2 說「藉著聖靈得成聖潔」，1:12 說聖靈從天上差來。下一次家族聚會，哪一件事該參與，哪一件事要溫和地不參與，求聖靈事先引導你，也去問一位牧者。"],["p","讓耶穌作王：要讓出來的，是替自己定價的那張椅子。這一週，誰的一句話最能左右你的心情？那句話現在坐在誰的位置上？把那張椅子還給那位付了價的主。"],["p","讓耶穌得著一切的榮耀：重生的主詞是神，根源是他的大憐憫。我們講婉婷，也講彼得，可是被高舉的不是不拿香的人，也不是寫信的使徒，是那位從死裡復活的主。"],["p","建立屬神的體系：1:22--23 說我們是同一顆種子生的一家人。為家中只有自己信主的弟兄姊妹安排屬靈同伴，特別是新信徒的第一次清明；散在各國的弟兄姊妹，至少有一位會在他憂愁時打電話來的家人。"],["h","八、四種心，誰站在照片的邊上"],["p","驕傲型的心，會把不拿香變成一枚勳章，為的是證明自己對；也會用清單量別人的聖潔。這一章問你：你被贖，是憑著自己的乾淨，還是憑著基督的寶血？"],["p","恐懼型的心，怕家族的眼光，怕被說不孝，也怕自己撐不住、哪一天跌倒就完了。1:5 說守城的是神的能力，1:17 說要怕對的那一位。你可以帶著怕，照樣在下一次聚會裡溫柔地站好。"],["p","羞恥型的心，也許想起從前的自己：拜過、喝過、放縱過，覺得自己不配談聖潔。1:18--19 說你被贖出來了，價錢不是你的表現，是無瑕疵的羔羊的血。你不必先把自己洗乾淨，才走到他面前。"],["p","受傷型的心，也許曾被家族排擠、被分家、被冷落，或在教會裡被要求笑著見證、不准說難過。1:6 說你的憂愁是被允許的。若你在家裡的處境已經涉及威脅或傷害，請告訴一位信得過的人，先顧好安全，讓人陪你找到專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:3--5，對主說一句：今天守住我的，是你的能力。每天晚上讀 1:8，對主說：我沒有見過你，但我愛你；如果那天很難說出口，就說：今天我很難過，可是我還是向著你。"],["p","第二，這一週挑一個晚上，打一通電話給一位不信主的長輩，不急著談信仰，問他的身體，約好下一次回家的日子。"],["p","第三，每當你因為一件事失去盼望或睡不著，就把它記下來，在旁邊寫「能壞」或「不能壞」；週末讀一遍，看看自己的盼望掛在哪裡。"],["p","第四，選一個「大家都這樣，所以我也這樣」的模子，例如應酬的灌酒、報帳的灌水、群組裡的冷言冷語，這一週在這一件事上，安靜地不被套回去。"],["p","第五，傳一則訊息給一位正在憂愁的弟兄姊妹，抄上 1:6，不催他好起來。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神照自己的大憐憫，藉耶穌基督從死裡復活重生了我；我的盼望是活的。"],["p","我宣告：我的基業存在天上，我在地上被神的能力守住；我的憂愁是暫時的。"],["p","我宣告：我不是憑著能壞的金銀，是憑著基督的寶血被買回來的；沒有人的一句話可以替我定價。"],["p","我宣告：我要束上心中的腰，在一切所行的事上學像那召我的，也從心裡切實地愛我的家人。"],["d",["心情很低的時候，我要怎樣照 1:13 的吩咐「專心盼望」？","1:13 原文只有一個主要動詞，「你們要盼望」，是命令；命令的意思是，盼望不必等心情變好才開始，它是一個可以選擇的方向。可是方向不是面具，你不必先假裝好起來。實際上可以從很小的地方開始。第一，早上起床，先讀 1:3--5 一次，只要對主說一句：今天守住我的，是你的能力。第二，那一天若很難，就照實說：主，我今天很難過，可是我還是向著你。第三，告訴小組裡一位信得過的人，讓他這一週為你禱告。束上心中的腰，就是在亂的時候，把心撩起來，往主那裡走一步。"]],["h","十、結語"],["p","我們回到那張照片。第二年清明，婉婷又上山了。這一次她到得最早，先把水桶提上去，把墓碑上的青苔刷乾淨，扶著阿公一階一階走上去。大家拿香的時候，她站在旁邊，手裡還是一束菊花，低著頭，心裡為這一家人禱告。下山的路上，阿公拉著她的手，走得很慢。他說：這個孩子，信了耶穌以後，比較常回來。群組裡那張新的合照，她還是站在邊上，這一次，沒有人留言。"],["p","可是這一課的焦點，不在婉婷做得多好，也不在彼得多了不起。焦點在那一位：他照自己的大憐憫重生了我們，用自己的寶血把我們從虛空的活法裡買回來，從死裡復活，所以我們的盼望也是活的。你不必更佩服誰，只要更愛這一位：你雖然沒有見過他，卻是愛他。"],["p","我們一起低頭禱告。天父，謝謝你照你的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望。謝謝你用無瑕疵、無玷污的羔羊之血，把我們買回來。我們當中有站在照片邊上的人，有正在憂愁的人，有想念已經過世的家人的人；求你守住我們，像駐軍守住一座城。求你教我們不拜也更孝順，在一切所行的事上像你，也從心裡切實地彼此相愛。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最勇敢、誰最屬靈，是讓每一個人說出自己站在哪一張照片的邊上，也說出這一週要做的一件不能壞的事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是重生、束腰、寶血。席上可能有家中唯一信主、年節壓力很大的人，也可能有正在憂愁、正在就醫、或父母未信主就過世的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：活的盼望掛在復活的主身上；憂愁是被允許的，喜樂是方向不是面具；我們的價錢是寶血，不是別人的眼光。"],["n","1. ★ 說一件你最近正在盼望的事：是甚麼、從甚麼時候開始？如果它沒有發生，你會怎樣？"],["n","2. ★★★ 1:3 說神藉耶穌基督從死裡復活，叫我們有活潑的盼望。請用一句話說：「但願」的盼望和「活的」盼望差別在哪裡？活的盼望掛在誰身上？"],["n","3. ★★ 1:6 在同一句裡放進「大有喜樂」與「暫時憂愁」。你在哪裡聽過「基督徒不該憂愁」這類話？讀完這一節，你會怎樣回答？"],["n","4. ★★ 1:18--19 說買你回來的是基督的寶血。最近誰的一句話最能替你定價？如果你相信自己是用這個價錢被買回來的，那句話的分量會變成怎樣？"],["m","帶領提醒：一口氣從 1:3 讀到 1:9；不爭論揀選或洗禮，指向議題頁就好。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出自己站在照片邊上的那個位置，也說出這一週要做的一件不能壞的事。"],["t","【看】看見自己"],["n","5. ★★★ 說出你現在站在哪一張照片的邊上：家族、職場，還是朋友圈？最近一次覺得自己像外人，是哪一天、在甚麼場合？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:3--6 兩遍。第二遍讀完，說出一個詞：被揀選、重生、存留、保守、暫時，哪一個詞對你剛才說的那一刻說話？為甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你的盼望卡在哪裡：覺得要自己撐出喜樂、怕家人說你不孝、覺得從前的自己太髒不配談聖潔，還是覺得神根本沒看見？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我是被一個很貴的價錢買回來的，我的盼望是活的。」右手邊的人只回一句「你是被揀選的」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要做的一件不能壞的事：星期幾、幾點、對誰、做甚麼，例如打電話問候一位不信主的長輩。"],["m","帶領提醒：不浪漫化苦難，不說「你受苦一定是做錯了甚麼」，也不催正在憂愁的人快一點喜樂。這一化可能碰到憂鬱、焦慮、家族排擠、家庭傷害，或父母未信主就過世的哀傷；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，不替任何已過世的人下判斷，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一位要陪的人、一則訊息、一個模子、一位要分享的人。"],["n","10. ★★ 小組裡有沒有家中只有他一人信主的弟兄姊妹？下一個清明、中秋或農曆年以前，誰在哪一天約他，陪他事先想好怎樣不拜也盡孝？"],["n","11. ★★ 說出一位最近正在憂愁的弟兄姊妹的名字，這一週哪一天、用電話還是訊息，把 1:6 傳給他，不催他快一點好起來？"],["n","12. ★ 說出一個你一直被套進去的模子，例如應酬的灌酒。這一週在哪一個場合、面對哪一個人，你要安靜地不被套回去？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：神藉著耶穌從死裡復活，給了我一個不會死的盼望。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我們平常說的盼望多半是「但願」，事情一壞，盼望就死了。第二句，耶穌從死裡復活，所以掛在他身上的盼望是活的。第三句，他用自己的血把我買回來，所以別人的眼光不能替我定價。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會注意」這類答案；不催家中唯一信主的組員在家族面前表明立場。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要做的那一件不能壞的事是甚麼，對誰。可以只說「一個人」，不必說名字。"],["p","然後彼此代禱，為三種人指名禱告：一位家中只有他一個人信主的人，求主讓他在家裡被尊重，也更孝順；一位正在憂鬱或焦慮中的人，求主陪他，也求我們不催他；一位離鄉寄居的人，求主讓他知道自己被保守。"],["p","散會以前，確認紙上寫了你的那個「2」，下次帶來對。"]]},"2":{"no":2,"vol":"《321彼得前書講義》第二課·彼得前書第二章","title":"你們來到主面前，也就像活石——退貨、戶籍、字帖","chars":5155,"min":60,"deep":8,"dchars":1833,"tchars":1346,"blocks":[["h","一、工地上的兩句話"],["p","弟兄姊妹平安。「師傅，這一塊不要了嗎？」「不要了。你敲敲看，聲音是悶的，裡面有暗裂。搬到牆角去。」這是工地上很平常的一段對話。學徒把石頭抱到牆角，那裡已經堆了好幾塊。被判了不合格的石頭，大概就一輩子躺在牆角了。"],["p","彼得前書第二章，要我們先在那個牆角站一下。「主乃活石，固然是被人所棄的，卻是被神所揀選、所寶貴的。」（2:4）「所棄」原文是 ἀποδεδοκιμασμένον（apodedokimasmenon），就是驗過以後判定不合格，而且是完成式，人的判決一直擺在那裡。宗教領袖棄絕了他；巡撫查不出他有罪，卻仍把他交了出去。請先不要急著跳到「揀選」和「寶貴」。在全卷的地勢圖上，這是本章最低的地方：被棄。"],["p","彼得的讀者很懂這個字。他們多數是外邦人，信主以後沒有搬家，卻成了家鄉裡的外人：家族拜拜的時候手是空的，鄰舍就說他們是怪人、是作惡的。彼得先給他們看一塊跟他們一樣被丟到牆角的石頭。而且這塊石頭是活的：λίθον ζῶντα（lithon zōnta），活石。石頭本來是世上最不活的東西，這一塊活著，因為他死過，又從死裡復活了，就是 1:3 那「活潑的盼望」的源頭。"],["p","可是彼得走到這塊石頭以前，先講了奶。「就要愛慕那純淨的靈奶，像才生的嬰孩愛慕奶一樣」（2:2）。讀經可以是功課，愛慕卻是胃口。「純淨」原文是不摻假的：脫下 2:1 那摻假的心，喝不摻假的道。然後他說：「你們若嘗過主恩的滋味，就必如此。」（2:3）這一課用三個詞走完第二章：退貨、戶籍、字帖。被人退貨的石頭，在地上沒有戶籍的人，和一張可以描的字帖。"],["d",["我信主很多年了還是讀不太下聖經，2:2 說要愛慕靈奶，這是不是說我還在喝奶、很不屬靈？","不是。新約有兩種奶的用法。保羅和希伯來書用奶比喻淺，是責備該長大卻不長大的人；彼得的用法不一樣，他對全教會說「要愛慕」，因為在神的道面前，每一個重生的人一生都是才生的嬰孩。「靈奶」原文和「道」同字根，是屬道的、不摻假的奶。所以這一節不是在量你的程度，是在問你的胃口：你還餓嗎？胃口沒了，不必先罵自己，彼得的方法很溫柔，先回想第一次「嘗過主恩的滋味」是哪一天、在哪裡。實際的做法是先縮小份量：每天五到十節，慢慢讀，讀完只對主說一句話。漸長是一天一天長出來的。"]],["h","二、退貨的石頭，砌成一座沒有牆的殿"],["p","寫這封信的人，名字就叫石頭。主第一次見他就說：「你要稱為磯法」（約 1:42），磯法就是石頭。可是他寫到石頭的時候，一個字都沒有提自己。他沒有說我是磐石，他說主乃活石。不論太 16:18 的磐石各家怎樣解，彼得寫到石頭時，指向的是主：主一直是那塊活石，而且沒有放棄他。"],["p","然後是這一章的章題：「你們來到主面前，也就像活石，被建造成為靈宮，作聖潔的祭司」（2:5）。請留意兩個文法。「來到」是現在分詞 προσερχόμενοι（proserchomenoi），不是來一次就完，是一直來。「被建造」οἰκοδομεῖσθε（oikodomeisthe）是被動語態：石頭不會自己砌牆。你不必想辦法把自己砌進牆裡，只要不斷地來到他面前，砌的那一雙手是神的手。彼得又把兩個畫面疊在一起：你們是殿，也是殿裡的祭司。"],["p","接著是三處舊約裡的石頭。「看哪，我把所揀選、所寶貴的房角石安放在錫安；信靠他的人必不至於羞愧。」（2:6）以賽亞書那裡，和合本作「必不著急」，彼得照的是希臘文的舊約，這是兩個版本；放在一起，剛好是兩種安慰：今天不必慌，將來不會丟臉。再來是詩篇：「匠人所棄的石頭已作了房角的頭塊石頭。」（2:7）同一塊石頭，有人砌在上面，有人絆在上面。「他們這樣絆跌也是預定的」（2:8）這一句，本講義讀成：神定下的，是「不順從的人必絆跌」這個結果，不是叫我們去猜誰被預定。石頭還在那裡，門沒有關。"],["p","鏡頭再轉回讀者身上：「惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民」（2:9）。這四個名字本來是給以色列的，現在給了一群拜過偶像的外邦人。2:4 是本章最低的地方，2:9 是最高的地方，中間只隔五節。四個名字不是勳章，是任務：「要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。」（2:9）所以信徒皆祭司，不是不要牧師，是每一個人都是把人帶到神面前的人。「你們從前算不得子民，現在卻作了神的子民」（2:10），被退貨的那一塊石頭，和被退貨過的人，現在在同一座殿裡。"],["d",["2:5、2:9 說每個信徒都是祭司，那教會還需要牧師和長老嗎？","需要。信徒皆祭司的意思，是每一個人都可以直接來到神面前，也都有一份把人帶到神面前的工作，不是只坐著聽；它不是說不需要牧養。神也設立牧者「成全聖徒，各盡其職」，彼得在第五章還會專門對長老說話，而且自稱是同作長老的。祭司做三件事：為人禱告、把神的話帶給人、陪人來到神面前。這一週你可以問自己：我為誰禱告過？我把哪一段經文傳給過誰？同時也為牧養你的人禱告一次。全卷立場見 ISS00_5。"]],["d",["2:8 說「他們這樣絆跌也是預定的」，我先生到現在都不信，是不是神預定他不信？","不要這樣讀。彼得在同一節先說了原因：「他們既不順從，就在道理上絆跌」，不順從是人的選擇。這一句有三種讀法：一說神預定人不信；一說神預定的是「不順從的人必絆跌」這個結果；還有一說照和合本註腳，重點放在絆跌是因為不順從。本講義採第二種：神定下的是一個屬靈的定律，不是一份不信者的名單。所以沒有人可以拿這一節去宣判任何一個人，尤其是你正在為他禱告的家人。石頭還在那裡，門沒有關；請繼續為你先生禱告，繼續在家裡活出 2:12 的好行為。揀選與預定的大題，見以弗所書立場二。"]],["h","三、沒有戶籍的好鄰舍"],["p","一座用活人蓋的殿，每天還要出門上班、面對鄰舍。彼得換了稱呼：「親愛的弟兄啊，你們是客旅，是寄居的。」（2:11）「寄居的」原文 πάροικος，是有居留、沒有公民權的人：在這裡有住址，沒有戶籍。彼得多出來的一筆是：他的讀者沒有搬家，卻成了自己家鄉裡的外人。他的第一個勸勉，不是對付外面的人，是對付裡面的私慾。寄居的人最危險的是被同化。"],["p","第二個勸勉：「你們在外邦人中，應當品行端正，叫那些毀謗你們是作惡的，因看見你們的好行為，便在鑒察的日子歸榮耀給神。」（2:12）「看見」原文是長時間地細看：同事、鄰居、婆家在背後看了你三年、五年，看你被冤枉時怎樣說話。和合本小字說「鑒察」也可以譯作「眷顧」，也許有一天，今天說你壞話的那個人，會被神眷顧。"],["p","「你們為主的緣故，要順服人的一切制度」（2:13）。寫這句話的時候，在羅馬作皇帝的很可能就是尼祿。關鍵是那四個字：為主的緣故。順服的理由是主，順服的界線也是主。同一個彼得，曾經在公會面前說：「順從神，不順從人，是應當的。」（徒 5:29）這兩句話不打架。平常的日子，信徒納稅、守法、尊重在位的人；當人的命令要他否認主，他溫柔地拒絕，也承擔後果。順服不等於同意，也不等於沉默。"],["p","然後是一張很精準的地圖：「務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王。」（2:17）請慢慢聽。對眾人是尊敬，對君王也是尊敬，原文是同一個字；只有神，得到「敬畏」。信徒可以尊敬凱撒，卻不會敬畏他。這一課不替任何政權背書，也不叫人仇視任何政權；這一節只給散在各國的每一個人同一個姿態：好好作公民，用行善去「堵住那糊塗無知人的口」（2:15），心裡的王座只有一位。"],["d",["如果政府的要求違背我的良心，2:13 要我順服，徒 5:29 又說要順從神，到底該聽哪一個？","兩節都是彼得說的，不打架。2:13 的關鍵是「為主的緣故」：順服的理由是主，界線也是主。平常的日子，信徒納稅、守法、尊重在位的人，這是好公民的本分；只有當人的命令要你否認主、或叫你做神明明禁止的事，才輪到徒 5:29。彼得在公會面前沒有暴動，也沒有停止傳福音，他溫柔地說明，然後承擔後果。分辨時有三個問題可以問：這是違背神的命令，還是只是不方便、我不同意？我能不能用合法的管道表達？我拒絕的方式，是不是仍然尊敬人？請和牧者、弟兄姊妹一起禱告商量。小組裡不評論任何政黨或人物。全卷立場見 ISS00_3。"]],["h","四、原文亮光：字帖、腳印、鞭傷"],["p","講到這裡，彼得的聲音忽然壓低了，他轉頭對聚會裡站在最後面的那一群人說話：「你們作僕人的，凡事要存敬畏的心順服主人；不但順服那善良溫和的，就是那乖僻的也要順服。」（2:18）這段最容易被誤用。新約沒有為奴隸制背書，保羅說「若能以自由，就求自由更好」（林前 7:21）。彼得是對當年沒有選擇的家僕說話，不是說那個處境是對的。"],["p","再聽下一節：「倘若人為叫良心對得住神，就忍受冤屈的苦楚，這是可喜愛的。」（2:19）「冤屈」原文是 ἀδίκως（adikōs），不公義地。冤屈就是冤屈，彼得沒有說乖僻的主人是對的。今天被霸凌、被欠薪、被騷擾的人，遇到的就是不公義；而且今天的人多半有當年家僕沒有的東西：法律、勞動申訴、離職的自由，使用它們不違背 2:18。「可喜愛的」原文是恩典：不是受苦本身討神喜悅，是一個人在冤屈裡仍不以惡報惡，這件事神看見了。接著就是全卷的樞紐：「你們蒙召原是為此；因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行。」（2:21）彼得沒有給受冤屈的人一套忍耐的技巧，他指向一個人。請記三個原文。"],["p","第一個是 ὑπογραμμὸν（hypogrammon），和合本譯「榜樣」，整本新約只出現這一次。它是學寫字的孩子用的字帖：老師先把字寫好，孩子把薄紙蓋上去，一筆一筆照著描。字帖上寫著甚麼？「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（2:23）三個動詞都是未完成式：不是一次，是一再如此，每一次被罵、每一次受苦、每一次都交託。不還口不是不說真話，主在大祭司面前被打的時候說：「我若說的不是，你可以指證那不是；我若說的是，你為甚麼打我呢？」（約 18:23）他指出不公義，卻不以惡報惡。交託也不是假裝沒事，是把手裡那支法槌，交給一位按公義審判的。"],["p","第二個是 ἴχνεσιν（ichnesin），腳印；前面的動詞是緊緊跟在後面。雪地裡，後面的人把腳放進前面的人踩出的坑裡。寫這幾句話的人，曾經最不會跟：主被捉拿的那一夜，他「拔出來，將大祭司的僕人砍了一刀」（約 18:10），砍的正是一個僕人；多年以後，同一個人寫信叫一群僕人緊跟主的腳印。不是彼得自己學會了，是主在海邊又對他說了一次：「你跟從我吧！」（約 21:19）跟隨他的腳蹤，不是叫人去找苦吃，也不是叫人留在危險裡；腳印的方向是不以惡報惡、把審判交給神，這和離開危險、尋求法律保護並不衝突。"],["p","第三個是 μώλωπι（mōlōpi），鞭傷，新約也只出現這一次。可是彼得在說它以前，先說了另一件事：「他被掛在木頭上，親身擔當了我們的罪，使我們既然在罪上死，就得以在義上活。」（2:24）上一段說他是榜樣，這一節說他是救主。我們效法的那一位，先是替我們擔當罪的那一位。如果只有字帖沒有救主，信仰就只是一套描不出來的道德；手在發抖的人描得下去，是因為那一雙手先握住了他的手。μώλωψ 是鞭子打過以後，皮膚上腫起來的那一道痕，而且是單數：一道傷，醫治了眾人。彼得是在對家僕說話，那是他們最熟悉、也最羞恥的傷。「因他受的鞭傷，你們便得了醫治。」（2:24）受冤屈的人常覺得沒有人懂；他懂，因為他背上有同樣的痕跡。"],["p","這裡說的醫治，上下文很清楚：在罪上死，在義上活。這一節不保證身體一定痊癒，也不是說沒得醫治的人信得不夠；神當然可以醫治身體，生病的人該求醫，也可以求神。這一節要我們抓住的是更深的醫治：罪不再定我們的命運，羞恥也不再是我們最後的名字。全章最後一節：「你們從前好像迷路的羊，如今卻歸到你們靈魂的牧人監督了。」（2:25）「歸到」原文是轉回來，跟主對彼得說「你回頭以後」是同一個字。被找回來的羊，寫信給一群迷路的羊。"],["d",["公司欠我三個月薪水，主管還常常當眾羞辱我，照 2:18 我是不是應該忍下去？","不是。2:19 已經把它定了性：「冤屈」原文是不公義地，彼得沒有說乖僻的主人是對的。他對當年沒有選擇的家僕說話，你今天多半有他們沒有的東西：法律、勞動申訴、離職的自由，使用它們不違背 2:18。可以這樣做：第一，把每一筆欠薪和每一次被羞辱的日期、地點、在場的人寫下來，保存訊息和薪資單。第二，查清楚你所在地的勞工主管機關或求助專線，打一通電話問清楚權益。第三，找一位信得過的弟兄姊妹或牧者陪你。2:23 的不還口，指的是不回罵、不報復、不在背後毀謗；說出真相、走正當的管道，跟它不衝突。若有騷擾或威脅到安全，先保護自己。全卷立場見 ISS00_3。"]],["d",["2:24 說「因他受的鞭傷，你們便得了醫治」，那我生病禱告了沒有好，是不是信得不夠？","不是。先看上下文：同一節說「使我們既然在罪上死，就得以在義上活」，彼得講的醫治，主要是罪的醫治；接下來一節說迷路的羊歸到牧人那裡，也是靈魂的事。他是在對身上有鞭痕的家僕說話，那一道傷是為他們受的，叫罪不再定他們的命運。這一節不保證身體一定痊癒，更不可以拿來說沒好的人信心有問題。神當然可以醫治身體，生病的人該看醫生、按時吃藥，也可以求神醫治，兩者並行。那位背上有傷的主懂你的痛。若病痛影響到睡眠、情緒和盼望，也請讓牧者和專業的人陪你。疾病與醫治的問題，見雅各書立場四。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是先講 321「建立屬神的體系」，再拿 2:4--10 的活石、靈宮當插圖，甚至把「被建造成為靈宮」講成建堂、擴點、人數成長的口號。彼得的次序是先有被棄的石頭，再有被神建造的人；體系是在末端認出來的。"],["p","第二個偏差，是用被動語態去壓人：你不肯接這個服事，就是不肯被砌，就是有己。砌石頭的是神的手，不是同工會的排班表；這一節本來是安慰覺得自己沒用的人。"],["p","第三個偏差，是用 2:18 和 2:23 叫被霸凌、被欠薪、被騷擾的人忍下去，說這是你的十字架，把申訴就是不順服講成屬靈，這是錯的。不還口是不以惡報惡，不是讓不公義消失在沉默裡。"],["p","第四個偏差，是用 2:13--17 作政治動員，或反過來講成政府說甚麼都要照做。2:17 只有神得到敬畏，君王得到的是和眾人一樣的尊敬；順服的理由是主，界線也是主，徒 5:29 是彼得自己的話。"],["p","第五個偏差，是把 2:24 講成身體醫治的保證：只要宣告這一節病就會好，沒好就是信心不足，這是誤用；或把 2:21 講成要人去找苦吃，越苦越屬靈，這也是錯的。鞭傷醫治的上下文是罪；受侵害也不是要我們忍受的苦。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族裡的寄居者。清明節回鄉，一家人站在牌位前，每個人手裡都有香，只有你的手是空的。叔叔說了一句：讀書讀到連祖宗都不要了。你沒有搬家，在自己的家族裡卻成了外人。彼得給的路不是辯論，也不是躲開不回去，是 2:12 的好行為和 2:17 的尊敬眾人：不拿香，卻是第一個到、最後一個走的；不跪拜，卻把長輩的藥和醫院的掛號安排得清清楚楚。外人一直在細看，孝順是他們讀到的第一頁。"],["p","第二個問題：家醜不可外揚的職場。不少華人信徒覺得，被欠薪、被當眾羞辱最好吞下去，說出來就是不夠屬靈，這是誤會；從家鄉到外地作家庭幫傭、作移工的弟兄姊妹，更常常連可以問誰都不知道。可是 2:19 已經把它定了性：那叫冤屈，是不公義。不還口，是不在群組裡回罵、不報復；把事實和日期寫下來、打勞工求助專線、走正當的管道，是另一件事，不違背 2:18。"],["h","七、活出321——被砌進去的人"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：2:21--23 是全本新約最具體的一處，一張字帖、一串腳印、三個一再如此的動作：不還口，不威嚇，交託。可是請記得次序，這位榜樣先是救主，「親身擔當了我們的罪」（2:24）；我描得出這張字帖，是因為那雙手先握住了我的手。"],["p","聖經是我的準則：2:2 說神的道是不摻假的奶。被冤枉的那一天，最需要的不是一套說法，是一口不摻假的道。"],["p","聖靈是我的引導：被建造成的是「靈宮」，獻上的是「靈祭」（2:5）。把石頭一塊一塊砌在一起的，不是我們的熱心，是神的靈；被罵想還口的那一刻，攔住舌頭的也是他。"],["p","讓耶穌作王：2:17 只有神得到敬畏。老闆、家族長輩、群組裡的輿論都只得到尊敬；當我怕誰的臉色勝過敬畏神，那個位置就被別人坐走了。2:23 也要我從法官席上下來，讓那一位按公義審判。"],["p","讓耶穌得著一切的榮耀：2:12 的目標不是讓人看見我有多好，是讓毀謗我的人有一天「歸榮耀給神」；2:9 的四個名字，也是為了宣揚他的美德，不是我的。"],["p","建立屬神的體系：讀完 2:4--10 才看得見，屬神的體系不是先有一棟建築或一張組織圖，是先有一塊被人丟棄、被神高舉的活石，再有一群來到他面前的人，被神一塊一塊砌上去。族類、祭司、國度、子民，全是集合名詞；國度321空中團契散在各國，每一個小組員都是祭司，都是把人帶到神面前的人。神國的領土不必先有一塊地，它先是一群人。"],["d",["我們是一個散在各國的線上團契，沒有自己的會堂，2:5 的靈宮要怎樣落實？","彼得的讀者也沒有聖殿可去，他正是對這樣的人說「你們就是殿」。靈宮不是一棟建築，是一群不斷來到主面前、被神砌在一起的人。線上團契可以從三件事開始。第一，一起喝奶：同一週讀同一段經文，在小組裡分享一句讀到的話，讓道成為大家共同的食物。第二，每一個人都是祭司：不是只有組長禱告，每一個組員輪流為一位指名的弟兄姊妹禱告，並且私下傳一句話給他。第三，彼此托住：組裡有人在職場受冤屈、在家族裡被誤會，大家一起禱告，也一起把可以求助的資訊找齊。同時記得，砌的人是神，不是排班表；不必用人數或活動量來量這座殿。"]],["h","八、四種心，誰肯被砌進去"],["p","驕傲型的心，被冤枉時一定要贏：要大家知道我是對的，要在群組裡留下最後一句話，手裡一直握著那支法槌。請看那一位：他把判決交給按公義審判的。把法槌交出去，不是輸了，是讓對的那一位作法官。"],["p","恐懼型的心，最怕的是別人的臉色：怕老闆、怕長輩、怕被排擠，所以要嘛拚命討好，要嘛甚麼都不敢說。請你聽 2:17 那一個字：敬畏只給神。敬畏回到該在的地方，人的臉色就變回一張臉。"],["p","羞恥型的心，覺得自己就是牆角那一塊：離過婚、失過業、跌倒過、被家族看不起。請記得 2:4 那塊被人退貨的石頭，神偏偏揀選了它；2:10 說你從前算不得子民，現在是神的子民。你最怕被人看見的那一道痕，他背上也有。"],["p","受傷型的心，也許正是被老闆、被家人，甚至被教會裡的人冤屈過，還被要求為了見證忍下去。那些話本來就不是 2:18 的意思。冤屈就是冤屈，你不需要先原諒才算屬靈；那位背上有鞭傷的主懂你。若你仍在危險或侵害裡，先讓一位信得過的人陪你找到安全，必要時尋求專業和法律的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 2:1--5 或 2:21--25 其中一段，像嬰孩愛慕奶那樣慢慢讀，然後對主說一句：今天我再一次來到你面前，請你把我砌進去。"],["p","第二，每當你想在群組裡回嗆、或在心裡記帳，就停三秒，寫下時間和那一句最想說的話；週末讀一遍，分辨哪一句是說真話，哪一句是想報復。"],["p","第三，挑一位曾經說你壞話、或讓你受委屈的人，在星期三以前為他做一件具體的好事，同時每天為他禱告一句。行善和申訴可以同時做，這一件不是討好。若對方仍在傷害你，改成只為他禱告，不必接近他。"],["p","第四，如果你正面對欠薪、霸凌或騷擾，這一週把事實和日期寫下來，查清楚勞動申訴或求助的管道，並找一位信得過的弟兄姊妹陪你一起看。"],["p","第五，週末抄寫一遍 2:21--24，像描字帖一樣一筆一筆寫；寫到「鞭傷」兩個字時停下來，為那一道為你受的傷說一句謝謝。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我是被神揀選、被神砌進靈宮的一塊活石，不是被丟在牆角的石頭。"],["p","我宣告：我在地上是寄居的，為主的緣故好好作鄰舍、作公民，敬畏只給神一位。"],["p","我宣告：被冤枉的時候，我不還口、不威嚇，也不假裝沒事，我把判決交給那按公義審判人的主。"],["p","我宣告：因他受的鞭傷，我的罪得了醫治；我要跟著他的腳蹤，一步一步走。"],["d",["要我為曾經說我壞話的人做一件好事，這樣會不會變成討好，或讓他更得寸進尺？","這是好問題。2:15 的行善，是因為神的旨意，不是為了換取對方的好感，所以不是討好；討好是怕他，行善是敬畏神。實際的分辨有三點。第一，做的是一件具體、有限度的好事，例如代一次班、在別人背後說一句他的好話，不是無止境地讓步。第二，行善不等於放棄真相：如果他做的事是不公義的，照樣可以把事實寫下來、走正當的管道，行善和申訴可以同時做。第三，若對方是持續傷害你、或讓你感到不安全的人，這一題就不適用，先保護自己，不必去接近他，你可以只為他禱告。"]],["h","十、結語"],["p","第二章從牆角開始，在牧人身邊結束。一塊被退貨的石頭，成了房角的頭塊石頭；一群在家鄉沒有位置的人，被砌成一座沒有牆的殿；全卷五篇望、石、福、火、牧，這一章是石：盼望從空墳墓開始，現在有了一座殿，也有了一串腳印。"],["p","這一課的焦點，不在我們夠不夠堅強、能忍多久，也不在彼得從拔刀到寫信改變了多少，焦點在那一位被人所棄、又被神高舉的活石。所以這一章的次序是這樣的：先來到他面前，「你們來到主面前，也就像活石」（2:5）；再跟著他的腳印，「叫你們跟隨他的腳蹤行」（2:21）；而能夠跟得上，是因為「因他受的鞭傷，你們便得了醫治」（2:24）。請你不要更佩服彼得，請你更愛那一位沒有放棄彼得、也沒有放棄你的主。"],["p","我們一起低頭禱告。揀選那塊被人所棄的石頭、又把我們一塊一塊砌上去的父神，謝謝你，在人退貨我們的地方，你說我們是寶貴的。求你叫我們天天愛慕你不摻假的道；在家族裡、在辦公室裡作好鄰舍，敬畏只歸給你。被冤枉的時候，求你攔住我們的舌頭，也給我們說真話、求公道的勇氣，把判決交給你。求你保護那些正被欺壓、被欠薪、被傷害的弟兄姊妹，讓他們找到安全和幫助。謝謝主耶穌，你背上的那一道傷，醫治了我們。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰忍得最多，是讓每一個人說出一次被退貨的經驗、一支握在手裡的法槌，和這一週要踩進去的第一個腳印；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是退貨、戶籍、字帖。席上可能有正在職場被欠薪、被霸凌的人，有在家族裡因信主被排擠的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：被棄的石頭被神高舉；為主的緣故是理由也是界線；效法的那一位，先是擔當罪的那一位。"],["n","1. ★ 開場工地上那兩句話，「這一塊不要了」「搬到牆角去」，讓你想起自己哪一次被人敲一敲、搖搖頭的經驗？簡單說是在哪裡、幾歲的時候。"],["n","2. ★★★ 請用自己的話說：為甚麼彼得先講 2:21 的榜樣，緊接著就講 2:24 的擔當？如果只有字帖沒有救主，跟隨耶穌會變成甚麼樣子？"],["n","3. ★★ 2:17 對君王和對眾人都是尊敬，只有神得到敬畏。說一個你生活裡的例子：哪一個人或哪一種臉色，最容易搶走那個敬畏的位置？"],["n","4. ★★ 石頭不會自己砌牆。這句話對你是安慰還是壓力？你在團契裡像一塊散落的石頭，還是已經被砌進去了？"],["m","帶領提醒：談 2:13--17 時只談原則，不評論任何政黨、政治人物或政策；有人問 2:8 預定的問題，一句指向議題頁，不在組裡辯論。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一次被冤屈的經驗、一支還握在手裡的法槌，並說出這一週要踩進去的第一個腳印。"],["t","【看】看見自己"],["n","5. ★★★ 說出最近一次你被誤會或被冤枉的事：在家族、公司、教會還是群組裡？那一刻你的第一個反應，是回嗆、吞下去，還是別的？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:21--24 兩遍。在哪一個詞上你停了下來：字帖、腳蹤、交託，還是鞭傷？今天那一個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你描不下那張字帖，卡在哪裡：怕吃虧、怕沒有人替你討公道、覺得自己不配，還是傷得太深不想再信任人？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「那一件事，我把判決交給那按公義審判的主。」說出是哪一件事就好，不必說細節。右手邊的人只回一句「他懂」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要踩進去的第一個腳印：哪一天、對哪一個人、做哪一件不以惡報惡的事；若你正面對不公義，也寫下這一週要找誰談、查哪一個管道。"],["m","帶領提醒：這一化可能碰到職場霸凌、欠薪、性騷擾、家庭傷害、長期病痛與長期無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出仍在欺壓或危險之中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助他找到勞工求助或法律管道，並協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一口道、一件善事、一個要陪的人、一位要講給他聽的朋友。"],["n","10. ★★ 說出一位曾經讓你受委屈的人（可以只說稱呼），這一週星期幾、你要為他做的那一件具體的好事是甚麼？（若對方仍在傷害你，改成只為他禱告，不必接近他。）"],["n","11. ★ 這一週你每天早上幾點、在哪裡讀 2:1--5 或 2:21--25？讀完要對主說的那一句話是甚麼？"],["n","12. ★★ 在你最常被誤會的地方，這一週你要刻意做的一件「好看」的事是甚麼？說出時間和地點。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位在家裡或職場正受冤屈、或在家族裡被誤會的人。當場說出他的名字，說出這一週哪一天、在哪裡，你要先聽他說，再和他一起讀 2:21--24。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，耶穌是一塊被人退貨的石頭，可是神把他立為房角石。第二句，他被冤枉時不還口，把審判交給神，還替我們擔當了罪。第三句，所以你被冤枉的時候，有一位懂你的人，也有一串可以跟的腳印。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多忍耐」這類答案；不在組裡評斷任何一位老闆或同事。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要踩進去的第一個腳印是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位在不信的家族裡因信主被誤會的人，一位在職場受冤屈、被欠薪或被霸凌的人，一位在外地工作、寄人籬下的移工或家庭幫傭。"],["p","最後由組長慢慢讀一遍：「你們從前好像迷路的羊，如今卻歸到你們靈魂的牧人監督了。」（2:25）"]]},"3":{"no":3,"vol":"《321彼得前書講義》第三課·彼得前書第三章","title":"正好相反的那條路——不怕恐嚇、倒要祝福、尊主為聖","chars":5188,"min":60,"deep":8,"dchars":1748,"tchars":1425,"blocks":[["h","一、一句老話，和彼得的第三條路"],["p","弟兄姊妹平安。華人家裡有一句老話，很多人是聽著長大的：忍一時風平浪靜，退一步海闊天空。媳婦受了委屈，長輩這樣勸；在公司被冤枉，同事這樣勸。這句話有它的智慧。可是把它和彼得的一句話並排放著，你會發現，它們很像，卻不是同一件事。"],["p","彼得說：「不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。」（3:9）被人惡待的時候，人通常只看見兩條路。一條是報回去。另一條就是那句老話：忍下來，吞下去，關起門來一個人難過。彼得兩條都沒有選，他指出第三條路，叫作祝福。忍，是把話吞回肚子裡；祝福，是把那個人帶到神面前。忍一時，不一定風平浪靜，有時候只是把浪留給自己一個人；祝福，是把審判交還給神，把自己的手空出來。"],["p","這封信寫給小亞細亞五個地區的寄居者。他們多半是外邦人，信了主以後沒有搬家，卻在自己的家鄉成了外人：節慶不再上香，鄰舍就以為怪，毀謗他們。第三章碰到的，是最貼身的那一層：家裡。一位信了主的妻子，丈夫不信；一群被辱罵、怕得睡不著的人。全卷望、石、福、火、牧，這一章是「福」，是祝福這個動作。"],["p","往下讀以前，先說一句要緊的話，因為這一章最常被誤用。如果今天有人在家裡正活在打罵、威脅或控制裡，請你先聽清楚：這一章沒有要你留在危險裡。等一下我們會在經文裡看見，彼得自己畫了一條線。這一課用三個詞走完：不怕恐嚇，倒要祝福，尊主為聖。"],["d",["開場那句「忍一時風平浪靜」難道就完全不對嗎？忍耐不也是聖經教的美德嗎？","忍耐當然是美德，2:20 也說因行善受苦能忍耐，在神看是可喜愛的。這一課要拆開的，不是忍耐本身，是那句老話常被用出來的方式：只要不吵就好，把委屈吞下去，事情就算過去了。聖經的忍耐有一個方向，是把自己交託那按公義審判人的主，所以忍耐的人並沒有放棄公義，只是把審判交出去。老話的忍，常常沒有對象，只是壓著。分辨的方法很簡單：你忍下來以後，心裡是越來越恨，還是越來越能為那個人禱告？你忍下來以後，危險有沒有停止？若是越忍越恨，或越忍越危險，那就不是 3:9 的路了。"]],["h","二、同一個「同樣」：妻子六節，丈夫一節"],["p","第三章第一個字，原文是「同樣」，把我們拉回上一章的總綱：「你們為主的緣故，要順服人的一切制度」（2:13）。理由是這一句，界線也是這一句。然後彼得說：「你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來」（3:1）。在第一世紀，妻子要拜丈夫家的神，這位妻子卻在最要緊的事上沒有跟丈夫走，彼得沒有叫她回頭。他承認她的良心是她自己的。"],["p","彼得給她的方法是不用言語。「感化過來」原文是被贏得；丈夫不是被說贏的，是被看見的：「這正是因看見你們有貞潔的品行和敬畏的心。」（3:2）可是經文說的是「也可以」，不是保證。配偶信不信，是聖靈的工作和他自己的回應，不是妻子的成績單。"],["p","接著是打扮：「你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾，只要以裡面存著長久溫柔、安靜的心為妝飾；這在神面前是極寶貴的。」（3:3--4）第三樣「穿美衣」原文只是穿上衣裳。若是禁令，連衣服都不能穿了。這不是服裝規定，是外面和裡面的對比。「長久」原文是不能壞的，金子會壞，心裡隱藏的那個人不會。溫柔不是軟弱，安靜是心裡不慌，不是不准說話。"],["p","然後彼得舉撒拉：「就如撒拉聽從亞伯拉罕，稱他為主。你們若行善，不因恐嚇而害怕，便是撒拉的女兒了。」（3:6）舊約裡撒拉稱丈夫為主，只有一次：「撒拉心裡暗笑，說：『我既已衰敗，我主也老邁，豈能有這喜事呢？』」（創 18:12）是她在帳棚裡自言自語的時候。彼得挑的不是卑躬屈膝的場面，是一個在不可能裡還盼望神的女人。撒拉的女兒，是用兩件事認出來的：行善，不因恐嚇而害怕。"],["p","講到這裡停下來，就只講了一半。「你們作丈夫的也要按情理和妻子同住；因她比你軟弱，與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙。」（3:7）「也要」又是那個「同樣」，丈夫不是家規的例外。「按情理」原文是知識：弟兄，你要認識她，她怕甚麼，累在哪裡。「比你軟弱」原文是較軟弱的器皿，「較」字說明丈夫也是器皿，男女都是瓦器；這指的是當時在體力、法律、經濟上的弱勢，不是智力、靈性或價值。同一節馬上說，她是與你一同承受生命之恩的。"],["p","最後一句叫人心驚：禱告沒有阻礙。「阻礙」原文是在路上挖一條溝，把人擋住。神把你怎樣對待妻子，和你怎樣來到他面前，綁在一起。所以講 3:1--6，必講 3:7。互補派和平等派讀這段家規看法不同，都是弟兄姊妹，本講義不在兩派之間裁判；可是兩派都繞不過這一節，也都必須同意：順服不等於同意，不等於沉默，更不等於留在危險裡。全卷立場見 ISS00_3。"],["d",["我的配偶信主到現在已經很多年都還不信，是不是因為我的品行不夠好？","不是。3:1 說的是「也可以」，不是保證。一個人信不信主，是聖靈在他心裡的工作，也是他自己在神面前的回應，不是配偶的成績單。彼得給的是一條很慢的路，不用言語，天天活出來；他沒有說走了這條路的人，一定在幾年之內看見結果。有人為配偶禱告了二十年才看見對方回轉。你持守的每一天，在神面前都不是白費的，3:4 說那顆心「在神面前是極寶貴的」。若有人對你說，你丈夫不信是因為你不夠溫柔，那是把彼得的話講錯了。你可以把重擔放下一點，把他交給神，也讓小組陪你一起為他禱告。"]],["d",["3:7 說妻子是「較軟弱的器皿」，這是不是說女人在神面前比男人差？","不是。原文是比較級，「較軟弱的」器皿，意思是丈夫也是器皿，只是較不軟弱；保羅說我們都是瓦器，男女都一樣。多數解經者理解這裡說的是當時的處境：第一世紀的妻子在體力、法律、經濟上都處於弱勢，最容易被傷害。這不是說女性的智力、情緒或靈性比較差。彼得在同一節馬上說她是「與你一同承受生命之恩的」，在神面前，她和丈夫承受同一份恩典、同一個永生。強的一方要做的，是把尊榮分給她，否則他的禱告會有阻礙。所以這一節不是貶低女性，是對有力量的那一方提出很重的要求。"]],["h","三、原文亮光：恐嚇、正好相反、尊為聖"],["p","這一章有三個原文字，剛好是一條路上的三站。"],["p","第一個字是 πτόησιν（ptoēsin），3:6「不因恐嚇而害怕」的「恐嚇」。整本新約只出現這一次，是叫人心驚膽跳的那種驚嚇和威脅；前面還加了 μηδεμίαν（mēdemian），任何一種都不。彼得要的順服，和懼怕是分開的。被恐嚇出來的服從，不是 3:1 的順服。所以，人身安全受到威脅的時候，先保護自己和孩子的生命，向可信任的人、教會、社工、警方求助，依法申請保護，涉及兒少的事件依法通報。這樣做不違背 3:1--6，這正是 3:6。教會也絕不可以拿這一段勸人回到危險裡。"],["p","第二組字是 τοὐναντίον δὲ εὐλογοῦντες（tounantion de eulogountes），「倒要祝福」。3:9 先寫兩個交換：以惡換惡，以辱罵換辱罵，原文的 ἀντί（anti）就是交換。然後一個 τοὐναντίον（tounantion），正好相反。不是不回應，是換一個方向完全相反的回應。εὐλογέω（eulogeō）字面是說好話：在神面前，為那個人說好話。「辱罵」和 2:23 主被罵不還口同字根；「為此蒙召」和 2:21 蒙召跟隨他的腳蹤，一字不差。原來祝福人，就是跟著那串腳印走。"],["p","寫這句話的人，曾經在園子裡拔出刀來，「將大祭司的僕人砍了一刀，削掉他的右耳」（約 18:10）。主對他說：「收刀入鞘吧」（約 18:11）。三十年後，這個拔過刀的人寫信叫人祝福。不是彼得的修養變好了，是主沒有放棄他，帶他走過十字架和空墳墓，讓他看見另一種回應。"],["p","可是請聽清楚：祝福不是縱容惡人，不以惡報惡也不等於不追究責任、不申訴、不報警。報復，是我自己搶回審判的權柄；申訴、報警，是把事情交給神所設立的秩序。祝福拒絕的是仇恨，不是公義。彼得接著引詩篇：「因為，主的眼看顧義人；主的耳聽他們的祈禱。惟有行惡的人，主向他們變臉。」（3:12）審判在主手裡，我的手才空得出來。"],["p","第三組字是 κύριον δὲ τὸν Χριστὸν ἁγιάσατε（kyrion de ton Christon hagiasate），「只要心裡尊主基督為聖」（3:15）。前一節剛說「不要怕人的威嚇，也不要驚慌」（3:14），那是全章的低谷。這一句取自以賽亞：「但要尊萬軍之耶和華為聖，以他為你們所當怕的，所當畏懼的。」（賽 8:13）彼得只換了一個名字：萬軍之耶和華，換成主基督。這是全卷最清楚的基督神性宣告。人心裡有一張椅子，坐在那裡的，就是我們最怕失去、最想討好的那一位。懼怕不是靠意志壓下去的，是被一個更大的敬畏取代的。心裡的王座只有一位；他坐穩了，別人的威嚇就坐不上去。"],["d",["如果我現在正在家裡被打、被威脅、被控制，這一章要我怎麼做？","請你先聽清楚：這一章沒有要你留在危險裡。3:6 說「不因恐嚇而害怕」，被恐嚇出來的服從，不是彼得說的順服。你的安全和孩子的安全是第一件事。可以這樣做：先找一位信得過的人，把事情照實說出來；把當地的家暴保護專線存在手機裡，例如台灣是 113，有急迫危險就直接報警；向社工、警方求助，依法申請保護令。這些都不違背聖經，也不是沒有見證。你不需要先原諒他，也不需要先祝福他，才能求助。教會同工應該相信你、陪你，不是勸你回去忍耐。全卷立場見 ISS00_3。"]],["d",["既然要倒要祝福，那我在職場被霸凌，還可以申訴、甚至報警嗎？","可以。祝福和申訴不衝突，報復和申訴才是兩回事。報復，是我自己把審判的權柄搶回來，要對方也嚐嚐同樣的痛；申訴、報警、走法律程序，是把事情交給神所設立的秩序。所以一個被霸凌的人，可以在神面前為對方說好話，求神改變他，同時把日期、訊息、證據整理好，照程序申訴。分辨的地方在心裡：我是要他受罰才甘心，還是要真相被看見、傷害能停止？前者是以惡報惡，後者是公義。把祝福講成不要再提、不要申訴，會讓加害的人更安全，那不是彼得的意思。全卷立場見 ISS00_2 與 ISS00_3。"]],["h","四、他已經得勝：引我們到神面前"],["p","心裡尊主為聖的人，就能回答心中盼望的緣由。寫這句話的人，有一個晚上被使女問過，他說：「我不知道，也不明白你說的是甚麼。」（可 14:68）復活的主把他找回來，現在他叫我們常作準備：不必贏辯論，只要以溫柔、敬畏的心，把盼望的來源說出來。「神的旨意若是叫你們因行善受苦，總強如因行惡受苦。」（3:17）受苦本身不是美德，因甚麼受苦才是；為義受苦的人可以傷心，可以求助，有福不是要他假裝不痛。"],["p","然後彼得用一個「因」字，把受苦的人帶到全章的山頂：「因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。」（3:18）你走的路，他先走過。我們為義受苦，他為罪受苦；我們受苦救不了任何人，他受苦是義的代替不義的。我們效法的那一位，先是替我們擔當罪的那一位。「一次」是一次永遠，不必再補，也不能再加。受苦的目的寫得很清楚：引我們到神面前。"],["p","接著是新約最難解的一句：「他藉這靈曾去傳道給那些在監獄裡的靈聽，」（3:19）各家讀法不同，講義的議題頁都並陳了；教學場上我們只抓住一件事：重點是他得勝了。這一節不教死後第二次機會，也不叫我們斷定任何一位亡者的去處，特別是沒有信主就過世的家人。神是公義的，也是滿有憐憫的，我們把所愛的人交在他手裡。全卷立場見 ISS00_4。"],["p","彼得接著提到挪亞一家八口，然後是洗禮：「這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們；這洗禮本不在乎除掉肉體的污穢，只求在神面前有無虧的良心。」（3:21）救人的是復活的基督，不是水。所以我們不說受洗就自動得救，也不說沒有受洗就不能得救，十字架上的強盜沒有機會受洗，主對他說：「今日你要同我在樂園裡了。」（路 23:43）可是洗禮也不是可有可無，它是信的人在神面前的回應，主吩咐了，我們就順服。各宗派的看法，本講義不裁判。"],["p","最後一節：「耶穌已經進入天堂，在神的右邊；眾天使和有權柄的，並有能力的，都服從了他。」（3:22）這一章從「順服」開始，以「服從了他」結束。寄居的人能不以惡報惡、不因恐嚇而害怕，是因為真正的王已經坐在寶座上。你不必替自己爭回寶座，寶座上已經有人了。"],["d",["3:19 的「監獄裡的靈」到底是誰？我父親沒有信主就過世了，這一節跟他有關嗎？","這一節是新約最難解的經文之一，歷代有五種主要讀法，講義的議題頁都並陳了；本講義的主要讀法是復活升天的基督，向被拘禁的墮落靈界宣告他的得勝。教學場上不必解決每一個細節，只要抓住重點：他得勝了，一切都服從了他。至於你的父親，這一節沒有給我們權柄斷定任何一位亡者的去處，我們不教死後還有另一次機會，也不宣判他在哪裡。我們知道神是公義的，也是滿有憐憫的。你可以把父親交在他手裡，把心裡的痛向他說出來，也把這份痛轉成為還活著的家人禱告。全卷立場見 ISS00_4。"]],["d",["我信主了但還沒有受洗，3:21 是不是說我現在還沒有得救？","不是。3:21 說得很清楚，拯救是「藉著耶穌基督復活」，不是水本身；彼得自己說，這洗禮本不在乎除掉肉體的污穢。救你的是那位復活的主，你信靠他，就已經屬於他了。十字架上的強盜沒有機會受洗，主卻對他說今日你要同我在樂園裡。可是這不表示洗禮可有可無。洗禮是信的人在神面前的回應與承諾，是主吩咐的，所以我們順服。若你已經信主，可以和牧者談談受洗的時間，不是為了補上得救的條件，而是用這一步向神、向人說：我是他的人了。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 3:1--6 對受暴力、受控制的妻子說：你要順服，要用品行去感化他，神會改變他。這是誤用，而且是危險的誤用。彼得自己說「不因恐嚇而害怕」，被恐嚇出來的服從不是順服；人身安全受威脅時，先保護生命、依法求助、通報。"],["p","第二個偏差，是只講妻子的六節，跳過丈夫的一節；或把 3:7「軟弱的器皿」講成女人在智力、情緒、靈性上比較差，不適合思考、不適合作決定。這不是經文的意思。器皿男女都是，同一節說她是一同承受生命之恩的；強的一方要把尊榮分給她，不是利用這個落差。"],["p","第三個偏差，是把 3:3--4 講成衣著規條，拿化妝、首飾、髮型來量一位姊妹的屬靈程度。第三樣原文只是穿上衣裳，對比是外面和裡面，不是禁止外面，這使我們想起提前 2:9 也是同一種修辭。不打扮也不等於就有溫柔安靜的心。"],["p","第四個偏差，是用「倒要祝福」叫被欺負的人閉嘴：你要祝福他，就不要再提了，一申訴就是以惡報惡。祝福拒絕的是仇恨與報復，不是公義；申訴、報警、離開危險，和自己伸冤是兩回事。把祝福講成沉默，會讓加害的人更安全，受害的人更孤單。"],["p","第五個偏差，是拿 3:19--21 說得比經文更多：在喪禮上說亡者在陰間還可以聽福音，或反過來宣判他已經沉淪；說受了洗就保險了，或叫還沒受洗的初信者懷疑自己的得救；甚至畫出一張陰間的地圖。經文說得少的地方，我們也說得少。3:19 最重要的不是誰在監獄裡，是誰是得勝者。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：除夕夜廚房門口的那位媳婦。在不信的大家族裡，信主的姊妹最難的常常不是一場辯論，是每年那一炷香。客廳點起香，她站在廚房門口，不進也不退。婆婆說過一句：娶進門的，連祖宗都不拜。3:1 正是寫給她的。彼得沒有叫她去拜，也沒有叫她天天講道，他叫她不用言語：端一杯茶給婆婆，記得公公的藥，她不是被擋在門外的人，她是站在門口替這一家祝福的人。教會也不能讓她一個人站在那裡。"],["p","第二個問題：家醜不可外揚。華人很怕家裡的事讓外人知道，於是有些家暴在家族裡被壓了十幾年，被一句「為了孩子忍一忍」「說出去丟的是全家的臉」蓋住。有時教會也跟著說要遮掩，這不是彼得的意思。祝福不是遮掩，不以惡報惡也不是不報警。打電話給保護專線，向社工、警方求助，依法申請保護，不是不孝，不是沒有見證，是不因恐嚇而害怕。教會同工要相信她說的話，陪她找到安全，涉及兒少與性暴力的事件依法通報，不在教會裡私了。"],["h","七、活出321——心裡那張椅子"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（2:23）他為釘他的人禱告，也在被無理打臉時平靜地問：「你為甚麼打我呢？」（約 18:23）祝福和說出真相，在他身上同時存在。"],["p","聖經是我的準則：3:10--12 彼得引詩篇三十四篇，大衛寫這篇詩的時候正在逃命。被辱罵的時候怎樣說話，準則不是當下的情緒，是「禁止舌頭不出惡言，嘴唇不說詭詐的話」（3:10）。"],["p","聖靈是我的引導：祝福仇敵不是咬牙擠出來的，是聖靈在心裡結出的果子；他也引導我們分辨，甚麼時候要開口，甚麼時候要離開危險。"],["p","讓耶穌作王：「只要心裡尊主基督為聖」（3:15）。這一章點出三個常被佔走的位置：別人的威嚇坐的位置，我的報復坐的位置，還有「我要改變他」坐的位置。讓耶穌作王，就是這三個人都請下來。"],["p","讓耶穌得著一切的榮耀：「叫那誣賴你們在基督裡有好品行的人自覺羞愧」（3:16）。被冤枉的人不必替自己爭面子，讓真相說話，榮耀歸給主。"],["p","建立屬神的體系：3:8 說要「彼此體恤，相愛如弟兄」。祝福人的力量，不是一個人撐出來的，是一群人彼此體恤養出來的。教會要作配偶未信者的家，也要有保護人的制度：同工認得家暴與控制的徵兆，知道求助與通報的管道。"],["h","八、四種心，誰坐在心裡的寶座上"],["p","驕傲型的心，被冤枉了一定要討回公道到最後一個字，連在家裡傳福音，也是要證明我對你錯。它看起來在爭真理，其實在爭寶座。請你看那位拔過刀的彼得，和那位對他說收刀入鞘的主。主沒有輸，他只是不用那把刀。"],["p","恐懼型的心，誰大聲就聽誰，婆婆的臉色、主管的一句話，就能讓你整夜睡不著；有時候被恐嚇出來的服從，還以為是順服。彼得沒有罵寄居的人怕，他給了一張寶座。會怕不是罪，焦慮和恐慌也可以帶到主面前，可以禱告，也可以看醫生。"],["p","羞恥型的心，覺得自己不配：丈夫到現在還不信，是不是我不夠好？婚姻走不下去，是不是我沒有順服好？請聽「也可以」三個字，那不是你的成績單。基督義的代替不義的，就是為了把覺得自己站在門外的人，引到神面前。"],["p","受傷型的心，也許正是被家裡最親的人傷的，又被一句「要順服、要祝福」堵住過，那些話本來就不是這一章的意思。你不需要先原諒才算屬靈，也不需要先祝福才能求助。若你仍在危險裡，先讓一位信得過的人陪你找到安全，必要時尋求專業的協助。祝福是之後的事，而且是主陪你一起走的事。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 3:15 上半句，禱告：主基督，今天請你坐在我心裡的寶座上；誰的話讓我害怕，我就把他交給你。"],["p","第二，寫下一位曾經嘲笑、冷待或冤枉你的人的稱呼，七天裡每天為他說一句具體的祝福：他的健康，他的孩子，他的工作。若那個人正在傷害你，先顧安全，這一項可以等。"],["p","第三，給自己的通訊軟體定一條規矩：被激怒時，任何回覆都等到隔天早上禱告以後再送出；需要澄清的事實，走正式的管道。"],["p","第四，已婚的弟兄找一個晚上問妻子：最近有甚麼事讓你累、讓你怕？然後只聽，不辯解；姊妹也可以這樣問丈夫。另外，把當地的家暴保護專線存進手機，例如台灣是 113。"],["p","第五，用三句話寫下我為甚麼有盼望：以前的我，基督為我做了甚麼，我現在心裡的盼望；這一週先對一位信徒朋友說一次。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：主基督坐在我心裡的寶座上，人的威嚇坐不上去。"],["p","我宣告：我不以惡報惡，也不把傷害吞下去；我把審判交給主，把我的手空出來祝福。"],["p","我宣告：不因恐嚇而害怕是神給我的界線，求助不是不屬靈，安全是神所看重的。"],["p","我宣告：基督義的代替不義的，已經引我到神面前；他已經得勝，一切都服從了他。"],["d",["要我七天每天為傷害我的人祝福，可是我心裡根本不想，這樣算不算假冒？","不算。祝福在 3:9 是一個蒙召的動作，不是一種要先有的感覺。很多時候，是嘴先說，心才慢慢跟上。你可以很誠實地對神說：主啊，我現在不想為他祝福，可是我願意把他交給你，求你看顧我，也求你改變他。這一句就是祝福。也不必一開始就求很大的福，可以從很小的開始：求神保守他的健康，求神叫他的孩子平安。若那個人正在傷害你，或傷口還很新，這一項可以先放下，先讓一位信得過的人陪你處理安全和傷痛，祝福可以晚一點來。神不會催一個正在流血的人。七天之後，回小組說一說哪一天最難。"]],["h","十、結語"],["p","回到開頭那句老話。忍一時風平浪靜，退一步海闊天空。彼得沒有叫我們這樣過日子。他畫了一條線，叫我們不因恐嚇而害怕；他開了一條路，叫我們倒要祝福；他指出一張椅子，叫我們心裡尊主基督為聖。"],["p","這一課的焦點，不在我們夠不夠溫柔、夠不夠忍得住，也不在那個拔過刀、後來寫出這封信的彼得，焦點在那一位被罵不還口、受了苦、復活、坐在神右邊的主。所以這一章的次序是這樣的：先看見他，「因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。」（3:18）再讓他坐上寶座，「只要心裡尊主基督為聖」（3:15）；然後才走得出那條正好相反的路：「不以惡報惡，以辱罵還辱罵，倒要祝福」（3:9）。"],["p","我們一起低頭禱告。那看顧義人、聽人祈禱的主，謝謝你，基督義的代替不義的，把我們引到你面前。求你坐在我們心裡的寶座上，叫人的威嚇坐不上去，叫我們的報復也坐不上去。求你保護那些正活在恐嚇和暴力裡的人和孩子，給他們求助的勇氣和出路，也叫我們成為他們信得過的人。求你堅固在不信的家裡孤單持守的人。求你教丈夫們按情理敬重妻子，教我們在被惡待的時候倒要祝福。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一課碰到家裡最痛的地方，小組不比誰最會忍，是讓每一個人說出心裡那張椅子上坐著誰、一句為人祝福的話，和這一週的一步；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課是全卷最敏感的一課。席上可能有正活在家暴或控制裡的人，也可能有配偶未信、孤單持守多年的人，請先讀三段帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：3:1--6 必連 3:7，不因恐嚇而害怕是界線；倒要祝福是第三條路，不等於不追究；心裡的王座只有主基督。"],["n","1. ★ 你從小聽過哪一句叫人忍的老話？是誰、在甚麼場合說的？它和倒要祝福差在哪裡？"],["n","2. ★★★ 請用自己的話說：為甚麼講 3:1--6 一定要講 3:7？3:6「不因恐嚇而害怕」在這一段家規裡畫了一條甚麼樣的線？"],["n","3. ★★ 「倒要」原文是正好相反。祝福和報回去、和吞下去各差在哪裡？為甚麼祝福和申訴、報警可以同時存在？"],["n","4. ★★ 3:15 彼得把萬軍之耶和華換成主基督。這讓你對耶穌是誰有甚麼新的認識？"],["m","帶領提醒：只談原則，不裁判互補派與平等派，不評論組員的婚姻與打扮。若討論中有人透露家庭傷害或家暴，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助與通報。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出心裡寶座上坐著誰、卡住祝福的那道關，和這一週的一句祝福。"],["t","【看】看見自己"],["n","5. ★★★ 說出這一陣子最讓你心裡發慌的一個人或一句話，可以只說稱呼。誠實地看，此刻坐在你心裡寶座上的是主基督，還是那個人的臉色？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:18 兩遍。你在哪一件事上，覺得自己站在門外？聽到「為要引我們到神面前」，今天這句話對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你祝福不出來，卡在哪裡：怕等於說他沒錯、怕又被欺負、傷口太新，還是還想報回去？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 願意的人，請對組裡說一句為某個人的祝福禱告，只說稱呼：「主啊，我把他交給你，求你看顧我，也求你改變他。」右手邊的人只回一句「主的眼看顧你」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要為哪一位祝福：星期幾、要為他求哪一件具體的事。若那個人正在傷害你，請改寫你這一週要聯絡的那一位可信任的人。"],["m","帶領提醒：這一化很可能碰到家庭傷害、家暴、婚姻破碎和長期無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不說「你要順服」「為了孩子忍一忍」；任何人都可以跳過第八題。若有人說出仍處在危險中，不在組裡處理，會後單獨關心，先確認安全，必要時協助他尋求專業協助、聯絡保護專線並依法通報。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一次按情理的對話、一條規矩、一個要陪的人、三句話。"],["n","10. ★★ 說出這一週哪一個晚上，你要問配偶或一位家人「最近有甚麼事讓你累、讓你怕？」並且只聽不辯解。"],["n","11. ★ 說出你最容易被激怒的那一個群組，給自己定一條規矩：被激怒時，回覆要等到甚麼時候、禱告以後才送出？"],["n","12. ★★ 用三句話寫下你心中盼望的緣由：以前的我、基督為我做了甚麼、我現在的盼望。說出這一週哪一天，你要先對哪一位信徒朋友說一次。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，可能是家裡還沒信主的那一位，也可能是配偶未信、在家裡孤單持守的弟兄姊妹。當場說出他的名字，說出這一週哪一天、用一通電話、一頓飯還是一張卡片，向他分享 3:18。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，被欺負的時候，除了報回去和吞下去，還有第三條路：把那個人帶到神面前祝福他。第二句，這不是叫人留在危險裡，被恐嚇的人可以求助。第三句，我做得到，是因為耶穌先替我受了苦，他現在是我心裡的王。這一週講給一個人，下次回來說他的反應。"],["
