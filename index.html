>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διὸ</td><td>Dio</td><td>所以</td><td>從讚美轉入命令</td></tr><tr><td>ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν</td><td>anazōsamenoi tas osphyas tēs dianoias hymōn</td><td>束上你們心思的腰</td><td>cu89t 註腳：原文是束上你們心中的腰</td></tr><tr><td>νήφοντες τελείως</td><td>nēphontes teleiōs</td><td>完全清醒</td><td>4:7；5:8 再用</td></tr><tr><td>ἐλπίσατε</td><td>elpisate</td><td>你們要盼望</td><td>全句唯一的主要動詞；不定過去式命令</td></tr><tr><td>τὴν φερομένην ὑμῖν χάριν</td><td>tēn pheromenēn hymin charin</td><td>正被帶到你們這裡的恩</td><td>現在式被動分詞：恩典已在路上</td></tr></table>","gram":"<p><strong>Διὸ（Dio） 是全卷第一個「所以」：前十二節是直說語氣的讚美，從這裡開始是命令。</strong>可是 1:13 只有一個主要動詞 ἐλπίσατε（elpisate），「你們要盼望」；前面兩個分詞 ἀναζωσάμενοι（anazōsamenoi） 與 νήφοντες（nēphontes） 跟著主動詞帶上命令的語氣。彼得給寄居者的第一道命令，不是「要忍耐」，是「要盼望」。</p><p>ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν（anazōsamenoi tas osphyas tēs dianoias hymōn），和合本意譯作「約束你們的心」，cu89t 註腳說「原文是束上你們心中的腰」。ἀναζώννυμι（anazōnnymi） 是把垂到腳邊的長袍撩起來，塞進腰帶，準備跑路或做工；這個動詞新約只此一次。彼得把它用在 διανοίας（dianoias） 上：束腰的不是身體，是心思。</p><p>νήφοντες（nēphontes） 是不喝醉、頭腦清醒，4:7、5:8 會再出現兩次。τελείως（teleiōs） 可以修飾前面的「清醒」，也可以修飾後面的「盼望」；和合本「專心盼望」取後者。τὴν φερομένην ὑμῖν χάριν（tēn pheromenēn hymin charin） 是現在式被動分詞：恩典「正被帶來」，已經在路上，在 ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ（en apokalypsei Iēsou Christou） 那一刻送達（與 1:7 同一個片語）。</p>","exp":"<p>「所以要約束你們的心，謹慎自守，專心盼望耶穌基督顯現的時候所帶來給你們的恩。」（1:13）讚美講完，彼得說「所以」。他的命令是從福音推出來的，不是另外加上去的規矩。</p><p>「束上心中的腰」是一幅畫。古人穿長袍，要跑、要做粗活，得先把衣襬撩起來塞進腰帶，不然會絆倒。這使我們想起出 12:11 逾越節的晚上，「你們吃羊羔當腰間束帶，腳上穿鞋，手中拿杖，趕緊地吃」（出 12:11）：那是一群隨時要動身離開為奴之地的人。彼得沒有明說這個連結，但他寫給的正是一群寄居、隨時準備上路的人。</p><p>束腰的地方是「心」。寄居的人最容易被絆倒的，不是腳，是心思：被毀謗時的胡思亂想、半夜裡的擔憂、對未來的各種想像。把心思撩起來塞好，不是不想，是想得有秩序、有方向。「謹慎自守」是頭腦清醒，不被恐懼灌醉，也不被世界的熱鬧灌醉。</p><p>然後是全句唯一的命令：「專心盼望」。盼望在這裡不是一種心情，是一個可以被吩咐的決定：把心的重量放在將來那一天。恩典「所帶來給你們」，原文是正在被帶來，像一艘已經出港的船。321 說「焦點在耶穌」：專心盼望，就是把眼睛從今天的毀謗移開，放在主顯現的那一天。不是逃避今天，是用那一天來扛今天。</p>"},{"a":14,"z":16,"star":2,"grk":"<p lang=\"grc\">ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,</p><p lang=\"grc\">ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,</p><p lang=\"grc\">διότι γέγραπται ὅτι Ἅγιοι ἔσεσθε ὅτι ἐγὼ ἅγιος</p>","lit":"<p>作為順從的兒女，不要被套進你們從前在無知中的那些私慾的模子，</p><p>而是照著那召你們的聖者，你們自己也要在一切行事為人上成為聖潔，</p><p>因為經上記著：你們要是聖潔的，因為我是聖潔的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὡς τέκνα ὑπακοῆς</td><td>hōs tekna hypakoēs</td><td>作為順從的兒女</td><td>希伯來式說法：以順從為特徵的兒女</td></tr><tr><td>μὴ συσχηματιζόμενοι</td><td>mē syschēmatizomenoi</td><td>不要被套進模子</td><td>羅 12:2 同一個動詞</td></tr><tr><td>ἐν τῇ ἀγνοίᾳ ὑμῶν</td><td>en tē agnoia hymōn</td><td>在你們無知的時候</td><td>指外邦人信主以前</td></tr><tr><td>κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον</td><td>kata ton kalesanta hymas hagion</td><td>照著那召你們的聖者</td><td>κατά：照著這個樣式</td></tr><tr><td>ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε</td><td>hagioi en pasē anastrophē genēthēte</td><td>要在一切行事為人上成為聖潔</td><td>不定過去式被動命令</td></tr><tr><td>Ἅγιοι ἔσεσθε</td><td>Hagioi esesthe</td><td>你們要（將）是聖潔的</td><td>未來式當命令用；利 11:44；19:2</td></tr></table>","gram":"<p><strong>1:14--15 是一組「不要……而是」的對照：μὴ συσχηματιζόμενοι（mē syschēmatizomenoi）……ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον（alla kata ton kalesanta hymas hagion）。</strong>συσχηματιζόμενοι（syschēmatizomenoi） 是 σύν（syn） 加「形狀、樣式」，被壓進一個現成的模子；保羅在羅 12:2 用同一個動詞：μὴ συσχηματίζεσθε τῷ αἰῶνι τούτῳ（mē syschēmatizesthe tō aiōni toutō）。舊模子是 ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις（tais proteron en tē agnoia hymōn epithymiais），「從前在無知中的私慾」；「無知」說明收信人多數是外邦人。</p><p>ὡς τέκνα ὑπακοῆς（hōs tekna hypakoēs） 是希伯來式的屬格，「以順從為記號的兒女」，接回 1:2 的 εἰς ὑπακοὴν（順服追蹤第二站）。新的樣式是 κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον（kata ton kalesanta hymas hagion）：κατά（kata） 是「照著」，聖潔的尺不是一張清單，是一位召人的神。γενήθητε（genēthēte） 是不定過去式被動命令，「要成為」。ἐν πάσῃ ἀναστροφῇ（en pasē anastrophē） 的 ἀναστροφή（anastrophē） 在彼得前書出現六次（1:15、18；2:12；3:1、2、16），比新約其他書卷都多：彼得最在意的是日常的行事為人。</p><p>1:16 διότι γέγραπται（dioti gegraptai） 引利未記：Ἅγιοι ἔσεσθε ὅτι ἐγὼ ἅγιος（Hagioi esesthe hoti egō hagios）。ἔσεσθε（esesthe） 是未來式直說語氣，在律法裡當命令用；SBLGNT 的後半句沒有動詞，「因為我——聖潔」。</p>","exp":"<p>〔舊約〕利 11:44--45（利未記講義第 11 章）</p><p>〔舊約〕利 19:2--2（利未記講義第 19 章）</p><p>「你們既作順命的兒女，就不要效法從前蒙昧無知的時候那放縱私慾的樣子。」（1:14）寄居的人搬不了家，可是他們從舊的模子裡被拿了出來。舊模子很舒服，因為大家都這樣：拜同樣的神明，喝同樣的酒，說同樣的笑話。彼得叫他們別再被壓回去，理由不是新的規矩，是他們有了新的身分：兒女。</p><p>「那召你們的既是聖潔，你們在一切所行的事上也要聖潔。」（1:15）本系列利未記講義第 11 章與第 19 章講過，這句話在利未記出現在兩個地方：一處在飲食條例的結尾，「所以你們要聖潔，因為我是聖潔的」（利 11:45）；一處在愛鄰舍的條例開頭，「你們要聖潔，因為我耶和華－你們的神是聖潔的」（利 19:2）。帖撒羅尼迦前書講義已經追蹤過聖潔這條線（回指帖撒羅尼迦前書立場四），彼得多出來的一筆是「像那召你們的」：<strong>聖潔不是一套規矩清單，是像那位召我們的神。</strong>規矩會變成驕傲，像神卻只能使人謙卑。</p><p>「一切所行的事」是全卷的關鍵詞之一。彼得在意的聖潔不在聖殿，在廚房、在市場、在臥室、在主人家裡；後面幾章講家僕、講夫妻、講鄰舍，都是在講這個字。外邦信徒不再守摩西的飲食條例，聖潔卻沒有因此變少：它從餐桌上的分別，變成整個人生的分別。</p><p>「因為經上記著說：『你們要聖潔，因為我是聖潔的。』」（1:16）這一節是本章的 truth。理由不是「因為你應該」，是「因為我是」。321 說「耶穌是我的榜樣」：神的聖潔在耶穌身上有了一張可以看見的臉，2:21 彼得會說「給你們留下榜樣，叫你們跟隨他的腳蹤行」（2:21）。</p>"},{"a":17,"z":17,"star":1,"grk":"<p lang=\"grc\">Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·</p>","lit":"<p>而若你們稱呼那不看臉面、照各人的工作審判的那一位為父，你們就要在敬畏中度過你們寄居的時日，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰ πατέρα ἐπικαλεῖσθε</td><td>ei patera epikaleisthe</td><td>既然你們稱呼他為父</td><td>第一類條件句：事實如此</td></tr><tr><td>τὸν ἀπροσωπολήμπτως κρίνοντα</td><td>ton aprosōpolēmptōs krinonta</td><td>不看臉面審判的那一位</td><td>副詞新約只此一次</td></tr><tr><td>κατὰ τὸ ἑκάστου ἔργον</td><td>kata to hekastou ergon</td><td>按各人的行為</td><td>ἔργον 單數：一生當作一件作品</td></tr><tr><td>ἐν φόβῳ</td><td>en phobō</td><td>在敬畏中</td><td>放在句首，強調</td></tr><tr><td>τὸν τῆς παροικίας ὑμῶν χρόνον</td><td>ton tēs paroikias hymōn chronon</td><td>你們寄居的時日</td><td>敬畏追蹤第一站</td></tr></table>","gram":"<p><strong>Καὶ εἰ πατέρα ἐπικαλεῖσθε（Kai ei patera epikaleisthe） 是第一類條件句，不是懷疑，是「既然」。</strong>「父」字放在句首：你們開口稱他為父。同一位卻是 τὸν ἀπροσωπολήμπτως κρίνοντα（ton aprosōpolēmptōs krinonta），ἀπροσωπολήμπτως（aprosōpolēmptōs） 是 a- 加「接受臉面」，不看人的臉面、身分、關係下判斷。這個副詞新約只此一次；名詞 προσωπολήμπτης（prosōpolēmptēs） 在徒 10:34，是彼得在哥尼流家裡說的。</p><p>κατὰ τὸ ἑκάστου ἔργον（kata to hekastou ergon） 的「行為」是單數：一個人的一生被當作一件作品來看。主要動詞 ἀναστράφητε（anastraphēte） 是不定過去式命令，與 1:15 的 ἀναστροφῇ（anastrophē） 同字根。ἐν φόβῳ（en phobō） 移到句子前段，壓住整個命令；τὸν τῆς παροικίας ὑμῶν χρόνον（ton tēs paroikias hymōn chronon） 的 παροικία（paroikia） 是 1:1 寄居身分的名詞形：寄居是有期限的。</p>","exp":"<p>〔背景〕徒 10:34--35（使徒行傳講義第 10 章）</p><p>「你們既稱那不偏待人、按各人行為審判人的主為父，就當存敬畏的心度你們在世寄居的日子」（1:17）。「不偏待人」這幾個字，彼得是付過代價才學會的。本系列使徒行傳講義第 10 章講過，他原本不肯進外邦人的家，神用一個異象把他推進哥尼流的門，他開口第一句就是：「我真看出神是不偏待人。」（徒 10:34）現在他把這句話寫給一群外邦信徒：那位不偏待人的神，也收納了你們。</p><p>父與審判者是同一位。這不是矛盾，是保護：他既是父，我們不必怕被丟棄；他按行為審判，我們就不能把恩典當成隨便的許可。敬畏不是恐懼，是孩子知道父親當真。</p><p>寄居的人常常怕錯了對象：怕鄰舍的眼光、怕族人的議論、怕老闆的臉色。彼得要他們怕對的那一位，3:14 會說「不要怕人的威嚇」（3:14）。怕神的人，反而不必怕人。「寄居的日子」也提醒他們：這段被誤會的日子是有期限的，是一段路，不是終點。</p>"},{"a":18,"z":19,"star":3,"grk":"<p lang=\"grc\">εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,</p><p lang=\"grc\">ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,</p>","lit":"<p>知道你們被贖出你們從祖先傳下來的虛空的行事為人，不是用能壞的東西，銀子或金子，</p><p>而是用寶貴的血，如同無瑕疵、無斑點之羔羊的，就是基督的血，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐ φθαρτοῖς</td><td>ou phthartois</td><td>不是用能壞的東西</td><td>全卷「能壞／不能壞」對照</td></tr><tr><td>ἀργυρίῳ ἢ χρυσίῳ</td><td>argyriō ē chrysiō</td><td>銀子或金子</td><td>古代贖奴的價錢</td></tr><tr><td>ἐλυτρώθητε</td><td>elytrōthēte</td><td>你們被贖回</td><td>λυτρόω：付贖價讓奴隸或俘虜得自由</td></tr><tr><td>ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου</td><td>ek tēs mataias hymōn anastrophēs patroparadotou</td><td>從你們祖傳的虛空生活方式</td><td>πατροπαραδότου 新約只此一次</td></tr><tr><td>τιμίῳ αἵματι</td><td>timiō haimati</td><td>用寶貴的血</td><td>τίμιος 與 1:7 的 πολυτιμότερον 同字根</td></tr><tr><td>ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου</td><td>hōs amnou amōmou kai aspilou</td><td>如同無瑕無斑的羔羊</td><td>「基督」放在全句最後</td></tr></table>","gram":"<p><strong>1:18--19 是一組 οὐ（ou）……ἀλλὰ（alla） 的對照。</strong>前半句 οὐ φθαρτοῖς（ou phthartois） 先出場，再用同位語補上 ἀργυρίῳ ἢ χρυσίῳ（argyriō ē chrysiō）；後半句 ἀλλὰ τιμίῳ αἵματι（alla timiō haimati）。動詞 ἐλυτρώθητε（elytrōthēte） 是不定過去式被動，λυτρόω（lytroō） 是付贖價把奴隸或戰俘買回來；主說「人子來……要捨命作多人的贖價」（可 10:45），用的是同字根的名詞。</p><p>被贖出來的是 ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου（ek tēs mataias hymōn anastrophēs patroparadotou）。ματαίας（mataias） 是「空的、沒有結果的」，七十士譯本常用來說偶像；πατροπαραδότου（patroparadotou） 新約只此一次，「從父親傳下來的」。ἀναστροφῆς（anastrophēs） 又是「行事為人」那個字：被贖的不只是一個人的罪，是一整套代代相傳的活法。</p><blockquote><p>ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ（hōs amnou amōmou kai aspilou Christou）：ἀμώμου（amōmou） 是獻祭用語，「沒有殘疾」；ἀσπίλου（aspilou） 是「沒有斑點」。SBLGNT 的字序把 Χριστοῦ（Christou） 放在整個句子的最後一個字：講完金銀、講完羔羊，最後才說出那血是誰的。</p></blockquote>","exp":"<p>「知道你們得贖，脫去你們祖宗所傳流虛妄的行為，不是憑著能壞的金銀等物，乃是憑著基督的寶血」（1:18--19）。這是全卷的一條線上的第三站：<strong>我們被一個很貴的價錢買回來。</strong>在第一世紀，奴隸可以被贖，價錢是銀子。彼得說，你們的贖價不是銀子，是血；不是能壞的，是寶貴的。</p><p>「祖宗所傳流虛妄的行為」對華人讀者特別敏感。這裡要小心兩件事。第一，彼得不是在羞辱收信人的父母，他自己也是從祖宗的傳統裡被主叫出來的。第二，拜與不拜要分開，孝與不孝也要分開：一個不拿香的信徒，可以是家族裡最常回家、最肯照顧長輩的那一個。被贖出來的是那套「虛空」的活法，不是對父母的愛。親人過世與祭祖的牧養，回指帖撒羅尼迦前書立場三。</p><p>「如同無瑕疵、無玷污的羔羊之血」（1:19）。這使我們想起出 12:5 逾越節的羊羔，「要無殘疾、一歲的公羊羔」（出 12:5）；也使我們想起施洗約翰在約旦河邊說的：「看哪，神的羔羊，除去世人罪孽的！」（約 1:29）彼得認識耶穌，正是從這句話開始的：他的兄弟安得烈聽見施洗約翰這樣指著耶穌說，就跟從了主，又把彼得領到主面前（約 1:35--42）。</p><p>這一段是 321 說的「改變觀點」：甚麼最貴？地上的眼光說金銀。可是金銀「能壞」，也買不回一個人。寄居的人在家鄉被看成沒有價值的怪人，在神眼中，他們是用基督的血換回來的。一個人知道自己有多貴，就不必用別人的眼光來定價。這一節是本章地勢的一片高地，緊接在「存敬畏的心」之後：敬畏的理由不是威脅，是這個價錢。</p>"},{"a":20,"z":21,"star":1,"grk":"<p lang=\"grc\">προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπʼ ἐσχάτου τῶν χρόνων διʼ ὑμᾶς</p><p lang=\"grc\">τοὺς διʼ αὐτοῦ πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.</p>","lit":"<p>他一方面在創世以前已被預先知道，另一方面在諸時代的末後為了你們被顯明，</p><p>你們就是藉著他信神的人，這神叫他從死人中復活，又給了他榮耀，以致你們的信心和盼望是在神裡面。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>προεγνωσμένου μὲν</td><td>proegnōsmenou men</td><td>一方面被預先知道</td><td>完成式被動分詞</td></tr><tr><td>πρὸ καταβολῆς κόσμου</td><td>pro katabolēs kosmou</td><td>在創世以前</td><td>十字架不是後來的補救</td></tr><tr><td>φανερωθέντος δὲ</td><td>phanerōthentos de</td><td>另一方面被顯明</td><td>μέν／δέ 對照：永遠的計畫，歷史的顯明</td></tr><tr><td>διʼ ὑμᾶς</td><td>di' hymas</td><td>為了你們</td><td>放在句尾，強調</td></tr><tr><td>τοὺς διʼ αὐτοῦ πιστοὺς εἰς θεὸν</td><td>tous di' autou pistous eis theon</td><td>藉著他信神的人</td><td>πιστοὺς 當名詞用</td></tr></table>","gram":"<p><strong>1:20 是一組 μέν（men）……δέ（de）：προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου（proegnōsmenou men pro katabolēs kosmou），φανερωθέντος δὲ ἐπʼ ἐσχάτου τῶν χρόνων（phanerōthentos de ep' eschatou tōn chronōn）。</strong>前一半是永恆，後一半是歷史；προεγνωσμένου（proegnōsmenou） 是完成式，「早已被知道」，與 1:2 的 πρόγνωσιν（prognōsin） 同字根。全句最後兩個字是 διʼ ὑμᾶς（di' hymas）：這一切，為了你們。</p><p>1:21 的 τοὺς διʼ αὐτοῦ πιστοὺς εἰς θεὸν（tous di' autou pistous eis theon），「藉著他而信神的人」。神被描寫成 τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα（ton egeiranta auton ek nekrōn kai doxan autō donta）：叫他復活，又給他榮耀，又是 1:11 那條公式。ὥστε（hōste） 帶出結果：τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν（tēn pistin hymōn kai elpida einai eis theon）。也有人讀成「你們的信心也就是對神的盼望」；和合本取並列。</p>","exp":"<p>「基督在創世以前是預先被神知道的，卻在這末世才為你們顯現。」（1:20）十字架不是神的 B 計畫。不是人類犯了罪，神手忙腳亂想出一個補救，是在世界還沒有開始以前，那羔羊就已經在神的心意裡。保羅也說神「從創立世界以前，在基督裡揀選了我們」（弗 1:4）。</p><p>這對寄居的人是極大的安慰。他們的處境看起來很偶然：生在哪一個省份，碰上甚麼樣的鄰舍，遇到哪一個長官。可是救他們的那件事，一點也不偶然；而且它「為你們」顯現。永恆的計畫落在歷史裡，歷史的某一刻落在你身上。</p><p>「叫你們的信心和盼望都在於神。」（1:21）彼得又把復活與榮耀放在一起：神叫他從死裡復活，又給他榮耀。寄居者看見那條公式在基督身上兌現了，就知道它也會在自己身上兌現。所以信心與盼望都不放在處境上，也不放在自己的表現上，放在神身上。321 說「改變觀點」：從看得見的偶然，看到看不見的計畫。</p>"},{"a":22,"z":23,"star":2,"grk":"<p lang=\"grc\">Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,</p><p lang=\"grc\">ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ μένοντος</p>","lit":"<p>你們既已在對真理的順從之中潔淨了你們的生命，以致有沒有假面的弟兄之愛，就要從心裡彼此伸展到極處地相愛，</p><p>已經被重生了，不是出於能壞的種子，而是不能壞的，藉著神活的和常存的道。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὰς ψυχὰς ὑμῶν ἡγνικότες</td><td>Tas psychas hymōn hēgnikotes</td><td>已經潔淨了你們的生命</td><td>完成式分詞：潔淨已成，狀態持續</td></tr><tr><td>ἐν τῇ ὑπακοῇ τῆς ἀληθείας</td><td>en tē hypakoē tēs alētheias</td><td>在順從真理之中</td><td>順服追蹤第三站</td></tr><tr><td>εἰς φιλαδελφίαν ἀνυπόκριτον</td><td>eis philadelphian anypokriton</td><td>以致沒有假面的弟兄之愛</td><td>ἀνυπόκριτον：不戴面具</td></tr><tr><td>ἐκ καρδίας</td><td>ek kardias</td><td>從心裡</td><td>異文：RP NA28 作「從清潔的心」</td></tr><tr><td>ἀλλήλους ἀγαπήσατε ἐκτενῶς</td><td>allēlous agapēsate ektenōs</td><td>你們要彼此切實相愛</td><td>ἐκτενῶς：伸展到極處</td></tr><tr><td>οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου</td><td>ouk ek sporas phthartēs alla aphthartou</td><td>不是出於能壞的種子，而是不能壞的</td><td>又一組 οὐ……ἀλλά</td></tr><tr><td>διὰ λόγου ζῶντος θεοῦ καὶ μένοντος</td><td>dia logou zōntos theou kai menontos</td><td>藉著神活的、常存的道</td><td>「活的」接回 1:3</td></tr></table>","gram":"<p><strong>1:22 的主要動詞是 ἀλλήλους ἀγαπήσατε ἐκτενῶς（allēlous agapēsate ektenōs），前面的 Τὰς ψυχὰς ὑμῶν ἡγνικότες（Tas psychas hymōn hēgnikotes） 是完成式分詞，是命令的根據。</strong>ἁγνίζω（hagnizō） 原是禮儀上的潔淨，這裡潔淨的方法是 ἐν τῇ ὑπακοῇ τῆς ἀληθείας（en tē hypakoē tēs alētheias）：信服福音本身就是一次潔淨。目標是 εἰς φιλαδελφίαν ἀνυπόκριτον（eis philadelphian anypokriton），ἀνυπόκριτον（anypokriton） 是 a- 加「演員」：不戴面具的愛。ἐκτενῶς（ektenōs） 是「伸展、拉到極處」，4:8 再用同字根的 ἐκτενῆ（ektenē）。</p><blockquote><p><strong>經文鑑別：ἐκ καρδίας（ek kardias） 還是「從清潔的心」？</strong>SBLGNT、WH、Treg 與 NIV 作 ἐκ καρδίας（ek kardias），和合本「從心裡」相同；RP 與 NA28 作 ἐκ καθαρᾶς καρδίας（ek katharas kardias），cu89t 註腳「有古卷是從清潔的心」。支持較短讀法的理由：提前 1:5 有現成的 ἐκ καθαρᾶς καρδίας（ek katharas kardias），而且同一節也有 ἀνυποκρίτου（anypokritou），抄經的人很容易照著保羅的句子補上「清潔」。支持較長讀法的理由：有重要的古抄本支持，NA28 編者也把它收入正文。本講義照 SBLGNT 與和合本講「從心裡」；兩種讀法意思相近，上半節已經說「潔淨了自己的心」，講台不必在這裡停留。</p></blockquote><p>1:23 的 ἀναγεγεννημένοι（anagegennēmenoi） 是完成式被動分詞，接回 1:3 的 ἀναγεννήσας（anagennēsas）。διὰ λόγου ζῶντος θεοῦ καὶ μένοντος（dia logou zōntos theou kai menontos） 的兩個分詞，可以修飾「道」，也可以修飾「神」（但 6:26 稱神為「永遠長存的活神」）；和合本取前者，下文 1:25「主的道是永存的」支持這個讀法。</p>","exp":"<p>〔雅〕雅 1:18--18</p><p>「你們既因順從真理，潔淨了自己的心，以致愛弟兄沒有虛假，就當從心裡彼此切實相愛。」（1:22）彼得從聖潔講到相愛，中間沒有轉折。<strong>聖潔的人不是遠離人的人，是能夠不戴面具去愛人的人。</strong>被潔淨的結果不是一種優越感，是「愛弟兄沒有虛假」。</p><p>「切實」這個字是把手臂伸到最遠。寄居的人很多已經失去原來的家人，族人不來往，鄰舍不打招呼；教會就成了他們的新家。可是新家也會有摩擦，會有人說話不中聽、做事不周到。彼得說，要伸到最遠去愛，不是只愛到方便的地方。這是 321 的 235：第二層是屬靈同伴，要從心裡、不戴面具地彼此相愛。</p><p>「你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉著神活潑常存的道。」（1:23）彼得把 1:3 的重生再說一次，這次講它的種子。肉身的生命來自能壞的種子，生下來就開始走向死亡；新的生命來自神的道，那道是活的、常存的。雅各書說得一樣：神「用真道生了我們」（雅 1:18）。</p><p>兩節連起來讀，邏輯很清楚：既然我們是從同一顆不能壞的種子生出來的，我們就是一家人；既然是一家人，就當彼此切實相愛。相愛不是因為我們合得來，是因為我們是同一位父親、同一顆種子生的。這是 321 說「建立屬神的體系」最底層的地基：先有一個家，才有一座殿。</p>"},{"a":24,"z":25,"star":1,"grk":"<p lang=\"grc\">διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ἄνθος ἐξέπεσεν·</p><p lang=\"grc\">τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.</p>","lit":"<p>因為所有的肉體都像草，它所有的榮耀都像草的花；草枯乾了，花也掉落了；</p><p>但主的話存到永遠。而這就是那傳福音給你們的話。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πᾶσα σὰρξ ὡς χόρτος</td><td>pasa sarx hōs chortos</td><td>所有肉體都像草</td><td>引賽 40:6--8</td></tr><tr><td>πᾶσα δόξα αὐτῆς ὡς ἄνθος χόρτου</td><td>pasa doxa autēs hōs anthos chortou</td><td>它所有的榮耀像草的花</td><td>和合本「美榮」就是 δόξα</td></tr><tr><td>ἐξηράνθη ὁ χόρτος</td><td>exēranthē ho chortos</td><td>草枯乾了</td><td>不定過去式：一向如此</td></tr><tr><td>τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα</td><td>to de rhēma kyriou menei eis ton aiōna</td><td>但主的話存到永遠</td><td>δέ：全段的轉折</td></tr><tr><td>τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς</td><td>to rhēma to euangelisthen eis hymas</td><td>那傳福音給你們的話</td><td>彼得把先知的話等同於福音</td></tr></table>","gram":"<p><strong>1:24--25 引賽 40:6--8，διότι（dioti） 帶出 1:23 的理由。</strong>引文的形式接近七十士譯本：πᾶσα σὰρξ ὡς χόρτος（pasa sarx hōs chortos），接著是 πᾶσα δόξα αὐτῆς ὡς ἄνθος χόρτου（pasa doxa autēs hōs anthos chortou）。和合本在以賽亞書作「他的美容都像野地的花」（賽 40:6），在彼得前書作「他的美榮都像草上的花」：兩個版本，一個照希伯來文，一個照彼得所引的希臘文。δόξα（doxa） 就是全卷公式裡的「榮耀」。</p><p>ἐξηράνθη ὁ χόρτος（exēranthē ho chortos） 與 τὸ ἄνθος ἐξέπεσεν（to anthos exepesen） 是不定過去式，在這裡講的是「一向如此」的常理。轉折在 δέ（de）：τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα（to de rhēma kyriou menei eis ton aiōna）。以賽亞書說「惟有我們神的話必永遠立定」（賽 40:8），彼得作「主的道」；兩個版本，意思一致。μένει（menei） 接回 1:23 的 μένοντος（menontos）：常存的道，永存的話。</p><p>最後一句 τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς（touto de estin to rhēma to euangelisthen eis hymas） 是彼得自己的註解：以賽亞說的那句話，就是傳給你們的福音。1:23 用 λόγου（logou），1:25 用 ῥῆμα（rhēma），兩字在這裡同義。</p>","exp":"<p>〔雅〕雅 1:10--11</p><p>「因為凡有血氣的，盡都如草；他的美榮都像草上的花。草必枯乾，花必凋謝」（1:24）。以賽亞說這話的時候，是對被擄的百姓說的，他們看見帝國的榮耀，也看見自己的軟弱。雅各書用同一幅畫說富足的人「如同草上的花一樣」（雅 1:10）；彼得把範圍放到「凡有血氣的」：人的力氣、名聲、成就，連同壓迫寄居者的那些權勢，都是草上的花。</p><p>這也是全卷「榮耀」這條線的一次翻轉。1:11 說基督受苦難後得「榮耀」，1:24 說人的「榮耀」像花一樣凋謝。一種榮耀要先經過苦難，卻永遠長存；另一種榮耀來得快，謝得也快。寄居的人被排擠在人的榮耀之外，卻被放在基督的榮耀之內。</p><p>「惟有主的道是永存的。所傳給你們的福音就是這道。」（1:25）這一章從空墳墓開始，以永存的道結束。這是 321 說的「聖經是我的準則」：草會枯，花會謝，潮流、制度、輿論都會變；神的道不會。寄居的人手裡拿的，不是一個小圈子的信念，是那永存的道本身。</p><p>彼得最後一句很樸素：「所傳給你們的福音就是這道」。不是遙遠的經文，是某一天有人走進他們的城、對他們講的那些話。那個傳福音給他們的人也會老、也會走，可是他傳的道還在。第 2 章接著說：「愛慕那純淨的靈奶」（2:2），從這永存的道吃，才能長大。</p>"}],"2":[{"a":1,"z":1,"star":1,"grk":"<p lang=\"grc\">Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,</p>","lit":"<p>所以，你們既已脫下一切的惡、一切的詭詐，和種種假冒、種種嫉妒，並一切的毀謗，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀποθέμενοι οὖν</td><td>Apothemenoi oun</td><td>所以，既已脫下</td><td>不定過去式分詞：先脫下，再去愛慕</td></tr><tr><td>πᾶσαν κακίαν</td><td>pasan kakian</td><td>一切的惡</td><td>註腳「或譯：陰毒」</td></tr><tr><td>πάντα δόλον</td><td>panta dolon</td><td>一切的詭詐</td><td>與 2:2 ἄδολον、2:22 δόλος 成對</td></tr><tr><td>ὑποκρίσεις καὶ φθόνους</td><td>hypokriseis kai phthonous</td><td>種種假冒、種種嫉妒</td><td>複數：一次又一次的表現</td></tr><tr><td>πάσας καταλαλιάς</td><td>pasas katalalias</td><td>一切的毀謗</td><td>2:12 外人 καταλαλοῦσιν 同字根</td></tr></table>","gram":"<p><strong>2:1 不是命令句。</strong>Ἀποθέμενοι（Apothemenoi） 是不定過去式分詞，掛在 2:2 的主要動詞 ἐπιποθήσατε（epipothēsate） 底下：先脫下，才去愛慕。οὖν（oun） 把這一節接回 1:22--25：既然你們是從「不能壞的種子」重生的，就該過與這種子相稱的生活。ἀποτίθημι（apotithēmi） 是脫衣服的字，徒 7:58 見證人把衣裳「放」在掃羅腳前，用的就是它。</p><p>五樣東西排成一串：κακίαν（kakian）、δόλον（dolon）、ὑποκρίσεις（hypokriseis）、φθόνους（phthonous）、καταλαλιάς（katalalias）。前兩樣是單數，配上 πᾶσαν（pasan）、πάντα（panta）；後兩樣是複數；最後又用 πάσας（pasas） 收住。三個「一切」把清單框起來，意思是一件都不留。這五樣都不是酒醉、淫亂一類的「外面的罪」，全是人與人之間的事：心裡的惡意、手段上的詭詐、臉上的假裝、眼裡的嫉妒、嘴上的毀謗。</p>","exp":"<p>〔雅〕雅 1:21--21</p><p>彼得的「所以」接在 1:22--25 後面。他剛說完「就當從心裡彼此切實相愛」（1:22），又說「惟有主的道是永存的」（1:25）。愛弟兄與主的道，是 2:1--3 的兩根柱子：先脫下傷害弟兄的東西，再去喝那道的奶。</p><p>雅各也用同一個字：「所以，你們要脫去一切的污穢和盈餘的邪惡，存溫柔的心領受那所栽種的道」（雅 1:21）。兩封信的次序一樣：先脫，後領受。一個人穿著沾滿泥巴的外衣坐上餐桌，再好的飯也吃不出味道。脫下，不是為了賺得那頓飯，是為了吃得下。</p><p>清單的內容值得細看。外人在毀謗他們（2:12），彼得卻先叫他們除去自己口中的毀謗。寄居的群體最怕的，常常不是外面的壓力，是裡面的裂縫：被排擠的人很容易彼此猜疑，受了委屈的人很容易把怨氣出在弟兄身上。一個散在各國、在線上相聚的團契也是一樣，最傷人的往往不是外人的誤會，是群組裡一句帶刺的話。</p><p>「脫下」是不定過去式：一次決定，像換衣服。但脫下的動作，常常要天天重做。321 的八大步驟裡，這是檢討與修正：每天照一照，看看身上又沾了甚麼。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε εἰς σωτηρίαν,</p><p lang=\"grc\">εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.</p>","lit":"<p>就要像才生下來的嬰孩，切切想要那屬道的、不摻假的奶，好叫你們在其中長大，以致得救，</p><p>既然你們已經嘗過主是美善的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀρτιγέννητα βρέφη</td><td>artigennēta brephē</td><td>才生下來的嬰孩</td><td>接回 1:3、1:23 的重生</td></tr><tr><td>τὸ λογικὸν ἄδολον γάλα</td><td>to logikon adolon gala</td><td>屬道的、不摻假的奶</td><td>λογικὸν 與 λόγος 同字根</td></tr><tr><td>ἐπιποθήσατε</td><td>epipothēsate</td><td>要切切想要</td><td>不定過去式命令：嬰孩餓了的那種想要</td></tr><tr><td>αὐξηθῆτε εἰς σωτηρίαν</td><td>auxēthēte eis sōtērian</td><td>長大，以致得救</td><td>◆ 經文鑑別：RP 無「以致得救」</td></tr><tr><td>εἰ ἐγεύσασθε</td><td>ei egeusasthe</td><td>既然你們嘗過</td><td>條件句當作事實：你們已經嘗過了</td></tr><tr><td>χρηστὸς ὁ κύριος</td><td>chrēstos ho kyrios</td><td>主是美善的</td><td>詩 34:8；χρηστὸς 與 Χριστός 諧音</td></tr></table>","gram":"<p><strong>λογικὸν（logikon） 有兩種讀法。</strong>和合本譯作「靈奶」，把它讀成「屬靈的、非物質的」，羅 12:1 τὴν λογικὴν λατρείαν（tēn logikēn latreian） 也有人這樣讀。但 λογικὸν（logikon） 與 λόγος（logos） 同字根，而前面三節剛講完 1:23 的 λόγου ζῶντος θεοῦ καὶ μένοντος（logou zōntos theou kai menontos） 與 1:25 的 τὸ ῥῆμα κυρίου（to rhēma kyriou），所以許多解經家讀成「屬道的奶」。兩種讀法不必對立：這奶是屬靈的，因為它就是神的道。本講義兩者並取，重心放在「道」。</p><p>ἄδολον（adolon） 是「沒有摻假的」，商人賣穀子、賣酒，用這字表示貨真價實。它與 2:1 的 δόλον（dolon） 只差一個否定字首：脫下詭詐，去喝不詭詐的奶。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 都有 εἰς σωτηρίαν（eis sōtērian），與和合本「以致得救」相同；RP 所根據的拜占庭抄本多數沒有這兩個字。最早、最好的抄本有它，而且「長大以致得救」讀起來較難，抄寫的人比較可能刪去，不太可能添上。本講義從 SBLGNT 與和合本保留。救恩在本卷常指末後要完全顯明的那一面（1:5），所以「長大以致得救」不是靠長大賺得救恩，是一路長到救恩完全的那一天。</p></blockquote><p>2:3 引詩 34:8（七十士譯本 33:9 作 γεύσασθε（geusasthe）），但把命令「要嘗嘗」改成條件句 εἰ ἐγεύσασθε（ei egeusasthe）。這個 εἰ（ei） 不表示懷疑，是「既然」。原文只有條件句，沒有結論句；和合本用小字補「就必如此」，把前文的「愛慕」接回來。χρηστὸς（chrēstos） 與 Χριστός（Christos） 在當時的讀音幾乎一樣，早期教父已經注意到這個諧音：嘗過「主是美善的」，就是嘗過基督。</p>","exp":"<p>「就要愛慕那純淨的靈奶，像才生的嬰孩愛慕奶一樣」（2:2）。嬰孩想喝奶，不必有人教他；餓了就哭，喝到了就安靜。彼得的命令只有一個動詞：要這樣地想要。他沒有說「要多讀經」，他說要「愛慕」。讀經可以是功課，愛慕卻是胃口。</p><p>這裡的奶不是給程度差的人喝的。保羅說「我是用奶餵你們，沒有用飯餵你們」（林前 3:2），希伯來書也責備人「成了那必須吃奶、不能吃乾糧的人」（來 5:12），那是用奶比喻淺。彼得的用法不一樣：每一個重生的人，不管信主多少年，在道面前都是才生的嬰孩。初信的人與成熟的人吃的有沒有不同，是議題頁的題目；這一節要說的是，兩種人都一樣餓。</p><p>彼得的理由也很溫柔：「你們若嘗過主恩的滋味，就必如此」（2:3）。他不先講責任，先問經驗。一個嘗過主的美善的人，自然會想再嘗。如果胃口沒了，不必先罵自己，先回想第一次嘗到恩典的那一天。</p><p>「叫你們因此漸長」：長大的是「你們」，在道裡長，靠道長。321 說聖經是我的準則，這一節多加一筆：聖經也是我的食物。準則量出我歪了沒有；食物叫我長得出力氣走直。八大步驟的「反覆」就在這裡：嬰孩不是一次喝飽就長大，是一天喝好幾次。</p>"},{"a":4,"z":5,"star":3,"grk":"<p lang=\"grc\">Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον</p><p lang=\"grc\">καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·</p>","lit":"<p>你們來到他面前——他是一塊活石，固然被人棄絕了，在神那裡卻是揀選的、寶貴的——</p><p>你們自己也像活石，被建造成為屬靈的殿，成為聖潔的祭司團，獻上屬靈的祭，藉著耶穌基督蒙神悅納。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πρὸς ὃν προσερχόμενοι</td><td>Pros hon proserchomenoi</td><td>來到他面前</td><td>現在分詞：不斷地來</td></tr><tr><td>λίθον ζῶντα</td><td>lithon zōnta</td><td>一塊活石</td><td>石頭本是死的；活，因為他復活了</td></tr><tr><td>ἀποδεδοκιμασμένον</td><td>apodedokimasmenon</td><td>被棄絕了</td><td>完成式分詞：驗過、退貨，判決至今</td></tr><tr><td>παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον</td><td>para de theō eklekton entimon</td><td>在神那裡卻是揀選的、寶貴的</td><td>μὲν……δὲ 的翻轉</td></tr><tr><td>οἰκοδομεῖσθε</td><td>oikodomeisthe</td><td>你們被建造</td><td>現在式被動語態</td></tr><tr><td>εἰς ἱεράτευμα ἅγιον</td><td>eis hierateuma hagion</td><td>成為聖潔的祭司團</td><td>集合名詞：一群祭司</td></tr><tr><td>πνευματικὰς θυσίας</td><td>pneumatikas thysias</td><td>屬靈的祭</td><td>不是牛羊，是獻上的人自己</td></tr></table>","gram":"<p><strong>2:4 沒有主要動詞。</strong>Πρὸς ὃν προσερχόμενοι（Pros hon proserchomenoi） 是分詞，主要動詞要等到 2:5 的 οἰκοδομεῖσθε（oikodomeisthe）。ὃν（hon） 指 2:3 的 ὁ κύριος（ho kyrios）：「主」成了「石頭」。προσερχόμενοι（proserchomenoi） 是現在式，不是來一次就完，是一直來。這個動詞在七十士譯本常用在祭司「近前來」事奉神，也出現在詩 34:5（七十士譯本 33:6），彼得剛引完這篇詩。</p><p>λίθον ζῶντα（lithon zōnta） 是一個故意的矛盾：石頭沒有生命。這塊石頭活著，因為他從死裡復活（1:3）。接著是 μὲν（men）……δὲ（de） 的對照：ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον（hypo anthrōpōn men apodedokimasmenon para de theō eklekton entimon）。ἀποδεδοκιμασμένον（apodedokimasmenon） 是「驗過以後不合格」，像工地上檢查石料，敲一敲就丟到一邊；完成式表示人的判決一直擺在那裡。ἐκλεκτὸν（eklekton） 在本卷第一次用在基督身上：1:1 揀選的是寄居的人，這裡揀選的是被丟棄的那一位。</p><blockquote><p>οἰκοδομεῖσθε（oikodomeisthe） 字形上可以是直說語氣（你們正被建造），也可以是命令語氣（你們要被建造）。前有 καὶ αὐτοὶ ὡς λίθοι ζῶντες（kai autoi hōs lithoi zōntes），是描寫身分的句子，多數譯本取直說語氣，本講義也是。被動語態要緊：石頭不會自己砌牆。οἶκος πνευματικὸς（oikos pneumatikos） 與 ἱεράτευμα ἅγιον（hierateuma hagion） 一個是房子，一個是在房子裡事奉的人，彼得把兩個比喻疊在一起：你們是殿，也是殿裡的祭司。ἀνενέγκαι（anenenkai） 是獻祭的字，2:24 還會再出現。</p></blockquote>","exp":"<p>〔背景〕約 1:42--42；太 16:18--18（約翰福音講義第 1 章；馬太講義第 16 章）</p><p>「主乃活石，固然是被人所棄的，卻是被神所揀選、所寶貴的。」（2:4）先讓這塊石頭站穩。他被人驗過：宗教領袖棄絕了他；巡撫查不出他有罪（路 23:4；約 18:38），卻仍把他交了出去。這是全卷地勢圖本章的低谷：被棄。彼得的讀者懂這個字，他們在鄰舍眼中也是「不合格」的人（4:4）。但神的判決和人的判決不一樣。</p><p>寫這封信的人，名字就是「石頭」。主第一次見他就說「你要稱為磯法」（約 1:42），後來又說「我要把我的教會建造在這磐石上」（太 16:18）。如果有人有資格說「我是那塊石頭」，就是彼得。可是他在這裡沒有提自己，他說主乃活石。<strong>不論太 16:18 的磐石各家怎樣解，彼得寫到石頭時，指向的是主：主一直是那塊活石，而且沒有放棄他。</strong></p><p>「你們來到主面前，也就像活石，被建造成為靈宮，作聖潔的祭司」（2:5）。被丟棄的那一位，成了第一塊石頭；一群在家鄉被看為怪的人，被一塊一塊砌在他身上。活石的生命不是自己的，是從那塊活石來的。散落的石頭各自都很堅硬，卻不是房子；被砌在一起，才成了神住的地方。</p><p>這座殿沒有牆、沒有地址。小亞細亞的信徒沒有聖殿可去，彼得告訴他們：你們就是殿，你們也是祭司。祭司的工作是獻「靈祭」，這使我們想起保羅說的「將身體獻上，當作活祭」（羅 12:1）。信徒皆祭司不是不要牧師，是每個人都是把人帶到神面前的人。</p><p>到這裡，321 的「建立屬神的體系」才在末端被認出來。體系不是先有一棟建築，是先有一群來到主面前的人；不是石頭自己排好，是神親手砌。被動語態給每一個覺得自己沒用的人一個安慰：你不必把自己砌進牆裡，你只要不斷地來到他面前。</p>"},{"a":6,"z":6,"star":2,"grk":"<p lang=\"grc\">διότι περιέχει ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ἀκρογωνιαῖον ἐκλεκτὸν ἔντιμον, καὶ ὁ πιστεύων ἐπʼ αὐτῷ οὐ μὴ καταισχυνθῇ.</p>","lit":"<p>因為經上包含這話：「看哪，我在錫安放下一塊房角石，揀選的、寶貴的；信靠他的人，斷不至於蒙羞。」</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διότι περιέχει ἐν γραφῇ</td><td>dioti periechei en graphē</td><td>因為經上包含這話</td><td>引經公式，新約只此一處用 περιέχει</td></tr><tr><td>τίθημι ἐν Σιὼν</td><td>tithēmi en Siōn</td><td>我在錫安放下</td><td>現在式：神正在安放</td></tr><tr><td>λίθον ἀκρογωνιαῖον</td><td>lithon akrogōniaion</td><td>房角石</td><td>弗 2:20 同字</td></tr><tr><td>ἐπʼ αὐτῷ</td><td>ep' autō</td><td>在他身上</td><td>信靠的對象是這塊石頭</td></tr><tr><td>οὐ μὴ καταισχυνθῇ</td><td>ou mē kataischynthē</td><td>斷不至於羞愧</td><td>七十士譯本的讀法；雙重否定</td></tr></table>","gram":"<p><strong>2:6 引賽 28:16，彼得用的是七十士譯本。</strong>以賽亞書的希伯來原文最後一句，和合本譯作「信靠的人必不著急」（賽 28:16）；七十士譯本作 οὐ μὴ καταισχυνθῇ（ou mē kataischynthē），「必不至於羞愧」。和合本在兩處照各自的底本翻譯，所以我們手上有兩個版本。這不是彼得引錯，是新約作者常用當時通行的希臘文聖經；保羅在羅 9:33、10:11 引同一節，也作「不至於羞愧」。</p><p>兩個版本講的是同一件事的兩面。「不著急」是現在：信靠的人不慌張奔逃；「不羞愧」是將來：信靠的人到最後不會被證明是信錯了。οὐ μὴ（ou mē） 加不定過去式假設語氣，是希臘文最強的否定，「斷乎不」。</p><p>ἀκρογωνιαῖον（akrogōniaion） 是建築上的房角石，放在地基轉角，整座牆的線都從它對齊。τίθημι（tithēmi） 是現在式，神說「我正在安放」。2:8 的 ἐτέθησαν（etethēsan） 是同一個動詞的被動式：安放石頭的神，也安排了人與這石頭相遇的結局。ἐκλεκτὸν ἔντιμον（eklekton entimon） 兩個字原封不動地從 2:4 搬過來：彼得 2:4 的描寫，就是從這節經文讀出來的。</p>","exp":"<p>「因為經上說：看哪，我把所揀選、所寶貴的房角石安放在錫安；信靠他的人必不至於羞愧。」（2:6）彼得講完「活石」，馬上拿出經文。他不要讀者只記得一個漂亮的比喻，他要他們知道這是神早就說過的話。</p><p>這節經文原本在以賽亞的時代說給耶路撒冷的領袖聽。他們在亞述的威脅下四處找靠山，與人立約，以為可以躲過災禍。神說：真正的根基我已經放下了，信靠它的人不必慌張。彼得把這塊石頭認出來，就是基督。</p><p>對寄居的人來說，「不至於羞愧」很具體。他們因為信主被毀謗（2:12），在家族聚會裡低著頭，在同業面前被當成怪人。羞愧是他們每天的處境。彼得沒有說他們現在不會被羞辱，他說信靠這塊石頭的人，到最後不會蒙羞。把盼望押在這塊石頭上，不會押錯。</p><p>兩個版本也正好是兩種安慰。被羞辱的人需要「不至於羞愧」的應許，焦慮的人需要「必不著急」的應許。一個在職場裡因為不做假帳被冷落的人，可以同時聽見兩句：今天不必慌，將來不會丟臉。房角石已經放好了，他不必自己去找靠山。</p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ἀπιστοῦσιν δὲ λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας</p><p lang=\"grc\">καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.</p>","lit":"<p>所以，那尊貴是給你們這些信的人；但對那些不信的人：「建造的人所棄絕的那塊石頭，這塊已經成了房角的頭」，</p><p>又是「絆腳的石頭，跌人的磐石」；他們絆跌在道上，因為不順從；他們也是被放在這事上的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑμῖν οὖν ἡ τιμὴ</td><td>hymin oun hē timē</td><td>所以那尊貴是給你們的</td><td>τιμὴ 接 2:6 的 ἔντιμον</td></tr><tr><td>ἀπιστοῦσιν δὲ</td><td>apistousin de</td><td>但對不信的人</td><td>與 τοῖς πιστεύουσιν 對照</td></tr><tr><td>εἰς κεφαλὴν γωνίας</td><td>eis kephalēn gōnias</td><td>成了房角的頭</td><td>詩 118:22；徒 4:11</td></tr><tr><td>λίθος προσκόμματος καὶ πέτρα σκανδάλου</td><td>lithos proskommatos kai petra skandalou</td><td>絆腳的石頭，跌人的磐石</td><td>賽 8:14</td></tr><tr><td>τῷ λόγῳ ἀπειθοῦντες</td><td>tō logō apeithountes</td><td>不順從道</td><td>τῷ λόγῳ 可接前或接後</td></tr><tr><td>εἰς ὃ καὶ ἐτέθησαν</td><td>eis ho kai etethēsan</td><td>他們也是被放在這事上的</td><td>◆ 讀法並陳</td></tr></table>","gram":"<p><strong>2:7 的上半句有兩種讀法。</strong>ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν（hymin oun hē timē tois pisteuousin），和合本讀成「他在你們信的人就為寶貴」，τιμὴ（timē） 指基督的寶貴；也可以讀成「那尊貴是給你們信的人的」，τιμὴ（timē） 接 2:6「不至於羞愧」：信的人分享這塊石頭的尊榮。兩讀都通，後者更貼近上下文的「羞愧／尊貴」對照，但都不離開基督。</p><p>下半句 ἀπιστοῦσιν δὲ（apistousin de） 一連引兩處經文：詩 118:22 與賽 8:14。λίθος προσκόμματος καὶ πέτρα σκανδάλου（lithos proskommatos kai petra skandalou），σκάνδαλον（skandalon） 是彈簧夾子上的機關，引申為絆跌人的東西。主在太 16:23 曾對彼得說 Σκάνδαλον εἶ ἐμοῦ（Skandalon ei emou），「你是絆我腳的」。</p><blockquote><p>◆ 2:8 下半句 οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες（hoi proskoptousin tō logō apeithountes）· εἰς ὃ καὶ ἐτέθησαν（eis ho kai etethēsan） 有兩個問題。第一，τῷ λόγῳ（tō logō） 接哪一個字？接前面，是「在道上絆跌」（和合本正文）；接後面，是「不順從道」，cu89t 註腳作「他們絆跌都因不順從道理」，把重點放在「因不順從」。第二，ἐτέθησαν（etethēsan）「被放、被安排」，到底被預定的是甚麼？讀法有三：①神預定他們不信；②神預定的是「不順從的人必絆跌」這個結果——人不信是人的責任，絆跌是神定下的後果；③照註腳讀，絆跌的原因是不順從，預定落在後果上。εἰς ὃ（eis ho） 的「這」最自然的先行詞是整個「絆跌」，而 ἀπειθοῦντες（apeithountes） 是主動分詞，把責任放在人身上。本講義採讀法②。揀選與預定的大題，見以弗所書立場二。</p></blockquote>","exp":"<p>〔背景〕徒 4:11--11（使徒行傳講義第 4 章）</p><p>「匠人所棄的石頭已作了房角的頭塊石頭」（2:7）。彼得第一次引這節詩篇，不是在書房裡，是站在公會面前。本系列使徒行傳講義第 4 章講過：他與約翰因為醫好瘸腿的人被抓，在大祭司、長老面前說「他是你們匠人所棄的石頭，已成了房角的頭塊石頭」（徒 4:11）。主耶穌自己也引過這節（太 21:42）。對彼得來說，這不是一句被動聽來的經文，是他冒著坐牢說出來的信仰告白。</p><p>同一塊石頭，對兩種人有兩種結果。信的人在它上面被建造；不信的人在它上面絆倒。石頭沒有變，變的是人怎樣對待它。這叫寄居的讀者放心：毀謗他們的人不是勝利者。被人丟棄的那一位，已經被神立為房角的頭。</p><p>「他們這樣絆跌也是預定的」（2:8）一句，常被讀成神故意造一些人去不信。上下文不支持這樣讀。彼得說得很清楚：「他們既不順從，就在道理上絆跌」（2:8），不順從是他們的選擇。神定下的是一個屬靈的定律：拒絕這塊石頭的人，必在這塊石頭上絆倒。這不是叫我們去猜誰被預定，而是提醒每一個聽見道的人：今天怎樣回應，關係到這塊石頭對你是根基，還是絆腳石。</p><p>那個曾被主說「你是絆我腳的」的彼得，後來成了引人來到房角石面前的人。絆腳的不一定一直絆腳，主沒有把他丟在路邊。這是彼得的見證，焦點卻在那位不放棄他的主。</p>"},{"a":9,"z":9,"star":3,"grk":"<p lang=\"grc\">Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·</p>","lit":"<p>但你們是揀選的族類、君尊的祭司團、聖潔的國民、歸他所得的子民，好叫你們宣揚那召你們出黑暗、入他奇妙光明者的美德；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὑμεῖς δὲ</td><td>Hymeis de</td><td>但你們</td><td>與 2:7--8 不信的人對照</td></tr><tr><td>γένος ἐκλεκτόν</td><td>genos eklekton</td><td>揀選的族類</td><td>賽 43:20</td></tr><tr><td>βασίλειον ἱεράτευμα</td><td>basileion hierateuma</td><td>君尊的祭司團</td><td>出 19:6 七十士譯本</td></tr><tr><td>ἔθνος ἅγιον</td><td>ethnos hagion</td><td>聖潔的國民</td><td>出 19:6</td></tr><tr><td>λαὸς εἰς περιποίησιν</td><td>laos eis peripoiēsin</td><td>歸他所得的子民</td><td>出 19:5；賽 43:21</td></tr><tr><td>ὅπως τὰς ἀρετὰς ἐξαγγείλητε</td><td>hopōs tas aretas exangeilēte</td><td>好叫你們宣揚美德</td><td>ἐξαγγείλητε 新約只此一次</td></tr><tr><td>εἰς τὸ θαυμαστὸν αὐτοῦ φῶς</td><td>eis to thaumaston autou phōs</td><td>入他奇妙的光</td><td>αὐτοῦ 夾在中間：是他的光</td></tr></table>","gram":"<p><strong>Ὑμεῖς δὲ（Hymeis de） 把鏡頭從絆跌的人轉回讀者。</strong>接著是四個名字，沒有一個動詞：γένος ἐκλεκτόν（genos eklekton）、βασίλειον ἱεράτευμα（basileion hierateuma）、ἔθνος ἅγιον（ethnos hagion）、λαὸς εἰς περιποίησιν（laos eis peripoiēsin）。四個都是舊約給以色列的名字，現在用在一群多數是外邦人的信徒身上。</p><p>βασίλειον ἱεράτευμα（basileion hierateuma） 與 ἔθνος ἅγιον（ethnos hagion） 出自出 19:6 七十士譯本。和合本出 19:6 照希伯來原文譯作「祭司的國度」，這裡照希臘文譯作「有君尊的祭司」，所以有兩個版本。βασίλειον（basileion） 可以當形容詞「君王的」，也可以當名詞「王宮、王國」，有人讀成「一座王宮，一群祭司」。和合本取形容詞，本講義從之：祭司團屬於王，也有王的尊貴。</p><blockquote><p>γένος ἐκλεκτόν（genos eklekton） 與「好叫你們宣揚美德」都來自賽 43:20--21，那裡神說「我的選民」、「好述說我的美德」。λαὸς εἰς περιποίησιν（laos eis peripoiēsin） 是「被得著、歸為產業的子民」，回應出 19:5「屬我的子民」。ὅπως（hopōs） 帶出目的：四個名字不是榮譽頭銜，是任務。ἐξαγγείλητε（exangeilēte） 字面是「向外報出去」。τοῦ（tou）……καλέσαντος（kalesantos） 用不定過去式分詞：召，是已經發生的事。</p></blockquote>","exp":"<p>〔舊約〕出 19:5--6（出埃及記講義第 19 章）</p><p>「惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民」（2:9）。這是本章的山峰，也是全卷地勢的高點之一。剛剛 2:4 是被人丟棄的石頭，2:9 是被神命名的子民；最低與最高只隔五節。</p><p>本系列出埃及記講義第 19 章講過，以色列人到了西乃山下，神還沒有頒布十誡，先告訴他們是誰：「就要在萬民中作屬我的子民」（出 19:5），「你們要歸我作祭司的國度，為聖潔的國民」（出 19:6）。身分在律法之前。彼得多出來的一筆是：這些名字現在給了一群拜過偶像、在本都與加拉太的外邦人。他們在地上沒有戶籍，在神面前有四個名字。</p><p>教會與以色列的關係，有取代論、時代論、延續論幾種看法，是議題頁的題目。這裡只說兩件事：彼得是猶太人，他沒有說神丟棄了以色列；本講義不採取代論常被推出來的反猶結論。經文的重點不在誰被取代，在神的憐憫擴大了。</p><p>這些名字是為了一個目的：「要叫你們宣揚那召你們出黑暗入奇妙光明者的美德」（2:9）。以賽亞書說「這百姓是我為自己所造的，好述說我的美德」（賽 43:21）。被揀選不是被抬高，是被差遣。祭司的工作是把神帶給人、把人帶到神面前，所以信徒皆祭司不是不要牧師，是每一個信徒都有這份工作。</p><p>321 的「建立屬神的體系」在這裡看見最完整的設計圖：族類是血緣，祭司是事奉，國度是治理，子民是歸屬。八大步驟最後一步是繁殖，就落在「宣揚」這個動詞上。一個在職場裡誠實做事的人，一個在不信的家族裡溫柔拒絕拿香的人，都在宣揚那位把他從黑暗裡叫出來的神。</p>"},{"a":10,"z":10,"star":1,"grk":"<p lang=\"grc\">οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.</p>","lit":"<p>你們從前不是子民，現在卻是神的子民；從前是未蒙憐憫的，現在卻蒙了憐憫。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἵ ποτε οὐ λαὸς</td><td>hoi pote ou laos</td><td>從前不是子民</td><td>何 1:9 羅‧阿米</td></tr><tr><td>νῦν δὲ λαὸς θεοῦ</td><td>nyn de laos theou</td><td>現在卻是神的子民</td><td>何 1:10；2:23</td></tr><tr><td>οἱ οὐκ ἠλεημένοι</td><td>hoi ouk ēleēmenoi</td><td>未蒙憐憫的</td><td>完成式分詞：長久的狀態</td></tr><tr><td>νῦν δὲ ἐλεηθέντες</td><td>nyn de eleēthentes</td><td>現在卻蒙了憐憫</td><td>不定過去式：一次的轉變</td></tr></table>","gram":"<p>2:10 是兩組完全平行的句子：οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ（hoi pote ou laos nyn de laos theou），再接 οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες（hoi ouk ēleēmenoi nyn de eleēthentes）。每組都是 ποτε（pote）／νῦν δὲ（nyn de），「從前……現在卻」；和合本把它排成詩的樣子。</p><p>兩個「憐憫」的時態不同。ἠλεημένοι（ēleēmenoi） 是完成式，描寫一個長久的狀態：一直在憐憫之外。ἐλεηθέντες（eleēthentes） 是不定過去式，描寫一個事件：某一天，憐憫臨到了。長年的狀態被一次的恩典打斷。這些字句來自何西阿書：何西阿的孩子一個叫「不蒙憐憫」，一個叫「非我民」（何 1:6、9），後來神應許要改他們的名字（何 1:10；2:23）。保羅在羅 9:25--26 也引了同樣的經文。</p>","exp":"<p>何西阿的兒女被起名叫「不蒙憐憫」、「非我民」，是因為以色列離棄了神。神說「你們不作我的子民，我也不作你們的神」（何 1:9）。可是同一卷書接著說：「本非我民的，我必對他說：你是我的民」（何 2:23）。審判之後還有一句話，那句話是改名字。</p><p>彼得把這段話用在小亞細亞的信徒身上，比何西阿原來的處境走得更遠。何西阿說的是離開了神的以色列；彼得的讀者多數從來不屬於以色列，他們在「從前蒙昧無知的時候」（1:14）拜別的神。對他們來說，「從前算不得子民」不是誇張，是事實。神的憐憫越過了以色列的邊界，臨到從來沒有名分的人。</p><p>寄居的人每天被提醒自己不屬於這裡：在家族裡是異類，在同業裡是怪人。彼得給他們另一個名字。地上的人說你不算數，神說你是我的子民。一個在團契裡默默坐著、覺得自己誰都不是的人，最需要聽見的就是這一節：你從前是「沒有名字的」，現在你的名字是神親自起的。</p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·</p><p lang=\"grc\">τὴν ἀναστροφὴν ὑμῶν ἐν τοῖς ἔθνεσιν ἔχοντες καλήν, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.</p>","lit":"<p>親愛的，我勸你們，作為寄居的和客旅，要遠離肉體的私慾，這些私慾正與靈魂打仗；</p><p>你們在外邦人中要保持美好的生活方式，好叫他們在毀謗你們為作惡者的事上，因細看你們的好行為，就在眷顧的日子榮耀神。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητοί</td><td>Agapētoi</td><td>親愛的</td><td>全卷兩次：2:11；4:12</td></tr><tr><td>ὡς παροίκους καὶ παρεπιδήμους</td><td>hōs paroikous kai parepidēmous</td><td>作為寄居的和客旅</td><td>有住所、沒有公民權；短暫停留</td></tr><tr><td>στρατεύονται κατὰ τῆς ψυχῆς</td><td>strateuontai kata tēs psychēs</td><td>與靈魂打仗</td><td>軍事用語：出兵攻打</td></tr><tr><td>τὴν ἀναστροφὴν……καλήν</td><td>tēn anastrophēn……kalēn</td><td>美好的生活方式</td><td>καλήν 放在句尾：好看的</td></tr><tr><td>ἐποπτεύοντες</td><td>epopteuontes</td><td>細看</td><td>3:2 同字：丈夫細看妻子的品行</td></tr><tr><td>ἐν ἡμέρᾳ ἐπισκοπῆς</td><td>en hēmera episkopēs</td><td>在眷顧的日子</td><td>註腳「鑒察：或譯眷顧」</td></tr></table>","gram":"<p><strong>Ἀγαπητοί（Agapētoi） 是書信的轉折點。</strong>前半封信講身分（1:1--2:10），從這裡起講生活。彼得在全卷只這樣稱呼讀者兩次，另一次在 4:12，正要講火煉的試驗。他每次用這個稱呼，後面都是難走的路。</p><p>ὡς παροίκους καὶ παρεπιδήμους（hōs paroikous kai parepidēmous） 兩個字意思相近。πάροικος（paroikos） 是住在外地、有居留卻沒有公民權的人；παρεπίδημος（parepidēmos） 是短暫停留的旅客，1:1 已經用過。七十士譯本創 23:4 亞伯拉罕向赫人買墳地時，用的正是這一對字。αἵτινες στρατεύονται κατὰ τῆς ψυχῆς（haitines strateuontai kata tēs psychēs） 是軍事用語：私慾不是幾隻蒼蠅，是一支出兵攻城的軍隊。</p><blockquote><p>2:12 的結構是 ἔχοντες（echontes） 分詞接 ἵνα（hina） 目的子句。ἐν ᾧ（en hō） 可以是「在……的事上」，也可以是「當……的時候」，和合本取前者。ἐποπτεύοντες（epopteuontes） 是現在分詞：外人不是瞄一眼，是長時間細看。ἐν ἡμέρᾳ ἐπισκοπῆς（en hēmera episkopēs），和合本作「鑒察的日子」，cu89t 註腳「或譯：眷顧」。ἐπισκοπή（episkopē） 在路 19:44 是神來「眷顧」的時候；在舊約也可以是神來審問的日子。若讀「眷顧」，是外人信主的那一天；若讀「鑒察」，是審判的日子，他們不得不承認。兩讀並陳，本講義偏向「眷顧」：這使我們想起太 5:16。</p></blockquote>","exp":"<p>〔背景〕來 11:13--13（希伯來書講義第 11 章）</p><p>「親愛的弟兄啊，你們是客旅，是寄居的。」（2:11）這兩個名字，亞伯拉罕用過：「我在你們中間是外人，是寄居的」（創 23:4）；大衛也用過：「我在你面前是客旅，是寄居的」（詩 39:12）。本系列希伯來書講義第 11 章講過，信心的前輩「承認自己在世上是客旅，是寄居的」（來 11:13）。彼得多出來的一筆是：寄居的人不一定離開家鄉。他的讀者沒有搬家，信主以後卻成了自己家鄉裡的外人。</p><p>彼得的第一個勸勉不是對付外面的人，是對付裡面的私慾。寄居的人最危險的，不是被趕出去，是被同化。外面的毀謗會讓人想放棄，裡面的私慾會讓人想回去。</p><p>第二個勸勉是「在外邦人中，應當品行端正」（2:12）。他們被當成「作惡的」：不拜城裡的神、不參加公會的宴席，在別人眼中就是不忠、不合群。彼得沒有叫他們辯論，也沒有叫他們退到山洞裡，他叫他們繼續住在那裡，活得好看。「品行端正」的「端正」原文是美好、好看。好行為是讓人看見的；外人一直在細看，信徒的生活就是他們讀到的第一本聖經。</p><p>這使我們想起主耶穌說的「叫他們看見你們的好行為，便將榮耀歸給你們在天上的父」（太 5:16）。「寄居」不是逃離世界，是在世界裡活出另一個國的樣子。我們在地上有住址，在天上有戶籍。321 說讓耶穌得榮耀，這一節給了一條路：不是贏了辯論，是有一天，那個曾經毀謗你的人，因為你而歸榮耀給神。</p>"},{"a":13,"z":15,"star":2,"grk":"<p lang=\"grc\">Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,</p><p lang=\"grc\">εἴτε ἡγεμόσιν ὡς διʼ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν</p><p lang=\"grc\">(ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·</p>","lit":"<p>你們要為主的緣故，服在人間的一切設立之下：或是君王，因為他居上位；</p><p>或是總督，因為他們是被他差派來懲罰作惡者、稱讚行善者的；</p><p>（因為神的旨意就是這樣：要你們藉著行善，堵住那些愚昧人的無知；）</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὑποτάγητε</td><td>Hypotagēte</td><td>要服在……之下</td><td>不定過去式被動命令，意思是「把自己放在下面」</td></tr><tr><td>πάσῃ ἀνθρωπίνῃ κτίσει</td><td>pasē anthrōpinē ktisei</td><td>人間的一切設立</td><td>κτίσει 字面是「受造之物」</td></tr><tr><td>διὰ τὸν κύριον</td><td>dia ton kyrion</td><td>為主的緣故</td><td>順服的理由，也是界線</td></tr><tr><td>βασιλεῖ ὡς ὑπερέχοντι</td><td>basilei hōs hyperechonti</td><td>君王，因為他居上位</td><td>指羅馬皇帝</td></tr><tr><td>εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν</td><td>eis ekdikēsin kakopoiōn epainon de agathopoiōn</td><td>罰惡、賞善</td><td>政府存在的目的</td></tr><tr><td>φιμοῦν</td><td>phimoun</td><td>堵住口</td><td>給牲口戴上口套的字</td></tr></table>","gram":"<p><strong>Ὑποτάγητε（Hypotagēte） 是不定過去式被動命令。</strong>ὑποτάσσω（hypotassō） 的被動式常有反身的意思：「把自己放在……之下」。這是同一個字在本章的第二站（2:13），2:18 的家僕、3:1 的妻子都會再用到它。2:8 的 ἀπειθοῦντες（apeithountes） 是它的反面：不順從的人絆跌，順服的人卻不是盲從，因為每一次順服都有 διὰ τὸν κύριον（dia ton kyrion）。</p><p>πάσῃ ἀνθρωπίνῃ κτίσει（pasē anthrōpinē ktisei） 有兩種讀法。κτίσις（ktisis） 在新約別處都是「受造之物」或「創造」，所以有人讀成「要順服每一個人」，與 2:17 πάντας τιμήσατε（pantas timēsate） 呼應；多數譯本讀成「人所設立的制度」，因為後面舉的例子是君王與總督。本講義從和合本取「制度」，但記得 ἀνθρωπίνῃ（anthrōpinē） 這個字：這些制度是人設立的，不是神本身。</p><blockquote><p>2:14 ὡς διʼ αὐτοῦ πεμπομένοις（hōs di' autou pempomenois） 的「他」最自然是指君王：總督是皇帝派的。政府的目的寫得很清楚：εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν（eis ekdikēsin kakopoiōn epainon de agathopoiōn）。2:15 是插入語，SBLGNT 加了括號：ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν（agathopoiountas phimoun tēn tōn aphronōn anthrōpōn agnōsian）。φιμοῦν（phimoun） 是給牛戴口套，主耶穌叫風浪「住了吧」（可 4:39）也用這個字根。堵住糊塗人的口，用的不是辯論，是行善。</p></blockquote>","exp":"<p>〔背景〕徒 5:29--29（使徒行傳講義第 5 章）</p><p>「你們為主的緣故，要順服人的一切制度」（2:13）。寫這句話的時候，在羅馬作皇帝的很可能就是尼祿。彼得不是不知道權力會作惡，他自己被希律關過、被公會打過。他仍然寫下這句話。</p><p>關鍵在「為主的緣故」。<strong>順服的理由是主，順服的界線也是主。</strong>同一個彼得在公會面前說過：「順從神，不順從人，是應當的」（徒 5:29）。本系列使徒行傳講義第 5 章講過那一幕：公會禁止他們奉耶穌的名講道，他們沒有暴動，也沒有停止傳福音，挨了打，還心裡歡喜地離開。兩節經文不打架。平常的日子，信徒納稅、守法、尊重在位的人；當人的命令要他否認主，他以溫柔與敬畏拒絕，並承擔後果。順服不等於同意，也不等於沉默。</p><p>彼得也說明了政府為甚麼存在：「罰惡賞善」。這是政府的本分，也是衡量它的尺。彼得沒有說一切政府都做得到，他只說這是它被設立的目的。</p><p>寄居的人被說是「作惡的」，彼得的對策是「行善，可以堵住那糊塗無知人的口」（2:15）。他沒有叫他們組織起來反擊，也沒有叫他們討好權力。講台不作政治動員，不點名任何政黨或人物；這一章給每一個國家、每一種制度下的信徒同一個姿態：好好做公民，但心裡的王座只有一位。</p>"},{"a":16,"z":17,"star":2,"grk":"<p lang=\"grc\">ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλʼ ὡς θεοῦ δοῦλοι.</p><p lang=\"grc\">πάντας τιμήσατε, τὴν ἀδελφότητα ἀγαπᾶτε τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.</p>","lit":"<p>要像自由人，卻不要把自由當作惡毒的遮蓋，而要像神的奴僕。</p><p>要尊敬眾人，要愛弟兄的團契，要敬畏神，要尊敬君王。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὡς ἐλεύθεροι</td><td>hōs eleutheroi</td><td>像自由人</td><td>三個 ὡς 的第一個</td></tr><tr><td>ἐπικάλυμμα……τῆς κακίας</td><td>epikalymma……tēs kakias</td><td>惡毒的遮蓋</td><td>註腳「或譯：陰毒」</td></tr><tr><td>ἀλλʼ ὡς θεοῦ δοῦλοι</td><td>all' hōs theou douloi</td><td>而要像神的奴僕</td><td>自由人是神的奴僕</td></tr><tr><td>πάντας τιμήσατε</td><td>pantas timēsate</td><td>要尊敬眾人</td><td>不定過去式命令：總綱</td></tr><tr><td>τὴν ἀδελφότητα ἀγαπᾶτε</td><td>tēn adelphotēta agapate</td><td>要愛弟兄的團契</td><td>ἀδελφότητα 新約只在 2:17、5:9</td></tr><tr><td>τὸν θεὸν φοβεῖσθε</td><td>ton theon phobeisthe</td><td>要敬畏神</td><td>只有神得到「敬畏」</td></tr><tr><td>τὸν βασιλέα τιμᾶτε</td><td>ton basilea timate</td><td>要尊敬君王</td><td>君王得到的與眾人相同</td></tr></table>","gram":"<p>2:16 用三個 ὡς（hōs） 畫出信徒的身分：ὡς ἐλεύθεροι（hōs eleutheroi），καὶ μὴ ὡς ἐπικάλυμμα（kai mē hōs epikalymma），ἀλλʼ ὡς θεοῦ δοῦλοι（all' hōs theou douloi）。順服的人不是奴隸，是自由人；自由人的自由卻不是遮羞布，而是用來作神的僕人。ἐπικάλυμμα（epikalymma） 新約只此一次，是蓋在東西上面的布。2:1 已經脫下的 κακίαν（kakian），在這裡又想借自由的名義藏回來。</p><p><strong>2:17 四個命令排成交錯的結構。</strong>第一個 τιμήσατε（timēsate） 是不定過去式，像總綱；後三個是現在式。頭尾兩個都用「尊敬」：πάντας τιμήσατε（pantas timēsate）……τὸν βασιλέα τιμᾶτε（ton basilea timate）。中間兩個是 ἀγαπᾶτε（agapate） 與 φοβεῖσθε（phobeisthe）。君王與眾人得到的是同一個動詞，不多也不少；只有神得到 φοβεῖσθε（phobeisthe）。這使我們想起箴 24:21 要敬畏耶和華與王，彼得卻刻意把「敬畏」留給神一位。</p>","exp":"<p>「你們雖是自由的，卻不可藉著自由遮蓋惡毒，總要作神的僕人。」（2:16）寄居的人可能有兩種誤會。一種是：既然我在地上只是過客，人間的制度與我無關。另一種是：既然我在基督裡自由了，就不必再顧任何人。彼得兩邊都擋。自由是真的，但自由的人選擇作神的僕人，在這個身分裡尊重人間的秩序。</p><p>「務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王。」（2:17）這一節是一張很精準的地圖。對眾人：尊敬，包括毀謗你的鄰舍。對弟兄：愛，不只是禮貌。對神：敬畏，這是唯一配得的。對君王：尊敬，與對眾人一樣。君王不是被放在眾人之上，而是被放回眾人之中。在一個皇帝被當成神來拜的帝國裡，這一句很不簡單：信徒可以尊敬凱撒，但不會敬畏他。</p><p>這不是叫人看輕在上掌權的人。保羅說要「為君王和一切在位的」（提前 2:2）禱告。但「敬畏」只有一個對象，所以沒有任何政權、領袖或政治立場可以佔據信徒心裡的那個位置。講台上不為任何政權背書，也不叫會眾仇視任何政權。</p><p>「親愛教中的弟兄」原文是「弟兄的團契」，彼得在 5:9 再用一次，說「在世上的眾弟兄也是經歷這樣的苦難」（5:9）。寄居的人不是孤單的過客，是一整個散在各地的家。321 的 235 說屬靈同伴，就在這裡：在一個不尊重你的世界裡，弟兄姊妹是你可以放心去愛的人。</p>"},{"a":18,"z":20,"star":3,"grk":"<p lang=\"grc\">Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.</p><p lang=\"grc\">τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·</p><p lang=\"grc\">ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλʼ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.</p>","lit":"<p>作家僕的，要在一切的敬畏中服在主人之下，不但是那些良善溫和的，也是那些彎曲的。</p><p>因為這是恩典：若有人因為意識到神，忍受憂苦，不公義地受苦。</p><p>因為若是犯了罪而挨拳頭，你們忍耐，有甚麼名聲呢？但若是行善而受苦，你們忍耐，這在神那裡是恩典。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οἱ οἰκέται</td><td>Hoi oiketai</td><td>作家僕的</td><td>家中的僕人，不是 δοῦλοι 的泛稱</td></tr><tr><td>ἐν παντὶ φόβῳ</td><td>en panti phobō</td><td>在一切的敬畏中</td><td>2:17 只有神得到「敬畏」</td></tr><tr><td>τοῖς σκολιοῖς</td><td>tois skoliois</td><td>那些彎曲的</td><td>徒 2:40「彎曲的世代」同字</td></tr><tr><td>τοῦτο γὰρ χάρις</td><td>touto gar charis</td><td>因為這是恩典</td><td>和合本「可喜愛的」</td></tr><tr><td>διὰ συνείδησιν θεοῦ</td><td>dia syneidēsin theou</td><td>因為意識到神</td><td>良心面向的是神</td></tr><tr><td>πάσχων ἀδίκως</td><td>paschōn adikōs</td><td>不公義地受苦</td><td>冤屈就是冤屈</td></tr><tr><td>κολαφιζόμενοι</td><td>kolaphizomenoi</td><td>挨拳頭</td><td>太 26:67 主被拳頭打，同一個動詞</td></tr><tr><td>ποῖον γὰρ κλέος</td><td>poion gar kleos</td><td>有甚麼名聲</td><td>κλέος 新約只此一次</td></tr></table>","gram":"<p><strong>Οἱ οἰκέται（Hoi oiketai） 不是一般的 δοῦλοι（douloi），是在家裡做事的僕人。</strong>當時的家僕有的是管家、教師、醫生，也有的做粗活；身分是奴隸，生死卻常繫於主人一念。ὑποτασσόμενοι（hypotassomenoi） 是分詞當命令用，接回 2:13 的 Ὑποτάγητε（Hypotagēte）。</p><p>ἐν παντὶ φόβῳ（en panti phobō） 的「敬畏」對象是誰？可以是主人，也可以是神。前一節剛說 τὸν θεὸν φοβεῖσθε（ton theon phobeisthe），只有神得到「敬畏」；1:17 也說「存敬畏的心度你們在世寄居的日子」（1:17）。所以多數解經家讀成敬畏神，本講義從之：家僕順服，不是因為怕主人，是因為敬畏神。</p><blockquote><p>2:19--20 被兩個 χάρις（charis） 包起來：2:19 的 τοῦτο γὰρ χάρις（touto gar charis），與 2:20 的 τοῦτο χάρις παρὰ θεῷ（touto charis para theō）。和合本譯「可喜愛的」，原文是「恩典」：在神那裡被看重、被記念的事。πάσχων ἀδίκως（paschōn adikōs） 的 ἀδίκως（adikōs） 是「不公義地」，這個副詞把事情定了性：<strong>冤屈就是冤屈</strong>，彼得沒有說乖僻的主人是對的。2:20 用兩組分詞對照：ἁμαρτάνοντες καὶ κολαφιζόμενοι（hamartanontes kai kolaphizomenoi） 與 ἀγαθοποιοῦντες καὶ πάσχοντες（agathopoiountes kai paschontes），前者「有甚麼名聲」，後者「在神那裡是恩典」。</p></blockquote>","exp":"<p>「你們作僕人的，凡事要存敬畏的心順服主人；不但順服那善良溫和的，就是那乖僻的也要順服。」（2:18）這是全章最容易被誤用的一段，所以先說清楚它沒有說甚麼。</p><p>第一，<strong>新約沒有為奴隸制背書。</strong>保羅說「若能以自由，就求自由更好」（林前 7:21）；他請腓利門收回阿尼西母，「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）；他把搶人口的事列在罪的清單裡（提前 1:10）。福音的方向是解放。彼得對當時沒有選擇的人說話，教他們怎樣在不能改變的處境裡活；他不是說這個處境是對的。值得注意的是，彼得直接對家僕說話，把他們當成能作道德選擇的人，這在當時的家規裡很少見。</p><p>第二，<strong>冤屈就是冤屈。</strong>「就忍受冤屈的苦楚」（2:19），彼得用的字是「不公義地」。他不替乖僻的主人找理由。今天被霸凌、被欠薪、被性騷擾的人，遇到的就是不公義。而且今天的人多半有當時家僕沒有的東西：法律、勞動申訴、離職的自由。使用它們不違背 2:18；教會也絕不可為違法的老闆找屬靈的理由。</p><p>第三，彼得分辨兩種苦。「你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？」（2:20）因自己犯錯受的苦，不是他要安慰的苦，也不該被講成「為主受苦」。他要安慰的是「因行善受苦」的人。這也不是說每一個受苦的人都做錯了甚麼；把受苦的人先當成犯錯的人，是對冤屈的人再一次冤屈。</p><p>那麼「這是可喜愛的」說的是甚麼？不是說受苦本身討神喜悅，是說一個人「為叫良心對得住神」，在冤屈裡仍不以惡報惡，這件事在神那裡被看見、被記念。被冤枉的人最痛的，常常是沒有人看見。彼得說：神看見了，他稱之為恩典。</p>"},{"a":21,"z":23,"star":3,"grk":"<p lang=\"grc\">εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ὑμῶν ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·</p><p lang=\"grc\">ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·</p><p lang=\"grc\">ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·</p>","lit":"<p>因為你們蒙召就是為了這個，因為基督也為你們受了苦，給你們留下字帖，好叫你們緊跟他的腳印；</p><p>他沒有犯罪，在他口中也找不到詭詐；</p><p>他被辱罵時不還罵，受苦時不威嚇，只是一直交託那公義地審判的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰς τοῦτο γὰρ ἐκλήθητε</td><td>eis touto gar eklēthēte</td><td>你們蒙召就是為了這個</td><td>召，原來包括受苦</td></tr><tr><td>καὶ Χριστὸς ἔπαθεν ὑπὲρ ὑμῶν</td><td>kai Christos epathen hyper hymōn</td><td>基督也為你們受了苦</td><td>ὑπὲρ：為了你們</td></tr><tr><td>ὑπογραμμὸν</td><td>hypogrammon</td><td>字帖</td><td>新約只此一次：孩子描的範字</td></tr><tr><td>ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ</td><td>epakolouthēsēte tois ichnesin autou</td><td>緊跟他的腳印</td><td>把腳放進他踩過的坑</td></tr><tr><td>οὐκ ἀντελοιδόρει</td><td>ouk anteloidorei</td><td>不還罵</td><td>未完成式：一次又一次</td></tr><tr><td>πάσχων οὐκ ἠπείλει</td><td>paschōn ouk ēpeilei</td><td>受苦時不威嚇</td><td>未完成式</td></tr><tr><td>παρεδίδου δὲ τῷ κρίνοντι δικαίως</td><td>paredidou de tō krinonti dikaiōs</td><td>只是一直交託那公義審判的</td><td>受詞沒有寫出來</td></tr></table>","gram":"<p><strong>2:21 是全卷的樞紐。</strong>εἰς τοῦτο γὰρ ἐκλήθητε（eis touto gar eklēthēte） 把 2:20 的「行善受苦」接上呼召；ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ὑμῶν（hoti kai Christos epathen hyper hymōn） 的 καὶ（kai） 是「也」：受苦從家僕轉到基督身上。ὑπὲρ ὑμῶν（hyper hymōn） 已經預告 2:24：他的苦不只是榜樣，是替你們受的。</p><p>ὑπογραμμὸν（hypogrammon） 在新約只出現這一次。它是學寫字的孩子用的字帖：老師把字寫在上面，孩子一筆一筆照著描。羅馬的革利免也用這個字描寫基督的謙卑。ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ（hina epakolouthēsēte tois ichnesin autou） 換了第二個比喻：ἴχνεσιν（ichnesin） 是腳印，ἐπακολουθήσητε（epakolouthēsēte） 是「緊跟在後面」。字帖要一筆一筆描，腳印要一步一步踩。</p><blockquote><p>2:22 引賽 53:9，「口中也沒有詭詐」，δόλος（dolos） 正是 2:1 叫信徒脫下的那個字。2:23 用三個未完成式：ἀντελοιδόρει（anteloidorei）、ἠπείλει（ēpeilei）、παρεδίδου（paredidou），描寫的不是一次，是一再如此：每一次被罵，每一次受苦，每一次都交託。παρεδίδου（paredidou） 沒有受詞：交託的是他自己（和合本加「自己」）、他的案子，還是那些傷害他的人？原文沒說，三者都可。τῷ κρίνοντι δικαίως（tō krinonti dikaiōs） 也沒有寫出名字，和合本用小字補「主」；這一位是神，「按各人行為審判人的」（1:17）那一位。</p></blockquote>","exp":"<p>〔背景〕約 18:10--11（約翰福音講義第 18 章）</p><p>「你們蒙召原是為此；因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行。」（2:21）彼得剛對家僕說完話，接著不是給一套忍耐的技巧，是指向一個人。<strong>受冤屈的人有一張可以描的字帖。</strong></p><p>這張字帖上寫著甚麼？「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（2:23）三個動作：不還口，不威嚇，交託。不還口不是不說真話。主在大祭司面前被打的時候，問過那人：「我若說的不是，你可以指證那不是；我若說的是，你為甚麼打我呢？」（約 18:23）他指出不公義，卻不以惡報惡。交託也不是假裝沒事，是把判決交給一位公義的審判者。</p><p>寫下這幾句話的人，曾經是最不會描這張字帖的人。本系列約翰福音講義第 18 章講過：主被捉拿那晚，彼得「拔出來，將大祭司的僕人砍了一刀」（約 18:10），砍的正是一個僕人。那一夜他還「遠遠地跟著」（路 22:54）。多年以後，他寫信叫僕人們緊跟主的腳印。<strong>不是彼得自己學會了，是主在海邊再一次對他說「你跟從我吧」（約 21:19）。</strong></p><p>跟隨他的腳蹤不是叫人去找苦吃，也不是叫人留在危險裡。腳印的方向是不以惡報惡、把審判交給神；這與離開危險、尋求法律保護並不衝突。321 說耶穌是我的榜樣，這是全本新約最具體的一節：不是模糊的「像耶穌」，是一張字帖、一串腳印。但下一節馬上提醒我們，這位榜樣先是救主。</p>"},{"a":24,"z":24,"star":3,"grk":"<p lang=\"grc\">ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ μώλωπι ἰάθητε.</p>","lit":"<p>他在自己的身體裡，親自把我們的罪擔上木頭，好叫我們向罪死了，就向義活著；因他那一道鞭痕，你們得了醫治。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>αὐτὸς ἀνήνεγκεν</td><td>autos anēnenken</td><td>他親自擔上去</td><td>與 2:5 ἀνενέγκαι 同字：獻祭</td></tr><tr><td>ἐν τῷ σώματι αὐτοῦ</td><td>en tō sōmati autou</td><td>在他自己的身體裡</td><td>不是象徵，是肉身</td></tr><tr><td>ἐπὶ τὸ ξύλον</td><td>epi to xylon</td><td>上到木頭</td><td>徒 5:30；10:39</td></tr><tr><td>ταῖς ἁμαρτίαις ἀπογενόμενοι</td><td>tais hamartiais apogenomenoi</td><td>向罪死了</td><td>新約只此一次：離開、不在那裡了</td></tr><tr><td>τῇ δικαιοσύνῃ ζήσωμεν</td><td>tē dikaiosynē zēsōmen</td><td>向義活著</td><td>目的子句的落點</td></tr><tr><td>οὗ τῷ μώλωπι ἰάθητε</td><td>hou tō mōlōpi iathēte</td><td>因他的鞭痕，你們得了醫治</td><td>賽 53:5；μώλωπι 新約只此一次</td></tr></table>","gram":"<p><strong>2:24 的動詞 ἀνήνεγκεν（anēnenken） 與 2:5 的 ἀνενέγκαι（anenenkai） 是同一個字。</strong>在 2:5，信徒把靈祭「獻上」；在這裡，基督把我們的罪「擔上」木頭。這個字在七十士譯本常用於把祭物放上祭壇，賽 53:12 也用它說「他卻擔當多人的罪」。ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν（hos tas hamartias hēmōn autos anēnenken），αὐτὸς（autos） 是強調的「他親自」；ἐπὶ τὸ ξύλον（epi to xylon） 用「木頭」不用「十字架」，彼得在徒 5:30、10:39 都這樣說。</p><p>ἵνα（hina） 子句說出目的：ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν（tais hamartiais apogenomenoi tē dikaiosynē zēsōmen）。ἀπογενόμενοι（apogenomenoi） 新約只此一次，字面是「離開、不再在那裡」，和合本譯「在罪上死」。醫治的上下文就是這一句：罪的醫治。</p><blockquote><p>οὗ τῷ μώλωπι ἰάθητε（hou tō mōlōpi iathēte） 引賽 53:5。μώλωπι（mōlōpi） 是鞭打以後皮膚上腫起的那一道傷痕，新約只此一次，而且是單數：一道傷，醫治了眾人。注意人稱的轉換：前半句是「我們的罪」、「我們……活」，到了最後一句改成 ἰάθητε（iathēte），「你們」得了醫治。彼得從信仰告白轉回對家僕直接說話。在他們身上，鞭痕不是比喻。</p></blockquote>","exp":"<p>「他被掛在木頭上，親身擔當了我們的罪，使我們既然在罪上死，就得以在義上活。因他受的鞭傷，你們便得了醫治。」（2:24）上一段說基督是榜樣，這一節說他是救主。<strong>我們效法的那一位，先是替我們擔當罪的那一位。</strong>如果只有 2:21 沒有 2:24，基督教就只是一套很難做到的道德；有了 2:24，跟隨才有了起點：人先被醫治，才走得動。</p><p>「木頭」這個字，彼得在公會面前說過：「你們掛在木頭上殺害的耶穌，我們祖宗的神已經叫他復活」（徒 5:30）。這使我們想起申 21:23「被掛的人是在神面前受咒詛的」（申 21:23）：他擔當的不只是罪，也是罪帶來的咒詛。</p><p>最動人的是「鞭傷」。彼得在對家僕說話。這些人身上很多都有鞭痕，那是他們最熟悉、也最羞恥的傷。彼得告訴他們：基督身上也有這樣的傷，而且那一道傷是為你們受的。受冤屈的人往往覺得沒有人懂；這一節說，那位審判全地的主懂，因為他背上有同樣的痕跡。</p><p>這裡說的醫治，上下文是罪：「在罪上死，就得以在義上活」。這不是保證身體一定痊癒，也不是說沒有得醫治的人信得不夠；疾病與醫治的問題，見雅各書立場四。神當然可以醫治身體，生病的人也該求醫、也可以求神醫治；但這一節要我們抓住更深的醫治：罪不再定我們的命運，羞恥也不再是我們最後的名字。這是全卷地勢圖本章的又一個高處：從 2:4 被棄的石頭，到 2:24 被擊打的身體，再到我們得了醫治。</p>"},{"a":25,"z":25,"star":1,"grk":"<p lang=\"grc\">ἦτε γὰρ ὡς πρόβατα πλανώμενοι ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.</p>","lit":"<p>因為你們從前像羊一樣迷路，但如今已經被轉回，歸到你們靈魂的牧人和監督那裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὡς πρόβατα πλανώμενοι</td><td>hōs probata planōmenoi</td><td>像迷路的羊</td><td>賽 53:6；現在分詞：一直在走失</td></tr><tr><td>ἀλλὰ ἐπεστράφητε νῦν</td><td>alla epestraphēte nyn</td><td>但如今已經被轉回</td><td>不定過去式被動</td></tr><tr><td>τὸν ποιμένα καὶ ἐπίσκοπον</td><td>ton poimena kai episkopon</td><td>牧人和監督</td><td>一個冠詞統管兩個名字：同一位</td></tr><tr><td>τῶν ψυχῶν ὑμῶν</td><td>tōn psychōn hymōn</td><td>你們靈魂的</td><td>接回 2:11 與靈魂爭戰</td></tr></table>","gram":"<p>2:25 接續賽 53 的引用，這次是賽 53:6「我們都如羊走迷」。ἦτε（ēte）……πλανώμενοι（planōmenoi） 是未完成式加分詞，描寫長期的狀態：一直在走失。ἀλλὰ ἐπεστράφητε νῦν（alla epestraphēte nyn） 用不定過去式，打斷了那個狀態。</p><p>ἐπεστράφητε（epestraphēte） 是 ἐπιστρέφω（epistrephō） 的被動式，可以讀成「你們轉回了」，也可以讀成「你們被轉回了」。主對彼得說「你回頭以後，要堅固你的弟兄」（路 22:32），「回頭」就是 ἐπιστρέψας（epistrepsas），同一個字。τὸν ποιμένα καὶ ἐπίσκοπον（ton poimena kai episkopon） 只有一個冠詞，牧人與監督是同一位。ἐπίσκοπον（episkopon） 與 2:12 的 ἐπισκοπῆς（episkopēs） 同字根：外人要等到「眷顧的日子」，信徒已經被這位眷顧者找回來了。</p>","exp":"<p>〔背景〕約 21:15--17（約翰福音講義第 21 章）</p><p>「你們從前好像迷路的羊，如今卻歸到你們靈魂的牧人監督了。」（2:25）以賽亞書第 53 章在這幾節裡被引了四次，到這裡收尾。那一章說「我們都如羊走迷；各人偏行己路」（賽 53:6），彼得接著說：但你們回來了。</p><p>彼得寫「回頭」這個字的時候，不可能不想起自己。主在被賣那夜對他說：「你回頭以後，要堅固你的弟兄」（路 22:32）。本系列約翰福音講義第 21 章講過，復活的主在提比哩亞海邊三次問他「你愛我嗎」，三次託付他「你餵養我的羊」（約 21:17）。那個迷路的人被找回來，被交託去餵養別的羊。這不是彼得自己走回來的，是牧人把他找回來的。</p><p>321 的八大步驟裡，這一節是「修正」：迷路的人轉回來。修正不是自己找到路，是聽見牧人的聲音。920 的源頭也在這裡：「回頭以後，要堅固你的弟兄」，被找回來的人，成了去找別人的人。第 5 章彼得會對長老說「務要牧養在你們中間神的群羊」（5:2），而且說到「牧長顯現的時候」（5:4）。這裡先埋下伏筆：所有的牧人，都是被那位大牧人找回來的羊。</p>"}],"3":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται</p><p lang=\"grc\">ἐποπτεύσαντες τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν ὑμῶν.</p>","lit":"<p>同樣，妻子們，要順服自己的丈夫，好叫即使有些人不信從那道，也可以藉著妻子們的生活方式，不用言語就被贏得，</p><p>因為他們親眼察看了你們在敬畏中那貞潔的生活方式。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὁμοίως</td><td>Homoiōs</td><td>同樣</td><td>接回 2:13「為主的緣故」的總綱</td></tr><tr><td>ὑποτασσόμεναι</td><td>hypotassomenai</td><td>順服著</td><td>分詞，承接 2:13 的命令；說的是位置，不是價值</td></tr><tr><td>τοῖς ἰδίοις ἀνδράσιν</td><td>tois idiois andrasin</td><td>自己的丈夫</td><td>範圍在婚姻之內，不是女人對一切男人</td></tr><tr><td>ἀπειθοῦσιν τῷ λόγῳ</td><td>apeithousin tō logō</td><td>不信從那道</td><td>妻子在信仰上沒有跟從丈夫</td></tr><tr><td>ἄνευ λόγου</td><td>aneu logou</td><td>不用言語</td><td>與「那道」成文字遊戲</td></tr><tr><td>κερδηθήσονται</td><td>kerdēthēsontai</td><td>將被贏得</td><td>κερδαίνω：商場上「賺得」的字</td></tr><tr><td>ἐποπτεύσαντες</td><td>epopteusantes</td><td>細細察看了</td><td>與 2:12 同一個動詞</td></tr></table>","gram":"<p><strong>3:1 以 Ὁμοίως（Homoiōs） 開頭。</strong>「同樣」不是說妻子與家僕處境相同，是接回 2:13 的總綱：Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον（Hypotagēte pasē anthrōpinē ktisei dia ton kyrion）。2:13 對眾人，2:18 對家僕，3:1 對妻子，3:7 對丈夫（又是 ὁμοίως（homoiōs）），整段家規的理由與界線都是 διὰ τὸν κύριον（dia ton kyrion），為主的緣故。ὑποτασσόμεναι（hypotassomenai） 是分詞，文法上承接 2:13 的命令，不是一道獨立的新命令；字典形 ὑποτάσσω（hypotassō） 是「排在……之下」，一個講秩序的字，說的是位置，不是價值。</p><p>τοῖς ἰδίοις ἀνδράσιν（tois idiois andrasin），「自己的」丈夫：範圍是婚姻之內，不是女人對一切男人。同一節立刻出現對比：妻子順服，丈夫卻 ἀπειθοῦσιν τῷ λόγῳ（apeithousin tō logō），不信從那道。ἀπειθέω（apeitheō） 是全卷的反義字（2:8；3:20；4:17）。這句話藏著一個在當時很不尋常的事實：照希臘羅馬的家規，妻子要拜丈夫的神；這位妻子在最要緊的事上沒有跟丈夫走，彼得也沒有叫她回頭。</p><blockquote><p>ἄνευ λόγου κερδηθήσονται（aneu logou kerdēthēsontai） 是一個文字遊戲：不信從「道」（τῷ λόγῳ（tō logō））的人，要「不用話語」（ἄνευ λόγου（aneu logou））被得著。κερδηθήσονται（kerdēthēsontai） 是未來被動，字典形 κερδαίνω（kerdainō），原是生意上「賺得」的字；主說「你便得了你的弟兄」（太 18:15）用的也是它。3:2 的 ἐποπτεύσαντες（epopteusantes） 與 2:12 的 ἐποπτεύοντες（epopteuontes） 同一個動詞：細細察看、看了很久。他們看見的是 τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν（tēn en phobō hagnēn anastrophēn），「在敬畏中」的貞潔生活。φόβος（phobos） 在本卷首先是對神的敬畏（1:17；2:17），不是對丈夫的懼怕；3:6、3:14 會把對人的懼怕明白排除。</p></blockquote>","exp":"<p>「你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來」（3:1）。讀這一節，先要看見它的處境。收信的人多數是外邦信徒；一個信了主的妻子，在家裡不再拜丈夫家的神明，節慶不再跟著上香。在第一世紀，這已經是一種「不順從」。彼得寫給的，是一個在自己家裡因信仰成了少數的女人。</p><p>彼得對她說的第一件事，不是「你要贏這場辯論」，而是「不用言語」。「感化過來」原文是「被贏得」：丈夫不是被說服的，是被看見的。「這正是因看見你們有貞潔的品行和敬畏的心」（3:2），動詞是細細察看，像鄰居天天從窗口看。這使我們想起保羅說：「你這作妻子的，怎麼知道不能救你的丈夫呢？」（林前 7:16）兩位使徒都把不信的配偶看成福音的對象，不是敵人。</p><p>但這一段最容易被讀歪。這裡的順服是「為主的緣故」（2:13）的順服，理由是主，界線也是主。<strong>順服不是同意，不是沉默，更不是留在危險裡。</strong>這位妻子本身就沒有在信仰上跟從丈夫，彼得承認她的良心是獨立的。若有人在婚姻裡受暴力、受控制，3:1 從來不是叫她忍著用品行去換對方的改變；人身安全受威脅時，先保護生命、依法求助、通報，這正是本章自己說的「不因恐嚇而害怕」（3:6）。</p><p>321 的 920 在這裡有一張很近的臉：你的那「2」個人，可能就睡在你枕邊。彼得給的方法很慢，不是天天講道，是天天活出來。經文說的是「也可以」，不是保證每一個不信的丈夫都會被得著；但一個在家裡安靜地活出盼望的人，已經在作見證了。</p>"},{"a":3,"z":4,"star":1,"grk":"<p lang=\"grc\">ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,</p><p lang=\"grc\">ἀλλʼ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ πραέως καὶ ἡσυχίου πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.</p>","lit":"<p>你們的妝飾不要是那外面的——編結頭髮、戴上金飾、或穿上衣裳——那種妝飾，</p><p>而是那心中隱藏的人，在溫柔、安靜之靈那不能朽壞的裡面；這在神面前是極貴重的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ ἔξωθεν……κόσμος</td><td>ho exōthen … kosmos</td><td>那外面的妝飾</td><td>οὐχ……ἀλλʼ 對比的前半</td></tr><tr><td>ἐμπλοκῆς τριχῶν</td><td>emplokēs trichōn</td><td>編結頭髮</td><td>羅馬貴婦費時的髮型</td></tr><tr><td>ἐνδύσεως ἱματίων</td><td>endyseōs himatiōn</td><td>穿上衣裳</td><td>照字面當禁令，連衣服都不能穿</td></tr><tr><td>ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος</td><td>ho kryptos tēs kardias anthrōpos</td><td>心中隱藏的人</td><td>對比的後半：裡面</td></tr><tr><td>ἐν τῷ ἀφθάρτῳ</td><td>en tō aphthartō</td><td>在那不能朽壞的裡面</td><td>和合本「長久」；接 1:4、1:23</td></tr><tr><td>πολυτελές</td><td>polyteles</td><td>極貴重的</td><td>在神面前的價值</td></tr></table>","gram":"<p>3:3--4 是一組 οὐχ（ouch）……ἀλλʼ（all'） 的對比：前半是 ὁ ἔξωθεν（ho exōthen）……κόσμος（kosmos），後半是 ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος（ho kryptos tēs kardias anthrōpos）。前半列了三樣：ἐμπλοκῆς τριχῶν（編結頭髮）、περιθέσεως χρυσίων（戴上金飾）、ἐνδύσεως ἱματίων（穿上衣裳）。第三樣最能說明這種修辭：若照字面讀成禁令，連「穿衣服」也禁了。所以這不是服裝規定，是「不要以……為妝飾，只要以……為妝飾」的比較；提前 2:9 用的是同一種修辭。</p><p>κόσμος（kosmos） 在這裡不是「世界」，是它的本義「秩序、裝扮」，英文 cosmetics 由此而來；3:5 的 ἐκόσμουν（ekosmoun） 是同一個字根。外面的妝飾排列頭髮與金子，裡面的妝飾排列一顆心。</p><blockquote><p>3:4 的核心字是 ἀφθάρτῳ（aphthartō），和合本譯「長久」，字面是「不能朽壞的」。這是全卷「能壞與不能壞」的線：1:4 不能朽壞的基業、1:7 與 1:18 能壞的金子、1:23 不能壞的種子；3:3 的 χρυσίων（chrysiōn） 正是那會壞的金子。πραέως（praeōs） 與 ἡσυχίου（hēsychiou） 是「溫柔」與「安靜」；溫柔是主耶穌形容自己的字（太 11:29），不是軟弱，是有力量而不用來壓人。ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές（ho estin enōpion tou theou polyteles）：價值的標準是 ἐνώπιον τοῦ θεοῦ（enōpion tou theou），在神面前。</p></blockquote>","exp":"<p>「你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾，只要以裡面存著長久溫柔、安靜的心為妝飾；這在神面前是極寶貴的。」（3:3--4）這兩節常被拿來討論姊妹可不可以化妝、戴首飾。但經文的第三樣是「穿美衣」，原文只是「穿上衣裳」；若當作禁令，連衣服都不能穿了。<strong>對比是外面與裡面，不是禁止外面。</strong>彼得沒有規定女性的衣著，他問的是：你把甚麼當成自己的價值？</p><p>在羅馬的城市裡，貴婦的髮型要奴婢花幾個小時編起來，金飾是身分的廣告。一個丈夫不信主的妻子，可能沒有能力改變家裡很多事；彼得告訴她，有一樣東西沒有人拿得走：心裡隱藏的那個人。「長久」原文是「不能朽壞的」。金子會褪色，青春會過去，丈夫的眼光可能變冷，但在神面前被看為極寶貴的心，不會壞。</p><p>「溫柔、安靜」也不是性格測驗，外向的姊妹不必把自己改成內向。溫柔是主耶穌說「我心裡柔和謙卑」（太 11:29）的那種力量；安靜是心裡不慌，不是嘴巴不說話。同一章要每一個人「以溫柔、敬畏的心回答各人」（3:15），弟兄也在內。這是基督徒共同的妝飾，彼得先對姊妹說。321 說改變觀點：從人的眼光轉到神的眼光。對一個在家裡不被看見的人，「在神面前」四個字就是安慰。</p>"},{"a":5,"z":6,"star":3,"grk":"<p lang=\"grc\">οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,</p><p lang=\"grc\">ὡς Σάρρα ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.</p>","lit":"<p>因為從前那些盼望神的聖潔婦人，也是這樣妝飾自己，順服自己的丈夫，</p><p>如同撒拉聽從亞伯拉罕，稱他為主；你們若行善，不怕任何的驚嚇，就成了她的孩子。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>αἱ ἐλπίζουσαι εἰς θεὸν</td><td>hai elpizousai eis theon</td><td>那些盼望神的</td><td>她們的定義是盼望，不是順服</td></tr><tr><td>ἐκόσμουν ἑαυτάς</td><td>ekosmoun heautas</td><td>一直妝飾自己</td><td>未完成式</td></tr><tr><td>ὑπήκουσεν</td><td>hypēkousen</td><td>聽從了</td><td>ὑπακούω：全卷「順從」的字群</td></tr><tr><td>κύριον αὐτὸν καλοῦσα</td><td>kyrion auton kalousa</td><td>稱他為主</td><td>創 18:12 心裡的話</td></tr><tr><td>ἀγαθοποιοῦσαι</td><td>agathopoiousai</td><td>行善的</td><td>全卷的「行善」</td></tr><tr><td>μὴ φοβούμεναι μηδεμίαν πτόησιν</td><td>mē phoboumenai mēdemian ptoēsin</td><td>不怕任何驚嚇</td><td>彼得自己畫下的界線</td></tr></table>","gram":"<p>3:5 用 γάρ（gar） 接上理由，再用 οὕτως（houtōs） 把古時的婦人放進來：αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι εἰς θεὸν（hai hagiai gynaikes hai elpizousai eis theon）。她們的定義不是「順服的」，是「盼望神的」；ἐλπίζουσαι（elpizousai） 接回 1:3 的活潑盼望、1:21 的「盼望在於神」。順服在這裡又是分詞 ὑποτασσόμεναι（hypotassomenai），是盼望神的人生出來的樣子，不是她們的身分本身。ἐκόσμουν（ekosmoun） 是未完成式：她們一直這樣妝飾自己。</p><p>3:6 ὡς Σάρρα ὑπήκουσεν τῷ Ἀβραάμ（hōs Sarra hypēkousen tō Abraam）, κύριον αὐτὸν καλοῦσα（kyrion auton kalousa）。舊約裡撒拉稱亞伯拉罕「我主」，只在創 18:12，而且是她在帳棚裡暗笑、心裡自言自語時說的。κύριον（kyrion） 在當時是對丈夫的尊稱，像「先生」「老爺」；彼得挑的不是一個卑躬屈膝的場景，是一個連心裡話都帶著尊重的場景。</p><blockquote><p>本節的結尾是全段的界線：ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν（agathopoiousai kai mē phoboumenai mēdemian ptoēsin）。μηδεμίαν（mēdemian） 是「任何一種都不」；πτόησιν（ptoēsin） 新約只此一次，是驚嚇、恐嚇、叫人心驚膽跳的威脅（字典形 πτόησις（ptoēsis））。ἀγαθοποιοῦσαι（agathopoiousai） 是全卷的「行善」（2:15、20；3:17）。成為撒拉的女兒，條件不是血統，是兩件事：行善，不因恐嚇而害怕。順服與懼怕在彼得筆下是分開的：<strong>被恐嚇出來的服從，不是 3:1 的順服。</strong></p></blockquote>","exp":"<p>〔舊約〕創 18:12--12（創世記講義第 18 章）</p><p>「因為古時仰賴神的聖潔婦人正是以此為妝飾，順服自己的丈夫，就如撒拉聽從亞伯拉罕，稱他為主。」（3:5--6）彼得舉撒拉，是一個值得細看的選擇。本系列創世記講義第 18 章講過那一幕：客人在帳棚外說明年撒拉要生兒子，「撒拉心裡暗笑，說：『我既已衰敗，我主也老邁，豈能有這喜事呢？』」（創 18:12）撒拉稱丈夫「我主」，是在心裡講悄悄話的時候。彼得看見的是一個在不可能的處境裡仍然盼望神的女人：她笑過、疑惑過，最後抱著以撒說「神使我喜笑」（創 21:6）。</p><p>撒拉也不是一個凡事照辦就平安的妻子。創世記記下她兩次被丈夫說成「妹子」而陷入險境（創 12:13；20:2），兩次都是神親自介入保護她。彼得沒有說撒拉的丈夫沒有錯，他只取她心裡對神的盼望與對丈夫的尊重。<strong>撒拉的女兒，不是用血統認的，是用「行善」與「不因恐嚇而害怕」認的。</strong></p><p>「你們若行善，不因恐嚇而害怕，便是撒拉的女兒了」（3:6）是彼得自己畫下的界線，也是本講義讀 3:1--6 的鑰匙。<strong>順服不是被恐嚇。</strong>一個妻子若在家裡活在打罵、威脅、控制之中，經文沒有叫她把恐懼吞下去，反而叫她不要被恐嚇轄制。人身安全受威脅時，先保護自己和孩子的生命，向可信任的人、教會、社工與警方求助，依法申請保護；這不違背 3:1--6，這正是 3:6。教會也不可以拿這段經文勸她忍耐、勸她回到危險裡。</p><p>彼得寫給的是在異教家庭裡的少數女人：她們可能被丈夫、被婆家施壓，要她們放棄這個新的信仰。彼得說：不要怕。她們的盼望在神那裡，不在丈夫的臉色裡。今天在不信的家族裡不拿香、在年節的壓力下仍然溫柔堅定的姊妹，就站在撒拉的女兒這個行列裡。</p>"},{"a":7,"z":7,"star":3,"grk":"<p lang=\"grc\">Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.</p>","lit":"<p>丈夫們，同樣，要照著知識同住，如同對待較軟弱的器皿，就是女性的那一位，分給她尊榮，因為她們也是生命之恩的同承受者，好叫你們的禱告不被阻斷。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Οἱ ἄνδρες ὁμοίως</td><td>Hoi andres homoiōs</td><td>丈夫們，同樣</td><td>丈夫也在 2:13 的總綱之下</td></tr><tr><td>συνοικοῦντες κατὰ γνῶσιν</td><td>synoikountes kata gnōsin</td><td>照著知識同住</td><td>和合本「按情理」；cu89t 註腳「原文是知識」</td></tr><tr><td>ἀσθενεστέρῳ σκεύει</td><td>asthenesterō skeuei</td><td>較軟弱的器皿</td><td>比較級：丈夫也是器皿</td></tr><tr><td>ἀπονέμοντες τιμήν</td><td>aponemontes timēn</td><td>分給尊榮</td><td>τιμή：本卷追蹤的「尊敬」</td></tr><tr><td>συγκληρονόμοις χάριτος ζωῆς</td><td>synklēronomois charitos zōēs</td><td>生命之恩的同承受者</td><td>同一節說她與丈夫同等</td></tr><tr><td>μὴ ἐγκόπτεσθαι</td><td>mē enkoptesthai</td><td>不被阻斷</td><td>ἐγκόπτω：在路上挖溝擋路</td></tr></table>","gram":"<p><strong>3:7 又是一個 ὁμοίως（homoiōs）。</strong>彼得對妻子寫了六節，對丈夫只寫一節，但這一節的密度很高，而且同樣是命令：Οἱ ἄνδρες ὁμοίως（Hoi andres homoiōs） 把丈夫放在 2:13 同一個總綱之下。丈夫不是家規的例外，他也要為主的緣故回到本位。和合本「和妻子同住」的「妻子」是小字補上的，原文要到後面 τῷ γυναικείῳ（tō gynaikeiō）「女性的那一位」才點明。</p><p>συνοικοῦντες κατὰ γνῶσιν（synoikountes kata gnōsin），和合本譯「按情理」，cu89t 註腳說「原文是知識」。γνῶσιν（gnōsin） 是「認識、知識」：照著對她的認識同住，懂她，知道她的難處、她的負擔、她在神面前的位置。這不只是一般的「講道理」，是一個願意花時間了解妻子的丈夫。</p><p>ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ（hōs asthenesterō skeuei tō gynaikeiō），cu89t 註腳「原文作是軟弱的器皿」。σκεύει（skeuei） 是「器皿」（字典形 σκεῦος（skeuos）），而比較級 ἀσθενεστέρῳ（asthenesterō） 暗示丈夫也是器皿，只是較不軟弱；保羅說「我們有這寶貝放在瓦器裡」（林後 4:7），男女都是瓦器。「較軟弱」多數註釋解作體力與社會地位：第一世紀的妻子在法律上、經濟上都比丈夫弱勢，容易被傷害。不是智力、靈性或價值較低，同一節馬上說她是 συγκληρονόμοις χάριτος ζωῆς（synklēronomois charitos zōēs），生命之恩的「同承受者」。</p><blockquote><p>ἀπονέμοντες τιμήν（aponemontes timēn）「分給尊榮」：τιμή（timē） 是本卷追蹤的字，2:17「務要尊敬眾人」「尊敬君王」也是它的動詞。尊敬不只往上給，也往身邊給。結尾 εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν（eis to mē enkoptesthai tas proseuchas hymōn）：ἐγκόπτω（enkoptō） 原是在路上挖溝、設路障擋人前進（加 5:7「攔阻」同字）。不敬重妻子的丈夫，他的禱告路上有路障。</p></blockquote>","exp":"<p>「你們作丈夫的也要按情理和妻子同住；因她比你軟弱，與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙。」（3:7）<strong>講 3:1--6 而不講 3:7，就把彼得的家規講成了單行道。</strong>在那個文化裡，丈夫掌有幾乎所有的權力，當時的家規通常只對下位的人說話；彼得卻同樣給在上位的人一道命令。</p><p>第一個命令是「按情理」，原文是「照著知識」。一個丈夫不能只知道妻子應該怎樣，他要認識她：她怕甚麼、累在哪裡、在不信的親族裡承受了甚麼。愛從認識開始，認識要花時間。</p><p>第二個命令是「敬重她」，理由有兩個，彼得並排寫出來。一是「她比你軟弱」：當時的妻子在體力、法律、經濟上都處於弱勢，最容易被傷害。強的一方要做的，不是利用這個落差，而是把尊榮分給她。<strong>「軟弱的器皿」不是貶低女性的價值、智力或靈性</strong>；器皿男女都是，丈夫也是瓦器。二是「與你一同承受生命之恩的」：在神的家裡，她與丈夫同承產業，同一份恩典，同一個永生。在社會上她也許比你弱，在神面前她與你同等。</p><p>最後一句叫人心驚：禱告沒有阻礙。<strong>神把丈夫怎樣對待妻子，與丈夫怎樣來到神面前，綁在一起。</strong>一個在外面很屬靈、在家裡冷淡或粗暴的人，不要以為自己的禱告與家無關。夫妻之間若有暴力或控制，這節經文站在受害者那一邊：受害者的安全要先被保護，施暴者要悔改、停止傷害並負起責任。</p><p>互補派與平等派讀這段家規有不同的理解，都是弟兄姊妹，本講義不在兩派之間裁判，詳見議題頁與全卷立場三。不論哪一派，都不能繞過這一節。321 說謙卑是放下權力、回到本位：丈夫的本位不是一家之主的寶座，是一個認識妻子、敬重妻子、和她一同承受恩典的人。</p>"},{"a":8,"z":9,"star":3,"grk":"<p lang=\"grc\">Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ταπεινόφρονες</p><p lang=\"grc\">μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ εὐλογοῦντες ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.</p>","lit":"<p>而總結來說，你們眾人要同心、同感、愛弟兄、心腸慈憐、心思謙卑，</p><p>不以惡回報惡，或以辱罵回報辱罵，正相反，要祝福，因為你們是為此被召，好叫你們承受祝福。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὸ δὲ τέλος</td><td>To de telos</td><td>而總結來說</td><td>家規收口，對象回到眾人</td></tr><tr><td>φιλάδελφοι</td><td>philadelphoi</td><td>愛弟兄的</td><td>五個形容詞的軸心</td></tr><tr><td>ταπεινόφρονες</td><td>tapeinophrones</td><td>心思謙卑的</td><td>RP 作 φιλόφρονες「友善的」</td></tr><tr><td>κακὸν ἀντὶ κακοῦ</td><td>kakon anti kakou</td><td>以惡換惡</td><td>ἀντί：交換</td></tr><tr><td>λοιδορίαν ἀντὶ λοιδορίας</td><td>loidorian anti loidorias</td><td>以辱罵換辱罵</td><td>與 2:23 同字根</td></tr><tr><td>τοὐναντίον δὲ εὐλογοῦντες</td><td>tounantion de eulogountes</td><td>正相反，要祝福</td><td>方向完全相反的回應</td></tr><tr><td>εἰς τοῦτο ἐκλήθητε</td><td>eis touto eklēthēte</td><td>你們是為此被召</td><td>與 2:21 一字不差</td></tr></table>","gram":"<p>Τὸ δὲ τέλος（To de telos） 是「總結來說」，從 2:13 開始的家規在這裡收口，對象回到 πάντες（pantes），眾人。3:8 是五個形容詞排成一串，沒有動詞：ὁμόφρονες（同心）、συμπαθεῖς（同感、體恤）、φιλάδελφοι（愛弟兄）、εὔσπλαγχνοι（心腸慈憐）、ταπεινόφρονες（心思謙卑）。中間的 φιλάδελφοι（philadelphoi） 是軸心，前後各兩個；第一個與最後一個都以「心思」收尾，框住整串。</p><p><strong>經文鑑別：</strong>SBLGNT、WH、Treg、NA28 作 ταπεινόφρονες（tapeinophrones），和合本「謙卑」照這個讀法；RP（拜占庭多數本）作 φιλόφρονες（philophrones），「友善、和氣」。兩字只差字首，抄寫中容易互換；ταπεινόφρονες（tapeinophrones） 有較早的抄本支持，又與 5:5 的 ταπεινοφροσύνην（tapeinophrosynēn） 呼應，本講義從之。</p><blockquote><p>3:9 是兩個 ἀντί（anti） 的平行：κακὸν ἀντὶ κακοῦ（kakon anti kakou） 與 λοιδορίαν ἀντὶ λοιδορίας（loidorian anti loidorias），惡換惡、罵換罵，ἀντί（anti） 是「交換」。然後 τοὐναντίον δὲ εὐλογοῦντες（tounantion de eulogountes），τοὐναντίον（tounantion） 是「正好相反」：不是不回應，是換一種方向完全相反的回應。λοιδορίαν（loidorian） 與 2:23 的 λοιδορούμενος οὐκ ἀντελοιδόρει（loidoroumenos ouk anteloidorei） 同字根：主被罵不還口，現在輪到我們。ὅτι εἰς τοῦτο ἐκλήθητε（hoti eis touto eklēthēte） 與 2:21 的 εἰς τοῦτο γὰρ ἐκλήθητε（eis touto gar eklēthēte） 一字不差：家僕蒙召跟隨腳蹤，眾人蒙召祝福。ἵνα εὐλογίαν κληρονομήσητε（hina eulogian klēronomēsēte）：你祝福人，最後承受祝福的是你。</p></blockquote>","exp":"<p>「總而言之，你們都要同心，彼此體恤，相愛如弟兄，存慈憐謙卑的心。」（3:8）家規講完了政府、職場、家庭，彼得回到教會裡的每一個人。五個詞像一隻手的五根手指，中間那根是「相愛如弟兄」。一群在外面被誤會、在家裡被施壓的寄居者，最需要的是一個彼此體恤的群體。321 的 235 在這裡是「2」：屬靈的同伴。謙卑在第 3 章就出現了，到第 5 章才講完整。</p><p>「不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。」（3:9）這是本章的章題，也是全卷「望・石・福・火・牧」的「福」。「福」在這裡不是福氣，是祝福這個動作。被罵的時候，人有三條路：罵回去、不說話、祝福。彼得叫我們走第三條，「倒要」原文就是「正好相反」。</p><p>寫這句話的人，曾經在園子裡拔出刀來，「將大祭司的僕人砍了一刀，削掉他的右耳」（約 18:10）。主對他說「收刀入鞘吧」（約 18:11）。三十年後，這個拔過刀的人寫信叫各地的信徒祝福辱罵他們的人。不是彼得變好了，是主沒有放棄他，帶他走過十字架和空墳墓，讓他看見那位「被罵不還口」（2:23）的主。這使我們想起主自己的話：「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44）；保羅也說「不要以惡報惡」（羅 12:17）。</p><p>但祝福不是縱容惡人。<strong>不以惡報惡，不等於不追究責任、不申訴、不報警。</strong>報復是我自己奪回審判的權柄；申訴與求助是把事情交給神所設立的秩序。一個在職場被霸凌的人可以祝福對方，也可以依法申訴；一個受家暴的人可以不咒詛對方，同時離開危險、尋求保護。祝福拒絕的是仇恨，不是公義。</p><p>「因你們是為此蒙召」：被惡待的人不只是被要求忍耐，是被召去做一件主動的事。彼得接著說「好叫你們承受福氣」，祝福人的人，自己也被祝福充滿。這是寄居者在敵意的世界裡最有力量的回應：別人搶不走你祝福人的自由。</p>"},{"a":10,"z":12,"star":1,"grk":"<p lang=\"grc\">ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν γλῶσσαν ἀπὸ κακοῦ καὶ χείλη τοῦ μὴ λαλῆσαι δόλον,</p><p lang=\"grc\">ἐκκλινάτω δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·</p><p lang=\"grc\">ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.</p>","lit":"<p>因為那願意愛生命、並要看見好日子的，要使舌頭止住惡，使嘴唇不說詭詐；</p><p>要轉離惡，並行善；要尋求和平，並追趕它。</p><p>因為主的眼目在義人身上，他的耳朵向著他們的祈求；但主的臉向著那些行惡的人。</p>","key":"","gram":"<p>3:10--12 引詩 34:12--16（七十士譯本 33:13--17），用 γάρ（gar） 接上：為甚麼要祝福？因為經上這樣說。和合本在 3:10 用小字補「經上說」。彼得把詩篇的問句「有何人喜好存活」改成直述的主詞片語 ὁ γὰρ θέλων ζωὴν ἀγαπᾶν（ho gar thelōn zōēn agapan），又把第二人稱的命令改成第三人稱：παυσάτω（pausatō）、ἐκκλινάτω（ekklinatō）、ποιησάτω（poiēsatō）、ζητησάτω（zētēsatō）、διωξάτω（diōxatō）。五個第三人稱命令式排成一列，像一份寫給每一個人的生活守則。</p><p>ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν（zētēsatō eirēnēn kai diōxatō autēn）：「尋求」之後還要「追趕」。διώκω（diōkō） 也是「逼迫」的那個字：世界在逼迫你，你在追趕和睦。3:12 停在詩 34:16 的上半句「耶和華向行惡的人變臉」，沒有引下半句「要從世上除滅他們的名號」（詩 34:16）；彼得留下審判的方向，卻把話停在神的臉上。七十士譯本的「耶和華」在這裡是 κυρίου（kyriou），彼得照用，讀者自然想到他們所稱的主。</p>","exp":"<p>「因為經上說：人若愛生命，願享美福，須要禁止舌頭不出惡言，嘴唇不說詭詐的話；也要離惡行善，尋求和睦，一心追趕。」（3:10--11）彼得為「倒要祝福」找了一個舊約的根據：詩篇 34 篇。那篇詩的標題說，是大衛在亞比米勒面前裝瘋逃命之後寫的；一個在逃亡中的人，寫下怎樣好好活著。</p><p>詩篇給的第一件事是舌頭。被辱罵的時候，最先想反擊的就是舌頭。「禁止舌頭不出惡言」不是不准說話，是不讓舌頭成為報復的武器（這使我們想起雅 3:2--10）。第二件事是「離惡行善」，第三件事是「尋求和睦，一心追趕」。和睦不會自己來，它常常跑在前面，要人去追。</p><p>「因為，主的眼看顧義人；主的耳聽他們的祈禱。惟有行惡的人，主向他們變臉。」（3:12）這是祝福的人能放手的理由：審判不在我手裡，主的眼睛看得見，主的耳朵聽得見。被冤枉的人最怕沒有人看見；詩篇說，主看見。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ζηλωταὶ γένησθε;</p><p lang=\"grc\">ἀλλʼ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,</p>","lit":"<p>而如果你們成了熱心於那善的人，誰是那要加害你們的呢？</p><p>但即使你們因義受苦，也是有福的。他們的懼怕，你們不要怕，也不要驚慌；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τίς ὁ κακώσων ὑμᾶς</td><td>tis ho kakōsōn hymas</td><td>誰是要加害你們的</td><td>修辭問句</td></tr><tr><td>ζηλωταὶ</td><td>zēlōtai</td><td>熱心的人</td><td>RP 作 μιμηταὶ「效法者」</td></tr><tr><td>εἰ καὶ πάσχοιτε</td><td>ei kai paschoite</td><td>即使你們受苦</td><td>祈願語氣：可能，不是必然</td></tr><tr><td>μακάριοι</td><td>makarioi</td><td>有福的</td><td>與太 5:10 同字</td></tr><tr><td>τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε</td><td>ton de phobon autōn mē phobēthēte</td><td>他們的懼怕你們不要怕</td><td>賽 8:12</td></tr><tr><td>μηδὲ ταραχθῆτε</td><td>mēde tarachthēte</td><td>也不要驚慌</td><td>約 14:1「不要憂愁」同字</td></tr></table>","gram":"<p>3:13 Καὶ τίς ὁ κακώσων ὑμᾶς（Kai tis ho kakōsōn hymas） 是修辭問句，κακώσων（kakōsōn） 是未來分詞，「那要加害你們的」。這個問句不是天真地保證沒有人會害你，下一節馬上說「就是為義受苦」。它問的是：誰能真正傷到一個在神手中的人？ζηλωταὶ（zēlōtai）「熱心的人」，RP 作 μιμηταὶ（mimētai）「效法者」；兩個讀法意思相近，本講義照 SBLGNT 與和合本。</p><p>3:14 ἀλλʼ εἰ καὶ πάσχοιτε（all' ei kai paschoite）：πάσχοιτε（paschoite） 是祈願語氣，新約很少見，表示一個不確定、但有可能的情況，「就算你們真的受苦」。彼得沒有說受苦是常態，也沒有說不會發生。μακάριοι（makarioi） 一個字成句，與主在山上寶訓的「有福了」同一個字。</p><blockquote><p>τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε（ton de phobon autōn mē phobēthēte mēde tarachthēte） 取自賽 8:12。cu89t 註腳「或譯所怕的」：αὐτῶν（autōn） 可以是「他們（逼迫者）帶來的懼怕」，也可以是「他們（不信的人）所怕的那些東西」。以賽亞的原意偏向後者：「他們所怕的，你們不要怕」（賽 8:12）；彼得的上下文使前者更貼近：不要被威嚇者嚇倒。兩種讀法同指一件事——不要讓人的懼怕成為你的主人。ταραχθῆτε（tarachthēte） 是主在樓上對門徒說「你們心裡不要憂愁」的那個動詞（約 14:1）。</p></blockquote>","exp":"<p>「你們若是熱心行善，有誰害你們呢？你們就是為義受苦，也是有福的。」（3:13--14）這兩句放在一起，第一句聽起來太樂觀，第二句又把樂觀拉回地面。彼得不是說行善的人不會受苦；他說，真正能毀掉你的人不存在，就算受苦，也不能奪去你的福。這使我們想起主在山上說的：「為義受逼迫的人有福了」（太 5:10）。</p><p>這裡要分清楚。彼得安慰的是「為義受苦」的人，不是因為作惡受苦的人（4:15）；他也沒有叫人去找苦。受苦本身不是美德，不是越苦越屬靈；「為甚麼受苦」才是要問的。一個在職場拒絕做假帳而被調職的人、一個因信主被家族冷落的人，他們的苦有一個名字：為義。這樣的人，神稱他有福。他可以傷心，可以向人訴說，可以尋求幫助；有福不是要他假裝不痛。</p><p>「不要怕人的威嚇，也不要驚慌」（3:14）。全卷地勢圖在這裡落到低谷：寄居者心裡最真實的光景就是怕。彼得沒有責備他們怕，他給他們一個替代：下一節要說的，是心裡那個位置該由誰來坐。<strong>懼怕不是靠意志壓下去的，是被一個更大的敬畏取代的。</strong>怕被親族排擠、怕丟掉工作、怕被人在背後議論，這些都是真實的；彼得沒有說它們不存在，只說它們不配坐上王座。</p>"},{"a":15,"z":15,"star":3,"grk":"<p lang=\"grc\">κύριον δὲ τὸν Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος, ἀλλὰ μετὰ πραΰτητος καὶ φόβου,</p>","lit":"<p>卻要在你們心裡尊主——就是基督——為聖，常常預備好，向每一個向你們要求說明你們裡面盼望之理由的人作答辯，只是要帶著溫柔和敬畏，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κύριον δὲ τὸν Χριστὸν</td><td>kyrion de ton Christon</td><td>主——就是基督</td><td>賽 8:13 的萬軍之耶和華；RP 作 θεόν</td></tr><tr><td>ἁγιάσατε</td><td>hagiasate</td><td>你們要尊為聖</td><td>不定過去式命令</td></tr><tr><td>ἐν ταῖς καρδίαις ὑμῶν</td><td>en tais kardiais hymōn</td><td>在你們心裡</td><td>王座的位置</td></tr><tr><td>ἕτοιμοι ἀεὶ</td><td>hetoimoi aei</td><td>常常預備好</td><td>不是臨時應付</td></tr><tr><td>πρὸς ἀπολογίαν</td><td>pros apologian</td><td>為了答辯</td><td>法庭用語，這裡是日常的提問</td></tr><tr><td>περὶ τῆς ἐν ὑμῖν ἐλπίδος</td><td>peri tēs en hymin elpidos</td><td>關於你們裡面的盼望</td><td>人家問的是盼望</td></tr><tr><td>ἀλλὰ μετὰ πραΰτητος καὶ φόβου</td><td>alla meta praytētos kai phobou</td><td>只是要帶著溫柔和敬畏</td><td>SBLGNT 屬 3:16，依和合本移入 3:15</td></tr></table>","gram":"<p><strong>3:15 是全卷最清楚的一句基督神性宣告。</strong>3:14 下取自賽 8:12，3:15 上接著用賽 8:13。以賽亞說：「但要尊萬軍之耶和華為聖，以他為你們所當怕的，所當畏懼的。」（賽 8:13）彼得的句子是 κύριον δὲ τὸν Χριστὸν ἁγιάσατε（kyrion de ton Christon hagiasate）。七十士譯本在這裡只說要尊「主」為聖，彼得在 κύριον（kyrion） 之後放進 τὸν Χριστὸν（ton Christon）：以賽亞要百姓尊為聖的萬軍之耶和華，彼得說就是基督。這不是引錯，是使徒的解經——他把舊約只歸給耶和華的敬畏，放在基督身上。</p><p><strong>經文鑑別：</strong>SBLGNT、WH、Treg、NA28 作 κύριον δὲ τὸν Χριστὸν（kyrion de ton Christon），和合本「主基督」照這個讀法；RP 作 κύριον δὲ τὸν θεόν（kyrion de ton theon），「主神」，正好與七十士譯本的賽 8:13 較近，可能是抄寫者向舊約靠攏的結果。較難的讀法「基督」較可能是原文，又有較早的抄本支持，本講義從之。</p><p>ἁγιάσατε（hagiasate） 是不定過去式命令：要尊為聖，就是承認他是聖的，把他放在獨一的位置；位置在 ἐν ταῖς καρδίαις ὑμῶν（en tais kardiais hymōn），你們心裡。ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν（hetoimoi aei pros apologian）：ἀπολογία（apologia） 是法庭上的「答辯」，保羅在耶路撒冷的群眾和腓立比的書信裡都用它；但這裡的提問者是 παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον（panti tō aitounti hymas logon），「每一個向你們要理由的人」，是日常的、鄰舍的提問。他們問的不是教義，是 περὶ τῆς ἐν ὑμῖν ἐλπίδος（peri tēs en hymin elpidos），你們裡面的盼望。</p><blockquote><p><strong>原文位移：</strong>ἀλλὰ μετὰ πραΰτητος καὶ φόβου（alla meta praytētos kai phobou） 在 SBLGNT 是 3:16 的句首；和合本把它歸到 3:15 句末「以溫柔、敬畏的心回答各人」，本講義的原文欄已依和合本分節移入 3:15。ἀλλά（alla） 在這裡是「只是」：答辯要有，方式要溫柔、要敬畏。φόβου（phobou） 照本卷用法是對神的敬畏（1:17；2:17），不是對提問者的懼怕；3:14 才說過不要怕他們。</p></blockquote>","exp":"<p>〔背景〕可 14:66--72</p><p>「只要心裡尊主基督為聖。」（3:15）懼怕的解藥不是勇氣，是一個王座。人心裡有一個位置，坐在那裡的，就是我們最怕失去、最想討好的那一位。以賽亞叫百姓不要怕亞述，要敬畏萬軍之耶和華；彼得把這句話交給寄居的信徒，只換了一個名字：主基督。<strong>心裡的王座只有一位。</strong>那一位坐穩了，別人的威嚇就坐不上去。321 說讓耶穌作王，就落在這一句。</p><p>「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人」（3:15）。寫這句話的人，曾經在大祭司的院子裡烤火，一個使女對他說：「你素來也是同拿撒勒人耶穌一夥的。」（可 14:67）他回答：「我不知道，也不明白你說的是甚麼。」（可 14:68）那一夜他沒有準備好。後來他在公會面前放膽講論，人「認明他們是跟過耶穌的」（徒 4:13）。不是彼得變得能言善辯，是復活的主在海邊把他重新找回來。這位曾經答不出來的人，現在叫我們常作準備。</p><p>注意人家問的是甚麼：不是「你的宗教有甚麼教義」，是「你心中盼望的緣由」。寄居的人過著與鄰舍不同的生活，被毀謗，卻仍有盼望，這讓人好奇。答辯不是辯論比賽，不必贏；它是把盼望的來源說出來：一位從死裡復活的主（1:3）。</p><p>方式與內容一樣要緊：「以溫柔、敬畏的心」。溫柔是對人，敬畏是對神。一場在網路上把人駁倒、卻讓人更遠離基督的辯論，不是 3:15。常作準備，也包括準備自己的心：先在心裡尊主為聖，口裡的答案才不會變成武器。</p>"},{"a":16,"z":17,"star":1,"grk":"<p lang=\"grc\">συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.</p><p lang=\"grc\">κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.</p>","lit":"<p>存著美好的良心，好叫在你們被毀謗的事上，那些辱罵你們在基督裡美好生活方式的人蒙羞。</p><p>因為若神的旨意願意，行善而受苦，比行惡而受苦更好。</p>","key":"","gram":"<p>3:16 συνείδησιν ἔχοντες ἀγαθήν（syneidēsin echontes agathēn） 是分詞，接著 3:15 的答辯：開口之前，先有無虧的良心。συνείδησις（syneidēsis） 在本卷出現三次（2:19；3:16；3:21），3:21 的洗禮也落在「無虧的良心」上。ἵνα ἐν ᾧ καταλαλεῖσθε（hina en hō katalaleisthe） 與 2:12 的 ἐν ᾧ καταλαλοῦσιν ὑμῶν（en hō katalalousin hymōn） 同一個結構：毀謗是現實，彼得沒有說它會停。οἱ ἐπηρεάζοντες（hoi epēreazontes） 是「惡意辱罵、誣賴」的人，主說「凌辱你們的，要為他禱告」（路 6:28）用的是同一個字；καταισχυνθῶσιν（kataischynthōsin） 是「蒙羞」：讓真相自己說話。</p><p>3:17 κρεῖττον γὰρ ἀγαθοποιοῦντας（kreitton gar agathopoiountas）……πάσχειν ἢ κακοποιοῦντας（paschein ē kakopoiountas）：κρεῖττον（kreitton）「更好」是希伯來書的鑰字（來 1:4；7:19；12:24），彼得用它比較兩種受苦。εἰ θέλοι τὸ θέλημα τοῦ θεοῦ（ei theloi to thelēma tou theou） 又是祈願語氣，與 3:14 的 πάσχοιτε（paschoite） 一樣表示可能而非必然：受苦是神可能允許的，不是我們去製造的。</p>","exp":"<p>「存著無虧的良心，叫你們在何事上被毀謗，就在何事上可以叫那誣賴你們在基督裡有好品行的人自覺羞愧。」（3:16）彼得要信徒在被毀謗的時候，先顧自己的良心，不先顧自己的名聲。名聲可以被人拿走，無虧的良心只能自己丟掉。當毀謗與事實不符，時間會替你說話；誣賴的人最後要面對的，是一個他們說不出錯處的生命。</p><p>「神的旨意若是叫你們因行善受苦，總強如因行惡受苦。」（3:17）這一節分辨了兩種苦。因行惡受苦，是自己種的；因行善受苦，是為主的緣故擔的。<strong>受苦本身不是美德，「因甚麼」受苦才是。</strong>彼得也不是說受苦的人都有罪；恰恰相反，他安慰的正是那些沒有作惡卻受苦的人。「神的旨意若是」表示這是神可能允許的事，不是我們該去尋找的事。</p><p>這一節也為下一段鋪路。「總強如」之後，彼得用 ὅτι（hoti） 接上 3:18：因為基督也曾這樣受苦。為義受苦的人，不是第一個走這條路的。</p>"},{"a":18,"z":18,"star":3,"grk":"<p lang=\"grc\">ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ἔπαθεν δίκαιος ὑπὲρ ἀδίκων, ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·</p>","lit":"<p>因為基督也曾一次為罪受苦，義的替不義的，好引你們到神面前；在肉身上被治死，在靈裡被賦予生命；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἅπαξ</td><td>hapax</td><td>一次</td><td>一次永遠；來 9:28 同字</td></tr><tr><td>περὶ ἁμαρτιῶν ἔπαθεν</td><td>peri hamartiōn epathen</td><td>為罪受了苦</td><td>WH Treg 作 ἀπέθανεν「受死」</td></tr><tr><td>δίκαιος ὑπὲρ ἀδίκων</td><td>dikaios hyper adikōn</td><td>義的替不義的</td><td>替代</td></tr><tr><td>ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ</td><td>hina hymas prosagagē tō theō</td><td>好引你們到神面前</td><td>帶人覲見</td></tr><tr><td>θανατωθεὶς μὲν σαρκὶ</td><td>thanatōtheis men sarki</td><td>在肉身上被治死</td><td>μέν……δέ 的前半</td></tr><tr><td>ζῳοποιηθεὶς δὲ πνεύματι</td><td>zōopoiētheis de pneumati</td><td>在靈裡被賦予生命</td><td>復活：神的作為</td></tr></table>","gram":"<p><strong>經文鑑別：</strong>SBLGNT、RP、NA28 作 περὶ ἁμαρτιῶν ἔπαθεν（peri hamartiōn epathen），「為罪受苦」，和合本照這個讀法；WH、Treg 與舊版 NIV 所依的希臘文底本作 ἀπέθανεν（apethanen），「受死」，cu89t 註腳「有古卷：受死」。兩種讀法都有早期抄本。ἔπαθεν（epathen） 與上下文更貼：3:14、3:17 都在講受苦，彼得用同一個動詞把信徒的苦與基督的苦連起來，2:21 也是 Χριστὸς ἔπαθεν（Christos epathen）；改成「受死」可能是抄寫者受了「為罪」二字的牽引。本講義從「受苦」，同時清楚：這裡的受苦就是受死，後半句的 θανατωθεὶς（thanatōtheis） 已經說了。</p><p>ἅπαξ（hapax）「一次」，就是一次永遠，與來 9:28「基督既然一次被獻」同一個字：基督的受苦不必重複，也不能重複。δίκαιος ὑπὲρ ἀδίκων（dikaios hyper adikōn），「義的替不義的」，兩個字只差一個否定字首，ὑπὲρ（hyper） 放在中間，就是替代本身。ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ（hina hymas prosagagē tō theō）：SBLGNT 作 ὑμᾶς（hymas）「你們」，和合本作「我們」（有抄本作 ἡμᾶς（hēmas））；προσαγάγῃ（prosagagē） 是把人帶到君王或神面前覲見，受苦的目的不只是除罪，是把人帶到神面前。</p><blockquote><p>θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι（thanatōtheis men sarki zōopoiētheis de pneumati） 是一組 μὲν（men）……δὲ（de） 的平行：兩個不定過去式被動分詞，兩個不帶介系詞的與格。和合本譯「按著肉體說……按著靈性說」，意思不是「身體死了，只剩靈魂活著」，而是兩個領域：在肉身、屬人的層面被治死；在靈、屬神的層面被賦予生命，指的就是復活。ζῳοποιηθεὶς（zōopoiētheis） 是被動，是神的作為，與 1:3「藉耶穌基督從死裡復活」同一件事。</p></blockquote>","exp":"<p>「因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。」（3:18）全卷地勢圖在這一節升到 96，是本章的山頂。彼得剛講完為義受苦的人，他沒有用一個道理安慰他們，他把他們帶到十字架前：「基督也曾」。你走的路，他先走過。</p><p>但彼得馬上讓我們看見，基督的受苦與我們的不一樣。我們是為義受苦，他是「為罪」受苦；我們受苦救不了任何人，他受苦是「義的代替不義的」。<strong>我們效法的那一位，先是替我們擔當罪的那一位</strong>，這是全卷樞紐 2:21--24 的再一次響起。「一次」是說這件事已經做完了，不必再補，也不能再加。為義受苦的人不是在替自己贖罪，他們是在跟隨一位已經贖完罪的主。</p><p>受苦的目的寫得很清楚：「為要引我們到神面前」。不只是把我們從罪裡拉出來，是把我們帶進去，帶到神面前。一個在家裡被誤會、在職場被冤枉、在親族裡被排擠的人，可能覺得自己被推到了邊緣；這一節說，基督的受苦把你帶到了中心。寄居的人在地上沒有位置，在神面前有。</p><p>「按著肉體說，他被治死；按著靈性說，他復活了。」（3:18）彼得的公式又出現了：「基督受苦難，後來得榮耀」（1:11）。當年說「主啊，萬不可如此」（太 16:22）的彼得，曾經只要榮耀不要十字架；本系列馬太福音講義第 16 章講過那一幕。現在他把受死與復活放在同一句裡。不是彼得自己想通了，是復活的主讓他看見：十字架之後有空墳墓。321 說焦點在耶穌：受苦的人最容易盯著自己的苦，這一節把眼光轉到那位受苦、復活、並且把我們帶到神面前的主身上。</p>"},{"a":19,"z":20,"star":3,"grk":"<p lang=\"grc\">ἐν ᾧ καὶ τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν,</p><p lang=\"grc\">ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ὀλίγοι τοῦτʼ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν διʼ ὕδατος.</p>","lit":"<p>在這靈裡，他也去了，向那些在監獄裡的靈宣告了，</p><p>就是那些從前不信從的，當神的忍耐在挪亞的日子一直等待、方舟正被預備的時候；進入其中的少數人，就是八個魂，藉著水被救過來了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν ᾧ</td><td>en hō</td><td>在這靈裡／在其中</td><td>可指聖靈、復活的狀態，或「那時」</td></tr><tr><td>τοῖς ἐν φυλακῇ πνεύμασιν</td><td>tois en phylakē pneumasin</td><td>那些在監獄裡的靈</td><td>人，還是墮落天使？</td></tr><tr><td>πορευθεὶς</td><td>poreutheis</td><td>去了</td><td>3:22 同一個分詞：升天</td></tr><tr><td>ἐκήρυξεν</td><td>ekēryxen</td><td>宣告了</td><td>傳令官的字，不必是傳福音</td></tr><tr><td>ἀπειθήσασίν ποτε</td><td>apeithēsasin pote</td><td>從前不信從的</td><td>與 3:1 的 ἀπειθοῦσιν 同字</td></tr><tr><td>ἡ τοῦ θεοῦ μακροθυμία</td><td>hē tou theou makrothymia</td><td>神的忍耐</td><td>一直等待</td></tr><tr><td>ὀκτὼ ψυχαί</td><td>oktō psychai</td><td>八個魂</td><td>少數得救</td></tr></table>","gram":"<p><strong>3:19 是新約最難解的經文之一。</strong>五個問題疊在一起：ἐν ᾧ（en hō） 是「藉這靈」、「在這狀態中」還是「在那時」？πορευθεὶς（poreutheis） 是往下（陰間）還是往上（升天）？ἐκήρυξεν（ekēryxen） 是傳福音還是宣告？τοῖς ἐν φυλακῇ πνεύμασιν（tois en phylakē pneumasin） 是死去的人還是墮落的天使？時間是挪亞的時代、受死與復活之間，還是復活升天時？歷代主要有五種讀法，各家要保護的東西不同：</p><p>①<strong>藉挪亞傳道說</strong>：先存的基督在挪亞的時代，藉著聖靈、藉著挪亞（彼後 2:5 稱他是傳義道的）向當時的人傳道，那些人如今在監獄裡（奧古斯丁與許多改革宗註釋）；它保護的是死後沒有另一次悔改的機會。②<strong>下到陰間傳福音說</strong>：基督在死與復活之間下到陰間，給挪亞時代的死人悔改的機會（部分早期教父）；<strong>本講義不採用</strong>，經文沒有說他們回應了甚麼，聖經也不教導死後還有機會。③<strong>下到陰間宣告得勝說</strong>：基督在死與復活之間下到陰間，向那裡的靈宣告得勝，這是使徒信經「降在陰間」的一種理解（天主教、東正教與路德宗的部分傳統）；它保護的是基督的勝利是全面的。④<strong>向墮落天使宣告說</strong>：「靈」在新約單獨使用時幾乎都指靈界的存在，不指死去的人；「監獄」使我們想起被拘禁的犯罪天使（彼後 2:4；猶 6），也使我們想起創 6:1--4 的背景；基督復活升天時向他們宣告得勝（多數近代福音派註釋）；它保護的是 3:22 的上下文邏輯。⑤<strong>綜合說</strong>：3:19 是向邪靈宣告得勝，4:6 另指福音曾傳給現在已死的人。</p><blockquote><p><strong>本講義的主要讀法是第四種</strong>，理由在上下文：πορευθεὶς（poreutheis） 在 3:22 再出現一次，πορευθεὶς εἰς οὐρανὸν（poreutheis eis ouranon），「進入天堂」，同一個分詞，同一趟路；3:22 的結論 ὑποταγέντων αὐτῷ ἀγγέλων（hypotagentōn autō angelōn） 正是這個宣告的結果。ἐκήρυξεν（ekēryxen） 是傳令官宣告的字，宣告的內容由上下文決定，不必是傳福音。3:20 ἀπειθήσασίν ποτε（apeithēsasin pote） 是不定過去式分詞：他們「從前」不信從；ἡ τοῦ θεοῦ μακροθυμία（hē tou theou makrothymia） 在那時 ἀπεξεδέχετο（apexedecheto），未完成式，一直等待。διεσώθησαν διʼ ὕδατος（diesōthēsan di' hydatos） 的「藉著水」可以是「穿過水」，也可以是「以水為工具」，3:21 接的是後者。</p></blockquote>","exp":"<p>〔舊約〕創 6:14--22（創世記講義第 6 章）</p><p>「他藉這靈曾去傳道給那些在監獄裡的靈聽，就是那從前在挪亞預備方舟、神容忍等待的時候，不信從的人。」（3:19--20）路德說這是新約裡最難懂的一段。本講義在原文觀察裡並陳了五種讀法，主要讀法是：復活的基督在升天的路上，向被拘禁的墮落靈界宣告他的得勝。各宗派對這節有不同的理解，都是弟兄姊妹；讀這一節，不必先解決每一個細節，才能抓住它的重點。</p><p><strong>3:19 最重要的不是「誰在監獄裡」，是「誰是得勝者」。</strong>彼得剛講完基督「被治死」又「復活了」（3:18），接著說他「去」宣告，最後說他「進入天堂，在神的右邊」（3:22）。這是一條得勝的路線：十字架、復活、宣告、升天、掌權。連監獄裡的靈都聽見了：他得勝了。對一群被毀謗、被威嚇的寄居者，這是最強的安慰——在背後搧動敵意的權勢，已經聽過了判決。</p><p>這一節也劃出幾條界線。<strong>本講義不教死後第二次機會</strong>：經文沒有說這些靈回應了甚麼，聖經一貫的呼召是「現在正是悅納的時候」（林後 6:2）。<strong>本講義也不斷定任何亡者的去處</strong>，特別是沒有信主就過世的家人。我們不知道人在最後一刻與神之間發生了甚麼；我們知道神是公義的，也是滿有憐憫的，我們把所愛的人交在他手裡（帖撒羅尼迦前書立場三）。經文沒有給我們一張陰間的地圖，我們就不畫。</p><p>彼得為甚麼提挪亞？本系列創世記講義第 6 章講過那個世代：地上滿了強暴，神卻還在等。「神容忍等待」原文是神的忍耐一直在等，方舟造了很多年，每一錘都是邀請。最後得救的「不多，只有八個人」（3:20）。收信的教會也是少數，散在五個地區裡，被多數人以為怪。彼得告訴他們：少數不等於失敗，神就是藉著挪亞一家八口，把人類帶過洪水。</p>"},{"a":21,"z":22,"star":3,"grk":"<p lang=\"grc\">ὃ καὶ ὑμᾶς ἀντίτυπον νῦν σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, διʼ ἀναστάσεως Ἰησοῦ Χριστοῦ,</p><p lang=\"grc\">ὅς ἐστιν ἐν δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.</p>","lit":"<p>這水的對應——洗禮——現在也拯救你們：不是除去肉身的污穢，而是一個美好良心向神的求問，藉著耶穌基督的復活，</p><p>他已經進到天上，在神的右邊，天使、掌權的和有能的都已服從了他。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀντίτυπον</td><td>antitypon</td><td>對應的印記</td><td>挪亞的水與洗禮：彼得自己作的連結</td></tr><tr><td>σῴζει βάπτισμα</td><td>sōzei baptisma</td><td>洗禮拯救</td><td>和合本小字補「這洗禮」</td></tr><tr><td>σαρκὸς ἀπόθεσις ῥύπου</td><td>sarkos apothesis rhypou</td><td>除去肉身的污穢</td><td>水本身沒有能力</td></tr><tr><td>συνειδήσεως ἀγαθῆς ἐπερώτημα</td><td>syneidēseōs agathēs eperōtēma</td><td>美好良心的求問／承諾</td><td>ἐπερώτημα 新約只此一次</td></tr><tr><td>διʼ ἀναστάσεως Ἰησοῦ Χριστοῦ</td><td>di' anastaseōs Iēsou Christou</td><td>藉著耶穌基督的復活</td><td>救人的動力</td></tr><tr><td>ἐν δεξιᾷ θεοῦ</td><td>en dexia theou</td><td>在神的右邊</td><td>詩 110:1</td></tr><tr><td>ὑποταγέντων αὐτῷ</td><td>hypotagentōn autō</td><td>都服從了他</td><td>全卷「順服」的字，頂點</td></tr></table>","gram":"<p>3:21 以關係代名詞 ὃ（ho） 開頭，指回 3:20 的 ὕδατος（hydatos）：「這水」。和合本「這水所表明的洗禮」中，「這洗禮」是小字補充：原文是 ὃ καὶ ὑμᾶς ἀντίτυπον νῦν σῴζει βάπτισμα（ho kai hymas antitypon nyn sōzei baptisma），βάπτισμα（baptisma） 與 ὃ（ho） 同位：那水，以「對應物」的形式，就是洗禮，現在也拯救你們。ἀντίτυπον（antitypon） 是「對應的印記」，像印章與它蓋出來的印：挪亞的水是一端，洗禮是另一端。這是彼得自己作的連結，所以可以講滿。</p><p>彼得馬上用 οὐ（ou）……ἀλλὰ（alla） 防止誤解：οὐ σαρκὸς ἀπόθεσις ῥύπου（ou sarkos apothesis rhypou），不是除掉身上的髒，水本身沒有能力；ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν（alla syneidēseōs agathēs eperōtēma eis theon）。<strong>ἐπερώτημα（eperōtēma） 新約只此一次</strong>，有三種主要理解：①向神的「求問」，和合本「只求」照這個意思，求一個無虧的良心；②向神的「回應、承諾」：後來的契約文書用這個字指訂約時的問答與允諾，受洗的人回答「我信」，就是向神立下的承諾；③「出於」無虧良心向神的求問。不論哪一種，洗禮的重心都是人向神的回應，不是一個自動生效的儀式。</p><blockquote><p>救人的動力寫在最後：διʼ ἀναστάσεως Ἰησοῦ Χριστοῦ（di' anastaseōs Iēsou Christou），藉著耶穌基督的復活，接回 1:3。3:22 的 ὅς ἐστιν ἐν δεξιᾷ θεοῦ（hos estin en dexia theou） 回響詩 110:1；πορευθεὶς εἰς οὐρανὸν（poreutheis eis ouranon） 與 3:19 是同一個 πορευθεὶς（poreutheis）。最後是獨立屬格分詞片語 ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων（hypotagentōn autō angelōn kai exousiōn kai dynameōn）：ὑποτάσσω（hypotassō） 是全卷「順服」的字。妻子順服、家僕順服、眾人順服，最後是天使與一切權勢都已經服從了他；不定過去式，已經成就。</p></blockquote>","ex
