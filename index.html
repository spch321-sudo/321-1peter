m","帶領提醒：要具體到時間、地點、人名，不收「我會更忍耐」這類答案。若碰到家庭傷害或家暴，同樣不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助與通報。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要請哪一個人從我心裡的寶座上下來。"],["p","然後為三種人指名禱告：一位在不信的家裡孤單持守的人；一位正活在恐嚇或暴力裡的人，求主保守他和孩子的安全；一位因信仰被冤枉的人。"],["p","最後由組長讀一遍：「不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。」（3:9）大家回應：主基督，請你坐在我心裡的寶座上。"]]},"4":{"no":4,"vol":"《321彼得前書講義》第四課·彼得前書第四章","title":"火是真的熱——穿上、分出、交託","chars":5031,"min":60,"deep":8,"dchars":1608,"tchars":1329,"blocks":[["h","一、「你是基督徒，怎麼還在哭？」"],["p","弟兄姊妹平安。「你是基督徒，怎麼還在哭？」林姊妹是在醫院的走廊上聽到這句話的。那個月，先生的公司裁員，她自己的切片報告也出來了，要開刀。教會一位熱心的阿姨來探訪，看她眼睛紅紅的，握著她的手說了這一句，又補一句：聖經說倒要歡喜啊。阿姨走了以後，林姊妹躲進廁所又哭了一次。這一次除了怕，還多了一份羞愧：原來我連哭都哭錯了。"],["p","這一課，我們要把這句常聽錯的話拆開。很多人以為彼得前書第四章說的是：有信心的人，火燒到身上也不覺得痛。可是請聽彼得的原話：「親愛的弟兄啊，有火煉的試驗臨到你們，不要以為奇怪」（4:12）。他沒有說不要覺得痛，他說不要以為奇怪。不痛和不意外，是兩件很不一樣的事。火是真的熱，只是它不是意外。"],["p","照書信三問，先問：寄居的人遇到甚麼？收信的多半是小亞細亞北部的外邦信徒，信主以後沒有搬家，卻在家鄉成了外人。他們不再去同業公會的宴席，鄰舍就覺得他們怪，開口毀謗。不是國家抓人，是日常的邊緣化：訂單少了，飯局不約了，家裡的臉色變了。第二問，彼得推出甚麼原則？全卷那條公式「基督受苦難，後來得榮耀」（1:11），到這一章變成了我們的：「你們是與基督一同受苦」（4:13）。第三問落在今天：除夕夜的神明桌前，尾牙的酒杯前，要你改數字的報告前，還有醫院的走廊上。"],["p","這一章有三個詞：兵、管、火。這一課我們用三個動作來學：穿上一個想法，分出一份恩賜，交託自己的靈魂。"],["d",["我在苦難裡一直哭，是不是表示我沒有信心？","不是。彼得在 1:6 說「暫時憂愁」，憂愁是被允許的；4:13 的「倒要歡喜」是一個方向，不是一張面具。耶穌在拉撒路的墳前也哭了，詩篇裡有整整一類是哀歌，那些都是有信心的人向神哭。歡喜不是把眼淚擦乾才能有的東西，是在眼淚裡仍知道自己在誰手裡，也知道苦難之後還有他榮耀顯現的時候。實際上，可以這樣開始：哭的時候對神說出來，不必修飾；告訴一位信得過的弟兄姊妹你最近很難；若情緒已經影響睡眠和飲食好幾個星期，請尋求醫生或專業輔導，那和信靠神並不衝突。"]],["h","二、穿上與分出：兵器和管家"],["p","先聽 4:1：「基督既在肉身受苦，你們也當將這樣的心志作為兵器」（4:1）。「作為兵器」是披掛的字，士兵上戰場以前穿的。奇怪的是，彼得要你穿上的不是盔甲，是一個想法：基督怎樣看受苦，你也這樣看。兵器要在打仗以前穿好。一個以為信主就一路順利的人，第一次被冷落就倒了；一個早就把「我的主先走過這條路」放在心裡的人，被冷落時會痛，卻不會慌。"],["p","下半句要小心：「因為在肉身受過苦的，就已經與罪斷絕了。」（4:1）這句有幾種讀法：願意為主受苦的人，已經在罪的事上選了邊；或是基督受苦，罪的權勢被斷了。不管採哪一種，有一件事彼得沒有說：他不是說受苦能讓人變好。受苦本身沒有洗淨的能力，苦難也可能使人苦毒。所以千萬不要對病床上的人說，神是用這個病來對付你的罪；使人與罪斷絕的，是那位先受苦的基督。"],["p","4:2 說「在世度餘下的光陰」。五十歲才信主的人常懊悔前半生，彼得沒有責備他：前面那一段不能重來，後面這一段可以重新交出去。4:3 那張清單，邪淫、醉酒、荒宴、群飲，最後是「可惡拜偶像的事」，說的是先獻祭、再狂歡的宴席，是信徒自己的往日。所以這一節不是叫你羞辱還沒信主的爸媽，也不是叫你論斷會喝一杯的弟兄。拒絕偶像，不等於拒絕家人。阿明是家裡唯一信主的人，除夕夜他不拿香，可是他最早到、最晚走，替阿嬤剝蝦、替阿公倒茶、把碗全洗了。不拿香的手，可以是最勤快的手。"],["p","鄰舍「就以為怪，毀謗你們」（4:4），請記住「以為怪」，原文那一節它會回來。彼得沒有叫你反擊，只說：「他們必在那將要審判活人死人的主面前交帳。」（4:5）帳有人在算，你不必當場追討。4:6 很難，這裡只說一句：本講義採的讀法是，福音曾傳給現在已經死了的人，在他們活著的時候。這一節不教死後第二次機會，我們也不用它斷定任何一位過世的人在哪裡，尤其是沒有信主就走了的家人；神是公義的，也滿有憐憫。對還活著的人，這節很直接：今天還能聽，就是恩典。"],["p","一個人穿得再好，也打不了一個人的仗。所以彼得接著說：「萬物的結局近了。所以，你們要謹慎自守，警醒禱告。」（4:7）「近了」不是倒數計時，不要算日子，也不要把今天的戰爭、疫情拿來對號入座；彼得推出的不是囤糧，是頭腦清醒、警醒禱告。這四個字從彼得口中說出來特別重：客西馬尼園那一夜，主問他「你們不能同我警醒片時嗎？」（太 26:40），他睡著了，天亮前三次不認主。多年以後他寫出同一個命令，不是彼得變得比較會警醒，是那位叫醒他的主沒有放棄他。"],["p","接著是「最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。」（4:8）「切實」是拉緊的弓弦。被外面以為怪的小群體，最容易從裡面裂開；愛不揭人的瘡疤，不把弟兄已經認過、改過的事一再翻出來。可是另一面一定要說清楚：遮掩不是隱瞞侵害。這一節不能拿來掩蓋性侵、家暴、傷害孩子或挪用奉獻，不能叫受害的人閉嘴，也不能讓該負責的人逃開責任；保護受害者、通報、依法處理，本身就是愛。"],["p","然後是一群人的日常：互相款待、不發怨言；「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。」（4:10）管家管的不是自己的東西。講道的「要按著神的聖言講」，那是給講道的人的約束，不是不准人提問的特權；服事的「要按著神所賜的力量服事」，「賜」是合唱團的贊助人，開銷他包了。兩種恩賜只有一個目的：「叫神在凡事上因耶穌基督得榮耀。」（4:11）"],["d",["4:1 說受過苦就與罪斷絕，是不是苦夠了我就不會再犯罪？","這一句有幾種讀法：願意為主受苦的人，已經在罪的事上選了邊；或是基督在肉身受苦，罪的權勢被斷了；或是受過苦的人不再被罪支配。不管哪一種，彼得都不是說苦難本身能洗淨人。苦難可能使人更靠近神，也可能使人苦毒、離開神。4:1 用「所以」接回 3:18：基督曾一次為罪受苦，使人與罪斷絕的是他。所以千萬不要對病人說「神用這個病對付你的罪」。實際上，在苦難中可以問的不是「我還要被罰多久」，而是「主，你先走過這條路，求你教我怎樣跟著你走」。本講義的全卷立場見 ISS00_2。"]],["d",["我是家裡唯一信主的人，除夕夜不拿香，又不想傷家人的心，可以怎麼做？","4:3 拒絕的是拜偶像的宴席與醉酒狂歡，不是拒絕家人。可以這樣預備。第一，事先說，不要在神明桌前當場說；找一位比較能溝通的長輩，溫和地說：「我信耶穌了，不拿香，可是我一樣敬重祖先、孝順你們。」第二，那一天最早到、最晚走，做最多事：備菜、洗碗、陪長輩聊天。第三，被說幾句時不要辯論，記得 4:5 帳有人在算。第四，也不要論斷其他還在拿香的親戚，或會喝一杯的弟兄，他們不是你的敵人。拒絕偶像，不等於拒絕家人；不拿香的手，可以是最勤快的手。"]],["d",["我的父親沒有信主就過世了，4:6 說死人也有福音傳給他們，他還有機會嗎？","先說：我很遺憾，你的哀傷是真實的，可以哭。4:6 本講義採的讀法是：福音曾傳給這些現在已經死了的人，在他們活著的時候。所以這一節不教死後第二次機會。可是同樣重要的是，我們也不斷定你父親的去處。我們不知道一個人最後一刻與神之間發生了甚麼；神是公義的，也是滿有憐憫的。你可以把這個名字和這份不知道，一起交給那位信實的造化之主。對還活著的我們，這一節很直接：今天還能聽、還能說，就是恩典。本講義的全卷立場見 ISS00_4。"]],["h","三、原文亮光：以為怪、百般的、火煉"],["p","這一章有三個原文字，像三個釘子，把整章釘在一起。"],["p","第一個原文字：ξενίζω，「以為怪」，覺得陌生。4:4 外邦人 ξενίζονται，覺得你們奇怪；4:12 彼得說 μὴ ξενίζεσθε，同一個動詞：你們也不要覺得火奇怪。句尾還有一個同字根的 ξένου，就是和合本括號裡的「似乎是遭遇非常的事」。中間的 4:9 又藏著同一個字根：「款待」原文 φιλόξενοι，愛陌生人。三處放在一起就是這一章的骨架：他們覺得你奇怪；你不要覺得火奇怪；你卻要打開門，接待陌生的人。被當成外人的一群人，最懂得怎樣接待外人。"],["p","第二個原文字：ποικίλης，「百般的」，原意是多種顏色的。這個字在全卷只出現兩次：1:6「在百般的試煉中暫時憂愁」（1:6），用的是 ποικίλοις；4:10「百般恩賜的好管家」，用的是 ποικίλης。百般的試煉，百般的恩賜，同一個字。試煉有多少種顏色，恩賜就有多少種顏色。林姊妹的試煉是兩種顏色疊在一起：失業和開刀。後來陪她走過去的，也是好幾種顏色：一位姊妹排了開刀那週的晚餐表，一位弟兄每次回診開車接送，一位退休的老師每天晚上在線上陪她讀一段詩篇。神回應五顏六色的試煉，是差來一群帶著五顏六色恩賜的人。"],["p","第三個原文字：πυρώσει，「火煉」，是煉爐的火。1:7 說信心比「被火試驗仍然能壞的金子」（1:7）更寶貴，那裡的火還是比喻；到 4:12，火真的臨到了。原文接著說這火是「為了試驗你們而發生的」，火有目的。煉金的人把金子放進爐裡，不是因為恨金子，是因為它值得煉；他也一直守在爐邊，看著火候。所以這不是審判的火，是煉爐的火。可是請記得，點火的不是我們：彼得說不要以為奇怪，不是叫人去找苦、故意挑釁，或拒絕本來可以有的保護。"],["d",["教會裡發生了侵害的事，有人說「愛能遮掩許多的罪」，叫我們不要張揚，這對嗎？","不對。4:8 的遮掩，是在一個天天見面的群體裡，不揭人的瘡疤，不一再翻出已經認過、改過的事，不是隱瞞罪行。性侵、家暴、傷害孩子、挪用奉獻，都不能用這一節蓋起來；不能叫受害的人閉嘴，也不能讓該負責的人逃開責任。愛「不喜歡不義，只喜歡真理」（林前 13:6）。實際上：先保護受害者的安全，照法律通報，讓有專業的人處理；教會的長執要有清楚的保護與通報程序。愛遮掩的，是已經面對了的罪，不是還在傷人的罪。本講義的全卷立場見 ISS00_5。"]],["h","四、交託：哭著，也一心為善"],["p","火臨到了，彼得接著說：「倒要歡喜；因為你們是與基督一同受苦」（4:13）。「一同受苦」是有份，和「團契」同一個字根：你在火裡，不是一個人在火裡。可是「倒要歡喜」最常被用錯。同一位彼得在第一章說過「暫時憂愁」，憂愁是被允許的。倒要歡喜是一個方向，不是一張面具。受苦的人可以哭，可以向神訴苦，可以看醫生、找輔導；耶穌在拉撒路的墳前也哭了。歡喜不是把眼淚擦乾才來，是在眼淚裡仍知道自己在誰手裡，也知道還有「他榮耀顯現的時候」。那位阿姨最該做的，不是叫林姊妹喜樂，是先陪她在走廊上坐一會兒。"],["p","然後是全章最高的一句：「你們若為基督的名受辱罵，便是有福的；因為神榮耀的靈常住在你們身上。」（4:14）「常住」原文 ἀναπαύεται，是歇息、安歇。4:4 是低谷，被以為怪、被毀謗；十節之後，同樣被罵的人身上，歇著榮耀的靈。外面看見的是羞辱，神看見的是榮耀停在那裡。他不是路過，是坐下來。你被罵的那一刻感覺不到，他也在。"],["p","可是彼得馬上踩煞車：「你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦。」（4:15）不是所有的苦都是為主受的。苦有幾種：因作惡受苦，那不是彼得要安慰的；因行善受苦、為義受苦、為基督的名受苦，是他要安慰的；還有百般的試煉，像林姊妹的病。分辨是為了誠實面對自己，不是為了審問受苦的人，更不可以一聽見有人受苦，就預設他做錯了甚麼。清單最後一項很意外：好管閒事，ἀλλοτριεπίσκοπος，「別人的」加上「監督」。2:25 主是靈魂的監督，同一個字根。一種監督是照顧，一種監督是插手。熱心過頭去管同事怎樣過日子，被人厭惡，不是為主受苦。"],["p","「若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給神。」（4:16）「基督徒」原本是外人取笑的標籤。寫這句的人最懂羞恥：大祭司院子的炭火旁，他發咒起誓說不認得那個人。不是彼得變勇敢了，是那位被他否認的主，沒有否認他。4:17 說審判從神的家起首，他說「從我們起首」，把自己算在裡面，所以不要拿別間教會的醜聞宣布是神的審判。4:18 的「僅僅得救」不是說救恩靠運氣，是說這條路要穿過火。"],["p","最後收在一個動作：「所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主。」（4:19）「交與」是把貴重的東西寄放在可靠的人手裡。主在十字架上最後一句話用的就是同一個字：「父啊，我將我的靈魂交在你手裡！」（路 23:46）彼得請我們做的，主自己先做了。造化之主有能力，信實的主靠得住。交託以後，「一心為善」：照樣上班、照樣把報告照實寫、照樣把飯煮好。交託是把靈魂交給神，不是把身體留在危險裡；被傷害的人，交託神與求助、報警、離開危險並行。"],["d",["4:15 說不可好管閒事，那朋友家裡出事，我要不要去關心？","要分辨照顧與插手。ἀλλοτριεπίσκοπος 是越界去監督別人的事。分別在三個地方：第一，有沒有被託付，是他向你開口，還是你自己闖進去？第二，是為了他的好，還是為了滿足自己的好奇或掌控？第三，有沒有尊重他的界線，包括不在群組裡轉傳他的私事。同時要說清楚：有人正被家暴、虐待、霸凌，或伸手向你求助時，出聲、陪他求助，從來不是管閒事。實際上，可以先問一句：「你需要我做甚麼嗎？」然後照他的回答去做，不多也不少。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「倒要歡喜」講成一張面具：真正屬靈的人在苦難中也笑得出來，一直哭就是不屬靈。彼得在 1:6 說暫時憂愁是被允許的；歡喜是方向，不是表情。受苦的人可以哭，可以看醫生，可以找輔導。"],["p","第二個偏差，是把受苦和罪綁在一起：你生病、失業，一定是哪裡得罪了神。4:1 不是說受苦能讓人變好，4:15 也不是叫我們審問受苦的人。說「你受苦是因為你有罪」，是把病床變成審判台，那不是這一章的意思。"],["p","第三個偏差，是不分辨四種苦，把自己的固執、失職、得罪人包裝成為主受苦；或把插手別人的事說成屬靈的關心。4:15 把好管閒事和作惡放在同一張清單。同時也不要把它講成「別人家的事不要管」：有人正被家暴、虐待、霸凌而伸手求助時，出聲從來不是管閒事。"],["p","第四個偏差，是用 4:8 叫受害的人安靜：愛能遮掩，所以家醜不要外揚。遮掩的是已經悔改的過犯，不是還在傷人的罪；保護、通報、依法處理，本身就是愛。另一邊，也不可用 4:6 在追思禮拜上給家屬經文沒有給的盼望，或宣判亡者的去處。"],["p","第五個偏差，是用 4:7 算日子、轉傳末日影片，或把每一場戰爭、地震都對號入座。彼得從「近了」推出的不是恐慌，是謹慎自守、警醒禱告、彼此相愛、互相款待。會眾聽完，應該是更清醒地去愛身邊的人，不是更焦慮地刷新聞。"],["d",["4:7 說萬物的結局近了，已經兩千年了，還算近嗎？","「近了」不是倒數計時。從基督復活升天以後，歷史已經進入最後一章，下一件大事就是他再來；所以每一代都活在「近了」裡。那日子、那時辰沒有人知道，我們不算日子，也不把今天的戰爭、疫情、地震對號入座。請看彼得從「近了」推出甚麼：不是囤糧、辭職或恐慌，是謹慎自守、警醒禱告，接著是彼此相愛、互相款待、各人照恩賜服事。實際上，這一週你可以這樣活在「近了」裡：少看一則末日影片，多打一通電話給一位寄居的人。本講義回指帖撒羅尼迦前書立場二。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：除夕夜的神明桌、清明節的墳前、公司尾牙的乾杯，華人信徒的「以為怪」常常發生在最親的人面前。有人因為怕被說不孝，就跟著拿香；有人為了站穩立場，跟家人吵翻，從此不回家過年。4:3--4 給的路在兩者中間：不同奔那條路，也不離開那張桌子。事先溫柔地說明，那一天最早到、最晚走、做最多事，把長輩當長輩敬重。拒絕偶像不等於拒絕家人，不拿香的兒女，可以是全家最孝順的那一個。"],["p","第二個問題：「家醜不可外揚」。華人教會很容易把這句俗語和 4:8 黏在一起，同工出了事就私下處理，叫受害的人顧全大局。可是 4:17 說審判從神的家起首，神先潔淨的是自己的家。教會要有清楚的保護與通報程序，侵害發生時不遮掩，讓受害者被聽見，讓該負責的人負責。這樣的家，才遮得住該遮的：不翻已經悔改的舊帳，不把一次跌倒變成一輩子的標籤。"],["h","七、活出321——榮耀的靈歇在被罵的人身上"],["p","先讓經文講完：基督先在肉身受苦，神把百般的恩賜分給各人，榮耀的靈歇在受辱罵的人身上，造化之主接得住交出去的靈魂。然後我們才把 321 接上去。"],["p","耶穌是我的榜樣：他被人說是「稅吏和罪人的朋友」，坐在那些桌子旁，卻沒有跟著洪流跑；他靠近人，卻不被沖走。4:1 要我們穿上的，就是他看受苦的那個想法。聖經是我的準則：4:11 講道的要按著神的聖言講，不是按自己的意見講；拿經文安慰人以前，先讓經文管住我們的嘴。聖靈是我的引導：4:14 榮耀的靈常住在受辱罵的人身上，他不只帶路，也在最難的那一段陪你坐下。"],["p","讓耶穌作王：4:5 帳有人在算，我讓出審判官的位置；4:10 我是管家，我讓出主人的位置。讓耶穌得著一切的榮耀：4:11 恩賜用得好不好，標準不是人有沒有稱讚我，是神有沒有因耶穌基督得榮耀；4:16 連被取笑的名字，都可以拿來歸榮耀給神。建立屬神的體系：4:7--11 是一群寄居者的日常運作表，禱告、相愛、款待、各人照恩賜服事。空中團契散在各國，有人醒著時有人睡著，線上的代禱就是不同時區的人輪流守在爐邊。"],["h","八、四種心，在火邊的四種反應"],["p","驕傲型的心，受了一點冷落就自封殉道者，把自己的固執說成為主受苦，甚至開始管別人家的事。4:15 對你說：先分辨，這火是為主受的，還是自己點的？"],["p","恐懼型的心，最怕被當成怪人，所以跟著笑不該笑的笑話、喝不想喝的那一杯。4:4 說他們覺得你怪，4:14 說榮耀的靈歇在你身上。你可以被當成怪人，因為你不是孤單的。"],["p","羞恥型的心，像走廊上的林姊妹，連哭都覺得自己哭錯了。4:13 的歡喜是方向，不是面具；你可以帶著眼淚來，你的眼淚不會讓你被趕出去。"],["p","受傷型的心，也許曾被人用「愛能遮掩」叫你閉嘴，或被人說你受苦是活該。請聽清楚：4:8 從來不是叫受害的人安靜。若傷害還在繼續，請告訴一位信得過的人，一起找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 4:12--13，對主說一句：今天臨到的事，我不以為奇怪；我痛的時候，可以告訴你。"],["p","第二，找出這一週你最可能跟著洪流跑的一個場合，一場聚餐、一個群組、一份要簽名的報告，事先想好一句溫和的話，也想好那天要怎樣一心為善。"],["p","第三，從你手上的恩賜裡選一樣，煮一頓飯、陪一次回診、打一通電話，這一週分給一位正在火裡的人，不發怨言，做完不求被記得。"],["p","第四，若你曾經對受苦的人說過「要喜樂啊」，這一週去陪他坐半個鐘頭，只聽，不給建議。"],["p","第五，每天晚上讀 4:19，把今天受的委屈和不明白一件一件交給信實的造化之主，然後明天照樣去行善。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：火臨到我，我不以為奇怪；火是真的熱，但它不是意外。"],["p","我宣告：我可以哭，我也與基督一同受苦；我的眼淚不會使我離開他。"],["p","我宣告：我被誤會、被辱罵的時候，神榮耀的靈常住在我身上。"],["p","我宣告：我把自己的靈魂交與那信實的造化之主，也要一心為善。"],["d",["我身邊有人正在火裡，我很想幫忙，卻怕說錯話，這一週可以怎麼做？","先記得 4:10：你手上有一份恩賜，是神放的，正好可能是他試煉的那種顏色。可以這樣做。第一，少說話，多在場：去坐一坐，帶一份吃的，或在線上陪他半小時。第二，不要急著解釋他為甚麼受苦，也不要說「要喜樂啊」，可以說「這真的很難，我在這裡」。第三，給具體的幫忙，不要只說「有需要告訴我」：說出哪一天你可以接送、煮飯、照顧孩子。第四，替他禱告時，可以讀 4:14，求主讓榮耀的靈歇在他身上。第五，若他提到撐不下去、不想活，請陪他找專業協助，並告訴牧者。"]],["h","十、結語"],["p","我們回到林姊妹。開刀那一週，晚餐表排滿了，回診那天有人在樓下等她。手術後第三天，她在線上小組裡說：我還是會哭，可是我不再覺得哭錯了。那位阿姨後來也來了，這一次她沒有說話，帶了一鍋雞湯，坐在床邊陪了一個下午。"],["p","可是這一課的焦點，不在林姊妹撐過去了，也不在彼得寫得多好。焦點在那位先在肉身受苦的基督：他在十字架上把靈魂交在父手裡，受苦難之後得了榮耀。他睡過、否認過的使徒，被他找回來，寫下這一章。如今他的靈，安安靜靜地歇在每一個被罵、被誤會、在走廊上哭的人身上。不要只佩服彼得，要更愛彼得的主。"],["p","我們一起低頭禱告。天父，謝謝你，你的兒子先在肉身受苦，也先把靈魂交在你手裡。火臨到我們的時候，求你讓我們不以為奇怪，也讓我們敢在你面前哭。赦免我們曾用「要喜樂」把人的眼淚堵回去，也赦免我們把自己點的火說成為你受苦。求你讓我們彼此切實相愛，把百般的恩賜分出去，叫你在凡事上因耶穌基督得榮耀。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰受的苦最多，也不比誰最堅強，是讓每一個人說出一場正在燒的火，也說出這一週要分出去的一份恩賜；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是穿上、分出、交託。席上可能有正在病中、失業、被家人冷落、或剛失去家人的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：苦難不是意外，卻不是不痛；歡喜是方向，不是面具；四種苦要分辨，因作惡受苦不是為主受苦。"],["n","1. ★ 說一次你因為信主，被人覺得你很奇怪的經驗：在哪裡、和誰、那時你說了甚麼？"],["n","2. ★★★ 「不要以為奇怪」和「不要覺得痛」有甚麼不一樣？請用 4:4 和 4:12 同一個字，用一句話說出來。"],["n","3. ★★ 百般的試煉和百般的恩賜是同一個字。說出一次別人用他的恩賜，陪你走過一場試煉的經驗，那是甚麼顏色的恩賜？"],["n","4. ★★ 讀 4:15--16，你最近受的一件苦，是因行善、為義、為基督的名，是百般的試煉，還是有一部分其實是自己點的火？"],["m","帶領提醒：讀經時從 4:12 一口氣讀到 4:19，不要停在 4:13，一定讀到 4:14 榮耀的靈。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一場正在燒的火，從「神榮耀的靈常住在你們身上」出發，說出這一週要交託的事和要行的善。"],["t","【看】看見自己"],["n","5. ★★★ 說出這一陣子正在燒的一場火：是病、是錢、是家人的冷落，還是職場的冤屈？最近一次最痛是哪一天、在哪裡？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:14 兩遍，第二遍讀完說一句：在那最痛的一天，神榮耀的靈歇在你身上，對你是甚麼意思？"],["t","【想】想通關卡"],["n","7. ★★★ 你在火裡最難的是哪一個：覺得神忘了你、覺得哭是錯的、怕被當成怪人，還是分不清這火是不是自己點的？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「火是真的熱，但它不是意外；我可以哭，我也不是一個人。」右手邊的人只回一句「榮耀的靈歇在你身上」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 照 4:19 寫下兩件事：這一週哪一天晚上，你要把哪一件委屈交給信實的造化之主；第二天在哪裡，你要照樣一心為善做哪一件事。"],["m","帶領提醒：這一化可能碰到重病、失業、家庭傷害、喪親、長期無望感，甚至教會裡的侵害；不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「要喜樂啊」；不斷定任何亡者的去處；會後單獨關心，必要時協助尋求專業協助。若有人提到正在受侵害，先確認他的安全。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一份分出去的恩賜、一場事先預備的飯局、一位要陪的人、一位要分享的人。"],["n","10. ★★ 說出一位正在火裡的人的名字，這一週你要分給他哪一樣恩賜：一頓飯、一次接送、一通電話？星期幾、在哪裡？"],["n","11. ★★ 這一週或下一個節日，有沒有一場你最可能跟著洪流跑的飯局或家族聚會？說出日期，和你那天要說的一句溫和的話。"],["n","12. ★ 在你的小組或團契裡，可以提出哪一個讓各人都有位置的安排，例如新朋友接待輪值或病友送餐表？要在哪一次聚會、向誰提？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：火臨到時不必以為奇怪，因為榮耀的靈常住在受苦的人身上。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，人生的火是真的熱，痛和哭都不丟臉。第二句，耶穌自己先受過苦，他把自己交給神，後來得了榮耀。第三句，所以在火裡的人不是一個人，可以把自己交給他，明天照樣好好過。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心」這類答案；正在火裡的組員，先問小組能替他做甚麼，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要交託的是哪一件事，要分出去的是哪一份恩賜。可以只說「一件事」，不必說內容。"],["p","然後彼此代禱，為三種人指名禱告：一位正在病床上或長期的苦裡、哭不出來的人；一位在家裡或職場因信主被冷落、被冤屈的人；一位剛失去家人、心裡還壓著一個名字的人，求主讓他們知道榮耀的靈歇在他們身上。"],["p","散會以前，確認紙上寫了三樣：要分出去的那一份恩賜、要陪的那一個人、你的那個「2」。下次帶來對。"]]},"5":{"no":5,"vol":"《321彼得前書講義》第五課·彼得前書第五章","title":"他顧念你們——牧長、圍裙、站立","chars":4958,"min":60,"deep":8,"dchars":1690,"tchars":1147,"blocks":[["h","一、家書的最後一行"],["p","弟兄姊妹平安。寫過家書的人都知道，一封信最後那一行，常常最真，也常常最不真。長輩寫給在外地孩子的信，最後一行幾乎都一樣：家中一切安好，勿念。孩子離家後寫信回去，工作再累、房租再緊，寫到最後一行，還是勿念。"],["p","勿念是一種愛，也常常是一種隱藏：報喜不報憂，把整包的擔子留給自己扛。在異鄉宿舍裡的、在醫院陪床的、在教會裡甚麼都扛的，很多人的生活，就是一封最後寫著勿念的信。"],["p","彼得前書也是一封寄到異鄉的信，寄給散在五個地區、信主後沒有搬家卻成了家鄉外人的寄居者。今天我們讀到它的最後一頁。彼得自己說：「我略略地寫了這信，託我所看為忠心的兄弟西拉轉交你們，勸勉你們，又證明這恩是神的真恩。你們務要在這恩上站立得住。」（5:12）"],["p","請你留意，這封信的最後一頁沒有寫勿念。它寫的是：「你們要將一切的憂慮卸給神，因為他顧念你們。」（5:7）不是叫你不要念，是告訴你那一份念該放到哪裡去；而且在天上，有一位一直念著你。全卷五篇，望、石、福、火，今天走到最後一個字：牧。這一課跟著本章走三步：牧長、圍裙、站立。"],["d",["開場講家書的勿念，組裡若有人說自己就是那個報喜不報憂的人，帶的人要怎樣接？","先謝謝他說出來，這一句本身就是卸下的第一步，不要急著給建議，也不要說那你就交給神啊。可以只回一句：謝謝你讓我們知道。散會後組長單獨傳一句問候，問他這一週有沒有一件事是小組可以替他分擔的，例如送一餐、陪他去看醫生、替他照顧孩子一個晚上。勿念的人最需要的，常常不是一篇道理，是發現原來有人接得住。若他說的事涉及健康、經濟或安全，回報牧者，讓群體一起接住，不讓他再一個人扛。"]],["h","二、同作長老的人，頭上還有牧長"],["p","第四章剛說完，火煉的試驗臨到神的家。一家人在火裡，彼得第一個叮嚀的，是家裡帶頭的人：「我這作長老、作基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人」（5:1）。信的開頭，他說自己是使徒；到了這裡，他說自己是同作長老的。這個字整本新約只出現這一次。他有資格站在上面說話，卻選了站在旁邊。"],["p","他又說自己是基督受苦的見證。他確實看見了，可是那一夜，他也是在炭火旁三次說不認得主的人。這樣的人還能作見證嗎？能。不是因為彼得後來變好了，是因為主沒有放棄他。加利利海邊的另一堆炭火旁，復活的主問了他三次你愛我嗎，然後說：「你牧養我的羊。」（約 21:16）如今他寫「務要牧養在你們中間神的群羊」（5:2），用的就是同一個動詞。"],["p","請再聽四個字：神的群羊。羊是神的，不是長老的。牧者不是主人，是管家。接著彼得寫了三組「不是……乃是」，這是全本新約對屬靈領袖最具體的一張檢核表。第一組問動機：「不是出於勉強，乃是出於甘心」（5:2）。第二組問錢：「也不是因為貪財，乃是出於樂意」（5:2）；牧者可以得供養，卻不可以把羊當成收入的來源。第三組問權：「也不是轄制所託付你們的，乃是作群羊的榜樣。」（5:3）"],["p","「轄制」是在別人頭上作主子，主耶穌講外邦君王操權管束人，用的是同一個字，然後說：「只是在你們中間，不可這樣」（太 20:26）。轄制今天長甚麼樣子？用神的名要人無條件服從，把提問當成悖逆，公開羞辱人，控制會友的婚姻、工作和錢，把領袖的意見說成神的旨意。這些都不是牧養。遇到這樣的處境，你可以提問，可以求助，也可以離開，這不違背聖經；本講義的全卷立場見 ISS00_5。"],["p","那麼乃是甚麼？乃是作榜樣。這個字是印模壓出來的形狀，長老只是第一批照著主的腳印描字的人。然後彼得馬上告訴長老：你們頭上還有一位。「到了牧長顯現的時候，你們必得那永不衰殘的榮耀冠冕。」（5:4）「牧長」新約只有這一次。牧者頭上還有牧長，這句話對轄制的人是警告，對在沒有人看見的地方默默服事的人，是安慰：地上的花環幾天就枯了，牧長給的冠冕永不衰殘。"],["d",["我覺得我所在教會的領袖有轄制的樣子，我要怎樣分辨？可以離開嗎？","先用 5:2--3 那三組「不是……乃是」對照，再看幾件具體的事：可不可以提問，提問後是被回答，還是被說成悖逆；財務有沒有向會眾交代；領袖會不會公開羞辱人；會不會控制你的婚姻、工作、金錢和交友；會不會叫你和家人朋友疏遠；會不會把他的意見說成神的旨意。若這些常常發生，那不是牧養，是 5:3 說的轄制。你可以先找一位群體外、信得過的牧者或長輩，把事情照實說出來；可以提問，可以求助，也可以離開，這不違背 5:5。若涉及人身安全或金錢上的侵害，先保護自己，必要時尋求專業與法律協助。本講義的全卷立場見 ISS00_5。"]],["d",["5:2 說也不是因為貪財，是不是表示牧者不該領薪水，也不該談待遇？","不是。彼得禁止的是貪財的動機，不是供養。保羅說主也是這樣命定，叫傳福音的靠著福音養生；叫牧者餓著肚子服事，是另一種不公義。5:2 真正要守的是兩件事：牧者不把羊當成收入的來源，不用屬靈的話向會眾施壓要錢；教會也不用屬靈的事不必算那麼清楚，拒絕公開財務。合理的供養、清楚的帳目、定期向會眾交代，是保護羊，也是保護牧者。談這一題只談原則，不點名評論任何教會。"]],["h","三、原文亮光：圍裙、拋上去、放在心上"],["p","講完長老，彼得轉身對全家說話。「你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服；因為神阻擋驕傲的人，賜恩給謙卑的人。」（5:5）前半句對年輕人說，下半句對象換成了你們眾人，包括剛剛被勸勉的長老；方向也從單向變成了彼此。謙卑是長幼雙方的圍裙，不是只綁在年輕人身上的繩子。這一課拆三個原文字。"],["p","第一個是 ἐγκομβώσασθε（enkombōsasthe），束腰。新約只有這一次，意思是把一件衣服打結繫在身上，同字根的名詞，是奴僕做工時的圍裙。彼得沒有說要有謙卑的感覺，他說把謙卑像工作服一樣穿上。寫這個字的時候，彼得會不會想起那一晚？主「就離席站起來，脫了衣服，拿一條手巾束腰」（約 13:4），蹲下來洗門徒的腳。輪到彼得，他把腳縮回去：「你永不可洗我的腳！」（約 13:8）後來他才明白，謙卑是先讓主洗，再去洗別人。焦點不在彼得學會了甚麼，在那位先束上手巾的主。"],["p","神阻擋驕傲的人這一句，新約只引了兩次，另一次在雅各書。雅各書講它的時候，前面是「但他賜更多的恩典」（雅 4:6），重點是恩典比驕傲大；彼得前書用它做另一件事：既然神與驕傲的人擺開陣勢對抗，就把謙卑繫在身上。和合本的箴言照希伯來文，字句不太一樣，那是兩個版本，不是彼得引錯。"],["p","第二個是 ἐπιρίψαντες（epiripsantes），卸給。請聽一件中文聽不出來的事：「所以，你們要自卑，服在神大能的手下，到了時候，他必叫你們升高。」（5:6）下一節的「卸給」在原文不是另一個命令，是掛在這一句底下的分詞。5:6 和 5:7 是同一個句子，意思是：你們要自卑，怎樣自卑？就是把一切的憂慮拋到他身上。自卑的方式，就是把憂慮卸給神。而「一切的憂慮」是單數，不是分門別類的清單，是捆成一包的整個重量，房租、報告、孩子，整包一起拋上去。"],["p","為甚麼卸下憂慮叫作謙卑？因為驕傲不只抓住權力，也抓住重擔。一個甚麼都要自己扛的人，外面看起來很負責，裡面卻常常藏著一句話：這件事沒有我不行。那是另一種想代替神。所以謙卑有兩個動作：把圍裙繫上，去服事人；把重擔卸下，讓神作神。"],["p","請聽清楚：卸給神不是說你不可以憂慮。彼得在第一章就承認讀者在百般的試煉中暫時憂愁，沒有責備他們。憂慮不是罪，焦慮的人也不是信心不夠的人，那種說法是錯的。卸給神也不排斥看醫生、吃藥、接受心理諮商，神的顧念常常就經由醫生和輔導臨到。憂慮也可能要一次又一次地拋，今天拋上去，明天早上又撿回來，那不是失敗，是學習。"],["p","第三個是 μέλει（melei），顧念，字面是「對他是要緊的」，他把你放在心上。這個字彼得聽過，在一個很可怕的晚上。加利利海起了風浪，主在船尾睡著，門徒把他叫醒：「夫子！我們喪命，你不顧嗎？」（可 4:38）同一個字。許多年後，彼得用它回答了那天船上的問題：他顧念。"],["d",["5:5 說年幼的要順服年長的，那年輕人在同工會上還可以提出不同的意見嗎？","可以，而且應該。同一節下半句說你們眾人都要以謙卑束腰、彼此順服，年長的也在裡面。年輕人順服年長的，是尊重他們走過的路、願意先聽，不是不准開口。帶著尊重提出不同意見，本身就是謙卑的一種：先說我想請教，再說我的看法和理由，最後願意接受群體的決定，即使不是自己的意見。年長者的謙卑，是留時間聽，承認自己也可能看錯。若在一個群體裡，提問一次就被貼上悖逆的標籤，那不是 5:5 的意思。3:8 說要同心、彼此體恤，世代的張力要用這一句去處理，不用一句長幼有序結案。"]],["d",["基督徒焦慮到要看身心科、吃藥、做心理諮商，是不是表示信心不夠、沒有把憂慮卸給神？","不是。5:7 的前提是人本來就有憂慮，彼得在 1:6 也承認讀者暫時憂愁，沒有責備他們。焦慮本身不是罪，嚴重到影響睡眠、飲食、工作的焦慮或憂鬱，是需要治療的身心狀態，就像身體別的病一樣。卸給神與看醫生、吃藥、接受心理諮商是並行的，神的顧念常常就經由醫生與輔導臨到。禱告交託與按時服藥，一點也不衝突。若有人對你說吃藥就是不信，那是把這一節講錯了。若你有傷害自己的念頭，請立刻告訴一位信得過的人，並聯絡專業的協助。"]],["h","四、獅子之後兩節：成全、堅固、立根基"],["p","卸下憂慮之後，彼得很誠實，接著出場的是一隻獅子。「務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。」（5:8）寫警醒這兩個字，彼得一定很痛。客西馬尼園那一夜他睡著了，主說：「你們不能同我警醒片時嗎？」（太 26:40）「仇敵」原文是法庭上的原告，他要吞吃的是受苦的人的信心。可是這一節不是叫我們凡事都看成魔鬼搞的；彼得寫獅子，不是要我們更害怕，是要我們更清醒。"],["p","「你們要用堅固的信心抵擋他，因為知道你們在世上的眾弟兄也是經歷這樣的苦難。」（5:9）請留意次序：先以謙卑束腰，先卸下憂慮，然後才抵擋。受苦時最可怕的一句謊言是：只有你這樣。我們散在各國的團契也是，不同的時區，抵擋的是同一隻獅子。"],["p","最低的獅子之後只隔兩節，就是全卷最高的地方：「那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀，等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們。」（5:10）一封講了五章「你們要」的信，到這裡主詞換了：不是你們要，是他必要，前面還加了一個字，他自己。「暫受」和第一章的「暫時憂愁」是同一個字。彼得沒有說苦難很小，他說苦難有盡頭，榮耀沒有盡頭。"],["p","這幾個動詞各有一幅圖。「成全」是加利利漁夫補網的字，破了洞的網，主不丟掉，坐下來一針一針補好，讓它再下水。「堅固」是 στηρίξει（stērixei），最後的晚餐那一夜，主對他說：「但我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄。」（路 22:32）同一個字。你手上這封信，就是那個回頭的人在堅固弟兄。可是他沒有說我來堅固你們，他說神必要親自堅固你們。不是彼得變強了，是主那一夜為他祈求的話成就了。"],["p","原文其實還有第四個動詞，θεμελιώσει（themeliōsei），立根基。和合本照另一些抄本只譯了三個，意思不變，卻多了一幅圖畫：寄居的人在地上沒有自己的地基，神親自給他們打根基，像主說的那間房子，「總不倒塌，因為根基立在磐石上」（太 7:25）。所以彼得才能說：你們務要在這恩上站立得住。寫這句話的人，曾經在大祭司的院子裡，連一個使女的問話都站不住：「女子，我不認得他。」（路 22:57）他叫人站住，不是因為他自己站穩了，是因為那恩托住了他。"],["p","信的最後是問安。「在巴比倫與你們同蒙揀選的教會問你們安。我兒子馬可也問你們安。」（5:13）巴比倫最可能是指羅馬，但請不要把它對號入座到今天任何一個國家、城市或宗派。神國的領土先是一群人。馬可是那個曾經半途回家的年輕人，如今被稱為我兒子；焦點不在彼得多會帶人，在主沒有放棄他們兩個。"],["d",["5:10 和合本只有三個動詞，原文卻有第四個立根基，我該相信哪一個版本？","兩種讀法都來自古代的抄本。一些重要的版本有第四個動詞立根基，另一些沒有，和合本照的是沒有的那一種，所以只譯了成全、堅固、賜力量。兩種讀法都不改變這一節的意思：主詞都是神自己，他必要親自做。本講義照有第四個動詞的讀法講，因為它多給了一幅很貼切的圖畫：寄居的人在地上沒有自己的地基，神親自給他們打根基。這也提醒我們，抄本的差異都攤開在學者面前，並沒有被藏起來。"]],["d",["5:13 的巴比倫是指羅馬嗎？今天常聽人說巴比倫就是某某國，可以這樣講嗎？","早期教會多半認為巴比倫是羅馬的代稱，本講義也採這個讀法；另有兩說，一說是兩河流域的巴比倫城，一說是埃及一座同名的要塞，議題頁並陳。彼得用這個名字，是因為巴比倫是被擄、離鄉的記憶：帝國的首都，正是流亡之地。可是不要把它對號入座到今天任何一個國家、城市或宗派。彼得在同一封信裡叫人尊敬君王，又在巴比倫城裡問安，因為那裡有一間同蒙揀選的教會。把巴比倫套在別人身上，住在那裡的弟兄姊妹就被看成敵人。神國的領土先是一群人，不是一塊地。本講義的全卷立場見 ISS00_7。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 5:5 講成 321 的插圖：一開口就說謙卑是復興的鑰匙，經文證明了這一點，然後跳過長老、圍裙與卸下，只剩一句口號。經文要先講完，321 才在末端認出它。"],["p","第二個偏差，是只讀 5:5 的前半句，用「年幼的，也要順服年長的」叫年輕人閉嘴，在同工會上一句長幼有序就結案。同一節下半句是你們眾人都要以謙卑束腰、彼此順服；年輕人要學帶著尊重說話，年長者也要繫上圍裙，聽得進問題。"],["p","第三個偏差，是用屬靈遮蓋、不聽就是悖逆神這類話，把長老的權柄講錯成絕對服從，這不是 5:1--4 的意思。彼得用了整整兩節講長老不是甚麼，而且長老頭上還有牧長。反過來，因為有人轄制就說不需要牧者，也偏了。"],["p","第四個偏差，是把 5:7 講成基督徒不該焦慮：你還在憂慮就是沒有交託，交給神就不用看醫生。這會讓焦慮的人多背一層罪疚。另一頭也偏：交給神就好，帳單不用付、病不用看，把逃避叫作交託。卸下的是我必須掌控結果的重擔，不是本分；同一章就叫人謹守警醒。"],["p","第五個偏差，是用 5:8 的獅子恐嚇人：你不來聚會，魔鬼就要吞吃你；或把一切病痛、失業、家庭衝突都說成魔鬼在攻擊你。彼得寫獅子，兩節之後就寫神親自成全；會眾該記得的是成全的神。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：勿念的文化走進了教會。我們從小學會報喜不報憂，到了小組也是：問你好嗎，永遠是還好；牧者更不敢說自己累。5:7 請我們做的正好相反：把整包的憂慮拿出來。卸給神，常常從讓一個人知道開始，可以是一位代禱同伴，也可以是一位醫生或輔導。一個團契若能讓人說出我其實不太好，而不被當成軟弱，那裡的人就比較卸得下來。"],["p","第二個問題：長幼有序遇上同工會。很多華人教會敬老，這是好事；可是年輕同工一提問，就有人說年輕人要順服，把 5:5 的前半句當成一張封口令。5:5 的圍裙是長幼雙方都繫的：年輕人尊重前輩走過的路，前輩也留時間聽年輕人的問題，再用 3:8 的同心、彼此體恤一起找方向。長幼有序可以是一種美德，卻不可以變成不准問。"],["h","七、活出321——把圍裙繫上，把重擔卸下"],["p","經文自己講完了，我們才在末端認出 321 常說的那一句：謙卑是復興的鑰匙。原來經文裡的謙卑長這個樣子，不是更用力地證明自己，是把圍裙繫上去服事人，把重擔卸下讓神作神。"],["p","耶穌是我的榜樣：他是牧長，卻拿手巾束腰，蹲在門徒腳前；在客西馬尼園，他沒有假裝不憂傷，卻把那份憂傷整包交給父。"],["p","聖經是我的準則：衡量一位領袖，用的是 5:2--3 那三組「不是……乃是」，不是他的口才、頭銜或教會的人數；衡量自己的謙卑，用的是 5:5--7，不是別人誇不誇我。"],["p","聖靈是我的引導：在甚麼都想自己扛的時候，求聖靈讓我們聽見他顧念你們，也看見身邊誰需要我們去服事。"],["p","讓耶穌作王：這一章要我們讓出兩張椅子，一張是在別人頭上作主的椅子，一張是沒有我不行的椅子。兩張都讓出來，王座上就只剩下他。"],["p","讓耶穌得著一切的榮耀：一封講了五章你們要的信，最後一句是他必要，所以彼得接著說：「願權能歸給他，直到永永遠遠。阿們！」（5:11）成全是他做的，榮耀也歸他。建立屬神的體系：彼得稱自己是同作長老的，這是 235 的 5，團隊；他稱馬可為兒子，這是 235 的 3，屬靈父母兒女。領導能被提問，財務透明，重擔有地方放，這就是屬神的體系。"],["h","八、四種心，各自抓著甚麼"],["p","驕傲型的心抓著位子：在家裡、在同工會，我說了算，不喜歡被問。這一章請你看那位使徒，他稱自己同作長老的，並且記得頭上還有牧長。圍裙繫上的那一刻，位子就不再那麼重要了。"],["p","恐懼型的心抓著重擔：怕一放手事情就塌，怕沒有人接住，所以甚麼都自己扛，失眠也不說。請聽那一句因為他顧念你們，他把你放在心上。你可以先卸一件，看看他接不接得住。"],["p","羞恥型的心覺得自己不配：跌倒過、半途離開過服事，不敢再回來。請看信末的馬可，一個半途回家的年輕人，被稱為我兒子；也看寫信的人，一個在院子裡站不住的人，被主找回來牧養羊群。主沒有放棄他們兩個，也沒有放棄你。"],["p","受傷型的心，也許正是被教會裡的權柄傷過：被羞辱、被控制，被一句不順服就是悖逆堵住過嘴。那不是 5:5 的意思，是 5:3 說的轄制。你不需要先原諒才算屬靈。那位牧長看見了；若你仍在危險或控制裡，先讓一位信得過的人陪你找到安全，必要時尋求專業的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，拿一張紙，把你扛著的那一包寫下來，不分大小全部寫上；最上面寫 5:7，把你們換成自己的名字，讀出來，然後說：這一包，交給你。"],["p","第二，從那張紙上挑一件，這一週真的交出去：請一位家人、同工接手，或預約一次醫生、一次輔導。"],["p","第三，如果你是帶領人，這一週約一位年輕同工或組員，專門聽他的想法和問題，不急著糾正。"],["p","第四，每天晚上讀 5:10，記得明天不是靠你自己撐，是他要親自成全。"],["p","第五，這一週每天為一間在受逼迫之地的教會，或一位在異鄉寄居的弟兄姊妹，指名禱告一次。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我要將一切的憂慮卸給神，因為他顧念我；憂慮再撿回來，我就再拋一次。"],["p","我宣告：我要以謙卑束腰，繫上圍裙去服事人，也聽得進比我年輕和比我年長的人。"],["p","我宣告：暫受苦難之後，神必要親自成全我、堅固我、賜力量給我、為我立根基。"],["p","我宣告：我站立的地方不是我的力氣，是神的真恩，我要在這恩上站立得住。"],["d",["把憂慮寫在紙上、交給神，具體要怎麼做，才不會只是寫一寫就忘了？","可以分四步。第一，找一個安靜的十五分鐘，把扛著的事全部寫下，不分大小，也不先判斷哪一件夠屬靈。第二，在紙的最上面寫 5:7，把你們換成自己的名字，一條一條讀出來，每讀一條就說一句：這一件，交給你。第三，在每一條旁邊問一個問題：這是神交給我的本分，還是我坐在神的椅子上？屬於本分的，寫下這一週要做的下一步；不屬於的，畫一個圈，練習放手。第四，從清單上挑一件，這一週真的交給一個人：請家人接手，預約醫生或輔導，或告訴代禱同伴。把紙夾在聖經裡，每天早上看一眼；撿回來了，就再拋一次。"]],["h","十、結語"],["p","全卷五課回望一眼：望，盼望從空墳墓開始；石，被棄的石頭建造出一座殿；福，倒要祝福；火，不要以為奇怪；牧，他顧念你們。這封寄到異鄉的信一直在說：基督受苦難，後來得榮耀。"],["p","現在回到那封家書。下一次你寫到最後一行，想寫勿念的時候，請記得彼得的最後一頁。這一課的焦點，不在我們夠不夠謙卑，也不在彼得變得多剛強，焦點在那位顧念我們的主。所以次序是這樣的：先是他顧念，「你們要將一切的憂慮卸給神，因為他顧念你們。」（5:7）再是他成全，「必要親自成全你們，堅固你們，賜力量給你們。」（5:10）最後才輪到我們，「你們務要在這恩上站立得住。」（5:12）站立是回應，不是條件。"],["p","我們一起低頭禱告。顧念我們的父神，謝謝你，你把我們放在心上。我們把一直寫著勿念的那一包，整包交給你；求你讓我們繫上圍裙，去服事身邊的人，也讓我們聽得進年輕人和年長者的話。求你保護那些曾被權柄傷害的人，讓他們找到安全；求你記念在世上受逼迫的眾弟兄。暫受苦難之後，求你親自成全我們、堅固我們、賜力量給我們，叫我們在這恩上站立得住，願權能歸給你，直到永永遠遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這是全卷最後一次小組，不比誰最屬靈，是讓每一個人說出一包扛著的擔子、一條要繫上的圍裙，和這一週要交出去的那一件事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課是全卷最後一課，主軸是牧長、圍裙、站立。席上可能有正在治療焦慮的人、曾被權柄傷害的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：長老不轄制，頭上還有牧長；謙卑是長幼都繫的圍裙；自卑的方式就是把憂慮卸給神。"],["n","1. ★ 你上一次報喜不報憂，是對誰、為了甚麼事？那一次你心裡真正想說的是甚麼？"],["n","2. ★★★ 5:6 和 5:7 在原文是同一個句子。請用自己的話說：為甚麼把憂慮卸給神，就是一種謙卑？不肯卸下，為甚麼也是一種驕傲？"],["n","3. ★★ 讀 5:2--3 那三組「不是……乃是」。動機、錢、權柄，你覺得哪一組在今天的教會最容易出問題？為甚麼？"],["n","4. ★★ 5:5 前半句對年輕人說，後半句對眾人說。讀到這裡，你對順服年長的這句話的印象有沒有改變？說一個具體的例子。"],["m","帶領提醒：歡迎提問，不用你還年輕回應；談領袖只談原則，不點名評論任何牧者或教會。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出一包自己扛著的擔子，認出底下的害怕，並說出這一週要交出去的一件事。"],["t","【看】看見自己"],["n","5. ★★★ 說出一件你現在扛著、卻一直沒有交出去的事：家人的病、工作的去留、孩子、錢，或教會的一件事。你扛了多久？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 5:7 兩遍，第二遍換上自己的名字。說一段你覺得沒有人把你放在心上的日子：哪一年、在哪裡？"],["t","【想】想通關卡"],["n","7. ★★★ 你卸不下來，卡在哪裡：怕沒有人接住、覺得沒有我不行、怕被看成軟弱，還是曾經交出去卻被辜負？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：我其實不太好，因為……。右手邊的人只回一句他顧念你，不給建議，不分析。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要交出去的那一件事：交給誰、星期幾、用電話還是當面，你要怎樣開口？"],["m","帶領提醒：這一化可能碰到焦慮、憂鬱、長期無望感，以及被屬靈領袖控制的經驗。不追問細節，不要求原諒，不對正在流淚的人說你要有信心；有人正在服藥或接受輔導，肯定他。若有人仍在危險裡或有自傷的念頭，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一次交出去、一次聆聽、一次代禱、一個你要帶的人。"],["n","10. ★★ 說出一位比你年輕和一位比你年長的人的名字，這一週哪一天、在哪裡，你要專門聽他說話，或向他請教一件事？"],["n","11. ★ 說出一間受逼迫的教會或一位在異鄉寄居的肢體，這一週你每天哪一個時段為他指名禱告？"],["n","12. ★★ 從清單上挑一件，說出要交給誰：家人、同工、醫生或輔導？哪一天？第一句話怎麼說？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位也在一個人扛著的人。當場說出他的名字，說出這一週哪一天、在哪裡，你要和他一起讀 5:6--7，並問他：你扛著的那一包是甚麼？"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人習慣說勿念，把擔子一個人扛。第二句，聖經說可以把一切的憂慮整包交給神，因為他把你放在心上。第三句，交給他不是逃避，是承認自己扛不動，讓他扶你站住。下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收我會多交託這類答案；正在照顧病人的組員，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要交出去的是哪一件事、交給誰。"],["p","然後彼此代禱，為一位甚麼都扛的人、一位正在治療焦慮的人、一間受逼迫的教會指名禱告。"],["p","最後由組長慢慢讀一遍：「你們要將一切的憂慮卸給神，因為他顧念你們。」（5:7）全卷就在這一句他顧念裡結束。"]]}}}</script>

    controls: null,        // fn() -> html（頂列下方的設定列，由 App 畫）
    store: null,
    chapter: null,
    rich: true,
    speechClean: null,
    linkify: null,
    onSpeak: null,
    onCard: null,          // fn(text, question)
    onShare: null,         // fn(text, question)；沒給就用 navigator.share／剪貼簿
    shareTail: '',
    toast: null,
    onChange: null,
    labels: {
      hello: '陪你讀經的小幫手。',
      caveat: '我不是聖靈，也不能代替你的牧者——有疑問，還是要回到聖經，並找真實的屬靈同伴談。',
      placeholder: '問小智…', send: '送出', clear: '清空', close: '✕',
      thinking: '正在想…',
      more: '展開全文 ▾', less: '收合 ▴',
      speak: '🔊', save: '☆ 收藏', saved: '★ 已收藏', del: '刪除',
      share: '↗ 分享', card: '🖼 美圖', copied: '已複製，可以貼上分享',
      foldAll: '收合', foldedAll: '已收合所有長回答', foldNone: '目前沒有需要收合的回答',
      cont: '小智還在接著寫…', contAsk: '請從中斷的地方直接接著寫完，不要重複前面已經寫過的內容，也不要加開場白。',
      fuT: '追問：',
      didSave: '已加入收藏', didUnsave: '已取消收藏', didDel: '已刪除',
      offline: '目前沒有網路，小智暫時陪不了你。',
      slow: '小智等候得有點久，先暫停一下。',
      down: '小智暫時連不上線，請稍後再試。',
      comfort: '別忘了——最好的同伴是聖靈與神的話，你隨時可以直接向主傾心吐意。',
      empty: '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？',
      exportTitle: '# 小智收藏', exportFile: 'sage-saved.md'
    }
  };

  var C = null;
  var XZ = { open: false, msgs: [], busy: false };

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escA(s) {
    return String(s == null ? '' : s).replace(/'/g, '&#39;').replace(/"/g, '&quot;')
      .replace(/\n/g, ' ').slice(0, 300);
  }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function saved() { return (C.store && C.store.get && C.store.get()) || []; }
  function keep() { if (C.store && C.store.save) C.store.save(); if (C.onChange) C.onChange(); }
  function link(html) {
    if (!C.linkify) return html;
    try { return C.linkify(html); } catch (e) { return html; }
  }
  function nl(text) { return esc(text).split('\n').join('<br>'); }
  function body(text) {
    if (C.rich !== false && typeof NAR321 !== 'undefined' && NAR321.html) {
      try { return NAR321.html(text); } catch (e) {}
    }
    return nl(text);
  }
  function toSpeech(text) {
    var t = String(text == null ? '' : text);
    if (typeof NAR321 !== 'undefined' && NAR321.speech) {
      try { t = NAR321.speech(t); } catch (e) {}
    }
    if (C.speechClean) { try { t = C.speechClean(t); } catch (e) {} }
    return t;
  }
  function plainOf(text) {
    if (typeof NAR321 !== 'undefined' && NAR321.text) {
      try { return NAR321.text(text); } catch (e) {}
    }
    return String(text || '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/^>\s?/gm, '').replace(/^\s*[-*]\s+/gm, '・').replace(/\|/g, ' ');
  }
  function isLong(m) {
    return !!(m && m.role === 'assistant' && !m.cont && String(m.text || '').length > C.longChars);
  }
  function qOf(i) {
    for (var p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user') return XZ.msgs[p].text;
    return '';
  }

  /* ── 送出與接收 ───────────────────────────────────────────────── */

  function open() { XZ.open = true; draw(); }
  function close() {
    XZ.open = false;
    var el = document.getElementById(C.el);
    if (el) el.className = el.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');
  }
  function push(role, text, extra) {
    var m = { role: role, text: text };
    if (extra) ext(m, extra);
    XZ.msgs.push(m);
    return m;
  }

  function send(text) {
    var t = text;
    if (t == null) {
      var i = document.getElementById('xzin');
      t = (i && i.value) || '';
      if (i) i.value = '';
    }
    t = String(t).replace(/^\s+|\s+$/g, '');
    if (!t || XZ.busy) return;
    XZ.open = true;
    push('user', t);
    draw(); call();
  }
  function pick(q) { send(q); }

  function ask(quote, note, tmpl) {
    XZ.open = true;
    var q = (tmpl || C.askTemplate || function (s, n) {
      return '我讀到這一句：\n「' + s + '」\n' + (n ? n + '\n' : '') +
             '請幫我更明白這句話，並幫助我活出來。';
    })(String(quote || '').slice(0, 300), note || '');
    if (XZ.busy) { draw(); return; }
    push('user', q);
    draw(); call();
  }

  /* 切換回答長度：把最後一組問答拿掉，用同一個問題重新問一次 */
  function reask() {
    if (XZ.busy) return false;
    var ui = -1, i;
    for (i = XZ.msgs.length - 1; i >= 0; i--) if (XZ.msgs[i].role === 'user') { ui = i; break; }
    if (ui < 0 || ui === XZ.msgs.length - 1) return false;
    var q = XZ.msgs[ui].text;
    XZ.msgs.splice(ui);
    push('user', q);
    draw(); call();
    return true;
  }

  function truncated(text, stop) {
    if (stop === 'max_tokens' || stop === 'length') return 'sure';
    if (stop) return '';
    var x = String(text || '').replace(/\s+$/, '');
    if (x.length < 280) return '';
    if (/[。！？.!?」』）)”"…~|]$/.test(x) || /(阿們|阿门|amen\.?)$/i.test(x)) return '';
    return 'guess';
  }
  function join(acc, piece) {
    piece = String(piece || '').replace(/^\s*(好的|好|OK|Okay|Sure)[，,。.!！]?\s*/i, '');
    var max = Math.min(40, acc.length, piece.length), k;
    for (k = max; k >= 4; k--) {
      if (acc.slice(-k) === piece.slice(0, k)) { piece = piece.slice(k); break; }
    }
    var head = piece.replace(/^\s+/, '');
    if (/^(#{1,6} |>|---)/.test(head)) return acc.replace(/\s+$/, '') + '\n\n' + head;
    if (/^([-*] |\d+[.)] |\|)/.test(head)) return acc.replace(/\s+$/, '') + '\n' + head;
    return acc + piece;
  }

  function post(sys, msgs, cb) {
    var ctrl = null, timer = null, done = false;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, C.timeoutMs);
    function fin(out, why, stop) {
      if (done) return; done = true;
      if (timer) clearTimeout(timer);
      cb(out, why, stop);
    }
    fetch(C.worker, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model: C.model, max_tokens: C.maxTokens, system: sys, messages: msgs })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      var t = '';
      if (data && data.content && data.content.length) {
        t = data.content.filter(function (b) { return !b.type || b.type === 'text'; })
          .map(function (b) { return b.text || ''; }).join('\n');
      } else if (data) {
        t = data.reply || data.text || data.message ||
          (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '') || '';
      }
      var stop = (data && (data.stop_reason || data.finish_reason ||
        (data.choices && data.choices[0] && data.choices[0].finish_reason))) || '';
      fin(String(t).replace(/^\s+|\s+$/g, ''), '', stop);
    })['catch'](function (e) {
      fin('', (e && e.name === 'AbortError') ? 'slow' : 'down', '');
    });
  }

  function foldOld() {
    var last = -1, i;
    for (i = 0; i < XZ.msgs.length; i++) if (XZ.msgs[i].role === 'assistant') last = i;
    for (i = 0; i < XZ.msgs.length; i++) {
      var m = XZ.msgs[i];
      if (isLong(m)) m.col = (i !== last);
    }
  }

  function call() {
    XZ.busy = true; draw();
    var off = false;
    try { off = (navigator.onLine === false); } catch (e) {}
    if (off) {
      push('assistant', L('offline') + '\n' + L('comfort'));
      XZ.busy = false; return draw();
    }
    var hist = [], i, src = XZ.msgs.slice(-C.history);
    for (i = 0; i < src.length; i++) {
      if (src[i].cont) continue;
      hist.push({ role: src[i].role, content: src[i].text });
    }
    while (hist.length && hist[0].role !== 'user') hist.shift();
    var sys = (C.system ? C.system() : '');
    if (C.sysExtra) { try { sys += C.sysExtra() || ''; } catch (e) {} }
    var m = null, n = 0;

    function finish(acc, why) {
      if (m) XZ.msgs.splice(XZ.msgs.indexOf(m), 1);
      if (acc) push('assistant', acc, { ok: true });
      else push('assistant', (why === 'slow' ? L('slow') : (why ? L('down') : L('empty'))) + '\n' + L('comfort'));
      XZ.busy = false;
      foldOld();
      draw();
    }
    function step(acc, why, stop) {
      if (!acc) return finish('', why);
      var tr = truncated(acc, stop);
      if (!tr || n >= (tr === 'sure' ? C.maxCont : 1)) return finish(acc, '');
      n++;
      if (!m) m = push('assistant', acc, { cont: true }); else m.text = acc;
      draw();
      post(sys, hist.concat([{ role: 'assistant', content: acc }, { role: 'user', content: L('contAsk') }]),
        function (out, w2, st2) {
          if (!out) return finish(acc, '');
          step(join(acc, out), '', st2);
        });
    }
    post(sys, hist, function (out, why, stop) { step(out, why, stop); });
  }

  /* ── 收藏、刪除、分享 ─────────────────────────────────────────── */

  function savedIdx(i) {
    var a = XZ.msgs[i];
    if (!a) return -1;
    var arr = saved(), j;
    for (j = 0; j < arr.length; j++) if (arr[j].a === a.text) return j;
    return -1;
  }
  function star(i) {
    var a = XZ.msgs[i];
    if (!a) return;
    var arr = saved(), k = savedIdx(i);
    if (k >= 0) {
      arr.splice(k, 1); keep(); draw();
      return toast(L('didUnsave'));
    }
    arr.unshift({
      q: qOf(i), a: a.text,
      ch: (C.chapter ? C.chapter() : 0) || 0,
      at: (new Date()).getTime()
    });
    keep(); draw(); toast(L('didSave'));
  }
  function drop(i) {
    XZ.msgs.splice(i, 1);
    if (i > 0 && XZ.msgs[i - 1] && XZ.msgs[i - 1].role === 'user') XZ.msgs.splice(i - 1, 1);
    draw(); toast(L('didDel'));
  }
  function unstar(i) {
    var arr = saved();
    arr.splice(i, 1); keep();
    toast(L('didDel'));
  }
  function share(i) {
    var m = XZ.msgs[i]; if (!m) return;
    var q = qOf(i);
    if (C.onShare) return C.onShare(m.text, q);
    var t = (q ? q + '\n\n' : '') + plainOf(m.text) + (C.shareTail ? '\n\n' + C.shareTail : '');
    try {
      if (navigator.share) { navigator.share({ text: t })['catch'](function () {}); return; }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(t).then(function () { toast(L('copied')); }, function () {});
    } catch (e) {}
  }
  function card(i) {
    var m = XZ.msgs[i]; if (!m || !C.onCard) return;
    C.onCard(m.text, qOf(i));
  }
  function exportMd(opt) {
    opt = opt || {};
    var arr = saved(), t = (opt.title || L('exportTitle')) + '\n\n', i;
    for (i = 0; i < arr.length; i++) {
      var x = arr[i];
      t += '## ' + new Date(x.at).toLocaleDateString() +
           (x.ch ? '　' + (opt.chapterLabel ? opt.chapterLabel(x.ch) : '第 ' + x.ch + ' 章') : '') + '\n\n';
      if (x.q) t += '**Q:** ' + x.q + '\n\n';
      t += x.a + '\n\n---\n\n';
    }
    try {
      var b = new Blob([t], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = opt.file || L('exportFile');
      a.click();
    } catch (e) {}
    return t;
  }

  /* ── 面板 ─────────────────────────────────────────────────────── */

  function fuHtml(m, i) {
    if (!C.followups || m.role !== 'assistant' || !m.ok || m.cont || XZ.busy || i !== XZ.msgs.length - 1) return '';
    var l = [];
    try { l = C.followups() || []; } catch (e) { l = []; }
    if (!l.length) return '';
    var h = '<div class="xzfu"><span class="xzfut">' + esc(L('fuT')) + '</span>', k;
    for (k = 0; k < l.length; k++) {
      h += '<button class="xzfuc" onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' +
        esc(l[k][2]) + '">' + esc(l[k][0] + ' ' + l[k][1]) + '</button>';
    }
    return h + '</div>';
  }

  function bubble(m, i) {
    if (m.role !== 'assistant') {
      return '<div class="xzm user">' + nl(m.text) + '</div>';
    }
    if (m.cont) {
      return '<div class="xzm assistant" id="xzm' + i + '"><div class="xzt">' + link(body(m.text)) + '</div>' +
        '<div class="xzcont">' + esc(L('cont')) + '</div></div>';
    }
    var long = isLong(m);
    var col = long && m.col !== false;
    var sav = savedIdx(i) >= 0;
    return '<div class="xzm assistant" id="xzm' + i + '">' +
      '<div class="xzt ' + (col ? 'clip' : '') + '">' + link(body(m.text)) + '</div>' +
      (long ? '<button class="xzmore" onclick="SAGE321.fold(' + i + ')">' +
        esc(col ? L('more') : L('less')) + '</button>' : '') +
      (m.ok ? '<div class="xzact">' +
      (C.onSpeak ? '<button onclick="SAGE321.speak(' + i + ')">' + esc(L('speak')) + '</button>' : '') +
      '<button class="' + (sav ? 'on' : '') + '" onclick="SAGE321.star(' + i + ')">' +
      esc(sav ? L('saved') : L('save')) + '</button>' +
      '<button onclick="SAGE321.share(' + i + ')">' + esc(L('share')) + '</button>' +
      (C.onCard ? '<button onclick="SAGE321.card(' + i + ')">' + esc(L('card')) + '</button>' : '') +
      '<button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button>' +
      '</div>' : '<div class="xzact"><button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button></div>') +
      fuHtml(m, i) + '</div>';
  }

  /* 只改這一則——不重畫整個對話，正在朗讀的那一則才不會斷 */
  function fold(i) {
    var m = XZ.msgs[i];
    if (!m || !isLong(m)) return;
    m.col = (m.col === false);
    var el = document.getElementById('xzm' + i);
    if (!el) return draw();
    var t = el.querySelector('.xzt'), b = el.querySelector('.xzmore');
    if (t) t.className = 'xzt' + (m.col ? ' clip' : '');
    if (b) b.textContent = m.col ? L('more') : L('less');
    if (m.col) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function foldAll() {
    var n = 0, i;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { XZ.msgs[i].col = true; n++; }
    if (!n) return toast(L('foldNone'));
    draw(true);
    toast(L('foldedAll'));
  }
  function speak(i) {
    var m = XZ.msgs[i];
    if (m && C.onSpeak) C.onSpeak(toSpeech(m.text), C.name);
  }

  function draw(keepScroll) {
    var el = document.getElementById(C.el);
    if (!el) {
      el = document.createElement('div');
      el.id = C.el; el.className = 'xz';
      document.body.appendChild(el);
    }
    el.className = ('xz ' + (XZ.open ? 'on' : '')).replace(/\s+$/, '');
    if (!XZ.open) return;
    var oldB = document.getElementById('xzb'), oldTop = oldB ? oldB.scrollTop : 0;
    var inp = document.getElementById('xzin'), typed = inp ? inp.value : '';

    var bd = '', i;
    if (XZ.msgs.length) {
      for (i = 0; i < XZ.msgs.length; i++) bd += bubble(XZ.msgs[i], i);
    } else {
      bd = '<div class="xzhi"><b>' + esc(L('iam') || ('我是' + C.name + '。')) + '</b><br>' +
        esc(C.hello || L('hello')) + '<br>' +
        '<span class="xs muted">' + esc(L('caveat')) + '</span></div>';
    }
    var quicks = '';
    if (!XZ.msgs.length && C.quicks) {
      var qs = [];
      try { qs = C.quicks() || []; } catch (e) { qs = []; }
      if (qs.length) {
        quicks = '<div class="xzq">';
        for (i = 0; i < qs.length; i++) {
          quicks += '<button onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' + esc(qs[i]) + '">' +
            esc(qs[i]) + '</button>';
        }
        quicks += '</div>';
      }
    }
    var ctl = '';
    if (C.controls) { try { ctl = C.controls() || ''; } catch (e) { ctl = ''; } }
    var anyLong = false;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { anyLong = true; break; }

    el.innerHTML =
      '<div class="xzmask" onclick="SAGE321.close()"></div>' +
      '<div class="xzcard">' +
      '<div class="xzh"><b>' + esc(C.emoji + ' ' + C.name) + '</b>' +
      '<span class="xs muted" style="flex:1">' + esc(C.tagline) + '</span>' +
      (anyLong ? '<button class="ico" onclick="SAGE321.foldAll()">' + esc(L('foldAll')) + '</button>' : '') +
      (XZ.msgs.length ? '<button class="ico" onclick="SAGE321.clear()">' + esc(L('clear')) + '</button>' : '') +
      '<button class="ico" onclick="SAGE321.close()">' + esc(L('close')) + '</button></div>' +
      (ctl ? '<div class="xzctl">' + ctl + '</div>' : '') +
      '<div class="xzb" id="xzb">' + bd + quicks +
      (XZ.busy && !(XZ.msgs.length && XZ.msgs[XZ.msgs.length - 1].cont)
        ? '<div class="xzm assistant xzwait">' + esc(C.name + L('thinking')) + '</div>' : '') +
      '</div>' +
      '<div class="xzf">' +
      '<input id="xzin" placeholder="' + esc(L('placeholder')) + '"' +
      ' onkeydown="if(event.key===\'Enter\'&&!event.isComposing)SAGE321.send()">' +
      '<button class="btn pri" onclick="SAGE321.send()">' + esc(L('send')) + '</button>' +
      '</div></div>';
    var ni = document.getElementById('xzin');
    if (ni && typed) ni.value = typed;
    setTimeout(function () {
      var b = document.getElementById('xzb');
      if (!b) return;
      b.scrollTop = keepScroll ? oldTop : b.scrollHeight;
    }, 30);
  }

  function clear() { XZ.msgs = []; draw(); }

  function init(cfg) {
    C = ext(ext({}, DEF), cfg || {});
    C.labels = ext(ext({}, DEF.labels), (cfg && cfg.labels) || {});
    if (!C.worker) throw new Error('SAGE321.init 需要 worker');
    return API;
  }

  var API = {
    init: init,
    open: open, close: close, clear: clear,
    ask: ask, send: send, pick: pick, reask: reask,
    star: star, drop: drop, unstar: unstar, savedIdx: savedIdx,
    share: share, card: card,
    fold: fold, foldAll: foldAll, speak: speak, draw: draw,
    exportMd: exportMd,
    saved: saved,
    msgs: function () { return XZ.msgs; },
    isOpen: function () { return !!XZ.open; },
    speechOf: toSpeech,
    plainOf: plainOf,
    isBusy: function () { return !!XZ.busy; },
    linkify: link,
    _truncated: truncated, _join: join,
    version: '2.0.0'
  };
  return API;
})();

   ② 讀經樂：小智照創世記各章出題（測驗＋猜謎）、錯題本、最佳成績

var GX = (function () {
  'use strict';

  const GXD = {"keys": ["adult", "teen", "kid", "seeker", "elder", "single_parent", "single", "parent", "couple", "pastor"], "icon": {"adult": "🧑", "teen": "🧒", "kid": "🧸", "seeker": "🌱", "elder": "👴", "single_parent": "👩‍👧", "single": "🙋", "parent": "👨‍👩‍👧", "couple": "💑", "pastor": "⛪"}, "names": {"adult": "成人", "teen": "青少年", "kid": "兒童", "seeker": "慕道友", "elder": "長輩", "single_parent": "單親", "single": "單身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "hints": {"adult": "有深度，貼近工作、家庭與關係", "teen": "幽默風趣、不說教，用你的世界來比喻", "kid": "非常簡單好懂，像在聽故事", "seeker": "還沒信主也聽得懂，不說教，給實際的幫助", "elder": "尊敬溫和、慢慢說，句子清楚好懂", "single_parent": "先接住你的辛苦，給做得到的小步驟與盼望", "single": "真誠平等，不催婚，談身分、等待與使命", "parent": "貼近養兒育女的日常：溝通、管教、陪伴與禱告", "couple": "夫妻同行：溝通、饒恕、同心與一起禱告", "pastor": "同工口吻：牧養、講道預備、團隊與不倦怠"}, "lenNames": {"brief": "簡要", "mid": "適中", "full": "詳細"}, "len": {"brief": " 回答長度：簡要。整段回答控制在 3～5 句話（約 150 字內）：直接給核心答案、一句關鍵經文或一個比喻，最後一句禱告或一個小步驟。不用表格、不列長清單。", "full": " 回答長度：詳細。請完整、有條理地回答（約 800～1200 字）：說明經文脈絡、關鍵字詞的意思、相關經文對照、清楚的321應用、這星期可以操練的具體步驟，最後以禱告結束。可用簡短小標題。"}, "aud": {"adult": {"sys": " 回答對象：成年人。請用成熟、沉穩而溫暖的口吻，可以有適度的深度：點出經文脈絡與關鍵字詞的意思，連結工作、婚姻、教養、人際與屬靈爭戰，最後帶出一個這星期就能操練的具體步驟。", "write": "\n讀者是成年人：口吻成熟、溫暖、真誠。", "style": "風格：沉穩清楚；其中一兩題帶出生命應用。", "res": ["再讀一遍這章，細細品味，下次會更好。", "不錯！這章的信息已經進到你裡面了。", "太棒了！經文的話已經住在你心裡。"], "q": ["這段經文讓我看見神是怎樣的一位神？", "這段經文照出我裡面什麼樣的舊人有己？", "若讓耶穌在這件事上作王，我會怎麼做？", "這段經文中，耶穌給我看見什麼樣的榜樣？", "聖靈要藉這段話引導我今天走哪一步？", "這裡的人為什麼會失敗？根源是驕傲還是恐懼？", "這段經文如何幫助我操練無己的生命？", "我可以把這段經文用在與誰的關係上？", "這段經文與主禱文「願你的國降臨」有什麼關聯？", "請用一個比喻幫我明白這段經文的核心。"], "fu": [["💍", "婚姻", "請針對你剛才的回答，說明怎麼把它應用在夫妻關係與婚姻裡，並給我一個這個星期可以做的具體小步驟。"], ["👨‍👩‍👧", "家庭", "請針對你剛才的回答，說明怎麼把它應用在家庭與教養孩子（或與父母相處）上，並給我一個這個星期可以做的具體小步驟。"], ["💼", "職場", "請針對你剛才的回答，說明怎麼把它應用在工作與職場上（同事、主管、壓力、誠信），並給我一個這個星期可以做的具體小步驟。"], ["🏡", "日常", "請針對你剛才的回答，說明怎麼把它應用在日常生活的小事上（時間、金錢、習慣），並給我一個這個星期可以做的具體小步驟。"], ["💭", "內心", "請針對你剛才的回答，說明怎麼把它應用在面對內心的情緒與軟弱上（焦慮、憤怒、驕傲），並給我一個這個星期可以做的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "teen": {"sys": " 回答對象：青少年（約12–18歲）。請用幽默風趣、輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];

      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }

<script>/* ===== 321彼得前書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 進度 ===== */
const STEPS = [
  ['資訊','讀完本章卡片'], ['啟示','讀經文，寫下你看見的一件事'], ['信服','記住本章金句'],
  ['實踐','選一項本週操練'], ['檢討','第七天回填：做了嗎'], ['修正','回到哪一節重讀'],
  ['反覆','複習通過三次'], ['繁殖','講給一位課外的人聽'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 複習 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 朗讀 ===== */
let VOICE = null;
function say(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-TW'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const plain = el => (el || $('#view')).innerText.slice(0, 3000);

/* ===== 路由 ===== */
let R = { tab:'today', ch:0, sub:'' };
function go(tab, ch, sub){ R = { tab, ch: ch || 0, sub: sub || '' }; if (ch) { S.last = ch; save(); } render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('nav.tabs button'); if (!b) return;
  go(b.dataset.t);
});
$('#back').onclick = () => { if (R.ch) go(R.tab === 'text' ? 'text' : 'course'); else go('today'); };
/* 頁首的 🔊：在講義那一頁，直接讀講義本文（不念卷名、提詞機與目錄） */
$('#spk').onclick = () => {
  if (SPK.on) return stopSpeak();
  if (R.tab === 'course' && R.ch && R.sub === 'lesson' && (D.lesson || {})[R.ch]) return lesSpeak(R.ch);
  speak(plain(), $('#ttl').textContent);
};
$('#spk').onlongpress = null;
(function(){ let t; const b = $('#spk');
  const st = () => { t = setTimeout(() => { voiceSheet(); t = null; }, 550); };
  const cl = () => { if (t){ clearTimeout(t); t = null; } };
  b.style.webkitTouchCallout = 'none'; b.style.webkitUserSelect = 'none'; b.style.userSelect = 'none';
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('touchstart', st, { passive:true });
  b.addEventListener('touchend', cl); b.addEventListener('touchmove', cl);
  b.addEventListener('mousedown', st); b.addEventListener('mouseup', cl);
})();
$('#fsz').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); toast('字級 ' + (S.set.fs + 1) + ' / 5'); };
function applyFS(){ document.documentElement.style.setProperty('--fs', [15, 17, 19, 22, 25][S.set.fs] + 'px'); }

/* 繁 ↔ 简：頁首一鍵切換。按鈕上寫的是「要切過去的那一邊」。 */
function applyLang(){
  document.documentElement.setAttribute('lang', S.set.sc ? 'zh-Hans' : 'zh-Hant');
  for (const id of ['#lang', '#fLang']) {
    const b = $(id);

}
function toggleSC(){
  S.set.sc = S.set.sc ? 0 : 1; save();
  // 轉簡是單向的：切回繁體要重讀一次，否則靜態外殼的字回不來
  if (!S.set.sc) { location.reload(); return; }
  render();

  scApply(); applyLang();

}
if ($('#lang')) $('#lang').onclick = toggleSC;

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 5;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 每章二到三點（第 3 章兩點）：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="彼得前書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">望 · 石 · 福 · 火 · 牧</p></div>`;
}

    <p style="margin:0">已開始 <b>${startedCh()}</b> 章　·　走完八步 <b>${doneCh()}</b> 章　·　共 5 章</p></div>`;

  h += `<div class="foot">全書五章 105 節經文、${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段逐節解經、5 篇講章逐字稿，全部收錄。<br>
    內容出自《321彼得前書解經與講章》。經文引用《和合本》。</div>`;
  return h;
}
const practiceItems = n => [meta(n).prac.main].concat(meta(n).prac.items);

/* ===== 經文 ===== */
function vText(){
  setTitle('經文', false);
  if (!R.ch){
    let h = `<div class="sect"><p class="eyebrow">彼得前書</p><h2 class="big">從第一章讀到第五章。</h2>
      <p class="sm muted">點任何一節，該節的解經就會打開。</p>
      <div class="row" style="margin:14px 0">`;
    for (let i = 1; i <= 5; i++){
      const n = (D.txt[i] || []).length;
      h += `<button class="pill on" onclick="go('text',${i})">${i}　${n}節</button>`;
    }
    h += `</div><p class="xs muted">全書五章 105 節，逐節解經 ${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段，全部收錄。</p></div>`;
    return h;
  }
  const n = R.ch, m = meta(n);
  setTitle('彼得前書 ' + n, false);

      <span class="vn" ${b ? `onclick="openV('${ref}')"` : ''}>${vn}</span>
      <span class="vt">${vb}${note}${tag}</span></div>` + notes;
  });
  h += '</div>';
  h += `<div class="hr"></div><button class="btn" onclick="go('course',${n})">看第 ${n} 章講義 ›</button>`;
  return h;
}

/* ===== 節解經（六層）===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>彼得前書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">下一段 ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 朗讀</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ 問小智</button>
    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '羅 ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, '本章金句'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}
