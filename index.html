<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321彼得前書講義">
<meta name="application-name" content="321彼得前書講義">
<meta name="description" content="321彼得前書講義：全書五章逐節原文解經、講章逐字稿與321生命應用。">
<title>321彼得前書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){

}, 8000);

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"叫我們有活潑的盼望","sub":"望、聖、血","lv":"A","arc":"望","sec":[["1:1--2","寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的：被揀選的寄居者"],["1:3--9","叫我們有活潑的盼望：從空墳墓開始的喜樂"],["1:10--12","天使也願意詳細察看這些事：先知與天使都在看"],["1:13--16","你們在一切所行的事上也要聖潔：束上心中的腰"],["1:17--21","乃是憑著基督的寶血：寄居的日子與贖價"],["1:22--25","惟有主的道是永存的：不能壞的種子"]],"serm":{"pts":[["活潑的盼望","1:3--9","「叫我們有活潑的盼望」——寄居的人在地上沒有基業，神卻藉著一個從死裡復活的人，給他們一個活的盼望；試煉是暫時的，信心比金子寶貴"],["你們要聖潔","1:13--21","「你們要聖潔，因為我是聖潔的」——被這麼貴的寶血買回來的人，不再照祖宗的樣子活；聖潔不是一套規矩，是像那召我們的"],["不能壞的種子","1:22--25","「惟有主的道是永存的」——草會枯，花會謝，神的道把我們重生成一家人；所以要從心裡彼此切實相愛"]]},"q":"如果你的盼望有一個保存期限，它會印在哪裡？印在存摺上、健康檢查報告上、孩子的成績單上，還是那張印著你職稱的名片上？\n你信主以後沒有搬家，卻好像成了家裡的外人：過年的飯桌上，有人問「你現在是不是都不拜了」，你笑一笑、夾一口菜，不知道怎麼答；回到住處，你也許在床上問自己：這樣到底值不值得？\n這一章要問的是：在一個你不再完全屬於的地方，你憑甚麼還有盼望——而且不是撐出來的盼望，是一個活的盼望？","truth":"神照自己的大憐憫，藉耶穌基督從死裡復活重生了我們，又用基督的寶血把我們從虛妄的活法裡買回來；所以神說：「你們要聖潔，因為我是聖潔的」（1:16）。\n聖潔不是一張規矩清單，是一個被這麼貴的價錢買回來的人，開始像那召他的那一位；寄居的日子是暫時的，那位聖潔的神和他的道是永遠的。","mv":{"t":"願頌讚歸與我們主耶穌基督的父神！他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望","r":"彼前1:3"},"card":["這一章是全卷「望・石・福・火・牧」的第一步：望。彼得寫信給一群信主後沒有搬家、卻成了家鄉外人的寄居者，第一句不是叫他們忍耐，是讚美：神藉著耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望（1:3）。全章拎起來就是三個字——望、聖、血：盼望從空墳墓開始，聖潔是像那召我們的，而這一切，是用基督的寶血買回來的。","這一章從頭到尾，主詞都是神。父神照先見揀選，聖靈使人成聖，耶穌的血灑在人身上（1:2）；神照自己的大憐憫重生了我們，把基業存留在天上，又用自己的能力保守地上的我們（1:3--5）；基督的靈在先知心裡預先作證，聖靈從天上被差來（1:11--12）；羔羊在創世以前就被預先知道，神叫他從死裡復活，又給他榮耀（1:20--21）；最後，神用活潑常存的道把我們生成一家人（1:23）。人做的每一件事，都是在回應。","1:13 一長串的話，原文只有一個主要動詞：ἐλπίσατε（elpisate），「要盼望」，是命令式。「約束你們的心」「謹慎自守」都是分詞，是替這一個命令鋪路。這改變今天的讀法：盼望在這裡不是一種要等它自己湧上來的心情，是一個可以被吩咐、也可以被選擇的方向。你不必等到處境好轉、心情變好才開始盼望；今天早上，你就可以決定把心的重量放在主顯現的那一天。","這一章照出一個把盼望綁在能壞之物上的我：存款多一點就安心，健檢紅字一出現就失眠，別人一句「你怎麼信了洋教」就整晚睡不著。它也照出一個把聖潔做成清單的我——用清單來量別人，也用清單來替自己打分數；還有一個讓別人的眼光替自己定價的我：家族的評語、老闆的臉色、群組裡的回應，決定我今天值多少。","「不是憑著能壞的金銀等物，乃是憑著基督的寶血」（1:18--19）。全章最該被記住的，就是這一個「不是……乃是」。地上的眼光用金銀替人定價，彼得說，你的價錢早就定了，而且是用血付的。一個知道自己被誰、用多少買回來的人，不必再到處討人的認可，也不必再照祖宗那套虛空的活法證明自己；定價權已經從人手裡，交回那位付了價的主手裡。","這一週挑一個晚上，打開手機的記帳或行事曆，看看這個月你的錢和時間最多花在哪裡，在旁邊寫上「能壞」或「不能壞」。然後做一件「不能壞」的事：打一通電話給一位不信主的長輩，不急著談信仰，問候他的身體，約好下一次回家的日子；或寫一則訊息給小組裡一位正在憂愁的人，抄上 1:6，告訴他「暫時」這兩個字。","最終整合：病房，凌晨兩點。\n孫子坐在床邊。阿嬤是家族裡唯一信主的人，四十年前信的。那幾年她不再拿香，被叔伯們說了很久。\n她沒有讀過書，五十歲才照著聖經，一個字一個字學認字。現在白內障，又中了風，字已經看不清楚了。\n她摸到孫子的手，說：你幫阿嬤念一節。\n孫子打開手機，點到彼得前書，念：「你們雖然沒有見過他，卻是愛他」（1:8）。\n阿嬤笑了。她說：對啊，我一輩子都沒有看見過他。現在，連你的臉我也看不清楚了。\n她停了一下：可是我愛他。\n孫子往下念：「如今雖不得看見，卻因信他就有說不出來、滿有榮光的大喜樂」（1:8）。\n她沒有再說話。眼角有淚，嘴角在笑——憂愁和喜樂，在同一張臉上。\n孫子後來才明白：她沒有見過他，他卻一直看著她。在被說閒話的那幾年，在學認字的那張小桌子旁，在這張病床上。\n有一天，耶穌基督顯現的時候，她會看見。\n她睜開眼睛，第一個看清楚的，會是那一位她從來沒有見過、卻愛了一輩子的人的臉。"],"self":"這一章照出來的「有己」，是一個要自己守住自己的人：把盼望放在看得見、抓得住的東西上，存款、健康、孩子、名聲，因為那些東西我可以控制；一旦它們搖動，我的盼望也就跟著死。\n有己也會換一個樣子出現：把聖潔變成我自己做得到的一張清單，好讓我比別人乾淨一點；或者讓家族、老闆、群組裡的眼光替我定價。這兩種我，都忘了守城的是神，付價的也是神。","t321":{"k":"耶穌是我的榜樣：「基督受苦難，後來得榮耀」（1:11）這條路，耶穌自己先走。他在客西馬尼園說「我心裡甚是憂傷，幾乎要死」（太 26:38）——神的兒子也憂愁，所以 1:6 的憂愁不必被藏起來；他「因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）——憂愁裡有方向。他也是無瑕疵、無玷污的羔羊（1:19），可是他的聖潔不是遠離人：他和稅吏、罪人同桌吃飯，摸痲瘋病人，聖潔得可以靠近任何人。這就是 1:15 的聖潔有了一張臉。","g":"讓耶穌作王：這一章要人讓出來的位置，是「替自己定價」的那張椅子。寄居的人最常把這張椅子讓給別人：讓家族的評語、老闆的考績、群組裡的回應，決定自己今天值多少。1:17 說「存敬畏的心」，就是把這張椅子還給對的那一位；1:18--19 說付價的是基督的寶血，那麼有權替你定價的，也只有他。讓耶穌作王，也是讓出「守城」的位置：1:5 說守住你的是神的能力，不是你的意志力。可以自己檢查：這一週，誰的一句話最能左右你的心情？那句話，現在坐在誰的位置上？","p":"建立屬神的體系：1:22--23 說，我們是從同一顆不能壞的種子生的，所以要「從心裡彼此切實相愛」。寄居的人常常失去原來的家，教會要成為一個真的家，不是一個聚會的場地。第一，為家中只有自己信主的弟兄姊妹安排屬靈同伴（321 的 235 第二層），特別是新信徒的第一個農曆年、第一次清明，事先陪他想好怎樣不拜也盡孝。第二，年節時開一桌「寄居者的團圓飯」，讓回不了家、或回家被冷落的人有位子坐。第三，國度321空中團契散在各國，讓每一個在異鄉的人，至少有一位會在他憂愁時打電話來的家人。"},"grp":["【一、破冰】你手邊有沒有一樣用了很多年、到現在還捨不得丟的東西？是甚麼、哪一年得到的？如果它明天壞了，你會怎麼樣？","【二、扎心】經文說：「因此，你們是大有喜樂；但如今，在百般的試煉中暫時憂愁」（1:6）。說出這一陣子讓你憂愁的一件事——家人、工作、身體、一段關係。在教會裡，你有沒有覺得自己必須先擦乾眼淚、才可以出現？那是在哪一個場合？","【三、福音】讀 1:18--19：買你回來的，「不是憑著能壞的金銀等物，乃是憑著基督的寶血」。你最常讓誰的眼光替你定價——父母、老闆、另一半、網路上的陌生人？如果你今天真的相信自己是用這個價錢被買回來的，你明天早上起床，會有哪一件事做得不一樣？","【四、行動】說出這一週你要聯絡的一位不信主的家人或長輩：他的稱呼、你打算星期幾、用甚麼方式（電話、回家吃飯、陪他看醫生）。也說出你要用甚麼具體的行動，讓他看見你信主以後是更愛家，不是離開家。","【五、代禱】為三種人指名禱告：一位家中只有他一個人信主、年節回家壓力很大的弟兄姊妹，求主讓他在家裡是一個被尊重、也更孝順的人；一位正在憂鬱或焦慮中、可能正在就醫的人，求主陪他，也求我們不催他；一位離鄉在外、在異地寄居的人，求主讓他知道自己被揀選、被保守。"],"prac":{"main":"這一週，我把盼望放在那位從死裡復活的主身上；被這麼貴的價錢買回來，我在一切所行的事上，學著像那召我的。","items":["對神：每天早上讀 1:3--5 一次，對神說：「今天守住我的，是你的能力。」每天晚上讀 1:8，用一句話告訴主：「我沒有見過你，但我愛你。」如果那天很難說出口，就說：「今天我很難過，可是我還是向著你。」","對自己：這七天，每當你因為一件事失去盼望或整晚睡不著，就記下那件事，在旁邊寫「能壞」或「不能壞」。週末把單子讀一遍，問自己：我的盼望這一週大多掛在哪裡？哪一樣其實早就存在天上，有人替我看守著？","對人：找一位家中只有他一個人信主、或年節回家壓力很大的弟兄姊妹，這一週約他喝一杯咖啡或打一通電話；不要先教他怎麼應付家人，先問他：「你回家的時候，最難的是哪一刻？」然後為他禱告。","對生活：選一個你原本「大家都這樣，所以我也這樣」的習慣——應酬的灌酒、公司的小謊、網路上的冷言冷語——這一週在這一件事上，安靜地照那召你的樣子活。不必宣告，不必批評別人，只是不再被套回那個模子。","對使命：為一位不信主的家人或長輩每天指名禱告，這一週用一個具體的孝順行動（陪他看醫生、回家吃飯、幫他處理一件麻煩事）愛他；求主讓他有一天聽見「所傳給你們的福音就是這道」（1:25），也在你身上先看見這道的樣子。"]},"safe":["① 用 1:6--8 對正在憂愁的人說：「真正有喜樂的基督徒不會憂愁」「你憂鬱就是不夠信靠神」，或催他趕快笑出來。","彼得在同一句裡放進「大有喜樂」與「暫時憂愁」，兩個都是真的；憂愁是被允許的，主耶穌在客西馬尼也憂傷。否定憂愁，會叫憂鬱、焦慮的人停藥、不敢求助，在教會裡戴上面具（全卷立場見 ISS00_2；議題見 ISS01_5）。","檢驗標準：一位正在吃抗憂鬱藥的弟兄姊妹聽完，是更敢說出自己的狀況、繼續就醫，還是更覺得自己是一個失敗的基督徒？","② 把 1:6--7 的「火」講得浪漫：「苦難是神給的禮物，你要感謝神讓你受苦，越苦越屬靈。」或暗示信徒去找苦。","1:7 說的是已經在試煉裡的人，信心被煉得比金子寶貴；不是叫人去找苦，更不是把苦本身當成好事。浪漫化苦難，會讓正在受苦的人覺得自己的痛不被看見，也讓旁觀的人少了伸手幫忙的理由。","檢驗標準：會眾聽完，是更懂得陪伴受苦的人、更願意幫忙，還是只學會對受苦的人說「這是祝福」？","③ 對在試煉中的人說：「你受苦是因為你有罪，要先檢討自己」；把 1:6 的「百般的試煉」一律講成管教或懲罰。","彼得分辨四種苦：因犯罪受苦（2:20；4:15）不是他要安慰的；因行善、為義、為基督的名受苦，還有百般的試煉，是他要安慰的。把所有的苦都歸罪，等於在傷口上再加一刀（全卷立場見 ISS00_2）。","檢驗標準：一位剛失業、剛確診、剛失去家人的人聽完，是覺得被安慰，還是覺得被審問？","④ 把「受苦」講成「忍受一切」：用 1:6「暫時」叫正在受家暴、職場霸凌、被剝削的人「再忍一忍，很快就過去了」。","「暫時」是神框住苦難的應許，不是叫人留在侵害裡的理由；受苦不等於忍受侵害，人身安全受威脅時要先保護生命、依法求助（全卷立場見 ISS00_2、ISS00_3）。","檢驗標準：一位正在被傷害的人聽完，是更知道可以求助、可以離開危險，還是更覺得應該繼續忍？","⑤ 用 1:18「祖宗所傳流虛妄的行為」羞辱長輩：「你爸媽一輩子拜的都是假的，他們活得毫無意義」，或在講台上斷定已過世長輩的去處。","彼得自己也是從祖宗的傳統裡被主叫出來的，他說的是那套活法虛空，不是那些人沒有價值。羞辱長輩會讓家人更認定信耶穌就是不孝，也會深深刺傷父母未信、已經過世的弟兄姊妹（哀傷與亡者回指帖撒羅尼迦前書立場三；議題見 ISS01_8）。","檢驗標準：一位父母都還沒有信主、或剛辦完不信主父親喪禮的弟兄姊妹聽完，是更知道怎樣愛家人，還是更羞愧、更想躲開家族？","⑥ 反過來，叫新信徒在家族的祭祀或喪禮上當眾對抗：搶香、拒絕出席、和長輩翻臉，甚至斷絕往來，說這是「分別為聖」。","拜與不拜要分開，孝與不孝也要分開：被贖出來的是虛空的活法，不是對父母的愛。把信仰講成對抗，會讓家人只看見一個離開家的人，看不見一個更愛家的人（議題見 ISS01_8）。","檢驗標準：講完以後，會眾知道的是「我要怎樣不拜、又更孝順」，還是「我要怎樣在家族面前表明立場」？","⑦ 把 1:15--16「你們要聖潔」講成一張規矩清單：不看電影、不可以化妝、不可以去哪些地方，用清單來量誰屬靈。","彼得的理由不是一張清單，是一個人：「那召你們的既是聖潔」（1:15）；聖潔是像那召我們的那一位（回指帖撒羅尼迦前書立場四）。清單式的聖潔會養出驕傲與論斷，也讓人以為守完清單就聖潔了，心卻沒有改變（議題見 ISS01_7）。","檢驗標準：會眾聽完，記住的是一張「不可以」的清單，還是更認識、也更想像那位聖潔的神？","⑧ 反過來，把聖潔講成可有可無：「那是舊約的要求，現在是恩典時代，神只看你的心，怎麼活不重要。」","彼得把利未記的話直接寫給外邦信徒，而且說「在一切所行的事上」（1:15）；下一節又說神「按各人行為審判人」（1:17）。把恩典講成不必聖潔，等於把那用寶血付的價錢講得很便宜。","檢驗標準：會眾聽完，是更珍惜那價錢、在辦公室與家裡更願意像主，還是更放心地照舊活？","⑨ 用處境取消原則：「這是寫給一世紀小亞細亞的外僑，跟今天的我們無關」；或把處境硬搬：把「寄居的」講成基督徒不必關心社會、不必好好工作、這世界反正不是我家。","書信三問要走完：處境是一群信主後成了家鄉外人的信徒；原則是被揀選的寄居者，盼望在復活的主身上；今天落在不信的家族、應酬文化、職場與異鄉。寄居不是逃離世界，是在世界裡活出另一個國的樣子（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是更知道明天怎樣在家裡、公司裡做一個寄居者，還是覺得這一章只是歷史，或乾脆不必理會身邊的世界？","⑩ 把 1:3「重生」與 1:23 講成一個要人拿出證據的考題：「你說不出哪一天、哪一刻重生的，就是還沒有重生」；或反過來說「受洗那天就自動重生，以後怎麼活都不要緊」。","1:3 重生的主詞是神，根源是「他的大憐憫」，方法是「藉耶穌基督從死裡復活」；1:23 說是藉著神的道。拿經歷的時間點當標準，會讓在基督徒家庭長大、慢慢信主的人懷疑自己（議題見 ISS01_3；洗禮見 ISS00_4）。","檢驗標準：一位說不出自己是哪一天信主的弟兄姊妹聽完，是更確信神的憐憫，還是開始懷疑自己是不是假的？","⑪ 拿 1:5「蒙神能力保守」來嚇人或縱容人：「你這樣跌倒，就已經失去救恩了」；或「反正永遠得救，怎麼活都可以」。","1:5 是寫給快撐不住的人的安慰：守城的是神的能力，人回應的是信；一次得救、永遠得救的各家讀法在議題頁並陳（議題見 ISS01_4）。用它嚇人會奪走安慰，用它縱容人會奪走信。","檢驗標準：一位剛跌倒、正在痛悔的人聽完，是更敢回到神面前，還是更確定自己已經完了？","⑫ 在講台上用 1:2「照父神的先見被揀選」爭論預定論，或說「某某人大概不是被揀選的，所以不必向他傳了」。","彼得用「被揀選」是給寄居的人一個身分，不是給人一份名單；揀選的各家讀法在議題頁並陳（揀選與預定回指以弗所書立場二；議題見 ISS01_2）。把揀選變成判斷別人的工具，會讓人放棄傳福音，也讓人懷疑神的愛。","檢驗標準：會眾聽完，是更安心於自己被神揀選、也更想把福音傳給身邊的人，還是開始猜誰在名單上、誰不在？","⑬ 把 1:8「說不出來、滿有榮光的大喜樂」講成情緒的指標：「你在敬拜裡沒有感動、沒有流淚，就是不夠愛主」；或要求會眾在聚會裡表現出某一種情緒。","1:8 的喜樂是「因信他」而有的，和「暫時憂愁」（1:6）同時存在；愛主不是一種要被量出來的感覺。把喜樂變成表演，會讓內向、正在低潮、或剛經歷喪親的人覺得自己被排除在外。","檢驗標準：一位這一週一點感覺都沒有、卻還是來了的人聽完，是知道他的「來」本身就是愛，還是覺得自己又不及格？","⑭ 把本章講成彼得的勵志故事：「彼得從失敗走到成功，你也可以」；講到最後，會眾記得的是彼得多了不起。","不是彼得變好了，是主沒有放棄他：重生的根源是神「照自己的大憐憫」（1:3）。把焦點放在彼得身上，會讓跌倒的人只學到「要更努力」，看不見那位接他回來的主（議題見 ISS01_1；作者的全卷立場見 ISS00_6）。","檢驗標準：會眾聽完，是更佩服彼得，還是更愛那位在他跌倒之後還把他接回來的主？","⑮ 把 1:24「凡有血氣的，盡都如草」講成否定地上的一切：「工作、學業、成就、美好的事物都是虛空，不必認真。」","彼得說能壞的東西有保存期限，不是說它們沒有價值；能壞的金子，人還是願意放進火裡煉（1:7）。講成否定一切，會讓認真工作、讀書的人覺得被輕看，也讓人把懶散說成屬靈。","檢驗標準：會眾聽完，是更知道哪些東西值得放上一生、同時把手上的工作做好，還是乾脆對地上的事都不在乎了？"]},{"n":2,"t":"你們來到主面前，也就像活石","sub":"石、客、蹤","lv":"A","arc":"石","sec":[["2:1--3","要愛慕那純淨的靈奶：才生的嬰孩"],["2:4--10","你們來到主面前，也就像活石：被建造成為靈宮"],["2:11--12","你們是客旅，是寄居的：在外邦人中品行端正"],["2:13--17","你們為主的緣故，要順服人的一切制度：自由人與神的僕人"],["2:18--25","叫你們跟隨他的腳蹤行：受冤屈的家僕與受苦的基督"]],"serm":{"pts":[["活石與靈宮","2:4--10","「被建造成為靈宮，作聖潔的祭司」——被人丟棄的石頭成了房角石；一群被丟棄過的人被砌在他身上，成為一座沒有牆的殿"],["為主的緣故","2:11--17","「你們為主的緣故，要順服人的一切制度」——寄居的人在地上有住所、沒有戶籍；順服的理由是主，界線也是主：敬畏神，尊敬君王"],["跟隨他的腳蹤","2:18--25","「叫你們跟隨他的腳蹤行」——受冤屈的人有一張可以描的字帖：被罵不還口，把自己交託那按公義審判人的主；他的鞭傷醫治了我們"]]},"q":"你有沒有過這樣的時刻：家族祭祖，大家手裡都拿著香，只有你的手是空的，空氣忽然安靜下來；或是公司的群組裡，你說過的一句話被人截圖、斷章取義，第二天整個部門看你的眼神都不一樣了。\n你沒有搬家，也沒有換工作，可是自從信了主，你在自己的家鄉、自己的辦公室裡，好像成了一個外人。你心裡有兩個聲音：一個說「回嗆他，讓大家知道真相」，一個說「算了，吞下去，基督徒要忍」。\n這一章要問的是：一塊被人丟到一邊的石頭，能不能被砌進神的殿裡？一個被冤枉的人，除了回嗆和吞下去，還有沒有第三條路——一串已經有人走過的腳印？","truth":"被人所棄的活石，神立他作房角石；來到他面前的人，也被神一塊一塊砌成靈宮——「惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民」（2:9）。\n所以在地上沒有戶籍、在家裡被誤會、在職場受冤屈的人，可以為主的緣故行善，跟隨那位先為我們受苦、又用鞭傷醫治我們的主的腳蹤行。","mv":{"t":"惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民，要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。","r":"彼前2:9"},"card":["在全卷「望・石・福・火・牧」的路上，這一章是「石」。第 1 章的盼望叫人重生成了嬰孩；這一章，嬰孩喝著道的奶長大（2:2），被砌成一座殿（2:5），再被差到外邦人中間作客旅（2:11），最後跟著一串腳印走進冤屈裡（2:21）。全章拎起來就是一句話：被丟棄的人，被砌在一塊被丟棄的石頭上；所以他們在地上被誤會的時候，知道自己是誰，也知道該跟著誰走。","這一章的主詞一再是神。人把那塊石頭驗過、丟開，神卻揀選他、看他為寶貴（2:4）；神親自在錫安「安放」房角石（2:6），又親手把活石砌成靈宮（2:5，被動語態）；神把人「出黑暗入奇妙光明」地召出來（2:9），給從來沒有名分的人起了新名字（2:10）；神看見冤屈，稱它為恩典（2:20）；神是那位按公義審判的（2:23）；最後，是牧人把迷路的羊找了回來（2:25）。","2:12「因看見你們的好行為」，「看見」原文 ἐποπτεύοντες（epopteuontes），現在分詞：不是瞄一眼，是長時間地細看。這改變今天的讀法：見證不是一次漂亮的表演，也不是一場辯論贏了；是同事、鄰居、婆家在你背後看了你三年、五年——看你被冤枉時怎樣說話，看你加班費算錯時怎樣處理，看你不拿香時怎樣孝順。外人讀的第一本聖經，是你被細看的日子。","這一章照出一個被冤枉時只會兩招的我：一招是回嗆——在群組裡打一長串字，把對方的錯一條一條列出來；另一招是吞下去——表面說「沒關係」，心裡記帳，轉身在別處用一句話刺回去（2:1 的假善與毀謗）。這一章也照出一塊不肯被砌的石頭：寧可自己堅硬地躺在路邊，也不要被放進牆裡，跟別的石頭靠在一起。","「只將自己交託那按公義審判人的主」（2:23）。被冤枉的人手裡最想握住的，是一支法槌：自己判、自己罰、自己討回公道。全章最該被記住的動作，是把法槌交出去——交給一位「按公義審判」的。交託不是沉默，不是假裝沒事，也不是不能申訴；交託是不再用惡來還惡，因為最後的判決不在我手裡，而在那位自己也被冤枉過的主手裡。","這一週做一件事：挑一位曾經說你壞話、或讓你受委屈的人（同事、親戚、鄰居），在星期三以前，為他做一件具體的好事——幫他代一次班、送一份他用得著的東西、在別人背後說一句他的好話；同時每天為他禱告一句。這是 2:15 的「行善」，不是討好；如果那件事是不公義的，照樣可以把事實寫下來、走正當的管道。行善與申訴，可以同時做。若對方仍在傷害你，改成只為他禱告，不必接近他。","最終整合：一間公寓，深夜十一點。\n她從家鄉來這裡作家庭幫傭，第三年。今天傍晚，老太太找不到一只金戒指，全家人的眼睛都轉向她。\n她的房間被翻過一遍。戒指後來在老太太自己的外套口袋裡找到了。沒有人說對不起。\n她把地拖完，跪在廚房的地板上，手機裡是團契傳來的今天的經文：\n「你們蒙召原是為此；因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行」（2:21）。\n她抬起頭，看見剛拖好的地上，有一串小孩光腳踩過的腳印，一個一個，從客廳走到她跟前。\n她想，原來腳蹤是這個樣子——有人先走過，地上留著坑，後面的人只要把腳放進去。\n再往下讀：「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主」（2:23）。\n她今天沒有還口。她也知道，那不是因為她堅強，是因為前面有一位，被冤枉得比她更深。\n下一節是：「因他受的鞭傷，你們便得了醫治」（2:24）。\n她看了很久。原來那一位的背上，也有一道別人打出來的痕。原來他懂。\n她沒有把地上的腳印擦掉。她把腳，輕輕放進第一個裡面。\n天亮以後，她照樣打了勞工求助專線，問清楚自己的權益——不還口，也不吞下去；把判決交給神，把事實交給法律。\n那一串腳印，不是她的。是被棄的那一位，走在前面。"],"self":"這一章照出來的「有己」，是一個被冤枉時一定要贏的人：要大家知道我是對的，要對方付出代價，要在群組裡留下最後一句話；或者表面上忍了，心裡卻一直握著法槌，把每一筆帳都記得清清楚楚。\n有己也會躲在「自由」後面：拿『我在基督裡是自由的』遮蓋惡毒，正是 2:16 說的「不可藉著自由遮蓋惡毒」，不肯被砌進任何一群人裡；而這一章的出路，是來到那塊被丟棄的活石面前，讓神把我放進牆裡，跟著那串腳印走，把判決交還給他。","t321":{"k":"耶穌是我的榜樣：2:21--23 是全本新約最具體的榜樣——一張字帖、一串腳印，三個未完成式：被罵不還口、受害不威嚇、一直交託。耶穌自己怎樣活出來？在客西馬尼園，彼得替他拔了刀，他說「收刀入鞘吧！凡動刀的，必死在刀下」（太 26:52）——他明明可以求父差天使來，卻連別人替他拔的刀都收回去；在大祭司面前被打，他卻清楚指出不公義（約 18:23）。所以他的榜樣有兩筆：不以惡報惡，也不假裝惡不是惡。而且這位榜樣先是救主（2:24）：我描得出這張字帖，是因為那雙手先握住了我的手。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是心裡那個「敬畏」的位置——2:17 只有神得到「敬畏」，君王、老闆、家族長輩、群組裡的輿論都只得到「尊敬」；當我怕老闆、怕親戚、怕被說閒話勝過敬畏神，那個位置就被別人坐走了。第二個是審判官的位子——2:23 把判決交給「那按公義審判人的」，我就不再坐在法官席上。「為主的緣故」（2:13）是順服的理由，也是界線：主坐在寶座上，所以人間的制度被尊重，卻不被敬拜。可以自己檢查：這一週，你最怕誰的臉色？那個位置，現在是誰坐著？","p":"建立屬神的體系：2:5 說「被建造成為靈宮」，2:9 說「族類、祭司、國度、子民」——全是集合名詞，沒有一個是單數。第一，體系從「來到主面前」開始（2:4），不是從建堂、組織圖或人數開始：一群人天天一起喝那純淨的靈奶（2:2）。第二，每一塊石頭都是祭司：國度321空中團契散在台灣、馬來西亞、新加坡、中國、紐西蘭，每一個小組員都是把人帶到神面前的人，不是只坐著聽的人。第三，「親愛教中的弟兄」（2:17）是一個彼此托住的家：小組裡有人在職場受冤屈、被欠薪，大家一起禱告，也一起幫他找到正當的管道——寄居的人不是孤單的過客。"},"grp":["【一、破冰】你小時候有沒有學過寫毛筆字或描過字帖？那時候是誰教你的？你記得自己描得最好的、或描得最歪的一個字嗎？","【二、扎心】經文說：「倘若人為叫良心對得住神，就忍受冤屈的苦楚，這是可喜愛的」（2:19）。說出最近一次你被誤會或被冤枉的事——在家裡、公司、教會，還是群組裡？那一刻你的第一個反應，是回嗆、吞下去，還是別的？現在回頭看，你心裡還握著那支法槌嗎？","【三、福音】讀 2:24：「他被掛在木頭上，親身擔當了我們的罪」，「因他受的鞭傷，你們便得了醫治」。你覺得跟隨耶穌，是先學會像他，還是先被他擔當？如果那位要你描字帖的主，自己背上也有一道被冤枉打出來的傷，這會怎樣改變你看自己那件委屈的事？","【四、行動】說出這一週你要「行善堵口」的一個對象（名字或稱呼）、一件具體的事、哪一天做。如果你正在面對不公義（欠薪、霸凌、騷擾），也說出你這一週要找誰談、要查哪一個正當的管道。","【五、代禱】為三種人指名禱告：一位在不信的家族裡因為信主被誤會的人，求主給他溫柔與智慧；一位在職場受冤屈、被欠薪或被霸凌的人，求主保護他，也帶領他找到公義的幫助；一位在外地工作、寄人籬下的移工或家庭幫傭，求主讓他知道，自己在神面前是屬神的子民。"],"prac":{"main":"這一週，我來到那塊被丟棄的活石面前，讓神把我砌進他的家；被冤枉時，我跟著那串腳印走，把法槌交還給他。","items":["對神：每天早上讀 2:2 與 2:21--24 其中一段，像嬰孩愛慕奶那樣，先不急著做筆記，只是慢慢讀、慢慢嘗；然後對主說一句：「今天如果有人冤枉我，我把判決交給你。」","對自己：這七天，每當你發現自己想在群組裡回嗆、或在心裡記帳，就停三秒，記下時間和那一句你最想說的話。週末讀一遍這張單子，問自己：哪一句是說真話，哪一句是想報復？哪一件，今天就可以交託出去？","對人：挑一位曾經讓你受委屈的人，這一週為他做一件具體的好事，並且每天為他禱告一句（若對方仍在傷害你，改成只為他禱告，不必接近他）；也找一位在職場或家裡受冤屈的弟兄姊妹，打一通電話，先聽他說，不急著給道理。","對生活：在你最常被誤會的那個地方（家族聚會、辦公室、群組），這一週刻意做一件「好看」的事（2:12）：準時、誠實、主動幫忙、說話不帶刺；如果你正面對欠薪、霸凌或騷擾，這週把事實與日期寫下來，查清楚勞動申訴或求助的管道——那不違背 2:18。","對使命：在你的小組裡提一個具體安排——為組裡在職場、家庭裡受冤屈的人，固定每週一起禱告，也一起整理可以求助的資訊；並為一位還不認識主、一直在背後細看你的同事或親戚每天指名禱告，求主讓他有一天在「鑒察的日子歸榮耀給神」（2:12）。"]},"safe":["① 先講 321「建立屬神的體系」，再拿 2:4--10 的活石、靈宮、君尊的祭司當插圖印證；或把 2:5 講成建堂、擴點、人數成長的口號。","彼得的次序是先有一塊「被人所棄」的活石（2:4），再有來到他面前的人被神建造；321 只能在末端認出：屬神的體系，是一群被丟棄過的石頭被砌在一塊被丟棄的石頭上（鐵律五）。把經文當理念的插圖，會眾記得的是一套策略，不是那塊石頭。","檢驗標準：講完 2:4--10，會眾記得的第一個畫面，是一張組織藍圖，還是那位被人丟棄、被神高舉的主？","② 拿「被建造」「石頭不能挑位置」去壓人：「你不肯接這個服事，就是不肯被砌，就是有己。」","2:5 的被動語態，主詞是神，不是同工會；砌石頭的是神的手，不是排班表。用這一節逼人填滿空缺，會把一個安慰「覺得自己沒用的人」的應許，變成一份壓在疲倦的人身上的義務。","檢驗標準：一位累到想休息一季的弟兄姊妹聽完，是更知道自己在神的家裡有位置，還是更覺得不服事就不屬靈？","③ 把 2:5、2:9「信徒皆祭司」講成「所以不需要牧師、不需要長老、誰都不必聽」；或反過來說「只有按立的人才是祭司，一般信徒只要坐著聽」。","信徒皆祭司是每一個人都是把人帶到神面前的人；神也設立牧者「成全聖徒，各盡其職」（弗 4:12），第 5 章還有長老與牧長。削掉任何一邊，不是製造沒有牧養的羊群，就是製造只會旁觀的會眾（議題見 ISS02_2；全卷立場見 ISS00_5）。","檢驗標準：會眾聽完，是更願意自己為人禱告、帶人來到主面前，同時也更珍惜牧養他們的人？","④ 用 2:8「他們這樣絆跌也是預定的」宣判某一個人：「你先生一直不信，可能就是被預定絆跌的。」","彼得說的是「他們既不順從，就在道理上絆跌」（2:8）——本講義讀成神定下「不順從的人必絆跌」這個結果，不是叫我們去猜誰被預定。這樣宣判，會讓為家人禱告多年的人放棄，也讓不信的人以為門已經關了（議題見 ISS02_3；揀選與預定回指以弗所書立場二）。","檢驗標準：一位為不信的配偶禱告了十年的姊妹聽完，是更有盼望繼續禱告，還是更想放棄？","⑤ 用 2:9--10 推出取代論的反猶結論：「以色列已經被神丟棄了，猶太人是被咒詛的民族。」","彼得自己是猶太人，他把以色列的名字給了外邦信徒，說的是神的憐憫擴大了，不是神丟棄了以色列；保羅問「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）。教會歷史上這種推論曾經成為迫害猶太人的藉口（議題見 ISS02_4）。","檢驗標準：如果有一位猶太人坐在會眾席上，他聽完這一段，聽見的是神的憐憫，還是對他民族的定罪？","⑥ 用 2:2 的「奶」羞辱人：「你信主這麼多年還在喝奶，怎麼還這麼不屬靈」；或把 2:2 講成只有初信的人才需要的淺東西。","彼得的「靈奶」是屬道的奶，每一個重生的人在道面前都是才生的嬰孩；這和林前 3:2、來 5:12 用奶比喻淺，是兩種不同的用法。把 2:2 講成羞辱，會叫胃口不好的人更不敢打開聖經（議題見 ISS02_1）。","檢驗標準：一位很久讀不下聖經的人聽完，是更想回來嘗一口，還是更覺得自己落後別人太多？","⑦ 用 2:11「客旅、寄居的」叫人對社會冷漠：「反正這裡不是我們的家，城市、鄰舍、公共的事都不必管」；或拿來對新移民、移工說「你們本來就只是客人」。","寄居不是逃離，是在世界裡活出另一個國的樣子；2:12 要人「在外邦人中」品行端正，彼得的讀者沒有搬家。這一節是寫給屬神的人的身分，不是用來把弱勢的外地人推到邊緣（議題見 ISS02_5；全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是更願意在自己的城市裡做好鄰舍，還是更理直氣壯地不關心身邊的人？會眾席上的移工聽完，是覺得被接納，還是被提醒他不屬於這裡？","⑧ 用 2:13--17 在講台上作政治動員：點名政黨、政治人物或政策，叫會眾支持或反對；或把 2:13 講成「政府說甚麼都要照做」，替任何政權背書。","2:17 只有神得到「敬畏」，君王得到的是「尊敬」，和眾人一樣；當順服人與順服神衝突，彼得自己說「順從神，不順從人，是應當的」（徒 5:29），而且是溫柔地拒絕、承擔後果。國度321空中團契的弟兄姊妹散在不同的國家與制度下，講台一表態，就把一家人分成兩邊（議題見 ISS02_6；全卷立場見 ISS00_3）。","檢驗標準：不同政治立場、住在不同國家的弟兄姊妹聽完，是都更敬畏神、也更懂得尊敬人，還是有人覺得自己被教會劃到了對面？","⑨ 用 2:18「就是那乖僻的也要順服」叫被霸凌、被欠薪、被性騷擾的人忍下去：「這是你的十字架，申訴就是不順服，老闆再壞也要感恩。」","2:19 的「冤屈」原文是「不公義地」——冤屈就是冤屈，彼得沒有說乖僻的主人是對的。今天有法律、勞動申訴、離職自由的人，使用它們不違背 2:18；教會若替違法的老闆找屬靈理由，就成了欺壓的同謀（議題見 ISS02_7；全卷立場見 ISS00_3；回指雅各書立場三）。","檢驗標準：一位正被欠薪或被主管騷擾的弟兄姊妹聽完，是更知道他可以求助、教會會陪他，還是更覺得他只能閉嘴忍耐？","⑩ 用 2:18 證明「聖經支持奴隸制」；或為了護教，說「當時的奴隸制其實很溫和」，或把 2:18 原封不動套在今天的雇傭關係上，說「員工就是老闆的僕人」。","新約沒有為奴隸制背書：「若能以自由，就求自由更好」（林前 7:21）；阿尼西母「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）；搶人口列在罪的清單裡（提前 1:10）。今天的雇傭是雙方自由訂立的契約，有權利也有義務；把兩者畫上等號，會讓剝削披上屬靈的外衣。","檢驗標準：講完 2:18，會眾是更清楚福音的方向是解放、尊嚴與公義，還是聽起來像是聖經默許了人可以擁有人？","⑪ 把 2:21「跟隨他的腳蹤」講成要人去找苦吃，把受苦浪漫化；或用 2:20 對受苦的人說「你受苦一定是因為你犯了罪」。","2:20 分辨兩種苦：因犯罪受苦不是彼得要安慰的，因行善受苦才是；但這不是說每一個受苦的人都做錯了甚麼——把受冤屈的人先當成犯錯的人，是再冤屈他一次。腳印的方向是不以惡報惡、把審判交給神，不是故意走進危險（議題見 ISS02_8；全卷立場見 ISS00_2）。","檢驗標準：一位正在受苦的人聽完，是覺得被看見、被安慰，還是覺得自己又被懷疑、又被要求多受一點苦？","⑫ 用 2:24「因他受的鞭傷，你們便得了醫治」保證身體一定痊癒：「你只要宣告這一節，病就會好；沒好是因為你信心不足。」","2:24 的醫治上下文是罪：「使我們既然在罪上死，就得以在義上活」（2:24）。神當然可以醫治身體，生病的人該求醫也可以求神；但這一節不保證身體醫治，更不可以把沒有痊癒的人定罪為信心不夠（議題見 ISS02_9；回指雅各書立場四）。","檢驗標準：一位長期病痛、禱告多年沒有好轉的弟兄姊妹聽完，是更確信自己在主裡已經被醫治、被接納，還是更覺得自己信心有問題？","⑬ 把 2:23「被罵不還口」講成受害者不可以說出真相、不可以作證、不可以報警或求助：「耶穌都不還口，你還要去告人？」","主在大祭司面前被打，清楚地說「你為甚麼打我呢？」（約 18:23）——不還口是不以惡報惡，不是讓不公義消失在沉默裡；保羅也曾在被鞭打之前，提出自己羅馬公民的權利（徒 22:25）。把交託講成閉嘴，最受傷的永遠是最沒有聲音的人。","檢驗標準：一位被欺負、被侵害的人聽完，是更知道他可以說出真相、也可以不必報復，還是更覺得說出來就是不屬靈？","⑭ 用處境取消原則：「2:18--25 是寫給一世紀奴隸的，跟今天自由的人沒有關係」；或把處境硬搬：「今天的上班族就像當年的家僕，沒有選擇，只能忍。」","書信三問要走完：處境是一群沒有法律保障的家僕；原則是基督先為我們受苦、又是我們的榜樣，不以惡報惡、為主的緣故行善；今天的落點是每一個在家裡、職場被冤屈的人——他們多半有當年家僕沒有的管道，原則照守，落點隨處境（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是知道這段經文今天在自己的辦公室裡怎樣活，同時也知道自己可以使用的正當管道？","⑮ 把這一章講成彼得的勵志故事：「彼得從拔刀砍人變成寫字帖給人描，你也要像他一樣努力改變自己。」","彼得在寫到石頭時一個字都沒提自己，他說「主乃活石」；他寫「歸到」牧人那裡，是因為他自己是被找回來的羊。焦點放在彼得身上，會眾得到的是一位偶像和一份壓力，失去的是那位沒有放棄彼得的主（鐵律七）。","檢驗標準：會眾聽完，是更佩服彼得，還是更愛那位沒有放棄彼得、也沒有放棄他的主耶穌？"]},{"n":3,"t":"不以惡報惡，以辱罵還辱罵，倒要祝福","sub":"妝、福、勝","lv":"A","arc":"福","sec":[["3:1--6","只要以裡面存著長久溫柔、安靜的心為妝飾：妻子與不信的丈夫"],["3:7--7","與你一同承受生命之恩的：丈夫的那一節"],["3:8--12","不以惡報惡，以辱罵還辱罵，倒要祝福：為此蒙召"],["3:13--17","只要心裡尊主基督為聖：為義受苦的人"],["3:18--22","義的代替不義的，為要引我們到神面前：基督的得勝"]],"serm":{"pts":[["裡面的妝飾","3:1--7","「這在神面前是極寶貴的」——在不信的家裡，信主的妻子不靠話語、不因恐嚇而害怕；丈夫要按情理同住，敬重那一同承受生命之恩的"],["倒要祝福","3:8--17","「不以惡報惡，以辱罵還辱罵，倒要祝福」——被惡待的人被召來祝福；心裡尊主基督為聖的人，不必怕人的威嚇"],["引我們到神面前","3:18--22","「義的代替不義的，為要引我們到神面前」——他一次受苦、復活、宣告得勝、坐在神的右邊；一切都服從了他"]]},"q":"你在家裡，是不是那個「不太一樣」的人？年夜飯桌上，大家舉杯、上香、說笑，你夾在中間，不知道該站還是該坐；你一句福音都還沒有說，可是你一進門，空氣就變了。\n也許你在婚姻裡等了很多年，枕邊的那個人還是不信；也許你在親族的群組裡被冷嘲熱諷，在公司被人誤會，你心裡最常想的一句話是：我要怎樣才能贏回來？或者反過來：我是不是只能一直忍下去？\n這一章要問的是：一個在自己家裡被當成外人的人，心裡的寶座上坐著誰？當你被惡待的時候，你手裡準備好的，是一句反擊、一聲嘆息，還是一句祝福？","truth":"「只要心裡尊主基督為聖」（3:15）：心裡的寶座只有一個，主基督坐在那裡，人的威嚇就坐不上去；所以被惡待的人不必以惡報惡，也不必活在恐嚇裡，倒可以祝福、可以回答、可以行善。\n這不是咬牙忍出來的，是因為基督「義的代替不義的，為要引我們到神面前」（3:18）——他受過苦、復活了、坐在神的右邊，一切都已經服從了他。","mv":{"t":"只要心裡尊主基督為聖。有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。","r":"彼前3:15"},"card":["這一章在全卷「望・石・福・火・牧」的路上，是「福」：一群在家鄉成了外人的寄居者，被召來作祝福人的人。彼得從最難的地方講起——不信的家裡、婚姻裡、被辱罵的時候；再告訴他們為甚麼做得到：心裡尊主基督為聖（3:15），而那一位已經義的代替不義的，把我們引到神面前，坐在神的右邊（3:18–22）。全章三個詞：妝、福、勝——裡面的妝飾，倒要祝福，基督已經得勝。","這一章的主詞，一層一層落到神和基督身上。神看重人看不見的「心裡隱藏的人」，說那溫柔安靜的心「在神面前是極寶貴的」（3:4）；主的眼看顧義人，主的耳聽他們的祈禱（3:12）；神在挪亞的日子容忍等待，一錘一錘地等（3:20）；基督一次為罪受苦，被治死，又復活，宣告得勝，進入天堂，坐在神的右邊，叫眾天使和有權柄的都服從了他（3:22）。人能祝福，是因為神先看見、先聽見、先得勝。","3:15「只要心裡尊主基督為聖」，「尊……為聖」原文 ἁγιάσατε（hagiasate），和主禱文「願人都尊你的名為聖」（太 6:9）是同一個動詞：分別出來、單單歸給他。彼得把以賽亞的「萬軍之耶和華」換成「主基督」，地點是 ἐν ταῖς καρδίαις ὑμῶν（en tais kardiais hymōn），你們的心裡。這改變今天的讀法：尊主為聖不是一種感覺，是一個位子的安排——心裡那張椅子是分別出來的，不和任何人合坐，不和婆婆的臉色、主管的評語、自己的面子合坐。","這一章照出兩種很像屬靈的反應。一種是「贏回來」：被誤會就要澄清到最後一個字，被辱罵就要回一句更漂亮的，連在家裡傳福音也想把家人辯倒。另一種是「縮起來」：不吭聲、不反抗，心裡卻一直記帳，表面溫柔安靜，裡面早已判了對方的罪；或是誰大聲就聽誰，被恐嚇出來的服從，還以為是順服。兩種都是心裡的寶座被佔了——一個被自己的面子，一個被別人的威嚇。","「因你們是為此蒙召，好叫你們承受福氣」（3:9）。祝福不是被惡待以後的一個反應，是蒙召的本身——上一章說蒙召是跟隨他的腳蹤（2:21），這一章說蒙召是祝福。所以你不必等心裡舒服了才祝福，也不必等對方配得了才祝福；祝福是你的身分，不是他的獎品。最該被記住的動作就是這一個：在神面前，把傷你的人的名字說出來，不是求他滅亡，是求神改變他。","這一週做兩件事。第一，寫下一位曾經嘲笑、冷待或冤枉你的人的名字，七天裡每天早上為他說一句具體的祝福（他的健康、他的孩子、他的工作），不必告訴他（若那個人正在傷害你，先顧安全，這一項可以等）。第二，用三句話寫下「我為甚麼信耶穌」：以前的我、基督為我做了甚麼（3:18）、我現在心裡的盼望；這週先對一位信徒朋友說出口一次。先在神面前祝福，再在人面前預備好回答。","最終整合：年三十的晚上，廚房門口。\n她嫁進這個家十二年了。每年這一晚，客廳的供桌點起香，一家人輪流上前；她就站在廚房門口，手裡拿著抹布，不進，也不退。\n第一年，婆婆在親戚面前說過一句：娶進門的，連祖宗都不拜。那一晚她躲在廚房裡哭。\n後來她不哭了。只是每年都站在門口——在這個家裡，門口好像就是她的位置。\n今年，她在手機上讀到一節：「因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。」（3:18）\n她停在那個「引」字上。\n原來有一位，也被推到門外過。他在城門外受苦，站在不義的人該站的地方，為的是回過頭來，牽起站在門口的人，一路領進去——不是領進客廳，是領到神面前。\n她忽然明白：這個客廳，她不必贏回來。在這裡她是外人；在神面前，她不是。\n她把抹布放下，泡了一壺茶，先端到公公面前：「爸，新年快樂。」又給婆婆倒了一杯：「媽，辛苦了。」\n婆婆沒有說謝謝。她也不再需要了。\n那一晚，她還是站在門口；小組的兩位姊妹答應那天晚上陪她回去，她不是一個人站在那裡。可是她知道，有一隻手已經牽著她，站在一扇更大的門裡面；而她站在這個家的門口，不是被擋在外面，是在那裡替這一家人祝福。"],"self":"這一章照出來的「有己」，是一個要贏的我：被冤枉了一定要討回公道到最後一個字，被冷落了就用冷淡還回去，連在家裡傳福音，也是想證明「我對，你錯」。它看起來是在爭真理，其實是在爭寶座。\n有己也會偽裝成溫柔：不吵不鬧，心裡卻在記帳、等對方出錯；或是怕得要命，誰的臉色都要討好，誰大聲就聽誰。要贏的我和怕輸的我，都是心裡的寶座還沒有交給主基督。","t321":{"k":"耶穌是我的榜樣：這一章的每一個動作，耶穌都先做過。他在自己家裡也被當成外人——「因為連他的弟兄說這話，是因為不信他」（約 7:5）；他沒有用言語逼家人信，後來他的母親和弟兄卻在樓上同心禱告的人中間（徒 1:14）。他在十字架上不以惡報惡，倒為釘他的人祝福：「父啊，赦免他們；因為他們所做的，他們不曉得」（路 23:34）。他也不是一味沉默：被人無理打臉的時候，他平靜地問「你為甚麼打我呢」（約 18:23）。而且他不只是我們學祝福的榜樣——他是那位義的代替不義的，先替我們擔了咒詛，好叫我們承受福氣。","g":"讓耶穌作王：這一章要人讓出來的，是心裡那張被別人佔走的椅子。彼得把以賽亞說的「萬軍之耶和華」換成「主基督」，心裡的寶座只有一位。這一章點出三個常被佔走的位置：一是「別人的威嚇」坐的位置——婆婆的臉色、主管的評語、親族的眼光；二是「我的報復」坐的位置——那個要親手替自己伸冤的審判官；三是「我要改變他」坐的位置——妻子想用言語把丈夫說服，丈夫想用權力讓妻子聽話。基督坐穩了，人的威嚇坐不上去，我的報復也坐不上去；我只管行善、祝福、預備好回答，結果交給那坐在神右邊的。可以自己檢查：這一週，誰的一句話最能讓你睡不著？","p":"建立屬神的體系：3:8 說「你們都要同心，彼此體恤，相愛如弟兄，存慈憐謙卑的心」——祝福人的力量不是一個人咬牙撐出來的，是一群人彼此體恤養出來的。第一，教會要作配偶未信者的家：為家人還沒信主的弟兄姊妹設一個小組，讓他們不必一個人在家裡撐；也讓教會的弟兄姊妹成為那位未信配偶願意認識的朋友（920：你的 2 可能就是枕邊人）。第二，教會要有保護人的制度：同工認得家暴與控制的徵兆，知道通報與求助的管道，願意陪人去社福單位或警局，絕不勸人回到危險裡。第三，一起操練「常作準備」：國度321空中團契散在各國的弟兄姊妹，可以在小組裡彼此練習用三句話說出心中的盼望，讓每一個在異鄉、在不信家族裡的人，面對那個問題時都不是孤單一個人。"},"grp":["【一、破冰】過年過節回到大家族裡，你通常坐在哪一桌、哪一個位置？有沒有一個場合，讓你覺得自己像「外人」？那是甚麼時候、在誰家、發生了甚麼事？","【二、扎心】經文說：「不要怕人的威嚇，也不要驚慌；只要心裡尊主基督為聖。」（3:14–15）說出這一陣子最能讓你心裡發慌的一個人或一句話——是誰、在甚麼場合說的？如果誠實地看，此刻坐在你心裡寶座上的，是主基督，還是那個人的臉色？","【三、福音】讀 3:18：基督「義的代替不義的，為要引我們到神面前」。你在哪一件事上，一直覺得自己是站在門外的人——因為過去的失敗、因為家裡的眼光、因為覺得自己不配？聽到「引我們到神面前」，你想到的是誰牽著你的手？這句話對你今天的意思是甚麼？","【四、行動】說出一位這一陣子讓你難受的人（可以只說稱呼），以及這一週你要在哪一天、用哪一句話為他祝福禱告；再說出一位家人還沒有信主的弟兄姊妹，這一週你要在哪一天、用甚麼方式（一通電話、一頓飯、一張卡片）去陪他。","【五、代禱】為三種人指名禱告：一位配偶或家人還沒有信主、在家裡孤單持守的弟兄姊妹，求主堅固他，也求主得著他的家人；一位正活在恐嚇、暴力或控制裡的人，求主保守他和孩子的安全，給他求助的勇氣和出路，也求我們成為他可以信任的人；一位因為信仰在職場或親族裡被誤會、被冤枉的人，求主讓他心裡尊主基督為聖，不以惡報惡。"],"prac":{"main":"這一週，讓主基督坐在我心裡的寶座上；被惡待的時候不以惡報惡，倒要祝福，並預備好說出我心中的盼望。","items":["對神：每天早上讀 3:15 上半句，用一句話禱告：「主基督，今天請你坐在我心裡的寶座上；誰的話讓我害怕，我就把他交給你。」每天晚上讀 3:18，為今天讓你覺得自己是外人的那個人感謝主——基督也為他受了苦。","對自己：這七天，每次你發現自己在心裡和人吵架、準備反擊，或一直重播被冤枉的那一幕，就在手機記事本記下時間和那個人的稱呼。週末讀一遍，問自己：這幾次，我心裡的寶座上坐的是誰？哪一次，我其實可以把審判交給那按公義審判人的主？","對人：選一位曾經嘲笑或冷待你信仰的家人、親戚或同事，連續七天每天為他說一句具體的祝福，並找一個自然的機會為他做一件小小的善事。已婚的弟兄：這週找一個晚上問妻子一句「最近有甚麼事讓你累、讓你怕？」然後只聽、不辯解——這就是「按情理」（3:7）的第一步；已婚的姊妹也可以這樣問丈夫。","對生活：給自己的通訊軟體定一條規矩——被激怒時，任何回覆都等到隔天早上禱告以後再送出；需要澄清的事實，整理成清楚、平靜的文字，走正式的管道。如果你或你身邊的人正在家裡受到暴力、恐嚇或控制，這一週就把當地的家暴保護專線存進手機（例如台灣是 113），並告訴一位可信任的人；安全永遠先於一切。","對使命：把你寫下的三句話——以前的我、基督為我做了甚麼、我現在心裡的盼望——這一週對一位信徒朋友說一次，再求主給你一個機會，以溫柔、敬畏的心，對一位還不認識主的人說出來。也為你的「2」每天指名禱告，也許就是坐在你身邊吃飯的那一位。"]},"safe":["① 用 3:1--6 對受暴力、受控制的妻子說：「你要順服，回去用品行感化他，神會改變他。」","彼得在 3:6 說「不因恐嚇而害怕」，順服的理由與界線都是「為主的緣故」（2:13）；被恐嚇出來的服從不是 3:1 的順服。把順服講成留在危險裡，等於把一封安慰受苦者的信，講成叫受苦者閉嘴的信；人身安全受威脅時，先保護生命、依法求助、通報（全卷立場見 ISS00_3）。","檢驗標準：一位正在受家暴的姊妹聽完，是更知道她可以求助、可以離開危險，還是更覺得她應該留下、應該檢討自己？","② 只講 3:1--6，不講 3:7；或把 3:7 一句帶過，把整段家規講成只對妻子的單行道，甚至說「丈夫是頭，妻子無條件服從」。","3:7 用的是同一個「同樣」，丈夫不是家規的例外：要按情理（原文是知識）和妻子同住、要敬重她，否則「便叫你們的禱告沒有阻礙」的反面就落在他身上。只講妻子的六節，是把彼得的話講成一半。","檢驗標準：你講完這一段，會眾裡的丈夫們，是更知道自己回家要怎樣敬重妻子，還是只帶走了「妻子要順服」？","③ 用 3:6「撒拉聽從亞伯拉罕，稱他為主」要求妻子稱丈夫為主、凡事無條件聽從，或拿撒拉來證明妻子沒有說話的份。","撒拉那一聲「我主」是她在帳棚裡心裡暗笑時說的（創 18:12）；神也曾對亞伯拉罕說「凡撒拉對你說的話，你都該聽從」（創 21:12）。彼得挑撒拉，是看她「仰賴神」（3:5）、「行善，不因恐嚇而害怕」（3:6），不是看她的稱呼。","檢驗標準：會眾聽完，記得的是一位仰賴神、不被恐嚇的女人，還是一套稱呼丈夫的禮節？","④ 把 3:3--4 講成衣著規條：「姊妹不可化妝、不可戴首飾、不可燙頭髮」，或拿穿著打扮判斷一位女性的屬靈程度。","3:3 的第三樣是「穿美衣」，原文只是穿上衣裳——若是禁令，連衣服都不能穿；對比是外面與裡面，不是禁止外面（這使我們想起提前 2:9 同一種修辭）。把妝飾講成規條，會讓女性在教會裡被眼光審查，也讓人以為不打扮就等於有溫柔安靜的心。","檢驗標準：一位愛打扮的姊妹和一位從不打扮的姊妹一起聽完，有沒有任何一位覺得自己的屬靈被衣著論斷了？","⑤ 把 3:7「軟弱的器皿」講成女性在智力、情緒或靈性上比較差，「所以女人不適合作決定、不適合思考神學」。","原文是「較軟弱的」器皿——丈夫也是器皿，男女都是瓦器；多數解經者理解為當時在體力、法律與經濟上的弱勢。同一節說她是「與你一同承受生命之恩的」，強的一方要把尊榮分給她，不是利用這個落差。","檢驗標準：教會裡的姊妹聽完 3:7，是覺得自己在神面前被高看了，還是覺得自己被說成次等的人？","⑥ 用 3:1「被感化過來」給信主的妻子（或丈夫）壓力或保證：「你的配偶到現在還不信，是因為你的品行不夠好」，或「你只要夠溫柔，他一定會信」。","經文說的是「也可以」，不是保證；人信不信主是聖靈的工作與他自己的回應，不是配偶的成績單。這樣講會讓在不信家庭裡持守多年的弟兄姊妹，多背一份不屬於他的罪咎。","檢驗標準：一位為未信的配偶禱告了二十年的姊妹聽完，是得了安慰與力量，還是覺得又被責備了一次？","⑦ 用 3:9「倒要祝福」叫被欺負的人不申訴、不報警、不追究：「你要祝福他，就不要再提了，不然就是以惡報惡。」","祝福拒絕的是仇恨與報復，不是公義；申訴、求助、報警，是把事情交給神所設立的秩序（羅 13:4），和自己伸冤是兩回事。把祝福講成沉默，會讓加害的人更安全、受害的人更孤單（議題見 ISS03_6）。","檢驗標準：一位在職場或家裡被欺壓的人聽完，是更知道他可以不懷恨、同時依法保護自己，還是覺得一申訴就不屬靈了？","⑧ 用 3:14、3:17 把受苦浪漫化或歸罪：叫人主動去找苦、說受苦越多越屬靈；或反過來對受苦的人說「一定是你哪裡做錯了」。","彼得分辨得很清楚：「因行善受苦，總強如因行惡受苦」（3:17）——受苦本身不是美德，「因甚麼」才是；為義受苦的人有福，但他可以憂愁、可以求助，「暫時憂愁」（1:6）是被允許的（全卷立場見 ISS00_2）。","檢驗標準：一位正在受苦的人聽完，是覺得自己被看見、被安慰，還是覺得要再多受一點苦，或是自己活該？","⑨ 用 3:14「不要怕……也不要驚慌」對焦慮、恐慌、憂鬱的人說：「你會驚慌，就是不信；真正信主的人不會怕。」","彼得沒有罵寄居的人怕，他給他們一個寶座——懼怕是被更大的敬畏取代的，不是被羞辱壓下去的；心理與情緒的疾病需要醫療與陪伴，「卸給神」（5:7）與看醫生、心理諮商並行。","檢驗標準：一位正在吃抗焦慮藥物的弟兄姊妹聽完，是覺得可以帶著懼怕來到主面前，還是覺得自己的病是信心不足的證據？","⑩ 把 3:15「常作準備……回答」講成辯論比賽：教會眾人去把家人、同事駁倒；或反過來說「信仰不用講理由，信就對了」。","人家問的是「你們心中盼望的緣由」，不是要你贏；回答的態度是「以溫柔、敬畏的心」（3:15），溫柔對人，敬畏對神。把人駁倒卻讓他更遠離基督，不是這一節；拒絕回答，也辜負了那個真心發問的人（議題見 ISS03_7）。","檢驗標準：會眾聽完，是更想把對方辯倒，還是更準備好用溫柔的話說出自己為甚麼有盼望？","⑪ 用 3:19 教死後第二次機會，在喪禮上對家屬說「他在陰間還可以聽福音」；或反過來，宣判一位未信主就過世的人已經沉淪。","3:19 有五種讀法，本講義的主要讀法是復活升天的基督向墮落天使宣告得勝；經文沒有說人死後還有機會，也沒有給我們權柄斷定任何亡者的去處。神是公義的，也是滿有憐憫的；我們把所愛的人交在他手裡（全卷立場見 ISS00_4）。","檢驗標準：一位父親沒信主就過世的弟兄聽完，是被陪伴著把父親交在神手裡，還是被一句經文沒有說的話安慰、或被一句判決擊倒？","⑫ 用 3:19--20 與使徒信經「降在陰間」在講台上描繪陰間地圖：陰間分幾層、基督在那裡走了哪幾站、見了哪些人。","經文說得很少，彼得自己也只寫了兩節；我們說得比經文多，就是把自己的想像放進神的嘴裡。3:19 最重要的不是「誰在監獄裡」，是「誰是得勝者」——「都服從了他」（3:22）。","檢驗標準：會眾聽完這一段，記得的是一張陰間的地圖，還是那位已經坐在神右邊的得勝者？","⑬ 用 3:21 說「受洗就得救」，好像儀式自動生效；或說「沒受洗不能得救」，叫未受洗的初信者懷疑自己的得救；或在講台上嘲諷嬰兒洗或信徒浸的教會。","彼得自己說，救人的是「耶穌基督復活」，這洗禮「本不在乎除掉肉體的污穢」（3:21）；洗禮是人向神的回應，是主吩咐的，我們就順服；不輕看洗禮，也不在宗派之間裁判（全卷立場見 ISS00_4）。","檢驗標準：一位正在上受洗班的慕道友和一位小時候受洗、如今冷淡的人聽完，是都更清楚救他的是復活的基督，還是一個以為水是保險、一個以為自己還沒得救？","⑭ 用 3:20 的方舟與八個人講出定論：「方舟就是我們教會，離開這個教會就沒有救恩」，或「八個人預表八福」。","挪亞的水與洗禮是彼得自己作的連結（ἀντίτυπον），可以講滿；方舟等於某一間教會、八個人預表甚麼，彼得沒有作，最多只能說「這使我們想起」。把方舟講成某一個組織，正是屬靈轄制最常用的一句話。","檢驗標準：會眾聽完，是更認識那位在洪水中拯救人的神，還是更害怕離開某一個團體？","⑮ 在互補派與平等派之間當裁判：「真正順服聖經的家庭一定是……」「還在講丈夫帶領的教會都是落伍的」。","兩派都是一同承受生命之恩的弟兄姊妹，兩派也都必須同意：3:1--6 與 3:7 同樣是命令，順服不等於留在危險裡。本講義不裁判，講台也不替會眾的家庭選邊（全卷立場見 ISS00_3）。","檢驗標準：持不同看法的兩對夫妻一起聽完，是都更想彼此敬重，還是有一對覺得自己被講台判輸了？","⑯ 用處境取消原則：「這是一世紀父權社會的家規，跟今天無關」；或把處境硬搬：把一世紀不信丈夫家裡的生存處境，逐字變成今天基督徒婚姻的規條。","書信三問要走完：處境是不信的丈夫、隨夫拜神的家規與被毀謗的寄居者；原則是「為主的緣故」、不以惡報惡、心裡尊主基督為聖；今天的落點是在不信家族裡、在婚姻裡、在職場裡被誤會的人（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是更清楚彼得當時面對甚麼、今天這原則落在自己家裡的哪一件事，還是只帶走一條規矩、或一句「那是古代的事」？"]},{"n":4,"t":"有火煉的試驗臨到你們，不要以為奇怪","sub":"兵、管、火","lv":"A","arc":"火","sec":[["4:1--6","你們也當將這樣的心志作為兵器：時候已經夠了"],["4:7--11","作神百般恩賜的好管家：萬物的結局近了"],["4:12--19","有火煉的試驗臨到你們，不要以為奇怪：與基督一同受苦"]],"serm":{"pts":[["心志作為兵器","4:1--6","「你們也當將這樣的心志作為兵器」——不再同奔放蕩無度的路，被鄰舍以為怪；把基督受苦的心志穿上"],["百般恩賜的好管家","4:7--11","「作神百般恩賜的好管家」——結局近了，所以彼此切實相愛、互相款待；試煉有多少種顏色，恩賜就有多少種顏色"],["不要以為奇怪","4:12--19","「有火煉的試驗臨到你們，不要以為奇怪」——火是真的熱，卻不是意外；榮耀的靈常住在受辱罵的人身上"]]},"q":"你有沒有過這種時候：大家都往同一個方向走，只有你停下來——群組裡大家都轉傳那個笑話，你沒有轉；續攤的車都開往同一間 KTV，你說要回家；全辦公室都在報告上簽了名，你遲遲不簽。\n第二天，沒有人罵你，只是群組安靜了，午餐沒人約你了，你成了「那個奇怪的人」。你開始懷疑：是不是我太固執？是不是神沒有在看？\n這一章要問的是：當你因為跟隨主而被當成怪人，你手裡握著的，是一肚子委屈，還是一份要分出去的恩賜？火燒過來的時候，你把自己交給誰？","truth":"萬物的結局近了，火也真的在燒；可是在一切之先，神對他寄居的子民說：「最要緊的是彼此切實相愛，因為愛能遮掩許多的罪」（4:8）——被外面以為怪的一群人，靠的不是一起抱怨，是一起相愛。\n這愛不揭已經悔改的瘡疤，卻從不替侵害遮羞；它拉得很緊，因為那位先在肉身受苦的基督，如今把他的心志、他的恩賜、他的力量都放在我們中間，叫神在凡事上因耶穌基督得榮耀（4:1、4:11）。","mv":{"t":"最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。","r":"彼前4:8"},"card":["這一章是全卷「望・石・福・火・牧」的「火」。1:7 的火還只是比喻，到 4:12 真的臨到了；1:11「基督受苦難，後來得榮耀」那條公式，到 4:13 變成了我們的。全章三步：把基督受苦的心志穿上（兵），在一群人裡作百般恩賜的好管家（管），在火裡不以為奇怪，把自己交給信實的造化之主（火）。一句話：被當成怪人的寄居者，不是孤單地熬，是一群人和基督一同走過火。","這一章的神，一直在場。他是那位「將要審判活人死人的主」（4:5），所以被毀謗的人不必自己算帳；他把百般的恩賜分給「各人」，沒有漏掉一個；他「所賜的力量」（4:11）像一位慷慨的供應者，服事的人用多少，他給多少；他的靈「常住」在受辱罵的人身上；審判從他自己的家起首，是先潔淨自己的家；最後，他是「信實的造化之主」（4:19）——造你的那一位，接得住你交出去的靈魂。","4:4「同奔那放蕩無度的路」，「同奔」原文 συντρεχόντων（syntrechontōn），一起跑；「路」原文其實是 ἀνάχυσιν（anachysin），水漫出來的洪流，新約只此一次。這改變今天的讀法：被以為怪，不是因為你突然停下來；是因為大家都在被同一股洪流沖著跑，而你沒有跟著跑。你站著不動，在急流裡看起來就像逆行。你不奇怪；是水太急。","這一章照出兩個我。一個太想被接納：怕被說怪，就跟著笑那個不該笑的笑話、喝那一杯不想喝的酒，把「不從人的情慾」（4:2）悄悄折了一半。另一個太想當義人：因為自己不去續攤，就看不起去的人，因為自己受了一點冷落，就覺得全世界都在逼迫我，甚至開始管別人家的閒事。一個是怕火，一個是拿火照別人；兩個都還沒有把自己交出去。","「所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主」（4:19）。原文這是同一個句子：「交與」是主要動詞，「在行善之中」（ἐν ἀγαθοποιΐᾳ，新約只此一次）是交託的姿勢。雙手向上，把靈魂交給造你的那一位；雙手也向外，第二天照樣把報告寫準、把飯煮好、把那位冷落你的同事當人看。全章最該記住的動作，就是這兩隻手同時打開。","這一週，照 4:9 打開一次門。想一位在你身邊「寄居」的人——剛到這城市的留學生、在工廠宿舍的移工、剛信主被家裡冷落的新朋友、小組裡最近變安靜的那一位。在主日之前，請他吃一頓飯，或在線上陪他聊半小時。不用準備得很漂亮，只有一個要求：不發怨言。如果累了，就跟主說累，不要跟客人說。","最終整合：凌晨兩點，異鄉一間工廠的宿舍。\n他是被調來夜班的。三個月前，主管要他在驗收報告上把一個數字改小一點，他沒有改。\n從那天起，同事叫他「聖人」。不是稱讚。\n茶水間的燈管有一支壞了，一閃一閃。他泡了一杯即溶咖啡，打開手機，空中團契的禱告群組裡，幾個時區外的一位姊妹剛貼上一節經文：\n「你們若為基督的名受辱罵，便是有福的；因為神榮耀的靈常住在你們身上」（4:14）。\n他沒有覺得有福。他只覺得累。他打了三個字：「我好累。」\n沒過多久，另一個國家的一位老弟兄回了：「我也醒著。我陪你禱告。」\n他把手機放下。燈還是一閃一閃，咖啡還是很難喝。\n可是他想起「常住」那個字，原文是歇息。神的靈不是路過，是在這裡坐下來了——坐在這間閃著燈的茶水間，坐在一個被叫作「聖人」的人旁邊。\n他沒有變得比較勇敢。他只是把杯子洗乾淨，回到產線，把下一份報告照實寫完。\n外面的人看見一個怪人。天上看見的，是榮耀在一個累了的人身上，安安靜靜地歇著。"],"self":"這一章照出來的「有己」，第一種是想被接納的我：寧可跟著洪流跑，也不要被當成怪人；表面上隨和，其實是把「別人怎麼看我」放在神的旨意前面。\n第二種是想當主角的我：受了一點委屈就自封殉道者，把自己的固執說成為主受苦，把插手別人的事說成關心；用恩賜的時候，在意的是人有沒有看見我，不是神有沒有因耶穌基督得榮耀。兩種我，都還沒有把靈魂交出去。","t321":{"k":"耶穌是我的榜樣：耶穌自己就是那個「被以為怪」的人。他和稅吏罪人同桌吃飯，人說他「是貪食好酒的人，是稅吏和罪人的朋友」（太 11:19）——他坐在那些桌子旁，卻從來沒有跟著洪流跑；他靠近人，卻不被沖走。這正是 4:3--4 最難的那一步：拒絕偶像，不拒絕人。他也是那位款待人的主：復活以後，他在岸上生了炭火，烤好魚和餅，說「你們來吃早飯」（約 21:12）——款待一群剛剛失敗過的門徒。4:1 說「基督既在肉身受苦」，他受了苦，卻沒有關上門。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是「主人」的位置——4:10 說我們是「管家」，恩賜、時間、家、錢都不是自己的；管家不能把主人的東西當成自己的招牌，也不能藏起來不用。第二個是「審判官」的位置——4:5 說毀謗你的人「必在那將要審判活人死人的主面前交帳」，帳有人在算，你不必自己追討，也不必在心裡判別人。可以自己檢查：這一週，你在哪一件事上還在當主人？在哪一個人身上還在當審判官？","p":"建立屬神的體系：4:7--11 是一群寄居者的日常運作表——禱告、相愛、款待、各人照恩賜服事，說話的照神的聖言，服事的靠神的力量。第一，教會要讓「各人」都有位置：不只講台上的人，會煮飯的、會聽的、會修電腦的、會開車的，都要被看見、被安排。第二，教會要有接待寄居者的門：新來的留學生、移工、剛信主被家裡冷落的人，第一次來就有人坐在他旁邊。第三，4:17 審判從神的家起首——教會先潔淨自己的家：有清楚的保護與通報程序，侵害發生時不遮掩，這樣的愛才遮得住該遮的。國度321空中團契散在各國，線上的彼此代禱，就是不同時區的人輪流醒著。"},"grp":["【一、破冰】你曾經在甚麼場合，因為一個小小的不一樣（不喝酒、不吃某樣東西、早退、不跟著笑），被別人覺得「你很奇怪」？那是在哪裡、和誰？你當時怎麼回應？","【二、扎心】經文說：「他們在這些事上，見你們不與他們同奔那放蕩無度的路，就以為怪，毀謗你們」（4:4）。說出你生活裡正在推著你跑的一股「洪流」——在公司、家族群組、同學圈、或你自己的手機裡。這一週你在哪一個場合，跟著跑了？又在哪一個場合，被當成怪人？","【三、福音】讀 4:13--14：受辱罵的人「是與基督一同受苦」，而且「神榮耀的靈常住在你們身上」。你被誤會、被冷落的那一刻，你以為神在哪裡？如果那一刻神的靈正歇在你身上，你今天想對那個時候的自己說甚麼？","【四、行動】照 4:9--10，說出這一週你要款待的一個人（名字或身分），和你要用來服事他的一樣東西（一頓飯、一通電話、一次接送、一個你會的技能）；說出星期幾、在哪裡。也說出一件你這一週要「照實」做的事——一份報告、一筆帳、一句話，哪怕會被當成怪人。","【五、代禱】為三種人指名禱告：一位正在職場或家裡因信主被冷落、被誤會的人，求主讓他知道榮耀的靈歇在他身上；一位正在病床上或在長期的苦裡、哭不出來也說不出口的人，求主讓我們會陪他坐著；一位剛來到你們中間、在這城市還是陌生人的人，求主讓他在你們中間找到一張桌子。"],"prac":{"main":"這一週，我不跟著洪流跑；我把自己交給信實的造化之主，也把手上的恩賜分出去，作神百般恩賜的好管家（4:10）。","items":["對神：每天早上讀 4:10「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家」，對主說：「今天我手上的時間、力氣、能力都是你的，求你讓我知道要分給誰。」晚上讀 4:19，把今天受的委屈與不明白，一件一件交給他。","對自己：寫下三樣你有、卻很少拿出來的東西（例如：會做菜、會聽人說話、會整理表格、懂兩種語言、有一台車）。旁邊再寫：這一樣，我平常拿來做甚麼？是拿來讓人看見我，還是拿來服事人？如果分不出自己有甚麼恩賜，就問一位認識你的弟兄姊妹。","對人：從那三樣裡選一樣，這一週分給一個具體的人——替新來的人煮一頓飯、陪一位病人去回診、替一位長輩把手機上的聚會連結設好、替一位移工朋友看懂一份文件。做的時候不發怨言，做完了不要求被記得。","對生活：找出這一週你最可能「跟著跑」的一個場合（一場聚餐、一個群組、一份要簽名的報告），事先決定你要怎麼做，並想好一句溫和的話來回應；也決定你要在那個場合怎樣「一心為善」——比別人早到、多做一點、把人當人看。","對使命：在你的小組或團契裡，提出一個讓「各人」都有位置的安排——例如一張恩賜分工表、一個新朋友接待輪值；並每天為一位因為你信主而覺得你「變奇怪了」的家人或同事指名禱告，求主讓他有一天在你身上看見的不是怪，是基督。"]},"safe":["① 用 4:1「在肉身受過苦的，就已經與罪斷絕了」對病人或受苦的人說：「神用這個病來對付你的罪，苦夠了你就不會再犯了。」","受苦本身沒有洗淨的能力，苦難也可能使人苦毒；使人與罪斷絕的是那位先受苦的基督（3:18）。說「你受苦是因為你有罪」，是把病床變成審判台（紅線六；全卷立場見 ISS00_2；議題見 ISS04_1）。","檢驗標準：一位正在化療的弟兄姊妹聽完，是更知道基督與他同在，還是開始翻找自己哪裡做錯了？","② 講 4:3 的「醉酒、荒宴、群飲，並可惡拜偶像的事」時，羞辱未信的父母與家族：「拜拜的人都是拜鬼」；或把清單拿來論斷會喝一杯的弟兄。","彼得說的是拜偶像的宴席與醉酒狂歡，對象是信徒自己「往日」的生活；拒絕偶像不等於拒絕家人，不醉酒也不等於可以論斷別人的良心（羅 14:21；議題見 ISS04_2）。","檢驗標準：一位家裡只有他一個人信主的年輕人聽完，是更知道怎樣在除夕夜溫柔地不拿香，還是更想跟家人劃清界線？","③ 在喪禮或追思禮拜上用 4:6「就是死人也曾有福音傳給他們」安慰家屬：「他雖然沒信主，死後還會再聽到福音。」","本講義採「福音曾傳給現在已死的人——在他們活著的時候」，不教死後第二次機會；用這一節給家屬一個經文沒有給的盼望，等於把福音的迫切性拿掉（紅線四；全卷立場見 ISS00_4；議題見 ISS04_3）。","檢驗標準：講完以後，你有沒有說出經文沒有說的事？還活著的人，是更知道今天就要回應福音嗎？","④ 反過來，在講台上或私下斷定某一位過世的人的去處，尤其是未信主就過世的家人：「他已經沉淪了」或「他一定上天堂了」。","我們不知道一個人最後一刻與神之間發生了甚麼；神是公義的，也是滿有憐憫的（回指帖撒羅尼迦前書立場三）。斷定亡者，會讓剛失去家人的人在哀傷之上多背一層恐懼或假安慰（紅線四；全卷立場見 ISS00_4）。","檢驗標準：一位父親剛過世、父親到最後都沒有信主的弟兄聽完，是被陪伴著哀哭，還是被宣判了一次？","⑤ 用 4:7「萬物的結局近了」算日子、轉傳末日影片，或把今天的戰爭、疫情、地震對號入座成「最後的徵兆」。","「那日子，那時辰，沒有人知道」（太 24:36）；彼得從「近了」推出的不是恐慌、囤貨或辭職，是「謹慎自守，警醒禱告」，接著是相愛、款待、服事（回指帖撒羅尼迦前書立場二；議題見 ISS04_4）。","檢驗標準：會眾聽完，是更焦慮地看新聞，還是更清醒地去愛身邊的人？","⑥ 用 4:8「愛能遮掩許多的罪」要求受害者安靜、私下了結，或替犯錯的同工、長老、牧者掩蓋性侵、家暴、傷害孩子、挪用奉獻。","4:8 的遮掩是不揭已經悔改的瘡疤、不一再翻舊帳，不是隱瞞侵害、不讓受害者說話、不讓該負責的人負責；保護受害者、通報、依法處理本身就是愛，「不喜歡不義，只喜歡真理」（林前 13:6）（紅線七；全卷立場見 ISS00_5；議題見 ISS04_5）。","檢驗標準：一位在教會裡受過傷害的人聽完，是更敢說出來，還是更確定說出來就是不夠愛？","⑦ 用 4:11「要按著神的聖言講」把講台的權柄擴大成「我講的就是神的話，不准有人提問」；或把恩賜分等級：講道的屬靈，煮飯、打掃、看顧孩子的次一等。","4:11 是給講道的人的約束，不是給他的特權：他要按神的話講，不是按自己的意見講；4:10 說「各人」都是管家，眼不能對手說「我用不著你」（林前 12:21）（紅線七；全卷立場見 ISS00_5；議題見 ISS04_6）。","檢驗標準：講完以後，一位在廚房服事了二十年的姊妹，是更知道自己是好管家，還是更覺得自己只是幫忙的？會眾還敢不敢舉手提問？","⑧ 把 4:13「倒要歡喜」講成一張面具：「真正屬靈的人在苦難中也笑得出來」「你一直哭，就是信心不夠。」","同一位彼得在 1:6 說「暫時憂愁」是被允許的；歡喜是一個方向，不是一張面具，受苦的人可以哭、可以訴苦、可以看醫生、找輔導；耶穌在拉撒路的墳前也哭了（約 11:35）（紅線六；全卷立場見 ISS00_2；議題見 ISS04_7）。","檢驗標準：一位正在哭的人聽完，是覺得可以帶著眼淚來到神面前，還是覺得要先把眼淚擦乾才算屬靈？","⑨ 把 4:12--14 浪漫化成「火越大越蒙福」，鼓勵人去找苦、故意挑釁、拒絕合理的保護，好證明自己是在「為主受苦」。","彼得說「不要以為奇怪」，是說苦難不是意外，不是說要去找它；火是真的熱，煉金的是神，不是我們自己點火。把受苦講成功勞，會讓人輕看可以避開的傷害，也讓受苦的人以為苦不夠多就不夠屬靈（紅線六；全卷立場見 ISS00_2）。","檢驗標準：會眾聽完，是更安心地面對臨到的苦，還是開始覺得自己的生活「太順」，要去找一點苦來受？","⑩ 不分辨 4:15--16 的四種苦：把自己犯錯、失職、固執、得罪人的後果包裝成「為主受苦」；或反過來，一聽見有人受苦就預設「他一定做錯了甚麼」。","彼得分辨因犯罪受苦、因行善受苦、為義受苦、為基督的名受苦，還有百般的試煉；分辨是為了誠實面對自己，不是為了審問受苦的人（紅線六；全卷立場見 ISS00_2）。","檢驗標準：你講完這一段，會眾是更誠實地檢討自己，還是更容易替自己辯護、更容易懷疑別人？","⑪ 用 4:15「好管閒事」叫人不要關心、不要提醒、不要舉報：「別人家的事不要管」，連家暴、虐兒、職場霸凌也不管；或反過來，把插手、打探、在群組裡轉傳別人的私事，說成「屬靈的關心」。","ἀλλοτριεπίσκοπος 是越界去監督別人的事；照顧與插手的分別，在於有沒有被託付、是不是為那人的好、有沒有尊重他的界線。有人正受傷害時伸手求助，從來不是管閒事（議題見 ISS04_8）。","檢驗標準：會眾聽完，是更懂得尊重人的界線，同時也更敢為正在受傷害的人出聲？","⑫ 用 4:17「審判要從神的家起首」把某一間教會的醜聞、某一位牧者的跌倒、某一個宗派的分裂，宣布成「這就是神的審判」，甚至幸災樂禍。","彼得說「先從我們起首」，他把自己算在裡面；這是對受苦的人的安慰與自省，不是對別人的判決書。醜聞要面對、要處理、要保護受害者，但宣判是神的位置，不是我們的（議題見 ISS04_9）。","檢驗標準：你講完 4:17，會眾是更謙卑地檢查自己的家，還是更熱衷地指著別人的家？","⑬ 用 4:18「義人僅僅得救」恐嚇會眾：「連義人都差一點進不去，你憑甚麼確定自己得救？」","4:18 引的是箴 11:31 的七十士譯本，和合本箴言作「義人在世尚且受報」——兩個版本都在說這條路要穿過火，不是說救恩靠運氣；救恩的根基是基督的寶血（1:18--19），神「必要親自成全」（5:10）。","檢驗標準：一位正在苦難裡、本來就懷疑神是不是不要他了的人聽完，是更確定神不放手，還是更害怕？","⑭ 用 4:19「將自己靈魂交與那信實的造化之主」叫正在受侵害、受暴力、被欠薪的人「交給神就好」，不要求助、不要報警、不要離開。","交託是把靈魂交給神，不是把身體留在危險裡；受苦不等於忍受侵害，交託神與就醫、心理諮商、依法求助、離開危險並行（紅線六；全卷立場見 ISS00_2、ISS00_3）。","檢驗標準：一位正在被傷害的人聽完，是更知道神與他同在、也更知道可以向誰求助，還是更覺得應該默默忍下去？","⑮ 用處境取消原則：「4:3 是一世紀同業公會的拜偶像宴席，跟今天的應酬、家族祭祀無關」；或反過來把處境硬搬：把每一場聚餐、每一個尾牙、每一間餐廳都講成偶像的宴席。","書信三問要走完：處境是一群信主後沒有搬家、卻在家鄉成了外人的外邦信徒；原則是基督受苦後得榮耀，所以不再同奔洪流，也不離開人群；今天的落點要具體分辨，哪裡是敬拜偶像，哪裡只是一張飯桌（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是知道在自己的處境裡怎樣分辨，還是只帶走一句「一律不行」或「都沒關係」？"]},{"n":5,"t":"你們要將一切的憂慮卸給神，因為他顧念你們","sub":"牧、卸、立","lv":"A","arc":"牧","sec":[["5:1--4","務要牧養在你們中間神的群羊：牧長顯現的時候"],["5:5--7","你們要將一切的憂慮卸給神，因為他顧念你們：以謙卑束腰"],["5:8--11","你們要用堅固的信心抵擋他：吼叫的獅子與成全的神"],["5:12--14","你們務要在這恩上站立得住：巴比倫的教會"]],"serm":{"pts":[["作群羊的榜樣","5:1--4","「乃是作群羊的榜樣」——同作長老的人勸長老：不勉強、不貪財、不轄制；牧者頭上還有一位牧長"],["以謙卑束腰","5:5--7","「你們要將一切的憂慮卸給神，因為他顧念你們」——謙卑是一條服事人的圍裙，也是一個卸下重擔的動作"],["在這恩上站立得住","5:8--14","「必要親自成全你們，堅固你們，賜力量給你們」——吼叫的獅子之後兩節，就是神親自的成全；寄居的人站在恩典上"]]},"q":"你身邊有沒有這樣一個人——也許就是你自己：家裡出了事，第一個接到電話的是你；教會缺人，第一個被想到的是你；大家都睡了，還在想明天怎麼辦的，也是你。\n別人說你很負責、很能幹、很屬靈。可是你心裡知道，你已經很久沒有真正睡好；你不敢放手，因為你覺得一放手，事情就會塌，而且沒有人會接住。\n這一章要問的是：你扛著的那一包，真的是神交給你扛的嗎？還是你一直站在一個只有神才站得住的位置上，卻把這叫作忠心？","truth":"「神阻擋驕傲的人，賜恩給謙卑的人」（5:5）——所以謙卑有兩個動作：以謙卑束腰，彎下來服事人；把一切的憂慮卸給神，讓神作神。自卑的方式，就是卸下（5:6–7）。\n我們卸得下，不是因為我們不再憂慮，而是因為他顧念我們；暫受苦難之後，他必親自成全；所以我們才能在這恩上站立得住（5:7、10、12）。","mv":{"t":"你們要將一切的憂慮卸給神，因為他顧念你們。","r":"彼前5:7"},"card":["全卷「望・石・福・火・牧」走到最後一篇：牧。火煉的試驗之後，彼得先對帶頭的人說話：牧養神的群羊，不轄制，作榜樣，頭上還有牧長；再對全家說：以謙卑束腰，把一切的憂慮卸給神；然後是吼叫的獅子，和兩節之後神親自的成全。一封講了五章「你們要」的信，在這一章換成了「他必要」。","這一章的主詞，到最後全是神。神有自己的群羊——羊是「神的群羊」（5:2），不是牧者的；神差來牧長，到了時候要顯現，親手把不衰殘的冠冕給忠心的人；神與驕傲的人列陣對抗，卻把恩典給謙卑的人；神伸出大能的手，把人放低，也到了時候把人升高；神把人放在心上；神親自成全、堅固、賜力量、立根基。","5:7「一切的憂慮」原文 πᾶσαν τὴν μέριμναν（pasan tēn merimnan），「憂慮」是單數——不是一張一條條的清單，是捆成一包的整個重量。這改變今天的讀法：你不必先把憂慮分類，判斷哪些夠屬靈、哪些太瑣碎、哪些才配拿到神面前；房租、檢查報告、孩子的叛逆、同工的一句話，整包一起拋上去。他收的是整包。","這一章照出兩種抓住不放的手。一隻手抓住權力：在家裡、在同工會、在小組裡，習慣說了算，不喜歡被問、被提醒，把「我比較有經驗」當成不必聽的理由。另一隻手抓住重擔：甚麼都自己扛，睡不著也不肯交出去，好像沒有我就不行。兩隻手看起來不一樣，底下卻是同一件事——不肯讓神作神。","全章最該被記住的，是 5:6–7 在原文是同一個句子：「你們要自卑，服在神大能的手下」，怎樣自卑？就是「將一切的憂慮卸給神」。翻轉在這裡：我們以為謙卑是把自己壓低、多扛一點、少說一點；彼得說，謙卑是承認自己扛不動，把那一包放到另一位身上。不肯卸下，原來也是一種驕傲。","這一週做兩件事。第一，拿一張紙，把你扛著的那一包寫下來——不分大小，全部寫上；然後在紙的最上面寫上 5:7 的「因為他顧念你們」，把「你們」換成自己的名字，在主面前一條一條讀出來，最後說：「這一包，交給你。」第二，從那張紙上挑一件，這一週真的交出去：請一位家人、同工或弟兄姊妹接手，或預約一位醫生、輔導。卸給神，常常就從讓別人幫你開始。","最終整合：異鄉，工廠宿舍，上下鋪，晚上十一點。\n他睡覺的時候，頭底下枕著一個背包。\n裡面有護照、薪資單、寄錢回家的收據，還有媽媽的藥單。來這裡三年，他沒有一晚把背包放下過——怕被偷，也怕一放下，自己就撐不住。\n那一晚，手機裡的線上小組讀到一句：「你們要將一切的憂慮卸給神，因為他顧念你們」（5:7）。\n他愣了一下。三年來，他一直以為在這個城市裡，沒有人把他放在心上。\n原來有。\n他坐起來，把背包從頭底下拿出來，放在床邊的地上。裡面的東西一樣都沒有少，憂慮也還在；只是不再壓在他身上，而是交給了一位顧念他的。\n讀經的人接著讀：「等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們」（5:10）。\n暫受。親自。他在這裡沒有一塊自己的地，可是有一位要親自給他打根基。\n最後一句是：「你們務要在這恩上站立得住」（5:12）。\n第二天早上六點，他照常站起來去上工。背包還是背著，可是他知道，自己站著的地方，不是那個背包。\n先是他顧念，再是他成全，最後才是我們站立。\n寄居的人沒有地，卻有一個可以站的地方——一位把他放在心上的神。"],"self":"這一章照出來的「有己」，有兩張臉。一張是抓住權力的臉：在頭上作主，習慣別人聽我的，把位分當成不必被問的理由；另一張是抓住重擔的臉：甚麼都要自己扛，把失眠叫作負責，把不肯求助叫作堅強。\n兩張臉底下是同一句話：「這件事沒有我不行。」那正是想代替神的聲音。這一章不是叫我們更用力地謙卑，而是叫我們鬆手——把圍裙繫上，把重擔卸下，讓那位顧念我們的神作神。","t321":{"k":"耶穌是我的榜樣：這一章的兩個動作，耶穌都先做了。他是牧長，卻來「乃是要服事人」（可 10:45）；他有一切的權柄，卻從來沒有在人頭上作主，連最後一夜都蹲在門徒腳前。他也卸下重擔：客西馬尼園裡，他說「我心裡甚是憂傷，幾乎要死」（太 26:38），沒有假裝不憂傷；然後把那份憂傷整包交給父。十字架上最後一句是「父啊，我將我的靈魂交在你手裡」（路 23:46）。憂傷是真的，交託也是真的——這就是 5:7 最早的樣子。我們不是學一個從來不憂慮的人，是跟著一位憂傷到極點、仍然把自己交給父的人走。","g":"讓耶穌作王：這一章要人讓出來的，是兩個位置。第一個是「在頭上作主」的位置——5:3 的「轄制」，原文就是在別人頭上當主人；牧者頭上還有牧長，家長頭上還有天父，長輩頭上還有那位審判活人死人的主。第二個是「沒有我不行」的位置——把一切都扛在自己肩上，等於坐在一張只有神才坐得住的椅子上。讓耶穌作王，是兩張椅子都讓出來：不再管著別人的人生，也不再管著所有的結果。可以自己檢查：這一週，你最放不下的是哪一個人、哪一件事？那個位置，現在是誰坐著？","p":"建立屬神的體系：5:1 彼得稱自己是「同作長老的」——使徒也把自己放在團隊裡；這是 235 的 5。第一，教會的領導要能被問：同工會留時間給年輕人提問，長老會的財務定期向會眾公開，重大決定說明理由，因為「也不是因為貪財」（5:2）不是一句口號，是一套透明的制度。第二，要有屬靈的父母兒女：5:13「我兒子馬可」——一個曾半途離開的年輕人，被帶成可用的人；教會要有人願意陪年輕人走第二次。第三，要讓重擔有地方放：小組裡設代禱同伴，照顧者有人輪替，國度321空中團契散在各國的弟兄姊妹彼此記念，正像 5:9 說的，在世上的眾弟兄一同經歷，也一同站立。"},"grp":["【一、破冰】你身上最常背的那個包裡，一定會有的三樣東西是甚麼？有沒有一樣東西，你明明很少用到，卻一直捨不得拿出來？","【二、扎心】經文說：「你們要將一切的憂慮卸給神，因為他顧念你們」（5:7）。說出一件你現在扛著、卻一直沒有交出去的事——家人的病、工作的去留、孩子、錢、教會的一件事。你不肯放下，底下是怕甚麼？是怕沒人接住，還是覺得「沒有我不行」？","【三、福音】5:7 的「顧念」，是「他把你放在心上」。這一章最後不是「你們要」，是「他必要」：「必要親自成全你們，堅固你們，賜力量給你們」（5:10）。你能不能說出一次，神在你沒有力氣的時候，親自把你補起來、扶起來的經歷？那一次是誰陪著你？","【四、行動】說出這一週你要交出去的一件事：交給誰（一位家人、同工、醫生、輔導或小組的同伴）、哪一天、用甚麼方式開口。如果你是帶領人，也說出這一週你要主動聽哪一位年輕同工或組員的意見——甚麼時間、在哪裡。","【五、代禱】為三種人指名禱告：一位在家裡或教會甚麼都扛、已經很久沒睡好的人，求主讓他卸得下來，也讓我們看見可以替他接手甚麼；一位正在焦慮、憂鬱中的弟兄姊妹，求主親自顧念他，也帶領他找到合適的醫生與輔導；一間在受逼迫之地的教會或一位在異鄉寄居的肢體，求主親自成全、堅固他們。"],"prac":{"main":"這一週，因為他顧念我，我把扛著的那一包卸給神；把圍裙繫上，去服事身邊的人。","items":["對神：每天早上讀 5:7 一次，用一句話說出今天最重的那件事，然後說：「這一包，交給你。」如果中午又撿回來了，就再拋一次；每天晚上讀 5:10，記得明天不是靠你自己撐，是他要親自成全。","對自己：這七天，每當你發現自己在說「沒有我不行」——不肯請假、不肯讓人幫、不肯讓別人做決定——就記下時間與那件事。週末讀一遍，問自己：哪一件是神交給我的本分？哪一件，其實是我坐在神的椅子上？","對人：找一位比你年輕的人（孩子、同工、組員），這一週約他喝一杯飲料，專門聽他的想法和問題，不急著糾正；也找一位比你年長的人，請教他一件你正在面對的事。長幼都繫上圍裙，彼此順服。","對生活：從你扛著的那一包裡挑一件，這一週具體交出去：把一項家務或服事請人輪替，或預約一次身體檢查、心理諮商；睡前十五分鐘把手機放到房間外面，讓自己真的躺下來。","對使命：這一週為一間在受逼迫之地的教會、或一位在異鄉寄居的弟兄姊妹每天指名禱告（5:9）；並在你的小組或團契裡提一個具體安排：設立代禱同伴，或讓一位照顧家人的肢體每週有一段時間有人替手。"]},"safe":["① 把 5:5 講成 321 的插圖：一開口就是「321 說謙卑是復興的鑰匙，經文證明了這一點」，跳過 5:1–4 的長老與牧長、5:6–7 的卸下，只留下一句口號。","彼得的謙卑有自己的形狀：先是把奴僕的圍裙繫上（ἐγκομβώσασθε），再是把憂慮卸給神，兩個動作在原文連成一句；經文自己講完，321 才在末端認出它。先放理念再找經文，會把一封寫給受苦寄居者的信，講成一場理念宣導（鐵律五、決策戊）。","檢驗標準：你講完 5:5，會眾記得的是那條圍裙與那一包卸下的憂慮，還是只記得一句 321 的標語？","② 用 5:5「你們年幼的，也要順服年長的」叫年輕人閉嘴：「年輕人不要有意見」「長輩說的你照做就是」，在同工會或家裡用這一節結案。","同一節下半句說「就是你們眾人也都要以謙卑束腰，彼此順服」（5:5）——年長的也要繫上圍裙；謙卑是長幼雙方的圍裙，不是只綁在年輕人身上的繩子。用它壓下提問，會把年輕人推出教會，也讓年長者失去被提醒的機會（議題見 ISS05_4）。","檢驗標準：一位在同工會上提出不同意見的年輕同工聽完，是更知道怎樣帶著尊重說話，還是覺得自己再也不該開口？","③ 把長老的權柄講成絕對服從：「長老是你的屬靈遮蓋，不聽長老就是悖逆神」，或用屬靈的話控制會友的婚姻、工作、財務與交友。","5:3 說「也不是轄制所託付你們的，乃是作群羊的榜樣」，轄制就是在人頭上作主，主耶穌說在你們中間不可這樣；長老頭上還有牧長（5:4）。把屬靈權柄講成控制，正是屬靈虐待的開始；遇到這樣的處境，會友可以提問、求助，也可以離開（全卷立場見 ISS00_5）。","檢驗標準：一位曾被前一間教會的領袖羞辱、控制過的弟兄姊妹聽完，是更能辨認甚麼不是牧養，還是更覺得自己應該回去順服？","④ 把 5:7「卸給神」講成「基督徒不該焦慮」：「你還在憂慮，就是沒有交託」「焦慮的人信心有問題」「卸給神就不用看醫生、不用吃藥」。","彼得說「你們要將一切的憂慮卸給神」，前提是承認人有憂慮；他在 1:6 也承認讀者「暫時憂愁」。把卸給神講成禁令，焦慮的人會多背一層罪疚；卸給神與看醫生、心理諮商並行，神的顧念常常就經由醫生與輔導臨到（紅線六；議題見 ISS05_5）。","檢驗標準：一位正在服藥、每週看輔導的弟兄姊妹聽完，是更敢把憂慮帶到神面前，也繼續接受治療，還是覺得自己的焦慮證明信心不夠？","⑤ 反過來，把「卸給神」講成不必負責：「交給神就好，帳單不用付、病不用看、工作不用找」，把逃避叫作交託。","5:6–7 的卸下是一種謙卑，不是一種撒手；卸下的是「我必須掌控結果」的重擔，不是本分。彼得在同一章叫人「務要謹守，警醒」（5:8）；交託的人照樣做該做的事，只是不再一個人扛結果。","檢驗標準：會眾聽完，是更安心地做好本分、把結果交給神，還是更理直氣壯地不去面對該處理的事？","⑥ 用 5:8 的獅子恐嚇人：「你不來聚會、不奉獻，魔鬼就要吞吃你」，或把一切病痛、失業、家庭衝突都說成「魔鬼在攻擊你」。","彼得寫獅子，是要人清醒，不是要人害怕；這一節後面兩節就是「必要親自成全你們」（5:10）。凡事都歸給魔鬼，會讓人不再省察自己，也不再就醫求助；用魔鬼嚇人，會讓受苦的人以為神離他很遠（屬靈爭戰回指以弗所書立場四；議題見 ISS05_6）。","檢驗標準：會眾聽完 5:8，是更清醒、更想彼此靠近，還是更緊張、更害怕？他們記得的是獅子，還是成全的神？","⑦ 把 5:13 的「巴比倫」對號入座：「巴比倫就是今天的某某國家、某某城市、某某宗派」，或借這一節在講台上作政治評論、表態支持或反對某個政府、政黨。","本講義採巴比倫是羅馬的代稱，並陳另兩說；彼得在信裡叫人「尊敬君王」（2:17），也在巴比倫城裡問安——那裡有一間同蒙揀選的教會。把巴比倫套在別人身上，會讓住在那裡的弟兄姊妹被看成敵人，也讓講台變成政治動員（紅線三；全卷立場見 ISS00_7）。","檢驗標準：一位住在被別人稱為「巴比倫」的國家裡、天天為那城求平安的弟兄姊妹聽完，是被接納，還是被定罪？","⑧ 用 5:9「在世上的眾弟兄也是經歷這樣的苦難」比較苦難：「別人在受逼迫，你這點苦算甚麼，不要抱怨」。","彼得提起眾弟兄，是要人知道自己不是一個人在受苦，不是要把誰的苦比下去；1:6 的憂愁是被允許的。拿別人更大的苦堵住一個人的眼淚，只會叫他更孤單（紅線六；全卷立場見 ISS00_2）。","檢驗標準：一位正在流淚的弟兄姊妹聽完 5:9，是覺得有一大群人和他站在一起，還是覺得自己連難過都不配？","⑨ 把 5:10「必要親自成全」講成時間保證或成功神學：「只要你信，苦難下個月就會結束」「成全就是病得醫治、生意興旺」。","5:10 的「暫受苦難」是和永遠的榮耀相比的「暫」，不是一個日期；成全是神親自修補、堅固、立根基，常常發生在苦難裡面，不一定是苦難的結束。給人一個神沒有給的時間表，等到了期限還沒好，他會以為神失信（成功神學回指希伯來書立場四）。","檢驗標準：一位病了很多年、還沒有好轉的弟兄姊妹聽完，是更相信神正在親自成全他，還是覺得自己被排除在應許之外？","⑩ 把 5:6「你們要自卑」講成自我貶低或忍受欺壓：「謙卑就是別人怎樣對你都不要說話」「你被欺負是神要你學謙卑」。","5:6 是「服在神大能的手下」，不是服在施暴者、控制者的手下；自卑是一個位置，不是一種自我否定。把謙卑講成忍受侵害，會讓受害的人留在危險裡，也讓加害的人得到屬靈的掩護（受苦不等於忍受侵害，全卷立場見 ISS00_2、ISS00_3）。","檢驗標準：一位在家裡或職場長期被羞辱、被欺壓的人聽完，是更知道神不要他留在侵害裡、可以求助，還是更覺得自己應該閉嘴忍耐？","⑪ 把 5:2「也不是因為貪財」講成牧者不該領薪、不該談待遇；或反過來，用「屬靈的事不必算那麼清楚」拒絕公開教會財務。","彼得禁止的是貪財的動機，不是供養；「叫傳福音的靠著福音養生」（林前 9:14）。叫牧者餓著服事是另一種不公義；拒絕透明則讓貪財有藏身之處。兩種講法都違背了 5:2 的原意（議題見 ISS05_3）。","檢驗標準：會眾聽完，是更願意合理地供養牧者，也更期待教會財務清楚透明，還是只記得「牧師不可以談錢」？","⑫ 講彼得的生平講成英雄故事：「彼得從跌倒到成為長老，你也要像他一樣奮發向上」，讓會眾更佩服彼得。","5:1 彼得稱自己「同作長老的」，5:4 把所有的長老放在牧長底下；他寫下「堅固」「站立」，是因為主為他祈求、托住了他。把焦點放在彼得的努力，會把一封指向主的信講成勵志故事；不是彼得變好了，是主沒有放棄他（鐵律七）。","檢驗標準：會眾聽完，是更佩服彼得，還是更認識那位在炭火旁找回他、今天也顧念我們的主？","⑬ 用處境取消原則，或把處境硬搬：「這是寫給一世紀小亞細亞教會長老的，跟一般會友無關」；或把 5:1–4 直接套成今天某一種教會體制的定論。","書信三問要走完：處境是一群在家鄉成了外人、被誤會被毀謗的寄居者；原則是牧者不轄制、人人以謙卑束腰、把憂慮卸給顧念我們的神；今天落在家庭、職場、教會的同工會與長老會。彼得規定的是心態，沒有規定體制（全卷立場見 ISS00_1、ISS00_5）。","檢驗標準：會眾聽完，能不能說出這段經文在他自己的家、職場、小組裡要改變甚麼，而不是只記得一種教會體制的名字？","⑭ 用 5:13 的馬可給人貼標籤：「你就像馬可，半途而廢」「離開過服事的人不能再被信任」；或反過來要求每個人都要有一個「屬靈父親」才能被認可。","5:13 講的是一個曾半途離開的年輕人，被彼得稱為「我兒子」——重點是接納與第二次機會，不是記錄誰失敗過；屬靈的父母兒女是陪伴，不是隸屬與控制。用馬可羞辱人，或用「屬靈父親」綁住人，都違背了這一節的溫度（紅線七）。","檢驗標準：一位曾經離開服事、正在猶豫要不要回來的弟兄姊妹聽完，是更想回來，還是更怕被人記得他的過去？"]}],"txt":{"1":["耶穌基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的，","就是照父神的先見被揀選，藉著聖靈得成聖潔，以致順服耶穌基督，又蒙他血所灑的人。願恩惠、平安多多地加給你們。","願頌讚歸與我們主耶穌基督的父神！他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望，","可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。","你們這因信蒙神能力保守的人，必能得著所預備、到末世要顯現的救恩。","因此，你們是大有喜樂；但如今，在百般的試煉中暫時憂愁，","叫你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴，可以在耶穌基督顯現的時候得著稱讚、榮耀、尊貴。","你們雖然沒有見過他，卻是愛他；如今雖不得看見，卻因信他就有說不出來、滿有榮光的大喜樂；","並且得著你們信心的果效，就是靈魂的救恩。","論到這救恩，那預先說你們要得恩典的眾先知早已詳細地尋求考察，","就是考察在他們心裡基督的靈，預先證明基督受苦難，後來得榮耀，是指著甚麼時候，並怎樣的時候。","他們得了啟示，知道他們所傳講的一切事，不是為自己，乃是為你們。那靠著從天上差來的聖靈傳福音給你們的人，現在將這些事報給你們；天使也願意詳細察看這些事。","所以要約束你們的心，謹慎自守，專心盼望耶穌基督顯現的時候所帶來給你們的恩。","你們既作順命的兒女，就不要效法從前蒙昧無知的時候那放縱私慾的樣子。","那召你們的既是聖潔，你們在一切所行的事上也要聖潔。","因為經上記著說：「你們要聖潔，因為我是聖潔的。」","你們既稱那不偏待人、按各人行為審判人的主為父，就當存敬畏的心度你們在世寄居的日子，","知道你們得贖，脫去你們祖宗所傳流虛妄的行為，不是憑著能壞的金銀等物，","乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血。","基督在創世以前是預先被神知道的，卻在這末世才為你們顯現。","你們也因著他，信那叫他從死裡復活、又給他榮耀的神，叫你們的信心和盼望都在於神。","你們既因順從真理，潔淨了自己的心，以致愛弟兄沒有虛假，就當從心裡彼此切實相愛。","你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉著神活潑常存的道。","因為凡有血氣的，盡都如草；他的美榮都像草上的花。草必枯乾，花必凋謝；","惟有主的道是永存的。所傳給你們的福音就是這道。"],"2":["所以，你們既除去一切的惡毒、詭詐，並假善、嫉妒，和一切毀謗的話，","就要愛慕那純淨的靈奶，像才生的嬰孩愛慕奶一樣，叫你們因此漸長，以致得救。","你們若嘗過主恩的滋味，就必如此。","主乃活石，固然是被人所棄的，卻是被神所揀選、所寶貴的。","你們來到主面前，也就像活石，被建造成為靈宮，作聖潔的祭司，藉著耶穌基督奉獻神所悅納的靈祭。","因為經上說：看哪，我把所揀選、所寶貴的房角石安放在錫安；信靠他的人必不至於羞愧。","所以，他在你們信的人就為寶貴，在那不信的人有話說：匠人所棄的石頭已作了房角的頭塊石頭。","又說：作了絆腳的石頭，跌人的磐石。他們既不順從，就在道理上絆跌；他們這樣絆跌也是預定的。","惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民，要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。","你們從前算不得子民，現在卻作了神的子民；從前未曾蒙憐恤，現在卻蒙了憐恤。","親愛的弟兄啊，你們是客旅，是寄居的。我勸你們要禁戒肉體的私慾；這私慾是與靈魂爭戰的。","你們在外邦人中，應當品行端正，叫那些毀謗你們是作惡的，因看見你們的好行為，便在鑒察的日子歸榮耀給神。","你們為主的緣故，要順服人的一切制度，或是在上的君王，","或是君王所派罰惡賞善的臣宰。","因為神的旨意原是要你們行善，可以堵住那糊塗無知人的口。","你們雖是自由的，卻不可藉著自由遮蓋惡毒，總要作神的僕人。","務要尊敬眾人，親愛教中的弟兄，敬畏神，尊敬君王。","你們作僕人的，凡事要存敬畏的心順服主人；不但順服那善良溫和的，就是那乖僻的也要順服。","倘若人為叫良心對得住神，就忍受冤屈的苦楚，這是可喜愛的。","你們若因犯罪受責打，能忍耐，有甚麼可誇的呢？但你們若因行善受苦，能忍耐，這在神看是可喜愛的。","你們蒙召原是為此；因基督也為你們受過苦，給你們留下榜樣，叫你們跟隨他的腳蹤行。","他並沒有犯罪，口裡也沒有詭詐。","他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。","他被掛在木頭上，親身擔當了我們的罪，使我們既然在罪上死，就得以在義上活。因他受的鞭傷，你們便得了醫治。","你們從前好像迷路的羊，如今卻歸到你們靈魂的牧人監督了。"],"3":["你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來；","這正是因看見你們有貞潔的品行和敬畏的心。","你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾，","只要以裡面存著長久溫柔、安靜的心為妝飾；這在神面前是極寶貴的。","因為古時仰賴神的聖潔婦人正是以此為妝飾，順服自己的丈夫，","就如撒拉聽從亞伯拉罕，稱他為主。你們若行善，不因恐嚇而害怕，便是撒拉的女兒了。","你們作丈夫的也要按情理和妻子同住；因她比你軟弱，與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙。","總而言之，你們都要同心，彼此體恤，相愛如弟兄，存慈憐謙卑的心。","不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。","因為經上說：人若愛生命，願享美福，須要禁止舌頭不出惡言，嘴唇不說詭詐的話；","也要離惡行善，尋求和睦，一心追趕。","因為，主的眼看顧義人；主的耳聽他們的祈禱。惟有行惡的人，主向他們變臉。","你們若是熱心行善，有誰害你們呢？","你們就是為義受苦，也是有福的。不要怕人的威嚇，也不要驚慌；","只要心裡尊主基督為聖。有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人；","存著無虧的良心，叫你們在何事上被毀謗，就在何事上可以叫那誣賴你們在基督裡有好品行的人自覺羞愧。","神的旨意若是叫你們因行善受苦，總強如因行惡受苦。","因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。按著肉體說，他被治死；按著靈性說，他復活了。","他藉這靈曾去傳道給那些在監獄裡的靈聽，","就是那從前在挪亞預備方舟、神容忍等待的時候，不信從的人。當時進入方舟，藉著水得救的不多，只有八個人。","這水所表明的洗禮，現在藉著耶穌基督復活也拯救你們；這洗禮本不在乎除掉肉體的污穢，只求在神面前有無虧的良心。","耶穌已經進入天堂，在神的右邊；眾天使和有權柄的，並有能力的，都服從了他。"],"4":["基督既在肉身受苦，你們也當將這樣的心志作為兵器，因為在肉身受過苦的，就已經與罪斷絕了。","你們存這樣的心，從今以後就可以不從人的情慾，只從神的旨意在世度餘下的光陰。","因為往日隨從外邦人的心意行邪淫、惡慾、醉酒、荒宴、群飲，並可惡拜偶像的事，時候已經夠了。","他們在這些事上，見你們不與他們同奔那放蕩無度的路，就以為怪，毀謗你們。","他們必在那將要審判活人死人的主面前交帳。","為此，就是死人也曾有福音傳給他們，要叫他們的肉體按著人受審判，他們的靈性卻靠神活著。","萬物的結局近了。所以，你們要謹慎自守，警醒禱告。","最要緊的是彼此切實相愛，因為愛能遮掩許多的罪。","你們要互相款待，不發怨言。","各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。","若有講道的，要按著神的聖言講；若有服事人的，要按著神所賜的力量服事，叫神在凡事上因耶穌基督得榮耀。原來榮耀、權能都是他的，直到永永遠遠。阿們！","親愛的弟兄啊，有火煉的試驗臨到你們，不要以為奇怪（似乎是遭遇非常的事），","倒要歡喜；因為你們是與基督一同受苦，使你們在他榮耀顯現的時候，也可以歡喜快樂。","你們若為基督的名受辱罵，便是有福的；因為神榮耀的靈常住在你們身上。","你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦。","若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給神。","因為時候到了，審判要從神的家起首。若是先從我們起首，那不信從神福音的人將有何等的結局呢？","若是義人僅僅得救，那不虔敬和犯罪的人將有何地可站呢？","所以，那照神旨意受苦的人要一心為善，將自己靈魂交與那信實的造化之主。"],"5":["我這作長老、作基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人：","務要牧養在你們中間神的群羊，按著神旨意照管他們；不是出於勉強，乃是出於甘心；也不是因為貪財，乃是出於樂意；","也不是轄制所託付你們的，乃是作群羊的榜樣。","到了牧長顯現的時候，你們必得那永不衰殘的榮耀冠冕。","你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服；因為神阻擋驕傲的人，賜恩給謙卑的人。","所以，你們要自卑，服在神大能的手下，到了時候，他必叫你們升高。","你們要將一切的憂慮卸給神，因為他顧念你們。","務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。","你們要用堅固的信心抵擋他，因為知道你們在世上的眾弟兄也是經歷這樣的苦難。","那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀，等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們。","願權能歸給他，直到永永遠遠。阿們！","我略略地寫了這信，託我所看為忠心的兄弟西拉轉交你們，勸勉你們，又證明這恩是神的真恩。你們務要在這恩上站立得住。","在巴比倫與你們同蒙揀選的教會問你們安。我兒子馬可也問你們安。","你們要用愛心彼此親嘴問安。願平安歸與你們凡在基督裡的人！"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,</p><p lang=\"grc\">κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.</p>","lit":"<p>彼得，耶穌基督的使徒，給被揀選的、分散在本都、加拉太、加帕多家、亞細亞和庇推尼的寄居者，</p><p>照著父神的先見，在靈的成聖之中，歸於順服和耶穌基督之血的灑；願恩典與平安向你們被加多。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ</td><td>Petros apostolos Iēsou Christou</td><td>彼得，耶穌基督的使徒</td><td>只有名字與差遣者，沒有任何自誇的頭銜</td></tr><tr><td>ἐκλεκτοῖς παρεπιδήμοις</td><td>eklektois parepidēmois</td><td>被揀選的寄居者</td><td>全卷第一個身分字：在天上被選中，在地上是外人</td></tr><tr><td>διασπορᾶς</td><td>diasporas</td><td>分散的</td><td>雅 1:1 同字；原指散居各地的猶太人</td></tr><tr><td>κατὰ πρόγνωσιν θεοῦ πατρός</td><td>kata prognōsin theou patros</td><td>照父神的先見</td><td>揀選的源頭</td></tr><tr><td>ἐν ἁγιασμῷ πνεύματος</td><td>en hagiasmō pneumatos</td><td>在靈的成聖裡</td><td>揀選落實的方法</td></tr><tr><td>εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος</td><td>eis hypakoēn kai rhantismon haimatos</td><td>以致順服，又被血灑</td><td>揀選的目標；順服追蹤第一站</td></tr><tr><td>πληθυνθείη</td><td>plēthyntheiē</td><td>願它被加多</td><td>祈願語氣，新約罕見</td></tr></table>","gram":"<p><strong>開頭只有三個字的自我介紹：Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ（Petros apostolos Iēsou Christou）。</strong>沒有「眾使徒之首」，也沒有「在磐石上」的頭銜；ἀπόστολος（apostolos） 是「被差遣的人」，重心在後面那個屬格：他是耶穌基督的人。</p><p>收信人是一個形容詞加一個名詞：ἐκλεκτοῖς παρεπιδήμοις（eklektois parepidēmois）。παρεπιδήμοις（parepidēmois） 是暫住在別人地方的外地人，2:11 把它和 παροίκους（paroikous） 並列，和合本譯「客旅」與「寄居的」。διασπορᾶς（diasporas） 是「分散」，雅 1:1 寫給 ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ（tais dōdeka phylais tais en tē diaspora），原是散居外邦的猶太人。彼得把這個猶太人的字，用在一群多數是外邦人的信徒身上（1:14、18）。五個地名 Πόντου（Pontou） 起、Βιθυνίας（Bithynias） 止，在今天土耳其北部繞一圈，很可能就是送信人走的路線。</p><blockquote><p>1:2 是三個介系詞片語，各帶出三一神的一位：κατὰ πρόγνωσιν θεοῦ πατρός（源頭是父）、ἐν ἁγιασμῷ πνεύματος（方法是聖靈；和合本以小字補「聖」）、εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ（目標是耶穌基督）。三個片語多數學者認為都修飾 ἐκλεκτοῖς（eklektois）：揀選有源頭、有方法、有方向。問安的動詞 πληθυνθείη（plēthyntheiē） 是祈願語氣，在新約已經少見：不是「你們有」，是「願它多起來」。</p></blockquote>","exp":"<p>〔雅〕雅 1:1--1</p><p>「耶穌基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的」（1:1）。寫信的人，就是福音書裡那個衝動、跌倒、痛哭過的漁夫。可是他只說自己是「使徒」，是被差遣的。這不是彼得變好了，是主沒有放棄他：那位在海邊重新呼召他的主，現在藉著他寫信給一群在異鄉站不穩的人。</p><p>收信人的身分有兩面。「被揀選的」是他們在神那裡的位置；「寄居的」是他們在地上的處境。多數收信人是外邦信徒，信主之後沒有搬家，房子、街坊、生意都還在原地，卻成了家鄉裡的外人：不再一起拜偶像，不再同奔「那放蕩無度的路」，鄰舍「就以為怪，毀謗你們」（4:4）。<strong>他們不是被趕出去的難民，是留在原地卻不再屬於那裡的人。</strong></p><p>今天的寄居者很容易認出來：在不信的家族裡不拿香的孫子，在應酬桌上不灌酒的業務，在公司裡不肯做假帳的會計，也是散在各國、在異鄉每天上線聚會的弟兄姊妹。彼得給他們的第一句話不是「忍耐」，是「你們被揀選了」。先告訴你是誰，再告訴你怎樣走。</p><p>1:2 把三一神一次擺出來。父的先見是源頭；揀選照甚麼而行，各家讀法不同，議題頁陳列，這裡不爭論。聖靈使人「得成聖潔」，是揀選落在生活裡的方法。目標是「順服耶穌基督，又蒙他血所灑」。這使我們想起出 24 章立約：百姓先說「耶和華所吩咐的，我們都必遵行」（出 24:7），摩西才把血灑在他們身上。彼得把兩件事綁在一起：順服不是換取那血的代價，那血也不讓人從此不必順服。這一章是「望・石・福・火・牧」的第一步：寄居的人還沒聽見任何命令，先聽見自己是誰。</p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν διʼ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,</p>","lit":"<p>當受頌讚的是神，就是我們主耶穌基督的父，他照著他那大的憐憫，重生了我們，進入活的盼望，藉著耶穌基督從死人中的復活，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εὐλογητὸς ὁ θεὸς</td><td>Eulogētos ho theos</td><td>當受頌讚的是神</td><td>沒有動詞；整個長句的主幹</td></tr><tr><td>κατὰ τὸ πολὺ αὐτοῦ ἔλεος</td><td>kata to poly autou eleos</td><td>照他那大的憐憫</td><td>重生的源頭</td></tr><tr><td>ἀναγεννήσας ἡμᾶς</td><td>anagennēsas hēmas</td><td>重生了我們的那一位</td><td>不定過去式分詞；新約只在 1:3、1:23</td></tr><tr><td>εἰς ἐλπίδα ζῶσαν</td><td>eis elpida zōsan</td><td>進入活的盼望</td><td>第一個 εἰς；章題</td></tr><tr><td>διʼ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν</td><td>di' anastaseōs Iēsou Christou ek nekrōn</td><td>藉著耶穌基督從死人中復活</td><td>盼望的管道：空墳墓</td></tr></table>","gram":"<p><strong>1:3--9 在 SBLGNT 是一個長句，到 1:9 才下句號。</strong>和合本為了好讀切成幾句，原文卻是一口氣唱完的讚美。句子骨架是這樣：</p><blockquote><p>主幹：Εὐλογητὸς ὁ θεὸς καὶ πατὴρ（Eulogētos ho theos kai patēr）……（沒有主要動詞，「當受頌讚的是神」）<br>　└ ὁ（ho）……ἀναγεννήσας ἡμᾶς（那重生了我們的）<br>　　　├ 源頭：κατὰ τὸ πολὺ αὐτοῦ ἔλεος（kata to poly autou eleos）<br>　　　├ 管道：διʼ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν（di' anastaseōs Iēsou Christou ek nekrōn）<br>　　　└ 三個 εἰς（eis）：εἰς ἐλπίδα ζῶσαν（1:3）→ εἰς κληρονομίαν（1:4）→ εἰς σωτηρίαν（1:5）<br>　└ ἐν ᾧ ἀγαλλιᾶσθε（1:6，喜樂從這裡往下展開到 1:9）</p></blockquote><p>同一個開頭 Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ（Eulogētos ho theos kai patēr tou kyriou hēmōn Iēsou Christou），逐字見於林後 1:3 與弗 1:3。保羅接下去講安慰、講屬靈的福氣，彼得接下去講重生。ἀναγεννήσας（anagennēsas） 是 ana-（再）加上「生」，全本新約只在彼得前書出現：這裡，以及 1:23 的完成式 ἀναγεγεννημένοι（anagegennēmenoi）。ζῶσαν（zōsan） 是現在分詞，「活著的」：這盼望有心跳。</p>","exp":"<p>〔背景〕約 20:3--10；約 21:15--19（約翰福音講義第 20、21 章）</p><p>「願頌讚歸與我們主耶穌基督的父神！他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望」（1:3）。這是全卷的起點，也是全卷地勢的第一座山峰。彼得寫給受苦的人，第一個動作不是安慰，是讚美。不是因為處境變好了，是因為有一件事已經發生，誰也改不了：耶穌從死裡復活了。</p><p>「活潑的盼望」原文就是「活的盼望」。世上的盼望大多是會死的：寄託在健康、在孩子、在退休金、在一個政權，它們都會老、會變、會落空。保羅說不信的人「沒有指望」（帖前 4:13），不是說他們沒有願望，是說他們的願望沒有一個活著的根。<strong>基督徒的盼望是活的，因為它的根是一位活著的人。</strong></p><p>這句話從彼得口中說出，格外有分量。本系列約翰福音講義第 20 章講過，那個早晨彼得跑到墳墓，看見細麻布還放在那裡；就在幾天前，他三次不認主，「他就出去痛哭」（太 26:75）。一個人親手把自己的盼望埋掉，是空墳墓讓它重新活過來；後來在加利利海邊，主又三次問他「你愛我嗎」（約 21:17）。所以彼得說「重生了我們」，「我們」裡面有他自己。焦點不在彼得的翻身，在那位「照自己的大憐憫」的神：重生的源頭不是我們的表現，是他的憐憫。</p><p>這也是 321 說的「焦點在耶穌」。一個在家族裡被孤立、在職場裡被冤枉的寄居者，最先要的不是一套應對技巧，是抬頭看見那座空墳墓。盼望不是情緒，不是正向思考，是一個已經發生的事實，在今天產生的方向。</p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς</p><p lang=\"grc\">τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.</p>","lit":"<p>進入不朽壞、不玷污、不凋謝的基業，是在諸天之中為你們被存留的，</p><p>就是你們這些在神的能力中藉著信被駐守、進入那已預備好要在末後的時候被揭開之救恩的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον</td><td>aphtharton kai amianton kai amaranton</td><td>不朽壞、不玷污、不凋謝</td><td>三個 a- 否定字押頭韻</td></tr><tr><td>τετηρημένην ἐν οὐρανοῖς</td><td>tetērēmenēn en ouranois</td><td>已被存留在天上</td><td>完成式被動分詞：存好了，一直存著</td></tr><tr><td>ἐν δυνάμει θεοῦ φρουρουμένους</td><td>en dynamei theou phrouroumenous</td><td>在神的能力裡被駐守的</td><td>軍事用語：城被駐軍守住</td></tr><tr><td>διὰ πίστεως</td><td>dia pisteōs</td><td>藉著信</td><td>信是管道，守城的是神的能力</td></tr><tr><td>ἑτοίμην ἀποκαλυφθῆναι</td><td>hetoimēn apokalyphthēnai</td><td>預備好要被揭開</td><td>救恩已經備妥，只等揭幕</td></tr></table>","gram":"<p><strong>1:4 的基業用三個 a- 開頭的形容詞描寫：ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον（aphtharton kai amianton kai amaranton）。</strong>三個字都以否定前綴起頭，讀起來押頭韻，像三道鎖：不會朽壞（φθορά（phthora） 的反面）、不會被玷污、不會凋謝。ἀμάραντον（amaranton） 本是不謝的花，5:4 長老要得的冠冕是同字根的 ἀμαράντινον（amarantinon）。</p><p>這一段有兩個「守」。τετηρημένην（tetērēmenēn） 是完成式被動分詞，基業「已經被存留」，而且一直存著；φρουρουμένους（phrouroumenous） 是現在式被動分詞，原是軍事用語，城被駐軍日夜看守（林後 11:32 用於大馬色城被把守）。<strong>基業在天上被看守，承受基業的人在地上被看守。</strong>守的力量是 ἐν δυνάμει θεοῦ（en dynamei theou），人這一方的是 διὰ πίστεως（dia pisteōs）：信不是城牆，是讓駐軍進城的那扇門。</p><p>1:5 的 εἰς σωτηρίαν（eis sōtērian） 是長句裡第三個 εἰς（eis）。救恩是 ἑτοίμην ἀποκαλυφθῆναι（hetoimēn apokalyphthēnai），已經預備好，只等「末世」揭開。和合本「必能得著」是把介系詞的方向譯出來。</p>","exp":"<p>「可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。」（1:4）舊約的基業是迦南地，是可以被敵人踐踏、被罪玷污、被乾旱弄枯的地。寄居的人在地上沒有基業：有人因為信主被分家，有人在家族的祠堂裡不再有位置。彼得說，你們的基業在別處，而且是三種「不能」都上鎖的那一種。</p><p>這是全卷第一次出現「能壞的與不能壞的」這個對照。接下來會一再回來：能壞的金子（1:7）、能壞的金銀（1:18）、能壞的種子（1:23）、像草上的花一樣的榮耀（1:24）。彼得不是說地上的東西不重要，是說它們都有保存期限；寄居的人要學會分辨，哪些東西值得放上一生。</p><p>「你們這因信蒙神能力保守的人，必能得著所預備、到末世要顯現的救恩。」（1:5）一個受苦的人最怕的，常常不是苦本身，而是「我撐不住了怎麼辦」。彼得的回答是：守城的不是你。你在城裡，神的能力在城外駐守；你要做的是信，不是自己扛起城牆。基業被存著，你也被守著，兩邊都在神手裡。</p><p>「一次得救，永遠得救嗎」是議題頁的題目，各宗派讀法不同，這裡一句帶過。經文本身的語氣很清楚：這一節是安慰，不是考卷。它寫給的是快撐不住的人，要他們知道自己被一位比自己強大的守住。321 說「讓耶穌作王」，在這裡的樣子，就是承認守城的是他。</p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,</p><p lang=\"grc\">ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ δόξαν καὶ τιμὴν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.</p>","lit":"<p>在這事上你們歡騰，雖然如今短暫地，若是必須，在各樣的試煉中被憂愁了，</p><p>好叫你們信心被驗過的部分，比那會毀壞、卻也藉著火被驗證的金子更貴重，在耶穌基督的顯現之中被發現歸於稱讚、榮耀和尊貴。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν ᾧ ἀγαλλιᾶσθε</td><td>en hō agalliasthe</td><td>在這事上你們歡騰</td><td>直說語氣或命令語氣兩讀；多數取直說</td></tr><tr><td>ὀλίγον ἄρτι</td><td>oligon arti</td><td>暫時、如今</td><td>5:10 ὀλίγον παθόντας 首尾呼應</td></tr><tr><td>εἰ δέον</td><td>ei deon</td><td>若是必須</td><td>不是每一種苦都必須，有一位在量</td></tr><tr><td>λυπηθέντες</td><td>lypēthentes</td><td>被憂愁了</td><td>不定過去式被動分詞：真的痛過</td></tr><tr><td>ἐν ποικίλοις πειρασμοῖς</td><td>en poikilois peirasmois</td><td>在多色的試煉裡</td><td>4:10 ποικίλης χάριτος 同字</td></tr><tr><td>τὸ δοκίμιον ὑμῶν τῆς πίστεως</td><td>to dokimion hymōn tēs pisteōs</td><td>你們信心被驗過的那部分</td><td>與雅 1:3 字字相同</td></tr><tr><td>πολυτιμότερον χρυσίου</td><td>polytimoteron chrysiou</td><td>比金子更貴重</td><td>比較級</td></tr><tr><td>διὰ πυρὸς δὲ δοκιμαζομένου</td><td>dia pyros de dokimazomenou</td><td>卻是經火試驗的</td><td>4:12 火煉的伏筆</td></tr></table>","gram":"<p><strong>ἐν ᾧ ἀγαλλιᾶσθε（en hō agalliasthe） 的 ἐν ᾧ（en hō） 指甚麼，有三種讀法：</strong>指前一節的「末世」（將來會歡騰）、指神（在他裡面歡騰）、指 1:3--5 整件事（因此歡騰）。和合本「因此」取第三種，本講義從之。ἀγαλλιᾶσθε（agalliasthe） 字形可作直說語氣也可作命令語氣；上下文是讚美，不是吩咐，多數取直說：你們正在歡騰。</p><p>緊接著是一個讓步的分詞片語：ὀλίγον ἄρτι εἰ δέον λυπηθέντες（oligon arti ei deon lypēthentes）。λυπηθέντες（lypēthentes） 是不定過去式被動分詞，「被憂愁擊中過」，不是表面的不開心。這個動詞在約 21:17 用在彼得身上：主第三次問他愛不愛，ἐλυπήθη ὁ Πέτρος（elypēthē ho Petros）。εἰ δέον（ei deon） 是「若是必須」：不是說每一種苦都必須，是說有一位在量。ὀλίγον（oligon） 與 5:10 的 ὀλίγον παθόντας（oligon pathontas） 是同一個字，全卷的苦難被兩個「暫時」框住。</p><blockquote><p>ποικίλοις（poikilois） 是「多色的、各式各樣的」。彼得在 4:10 用同一個字說 ποικίλης χάριτος（poikilēs charitos）：試煉有多少種顏色，恩典就有多少種顏色。1:7 的 τὸ δοκίμιον ὑμῶν τῆς πίστεως（to dokimion hymōn tēs pisteōs） 與雅 1:3 一字不差。句子在比較：金子 τοῦ ἀπολλυμένου（終究要毀壞），διὰ πυρὸς δὲ δοκιμαζομένου（卻也要經火驗過）；連會壞的金子都值得被火驗，何況不會壞的信心。結果是 εὑρεθῇ εἰς ἔπαινον καὶ δόξαν καὶ τιμὴν（heurethē eis epainon kai doxan kai timēn）：被「發現」是值得稱讚的。</p></blockquote>","exp":"<p>〔雅〕雅 1:2--3</p><p>「因此，你們是大有喜樂；但如今，在百般的試煉中暫時憂愁」（1:6）。這是本章地勢最低的一節，緊貼在最高的山峰後面。彼得沒有叫受苦的人假裝沒事。<strong>他在同一句裡放進「大有喜樂」與「暫時憂愁」，兩個都是真的。</strong>憂愁是被允許的：彼得自己在海邊被主三次追問時也憂愁過。</p><p>所以，憂鬱、焦慮、哭不出來的悲傷，都不是信心不夠的證據。一個信徒因為失業、喪親、病痛而憂愁，可以看醫生，可以接受心理諮商，也可以在小組裡說出來；這些和信靠神並不衝突，教會也不該催促一個還在流淚的人趕快笑出來。「大有喜樂」是一個方向，不是一張面具。彼得也沒有說他們憂愁是因為犯了罪：這裡是「百般的試煉」，是寄居者在不公平的處境裡碰到的苦，不是懲罰。</p><p>「暫時」是關鍵字。永恆的觀點不是把苦難變小，是把盼望變大。苦難有開始，也有結束；結束時說話的是神：「等你們暫受苦難之後，必要親自成全你們」（5:10）。</p><p>「叫你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴」（1:7）。雅各書用同一個片語，說試驗「就生忍耐」（雅 1:3），果子是品格；彼得說的果子是「寶貴」，是在主顯現時被神稱讚。火在這裡是煉金的爐，不是審判的火：到 4:12 彼得會說「有火煉的試驗臨到你們，不要以為奇怪」（4:12）。321 說「改變觀點」：從「為甚麼是我」轉成「這火正在煉出甚麼」。這不是叫人去找苦，是叫已經在火裡的人知道，火不會白燒。</p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">ὃν οὐκ ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,</p><p lang=\"grc\">κομιζόμενοι τὸ τέλος τῆς πίστεως ὑμῶν σωτηρίαν ψυχῶν.</p>","lit":"<p>你們沒有見過他，卻愛他；如今雖不看見他，卻信入他，就以說不出來、已得榮耀的喜樂歡騰，</p><p>正在領取你們信心的終點，就是生命的救恩。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὃν οὐκ ἰδόντες ἀγαπᾶτε</td><td>hon ouk idontes agapate</td><td>那位你們沒見過卻愛著的</td><td>不定過去式分詞，讓步</td></tr><tr><td>ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ</td><td>arti mē horōntes pisteuontes de</td><td>如今不見，卻信</td><td>現在式：一直看不見，一直信</td></tr><tr><td>χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ</td><td>chara aneklalētō kai dedoxasmenē</td><td>說不出、已得榮耀的喜樂</td><td>ἀνεκλαλήτῳ 新約只此一次</td></tr><tr><td>κομιζόμενοι τὸ τέλος τῆς πίστεως</td><td>komizomenoi to telos tēs pisteōs</td><td>正在領取信心的終點</td><td>現在式分詞：已經開始領</td></tr><tr><td>σωτηρίαν ψυχῶν</td><td>sōtērian psychōn</td><td>生命的救恩</td><td>ψυχή 指整個人</td></tr></table>","gram":"<p><strong>1:8 是兩個關係子句，都以「他」開頭：ὃν οὐκ ἰδόντες ἀγαπᾶτε（hon ouk idontes agapate），再接 εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ἀγαλλιᾶσθε（eis hon arti mē horōntes pisteuontes de agalliasthe）。</strong>前一句的 ἰδόντες（idontes） 是不定過去式，「從來沒有見過」；後一句的 ὁρῶντες（horōntes） 是現在式，「如今仍看不見」。愛與信都在看不見的情況下發生。</p><p>喜樂有兩個形容詞：ἀνεκλαλήτῳ（aneklalētō），新約只此一次，「說不出來的」；δεδοξασμένῃ（dedoxasmenē） 是完成式被動分詞，「已經被榮耀了的」。將來的榮耀已經滲進今天的喜樂裡。</p><p>1:9 的 κομιζόμενοι（komizomenoi） 是現在式分詞，「正在領取」：救恩的終點在將來，領取卻已經開始。τὸ τέλος τῆς πίστεως（to telos tēs pisteōs） 是信心的「終點、目的地」。σωτηρίαν ψυχῶν（sōtērian psychōn） 的 ψυχή（psychē） 在彼得前書指整個人的生命（3:20 方舟裡「八個人」原文就是八個 ψυχαί（psychai）），不是與身體分開的靈魂。</p>","exp":"<p>「你們雖然沒有見過他，卻是愛他」（1:8）。寫這句話的人見過他，與他同桌吃飯，看他在水面上走，也看他被捆綁帶走。收信的人一個也沒見過。彼得沒有因此把他們看低，反而為他們驚嘆。這使我們想起主對多馬說的：「那沒有看見就信的有福了。」（約 20:29）彼得那天也在屋裡。</p><p>這也使我們想起約 21:15--17。主在炭火旁三次問彼得「你愛我嗎」，彼得只能說「你知道我愛你」（約 21:17）。<strong>當年被追問「你愛我嗎」的那個人，如今寫信告訴一群沒見過主的人：你們卻是愛他。</strong>不是彼得的愛比較成熟了，是主把那個問題變成一份託付，彼得把它傳了下去。主問一個跌倒的人愛不愛他，後來這愛擴散到五個地區。</p><p>「卻因信他就有說不出來、滿有榮光的大喜樂」（1:8）。前一節剛說「暫時憂愁」，這裡又說「大喜樂」。兩者不是先後替換，是同時並存：在病房裡流淚的人，可以同時有一個說不出來的確信。說不出來，不是因為太空洞，是因為太滿。</p><p>「並且得著你們信心的果效，就是靈魂的救恩。」（1:9）「得著」是正在領取。寄居的人不必等到天上才開始得救；他們在被毀謗、被誤會的日子裡，已經在領取那份屬於他們的東西。321 說「焦點在耶穌」：這一節是最簡單的一句，沒見過，卻愛他。一個信仰若只剩下規矩與立場，卻沒有這份愛，就走偏了。</p>"},{"a":10,"z":12,"star":3,"grk":"<p lang=\"grc\">Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,</p><p lang=\"grc\">ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·</p><p lang=\"grc\">οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπʼ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.</p>","lit":"<p>論到這救恩，那些預言要臨到你們之恩典的先知們，曾經尋根究底地尋找，又徹底地查考，</p><p>查考在他們裡面的基督的靈，在預先證明那臨到基督的諸般苦難和這些以後的諸般榮耀時，是指著甚麼人或怎樣的時候。</p><p>向他們被啟示了：他們不是為自己，而是為你們服事這些事；這些事如今藉著那些靠著從天上被差來的聖靈傳福音給你們的人，被報告給你們了；這些事天使們渴望彎下腰去看。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐξεζήτησαν καὶ ἐξηραύνησαν</td><td>exezētēsan kai exēraunēsan</td><td>尋根究底地找、徹底地查</td><td>兩個 ἐκ- 複合動詞，加重語氣</td></tr><tr><td>εἰς τίνα ἢ ποῖον καιρὸν</td><td>eis tina ē poion kairon</td><td>指著誰（甚麼）或怎樣的時候</td><td>兩讀：「甚麼人」或「甚麼時候」</td></tr><tr><td>τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ</td><td>to en autois pneuma Christou</td><td>在他們裡面的基督的靈</td><td>基督在舊約先知裡已經說話</td></tr><tr><td>προμαρτυρόμενον</td><td>promartyromenon</td><td>預先作見證</td><td>新約只此一次</td></tr><tr><td>τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας</td><td>ta eis Christon pathēmata kai tas meta tauta doxas</td><td>臨到基督的苦難，與其後的榮耀</td><td>全卷的公式；兩個都是複數</td></tr><tr><td>διηκόνουν</td><td>diēkonoun</td><td>他們在服事</td><td>cu89t 註腳：「傳講：原文是服事」</td></tr><tr><td>παρακύψαι</td><td>parakypsai</td><td>彎下腰去看</td><td>約 20:5；雅 1:25 同字</td></tr></table>","gram":"<p><strong>1:10 用兩個押頭韻的複合動詞：ἐξεζήτησαν καὶ ἐξηραύνησαν（exezētēsan kai exēraunēsan）。</strong>兩個字都以 ἐκ（ek）- 開頭，「往外、徹底」：先知不是隨口預言，是翻來覆去地查。1:11 的 ἐραυνῶντες（eraunōntes） 再用一次同一個字根。他們查的是 εἰς τίνα ἢ ποῖον καιρὸν（eis tina ē poion kairon）：τίνα（tina） 可以讀成「甚麼人」（查是誰），也可以和 καιρὸν（kairon） 連讀成「甚麼時候」。和合本「是指著甚麼時候，並怎樣的時候」取後者；兩讀都通，意思都指向先知對應驗的渴望。</p><p>τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ（to en autois pneuma Christou） 是很大膽的說法：在舊約先知裡面說話的，是「基督的靈」。προμαρτυρόμενον（promartyromenon） 新約只此一次，「預先作證」。受詞是全卷的公式：τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας（ta eis Christon pathēmata kai tas meta tauta doxas）。兩個名詞都是複數，「苦難」與「榮耀」各有許多；μετὰ ταῦτα（meta tauta） 定下次序：先苦，後榮。</p><blockquote><p>1:12 的 οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν（ouch heautois hymin de diēkonoun），和合本作「傳講」，cu89t 註腳說「原文是服事」：先知在服事幾百年後的讀者。εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι（eis ha epithymousin angeloi parakypsai） 的 παρακύπτω（parakyptō） 是「彎下腰去看」；約 20:5 那個門徒在墳墓口 παρακύψας（parakypsas），雅 1:25 的人 παρακύψας（parakypsas） 在全備的律法上。πνεύματι ἁγίῳ ἀποσταλέντι ἀπʼ οὐρανοῦ（pneumati hagiō apostalenti ap' ouranou） 是不定過去式分詞，「從天上被差來的」，指向五旬節。</p></blockquote>","exp":"<p>〔背景〕太 16:21--23（馬太講義第 16 章）</p><p>「預先證明基督受苦難，後來得榮耀」（1:11）。這是全卷的公式。本系列馬太講義第 16 章講過：主第一次說他必須受苦，彼得拉著他說「主啊，萬不可如此！這事必不臨到你身上。」（太 16:22）當年要把苦難從主身上拿掉的人，現在把「受苦難，後來得榮耀」寫在全卷最前面。<strong>這是一個被改變的觀點，而改變它的，是復活的主親自開他的心竅。</strong>復活那天主說過：「基督這樣受害，又進入他的榮耀，豈不是應當的嗎？」（路 24:26）</p><p>這條公式後來會成為寄居者自己的路：4:13「你們是與基督一同受苦」（4:13），5:10 先「暫受苦難」，後得「永遠的榮耀」。彼得在第 1 章先把它放在基督身上，讓受苦的人知道：苦難不是故事的結尾，也不是神失手的證據，是一條主自己先走過的路。</p><p>先知查考，卻沒有看見應驗；他們「不是為自己，乃是為你們」（1:12）在服事。這給寄居的人一份尊嚴：你們手中的福音，是先知等不到、天使「也願意詳細察看」（1:12）的東西。天使彎下腰來看，像那個早晨彎腰往空墳墓裡看的門徒。被鄰舍看不起的這群人，手裡拿著天上都在凝視的寶貝。</p><p>這一段也是 321 八大步驟的前兩步：先知有「資訊」，查考了又查考；1:12「他們得了啟示」，資訊才成為啟示。321 說「聖靈是我的引導」：同一位靈，在先知裡預先作證，在五旬節從天上差來，現在藉傳福音的人把這些事報給寄居的人。讀經不是自己猜，是求那位在先知裡說話的靈，向我們開啟。</p>"},{"a":13,"z":13,"star":2,"grk":"<p lang=\"grc\">Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.</p>","lit":"<p>所以，束上你們心思的腰，完全清醒，你們要盼望那在耶穌基督的顯現中正被帶給你們的恩典。</p>","key":"<table><tr><th>原文</th><th
